  # v0.9.210 -- Pedon tab help texts (were English-only)
  "pedon.desc_seed": "Comece por um perfil de referência, pelo seu próprio CSV ou por uma planilha em branco."
  "pedon.help_fixture": "Um perfil de referência, de livro-texto, que você pode carregar e editar como ponto de partida."
  "pedon.help_wosis_country": "Nome do país como o WoSIS o escreve, em inglês, ex.: Argentina, Brazil. Deixe em branco para qualquer país."
  "pedon.help_wosis_permissive": "O WoSIS tem licença por perfil, e cerca de metade está sob CC BY-NC, que proíbe uso comercial. Ligado, só aparecem os perfis livres dessa restrição."
  "pedon.help_csv": "Uma linha por horizonte, com colunas de profundidade e de laboratório. Baixe o arquivo inicial para ver o formato esperado."
  "pedon.tip_load": "Carrega a fonte escolhida na tabela de horizontes editável abaixo."
  "pedon.desc_site": "Onde o perfil está e de que material se formou; usado nas estimativas regionais a priori."
  "pedon.help_site_id": "Um rótulo curto para o perfil. Dá nome aos seus downloads e aparece nos resultados."
  "pedon.help_lat": "Graus decimais, de -90 a 90. Opcional, mas habilita as estimativas a priori do SoilGrids e do clima."
  "pedon.help_lon": "Graus decimais, de -180 a 180. Negativo é oeste. Opcional, mas recomendado."
  "pedon.help_country": "Código ISO do país, com duas letras, ex.: BR para o Brasil. Ajuda nos padrões regionais."
  "pedon.help_pm": "A rocha ou o depósito de que o solo se formou, ex.: gnaisse, basalto, aluvião."
  "pedon.help_technic": "Artefatos, uma geomembrana construída ou material duro técnico levam o perfil a Technosols (WRB 2022). Escolha 'Nenhuma' para um solo comum, e a chave para de perguntar; 'Desconhecido' deixa o critério em aberto."
  "pedon.help_geomembrane": "Uma geomembrana construída que começa até 100 cm leva o perfil a Technosols."
  "pedon.help_geomembrane_depth": "Profundidade, em cm, em que a geomembrana começa. Usada só quando a resposta é Sim."
  "pedon.desc_build": "Monte o perfil para que as outras abas possam classificá-lo."
  "pedon.tip_build": "Confere a geometria dos horizontes e as coordenadas e monta o perfil usado por todas as outras abas."
  "pedon.desc_session": "Exporte o perfil (local + horizontes) para um arquivo JSON, ou reabra um para continuar exatamente de onde parou."
  "pedon.tip_save_session": "Salva os dados do local e a tabela de horizontes atuais num arquivo .json portátil."
  "pedon.help_open_session": "Carregue uma sessão .json salva antes; ela preenche todos os campos e remonta o perfil."
  "pedon.tip_download_csv": "Salva a tabela atual como CSV, para editar fora do app ou carregar de novo depois."
  "pedon.tip_add_row": "Acrescenta um horizonte abaixo, continuando a partir da maior profundidade."
  "pedon.help_table": "Clique em qualquer célula para editá-la. Profundidades em centímetros; deixe em branco um valor de laboratório que não foi medido."
  "pedon.tip_plot_attr": "Escolha qual atributo de laboratório plotar contra a profundidade."
  "pedon.no_horizons_in_file": "nenhum horizonte encontrado no arquivo"
  # v0.9.210 -- Classify tab help texts (were English-only)
  "classify.desc_run": "Escolha quais sistemas de classificação rodar no perfil atual e inicie a chave."
