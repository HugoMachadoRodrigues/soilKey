  "thanks.c_soiltaxonomy": "The vendored Keys to Soil Taxonomy and WRB 2022 criteria tables used to audit soilKey's own predicates."
  "thanks.c_munsellinterpol": "CIE-anchored Munsell <-> XYZ conversion, and identifying the D65->Illuminant C chromatic adaptation and correct roundHVC() usage in soilKey's spectra-to-colour path."
  "thanks.c_mpspline2": "Mass-preserving spline harmonisation of horizon data to standard depths."
  "thanks.l_ecosystem": "terra, sf, leaflet, shiny, bslib, DT, plotly, ellmer and the wider R ecosystem."
  "thanks.c_ecosystem": "Spatial analysis, the interactive map, the application framework, and optional vision-language extraction."
  "thanks.c_soilgrids": "Global soil-property and WRB class-probability priors sampled by the Map tab."
  "thanks.c_ossl": "Vis-NIR / MIR spectra with paired laboratory labels for the spectral gap-fill engine."
  "thanks.c_febr": "Brazilian profiles with Munsell colours used for benchmarking."
  "thanks.c_embrapa": "A national soil database and an independent SiBCS reference to cross-check soilKey against."
  "thanks.c_redape": "A curated set of ~96 hand-reviewed Brazilian soil profiles, shared as a gold-standard benchmark used to test and calibrate the classifiers."
  "thanks.l_glenn": "Glenn Davis (author of munsellinterpol)."
  "thanks.c_glenn": "Colorimetry corrections to the spectra-to-Munsell path (chromatic adaptation and rounding)."
  "thanks.l_cran": "CRAN and Uwe Ligges."
  "thanks.c_cran": "Package review and publication."
  # v0.9.210 -- Report tab (downloads in the body; PDF only where LaTeX exists)
  "report.desc_section": "Build a shareable report of the classification and download it."
  "report.help_title": "A heading printed at the top of the report -- use the site, profile, or project name."
  "report.default_title": "soilKey classification"
  "report.tip_html": "Build and download a self-contained HTML report: the WRB / SiBCS / USDA names, key trace, and evidence grade."
  "report.tip_pdf": "Build and download the same report as a PDF."
  "report.pdf_via_print": "For a PDF, open the HTML report and use its Print / Save as PDF button: it is laid out for printing."
  # v0.9.210 -- Spectra tab help texts (were English-only)
  "spectra.desc_attach": "Upload a Vis-NIR reflectance CSV and attach it to the current pedon."
  "spectra.help_csv": "CSV of reflectance: one row per horizon, columns are wavelengths (nm). Row order must match the pedon's horizons."
  "spectra.tip_attach": "Attach the uploaded spectra matrix to the pedon so it can be used for prediction."
  "spectra.tip_demo": "Attaches a bundled Vis-NIR demo spectrum (5 horizons -- matches the example Ferralsol)."
  "spectra.desc_preproc": "Treat the spectrum: absorbance, then Savitzky-Golay smoothing / derivative. It re-plots as you tick, and the sequence is saved for the report."
  "spectra.help_absorbance": "Convert reflectance R to absorbance A = log10(1/R) (auto-scales % to a 0-1 fraction)."
  "spectra.help_smooth": "Savitzky-Golay smoothing, applied before any derivative."
  "spectra.help_window": "Savitzky-Golay window (odd, >= poly + 2). Wider = smoother."
  "spectra.help_poly": "Savitzky-Golay polynomial order."
  # v0.9.210 -- Spectra gap-fill: off without a real OSSL library
  "spectra.desc_gapfill": "Predict missing horizon attributes from the attached spectra via OSSL."
  "spectra.gapfill_unavailable": "Not available here. Gap-filling from spectra needs a reference library from the Open Soil Spectral Library, and none is installed on this site; without one, the values it would write are placeholders, not predictions. In R, pass your own library to fill_from_spectra(ossl_library = ...). The treatment above still works."
  "spectra.help_method": "How predictions are made: memory-based learning, a local PLSR fit, or a pretrained OSSL model."
  "spectra.help_region": "OSSL subset used as reference. A region closer to your samples usually predicts better than global."
  "spectra.help_overwrite": "If ticked, spectral predictions replace measured values; otherwise only empty attributes are filled."
  "spectra.tip_fill": "Run the OSSL spectral engine and fill missing attributes; filled values are tagged predicted_spectra in the provenance ledger."
