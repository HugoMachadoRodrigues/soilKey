  "map.attr_soilgrids": "Soil classes: <a href=\"https://soilgrids.org\" target=\"_blank\" rel=\"noopener\">SoilGrids 2.0</a> &copy; ISRIC &ndash; World Soil Information, <a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY 4.0</a>"
  "map.attr_demo": "Soil classes: synthetic demo raster, not SoilGrids"
