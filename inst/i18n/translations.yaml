  "help.title": "Welcome to soilKey Pro"
  "help.intro": "Classify a soil profile under WRB 2022, SiBCS 5 and USDA Soil Taxonomy 13 -- the deterministic key is never delegated to a language model."
  "help.workflow": "Workflow:"
  "help.step_pedon": " -- build a profile from a fixture, a CSV, or by hand."
  "help.step_classify": " -- run all three systems with the full key trace."
