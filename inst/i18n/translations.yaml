  # v0.9.210 -- Pedon tab help texts (were English-only)
  "pedon.desc_seed": "Start from a reference profile, your own CSV, or a blank sheet."
  "pedon.help_fixture": "A curated, textbook profile you can load and edit as a starting point."
  "pedon.help_wosis_country": "Country name as WoSIS spells it, e.g. Argentina. Leave blank for any."
  "pedon.help_wosis_permissive": "WoSIS is licensed per profile and about half of it is CC BY-NC, which forbids commercial use. On, only profiles free of that restriction are listed."
  "pedon.help_csv": "One row per horizon, with depth and lab columns. Download the starter file to see the expected layout."
  "pedon.tip_load": "Load the chosen source into the editable horizon table below."
  "pedon.desc_site": "Where the profile sits and what it formed on — used for regional priors."
  "pedon.help_site_id": "A short label for this profile. It names your downloads and appears in the results."
  "pedon.help_lat": "Decimal degrees, from -90 to 90. Optional, but enables the SoilGrids and climate priors."
  "pedon.help_lon": "Decimal degrees, from -180 to 180. Negative is west. Optional but recommended."
  "pedon.help_country": "Two-letter ISO country code, e.g. BR for Brazil. Helps regional defaults."
  "pedon.help_pm": "The rock or deposit the soil formed on, e.g. gneiss, basalt, alluvium."
  "pedon.help_technic": "Artefacts, a constructed geomembrane or technic hard material key a profile to Technosols (WRB 2022). Choose 'None' for an ordinary soil so the key stops asking; 'Unknown' leaves the criteria open."
  "pedon.help_geomembrane": "A constructed geomembrane starting within 100 cm keys the profile to Technosols."
  "pedon.help_geomembrane_depth": "Depth in cm at which the geomembrane starts. Used only when the answer is Yes."
  "pedon.desc_build": "Assemble the profile so the other tabs can classify it."
  "pedon.tip_build": "Check the horizon geometry and coordinates, then build the pedon used by every other tab."
  "pedon.desc_session": "Export the profile (site + horizons) to a JSON file, or reopen one to pick up exactly where you left off."
  "pedon.tip_save_session": "Save the current site details and horizon table as a portable .json file."
  "pedon.help_open_session": "Load a .json session saved earlier; it repopulates every field and rebuilds the pedon."
  "pedon.tip_download_csv": "Save the current table as a CSV to edit offline or re-upload later."
  "pedon.tip_add_row": "Append a new horizon below, continuing from the deepest depth."
  "pedon.help_table": "Click any cell to edit it. Depths are in centimetres; leave a lab value blank if unmeasured."
  "pedon.tip_plot_attr": "Choose which lab attribute to plot against depth."
  "pedon.no_horizons_in_file": "no horizons found in file"
