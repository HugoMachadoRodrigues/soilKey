  "photo.tip_extract_munsell": "Lê a cor Munsell de cada horizonte na foto e a incorpora ao perfil, com uma confiança para cada valor."
  "photo.desc_site": "Lê os metadados do local (coordenadas, altitude, drenagem) numa ficha de campo digitalizada."
  "photo.help_sheet": "Um JPG ou PNG da ficha de descrição de campo; letra legível melhora a extração."
  "photo.tip_extract_site": "Lê coordenadas, altitude e drenagem na ficha de campo e as incorpora aos dados do local do perfil."
  # v0.9.210 -- Settings tab help texts (were English-only)
  "settings.help_engine_card": "Estas opções definem como cada classificador lê os dados dos horizontes. Valem para todas as abas desta sessão."
  "settings.desc_engine": "Qual conjunto de limiares numéricos decide se um horizonte atende a cada critério diagnóstico."
  "settings.help_engine": "soilKey usa os limiares próprios do pacote; aqp recorre ao pacote aqp onde ele tem uma regra equivalente."
  "settings.desc_strict": "Até que nível a classificação desce abaixo do grupo de referência ou da ordem."
  "settings.help_strict": "Ligado, uma classe só é atribuída se todos os diagnósticos exigidos forem atendidos; perfis limítrofes ficam sem classe, em vez de forçados."
  "settings.help_specifiers": "Acrescenta ao resultado os qualificadores principais e suplementares do WRB (as palavras antes e depois do grupo de referência)."
  "settings.help_missing_card": "Controla como as medições faltantes são tratadas e quanto detalhe taxonômico os classificadores informam."
  "settings.desc_on_missing": "O que o classificador faz quando falta a um horizonte um valor de que uma regra precisa."
  "settings.help_on_missing": "Avisar segue em frente, mas aponta as lacunas; Silencioso pula as regras afetadas sem avisar; Erro para, para que nada seja adivinhado."
  "settings.desc_family": "Se as categorias mais baixas e detalhadas de cada taxonomia devem ser resolvidas."
  "settings.help_familia": "Também deriva o nível de família do SiBCS (textura, mineralogia e outros atributos de família) abaixo do subgrupo."
  "settings.help_family": "Também deriva o nível de família do USDA Soil Taxonomy (classes de granulometria, mineralogia e temperatura) abaixo do subgrupo."
  # v0.9.210 -- Uncertainty tab help texts (were English-only)
  "uncert.desc_source": "Analise o perfil ativo, ou cada ponto de um grupo carregado."
  "uncert.desc_analysis": "Escolha em qual taxonomia e em qual nível a estabilidade da classe é medida."
  "uncert.help_system": "Taxonomia em que o perfil é reclassificado a cada rodada de Monte Carlo."
  "uncert.help_level": "Compare as rodadas pelo grupo amplo ou pelo nome completo, com todos os qualificadores."
  "uncert.desc_mc": "Como as entradas são perturbadas e quantas vezes a chave é rodada de novo."
  "uncert.help_n": "Número de rodadas perturbadas. Mais rodadas dão uma distribuição mais suave e confiável, mas demoram mais."
  "uncert.help_sensitivity": "Também ordena quais entradas causam instabilidade, silenciando um atributo de cada vez."
  "uncert.desc_run": "Perturba as entradas dentro da incerteza de medição e roda a chave de novo."
  "uncert.tip_run": "Roda a análise de incerteza de Monte Carlo e informa quão estável é a classificação."
