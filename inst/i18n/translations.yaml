  "spectra.help_window": "Janela de Savitzky-Golay (ímpar, >= ordem + 2). Mais larga = mais suave."
  "spectra.help_poly": "Ordem do polinômio de Savitzky-Golay."
  # v0.9.210 -- Spectra gap-fill: off without a real OSSL library
  "spectra.desc_gapfill": "Estima atributos faltantes dos horizontes a partir dos espectros anexados, via OSSL."
  "spectra.gapfill_unavailable": "Indisponível aqui. Preencher a partir de espectros exige uma biblioteca de referência da Open Soil Spectral Library, e nenhuma está instalada neste site; sem ela, os valores gravados seriam de enfeite, não predições. No R, passe sua própria biblioteca para fill_from_spectra(ossl_library = ...). O tratamento acima continua funcionando."
  "spectra.help_method": "Como as predições são feitas: aprendizado baseado em memória, um ajuste PLSR local ou um modelo OSSL pré-treinado."
  "spectra.help_region": "Subconjunto do OSSL usado como referência. Uma região mais próxima das suas amostras costuma prever melhor que o global."
  "spectra.help_overwrite": "Se marcado, as predições espectrais substituem valores medidos; caso contrário, só os atributos vazios são preenchidos."
  "spectra.tip_fill": "Roda o mecanismo espectral OSSL e preenche atributos faltantes; os valores preenchidos ficam marcados como predicted_spectra no registro de proveniência."
