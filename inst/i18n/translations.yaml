  "mgrid.tip_predict": "Estima a classe de solo de cada célula da grade e a desenha como raster."
  "mgrid.tip_export": "Baixa a grade de classes estimadas como GeoTIFF categórico."
  # v0.9.210 -- Photo tab help texts (were English-only)
  "photo.desc_munsell": "Lê a cor Munsell de cada horizonte numa foto do perfil; só o registro do perfil é preenchido, nunca a chave."
