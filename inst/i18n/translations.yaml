  "thanks.c_soiltaxonomy": "As tabelas de critérios do Keys to Soil Taxonomy e do WRB 2022, incorporadas e usadas para auditar os predicados do próprio soilKey."
  "thanks.c_munsellinterpol": "Conversão Munsell <-> XYZ ancorada na CIE, e a identificação da adaptação cromática D65->Iluminante C e do uso correto de roundHVC() no caminho de espectro para cor do soilKey."
  "thanks.c_mpspline2": "Harmonização por spline que conserva a massa dos dados de horizontes para profundidades padrão."
  "thanks.l_ecosystem": "terra, sf, leaflet, shiny, bslib, DT, plotly, ellmer e o ecossistema R como um todo."
  "thanks.c_ecosystem": "Análise espacial, o mapa interativo, a base do aplicativo e a extração opcional por modelo de visão e linguagem."
  "thanks.c_soilgrids": "Propriedades do solo e probabilidades de classes WRB globais, amostradas pela aba Mapa."
  "thanks.c_ossl": "Espectros Vis-NIR / MIR com valores de laboratório pareados, para o mecanismo de preenchimento espectral."
  "thanks.c_febr": "Perfis brasileiros com cores Munsell usados na avaliação de desempenho."
  "thanks.c_embrapa": "Um banco nacional de dados de solos e uma referência independente do SiBCS para conferir o soilKey."
  "thanks.c_redape": "Um conjunto curado de ~96 perfis de solos brasileiros revisados um a um, compartilhado como referência padrão-ouro para testar e calibrar os classificadores."
  "thanks.l_glenn": "Glenn Davis (autor do munsellinterpol)."
  "thanks.c_glenn": "Correções de colorimetria no caminho de espectro para Munsell (adaptação cromática e arredondamento)."
  "thanks.l_cran": "O CRAN e Uwe Ligges."
  "thanks.c_cran": "Revisão e publicação do pacote."
