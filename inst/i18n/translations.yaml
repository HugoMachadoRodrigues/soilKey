  # v0.9.210 -- Spectra tab help texts (were English-only)
  "spectra.desc_attach": "Envie um CSV de reflectância Vis-NIR e anexe-o ao perfil atual."
  "spectra.help_csv": "CSV de reflectância: uma linha por horizonte, colunas são comprimentos de onda (nm). A ordem das linhas deve seguir a dos horizontes do perfil."
