# Key to the great groups of the Organosols, ASC 3rd ed. (online version with errata).
# One list for all the suborders, repeated here; the monosulfidic, hypersulfidic and hyposulfidic groups replace Sulfuric or Sulfidic where the evidence is available; see R/diagnostics-asc-great-groups-special.R and
# inst/rules/asc3/readings.yaml.

great_groups:
  "OR-BW":
    - code: "IF"
      name: Folic Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: folic}
      notes: "More or less freely drained, never saturated for more than several days unless rain is falling, with organic materials as in Definition (ii) of the Organosols."

    - code: "IW"
      name: Monosulfidic-Sulfuric Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: monosulfidic_sulfuric}
      notes: "Monosulfidic material and sulfuric material (at least 15 cm thick) within the upper 1.5 m (replaces Sulfuric where the evidence is available)."

    - code: "EV"
      name: Sulfuric Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: sulfuric}
      notes: "Sulfuric material (at least 15 cm thick) within the upper 1.5 m."

    - code: "IX"
      name: Monohypersulfidic Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: monohypersulfidic}
      notes: "Monosulfidic and hypersulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "IZ"
      name: Hypersulfidic Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: hypersulfidic}
      notes: "Other soils with hypersulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "JA"
      name: Monohyposulfidic Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: monohyposulfidic}
      notes: "Monosulfidic and hyposulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "JC"
      name: Hyposulfidic Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: hyposulfidic}
      notes: "Other soils with hyposulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "EU"
      name: Sulfidic Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: sulfidic}
      notes: "Sulfidic materials within the upper 1.5 m."

    - code: "BC"
      name: Calcareous Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: calcareous}
      notes: "The major part of the organic materials is calcareous."

    - code: "AR"
      name: Basic Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: basic}
      notes: "The major part of the organic materials is not calcareous but is not strongly acid."

    - code: "AI"
      name: Acidic Fibric Organosol
      tests:
        all_of:
          - organosol_gg_asc: {kind: acidic}
      notes: "The major part of the organic materials is strongly acid."

