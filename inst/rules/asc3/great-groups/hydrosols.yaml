# Key to the great groups of the Hydrosols, ASC 3rd ed. (online version with errata).
# One list for the Subtidal, Intertidal and Subaqueous suborders (read as applying to all three, as decided), one for the Supratidal,
# one for the Hypersalic, and one for the Extratidal, Salic, Redoxic and Oxyaquic; the monosulfidic, hypersulfidic and hyposulfidic
# groups replace Sulfuric or Sulfidic where the evidence is available.
# See R/diagnostics-asc-great-groups-rest.R and inst/rules/asc3/readings.yaml.

great_groups:
  "HY-IU":
    - code: "IW"
      name: Monosulfidic-Sulfuric Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: monosulfidic_sulfuric}
      notes: "Monosulfidic material and sulfuric material (at least 0.15 m) within the upper 1.5 m (replaces Sulfuric where the evidence is available)."

    - code: "EV"
      name: Sulfuric Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: sulfuric}
      notes: "Sulfuric material at least 0.15 m thick within the upper 1.5 m."

    - code: "IX"
      name: Monohypersulfidic Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: monohypersulfidic}
      notes: "Monosulfidic and hypersulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "IY"
      name: Histic-Hypersulfidic Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: histic_hypersulfidic}
      notes: "Organic materials dominating the upper 0.5 m and hypersulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "IZ"
      name: Hypersulfidic Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: hypersulfidic}
      notes: "Other soils with hypersulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "JA"
      name: Monohyposulfidic Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: monohyposulfidic}
      notes: "Monosulfidic and hyposulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "JB"
      name: Histic-Hyposulfidic Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: histic_hyposulfidic}
      notes: "Other soils with organic materials dominating the upper 0.5 m and hyposulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "JC"
      name: Hyposulfidic Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: hyposulfidic}
      notes: "Other soils with hyposulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "EU"
      name: Sulfidic Subtidal Hydrosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: sulfidic}
      notes: "Sulfidic materials within the upper 1.5 m."

    - code: "CF"
      name: Histic Subtidal Hydrosol
      tests:
        all_of:
          - hydrosol_gg_asc: {kind: histic}
      notes: "Dominated by organic materials to a depth of 0.5 m."

    - code: "FW"
      name: Faunic Subtidal Hydrosol
      tests:
        all_of:
          - hydrosol_gg_asc: {kind: faunic}
      notes: "Dominated by other organic-rich (non-vegetative) materials such as faunal debris to a depth of 0.5 m."

    - code: "FY"
      name: Epicalcareous Subtidal Hydrosol
      tests:
        all_of:
          - hydrosol_gg_asc: {kind: epicalcareous}
      notes: "Dominantly calcareous to a depth of 0.5 m."

    - code: "AQ"
      name: Argillaceous Subtidal Hydrosol
      tests:
        all_of:
          - hydrosol_gg_asc: {kind: argillaceous}
      notes: "Dominantly clay-sized to a depth of 0.5 m."

    - code: "FX"
      name: Lutaceous Subtidal Hydrosol
      tests:
        all_of:
          - hydrosol_gg_asc: {kind: lutaceous}
      notes: "Dominantly silt-sized to a depth of 0.5 m."

    - code: "BV"
      name: Arenaceous Subtidal Hydrosol
