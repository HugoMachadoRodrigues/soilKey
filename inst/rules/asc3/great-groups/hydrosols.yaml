      notes: "Sulfidic materials within the upper 1.5 m."

    - code: "EA"
      name: Petroferric Extratidal Hydrosol
      tests:
        all_of:
          - pan_great_group_asc: {kind: petroferric, where: profile}
      notes: "A petroferric horizon within the soil profile."

    - code: "CB"
      name: Calcarosolic Extratidal Hydrosol
      tests:
        all_of:
          - hydrosol_gg_asc: {kind: calcarosolic}
      notes: "Calcareous throughout, or below the A1 or Ap or from 0.2 m, and no clear or abrupt textural B horizon."

    - code: "CX"
      name: Kurosolic Extratidal Hydrosol
      tests:
        all_of:
          - kurosol_asc: {}
      notes: "A clear or abrupt textural B horizon, the major part of the upper 0.2 m of the B2 strongly acid."

    - code: "EQ"
      name: Sodosolic Extratidal Hydrosol
      tests:
        all_of:
          - hydrosol_gg_asc: {kind: sodosolic}
      notes: "A clear or abrupt textural B horizon, sodic and not strongly acid in the major part of the upper 0.2 m of the B2."

    - code: "BG"
      name: Chromosolic Extratidal Hydrosol
      tests:
        all_of:
          - hydrosol_gg_asc: {kind: chromosolic}
      notes: "Other soils with a clear or abrupt textural B horizon, not strongly acid in the major part of the upper 0.2 m of the B2."

    - code: "FQ"
      name: Dermosolic Extratidal Hydrosol
      tests:
        all_of:
          - dermosol_asc: {}
      notes: "Structured B2 horizons; apart from wetness, the requirements for Dermosols."

    - code: "FR"
      name: Kandosolic Extratidal Hydrosol
      tests:
        all_of:
          - kandosol_asc: {}
      notes: "Other soils with B2 horizons; apart from wetness, the requirements for Kandosols."

    - code: "JM"
      name: Arenosolic Extratidal Hydrosol
      tests:
        all_of:
          - arenosol_asc: {}
      notes: "Apart from wetness, the requirements for Arenosols."

    - code: "GT"
      name: Tenosolic Extratidal Hydrosol
      tests:
        all_of:
          - none_of:
              - rudosol_asc: {}
      notes: "Apart from wetness, the requirements for Tenosols (the other soils of the order key, after the Rudosols)."

    - code: "GR"
      name: Rudosolic Extratidal Hydrosol
      tests:
        all_of:
          - rudosol_asc: {}
      notes: "Apart from wetness, the requirements for Rudosols."

