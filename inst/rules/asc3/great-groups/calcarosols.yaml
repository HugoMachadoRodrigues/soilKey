# Key to the great groups of the Calcarosols, ASC 3rd ed. (online version with errata).
# One list for the Calcarosols other than the Hypergypsic (not subdivided), Rendic for the Hypercalcic only; see R/diagnostics-asc-great-groups-special.R and
# inst/rules/asc3/readings.yaml.

great_groups:
  "CA-JT":
    - code: "BJ"
      name: Duric Carbonatic Calcarosol
      tests:
        all_of:
          - calcarosol_gg_asc: {kind: duric}
      notes: "Directly overlying a red-brown hardpan."

    - code: "DZ"
      name: Petrocalcic Carbonatic Calcarosol
      tests:
        all_of:
          - calcarosol_gg_asc: {kind: petrocalcic}
      notes: "Directly overlying a calcrete pan."

    - code: "AP"
      name: Argic Carbonatic Calcarosol
      tests:
        all_of:
          - calcarosol_gg_asc: {kind: argic}
      notes: "An argic horizon within the B horizon."

    - code: "DY"
      name: Pedal Carbonatic Calcarosol
      tests:
        all_of:
          - calcarosol_gg_asc: {kind: pedal}
      notes: "The major part of the B horizon has a grade of structure stronger than weak."

    - code: "CZ"
      name: Lithic Carbonatic Calcarosol
      tests:
        all_of:
          - calcarosol_gg_asc: {kind: lithic}
      notes: "Directly overlying hard rock."

    - code: "DU"
      name: Paralithic Carbonatic Calcarosol
      tests:
        all_of:
          - calcarosol_gg_asc: {kind: paralithic}
      notes: "Directly overlying partially weathered or decomposed rock or saprolite."

    - code: "DD"
      name: Marly Carbonatic Calcarosol
      tests:
        all_of:
          - calcarosol_gg_asc: {kind: marly}
      notes: "Directly overlying marl."

    - code: "GF"
      name: Regolithic Carbonatic Calcarosol
      tests:
        all_of:
          - calcarosol_gg_asc: {kind: regolithic}
      notes: "Other soils directly overlying unconsolidated mineral materials."

  "CA-CV":
