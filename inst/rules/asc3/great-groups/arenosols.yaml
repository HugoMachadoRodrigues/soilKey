# Key to the great groups of the Arenosols, ASC 3rd ed. (online version with errata).
# No great groups for the Hypergypsic and Stratic suborders; the Chernic suborder takes the list of the Bleached and coloured
# ones; Epibasic and Hypervescent only for the Calsilic suborder (Comment); hard layers count only below 1.0 m.
# See R/diagnostics-asc-great-groups-rest.R and inst/rules/asc3/readings.yaml.

great_groups:
  "RE-CS":
    - code: "IW"
      name: Monosulfidic-Sulfuric Hypersalic Arenosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: monosulfidic_sulfuric}
      notes: "Monosulfidic material and sulfuric material (at least 0.15 m) within the upper 1.5 m (replaces Sulfuric where the evidence is available)."

    - code: "EV"
      name: Sulfuric Hypersalic Arenosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: sulfuric}
      notes: "Sulfuric material at least 0.15 m thick within the upper 1.5 m."

    - code: "IX"
      name: Monohypersulfidic Hypersalic Arenosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: monohypersulfidic}
      notes: "Monosulfidic and hypersulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "IZ"
      name: Hypersulfidic Hypersalic Arenosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: hypersulfidic}
      notes: "Other soils with hypersulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "JA"
      name: Monohyposulfidic Hypersalic Arenosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: monohyposulfidic}
      notes: "Monosulfidic and hyposulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "JC"
      name: Hyposulfidic Hypersalic Arenosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: hyposulfidic}
      notes: "Other soils with hyposulfidic material within the upper 1.5 m (replaces Sulfidic where the evidence is available)."

    - code: "EU"
      name: Sulfidic Hypersalic Arenosol
      tests:
        all_of:
          - acid_sulfate_gg_asc: {kind: sulfidic}
      notes: "Sulfidic materials within the upper 1.5 m."

    - code: "BZ"
      name: Gypsic Hypersalic Arenosol
      tests:
        all_of:
          - gypsic_horizon_asc: {within: 100}
      notes: "A gypsic horizon within the upper 1.0 m."

    - code: "CC"
      name: Halic Hypersalic Arenosol
      tests:
        all_of:
          - halite_asc: {kind: halic}
      notes: "The major part of the upper 0.5 m of materials dominated (more than 50 %) by halite crystals."

    - code: "JK"
      name: Subhalic Hypersalic Arenosol
      tests:
        all_of:
          - halite_asc: {kind: subhalic}
      notes: "The major part of the upper 0.5 m of materials with less than 50 % halite crystals."

  "RE-BE":
    - code: "FK"
      name: Ferric-Duric Chernic Arenosol
      tests:
        all_of:
          - nodular_horizon_asc: {kind: ferric, where: profile}
          - substrate_gg_asc: {kind: duric, below_cm: 100}
      notes: "A ferric horizon, and overlies a red-brown hardpan (below 1.0 m)."

    - code: "BJ"
      name: Duric Chernic Arenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: duric, below_cm: 100}
      notes: "Other soils that overlie a red-brown hardpan (below 1.0 m)."

    - code: "GE"
      name: Ferric-Petroferric Chernic Arenosol
      tests:
        all_of:
          - nodular_horizon_asc: {kind: ferric, where: profile}
          - substrate_gg_asc: {kind: petroferric, below_cm: 100}
      notes: "A ferric horizon, and overlies ferricrete, a petroferric or a petroreticulate horizon (below 1.0 m)."

    - code: "IS"
      name: Ferric-Reticulate Chernic Arenosol
      tests:
        all_of:
          - nodular_horizon_asc: {kind: ferric, where: profile}
          - substrate_gg_asc: {kind: reticulate, below_cm: 100}
      notes: "A ferric horizon, and overlies a reticulate horizon (below 1.0 m)."

    - code: "EA"
      name: Petroferric Chernic Arenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: petroferric, below_cm: 100}
      notes: "Other soils that overlie ferricrete, a petroferric or a petroreticulate horizon (below 1.0 m)."

    - code: "EF"
      name: Reticulate Chernic Arenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: reticulate, below_cm: 100}
      notes: "Overlies a reticulate horizon (below 1.0 m)."

    - code: "EM"
      name: Silpanic Chernic Arenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: silpanic, below_cm: 100}
      notes: "Overlies a siliceous pan (below 1.0 m)."

    - code: "BU"
      name: Ferric Chernic Arenosol
      tests:
        all_of:
          - nodular_horizon_asc: {kind: ferric, where: profile}
      notes: "Other soils with a ferric horizon."

    - code: "AS"
      name: Bauxitic Chernic Arenosol
      tests:
        all_of:
          - nodular_horizon_asc: {kind: bauxitic, where: profile}
      notes: "A bauxitic horizon."

    - code: "DC"
      name: Manganic Chernic Arenosol
      tests:
        all_of:
          - nodular_horizon_asc: {kind: manganic, where: profile}
      notes: "A manganic horizon."

    - code: "AK"
      name: Andic Chernic Arenosol
      tests:
        all_of:
          - andic_great_group_asc: {}
      notes: "Andic properties, formed in basaltic tephric materials."

    - code: "HF"
      name: Tephric Chernic Arenosol
      tests:
        all_of:
          - tephric_asc: {}
      notes: "Formed in tephric materials."

    - code: "AP"
      name: Argic Chernic Arenosol
      tests:
        all_of:
          - argic_horizon_asc: {where: profile}
      notes: "An argic horizon."

    - code: "JQ"
      name: Gritty Chernic Arenosol
      tests:
        all_of:
          - gritty_asc: {}
      notes: "The major part of the upper 1.0 m with a distinct gritty feel."

    - code: "BZ"
      name: Gypsic Chernic Arenosol
      tests:
        all_of:
          - gypsic_horizon_asc: {within: 100}
      notes: "A gypsic horizon in the upper 1.0 m."

    - code: "JR"
      name: Gravic Chernic Arenosol
      tests:
        all_of:
          - gravic_asc: {}
      notes: "The major part of the upper 1.5 m with more than 3 % visible heavy or opaque minerals."

    - code: "CV"
      name: Hypocalcic Chernic Arenosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: hypocalcic}
      notes: "Fine-earth carbonate only as a slight to moderate effervescence, and/or less than 2 %, and less than 20 % hard carbonate."

    - code: "DA"
      name: Lithocalcic Chernic Arenosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: lithocalcic}
      notes: "A calcareous horizon with more than 50 % hard carbonate."

    - code: "FB"
      name: Supracalcic Chernic Arenosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: supracalcic}
      notes: "A calcareous horizon with 20-50 % hard carbonate."

    - code: "CQ"
      name: Hypercalcic Chernic Arenosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: hypercalcic}
      notes: "A calcareous horizon with more than 20 % fine-earth carbonate and 0-20 % hard carbonate."

    - code: "BD"
      name: Calcic Chernic Arenosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: calcic}
      notes: "Other soils with a calcareous horizon containing fine-earth carbonate."

    - code: "DZ"
      name: Petrocalcic Chernic Arenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: petrocalcic, below_cm: 100}
      notes: "Overlies a hard calcrete pan (below 1.0 m)."

    - code: "IA"
      name: Inceptic Chernic Arenosol
      tests:
        all_of:
          - inceptic_asc: {below_cm: 100}
      notes: "A transitional C/B horizon in fissures of the parent rock or saprolite (below 1.0 m)."

    - code: "CZ"
      name: Lithic Chernic Arenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: lithic, below_cm: 100}
      notes: "Overlies hard rock (below 1.0 m)."

    - code: "DU"
      name: Paralithic Chernic Arenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: paralithic, below_cm: 100}
      notes: "Overlies partially weathered or decomposed rock or saprolite (below 1.0 m)."

    - code: "DD"
      name: Marly Chernic Arenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: marly}
      notes: "Overlies marl."

    - code: "JP"
      name: Kandic Chernic Arenosol
      tests:
        all_of:
          - sand_texture_gg_asc: {kind: kandic}
      notes: "A layer other than the surface horizon with a light sandy loam texture (about 10-15 % clay) beginning within the upper 1.0 m."

    - code: "JL"
      name: Tenic Chernic Arenosol
      tests:
        all_of:
          - sand_texture_gg_asc: {kind: tenic}
      notes: "A layer other than the surface horizon with a clayey sand or loamy sand texture (about 5-10 % clay) beginning within the upper 1.0 m."

    - code: "FH"
      name: Palic Chernic Arenosol
      tests:
        all_of:
          - sand_texture_gg_asc: {kind: palic}
      notes: "Other soils with a sand texture (less than 5 % clay) below the surface horizon throughout at least the upper 1.0 m."

