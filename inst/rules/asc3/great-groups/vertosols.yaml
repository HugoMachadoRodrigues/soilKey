# Key to the great groups of the Vertosols, ASC 3rd ed. (online version with errata).
# The order page gives one list for all the suborders, repeated here; see R/diagnostics-asc-great-groups-special.R and
# inst/rules/asc3/readings.yaml.

great_groups:
  "VE-AM":
    - code: "EI"
      name: Self-mulching Aquic Vertosol
      tests:
        all_of:
          - vertosol_surface_asc: {kind: self_mulching}
      notes: "A moderately to strongly self-mulching surface."

    - code: "GS"
      name: Epipedal Aquic Vertosol
      tests:
        all_of:
          - vertosol_surface_asc: {kind: epipedal}
      notes: "A pedal (stronger than weak, blocky or polyhedral) A horizon, not or only weakly self-mulching, and no surface crusty horizon."

    - code: "BH"
      name: Crusty Aquic Vertosol
      tests:
        all_of:
          - vertosol_surface_asc: {kind: crusty}
      notes: "A massive or weakly structured surface crusty horizon 30 mm or less thick over pedal clay that is not self-mulching."

    - code: "DF"
      name: Massive Aquic Vertosol
      tests:
        all_of:
          - vertosol_surface_asc: {kind: massive}
      notes: "A massive or weak blocky A horizon, and no surface crusty horizon."

    - code: "DW"
      name: Peaty Aquic Vertosol
      tests:
        all_of:
          - vertosol_surface_asc: {kind: peaty}
      notes: "A surface peaty horizon."

