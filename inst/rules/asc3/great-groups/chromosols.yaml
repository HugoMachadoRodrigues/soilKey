# Key to the great groups of the Chromosols, ASC 3rd ed. (online version with errata).
# The order page gives one list for all the colour suborders, repeated here; see
# R/diagnostics-asc-great-groups-b.R and inst/rules/asc3/readings.yaml.

great_groups:
  "CH-AA":
    - code: "BJ"
      name: Duric Red Chromosol
      tests:
        all_of:
          - pan_great_group_asc: {kind: duric, where: b}
      notes: "A red-brown hardpan within or directly underlying the B horizon."

    - code: "EA"
      name: Petroferric Red Chromosol
      tests:
        all_of:
          - pan_great_group_asc: {kind: petroferric, where: solum}
      notes: "A petroferric horizon within the solum."

    - code: "DZ"
      name: Petrocalcic Red Chromosol
      tests:
        all_of:
          - petrocalcic_asc: {}
      notes: "A B horizon that is not calcareous and directly overlies a calcrete pan."

    - code: "BK"
      name: Pedaric Red Chromosol
      tests:
        all_of:
          - pedaric_asc: {window: upper_b2t}
      notes: "Strong blocky or polyhedral upper B2t whose peds hold together very weakly (a spade enters very easily when dry)."

    - code: "ET"
      name: Subplastic Red Chromosol
      tests:
        all_of:
          - subplastic_asc: {window: b2t}
      notes: "The major part of the B2t strongly subplastic."

    - code: "DB"
      name: Magnesic Red Chromosol
      tests:
        all_of:
          - magnesic_asc: {window: b2t}
      notes: "Exchangeable Ca/Mg below 0.1 in the major part of the B2t."

    - code: "AF"
      name: Dystrophic Red Chromosol
      tests:
        all_of:
          - base_status_asc: {class: dystrophic, window: b2t}
      notes: "The major part of the B2t is dystrophic (base status below 5 cmol(+)/kg clay)."

    - code: "AG"
      name: Mesotrophic Red Chromosol
      tests:
        all_of:
          - base_status_asc: {class: mesotrophic, window: b2t}
      notes: "The major part of the B2t is mesotrophic (5-15 cmol(+)/kg clay)."

    - code: "AH"
      name: Eutrophic Red Chromosol
      tests:
        all_of:
          - base_status_asc: {class: eutrophic, window: b2t}
      notes: "The major part of the B2t is eutrophic (above 15 cmol(+)/kg clay), and the B and BC horizons are not calcareous."

    - code: "CV"
      name: Hypocalcic Red Chromosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: hypocalcic}
      notes: "Carbonate only as a slight to moderate effervescence, and/or less than 2 % soft carbonate, and less than 20 % hard carbonate."

    - code: "DA"
      name: Lithocalcic Red Chromosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: lithocalcic}
      notes: "A calcareous horizon with more than 50 % hard carbonate."

    - code: "FB"
      name: Supracalcic Red Chromosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: supracalcic}
      notes: "A calcareous horizon with 20-50 % hard carbonate."

    - code: "CQ"
      name: Hypercalcic Red Chromosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: hypercalcic}
      notes: "A calcareous horizon with more than 20 % mainly soft carbonate and 0-20 % hard carbonate."

    - code: "BD"
      name: Calcic Red Chromosol
      tests:
        all_of:
          - carbonate_suborder_asc: {class: calcic}
      notes: "Other soils with a calcareous horizon."

