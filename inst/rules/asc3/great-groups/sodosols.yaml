# Key to the great groups of the Sodosols, ASC 3rd ed. (online version with errata).
# The order page gives one list for all the colour suborders, repeated here; see
# R/diagnostics-asc-great-groups-b.R and inst/rules/asc3/readings.yaml.

great_groups:
  "SO-AA":
    - code: "BJ"
      name: Duric, Red Sodosol
      tests:
        all_of:
          - pan_great_group_asc: {kind: duric, where: b}
      notes: "A red-brown hardpan within or directly underlying the B horizon."

    - code: "EA"
      name: Petroferric, Red Sodosol
      tests:
        all_of:
          - pan_great_group_asc: {kind: petroferric, where: solum}
      notes: "A petroferric horizon within the solum."

    - code: "DZ"
      name: Petrocalcic, Red Sodosol
      tests:
        all_of:
          - petrocalcic_asc: {}
      notes: "A B horizon that is not calcareous and directly overlies a calcrete pan."

    - code: "BK"
      name: Pedaric, Red Sodosol
      tests:
        all_of:
          - pedaric_asc: {window: upper_b2t}
      notes: "Strong blocky or polyhedral upper B2t whose peds hold together very weakly (a spade enters very easily when dry)."

    - code: "IE"
      name: Effervescent, Red Sodosol
      tests:
        all_of:
          - effervescent_asc: {}
      notes: "The fine earth effervesces with 1 M HCl throughout the solum."

    - code: "FN"
      name: Mottled-Subnatric, Red Sodosol
      tests:
        all_of:
          - esp_great_group_asc: {class: subnatric, mottled: true}
      notes: "Upper B2t mottled, with an ESP of 6 to less than 15 in its major part."

    - code: "ES"
      name: Subnatric, Red Sodosol
      tests:
        all_of:
          - esp_great_group_asc: {class: subnatric}
      notes: "Upper B2t with an ESP of 6 to less than 15 in its major part."

    - code: "FO"
      name: Mottled-Mesonatric, Red Sodosol
      tests:
        all_of:
          - esp_great_group_asc: {class: mesonatric, mottled: true}
      notes: "Upper B2t mottled, with an ESP of 15 to 25 in its major part."

    - code: "DP"
      name: Mesonatric, Red Sodosol
      tests:
        all_of:
          - esp_great_group_asc: {class: mesonatric}
      notes: "Upper B2t with an ESP of 15 to 25 in its major part."

    - code: "FP"
      name: Mottled-Hypernatric, Red Sodosol
      tests:
        all_of:
          - esp_great_group_asc: {class: hypernatric, mottled: true}
      notes: "Upper B2t mottled, with an ESP above 25 in its major part."

    - code: "CR"
      name: Hypernatric, Red Sodosol
      tests:
        all_of:
          - esp_great_group_asc: {class: hypernatric}
      notes: "Upper B2t with an ESP above 25 in its major part."

