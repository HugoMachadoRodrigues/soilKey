# Key to the great groups of the Tenosols, ASC 3rd ed. (online version with errata).
# "Overlie" is read as "directly overlie", as decided.
# See R/diagnostics-asc-great-groups-rest.R and inst/rules/asc3/readings.yaml.

great_groups:
  "TE-BF":
    - code: "BJ"
      name: Duric Chernic-Leptic Tenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: duric}
      notes: "Overlies a red-brown hardpan."

    - code: "GE"
      name: Ferric-Petroferric Chernic-Leptic Tenosol
      tests:
        all_of:
          - nodular_horizon_asc: {kind: ferric, where: profile}
          - substrate_gg_asc: {kind: petroferric}
      notes: "A ferric horizon, and directly overlies ferricrete, a petroferric or a petroreticulate horizon."

    - code: "EA"
      name: Petroferric Chernic-Leptic Tenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: petroferric}
      notes: "Other soils that overlie ferricrete, a petroferric or a petroreticulate horizon."

    - code: "EM"
      name: Silpanic Chernic-Leptic Tenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: silpanic}
      notes: "Overlies a siliceous pan."

    - code: "DZ"
      name: Petrocalcic Chernic-Leptic Tenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: petrocalcic}
      notes: "Overlies a calcrete pan."

    - code: "CZ"
      name: Lithic Chernic-Leptic Tenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: lithic}
      notes: "Overlies hard rock."

    - code: "DU"
      name: Paralithic Chernic-Leptic Tenosol
      tests:
        all_of:
          - substrate_gg_asc: {kind: paralithic}
      notes: "Overlies partially weathered or decomposed rock or saprolite."

