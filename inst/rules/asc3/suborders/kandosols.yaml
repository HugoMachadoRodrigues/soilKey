# Key to the suborders of the Kandosols, ASC 3rd ed. (online version with errata).
# The colour classes are the ASC's own (Colour classes, Fig. 3); see
# R/diagnostics-asc-suborders.R and inst/rules/asc3/readings.yaml.

suborders:
  "KA":
    - code: "AA"
      name: Red Kandosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Red, window: b2_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the B2 (or the whole B2 if thinner) is Red."

    - code: "AB"
      name: Brown Kandosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Brown, window: b2_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the B2 (or the whole B2 if thinner) is Brown."

    - code: "AC"
      name: Yellow Kandosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Yellow, window: b2_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the B2 (or the whole B2 if thinner) is Yellow."

    - code: "AD"
      name: Grey Kandosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Grey, window: b2_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the B2 (or the whole B2 if thinner) is Grey."

    - code: "AE"
      name: Black Kandosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Black, window: b2_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the B2 (or the whole B2 if thinner) is Black."
