# Key to the suborders of the Vertosols, ASC 3rd ed. (online version with errata).
# The colour classes are the ASC's own (Colour classes, Fig. 3); see
# R/diagnostics-asc-suborders.R and inst/rules/asc3/readings.yaml.

suborders:
  "VE":
    - code: "AM"
      name: Aquic Vertosol
      tests:
        all_of:
          - aquic_vertosol_asc: {}
      notes: "Water ponds on the surface or some part of the upper 0.5 m is saturated for long periods (about 2-3 months) in most years."

    - code: "AA"
      name: Red Vertosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Red, window: solum_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the solum (or the whole solum if thinner) is Red."

    - code: "AB"
      name: Brown Vertosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Brown, window: solum_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the solum (or the whole solum if thinner) is Brown."

    - code: "AC"
      name: Yellow Vertosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Yellow, window: solum_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the solum (or the whole solum if thinner) is Yellow."

    - code: "AD"
      name: Grey Vertosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Grey, window: solum_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the solum (or the whole solum if thinner) is Grey."

    - code: "AE"
      name: Black Vertosol
      tests:
        all_of:
          - colour_suborder_asc: {colour: Black, window: solum_50}
      notes: "The dominant moist colour class in the major part of the upper 0.5 m of the solum (or the whole solum if thinner) is Black."
