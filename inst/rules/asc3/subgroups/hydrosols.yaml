# Key to the subgroups of the Hydrosols, ASC 3rd ed. (online version with errata).
# One list for every great group of the order, as the order page gives it; the name is written on the
# great group's ('Bleached, Eutrophic, Red Chromosol'). See R/diagnostics-asc-subgroups.R and
# inst/rules/asc3/readings.yaml.

subgroups:
  "HY-CW-IY":
    - code: "BW"
      name: "Fibric, {parent}"
      tests:
        all_of:
          - peat_suborder_asc: {peat: fibric}
      notes: "The organic materials dominated by fibric peat."

    - code: "CE"
      name: "Hemic, {parent}"
      tests:
        all_of:
          - peat_suborder_asc: {peat: hemic}
      notes: "The organic materials, other than fibric peat, dominated by hemic peat."

    - code: "EH"
      name: "Sapric, {parent}"
      tests:
        all_of:
          - peat_suborder_asc: {peat: sapric}
      notes: "The organic materials, other than fibric peat, dominated by sapric peat."

  "HY-CW-JB":
    - code: "BW"
      name: "Fibric, {parent}"
      tests:
        all_of:
          - peat_suborder_asc: {peat: fibric}
      notes: "The organic materials dominated by fibric peat."

    - code: "CE"
      name: "Hemic, {parent}"
      tests:
        all_of:
          - peat_suborder_asc: {peat: hemic}
      notes: "The organic materials, other than fibric peat, dominated by hemic peat."

    - code: "EH"
      name: "Sapric, {parent}"
      tests:
        all_of:
          - peat_suborder_asc: {peat: sapric}
      notes: "The organic materials, other than fibric peat, dominated by sapric peat."

  "HY-EG-*":
    - code: "HM"
      name: "Episulfidic-Petrocalcic, {parent}"
      tests:
        all_of:
          - episulfidic_asc: {}
          - substrate_gg_asc: {kind: petrocalcic, from: solum}
      notes: "Sulfidic materials in the A or near-surface horizons and the soil directly overlying a calcrete pan."

    - code: "HL"
      name: "Episulfidic, {parent}"
      tests:
        all_of:
          - episulfidic_asc: {}
      notes: "Sulfidic materials in the A or near-surface horizons."

    - code: "DZ"
      name: "Petrocalcic, {parent}"
      tests:
        all_of:
          - substrate_gg_asc: {kind: petrocalcic, from: solum}
      notes: "The soil directly overlying a calcrete pan."

  "HY-ED-*":
    - code: "IT"
      name: "Fusic, {parent}"
      tests:
        all_of:
          - fusic_surface_asc: {}
      notes: "Surface layers that comprise more than 20 % fusic material."

    - code: "GD"
      name: "Peaty-Placic, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: peaty}
          - pan_great_group_asc: {kind: placic, where: b}
      notes: "A peaty horizon and a thin ironpan within or directly underlying the B horizon."

    - code: "DW"
      name: "Peaty, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: peaty}
      notes: "A peaty horizon."

    - code: "CL"
      name: "Humose-Magnesic, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: humose}
          - magnesic_asc: {window: b2}
      notes: "A humose horizon and exchangeable Ca/Mg below 0.1 in the major part of the B2 horizon."

    - code: "GY"
      name: "Humose-Acidic, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: humose}
          - acidic_b2_asc: {}
      notes: "A humose horizon and the major part of the B2 horizon strongly acid."

    - code: "GU"
      name: "Humose-Calcareous, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: humose}
          - calcareous_b_asc: {}
      notes: "A humose horizon and at least some part of the B or BC horizon calcareous."

    - code: "EY"
      name: "Humose-Bleached, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: humose}
          - bleached_a2_asc: {}
      notes: "A humose horizon and a conspicuously bleached A2 horizon."

    - code: "CK"
      name: "Humose, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: humose}
      notes: "A humose horizon."

    - code: "DH"
      name: "Melacic-Magnesic, {parent}"
