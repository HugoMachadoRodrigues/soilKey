        all_of:
          - bleached_a2_asc: {}
          - nodular_horizon_asc: {kind: ferric, where: profile}
      notes: "A conspicuously bleached A2 horizon and a ferric horizon within the soil profile."

    - code: "BU"
      name: "Ferric, {parent}"
      tests:
        all_of:
          - nodular_horizon_asc: {kind: ferric, where: profile}
      notes: "A ferric horizon within the soil profile."

    - code: "GX"
      name: "Manganic-Acidic, {parent}"
      tests:
        all_of:
          - nodular_horizon_asc: {kind: manganic, where: profile}
          - acidic_b2_asc: {}
