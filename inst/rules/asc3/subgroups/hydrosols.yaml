        all_of:
          - chernic_sg_asc: {kind: melacic}
      notes: "A melacic horizon."

    - code: "DL"
      name: "Melanic-Bleached, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: melanic}
          - bleached_a2_asc: {}
      notes: "A melanic horizon and a conspicuously bleached A2 horizon."

    - code: "DN"
      name: "Melanic-Vertic, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: melanic}
          - vertic_b_asc: {}
      notes: "A melanic horizon and a B horizon in which at least 0.3 m has vertic properties."

    - code: "FV"
      name: "Melanic-Acidic, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: melanic}
          - acidic_b2_asc: {}
      notes: "A melanic horizon and the major part of the B2 horizon strongly acid."

    - code: "DK"
      name: "Melanic, {parent}"
      tests:
        all_of:
          - chernic_sg_asc: {kind: melanic}
      notes: "A melanic horizon."

    - code: "BB"
      name: "Bleached-Vertic, {parent}"
      tests:
        all_of:
          - bleached_a2_asc: {}
          - vertic_b_asc: {}
      notes: "A conspicuously bleached A2 horizon and a B horizon in which at least 0.3 m has vertic properties."

    - code: "EX"
      name: "Vertic, {parent}"
      tests:
        all_of:
          - vertic_b_asc: {}
      notes: "A B horizon in which at least 0.3 m has vertic properties."

    - code: "GW"
      name: "Ferric-Acidic, {parent}"
      tests:
        all_of:
          - nodular_horizon_asc: {kind: ferric, where: profile}
          - acidic_b2_asc: {}
      notes: "A ferric horizon within the soil profile and the major part of the B2 horizon strongly acid."

    - code: "AV"
      name: "Bleached-Ferric, {parent}"
      tests:
        all_of:
          - bleached_a2_asc: {}
          - nodular_horizon_asc: {kind: ferric, where: profile}
      notes: "A conspicuously bleached A2 horizon and a ferric horizon within the soil profile."

    - code: "BU"
      name: "Ferric, {parent}"
      tests:
        all_of:
          - nodular_horizon_asc: {kind: ferric, where: profile}
      notes: "A ferric horizon within the soil profile."

    - code: "GX"
      name: "Manganic-Acidic, {parent}"
      tests:
        all_of:
          - nodular_horizon_asc: {kind: manganic, where: profile}
          - acidic_b2_asc: {}
      notes: "A manganic horizon within the soil profile and the major part of the B2 horizon strongly acid."

    - code: "AY"
      name: "Bleached-Manganic, {parent}"
      tests:
        all_of:
          - bleached_a2_asc: {}
          - nodular_horizon_asc: {kind: manganic, where: profile}
      notes: "A conspicuously bleached A2 horizon and a manganic horizon within the soil profile."

    - code: "DC"
      name: "Manganic, {parent}"
      tests:
        all_of:
          - nodular_horizon_asc: {kind: manganic, where: profile}
      notes: "A manganic horizon within the soil profile."

    - code: "EM"
      name: "Silpanic, {parent}"
      tests:
        all_of:
          - silpan_ab_asc: {}
      notes: "A siliceous pan in the lower A and/or upper B horizon."

    - code: "AU"
      name: "Bleached-Acidic, {parent}"
      tests:
        all_of:
          - bleached_a2_asc: {}
          - acidic_b2_asc: {}
      notes: "A conspicuously bleached A2 horizon and the major part of the B2 horizon strongly acid."

    - code: "AI"
      name: "Acidic, {parent}"
      tests:
        all_of:
          - acidic_b2_asc: {}
      notes: "The major part of the B2 horizon strongly acid."

    - code: "EF"
      name: "Reticulate, {parent}"
      tests:
        all_of:
          - reticulate_below_asc: {}
      notes: "A reticulate horizon below the B2 horizon."

    - code: "AX"
      name: "Bleached-Magnesic, {parent}"
      tests:
        all_of:
          - bleached_a2_asc: {}
          - magnesic_asc: {window: b2}
      notes: "A conspicuously bleached A2 horizon and exchangeable Ca/Mg below 0.1 in the major part of the B2 horizon."

    - code: "DB"
      name: "Magnesic, {parent}"
      tests:
        all_of:
          - magnesic_asc: {window: b2}
      notes: "Exchangeable Ca/Mg below 0.1 in the major part of the B2 horizon."

    - code: "AT"
      name: "Bleached, {parent}"
      tests:
        all_of:
          - bleached_a2_asc: {}
      notes: "A conspicuously bleached A2 horizon."

    - code: "AF"
      name: "Dystrophic, {parent}"
      tests:
        all_of:
          - base_status_asc: {class: dystrophic, window: b2}
      notes: "The major part of the B2 horizon dystrophic."

    - code: "AG"
      name: "Mesotrophic, {parent}"
      tests:
        all_of:
          - base_status_asc: {class: mesotrophic, window: b2}
      notes: "The major part of the B2 horizon mesotrophic."

    - code: "AH"
      name: "Eutrophic, {parent}"
      tests:
        all_of:
          - base_status_asc: {class: eutrophic, window: b2}
      notes: "The major part of the B2 horizon eutrophic, the B and BC horizons not calcareous."

    - code: "BC"
      name: "Calcareous, {parent}"
      tests:
        all_of:
          - calcareous_b_asc: {}
      notes: "At least some part of the B or BC horizon calcareous."

  "HY-ED-GT": []

  "HY-ED-GR": []

  "HY-DT-GT": []

  "HY-DT-GR": []

# The Rudosolic and Tenosolic great groups of the Redoxic and Oxyaquic Hydrosols take the
# subgroup lists of the Rudosols and Tenosols (Hydrosols page, subgroups of the Redoxic and
# Oxyaquic Hydrosols). The profile is keyed, apart from wetness, under the order named here, as
# deep as the choice of list needs (the suborder; see readings.yaml); the names are written on
# the Hydrosol great group's ('Basic, Rudosolic, Oxyaquic Hydrosol').
# The walk sets site$.apart_from_wetness, which only the Hypersalic suborder reads (its water
# table and mottling are wetness).
subgroups_from:
  "HY-ED-GT": {class: "TE", site: {.apart_from_wetness: true}}
  "HY-ED-GR": {class: "RU", site: {.apart_from_wetness: true}}
  "HY-DT-GT": {class: "TE", site: {.apart_from_wetness: true}}
  "HY-DT-GR": {class: "RU", site: {.apart_from_wetness: true}}
