# How soilKey reads the Australian Soil Classification (3rd ed., online
# version with errata) where the text is silent or leaves a choice. Pages are
# the sections of the online version: the key to soil orders, the order
# pages and the glossary entries.
readings:
  - topic: "Field texture and lab clay"
    page: "Glossary, 'Field texture'; key to orders (Vertosols, Calcarosols, Arenosols)"
    reading: "Where a limit is a field texture grade (sand, loamy sand and clayey sand for the deep sandy profiles; a clay field texture for the Vertosols), field_texture decides; without it, lab clay stands in at 10 % clay, undecided within 2 points. For the Vertosols the key itself gives both ('a clay field texture or 35 % or more clay'), and either one passes a horizon. For the 15 % clay of the Kandosols and Arenosols, lab clay decides and otherwise the field texture, as the key equates them: SL+ (heavy sandy loam) or heavier exceeds 15 %, a plain or light sandy loam and the sands do not. Elsewhere, where a limit is in % clay, a field texture stands in as the clay range the glossary gives its grade, a '+' or '-' taking the upper or lower half; the range decides only when every value in it gives the same answer."
  - topic: "Notation of the designations"
    page: "Glossary, 'Horizon'; Field Handbook notation"
    reading: "site$designation_system decides when present ('asc' and its synonyms read the Australian notation). Otherwise a profile is read in the Australian notation when a master is followed by its subdivision digit (A1, A2, B21, B2t) or a P or D master appears and no sign of the FAO or USDA notation does (an E master, a digit after the suffixes as in Bt1, Oi, Oe or Oa), or when the site is in Australia and there is no such sign. FAO and USDA designations are read by the role of each horizon: an A as an A1, an E as an A2, a B with no transition as a B2 (a Bt as a B2t), an O with a or e as an O2 and otherwise an O1, an H as a P horizon. A B written with no digit in the Australian notation (B, Bt, Bs) is read as a B2. Older and variant forms are read too: only the first word is read (a note such as 'lamellae' or '(weak)' after it is dropped) and a trailing '?' is dropped; a designation in capitals gets lower-case suffixes (CK is a Ck, B2WT a B2wt, while BC stays a BC; a P, D or R after an A, B or C, and a master repeated without a digit, are suffixes: AP is an Ap, B2D a B2d, 2B2B a buried B2); two masters with digits are a transition (A2B and A3B1 an AB, B3C a BC, B22/C a B/C), and two parts of one master take one role (A1A2 and A1/A2 an A2, as the A2 part is there; B1B2 a B1). The ss of slickensides and the se of sulfides are not an s, and the a, e and i of an O tell its decomposition, not a bleached horizon. A designation naming clay lamellae is read as lamellae (argic horizons), never as a B2. A designation that still cannot be read, or gives a role outside the notation (A0, B5), has an unknown role. In the FAO or USDA notation an AE, EA or A/E is read as an A2. The older codes cb and sb with no lithologic prefix are read as the conspicuous and sporadic bleaching of the row (as e and j), not as burial, concretions or sesquioxides; with a prefix (2A2cb) they are burial. A b needs a cover: a row marked b with no row above it that is not marked b is not buried; nor is a b row in the same material as the row above it with unmarked A or B horizons of that material below it (a b used as a subdivision letter, A2a A2b, or a misprint), since a buried soil has no present soil below it. A horizon right below a buried one with the same lithologic prefix belongs to the buried soil even without its b."
  - topic: "Rows of unknown role"
    page: "Glossary, 'Horizon'; three-valued reading"
    reading: "A row with no designation, or with one that cannot be read, may be a horizon of the present soil when it lies from the top of the A1 (from the surface when the first A horizon is not an A1) down to the first C, D or R below the first A or B horizon, and above any buried soil; it may be part of the B2 only below the A horizons that lie above the first B; there a gate decides only when the answer is the same whatever the row is (a Podosol B, a part of the B2 or of the upper B2t, a part of the solum, a B for the Rudosols), and a row between two solum horizons is solum. For a major part, TRUE holds only with every such row that is not TRUE counted in, FALSE only with every such row that is not FALSE counted in; the upper 0.2 m of the B2t is tried with each set of them (rows starting 0.2 m or more below the first known B2 under the textural B cannot be in it; with more than eight others the test is undecided). Outside that window such rows are not read for their role (they can still be a buried soil under anthropic material). Rows with no designation below the last designated row lie outside the description for the tests that look for a designated horizon (Podosol B, B2), but may still be part of the solum or a B inside the window; their measured properties are always read. A profile with no designations at all leaves every designation test undecided, the textural B included."
  - topic: "Clear or abrupt textural B horizon"
    page: "Glossary, 'Clear or abrupt textural B horizon'"
    reading: "The boundary is the lower boundary recorded for the horizon above (boundary_distinctness: abrupt, clear or sharp pass; gradual or diffuse fail; unrecorded leaves it undecided), and the horizon above must be thicker than 30 mm. The horizon above is 'normally an A but occasionally a B1': an A1, A2, A3, AB, A/B or AC, or a B1 or BA, so a boundary within the B2 is not a textural B; a row of unknown role may be one only above the first B2, B3, BC, C, D or R. The horizon below may be any B under an A (B1, B2, B3, BA, BC), as the glossary sets the clay minimum 'at the top of the B horizon', and a B2, B3 or BC under a B1; clay lamellae are not. A horizon of unknown role may be either, which leaves the test undecided. Buried horizons are not read. A gap, an overlap or a missing depth between the two horizons leaves the test undecided, and so does a description that stops in an A or a B1 (the textural B may lie deeper). Each horizon is read by its field texture grade when it has one, and by its lab clay only when it has none: the glossary gives the limits in clay 'and/or' field texture and notes that where field texture and laboratory data disagree the field texture may be the better guide to how the soil behaves (on NatSoil, field texture first agrees with the surveyors in 104 of the 255 profiles whose order it changes, lab clay first in 56). With lab clay on both sides the glossary's figures decide (below 20 % above: at least double and at least 20 %; 20 to 35 %: at least 20 points more; 35 % or more: no contrast). Otherwise its field-texture equivalents decide: above sandy loam or lighter, the B must be sandy clay loam or heavier with at least double the clay, each side taken at the middle of its grade's range; above loam to clay loam, the B must be light medium clay or heavier (a plain 'clay' B leaves it undecided); above a clay, no contrast."
  - topic: "Upper B2t"
    page: "Key to orders, steps 6-8"
    reading: "The upper 0.2 m of the B2t is measured from the top of the first B2 horizon at or below the textural B, through the adjacent B2 horizons (a gap in the record ends them; a B1, B3 or BC is not the B2t), or the whole of them when they are thinner; with no B2 there (a B3 over rock), the textural B horizon itself. The Sodosols need one major part that is both sodic and not strongly subplastic. 'Major part' is more than half of that thickness by depth; parts with unknown values count as undecided."
  - topic: "Strongly acid"
    page: "Glossary, 'Strongly acid'"
    reading: "ph_h2o is read as the pHw (1:5 water) and decides when present (below 5.5); otherwise ph_cacl2 (below 4.6). A field pH stored in ph_h2o is read the same way."
  - topic: "Sodic and ESP"
    page: "Glossary, 'Sodic', 'ESP'"
    reading: "ESP is exchangeable Na over the CEC, over the effective CEC (ecec_cmol) where the pHw is 5.5 or less, and over whichever is recorded when only one is; without Na or either CEC, the ESP the laboratory reports (esp_pct). A horizon with both CEC and Na very low (CEC 3 cmol/kg or less and Na 0.3 or less), where the glossary advises against computing an ESP, is read as not sodic."
  - topic: "Strongly subplastic"
    page: "Glossary, 'Subplastic'; key to orders, step 7"
    reading: "Read from subplasticity ('strongly subplastic'); a horizon with no record is read as not strongly subplastic, as most descriptions do not record the plasticity type."
  - topic: "Anthroposols"
    page: "Key to orders, step 1; Anthroposols"
    reading: "Recognised from a record of human origin only: artefacts (artefacts_pct above 0) or a layer_origin naming, as whole words, anthropic or technic material, artefacts, spolic, garbic, urbic or hortic material, dredged material, landfill, artificial fill or fill material, made ground, spoil, tailings or mine waste, in a run of layers from the surface. The run starts below any O1 litter, which is outside the solum. Where the run buries a pre-existing soil (a buried horizon, or an A or B horizon, below it) it must be 0.3 m or more thick, as the definition says; otherwise any thickness; rows of unknown role below a thinner run leave it undecided. Without such a record the soil is not an Anthroposol."
  - topic: "Organic materials and saturation"
    page: "Glossary, 'Organic materials'; key to orders, step 2"
    reading: "Organic C of at least 12 % plus 0.1 x clay % (18 % from 60 % clay) where saturated for long periods, or at least 20 % where saturated for a few days at most. 'Saturated for long periods' is read as Soil Taxonomy reads it, since the glossary gives its definition as the same: 30 days or more, cumulative, in normal years. From the site drainage class (Field Handbook, NCST 2009), whose classes speak of wetness, not saturation: very poorly drained saturates; poorly drained (all horizons wet for several months) and imperfectly drained (some horizons wet for several weeks) are undecided, as that wetness may or may not be 30 days of saturation; moderately well drained (wet for up to about a week) or better do not, and a horizon there needs 20 % organic C (saturated for a few days at most); when it is unknown, 20 % or more passes and less than 12 % plus 0.1 x clay fails (clay unknown: less than 12 % fails, 18 % or more passes under long saturation). Measured organic C decides, or leaves the horizon undecided; only where organic C is not measured does an O or P designation count as organic material and any other recognised designation as mineral, and, without a designation, a peat field texture as organic and a mineral field texture grade as mineral. The part of the upper 0.8 m below the description (unless it ends on rock or a hard layer), and layers of unknown organic status, leave the order undecided wherever they could change the answer. Tidal flooding is read from site$tidal_inundation."
  - topic: "Podosols"
    page: "Key to orders, step 3; glossary 'Podosol diagnostic horizons'"
    reading: "Read from the designations only, as the ASC uses no chemical criteria: a B1, B2 or B3 horizon of the present soil marked s or h (Bs, Bhs, Bh), not buried, not a transition (BC, B/C) and not also marked t (a Bts is a textural B with sesquioxides, not an illuvial organic-aluminium B). A Bsm without h (a thin ironpan) does not count. A profile with no designations, or with a designation that cannot be read, leaves the order undecided; a row of unknown role among the designated ones does too (see 'Rows of unknown role')."
  - topic: "Vertosols"
    page: "Key to orders, step 4; Vertosols; glossary 'Vertic properties'"
    reading: "Clayey throughout the solum: a clay field texture (light clay or heavier) or 35 % clay or more in every mineral horizon of the solum, a surface horizon of 30 mm or less excepted; a peaty surface horizon is not tested (the key lets the cracks stop at its base), and a mineral row of unknown role above the first C, D or R may belong to the solum, so a non-clayey one leaves the test undecided. Cracks: cracks_width_cm of 0.5 or more in a horizon, or a cracking surface condition in site$surface_condition (the Field Handbook's cracked surface has cracks 6 mm or wider reaching 0.3 m or deeper). The key's 'unless too moist' waives the cracks when the major part of the solum (by thickness) was described moderately moist, moist or wet (soil_water_status); with no record of cracks and a dry or unknown description the criterion is undecided, and narrower recorded cracks do not rule it out. A surface condition worded in the negative ('uncracked', 'cracks absent', 'no cracks') is not cracking. Slickensides (few or more) or lenticular peds in the solum pass; slickensides recorded absent in every horizon with no lenticular peds fail. Gilgai and self-mulching are not read, as the ASC does not use them in the definition."
  - topic: "Hydrosols"
    page: "Key to orders, step 5; Hydrosols"
    reading: "From water_saturation_days when recorded: more than half of the profile with 90 days or more passes, with fewer than 60 days fails (between is undecided). Otherwise from the site drainage class (Field Handbook, NCST 2009, whose classes speak of wetness, not saturation): very poorly drained (free water at or near the surface for most of the year) passes; poorly drained (all horizons wet for several months) leaves it undecided, as the Field Handbook's poorly drained soil stays wet for several months, which is not yet saturated through most of the profile, and on NatSoil most poorly drained profiles are not Hydrosols in the surveyors' hands; imperfectly drained (wet for several weeks) or better, rapidly drained included, fail (since 0.9.280; before, imperfectly drained was undecided). Tidal flooding (site$tidal_inundation) passes."
  - topic: "Calcareous"
    page: "Glossary, 'Calcareous'"
    reading: "A horizon is calcareous with a recorded effervescence (slight or stronger), carbonate segregations (secondary_carbonates_pct above 0), 0.5 % CaCO3 or more (the amount that effervesces with 1 M HCl), or a k suffix. With no carbonate record at all, a pHw below 7.0 (or a pHCa below 6.5) is read as not calcareous, since free carbonate holds the pH higher."
  - topic: "Calcarosols"
    page: "Key to orders, step 9; Calcarosols"
    reading: "Calcareous throughout the solum (a mineral row of unknown role above the first C, D or R may be part of it), or in the horizon directly below the A1 or Ap or at 0.2 m, whichever is shallower; rock or a hard layer there is not calcareous soil. The carbonate is taken as pedogenic unless layer_origin names shell, coquina, limestone or marl. Deep sandy profiles (sand, loamy sand or clayey sand in 80 % or more of the upper 1.0 m) are excluded; the part of the upper metre below the description counts as undecided, unless the description ends on rock or a hard layer."
  - topic: "The B2 horizon"
    page: "Key to orders, steps 10-12; glossary 'B horizon'"
    reading: "The B2 is the set of rows with the B2 role (all subdivisions together); rows of unknown role below the A horizons and above the first C, D or R may be part of it, and a major part is decided only when they do not change it. A profile with designations but no B2 has none when its description reaches a B3, BC, C, D or R horizon, or a buried soil, and holds no row that may be a B2; when the description stops in an A or B1 horizon, the B2 may lie deeper (a B1 is dominated by the properties of an underlying B2, and the Kandosols note B2t horizons below 1 m under thick A or B1 horizons), so the orders that need a B2 are undecided. A profile with no designations leaves them undecided."
  - topic: "Ferrosols"
    page: "Key to orders, step 10; glossary 'Free iron oxide'"
    reading: "Free iron oxide is read from fe_dcb_pct (as Fe); more than 5 % over the major part of the B2 by thickness passes. No proxy is used: without free iron the order is undecided and the later orders provisional. At least 0.3 m of the B2 with vertic properties excludes it; a horizon has them when it is clayey (as for the Vertosols) with slickensides or lenticular peds (the strong cracking the glossary adds is not read per horizon); the textural B exclusion is supplied by the key order."
  - topic: "Grade of pedality"
    page: "Glossary, 'Grade of pedality'; Dermosols, Kandosols"
    reading: "Moderate or strong (and a recorded 'weak to moderate') is pedal; weak, structureless, massive and single grain are not. A single-grain B2 is read as apedal for the Kandosols, like a massive one."
  - topic: "Arenosols"
    page: "Key to orders, step 13; Arenosols; glossary 'Lamellae'"
    reading: "No layer within 1.0 m with more than 15 % clay (lab clay, or SL+ or heavier), apart from clay lamellae (a designation naming lamellae). Coarse fragments are averaged by thickness over the upper 1.0 m, a missing record read as none. A hard layer is rock (an R horizon), a moderately or more strongly cemented layer, or a cemented pan (m suffix) starting within 1.0 m; a description shallower than 1.0 m without one leaves that criterion undecided."
  - topic: "Rudosols"
    page: "Key to orders, step 14; Rudosols"
    reading: "Read from the designations: no B horizon of the present soil (a B role, an AB or A/B, or a C/B, whose B material is more than the fissure fillings the definition allows; a mineral row of unknown role above the first C, D or R may be a B and leaves it undecided), no A2 or A3 and no e suffix (a pedological colour change other than the darkening of the A1), and an A1 that is weak, massive or single grain, or no A1. Buried horizons are not read."
  - topic: "Buried soils"
    page: "How to classify, buried soils"
    reading: "Horizons marked b are not read: the soil above them is keyed. When less than 0.3 m of material that qualifies only as a Rudosol lies over the first buried horizon, the ASC classifies the buried soil, with the cover as a phase; soilKey does not do this yet and adds a warning to such a Rudosol (a cover that keys to another order is classified as such, whatever its thickness). Compound names for thicker covers (Stratic Rudosol/Black Vertosol) are not given."
  - topic: "Colour classes"
    page: "Colour classes (Fig. 3)"
    reading: "A horizon's colour class is read from its moist matrix colour (the colour of the matrix of a mottled horizon). Red: hue 5YR or redder, chroma 3 or more. Brown: hue yellower than 5YR, value 5 or less, chroma 3 or more. Yellow: hue yellower than 5YR, value 6 or more, chroma 4 or more. Grey: value 4 or more and chroma 2 or less, or a hue yellower than 5YR with value 6 or more and chroma 3. Black: value 3 or less and chroma 2 or less. Colours are matched to the nearest chip: value and chroma to the nearest whole number (value 2.5 also has chips), the hue to the nearest chip of its family (2.5, 5, 7.5, 10); half way between chips both are tried, and a colour whose two matches fall in different classes is of unknown class. R, RP and P hues count as redder than 5YR; Y, GY, G, BG, B and PB hues as yellower; a neutral hue (N) has chroma 0; with an unreadable hue, a chroma of 2 or less still places the colour in Black or Grey, which hold for all hues. The south-western Western Australian variant of Yellow is not applied."
  - topic: "Colour suborders"
    page: "Suborders of the Kurosols, Sodosols, Chromosols, Ferrosols, Dermosols, Kandosols and Vertosols"
    reading: "The window is the upper 0.2 m of the B2t below the clear or abrupt textural B (Kurosols, Sodosols, Chromosols, as for the order), the upper 0.5 m of the B2 (Ferrosols, Dermosols, Kandosols) or the upper 0.5 m of the solum (Vertosols), or the whole of it when thinner. 'The dominant colour class in the major part' is the class covering more than half of the window; when no class can, the class with the largest share, as the surveyors read it (on NatSoil about 40 profiles; a tie leaves it undecided). A gap in the record and rows that overlap with different classes are parts of unknown colour, not the end of the window. Parts of the window of unknown colour, and rows of unknown role that may belong to its horizons, are tried every way, and the class is decided only when they cannot change it. A Vertosol with no designations reads its mineral rows as the solum, as the order does."
  - topic: "Aquic Vertosols"
    page: "Vertosols, suborder Aquic"
    reading: "Water ponds on the surface, or some part of the upper 0.5 m is saturated for long periods (about 2-3 months) in most years: from water_saturation_days of the horizons within 0.5 m (90 days or more in any passes; fewer than 60 in all, the whole 0.5 m described, fails), otherwise from the drainage class as for the Hydrosols. On NatSoil, of the surveyed Vertosols, 6 of 440 imperfectly drained and 20 of 214 poorly drained are Aquic."
  - topic: "Organosol suborders"
    page: "Organosols, suborders and Comment; glossary 'Peat'"
    reading: "The kind of each organic horizon comes from the glossary's squeeze test (von_post_index: H1-H3 fibric, H4-H6 hemic, H7-H10 sapric); without it, from the rubbed fibre content, as the Comment says the kinds are essentially those of Soil Taxonomy and the WRB: three quarters or more fibric, from one sixth to two fifths hemic, less than one sixth sapric (both definitions agree there), between two fifths and three quarters fibric or hemic, never sapric (Soil Taxonomy's fibric starts at two fifths with the pyrophosphate colour, the WRB's at two thirds), so a peat field texture or designation decides there only when it says fibric or hemic; otherwise from a peat field texture (Field Handbook: IP fibric, HP hemic, AP sapric) and an Oi, Oe or Oa designation. 'Dominant by thickness' is the kind with the greatest thickness among the organic materials of the profile (organic materials as for the order), as Soil Taxonomy's 'more than any other kind'; when kinds tie for it, no kind is dominant and the Comment's most decomposed kind is taken. Organic horizons of unknown kind, and horizons whose organic status is undecided, count as thickness of unknown kind; the suborder is decided only when that thickness cannot change it."
  - topic: "Podosol suborders: saturation of the B horizon"
    page: "Podosols, suborders"
    reading: "From water_saturation_days of the B horizons when every B horizon has them (the largest): 90 days or more is long-term (the Aquic 'order of months'), 60 to 89 short or long, 3 to 59 short-term ('several days to several weeks'), 1 or 2 none or short, 0 none. When only some B horizons have them, an unrecorded one may be wetter: the classes from the recorded one up, narrowed by the drainage class where the two agree. Otherwise from the site drainage class (Field Handbook, NCST 2009). The suborders define free drainage as 'rapidly drained': rapidly drained (and the excessive classes of other systems) has no saturation of the B (Aeric). Well drained (water removed readily but not rapidly, some horizons wet for several days) may be free drainage or short-term saturation, and is undecided between Aeric and Semiaquic. Moderately well and imperfectly drained (water removed somewhat slowly or slowly; some horizons wet for up to a week or for several weeks) restrict drainage, so they are not Aeric, and their wetness falls short of months: Semiaquic. Poorly drained (all horizons wet for several months) is short or long; very poorly drained (free water at or near the surface most of the year) long."
  - topic: "Sulfuric and hypersulfidic material (Podosols)"
    page: "Podosols, suborders; glossary 'Sulfuric materials', 'Hypersulfidic material', 'Sulfidic materials'"
    reading: "Sulfuric material: a pH below 4 (ph_h2o, read for the 1:1 pH of the glossary) with evidence that sulfide oxidation caused it: jarosite (jarosite_present), or hypersulfidic material in a horizon below; the 0.05 % water-soluble sulfate of the glossary is not read, as soilKey has no such attribute. A pH of 4 or more is not sulfuric; a pH below 4 with no such evidence is untested (organic acids also bring the pH of a Podosol A below 4). The 15 cm is one run of adjacent horizons in the A or B horizons. Hypersulfidic material: a field pH of 4 or more falling below 4, by 0.5 unit or more, on incubation (incubation_ph); an incubated pH of 4 or more, a field pH below 4, or sulfidic S below 0.01 % (not sulfidic material) is not; an incubated pH below 4 with no field pH is undecided. Either material found in a row of unknown role, or in a row below the description, may or may not lie in the A or B horizons, and leaves the suborder undecided. Without the incubation test the material is untested, and Aquic-Hypersulfidic stays undecided: a laboratory test that was not done is missing data."
  - topic: "Hydrosol settings"
    page: "Hydrosols, suborders and Comment"
    reading: "The first seven suborders name the setting of the soil, which the surveyor records at the site. They are read from site$tidal_zone (subtidal, intertidal, supratidal, extratidal), site$tidal_inundation, site$subaqueous, site$salinised, the landform (site$landform, site$landform_element; NatSoil gives the landform pattern) and the surface condition. A landform that names the setting decides it (an intertidal or supratidal flat, a playa); a coastal landform without the zone (a tidal flat, a marine, chenier or beach ridge plain, a delta, an estuary, a reef, a lagoon, mangroves), or tidal flooding without the zone, leaves the four tidal settings undecided; a lake or lagoon leaves Subaqueous undecided; a playa plain or a lacustrine plain leaves Hypersalic undecided, as the profile may lie on the playa or beside it; any other recorded landform rules these settings out. A saline surface (salt crust) is Salic. A setting the site record does not mention is read as absent: these are conspicuous settings that the surveyor records where they occur, as the order key already reads tidal flooding for the Organosols."
  - topic: "Mottled horizon; Redoxic and Oxyaquic Hydrosols"
    page: "Hydrosols, suborders; glossary 'Mottled horizon'"
    reading: "A mottled horizon has more than 10 % mottles (redoximorphic_features_pct) of distinct or prominent contrast (mottle_contrast); 10 % or less, or faint mottles only, is not; an abundance or a contrast that is not recorded leaves the horizon undecided (on NatSoil, mottles recorded as absent are coded, so a horizon with no mottle record is not read as unmottled). Redoxic: more than half of the profile mottled, by thickness, over the described profile above any buried soil and rock; Oxyaquic: more than half 'whole coloured', which the glossary does not define and is read as not mottled. A profile mottled over exactly half fits neither. The alternative window 'the subsoil when the profile is stratified' is not read, as neither term is defined."
  - topic: "Calcarosol suborders: gypsum and the carbonate classes"
    page: "Calcarosols, suborders and Comment; glossary 'Carbonate classes', 'Calcareous horizon', 'Hard'"
    reading: "Soft carbonate is the soft, finely divided carbonate of a horizon: carbonate_soft_pct, or the laboratory CaCO3 of the fine earth, the larger. Hard carbonate is carbonate_hard_pct: calcrete fragments, carbonate nodules or concretions and carbonate-coated gravel. The classes follow the glossary's table and key order: Hypocalcic before the classes of a calcareous horizon; hard over 50 % Lithocalcic; 20 to 50 % Supracalcic (20 itself, as the Hypercalcic text prints 0-20 % and Supracalcic is keyed first); soft over 20 % and hard under 20 % Hypercalcic; any other calcareous horizon Calcic. A calcareous horizon is a B or BC horizon of the present soil, of any lithologic prefix, marked k (Bk, BCk, 2Bk, 2BCk), or one with 10 % or more carbonate segregations recorded (the Field Handbook's usual limit for the k); a B or BC recorded without k and without them is not one; a cemented one (km) is undecided, as a calcrete pan is not a horizon holding fragments of one; a horizon of unknown role in the present soil (a row below the description included) may be one, unless it has less than 2 % visible carbonate recorded. Hypocalcic: each clause is said of the soil, so either the whole solum shows its carbonate only as a slight to moderate effervescence with no visible carbonate, or every horizon of the solum has less than 2 % soft carbonate (the 'and/or': either route), and every horizon has less than 20 % hard carbonate. Carbonatic: calcareous throughout the solum, and more than 40 % fine-earth CaCO3 by analysis in the major part of its upper 0.1 m; without the analysis, a slight or moderate effervescence there rules it out (the Hypocalcic text reads it as the weakest expression of carbonate) and anything stronger leaves it undecided, as the visual estimate of 'dominantly fine earth carbonate' is not recorded. Hypergypsic: gypsum (caso4_pct) over 50 % in the major part of the solum; 50 % CaCO3 or more rules a horizon out; a soil made of gypsum crystals is conspicuous, and with no gypsum recorded it is read as absent, as for the Hydrosol settings. On NatSoil, a calcareous segregation of unknown form may be soft or hard, a segregation of unrecorded or unidentified nature may be calcareous, and a coarse fragment of unknown lithology may be calcrete, and each abundance class is read as lying strictly between its limits, several records being added as ranges (two records of 2-10 % and 10-20 % make 12-30 %): the reader keeps an amount only when what is recorded leaves it in one class of the table (since 0.9.282; before, the classes were added at their middle). Coarse fragments not recorded are read as none, as for the Arenosols; segregations not recorded leave them unknown."
  - topic: "Peaty, humose, melacic and melanic horizons (Chernic suborders)"
    page: "Arenosols and Tenosols, suborders Chernic and Chernic-Leptic; glossary 'Peaty horizon', 'Humose horizon', 'Melacic horizon', 'Melanic horizon'"
    reading: "'Surface or near surface' is read as starting at the top of the profile (an O1 litter left out) for the peaty horizon (organic materials, P or O2, at least 0.2 m), and at the mineral surface below it for the others. Humose: the upper 0.2 m of the mineral soil, not organic material, with a thickness-weighted organic C above 4 % with no clay to 6 % or more at 60 % clay, proportionally (lab clay, or the clay range of the field texture; within that range undecided); organic C not measured there leaves it undecided, and a profile that ends on rock or a hard layer before 0.2 m has none. Melacic and melanic: rows from the mineral surface black when moist (value 3 or less, chroma 2 or less) with a dry value of 5 or less, at least 0.2 m (within the A horizons when the soil has a clear or abrupt textural B); no dry colour leaves a black row undecided. Melacic when the pH (1:5) is below 5.5 over the major part; melanic when it is 5.5 or more and the major part has a moderate or strong grade with the most common peds 20 mm or smaller (ped_size_max_mm), waived for an Ap or a dry strength of weak or less. Either of the four is a Chernic horizon. The dark horizon may end at any row from the last surely black one to the last that may be black, or within a gap in the record; a gap inside it is part of it, of unknown kind; one that reaches the end of the description above no rock may go on below it; melacic, melanic, and either of them for the suborders, hold only when they hold for every extent it may have (since 0.9.287 for the suborders, which read only the surely black rows when they reached 0.2 m, and dropped a gap directly above the first row that may not be black). That gap may also be organic material, for the peaty horizon and for where the mineral surface lies; the surface may lie at the start of a gap, at either end of a row that may be organic material, or at the end of the organic rows, and a verdict holds only when it holds for each. Over a clear or abrupt textural B a row of unknown role between two A horizons is an A horizon, and one above the first B may be (since 0.9.287). 'Little if any evidence of stratification' is not read."
  - topic: "Conspicuously bleached A2 horizon"
    page: "Suborders Bleached, Bleached-Leptic, Chernic; glossary 'Conspicuously bleached A2 horizon'"
    reading: "An A2 horizon (an E of the FAO or USDA notation) is conspicuously bleached when 80 % or more of it is bleached: dry value 7 or more and chroma 4 or less, or value 6 or more and chroma 4 or less where an adjacent horizon has a hue of 5YR or redder (dry hue, else moist; an unrecorded neighbouring hue leaves value 6 undecided, a neutral hue is not redder); a matrix with more than 20 % mottles is less than 80 % bleached, and a bleached matrix whose mottles are not recorded is undecided (as for the Hydrosols). In the Australian notation the Field Handbook marks a conspicuously bleached A2 with an e (read as one) and a sporadically bleached one with a j, or the older sb (not conspicuous); an A2 with neither is read by its dry colour and is undecided without one, since the glossary defines the bleaching by the dry colour, not by the notation (on NatSoil several surveys write A2 for bleached horizons). A row of unknown role with a bleached or unknown dry colour may be one. The Chernic suborders require that no conspicuously bleached A2 be present; Chernic-Leptic allows 'an unbleached A2', which is read the same way."
  - topic: "Leptic suborders"
    page: "Rudosols and Tenosols, suborders Leptic, Chernic-Leptic, Bleached-Leptic"
    reading: "Underlain within 0.5 m of the surface (the top of the profile, an O1 litter left out) by a calcrete pan, hard rock or other hard materials, or partially weathered or decomposed rock or saprolite: an R horizon, a hard layer (moderately or more cemented, or marked m, a calcrete pan included), or a C horizon whose layer or rock origin names saprolite or weathered rock, with its top at 0.5 m or less. A C horizon of unrecorded origin, a C/B, or a D horizon, may be saprolite or unconsolidated material (which the suborders do not list) and leaves it undecided; a C of sedimentary origin does not count. With none of these, the soil is not leptic when the description goes below 0.5 m, and undecided when it stops at or above it, as what lies below is not described. On NatSoil many surveyed Leptic Tenosols are described below 0.5 m with no rock: they are read as not leptic."
  - topic: "Highly saline; Hypergypsic and Hypersalic suborders"
    page: "Arenosols and Rudosols, suborders Hypergypsic, Hypersalic, Stratic"
    reading: "Highly saline is an EC of a 1:5 extract (ec_1to5_dS_m; NatSoil method 3A1) above 2 dS/m over the major part, by their thickness within the upper 1.0 m, of the measured horizons; below 2 there is not highly saline (EC exactly 2 is neither, and fits no suborder that needs either). With no EC, a soil whose site records a saline surface or salt crust is undecided, and any other is read as not highly saline: high salinity shows at the site, as the salinised surface of the Salic Hydrosols (a setting the record does not mention is absent). Hypergypsic: not highly saline and gypsum (caso4_pct) over 50 % in the major part of the described upper 1.0 m; no gypsum recorded is read as absent, as for the Calcarosols. Hypersalic: highly saline, with no permanent or seasonal water table (saturation days recorded, or a poorly or very poorly drained site, is one; moderately well drained or better is none; imperfectly drained or an unknown class is undecided) and no evidence of episodic wetting (mottles recorded in a horizon; mottles not recorded are undecided, as for the Hydrosols)."
  - topic: "Suborders on unconsolidated material (Rudosols; Stratic Arenosols)"
    page: "Rudosols, suborders Shelly, Carbic, Arenic, Lutic, Stratic, Clastic; Arenosols, suborder Stratic; glossary 'Carbic materials'"
    reading: "Gravel: more than 10 % coarse fragments in some layer is gravelly (Clastic); less than 10 % in every layer is not or only slightly gravelly (Arenic, Lutic, Stratic); a missing coarse fragment record is read as none, as for the Arenosols; exactly 10 % fits neither. Stratification (distinct sedimentary layers or buried soils): a lithologic discontinuity (a numeric prefix, 2C) or a buried horizon in the profile; without designations undecided. Arenic: not gravelly, unstratified, dominantly sandy (S, LS, CS over the major part) with no layer over 15 % clay (SL+ or heavier), and loose or weakly coherent both moist and dry: a single-grain structure, or a strength of weak or less recorded both dry and moist (strength_dry, strength_moist; Field Handbook classes); firm or stronger in either state is coherent; one state of weak or less with the other unrecorded is undecided. Lutic: not gravelly, unstratified, and its sandy material coherent (not loose or weakly coherent). Stratic: stratified, not gravelly, not highly saline. Shelly: dominantly shell fragments in the major part of the profile, and Carbic: dominantly carbic materials in the upper 0.5 m, read from the layer origin; a material the record does not mention is read as absent (shell deposits and burnt plant debris show)."
  - topic: "Carbonatic and Calsilic Arenosols; Calcenic Tenosols"
    page: "Arenosols, suborders Carbonatic, Calsilic; Tenosols, suborder Calcenic; glossary 'Calcareous', 'Calcenic'"
    reading: "Carbonatic Arenosols: every horizon of the upper 1.0 m of the profile calcareous (as for the Calcarosols order; a description that stops above 1.0 m, not on rock or a hard layer, leaves it undecided), and more than 40 % fine-earth CaCO3 by analysis in the major part of the upper 0.1 m of the profile; without the analysis a slight or moderate effervescence there rules it out and a stronger one leaves it undecided (the visual estimate of 'dominantly fine earth carbonate' is not recorded). Calsilic: calcareous throughout the upper 1.0 m below the A1 or Ap at the surface or below 0.2 m, whichever is shallower, the Comment's 'with the possible exception of the surface'. Calcenic Tenosols: a run of adjacent horizons at least 0.2 m thick with more than 20 % fine-earth carbonate: laboratory CaCO3 decides; without it more than 20 % soft carbonate segregations pass, while fewer say nothing of the carbonate of the fine earth (undecided); a horizon that is not calcareous has none."
  - topic: "Sesqui-Nodular Tenosols"
    page: "Tenosols, suborder Sesqui-Nodular; glossary 'Ferric horizon', 'Bauxitic horizon'"
    reading: "A ferric or bauxitic horizon (more than 20 % ferruginous or ferromanganiferous, or bauxite, nodules or concretions: ferric_nodules_pct, bauxitic_nodules_pct; not in a cemented layer) as one run of adjacent horizons at least 0.2 m thick that is more than half of the depth of the solum, cemented layers left out of it. Only the solum counts, and rows of unknown role in the present soil may belong to it. Nodules not recorded are absent: more than 20 % of nodules shows, and the surveyor records them (since 0.9.285; before, a horizon with no segregation record was unknown). On NatSoil the nodules are the segregations recorded as nodules or concretions of natures F and N (ferric) or A (bauxitic); one whose nature or form is not recorded is not counted; each abundance class is read as lying strictly between its limits and several records are added as ranges, and an amount the recorded classes leave on either side of 20 % is undecided. The carbonate segregations, whose limits are small amounts, stay unknown when not recorded."
  - topic: "Anthroposol suborders"
    page: "Anthroposols, suborders and Comment"
    reading: "The kind of human-made material is read from the layer origin of the anthropic layers: Fusic (fusic material, burnt peat), Cumulic (mill-mud, middens, shells), Hortic (composts, mulches, organic wastes, sewage sludge), Garbic (landfill of refuse), Urbic (rubble, building, construction or industrial waste, or urbic artefacts recorded), Dredgic (dredged or slurried material, tailings), Spolic (spoil, mine waste, overburden, earthmoving) and Scalpic (a surface cut by machinery). Fusic also needs surface layers of 0.3 m and Cumulic a deposit of 0.3 m (a layer of unknown thickness leaves them undecided; a gap in the record within the layers, or directly above the first layer of another kind, may be of the same material, since 0.9.287). An origin naming another kind rules a suborder out; one naming none (for instance only 'fill material') leaves them undecided, as the Comment leaves the boundaries to knowledge of the process; urbic artefacts alone do not tell Urbic from Spolic, which may hold a few."
  - topic: "Colour suborders of the Arenosols and Tenosols"
    page: "Arenosols and Tenosols, colour suborders"
    reading: "The window is the upper 1.0 m (Arenosols) or 0.5 m (Tenosols) of the profile, from its top (an O1 litter left out) and above rock and any buried soil, or the whole of it when thinner; the dominant class as for the other colour suborders (the major part, else the largest share, a tie undecided)."
  - topic: "Great groups: the list under the order and suborder"
    page: "Order pages, great groups"
    reading: "Each order page gives one list of great groups for all its colour suborders; it is applied under each of them, and the name is the great group's with the suborder's ('Eutrophic, Red Chromosol'). The key looks the list up by the codes of the path to it ('CH-AA'), since the suborder codes repeat from order to order. A soil that fits no great group of its list keeps the suborder's name, as the text gives no 'other soils' class for these lists. The 1.5 m guide of the glossary ('Diagnostic features': a feature that begins deeper than 1.5 m may be disregarded) is not applied: features are read wherever they are described."
  - topic: "Pans in or under the B (Duric, Petroferric, Petrocalcic, Placic)"
    page: "Kurosols to Kandosols, great groups; glossary 'Red-brown hardpan', 'Petroferric horizon', 'Ferricrete', 'Calcrete pan', 'Thin ironpan', 'Cemented pans'"
    reading: "A pan is read from pan_type (Field Handbook kinds: red-brown hardpan, calcrete, ferricrete, alcrete, thin ironpan, silcrete; 'none' when recorded absent) or from the designation (km a calcrete pan, sm without h a thin ironpan, qm a silcrete, cm a ferricrete, as the glossary's Bcm). A duripan may be a red-brown hardpan (the glossary calls it one of the silica pans known as duripans) and leaves Duric undecided. A cemented layer of no recorded kind, an m of no named kind, or 'other pan' may be one and leaves it undecided; a pan of another named kind, pan_type 'none', or no pan and no cemented layer recorded is not one: pans are hard and show, and the surveyor records them, as the order reads hard layers. 'Within or directly underlying the B' is any B horizon, a B-designated pan included, or the row whose top is the bottom of the deepest B that is not a pan (a pan under another pan lies under substrate); for whether the B is calcareous a cemented pan (m) is not part of the B (the glossary counts pans as substrate features, not B horizon development); 'within the solum' (Kurosols, Sodosols, Chromosols, Petroferric) is any solum horizon. Duric: a red-brown hardpan. Petroferric: ferricrete or a petroferric horizon (alcrete included), and for the Dermosols and Kandosols a petroreticulate horizon. Petrocalcic: a calcrete pan in or under the B with B horizons directly over it, and none of the B horizons over it calcareous (a calcareous BC below the pan does not count). Placic: a thin ironpan."
  - topic: "Great groups of the B2t and B2: Pedaric, Subplastic, Magnesic, Natric, base status"
    page: "Kurosols to Kandosols, great groups; glossary 'Base status', 'Dystrophic', 'Mesotrophic', 'Eutrophic', 'Sodic', 'Strongly subplastic'"
    reading: "The windows are those of the order: the whole B2t (the B2 horizons from the clear or abrupt textural B down) or its upper 0.2 m (Kurosols, Sodosols, Chromosols), the B2 or its upper 0.2 m (Ferrosols, Dermosols, Kandosols); 'major part' is more than half of the window by depth; rows of unknown role that may belong to it are tried in and out. Base status: exchangeable Ca + Mg + K + Na of the fine earth x 100 / clay %, in cmol(+)/kg clay; lab clay, or the clay range of the field texture, which decides only when the whole range gives one class (the Field Handbook tables that approximate base status from field texture are not used); below 5 dystrophic, 5 to 15 mesotrophic, above 15 eutrophic; Eutrophic also needs every B and BC horizon not calcareous. Magnesic: exchangeable Ca/Mg below 0.1 (cmol(+)/kg). Natric (Kurosols) and the sodic part of Magnesic-Natric: sodic (ESP 6 or more, as for the Sodosols) over the major part of the upper 0.2 m of the B2t. Subplastic: strongly subplastic over the major part of the B2t or B2; a horizon with no record is read as not strongly subplastic, as for the order. Pedaric: every row of the upper 0.2 m of the B2t or B2 with a strong blocky or polyhedral structure and peds that hold together very weakly ('a spade enters very easily when dry'; the text adds that the salts usually make the soil weak when dry): a dry strength of weak or less passes, firm or more fails; the bulk density, salt and subplasticity the text gives as usual are not required. Rows of unknown role that may be in the window (at or below its start, and for the upper 0.2 m within 0.2 m of the first known B2 there, when there is one) are tried in and out, every combination of them (up to eight; with more, undecided), as for the order gates."
  - topic: "Sodosol great groups"
    page: "Sodosols, great groups"
    reading: "Effervescent: the fine earth of every horizon of the solum effervesces with 1 M HCl (effervescence_class, or 0.5 % CaCO3 or more; no record and a pH below 7 is not effervescent). The ESP classes over the major part of the upper 0.2 m of the B2t: 6 to less than 15 Subnatric, 15 to 25 Mesonatric, above 25 Hypernatric (ESP as for the order, not calculated where the CEC is 3 or less and Na 0.3 or less); the Mottled ones need one major part that is both in the class and mottled (a mottled horizon, as for the Hydrosols). An upper B2t whose ESP spreads over several classes with none over its major part fits none."
  - topic: "Ferrosol and Kandosol great groups"
    page: "Ferrosols and Kandosols, great groups"
    reading: "Leptic as for the suborders; the Kandosol text does not name a calcrete pan, which is read as one of its 'other hard materials' (moderately cemented or more). Calcareous (Ferrosols): some part of a B or BC horizon calcareous. Mellic (Kandosols): massive to weakly structured B horizons, very porous, with a weak consistence strength when moist; soilKey records no porosity, so a pedal B (moderate or strong) or a moist strength of firm or more rules it out and it is otherwise undecided. Andic (Kandosols): andic properties in basaltic tephric materials; the tephric parent material shows in the field, so with no layer or rock origin naming tephra or volcanic ash the soil is not Andic, and with one the andic properties are undecided (they are not tested here). The carbonate classes (Chromosols, Dermosols, Kandosols) as for the Calcarosol suborders."
  - topic: "Vertosol great groups: the surface"
    page: "Vertosols, great groups and Comment; key to orders, step 4"
    reading: "The site record (site$surface_condition) is read item by item (a qualifier standing alone after a comma stays with its item), an item that negates a condition ('no surface crust', 'non-crusting', 'surface crust absent', 'uncrusted', 'not self-mulching') not counting. Self-mulching: an item naming a self-mulching surface that is not weak; the text asks for a moderately to strongly self-mulching surface and gives a weakly self-mulching one to Epipedal, and its Comment asks that the great group be used only where the condition is not in doubt, the pedal surface being recorded otherwise, so a surface the record does not show as self-mulching is not self-mulching. A surface flake is neither self-mulching nor a crust (the text names it under both Self-mulching and Epipedal), and a hard-setting surface is not a crust. A surface crusty horizon is a surface crust item in the site record (a salt or saline crust is not one), or a surface horizon 30 mm thick or less that is massive or weakly structured, as the text describes it ('a massive or weakly structured surface crusty horizon 30 mm or less thick'; the order key excepts the same thin horizon from its clay rule); a thin surface horizon of moderate or strong grade is not one. The A horizon is the run of A horizons from the top of the profile (A1, A2, A3, AB, A/B, AC; an O1 litter left out); without designations, the first row when it is mineral. A peaty horizon at the surface (organic materials at least 0.2 m, as for the Chernic suborders; measured organic C decides whether a horizon is organic, the designation where it is not measured) leaves no pedal, massive or crusty surface A; a thinner organic layer at the top (or a P or O2 whose organic C falls short of organic material) is passed over, and the surface is the mineral horizon below it; a gap in the record at the surface leaves the surface undecided. A profile whose designations put another horizon than an A at the surface has no pedal or massive A: Epipedal and Massive need an A horizon. Epipedal: the major part of the A pedal (moderate or strong) with blocky or polyhedral peds, not self-mulching, and no surface crusty horizon; granular, platy or lenticular peds are not blocky or polyhedral. Crusty: a surface crusty horizon, not self-mulching, over pedal clay with blocky or polyhedral peds over the major part of the A below the thin horizon (or of the horizon directly below it, when the A is no thicker). Massive: the major part of the A 'massive or weak blocky', read as the text has it: massive (structureless, or apedal, but not single grain), or weak with blocky peds (an A of granular, platy, polyhedral or lenticular peds is not, whatever its grade), and no surface crusty horizon. Peaty: a peaty horizon at the surface, as for the Chernic suborders. On NatSoil, several surveys record the crust as a thin A11 (1 to 3 cm, massive or weak) over a pedal A12, and these are read as Crusty."
  - topic: "Calcarosol great groups"
    page: "Calcarosols, great groups; glossary 'Argic horizon', 'Marl', 'Calcrete pan', 'Red-brown hardpan'"
    reading: "What the soil directly overlies is the row whose top is the bottom of the deepest solum horizon that is not a pan (a lamellae horizon above the first C, D or R is B material and part of the solum); rows of unknown role that may be part of the present soil are tried out of the solum and then in it, and the answer holds only when both agree. Duric and Petrocalcic: a red-brown hardpan or a calcrete pan there, or a pan designated within the solum (an m horizon of the present soil), read as for the other orders (pan_type or the designation); when the record has a gap below the solum, a pan first below it may still lie directly under the soil and leaves the group undecided; with no pan recorded the soil has none, and a description that stops at the base of the solum has none either. Lithic: an R horizon. A cemented pan (an m horizon, or a recorded pan of a cemented kind: fragipans, densipans and cultivation pans are not cemented, and an 'other pan' is a pan when the layer is moderately cemented or more, else undecided) is none of the four substrates; another layer moderately cemented or more is not unconsolidated material nor marl, but may be hard rock or a cemented saprolite, and leaves those undecided. Paralithic: a layer or rock origin naming saprolite or weathered or decomposed rock. Marly: an origin naming marl. Regolithic (unconsolidated mineral materials): a sedimentary origin (alluvial, aeolian, colluvial or solimovic, marine, lacustrine) or a buried soil. A C or D of unrecorded origin may be any of these and leaves them undecided, and so does a description that stops at the base of the solum. Rendic (Hypercalcic only, as the text says): the A horizon (A1, A2, A3, AB, A/B) directly over a Bk whose soft carbonate (as for the suborders) is more than 80 %; a row with no designation there, or one of unknown role, may be a Bk. Argic: an argic horizon, distinct clay lamellae, within the B: a B designation naming lamellae, or a lamellae horizon (B material in bands) above the first C, D or R, read from the designation; lamellae are conspicuous, and with none recorded there is none; lamellae named in an A or C are not within the B. Pedal: the major part of the B horizons of moderate or strong grade (an even split is not the major part); rows of unknown role that may be B horizons are tried in and out, and with no B designated they decide only when none of them is pedal."
  - topic: "Podosol great groups"
    page: "Podosols, great groups; glossary 'Podosol diagnostic horizons'"
    reading: "The kinds of Podosol B are read from the designations of the B horizons that make the order (Bs without h, Bhs, Bh without s; buried horizons left out); a Basi is a cemented B (marked m, or recorded moderately cemented or more) with neither h nor s directly under a Bh, and a missing depth between them leaves it undecided. 'Only a Bs (Bhs, Bh) horizon' and the pairs (Bhs/Bs, Bh/Bs, Bh/Bhs, Bh/Basi) are read as the set of kinds present, which must be exactly the one named; rows of unknown role that may be Podosol B may add any kind (and a Basi, when such a row is cemented, or when it lies over a cemented B and may be a Bh), so a set is decided only when they cannot change it: it fails when a kind outside it is present or a kind it needs cannot come from them, and is undecided otherwise. Each suborder keeps its own list as printed: the Aeric list has no Humic group and the Semiaquic list no Humosesquic/Sesquic, so those soils keep the suborder's name; the Aquic-Sulfuric, Aquic-Hypersulfidic and Aquic lists have Humic ('Bh horizon', per the errata) and Humic/Alsilic. Pipey (pipes of bleached A2 into the B): a tongued lower boundary of an A2 or A3 (boundary_topography; NatSoil records the boundary shape) may be one and leaves it undecided; with none recorded the B is not pipey."
  - topic: "Organosol great groups"
    page: "Organosols, great groups; glossary 'Hypersulfidic material', 'Hyposulfidic material', 'Sulfidic materials', 'Sulfuric material', 'Strongly acid'"
    reading: "Folic: more or less freely drained (well drained or better passes, imperfectly drained or worse fails, moderately well drained or an unknown class is undecided) with organic materials as in Definition (ii) of the order, read as the order reads it (organic materials from the surface at least 0.1 m thick, directly over rock or a hard layer, or over mineral material no thicker than they are). The upper 1.5 m is that of the profile, buried horizons included and R horizons left out (rock is not soil material); where it is not all described (the description stops above 1.5 m, a depth is missing, or the record has a gap), the part not described may hold sulfuric or sulfidic material; a description that ends on rock or a hard layer is complete below that layer, but not above it. Sulfuric: a run of sulfuric material at least 15 cm thick that starts within the upper 1.5 m (it may go on below it), as for the Hydrosols. The groups the notes put in place of Sulfuric or Sulfidic 'where appropriate evidence is available' are used only with the incubation test: Hypersulfidic with hypersulfidic material within 1.5 m (an incubation pH below 4 whose drop cannot yet be told, for want of the field pH, leaves it undecided); Hyposulfidic with sulfidic S of 0.01 % or more, a field pH of 4 or more and no substantial drop (0.5 unit or more) to below 4 on incubation, as the glossary defines it, so a drop of less than 0.5 unit to just below 4 is hyposulfidic, and a missing field pH or sulfidic S leaves it undecided; soilKey records no test for monosulfidic material, so the three Monosulfidic groups are not used. Sulfidic: sulfidic materials within 1.5 m, read as sulfidic S of 0.01 % or more (or hypersulfidic material); where the test was not done the group is undecided, as for the other laboratory tests, so most Organosols on NatSoil keep a provisional great group. Calcareous, Basic, Acidic: the major part of the organic materials (not buried) by thickness calcareous; neither calcareous nor strongly acid; strongly acid (as for the orders); a layer whose organic status is undecided is tried in and out."
  - topic: "Great-group lists of the Hydrosols, Arenosols, Rudosols and Tenosols"
    page: "Hydrosols, Arenosols, Rudosols and Tenosols, great groups"
    reading: "Each list is applied under the suborders its heading names. The Hydrosol page says that no great groups are proposed for the Subtidal and Subaqueous suborders, but heads its first list 'Subtidal, Intertidal and Subaqueous Hydrosols' (with groups such as Faunic, Argillaceous and Lutaceous made for those soils); the list is applied to all three, its heading being the key itself. The Chernic Arenosols take the list of the Bleached and coloured ones, as the page says; Epibasic and Hypervescent apply to the Calsilic Arenosols only (Comment). The Hypergypsic and Stratic Arenosols, and the Hypergypsic, Carbic, Lutic and Stratic Rudosols, have no great groups. The groups that replace Sulfuric or Sulfidic 'where appropriate evidence is available' are placed before the group they replace and pass only with that evidence."
  - topic: "What the soil directly overlies (Arenosols, Rudosols, Tenosols; Calcarosols)"
    page: "Arenosols, Rudosols, Tenosols and Calcarosols, great groups; glossary 'Unconsolidated mineral materials', 'Marl', 'Siliceous pan', 'Reticulate horizon', 'Coquina'"
    reading: "'Overlie' in the Arenosol and Tenosol lists is read as 'directly overlie', as in the Rudosol and Calcarosol lists and in the common sense of the word (a Lithic soil rests on rock): the layer right under the solum (the deepest A or B horizon that is not a pan; a lamellae horizon above the first C, D or R counts as B material), rows of unknown role that may belong to the solum tried out and in. In A1 over C over R the soil directly overlies the C, not the rock. Lithic: an R horizon; a C or D of unrecorded origin is not hard rock (a row of unknown role may be), and a layer moderately cemented or more that is no pan may be. Paralithic: an origin naming saprolite or weathered rock. Marly: marl, and sandy material is not marl. Regolithic: a sedimentary origin or a buried soil; for the Bleached and coloured Tenosols the B horizon must directly overlie it ('the B horizon directly overlies'), so a Tenosol with no B is not Regolithic. A C of unrecorded origin may be saprolite, marl or unconsolidated material and leaves those undecided; a description that stops at the base of the solum leaves them all undecided. Pans as for the other great groups (pan_type or the designation, and ferricrete, a petroferric or petroreticulate horizon, or silcrete named by the layer origin, or by the rock origin of a C, D or R horizon (that of an A or B horizon is its parent rock), as the material of the layer, not a loose or transported form of it: the pan itself when the layer is cemented, undecided when no cementation is recorded): Duric a red-brown hardpan, Petrocalcic a calcrete pan, Petroferric ferricrete, a petroferric or a petroreticulate horizon, Silpanic a siliceous pan (silcrete); a pan within the solum counts, and one first below a gap in the record leaves the group undecided. A horizon recorded as a pan that makes up the layer (pan_type ferricrete, silcrete, calcrete, a red-brown hardpan and the like) is a pan whatever its designation, in the solum or under it; one recorded with a thin pan (a thin ironpan, a band of a few millimetres within it), an unnamed one, or one the origin names, is a pan only when the horizon is moderately cemented or more. A reticulate horizon and a coquina substrate (named, or a shelly layer that is cemented) count only when the record names them. In the Arenosols the hard layers count only from 1.0 m down, as the page says: rock, saprolite, pans, a reticulate horizon (the Comment counts Ferric-Reticulate among the groups with a ferric horizon over a hard layer) and the C/B of the Inceptic group (in fissures of rock or saprolite); a ferric horizon over them may begin higher. In A1 over AC over R the AC is part of the solum (the first letter dominates), so the soil overlies the rock; a horizon recorded as a cemented pan is a pan whatever its designation."
  - topic: "Hydrosol great groups"
    page: "Hydrosols, great groups; glossary 'Organic materials', 'Calcareous', 'Mottles'"
    reading: "The acid sulfate groups as for the Organosols (Histic-Hypersulfidic and Histic-Hyposulfidic also need organic materials over the major part of the upper 0.5 m). Histic: organic materials (read as the order reads them) over the major part of the upper 0.5 m of the profile; Faunic: other organic-rich materials such as faunal debris (a layer origin naming shells, coral, guano, bone or faunal debris) over it, absent unless recorded. Epicalcareous: the major part of the upper 0.5 m calcareous. Argillaceous, Lutaceous, Arenaceous: 'dominantly clay-, silt- or sand-sized' read as more than half of the fine earth over the major part of the upper 0.5 m, by lab particle size (another fraction above 50 % rules one out, and a fraction is the remainder of the other two when both are measured), else by the field texture where it tells (a sand, loamy sand or clayey sand is sand-sized; a medium heavy or heavy clay, more than 50 % clay, is clay-sized and not sand- or silt-sized; a texture with at most 50 % clay is not clay-sized); lab clay alone does not tell sand from silt. Mottled and Haplic: the major part of the upper 0.5 m mottled or whole coloured, mottles read as for the Hydrosol suborders. Gypsic and Halic as below. Petroferric: a petroferric horizon anywhere in the profile. The '-solic' groups key the soil as the orders would apart from wetness: Calcarosolic calcareous as for the Calcarosol order and no clear or abrupt textural B; Kurosolic as the Kurosol order; Sodosolic a textural B sodic and not strongly acid over the major part of the upper 0.2 m of the B2 (as printed, not the Sodosol order's subplasticity); Chromosolic a textural B not strongly acid there; Dermosolic, Kandosolic and Arenosolic as those orders; Tenosolic not a Rudosol (the Tenosols are the other soils of the order key, after the Rudosols); Rudosolic as the Rudosol order."
  - topic: "Horizons and materials of the Arenosol, Rudosol and Tenosol great groups"
    page: "Arenosols, Rudosols and Tenosols, great groups; glossary 'Ferric horizon', 'Bauxitic horizon', 'Manganic horizon', 'Gypsic horizon', 'Argic horizon', 'Tephric materials', 'Gritty', 'Wet panning'"
    reading: "Ferric, bauxitic and manganic horizons: more than 20 % ferruginous, bauxite or manganiferous nodules or concretions over a run of adjacent horizons at least 0.1 m thick, not cemented and not buried; nodules not recorded are absent, and read from NatSoil, as for the Sesqui-Nodular Tenosols (manganiferous: nature M); 'within the solum' as for that suborder (a row of unknown role between two solum horizons is solum); 'the A2 horizon contains or overlies a ferric horizon' (Bleached-Leptic Tenosols): a run that starts within the A2 (an A3 is not the A2) or at its lower boundary, undecided when the designations show no A2 but a row of unknown role may be one. Gypsic horizon: more than 20 % visible gypsum (gypsum_visible_pct) over at least 0.1 m, its upper boundary within 0.5 or 1.0 m as the list says (the glossary disregards one below 1.0 m); without visible gypsum recorded, lab gypsum of 20 % or less rules a horizon out and more leaves it undecided; with no gypsum recorded the soil has none, as for the Hypergypsic suborders (on NatSoil the gypseous segregations, read as the nodules). Argic: lamellae from the designation, anywhere, within the solum or within the B as the list says. Inceptic: a C/B horizon (the notation says B material in parts of the C). Tephric: a layer or rock origin naming tephra, volcanic ash, pyroclastics, scoria, cinders, pumice or lapilli (for the Clastic Rudosols, the major part of the gravelly layers); Andic as for the Kandosols. Gritty: the major part of the upper 1.0 m with a distinct gritty feel (gritty); Gravic: the major part of the upper 1.5 m with more than 3 % heavy or opaque minerals (heavy_minerals_pct); neither is recorded on NatSoil, and not recorded is read as absent: a gritty feel and visible heavy minerals show, and whoever classifies without a record of them goes on to the next class. Halic and Subhalic: the major part of the upper 0.5 m with more than or less than 50 % halite crystals (halite_visible_pct); halite not recorded is absent, so a Hypersalic Arenosol with none recorded is Subhalic. Kandic, Tenic, Palic: the field texture of the layers other than the surface horizon (SL but not SL+ is about 10-15 % clay; LS and CS 5-10 %; S under 5 %), lab clay where it is not recorded; a part of the upper 1.0 m not described may hold such a layer, which leaves Kandic and Tenic undecided. Epibasic: not calcareous in the A1 or Ap at the surface, else in the upper 0.2 m. Hypervescent: the major part of the upper 0.1 m with more than 20 % fine-earth carbonate (carbonate_soft_pct), or a strong effervescence, or more than 8 % by analysis; no effervescence rules it out. Arenic Tenosols: less than 20 % coarse fragments throughout (as the page says, not the 10 % of the Arenic Rudosols), loose or weakly coherent both moist and dry, sandy in more than 80 % of the profile, no layer with more than 15 % clay. Clastic Rudosols: Colluvic (scree, talus, landslide, mudflow, creep, colluvial) and Fluvic (alluvial, stream, beach, wave) from the layer origin of the major part of the gravelly layers, absent unless recorded; Lithosolic the other Clastic Rudosols. The carbonate classes as for the Calcarosol suborders."
  - topic: "Subgroups: the lists and the names"
    page: "Order pages, subgroups; 'Using the classification' (nomenclature)"
    reading: "Each order page gives one list of subgroups for all its great groups (the Tenosols one per suborder), and says that not every subgroup applies to every great group; the list is applied under each of them, first match deciding, except where the page names an exclusion: the Kurosol page says the Sodic classes are not required for the Natric great groups, so the Natric and Magnesic-Natric Kurosols take the list without Bleached-Sodic, Mottled-Sodic and Sodic; the Kandosol page says the acidic subgroups are not required for the calcareous great groups, so the Hypocalcic, Lithocalcic, Supracalcic, Hypercalcic and Calcic Kandosols take the list without the eight with a strongly acid B2 (Humose-Acidic, Melanic-Acidic, Ferric-Acidic, Manganic-Acidic, Acidic-Sodic, Bleached-Acidic, Acidic-Mottled, Acidic). The Dermosol page says only that acidic subgroups are unlikely to be required for the Dystrophic great groups, which is no exclusion. The key looks the list up by the path ('CH-AA-BG'), then by a list for every class under a part of it ('CH-*'). The names follow the general form the book gives, 'Subgroup, Great Group, Suborder Order' ('Bleached, Eutrophic, Red Chromosol'); since 0.9.286 the great groups carry the same comma ('Eutrophic, Red Chromosol'). A soil that fits no subgroup of its list keeps the great group's name. The 1.5 m guide of the glossary is not applied, as for the great groups."
  - topic: "Subgroups of the Kurosols, Sodosols and Chromosols"
    page: "Kurosols, Sodosols and Chromosols, subgroups; glossary 'Vertic properties', 'Sodic', 'Mottled', 'Reticulate horizon', 'Gypsic horizon', 'Siliceous pan'"
    reading: "Peaty, humose, melacic and melanic horizons as for the Chernic suborders, each on its own: melacic or melanic holds only when it holds for every extent the dark horizon may have (it may end at a row that may not be black or at a gap in the record; a gap inside it is part of it, of unknown kind; one under 0.2 m is no horizon; one that reaches the end of the description may go on below it); a conspicuously bleached A2 as for the suborders. Vertic: a B horizon (B1 to BC, pans left out) in which at least 0.3 m, by thickness, has vertic properties (clayey, with slickensides or lenticular peds), rows of unknown role that may be B horizons adding what they may; slickensides not recorded leave a horizon unknown, as for the Ferrosols. Ferric and manganic horizons within the solum as for the great groups. 'At least the lower part of the B horizon is sodic': the deepest B horizon has an ESP of 6 or more (ESP as for the Sodosols); a row of unknown role below it may be the lower part and must agree. Mottled and Haplic: the major part of the B2t mottled, or whole coloured (not mottled), mottles as for the Hydrosols. Reticulate: a reticulate horizon below the B2t, named by the record (it shows: none recorded, none); rows do not overlap, so a row that starts below the top of the deepest B2 lies below it when its bottom is not recorded. Gypsic: a gypsic horizon (as for the great groups) within the B or BC horizons. Silpanic: a siliceous pan in the lower A and/or upper B horizon (an A2, A3, AB, A/B, BA, B/A or B1, or the uppermost B2), pans read as for the great groups; a row of unknown role between two of them is one of them, and one below the A1 that starts above the bottom of the uppermost B2 may be (rows do not overlap: with that bottom unrecorded, one that starts below its top lies below it). Magnesic and the base status classes over the major part of the B2t, as for the great groups; the carbonate classes as for the Calcarosol suborders; Effervescent as for the Sodosol great group."
  - topic: "Subgroups of the Dermosols, Kandosols and Ferrosols"
    page: "Dermosols, Kandosols and Ferrosols, subgroups; glossary 'Strongly acid', 'Argic horizon', 'Bauxitic horizon', 'Sodic'"
    reading: "As for the Kurosols, Sodosols and Chromosols, but on the B2 horizon where these pages say B2 (mottled, whole coloured, strongly acid), not the B2t. Acidic: the major part of the B2 strongly acid (pHw below 5.5, or pHCa below 4.6 without pHw), read as the order reads the major part of the B2. Argic and Bauxitic (Kandosols): an argic or a bauxitic horizon within the B horizon (B horizons; rows of unknown role that may be B horizons are open; nodules not recorded are absent, as for the great groups). Sodic in the Ferrosols: at least the lower part of the B2 horizon sodic, as printed (the deepest B2; rows of unknown role read as the order reads the B2, rows below the last designated one not read); in the Dermosols and Kandosols the lower part of the B horizon, also for the Dermosol Acidic-Sodic, whose sentence ('the major part of the B2 horizon is strongly acid and at least the lower part is sodic') is read as the Kandosol page prints the same subgroup ('at least the lower part of the B horizon is sodic'). Acidic-Mottled ('the major part of the B2 horizon is strongly acid and mottled') is read as its name joins Acidic and Mottled: the major part strongly acid and the major part mottled. Snuffy (Ferrosols): an A horizon with a very fine granular structure, peds under 2 mm (the finest size class of the Field Handbook, recorded as 2 mm at most), and a dry strength of weak or very weak (loose is not in that range); a row of unknown role above the first B may be an A; the low bulk density and the water repellence the text gives as usual or possible are not tested."
