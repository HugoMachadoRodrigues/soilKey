# How soilKey reads the Australian Soil Classification (3rd ed., online
# version with errata) where the text is silent or leaves a choice. Pages are
# the sections of the online version: the key to soil orders, the order
# pages and the glossary entries.
readings:
  - topic: "Field texture and lab clay"
    page: "Glossary, 'Field texture'; key to orders (Vertosols, Calcarosols, Arenosols)"
    reading: "Where a limit is a field texture grade (sand, loamy sand and clayey sand for the deep sandy profiles; a clay field texture for the Vertosols), field_texture decides; without it, lab clay stands in at 10 % clay, undecided within 2 points. For the Vertosols the key itself gives both ('a clay field texture or 35 % or more clay'), and either one passes a horizon. For the 15 % clay of the Kandosols and Arenosols, lab clay decides and otherwise the field texture, as the key equates them: SL+ (heavy sandy loam) or heavier exceeds 15 %, a plain or light sandy loam and the sands do not. Elsewhere, where a limit is in % clay, a field texture stands in as the clay range the glossary gives its grade, a '+' or '-' taking the upper or lower half; the range decides only when every value in it gives the same answer."
  - topic: "Notation of the designations"
    page: "Glossary, 'Horizon'; Field Handbook notation"
    reading: "site$designation_system decides when present ('asc' and its synonyms read the Australian notation). Otherwise a profile is read in the Australian notation when a master is followed by its subdivision digit (A1, A2, B21, B2t) or a P or D master appears and no sign of the FAO or USDA notation does (an E master, a digit after the suffixes as in Bt1, Oi, Oe or Oa), or when the site is in Australia and there is no such sign. FAO and USDA designations are read by the role of each horizon: an A as an A1, an E as an A2, a B with no transition as a B2 (a Bt as a B2t), an O with a or e as an O2 and otherwise an O1, an H as a P horizon. A B written with no digit in the Australian notation (B, Bt, Bs) is read as a B2. Older and variant forms are read too: only the first word is read (a note such as 'lamellae' or '(weak)' after it is dropped) and a trailing '?' is dropped; a designation in capitals gets lower-case suffixes (CK is a Ck, B2WT a B2wt, while BC stays a BC; a P, D or R after an A, B or C, and a master repeated without a digit, are suffixes: AP is an Ap, B2D a B2d, 2B2B a buried B2); two masters with digits are a transition (A2B and A3B1 an AB, B3C a BC, B22/C a B/C), and two parts of one master take one role (A1A2 and A1/A2 an A2, as the A2 part is there; B1B2 a B1). The ss of slickensides and the se of sulfides are not an s, and the a, e and i of an O tell its decomposition, not a bleached horizon. A designation naming clay lamellae is read as lamellae (argic horizons), never as a B2. A designation that still cannot be read, or gives a role outside the notation (A0, B5), has an unknown role. In the FAO or USDA notation an AE, EA or A/E is read as an A2. The older codes cb and sb with no lithologic prefix are read as the conspicuous and sporadic bleaching of the row (as e and j), not as burial, concretions or sesquioxides; with a prefix (2A2cb) they are burial. A b needs a cover: a row marked b with no row above it that is not marked b is not buried; nor is a b row in the same material as the row above it with unmarked A or B horizons of that material below it (a b used as a subdivision letter, A2a A2b, or a misprint), since a buried soil has no present soil below it. A horizon right below a buried one with the same lithologic prefix belongs to the buried soil even without its b."
  - topic: "Rows of unknown role"
    page: "Glossary, 'Horizon'; three-valued reading"
    reading: "A row with no designation, or with one that cannot be read, may be a horizon of the present soil when it lies from the top of the A1 (from the surface when the first A horizon is not an A1) down to the first C, D or R below the first A or B horizon, and above any buried soil; it may be part of the B2 only below the A horizons that lie above the first B; there a gate decides only when the answer is the same whatever the row is (a Podosol B, a part of the B2 or of the upper B2t, a part of the solum, a B for the Rudosols), and a row between two solum horizons is solum. For a major part, TRUE holds only with every such row that is not TRUE counted in, FALSE only with every such row that is not FALSE counted in; the upper 0.2 m of the B2t is tried with each set of them (rows starting 0.2 m or more below the first known B2 under the textural B cannot be in it; with more than eight others the test is undecided). Outside that window such rows are not read for their role (they can still be a buried soil under anthropic material). Rows with no designation below the last designated row lie outside the description for the tests that look for a designated horizon (Podosol B, B2), but may still be part of the solum or a B inside the window; their measured properties are always read. A profile with no designations at all leaves every designation test undecided, the textural B included."
  - topic: "Clear or abrupt textural B horizon"
    page: "Glossary, 'Clear or abrupt textural B horizon'"
    reading: "The boundary is the lower boundary recorded for the horizon above (boundary_distinctness: abrupt, clear or sharp pass; gradual or diffuse fail; unrecorded leaves it undecided), and the horizon above must be thicker than 30 mm. The horizon above is 'normally an A but occasionally a B1': an A1, A2, A3, AB, A/B or AC, or a B1 or BA, so a boundary within the B2 is not a textural B; a row of unknown role may be one only above the first B2, B3, BC, C, D or R. The horizon below may be any B under an A (B1, B2, B3, BA, BC), as the glossary sets the clay minimum 'at the top of the B horizon', and a B2, B3 or BC under a B1; clay lamellae are not. A horizon of unknown role may be either, which leaves the test undecided. Buried horizons are not read. A gap, an overlap or a missing depth between the two horizons leaves the test undecided, and so does a description that stops in an A or a B1 (the textural B may lie deeper). Each horizon is read by its field texture grade when it has one, and by its lab clay only when it has none: the glossary gives the limits in clay 'and/or' field texture and notes that where field texture and laboratory data disagree the field texture may be the better guide to how the soil behaves (on NatSoil, field texture first agrees with the surveyors in 104 of the 255 profiles whose order it changes, lab clay first in 56). With lab clay on both sides the glossary's figures decide (below 20 % above: at least double and at least 20 %; 20 to 35 %: at least 20 points more; 35 % or more: no contrast). Otherwise its field-texture equivalents decide: above sandy loam or lighter, the B must be sandy clay loam or heavier with at least double the clay, each side taken at the middle of its grade's range; above loam to clay loam, the B must be light medium clay or heavier (a plain 'clay' B leaves it undecided); above a clay, no contrast."
  - topic: "Upper B2t"
    page: "Key to orders, steps 6-8"
    reading: "The upper 0.2 m of the B2t is measured from the top of the first B2 horizon at or below the textural B, through the adjacent B2 horizons (a gap in the record ends them; a B1, B3 or BC is not the B2t), or the whole of them when they are thinner; with no B2 there (a B3 over rock), the textural B horizon itself. The Sodosols need one major part that is both sodic and not strongly subplastic. 'Major part' is more than half of that thickness by depth; parts with unknown values count as undecided."
  - topic: "Strongly acid"
    page: "Glossary, 'Strongly acid'"
    reading: "ph_h2o is read as the pHw (1:5 water) and decides when present (below 5.5); otherwise ph_cacl2 (below 4.6). A field pH stored in ph_h2o is read the same way."
  - topic: "Sodic and ESP"
    page: "Glossary, 'Sodic', 'ESP'"
    reading: "ESP is exchangeable Na over the CEC, over the effective CEC (ecec_cmol) where the pHw is 5.5 or less, and over whichever is recorded when only one is; without Na or either CEC, the ESP the laboratory reports (esp_pct). A horizon with both CEC and Na very low (CEC 3 cmol/kg or less and Na 0.3 or less), where the glossary advises against computing an ESP, is read as not sodic."
  - topic: "Strongly subplastic"
    page: "Glossary, 'Subplastic'; key to orders, step 7"
    reading: "Read from subplasticity ('strongly subplastic'); a horizon with no record is read as not strongly subplastic, as most descriptions do not record the plasticity type."
  - topic: "Anthroposols"
    page: "Key to orders, step 1; Anthroposols"
    reading: "Recognised from a record of human origin only: artefacts (artefacts_pct above 0) or a layer_origin naming, as whole words, anthropic or technic material, artefacts, spolic, garbic, urbic or hortic material, dredged material, landfill, artificial fill or fill material, made ground, spoil, tailings or mine waste, in a run of layers from the surface. The run starts below any O1 litter, which is outside the solum. Where the run buries a pre-existing soil (a buried horizon, or an A or B horizon, below it) it must be 0.3 m or more thick, as the definition says; otherwise any thickness; rows of unknown role below a thinner run leave it undecided. Without such a record the soil is not an Anthroposol."
  - topic: "Organic materials and saturation"
    page: "Glossary, 'Organic materials'; key to orders, step 2"
    reading: "Organic C of at least 12 % plus 0.1 x clay % (18 % from 60 % clay) where saturated for long periods, or at least 20 % where saturated for a few days at most. Long saturation is read from the site drainage class as for the Hydrosols (very poorly drained); when it is unknown, 20 % or more passes and less than 12 % plus 0.1 x clay fails (clay unknown: less than 12 % fails, 18 % or more passes under long saturation). Measured organic C decides, or leaves the horizon undecided; only where organic C is not measured does an O or P designation count as organic material and any other recognised designation as mineral, and, without a designation, a peat field texture as organic and a mineral field texture grade as mineral. The part of the upper 0.8 m below the description (unless it ends on rock or a hard layer), and layers of unknown organic status, leave the order undecided wherever they could change the answer. Tidal flooding is read from site$tidal_inundation."
  - topic: "Podosols"
    page: "Key to orders, step 3; glossary 'Podosol diagnostic horizons'"
    reading: "Read from the designations only, as the ASC uses no chemical criteria: a B1, B2 or B3 horizon of the present soil marked s or h (Bs, Bhs, Bh), not buried, not a transition (BC, B/C) and not also marked t (a Bts is a textural B with sesquioxides, not an illuvial organic-aluminium B). A Bsm without h (a thin ironpan) does not count. A profile with no designations, or with a designation that cannot be read, leaves the order undecided; a row of unknown role among the designated ones does too (see 'Rows of unknown role')."
  - topic: "Vertosols"
    page: "Key to orders, step 4; Vertosols; glossary 'Vertic properties'"
    reading: "Clayey throughout the solum: a clay field texture (light clay or heavier) or 35 % clay or more in every mineral horizon of the solum, a surface horizon of 30 mm or less excepted; a peaty surface horizon is not tested (the key lets the cracks stop at its base), and a mineral row of unknown role above the first C, D or R may belong to the solum, so a non-clayey one leaves the test undecided. Cracks: cracks_width_cm of 0.5 or more in a horizon, or a cracking surface condition in site$surface_condition (the Field Handbook's cracked surface has cracks 6 mm or wider reaching 0.3 m or deeper). The key's 'unless too moist' waives the cracks when the major part of the solum (by thickness) was described moderately moist, moist or wet (soil_water_status); with no record of cracks and a dry or unknown description the criterion is undecided, and narrower recorded cracks do not rule it out. A surface condition worded in the negative ('uncracked', 'cracks absent', 'no cracks') is not cracking. Slickensides (few or more) or lenticular peds in the solum pass; slickensides recorded absent in every horizon with no lenticular peds fail. Gilgai and self-mulching are not read, as the ASC does not use them in the definition."
  - topic: "Hydrosols"
    page: "Key to orders, step 5; Hydrosols"
    reading: "From water_saturation_days when recorded: more than half of the profile with 90 days or more passes, with fewer than 60 days fails (between is undecided). Otherwise from the site drainage class: very poorly drained passes; poorly and imperfectly drained leave it undecided, as the Field Handbook's poorly drained soil stays wet for several months, which is not yet saturated through most of the profile, and on NatSoil most poorly drained profiles are not Hydrosols in the surveyors' hands; moderately well drained or better (rapidly drained included) fail. Tidal flooding (site$tidal_inundation) passes."
  - topic: "Calcareous"
    page: "Glossary, 'Calcareous'"
    reading: "A horizon is calcareous with a recorded effervescence (slight or stronger), carbonate segregations (secondary_carbonates_pct above 0), 0.5 % CaCO3 or more (the amount that effervesces with 1 M HCl), or a k suffix. With no carbonate record at all, a pHw below 7.0 (or a pHCa below 6.5) is read as not calcareous, since free carbonate holds the pH higher."
  - topic: "Calcarosols"
    page: "Key to orders, step 9; Calcarosols"
    reading: "Calcareous throughout the solum (a mineral row of unknown role above the first C, D or R may be part of it), or in the horizon directly below the A1 or Ap or at 0.2 m, whichever is shallower; rock or a hard layer there is not calcareous soil. The carbonate is taken as pedogenic unless layer_origin names shell, coquina, limestone or marl. Deep sandy profiles (sand, loamy sand or clayey sand in 80 % or more of the upper 1.0 m) are excluded; the part of the upper metre below the description counts as undecided, unless the description ends on rock or a hard layer."
  - topic: "The B2 horizon"
    page: "Key to orders, steps 10-12; glossary 'B horizon'"
    reading: "The B2 is the set of rows with the B2 role (all subdivisions together); rows of unknown role below the A horizons and above the first C, D or R may be part of it, and a major part is decided only when they do not change it. A profile with designations but no B2 has none when its description reaches a B3, BC, C, D or R horizon, or a buried soil, and holds no row that may be a B2; when the description stops in an A or B1 horizon, the B2 may lie deeper (a B1 is dominated by the properties of an underlying B2, and the Kandosols note B2t horizons below 1 m under thick A or B1 horizons), so the orders that need a B2 are undecided. A profile with no designations leaves them undecided."
  - topic: "Ferrosols"
    page: "Key to orders, step 10; glossary 'Free iron oxide'"
    reading: "Free iron oxide is read from fe_dcb_pct (as Fe); more than 5 % over the major part of the B2 by thickness passes. No proxy is used: without free iron the order is undecided and the later orders provisional. At least 0.3 m of the B2 with vertic properties excludes it; a horizon has them when it is clayey (as for the Vertosols) with slickensides or lenticular peds (the strong cracking the glossary adds is not read per horizon); the textural B exclusion is supplied by the key order."
  - topic: "Grade of pedality"
    page: "Glossary, 'Grade of pedality'; Dermosols, Kandosols"
    reading: "Moderate or strong (and a recorded 'weak to moderate') is pedal; weak, structureless, massive and single grain are not. A single-grain B2 is read as apedal for the Kandosols, like a massive one."
  - topic: "Arenosols"
    page: "Key to orders, step 13; Arenosols; glossary 'Lamellae'"
    reading: "No layer within 1.0 m with more than 15 % clay (lab clay, or SL+ or heavier), apart from clay lamellae (a designation naming lamellae). Coarse fragments are averaged by thickness over the upper 1.0 m, a missing record read as none. A hard layer is rock (an R horizon), a moderately or more strongly cemented layer, or a cemented pan (m suffix) starting within 1.0 m; a description shallower than 1.0 m without one leaves that criterion undecided."
  - topic: "Rudosols"
    page: "Key to orders, step 14; Rudosols"
    reading: "Read from the designations: no B horizon of the present soil (a B role, an AB or A/B, or a C/B, whose B material is more than the fissure fillings the definition allows; a mineral row of unknown role above the first C, D or R may be a B and leaves it undecided), no A2 or A3 and no e suffix (a pedological colour change other than the darkening of the A1), and an A1 that is weak, massive or single grain, or no A1. Buried horizons are not read."
  - topic: "Buried soils"
    page: "How to classify, buried soils"
    reading: "Horizons marked b are not read: the soil above them is keyed. When less than 0.3 m of material that qualifies only as a Rudosol lies over the first buried horizon, the ASC classifies the buried soil, with the cover as a phase; soilKey does not do this yet and adds a warning to such a Rudosol (a cover that keys to another order is classified as such, whatever its thickness). Compound names for thicker covers (Stratic Rudosol/Black Vertosol) are not given."
