# Index of the Australian diagnostics (human-readable; the engine reads key.yaml).
system: asc3
reference: "Isbell, R.F. and NCST (2021). The Australian Soil Classification, 3rd ed. (online version, 25 June 2026)."
diagnostics:
  - {function: anthroposol_asc,  file: R/diagnostics-asc.R, reference: "Key to orders, step 1; Anthroposols"}
  - {function: organosol_asc,    file: R/diagnostics-asc.R, reference: "Key to orders, step 2; Organosols; glossary 'Organic materials'"}
  - {function: podosol_asc,      file: R/diagnostics-asc.R, reference: "Key to orders, step 3; glossary 'Podosol diagnostic horizons'"}
  - {function: vertosol_asc,     file: R/diagnostics-asc.R, reference: "Key to orders, step 4; Vertosols"}
  - {function: hydrosol_asc,     file: R/diagnostics-asc.R, reference: "Key to orders, step 5; Hydrosols"}
  - {function: textural_b_asc,   file: R/diagnostics-asc.R, reference: "Glossary, 'Clear or abrupt textural B horizon'"}
  - {function: kurosol_asc,      file: R/diagnostics-asc.R, reference: "Key to orders, step 6; Kurosols; glossary 'Strongly acid'"}
  - {function: sodosol_asc,      file: R/diagnostics-asc.R, reference: "Key to orders, step 7; Sodosols; glossary 'Sodic', 'ESP', 'Strongly subplastic'"}
  - {function: chromosol_asc,    file: R/diagnostics-asc.R, reference: "Key to orders, step 8; Chromosols"}
  - {function: calcarosol_asc,   file: R/diagnostics-asc.R, reference: "Key to orders, step 9; Calcarosols; glossary 'Calcareous'"}
  - {function: ferrosol_asc,     file: R/diagnostics-asc.R, reference: "Key to orders, step 10; Ferrosols; glossary 'Free iron oxide', 'Vertic properties'"}
  - {function: dermosol_asc,     file: R/diagnostics-asc.R, reference: "Key to orders, step 11; Dermosols; glossary 'Grade of pedality'"}
  - {function: kandosol_asc,     file: R/diagnostics-asc.R, reference: "Key to orders, step 12; Kandosols"}
  - {function: arenosol_asc,     file: R/diagnostics-asc.R, reference: "Key to orders, step 13; Arenosols"}
  - {function: rudosol_asc,      file: R/diagnostics-asc.R, reference: "Key to orders, step 14; Rudosols"}
  - {function: colour_suborder_asc,    file: R/diagnostics-asc-suborders.R, reference: "Colour classes (Fig. 3); suborders of the Kurosols, Sodosols, Chromosols, Ferrosols, Dermosols, Kandosols, Vertosols"}
  - {function: aquic_vertosol_asc,     file: R/diagnostics-asc-suborders.R, reference: "Vertosols, suborder Aquic"}
  - {function: peat_suborder_asc,      file: R/diagnostics-asc-suborders-special.R, reference: "Organosols, suborders and Comment; glossary 'Peat'"}
  - {function: b_saturation_asc,       file: R/diagnostics-asc-suborders-special.R, reference: "Podosols, suborders (saturation of the B horizon)"}
  - {function: acid_sulfate_ab_asc,    file: R/diagnostics-asc-suborders-special.R, reference: "Podosols, suborders; glossary 'Sulfuric materials', 'Hypersulfidic material'"}
  - {function: hydrosol_setting_asc,   file: R/diagnostics-asc-suborders-special.R, reference: "Hydrosols, suborders (setting of the soil)"}
  - {function: mottled_profile_asc,    file: R/diagnostics-asc-suborders-special.R, reference: "Hydrosols, suborders Redoxic and Oxyaquic; glossary 'Mottled horizon'"}
  - {function: carbonate_suborder_asc, file: R/diagnostics-asc-suborders-special.R, reference: "Calcarosols, suborders; glossary 'Carbonate classes', 'Calcareous horizon'"}
  - {function: chernic_horizon_asc,   file: R/diagnostics-asc-suborders-rest.R, reference: "Suborders Chernic; glossary 'Peaty horizon', 'Humose horizon', 'Melacic horizon', 'Melanic horizon'"}
  - {function: bleached_a2_asc,       file: R/diagnostics-asc-suborders-rest.R, reference: "Suborders Bleached; glossary 'Conspicuously bleached A2 horizon'"}
  - {function: leptic_asc,            file: R/diagnostics-asc-suborders-rest.R, reference: "Suborders Leptic (calcrete pan, rock or saprolite within 0.5 m)"}
  - {function: saline_suborder_asc,   file: R/diagnostics-asc-suborders-rest.R, reference: "Suborders Hypergypsic and Hypersalic (Arenosols, Rudosols)"}
  - {function: material_suborder_asc, file: R/diagnostics-asc-suborders-rest.R, reference: "Rudosols, suborders Arenic, Lutic, Stratic, Clastic; Arenosols, suborder Stratic"}
  - {function: rudosol_origin_asc,    file: R/diagnostics-asc-suborders-rest.R, reference: "Rudosols, suborders Shelly and Carbic; glossary 'Carbic materials'"}
  - {function: anthroposol_kind_asc,  file: R/diagnostics-asc-suborders-rest.R, reference: "Anthroposols, suborders"}
  - {function: arenosol_carbonate_asc, file: R/diagnostics-asc-suborders-rest.R, reference: "Arenosols, suborders Carbonatic and Calsilic"}
  - {function: calcenic_asc,          file: R/diagnostics-asc-suborders-rest.R, reference: "Tenosols, suborder Calcenic"}
  - {function: sesqui_nodular_asc,    file: R/diagnostics-asc-suborders-rest.R, reference: "Tenosols, suborder Sesqui-Nodular; glossary 'Ferric horizon', 'Bauxitic horizon'"}
  - {function: pan_great_group_asc,   file: R/diagnostics-asc-great-groups-b.R, reference: "Great groups Duric, Petroferric, Placic; glossary 'Red-brown hardpan', 'Petroferric horizon', 'Thin ironpan'"}
  - {function: petrocalcic_asc,       file: R/diagnostics-asc-great-groups-b.R, reference: "Great groups Petrocalcic; glossary 'Calcrete pan'"}
  - {function: pedaric_asc,           file: R/diagnostics-asc-great-groups-b.R, reference: "Great groups Pedaric"}
  - {function: subplastic_asc,        file: R/diagnostics-asc-great-groups-b.R, reference: "Great groups Subplastic"}
  - {function: magnesic_asc,          file: R/diagnostics-asc-great-groups-b.R, reference: "Great groups Magnesic, Magnesic-Natric"}
  - {function: natric_asc,            file: R/diagnostics-asc-great-groups-b.R, reference: "Kurosols, great group Natric"}
  - {function: base_status_asc,       file: R/diagnostics-asc-great-groups-b.R, reference: "Great groups Dystrophic, Mesotrophic, Eutrophic; glossary 'Base status'"}
  - {function: esp_great_group_asc,   file: R/diagnostics-asc-great-groups-b.R, reference: "Sodosols, great groups by ESP"}
  - {function: effervescent_asc,      file: R/diagnostics-asc-great-groups-b.R, reference: "Sodosols, great group Effervescent"}
  - {function: calcareous_b_asc,      file: R/diagnostics-asc-great-groups-b.R, reference: "Ferrosols, great group Calcareous"}
  - {function: mellic_asc,            file: R/diagnostics-asc-great-groups-b.R, reference: "Kandosols, great group Mellic"}
  - {function: andic_great_group_asc, file: R/diagnostics-asc-great-groups-b.R, reference: "Kandosols, great group Andic"}
