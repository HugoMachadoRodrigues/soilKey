# Key to Soil Great Groups, CSSC 3rd ed., Ch 3, pp. 35-36, for the Brunisolic order.
# Criteria are summarised from the book; see R/diagnostics-cssc-great-groups.R
# and inst/rules/cssc3/readings.yaml.

great_groups:
  "I":
    - code: "IA"
      name: Melanic Brunisol
      tests:
        all_of:
          - melanic_brunisol_cssc: {}
      notes: "An Ah or Ap >= 10 cm and pH (CaCl2) >= 5.5 (p. 36)."

    - code: "IB"
      name: Eutric Brunisol
      tests:
        all_of:
          - eutric_brunisol_cssc: {}
      notes: "Other Brunisolic soils with pH (CaCl2) >= 5.5 (p. 36)."

    - code: "IC"
      name: Sombric Brunisol
      tests:
        all_of:
          - sombric_brunisol_cssc: {}
      notes: "An Ah or Ap >= 10 cm and pH (CaCl2) < 5.5 (p. 36)."

    - code: "ID"
      name: Dystric Brunisol
      tests:
        default: true
      notes: "Other Brunisolic soils (p. 36)."
