# Key to Soil Great Groups, CSSC 3rd ed., Ch 3, pp. 35-36, for the Vertisolic order.
# Criteria are summarised from the book; see R/diagnostics-cssc-great-groups.R
# and inst/rules/cssc3/readings.yaml.

great_groups:
  "C":
    - code: "CA"
      name: Vertisol
      tests:
        all_of:
          - vertisol_cssc: {}
      notes: "Surface dry value >= 3.5 if well to imperfectly drained; Ah < 10 cm if poorly drained (p. 35)."

    - code: "CB"
      name: Humic Vertisol
      tests:
        default: true
      notes: "Other Vertisolic soils (p. 35)."
