# Key to Soil Great Groups, CSSC 3rd ed., Ch 3, pp. 35-36, for the Luvisolic order.
# Criteria are summarised from the book; see R/diagnostics-cssc-great-groups.R
# and inst/rules/cssc3/readings.yaml.

great_groups:
  "H":
    - code: "HA"
      name: Gray Brown Luvisol
      tests:
        all_of:
          - gray_brown_luvisol_cssc: {}
      notes: "A forest mull Ah and mean annual soil temperature >= 8 C (p. 36)."

    - code: "HB"
      name: Gray Luvisol
      tests:
        default: true
      notes: "Other Luvisolic soils (p. 36)."
