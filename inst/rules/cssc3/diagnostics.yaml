# Index of the Canadian diagnostics (human-readable; the engine reads key.yaml).
system: cssc3
reference: "Soil Classification Working Group (1998). The Canadian System of Soil Classification, 3rd ed."
diagnostics:
  - {function: cryosolic_cssc,       file: R/diagnostics-cssc.R, reference: "Ch 3 key A, p. 33; Ch 2, p. 16; Ch 6, p. 73"}
  - {function: organic_soil_cssc,    file: R/diagnostics-cssc.R, reference: "Ch 3 key B, pp. 33-34; Ch 2, pp. 17-20"}
  - {function: vertisolic_cssc,      file: R/diagnostics-cssc.R, reference: "Ch 2, pp. 15-17; Ch 13, p. 131"}
  - {function: podzolic_b_cssc,      file: R/diagnostics-cssc.R, reference: "Ch 2, pp. 13-14 and 17; Ch 10, p. 108"}
  - {function: bt_horizon_cssc,      file: R/diagnostics-cssc.R, reference: "Ch 2, p. 15"}
  - {function: gleying_cssc,         file: R/diagnostics-cssc.R, reference: "Ch 3 key E, p. 34; Ch 7, pp. 81-82"}
  - {function: solonetzic_b_cssc,    file: R/diagnostics-cssc.R, reference: "Ch 2, p. 17; Ch 12, p. 122"}
  - {function: chernozemic_a_cssc,   file: R/diagnostics-cssc.R, reference: "Ch 2, p. 16; Ch 5, pp. 61-62"}
  - {function: chernozemic_ae_cssc,  file: R/diagnostics-cssc.R, reference: "Ch 3 key G, p. 34"}
  - {function: brunisolic_b_cssc,    file: R/diagnostics-cssc.R, reference: "Ch 3 key I, p. 34; Ch 2, p. 14"}
