# Key to Soil Subgroups, CSSC 3rd ed., Ch 3, pp. 45-47, for the Chernozemic order.
# Criteria are summarised from the book; see R/diagnostics-cssc-subgroups.R
# and inst/rules/cssc3/readings.yaml.
# The Dark Gray Chernozems have no Eluviated subgroups.

subgroups:
  "GA":
    - code: "GAA"
      name: Gleyed Vertic Brown Chernozem
      tests:
        all_of:
          - vertic_subgroup_cssc: {}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "A slickenside horizon within 1 m, and faint to distinct mottles within 50 cm (p. 45)."

    - code: "GAB"
      name: Vertic Brown Chernozem
      tests:
        all_of:
          - vertic_subgroup_cssc: {}
      notes: "A slickenside horizon within 1 m (p. 45)."

    - code: "GAC"
      name: Gleyed Solonetzic Brown Chernozem
      tests:
        all_of:
          - weak_solonetzic_b_cssc: {}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "A Bnj, Bnjtj or Btnj horizon, and faint to distinct mottles within 50 cm (p. 45)."

    - code: "GAD"
      name: Solonetzic Brown Chernozem
      tests:
        all_of:
          - weak_solonetzic_b_cssc: {}
      notes: "A Bnj, Bnjtj or Btnj horizon (p. 45)."

    - code: "GAE"
      name: Gleyed Eluviated Brown Chernozem
      tests:
        all_of:
          - eluvial_horizon_cssc: {}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "Ahe, Ae or Aej horizons 2 cm or more, and faint to distinct mottles within 50 cm (p. 45)."

    - code: "GAF"
      name: Eluviated Brown Chernozem
      tests:
        all_of:
          - eluvial_horizon_cssc: {}
      notes: "Ahe, Ae or Aej horizons 2 cm or more (p. 45)."

    - code: "GAG"
      name: Gleyed Calcareous Brown Chernozem
      tests:
        all_of:
          - calcareous_b_cssc: {}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "A Bmk 5 cm or more, and faint to distinct mottles within 50 cm (p. 45)."

    - code: "GAH"
      name: Calcareous Brown Chernozem
      tests:
        all_of:
          - calcareous_b_cssc: {}
      notes: "A Bmk 5 cm or more (p. 45)."

    - code: "GAI"
      name: Gleyed Rego Brown Chernozem
      tests:
        all_of:
          - no_thick_b_cssc: {min_cm: 5}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "No B horizon, or a B thinner than 5 cm, and faint to distinct mottles within 50 cm (p. 45)."

    - code: "GAJ"
      name: Rego Brown Chernozem
      tests:
        all_of:
          - no_thick_b_cssc: {min_cm: 5}
      notes: "No B horizon, or a B thinner than 5 cm (p. 45)."

    - code: "GAK"
      name: Gleyed Brown Chernozem
      tests:
        all_of:
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "Faint to distinct mottles within 50 cm (p. 45)."

    - code: "GAL"
      name: Orthic Brown Chernozem
      tests:
        default: true
      notes: "Other Brown Chernozems (p. 45)."

