  "FD":
    - code: "FDA"
      name: Alkaline Solonetz
      tests:
        all_of:
          - alkaline_a_cssc: {}
      notes: "A strongly alkaline A horizon, pH (H2O) above 8.5 (p. 44)."

    - code: "FDB"
      name: Gleyed Brown Solonetz
