          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "An Ah, Ahe or Ap of dry value 3.5-4.5, chroma usually below 2, subhumid climate, faint to distinct mottles within 50 cm (p. 43)."

    - code: "FBH"
      name: Dark Gray Solod
