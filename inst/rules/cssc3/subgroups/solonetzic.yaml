      notes: "An Ah, Ahe or Ap (with none, the Ae: Ch 12, pp. 125 and 127) of dry value above 4.5, chroma usually below 2, subhumid climate, faint to distinct mottles within 50 cm (p. 44)."

    - code: "FCJ"
      name: Gray Solodized Solonetz
