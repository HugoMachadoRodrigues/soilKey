        all_of:
          - solonetzic_a_colour_cssc: {colour: dark_gray}
      notes: "An Ah, Ahe or Ap of dry value 3.5-4.5, chroma usually below 2, subhumid climate (p. 43)."

    - code: "FBI"
      name: Gleyed Gray Solod
