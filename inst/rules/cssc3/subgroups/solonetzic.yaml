# Key to Soil Subgroups, CSSC 3rd ed., Ch 3, pp. 42-45, for the Solonetzic order.
# Criteria are summarised from the book; see R/diagnostics-cssc-subgroups.R
# and inst/rules/cssc3/readings.yaml.
# None of the four great groups has a last 'other' subgroup in the key.
# The Vertic Solonetz and the Solonetz have no Gray subgroups, so their colour
# tests read the dry value alone (gray_split: false).

subgroups:
  "FA":
    - code: "FAA"
      name: Gleyed Brown Vertic Solonetz
      tests:
        all_of:
          - solonetzic_a_colour_cssc: {colour: brown, gray_split: false}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "An Ah, Ahe or Ap of dry value above 4.5, faint to distinct mottles within 50 cm (pp. 42-43)."

    - code: "FAB"
      name: Brown Vertic Solonetz
      tests:
        all_of:
          - solonetzic_a_colour_cssc: {colour: brown, gray_split: false}
      notes: "An Ah, Ahe or Ap of dry value above 4.5 (pp. 42-43)."

    - code: "FAC"
      name: Gleyed Dark Brown Vertic Solonetz
      tests:
        all_of:
          - solonetzic_a_colour_cssc: {colour: dark_brown, gray_split: false}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "An Ah, Ahe or Ap of dry value 3.5-4.5, faint to distinct mottles within 50 cm (pp. 42-43)."

    - code: "FAD"
      name: Dark Brown Vertic Solonetz
      tests:
        all_of:
          - solonetzic_a_colour_cssc: {colour: dark_brown, gray_split: false}
      notes: "An Ah, Ahe or Ap of dry value 3.5-4.5 (pp. 42-43)."

    - code: "FAE"
      name: Gleyed Black Vertic Solonetz
      tests:
        all_of:
          - solonetzic_a_colour_cssc: {colour: black, gray_split: false}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "An Ah, Ahe or Ap of dry value below 3.5, faint to distinct mottles within 50 cm (pp. 42-43)."

    - code: "FAF"
      name: Black Vertic Solonetz
      tests:
        all_of:
          - solonetzic_a_colour_cssc: {colour: black, gray_split: false}
      notes: "An Ah, Ahe or Ap of dry value below 3.5 (pp. 42-43)."

  "FB":
    - code: "FBA"
      name: Gleyed Brown Solod
      tests:
        all_of:
          - solonetzic_a_colour_cssc: {colour: brown}
          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "An Ah, Ahe or Ap of dry value above 4.5, faint to distinct mottles within 50 cm (p. 43)."

    - code: "FBB"
