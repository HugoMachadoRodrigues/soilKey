          - mottles_cssc: {contrast: [faint, distinct], from: 0, to: 50}
      notes: "An Ah, Ahe or Ap (with none, the Ae: Ch 12, pp. 125 and 127) of dry value above 4.5, chroma usually below 2, subhumid climate, faint to distinct mottles within 50 cm (p. 43)."

    - code: "FBJ"
