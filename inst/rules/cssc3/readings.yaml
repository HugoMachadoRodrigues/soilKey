# How soilKey reads the Canadian text where it is silent, or where the Key in
# Chapter 3 and an order chapter differ. The Chapter 3 key wins, and each
# difference is listed (national roadmap, decision D9).
readings:
  - topic: "Mineral surface"
    page: "used on pp. 11, 16, 34-51; not defined"
    reading: "The top of the shallowest mineral horizon (A, B or C) below any L, F, H or O horizons, whatever the order of the rows; without designations, the shallowest horizon with no more than 17 % organic C (a horizon with neither a designation nor organic C is taken as mineral)."
  - topic: "Route: properties or designations"
    page: "Ch 2"
    reading: "Properties decide whenever they can, whether they pass or fail (podzolic B chemistry, Bt clay increase and clay films, solonetzic B Ca/Na, chernozemic A, gley colours); the surveyor's designation decides only what the properties leave open, and the trace records which route decided."
  - topic: "Notation of the designations"
    page: "Ch 2, pp. 12-22"
    reading: "site$designation_system decides when present; a declared FAO notation (fao, fao2006, wrb, wrb2022 ...) is translated into the Canadian one (see 'FAO designations'). Otherwise designations showing signs of the FAO/USDA notation (E master; Oi, Oe, Oa; the letters a, d, i, l, o, q, r, w, once the word 'and' of a split horizon such as 'Ae and Bt' is set aside; an Arabic number before the master) are not read as Canadian, whatever the country (pedons described in Canada by the USDA survey use that notation); a Canadian site, or a site with no country, is read as Canadian; a site of another country is not. Where designations are not read as Canadian, the suffixes are ignored, because z, m, f and v mean other things in the other notations; only the master letters that mean the same everywhere are read: A, B, C and E are mineral horizons, R is rock and W water, an A carrying a p is an Ap, and an A, B, C or E tells the surface A where it ends. A profile with only letters common to both notations (A, Btz, Cz) on a Canadian site, or with no country, is read as Canadian; declare designation_system to avoid it."
  - topic: "FAO designations"
    page: "Ch 2, pp. 12-22; Table 6, p. 154; FAO (2006) Guidelines for soil description, as WRB 2022, Annex 3, Tables 10.1-10.2, pp. 225-228"
    reading: "A profile that declares the FAO notation is read by the Canadian key through a translation of its designations, letter by letter, where the FAO letter and the Canadian one mean the same, following the book's correlation of designations (Table 6): masters A = A, E = Ae, AE or EA = Ahe, EB = AB, BE = BA, B, C, R and W as written, H (peat) = O with i, e, a = Of, Om, Oh, O (an organic layer seldom saturated) = L, F, H by i, e, a and LFH without one, I (ice) = Wz, and an Arabic number before the master = a Roman numeral (2Bt = IIBt); suffixes b = b, f (permafrost) = z, g, l and r = g, h = h on A and B, hs on a B = hf, i (or ss) = ss, k = k, m (cementation) = c when it follows the letter of its cementing agent (k, l, q, s, v, y, z: Bkm, Bsm, Bqm, Bym; Annex 3, p. 227, as the WRB reading of a cemented layer), n = n on B, p = p on A and H, s = f on B, t = t on B, w = m on B, x = x, y and z (salts) = s, @ = y, alpha = k. A B combining w with t, g or s (WRB 2022, Annex 3, rule 5), or a letter in parentheses, is read as weak (Bmtj, Bmgj, Bmfj). Not read: a bare m (Bm, Cm: what a Canadian Bm looks like), c, d, e on a C, j (jarosite), o, q, u (artefacts), v (plinthite), other Greek letters, relict letters, and h, n, p, s, t, w where the Canadian notation does not use them. The FAO z is never the Canadian z (frozen), nor j the Canadian j, u the turbic u, or v the vertic v. Canadian suffixes the FAO notation cannot write are left open (neither present nor absent): h on an A without h or p (tested by the Ah definition), m on an uncemented B with none of w, t, g, l, r, s, h, n, o (a bare FAO Bm among them), k where no k or alpha is written, v on B and BC, gf on a gleyed B; and the weak form (j) of a translated e, f, hf, g, n or t, whose full form is read: tests of the weak form (Aej, Btj, Bfj, Bnj, gj) are undecided. The limnic L and unparsed designations are read by their master letters only. The designations of the pedon are not changed; the evidence of each diagnostic (notation) lists what each was read as."
  - topic: "Bt clay increase"
    page: "Ch 2, p. 15"
    reading: "The limits are USDA's argillic ones (+3 points below 15 % clay, ratio 1.2 from 15 to 40 %, +8 points above 40 %), measured against the eluvial horizon above (criterion 1: an Ae or Ahe, an E in another notation, or a horizon with no designation that may be one; with none, any mineral horizon above), its lowest recorded clay deciding a pass and, once every such clay is recorded, a fail; clay films are required as the evidence of illuviation (the thin-section route is not read). A designated Bt with no eluvial horizon above it (a truncated soil, or only an Ap above) or with a lithologic discontinuity between that horizon and the Bt (no eluvial horizon above in the Bt's own material: a change of Roman numeral, an Arabic number in another notation) is not put to the clay-increase test (criterion 5): the designation decides there. The 5 cm of the Bt are reached by adjacent Bt horizons added up (a Btg1 of 3 cm over a Btg2 of 3 cm is a Bt; overlapping rows count once and a gap in the record ends the run), and a Bt 'within 50 cm' is a run of Bt horizons that begins within 50 cm, its parts below included. Each horizon is decided on its own, by its properties when they decide and otherwise by its designation, and the runs are formed from those answers. By properties a horizon is compared only with the mineral horizons above it (clay recorded on an organic layer is not a comparison): it passes with the clay increase and clay films; it fails when its clay films are recorded as absent, or when its clay and the clay of every mineral horizon above it are recorded and show no increase; otherwise it is undecided (the eluvial horizon it should be compared with may be the one with no clay). The first mineral horizon has nothing to be compared with and is a Bt only by its designation; a horizon with no designation in a designated profile may be a Bt. Under criterion 5 the designation decides, provided the clay skins it then rests on are not recorded as absent. In another notation a B carrying a t is a Bt by designation (t means illuvial clay in the FAO and USDA notations too), an A, E, C or O is not a Bt by its properties either, and an E is an eluvial horizon. A designation written all in capitals there ('BHS', 'BT', 'AP') is read as its master and lowercase suffixes; a transition (two of A, B, C and E) keeps both letters ('BCT' is a BCt, not a Bt)."
  - topic: "Podzolic B in sands"
    page: "Ch 2, p. 17"
    reading: "'Sands' are read as layers with at least 85 % sand, where the pyrophosphate Al + Fe limit is 0.4 % instead of 0.6 %."
  - topic: "Podzolic B colour and layers"
    page: "Ch 2, p. 17; Ch 10, p. 108"
    reading: "Moist colour black (value 2.5 or less, chroma 2 or less), or hue 10YR or redder with chroma above 3 or value 3 or less; the 10YR 'becoming yellower with depth' clause and the Ch 10 waiver for Ap horizons are not applied. The Bh chemistry also needs moist value and chroma 3 or less (Ch 10). Each layer is decided by its chemistry and colour when they decide and otherwise by its designation, and adjacent Bh, Bhf and Bf layers are then added up towards the 10 cm (a Bf ruled out by its chemistry does not count by its designation). Without clay, the Bf/Bhf chemistry is undecided ((Al + Fe) / clay cannot be tested). Only mineral B horizons (or horizons without a designation) can be podzolic B material: in another notation the master letter rules out an A, E, C or O, and a Bs or Bh there is podzolic B material by designation (a B with neither is not; the ss of slickensides and the se of sulfides do not count). A mineral horizon with no designation may be podzolic B material by designation."
  - topic: "Gleysolic exclusions and thickness"
    page: "Ch 3 key E, p. 34; Ch 7, pp. 81-83"
    reading: "The key's colour tests are not applied to Ah, Ap or Ae horizons (an Ae over 20 cm thick reaching below 60 cm still counts), as Ch 7 specifies; an undesignated surface horizon is taken for the A, and in another notation the A masters are left out, and the E masters as the Ae (a thick, deep E is tested). When the surface A (adjacent Ah and Ap horizons from the mineral surface, an A in another notation, or the undesignated surface horizon taken for the A; a buried A, b, does not count) is more than 50 cm thick, the mineral horizon right below it is tested instead, whatever it is, a gap in the record allowed. Clause a (chroma 1 or less) needs a grey matrix, moist value 4 or more: the key limits it to materials that turn brighter when oxidised, which a dark, humus-stained AB or Bm does not. The colour alone cannot show that a grey material would turn brighter (a pale calcareous C, a grey shale or sand is grey of its own), so a horizon gleyed by clause a alone is read with its designation: gleyed with a strong g (in the Canadian notation or another one); not gleyed when designated without one (a weak gj included), unless its mottles are unknown, since prominent mottles would pass clause b or c: its colours then leave it open and the horizon is read as one of unknown colours; with no designation, gleyed unless it holds 2 % CaCO3 or more, which leaves it undecided. Clauses b, c and d and the red materials are read from the colours alone. A neutral hue (N) has chroma 0. In a soil with a Bt that begins within 50 cm, the gley colours must be in the Bt (a run of adjacent gleyed horizons that holds part of the Bt): Ch 7 (p. 83) makes such a soil a Luvic Gleysol when the gley colours are in the Btg within 50 cm and a Gleyed Luvisol when they are only in the Aeg or below 50 cm, and gives the Gleysols and Humic Gleysols no Bt. A soil with a solonetzic B is left out of this rule, since Ch 7 (p. 83) places a Bn or Bnt soil with gleying in the Solonetzic subgroups of the Gleysolic order. When the Bt is undecided, each way its undecided horizons may go is tried (a Bt of unknown thickness or top may be absent or be any run that may be the Bt) and the gleying is decided only when they all agree; with more than ten undecided horizons, it passes only if no run that may be a Bt lies outside the gleyed runs. Ch 7's 10-cm minimum thickness (p. 81) is not in the key and is not applied: on the NPDB it turned away 64 Gleysols the survey confirms, most of them because the lower depth recorded for the deepest horizon is the sampling depth (a Cg 0-5 cm under peat). Mottle contrast is read from mottle_contrast and cover from redoximorphic_features_pct; when the contrast is unknown and mottles are not recorded as absent, clauses b and c are undecided. Red materials (hue 5YR or redder) are recognised by hue alone, without the dithionite test. Each horizon is decided by its own colours when they decide, otherwise by its own designation (a strong g); a horizon with neither is undecided, so a missing record is not read as 'not gleyed'."
  - topic: "Vertisolic order depth"
    page: "Ch 3 key C, p. 34"
    reading: "'The top of which occurs within 1 m' is read as applying to the slickenside horizon; the vertic horizon may be anywhere in the pedon. The vertic horizon is read from a strong v in a designation (the book gives no measurable limit)."
  - topic: "Chernozemic A soil climate"
    page: "Ch 2, p. 16 (criterion 7)"
    reading: "Read from site$mean_annual_soil_temp_C (>= 0 C) and site$soil_moisture_subclass (spelling aside: 'Sub-humid' and 'semi-arid' are read as subhumid and semiarid; subhumid, semiarid, subarid or arid pass; humid and perhumid fail; the aquic subclasses lie on a separate scale (Table 4, p. 143) and leave it undecided); failing those, approximated from the USDA soil_temperature_regime (pergelic or gelic fails) and soil_moisture_regime (aridic, torric, ustic or xeric passes; perudic fails; udic, which straddles the Canadian subhumid-humid limit, and aquic leave it undecided). Unknown climate leaves the chernozemic A undecided, so later orders become provisional."
  - topic: "Chernozemic A structure"
    page: "Ch 2, p. 16 (criterion 5)"
    reading: "'Characteristically neither massive and hard nor single-grained' fails the horizon only when that structure is recorded; it is never a reason for an undecided result."
  - topic: "Chernozemic A base saturation"
    page: "Ch 2, p. 16 (criterion 6); Ch 4; Ch 10"
    reading: "'Base saturation (neutral salt)' is the saturation by an unbuffered salt, on the CEC at the soil's own pH (Ch 10 contrasts it with the CEC at pH 7). Each horizon of the A is given the range its data allow: the sum of Ca, Mg, K and Na over ecec_cmol is the value (a lower bound when a base is missing); the four bases over their sum plus al_cmol (or al_kcl_cmol) are an upper bound, since the exchangeable H is left out; bs_pct, the base saturation on a CEC buffered at pH 7 (or the bases over cec_cmol, whichever is higher), is a lower bound, since the CEC at a pH below 7 is smaller; a pH in CaCl2 of 5.5 or more, or without it a pH in water of 6.0 or more, places it above 80 %, as the book reads a high base saturation from that pH (Ch 4) and the exchangeable Al an unbuffered salt extracts is negligible there. Bounds that contradict each other, negative amounts and pH values outside 0-14 are read as no data (also for the Ca dominance, where al_kcl_cmol stands in for al_cmol as well), and a horizon with nothing that bounds it is left out of the mean, as for the other properties of the A. The criterion passes when the thickness-weighted mean of the lower bounds is above 80 % and fails when that of the upper bounds is 80 % or less, so only a value known to be 80 % or less fails; Ca must still be the dominant cation."
  - topic: "Permafrost unknown"
    page: "Ch 3 key A, p. 33"
    reading: "As with USDA's Gelisols, no sign of permafrost (no horizon at or below 0 C, no z suffix) is read as none, and permafrost_temp_C is listed as missing data."
  - topic: "Organic surface of unknown kind"
    page: "Ch 3 key B, p. 33"
    reading: "The kind of the surface organic layer is read from measured rubbed fibre first (40 % or more is fibric), then from an Of, Om or Oh designation, then from the bulk density. When none of them is known, 60 cm of organic material passes and less than 40 cm fails; between 40 and 60 cm the order is undecided. Option 2 applies only when a mineral layer starts within 40 cm of the surface. Folic material qualifies when more than 40 cm thick, or at least 10 cm when a lithic contact (R) follows with any mineral layer between them thinner than 20 cm and less than half the folic thickness; fragmental materials are not read, and a layer of peat between the folic material and the rock stops this option. The 10-cm minimum over a lithic contact is applied to folic materials only (the key words it so; Ch 9 item 3 also allows it for peat). A folic surface layer (L, F, H) lying directly on an O horizon is read as litter over peat: the soil also passes when the organic material from the top of that O horizon meets the peat limits, with that horizon's kind; the litter is not counted towards them. In a profile with Canadian designations, an undesignated organic layer under the folic surface may be folic or peat. A layer of unknown organic status (no organic C and no designation read) may be either, and leaves the order undecided whenever that changes the answer."
  - topic: "Brunisolic order"
    page: "Ch 3 key I, p. 34"
    reading: "Read from the designations: Bm, Btj and Bfj horizons are summed towards the 5 cm; a strong Bf thinner than 10 cm in all also qualifies. A horizon with no bottom depth (the deepest) may be of any thickness and leaves the test undecided when that changes the answer."
  - topic: "Anthroposolic order"
    page: "2016 Taxonomic Key"
    reading: "The provisional Anthroposolic order of the 2016 field key is not part of the 3rd edition and is not keyed."
  - topic: "Chernozemic A colour contrast with the parent material"
    page: "Ch 2, p. 16 (criterion 3)"
    reading: "The parent material is the lowest C horizon of the first material (C or IC, not a IIC). When its moist colour is not recorded, the criterion is taken as met. The 'thick and dark enough to give 10 cm' option for a thin Ap is not implemented."
  - topic: "Chernozemic Ae conditions"
    page: "Ch 3 key G, p. 34"
    reading: "An Aej is an Ae: it qualifies through G.2 (dry value below 5), G.3 (thinner than the Ah or Ap above) or G.4 (no more than 5 cm under an Ahe). An Aej with no dry value that meets neither G.3 nor G.4 leaves the test undecided. In another notation an E (not a buried one) is an Ae of unknown strength: it passes through G.3 (thinner than the A horizons above it), fails with a dry value of 5 or more (as an Ae or as an Aej), and is otherwise undecided; G.4 cannot be read there (no Ahe)."
  - topic: "Great groups: the last of each order"
    page: "Ch 3, pp. 35-36"
    reading: "The last great group of each order is the key's 'other soils' and is a default entry (Static Cryosol, Humic Vertisol, Humo-Ferric Podzol, Gleysol, Solonetz, Gray Luvisol, Dystric Brunisol, Regosol); Humisol, which the key words positively, is tested, so an Organic soil with no dominant material keeps the order name with a warning."
  - topic: "Organic Cryosol"
    page: "Ch 3, p. 35; Ch 6, p. 79"
    reading: "'Formed primarily in organic materials' is read with the Ch 6 rule: organic material more than 40 cm thick from the surface, or more than 10 cm over a lithic contact or over a water or ice layer (W) at least 30 cm thick. A layer of unknown organic status (no organic C and no designation read) that could change the answer leaves the great group undecided."
  - topic: "Turbic Cryosol"
    page: "Ch 3, p. 35; Ch 2, p. 16"
    reading: "Marked cryoturbation is read from a y suffix in a designation (disruption over at least half the cross-section); without designations it is undecided."
  - topic: "Folisol"
    page: "Ch 3, p. 35; Ch 9, p. 104"
    reading: "With designations, the folic horizons (L, F, H) that run from the surface must meet one of the Ch 9 criteria: 40 cm or more; or at least 10 cm lying directly on a lithic contact, or on a mineral layer that lies on the contact and is thinner than 20 cm and less than half the folic thickness. A folic layer buried under peat, or folic material with peat between it and the rock, does not qualify. Fragmental material and folic material in the voids of skeletal material are not read. An organic layer with no designation may be folic or peat, and a layer of unknown organic status mineral or organic; either leaves the test undecided when that changes the answer. Without designations, a site recorded as rapidly to imperfectly drained counts as upland folic material and a poorly drained one does not."
  - topic: "Organic tiers"
    page: "Ch 9, pp. 99-102; Ch 2, pp. 11 and 17-19"
    reading: "The middle tier is 40-120 cm from the surface, or 0-120 cm when a terric, lithic or hydric layer begins above 120 cm. These layers are read with the Ch 2 definitions: lithic, bedrock (R) within 10-160 cm; terric, a mineral layer not underlain by organic matter, or one continuous mineral layer more than 30 cm thick; hydric, water (W) from 40 cm or deeper that reaches below 160 cm. A thinner mineral layer with peat below it is a cumulic layer and a water layer with other layers recorded under it within 160 cm is not hydric: neither changes the tier. Water that is the deepest layer recorded but ends above 160 cm may or may not reach below it, and leaves the tier undecided when that changes the answer. Each organic layer is fibric, mesic or humic by its rubbed fibre when measured (40 % or more, 10 to less than 40 %, below 10 %), otherwise by its designation (Of, Om, Oh), otherwise by the von Post class the book gives as usual (1-4, 5-6, 7 or more); the pyrophosphate index is not read (no attribute holds it). Limnic layers (coprogenous earth, diatomaceous earth, marl) and folic layers (L, F, H) are not fibric, mesic or humic material and are left out of the tally; a limnic layer is not a terric contact either (it is not a mineral substratum), and a middle tier of limnic material only, with no peat, is read with the surface tier, as with a contact. A peat layer with no bottom depth may reach the end of the window and counts as possible thickness of its own kind. 'Dominantly' is read as more than half with two materials and the thickest with three (stated for fibric, applied to all three). An organic layer of unknown kind, or a layer of unknown organic status in the tier or where it could be a contact, leaves the great group undecided when it could change the answer."
  - topic: "Vertisol and Humic Vertisol"
    page: "Ch 3, p. 35; Ch 13, pp. 132-133"
    reading: "Drainage comes from site$drainage_class: very rapidly to imperfectly drained use the surface dry value (3.5 or more is Vertisol), poorly and very poorly drained the Ah thickness (below 10 cm is Vertisol). A range spanning both groups ('imperfectly to poorly drained') counts as unknown. With the drainage unknown, the great group is decided only when both tests agree. The key does not say how to read a cultivated soil; a poorly drained soil with an Ap at the surface follows the Ch 13 Vertisol text, which the key tests first: it is a Vertisol when the Ap has one of less than 2 % organic C, a moist value above 3.5 or a dry value above 5.0, or little contrast with the layer underneath (less than 1.5 moist value units when that layer has value 4 or more, less than 1 unit when it is below 4). The layer underneath is the one under the whole surface A, so a remnant Ah under the Ap counts with the Ap."
  - topic: "Podzolic great groups"
    page: "Ch 3, p. 35; Ch 10, pp. 110-114"
    reading: "A Bh (Bh chemistry, moist value and chroma 3 or less) or a Bhf (Bf chemistry with organic C above 5 %) must reach 10 cm by itself, adjacent layers of the same kind added up; otherwise the soil is a Humo-Ferric Podzol."
  - topic: "Luvic Gleysol"
    page: "Ch 3, p. 35; Ch 7, pp. 83-84"
    reading: "A Btg is a Bt horizon that is gleyed, by gley colours on the Bt layers (clause a read with the designation, as for the order) or a Btg designation, at any depth (the key gives none). Ch 7's 'within 50 cm' is read at the order level: a Bt that begins within 50 cm must already hold the gley colours for the soil to be Gleysolic. By designation, adjacent Bt horizons of at least 5 cm in all of which a part is a Btg."
  - topic: "Surface A"
    page: "Ch 2, pp. 12-13"
    reading: "The surface A runs down from the mineral surface through the Ah, Ahe and Ap horizons; a buried A (b) is not part of it. A horizon designated in the Canadian notation is read from its designation; in another notation, an A is tested as below (an A with a p is an Ap) and a B, C, E, O, H, L, M, R or W master, or a transition such as AB, ends the A. A horizon with no designation is an Ah when it is at least one moist value unit darker than the mineral horizon below it or holds at least 0.5 percentage points more organic C than the deepest mineral horizon; below the first horizon, an undesignated horizon must pass both tests and be less than one moist value unit lighter than the one above it, since without a designation nothing else tells an A from a dark B. The deepest horizon cannot be compared and is undecided. A horizon that cannot be decided may end the A or not: every A the profile allows is tested, and the great group is decided only when they all give the same answer. An unknown thickness leaves the thickness undecided. Humic Gleysol, Vertisol, Gray Brown Luvisol, Melanic and Sombric Brunisol and Humic Regosol read their A this way; the upper B of the Brunisols lies under it."
  - topic: "Ahe"
    page: "Ch 2, p. 13"
    reading: "An Ahe is an Ah that has undergone eluviation, and it counts as an Ah wherever a great group reads the surface A (a warm Luvisolic soil with an Ahe is a Gray Brown Luvisol); for the Chernozemic great groups it is also a sign of eluviation."
  - topic: "Humic Gleysol"
    page: "Ch 3, p. 35; Ch 7, p. 85"
    reading: "The 2.0 % organic C applies to the qualifying Ah or Ap (thickness-weighted mean). The key gives an Ah and an Ap separate thresholds (10 and 15 cm), so they are not added together: an Ap of 12 cm over an Ah of 8 cm makes a Gleysol. The Ch 7 colour limits for an Ap differ from the key's own Ap rule and are not applied."
  - topic: "Solod and Solodized Solonetz"
    page: "Ch 3, p. 36; Ch 12, pp. 123-126"
    reading: "Read from the designations: Ae horizons (strong or weak, not Ahe; an E in another notation; not a buried one) totalling at least 2 cm; the Solod also needs an AB or BA horizon (an EB or BE in another notation). Without designations both are undecided."
  - topic: "Vertic Solonetz slickensides"
    page: "Ch 3, p. 36; Ch 2, p. 16"
    reading: "As for the Vertisolic order: common, many or continuous slickensides pass, and an ss designation passes even where slickensides are recorded as few, since the ss suffix means more than two slickensides, which a few class can hold."
  - topic: "Chernozemic great groups"
    page: "Ch 3, p. 36; Ch 5, pp. 63-70"
    reading: "The dry value and chroma are thickness-weighted means over the chernozemic A. The key's chroma limits say 'usually' and are read only to tell Dark Brown from Dark Gray and from Black: Dark Gray needs a chroma of 1.5 or less with signs of eluviation under forest, which are an Ahe, Aej or Ae in the profile (not a buried one) or, in a cultivated soil, an Ap whose own dry chroma is 1.5 or less, the Ahe the plough has mixed in (the key gives that Ap its own value limit, and Ch 5, p. 69, admits a mixed Ap); and a dry value of exactly 3.5, the limit of both the Black ('darker than 3.5', Ch 5, p. 68) and the Dark Brown Chernozems (3.5 to 4.5), is Black when the chroma is 1.5 or less, the chroma of the Black, and Dark Brown otherwise, unless an Ahe, Aej or Ae marks the eluviation of the Dark Gray, whose range holds 3.5 by the key. The means are rounded to the millionth before they are compared with the limits. On the NPDB scenario of 0.9.275 these readings bring the Chernozems decided at the order level from 92 to 116 of 348 in agreement with the survey at the great group level (from 63 to 84 of the 167 whose great group is decided). An Ap of dry value 4.5 to 5.0 keys as Brown, by the key's order, although Ch 5 admits it to Dark Gray."
  - topic: "Gray Brown Luvisol"
    page: "Ch 3, p. 36; Ch 8, p. 91"
    reading: "A forest mull Ah is the Ah and Ap horizons at the mineral surface, together more than 5 cm thick; the mean annual soil temperature of at least 8 C is read from site$mean_annual_soil_temp_C or from the USDA regime (mesic or warmer). The chapter's humid moisture regime is not in the key and is not applied."
  - topic: "Brunisolic great groups"
    page: "Ch 3, p. 36; Ch 4, pp. 55-58"
    reading: "pH (0.01 M CaCl2) is read over the uppermost 25 cm of the B (or of the B and the material below it); 5.5 or more in some part is high, below 5.5 throughout is low. Without pH in CaCl2, pH in water stands in: 6.5 or more is high, below 5.5 low, between undecided. An Ap counts towards the 10 cm only with a moist value below 4 (Ch 4)."
  - topic: "Humic Regosol"
    page: "Ch 3, p. 36; Ch 11, p. 119"
    reading: "The Ah and Ap horizons at the mineral surface, together at least 10 cm thick (the key gives both the same limit); the chapter's 'dark-coloured' Ap is not required, as the key does not."
  - topic: "Subgroup depths"
    page: "Ch 3, pp. 37-40"
    reading: "Depths in the subgroups of Organic soils and Organic Cryosols are measured from the surface (the top of the uppermost layer), as the tiers are; depths in the subgroups of mineral soils from the mineral surface, as the key words them."
  - topic: "Glacic Organic Cryosol"
    page: "Ch 3, p. 37; Ch 6, p. 79"
    reading: "An ice layer is read from measured ice_pct (more than 95 % by volume, the Ch 6 figure), otherwise from a W layer that is frozen (a z suffix or a temperature at or below 0 C); a W layer with no sign of being frozen is undecided. Adjacent ice layers are added up towards the 30 cm."
  - topic: "Terric Organic Cryosols"
    page: "Ch 3, p. 37; Ch 6, p. 79"
    reading: "The mineral contact is where the organic column from the surface ends on a mineral layer or on rock (rock is read as a mineral contact; the key does not say). 'Mainly fibric (mesic, humic) above the contact' is read with the dominance rule of the organic tiers. The Ch 6 alternative (a mineral layer more than 30 cm thick within 1 m) is not in the key and is not applied. Limnic and folic layers are not peat and are not counted in 'mainly'; layers of unknown organic status that may belong to the organic column are, as material of unknown kind."
  - topic: "Fibric, Mesic and Humic Organic Cryosols"
    page: "Ch 3, p. 37; Ch 2, p. 11"
    reading: "'Dominantly ... below a depth of 40 cm' is read over 40 cm to 1 m or to a lithic contact (the control section of Organic Cryosols), with the dominance rule of the organic tiers; the Ch 6 requirement of organic layers over 1 m thick is not in the key and is not applied. The key has no last 'other' subgroup: an Organic Cryosol that meets none of AAA-AAG keeps the great-group name with a warning."
  - topic: "Histic Cryosols"
    page: "Ch 3, pp. 37-38; Ch 6, pp. 76-78"
    reading: "Organic horizons (more than 17 % organic C, or O, L, F, H designations) in the upper 1 m are added up, surface and buried alike, and must be more than 15 cm thick together. The Ch 6 limit of 40 cm for the surface organic horizon is not applied."
  - topic: "pH of the B horizons"
    page: "Ch 3, pp. 37-38"
    reading: "The Eutric subgroups need pH (0.01 M CaCl2) 5.5 or more in at least one B horizon; the Dystric ones, keyed after them, pH below 5.5, which is then below 5.5 throughout, as Ch 6 says. B horizons are horizons with a B master in any notation (a transition such as BC is not one); pH in water stands in as for the Brunisolic great groups. A soil with no B horizon fails both."
  - topic: "Bm horizon of the Cryosols"
    page: "Ch 3, pp. 37-38; Ch 6, pp. 74-77"
    reading: "Bm horizons (Bm, Bmy, Bmk, Bmj) are added up towards the 10 cm. In another notation m means cementation, so a B there may or may not be a Bm and the thickness is undecided. 'A Bm horizon less than 10 cm thick' (Orthic subgroups) is read as a B horizon with less than 10 cm of Bm in all, so a soil with B horizons that are not Bm is Orthic and a soil with no B horizon is left to the Regosolic subgroup, as Ch 6 describes them."
  - topic: "Luvisolic Static Cryosol"
    page: "Ch 3, p. 38; Ch 6, p. 78"
    reading: "The key writes Bty; the Bt horizon (as for the orders) is enough, as Ch 6 writes Bt, and must be 10 cm thick or more. The eluvial horizon is an A with e (Ae, Aej, Ahe, Aeg) or, in another notation, an E."
  - topic: "Gleysolic Cryosols"
    page: "Ch 3, pp. 37-38; Ch 6, pp. 76 and 78"
    reading: "'A gleyed layer similar to soils of the Gleysolic order' is read as the uppermost mineral horizon within 50 cm of the mineral surface that is not an A, gleyed by the colours of the Gleysolic order test or, failing them, by a g in its own designation, as Ch 6 describes gleying up to the mineral surface. An A is an A master in the Canadian notation or an A or E in another one; an undesignated horizon is an A when the surface-A reading of the great groups takes it for one, unless its own colours are gleyed (Ch 6: the uppermost mineral horizon of these soils is a Bg or Cg). A gleyed horizon lower down only, which Ch 6 says the other subgroups usually have just above the permafrost table, does not qualify."
  - topic: "Folisol subgroups"
    page: "Ch 3, p. 38; Ch 9, pp. 104-105"
    reading: "Histic: O horizons below the F or H horizons, adjacent ones added up, more than 10 cm thick (the chapter's 'directly underlain' is not in the key and is not required). Lignic: woody_fragments_pct (a volume, standing in for the chapter's surface area) above 30 % on average over the folic horizons other than an L (F, H and combined LF, FH, LFH); woody material that is not recorded is read as absent and listed as missing. Hemic and Humic: the dominant of the F, H and O horizons of the organic column by thickness (more than half with two, the thickest with three); L horizons are parent material and not counted, and combined horizons (LF, FH, LFH) are of unknown kind; the chapter's limit of less than 10 cm for the subdominant H (or F) and O horizons is not in the key and is not applied. The key words Humic Folisol positively, so a Folisol with neither F nor H dominant keeps the great-group name with a warning."
  - topic: "Organic subgroup layers"
    page: "Ch 3, pp. 38-40; Ch 2, p. 19"
    reading: "Hydric layers are read as for the organic tiers. A terric layer must have at least 30 cm of adjacent mineral layers between 40 and 160 cm; one that is the deepest layer recorded and ends above 160 cm, or has no bottom depth, may go on and is undecided when thinner. A limnic layer is an Oco horizon, an L master in another notation, or a layer that is not rock and whose origin (layer_origin, rock_origin) names limnic, coprogenous, diatomaceous, marl or gyttja material as a word; without any of these no limnic layer is read, and limnic layers more than 5 cm thick in all between 40 and 160 cm qualify. Cumulic layers are the mineral layers between 40 and 160 cm with organic matter below them, more than 5 cm thick in all; a mineral layer at the base of the profile, with no organic matter below, is a substratum (Ch 2, p. 19) and not a cumulic layer. 'A humic (fibric, mesic) layer more than 12 (25) cm thick' is read as layers of that kind adding up to more than that, in the control section (0-160 cm) or in the middle and bottom tiers (40-160 cm), as the Typic subgroups of Ch 9 count them. The subgroups ask for a terric layer of at least 30 cm, as the key words them, while the tiers of the great groups use the more than 30 cm of the Ch 2 definition for a continuous mineral layer with peat below; each level keeps its own wording."
  - topic: "Vertisolic subgroups"
    page: "Ch 3, p. 40; Ch 13, pp. 133-134"
    reading: "Each mineral horizon whose top is within 50 cm of the mineral surface (50 cm included, as for the gley colours) is read from its mottle_contrast (mottles recorded as absent, by redoximorphic_features_pct of 0, rule it out), otherwise from its own designation, a strong g standing for prominent mottles and a weak g (gj) for faint to distinct ones; a horizon with neither is undecided. The chapter's reading of the Gleysolic subgroups as the poorly drained members is not in the key and is not applied."
  - topic: "Missing bottom depths"
    page: "not in the book"
    reading: "classify_cssc3() reads the rows in depth order and a horizon with no bottom depth as ending where the next horizon down begins (on a copy; the pedon given is not changed, and the layer numbers of the trace refer to the rows in depth order). The deepest horizon with no bottom depth may go on: an organic column that ends on it may be deep (both options of the Organic order), a peat layer counts as possible thickness of its own kind (and has some thickness wherever it starts), and a mineral layer as a terric layer that may be thicker. In the tests that add up horizons towards a thickness (the Bt, the podzolic B, the chernozemic A, the Brunisolic B and the Btg of the orders and great groups; a B, an Ae, a Bmk, a Bm in the subgroups), such a horizon adds nothing certain and may be of any thickness, so it leaves them undecided when that changes the answer. The properties of a chernozemic A that ends in such a horizon are read threshold by threshold with that horizon weighing nothing and weighing everything (each mean moves steadily between the two), each decided only where both agree, and the criteria are joined from them. Sums of thickness count overlapping rows once (Brunisolic B, Btg, the Bt of the Luvisolic Cryosols), and runs end at a gap in the record."
  - topic: "Control section of mineral soils"
    page: "Ch 2, p. 11"
    reading: "The control section runs from the mineral surface to 25 cm below the top of the C (or the IIC), or to 2 m, whichever is less; to 1 m when the C begins within 75 cm; to a lithic contact between 10 cm and 1 m. The top of the C may be uncertain: an undesignated mineral horizon above the first designated C may be the C, and with no C designated the C begins at or below the deepest horizon described. A feature is inside the section when it begins above the shortest section the profile allows, outside when it begins below the longest, and undecided between. The permafrost-table end of the section (Cryosols) is not used here."
  - topic: "Cemented horizons"
    page: "Ch 2, pp. 12, 16 and 17; Ch 10, p. 116"
    reading: "A horizon is strongly cemented by cementation_class (strongly or very strongly cemented, or indurated; weakly, moderately, extremely weakly or not cemented fail) when it is recorded, otherwise by a strong c in the Canadian notation (a weak cj is not: Ch 10 writes the ortstein Bfcgj over a Bfjcjgj) or an m in another notation (cementation there). A mineral horizon is podzolic B material by its podzolic B chemistry and colour when they decide, otherwise by a strong h, hf or f in a Canadian B designation (a Bs or Bh in another notation; a weak Bfj is not), otherwise it is undecided; organic layers are not. An ortstein is a strongly cemented podzolic B at least 3 cm thick, adjacent layers added up; the book's 'more than one-third of the exposed face' is recorded by no attribute and is not read. A placic horizon is a strongly cemented B horizon that is podzolic B material or a Bgf (Bhfc, Bfc, Bgfc), within the control section, each layer thinner than 3 cm (the book's 'thin layer or series of thin layers'; a gf is not read in another notation); a layer of no thickness is not one. A duric horizon is a strongly cemented B, BC or C horizon that is not podzolic B material (Ch 2 does not leave out carbonate cementation, and neither does this reading). A cemented horizon whose podzolic status is undecided may be either, and leaves the ortstein, placic and duric tests undecided. The 1998 print writes 'Durit'; the subgroups are named Duric, as the HTML edition and the 2016 key name them."
  - topic: "Fragipan"
    page: "Ch 2, p. 16"
    reading: "No attribute records the brittleness or the slaking of a fragipan, so it is read from an x in a designation (Bx, BCx, Btgx; x also means fragipan in the FAO and USDA notations). A horizon with no designation is undecided."
  - topic: "Mottles of the mineral subgroups"
    page: "Ch 3, pp. 40-51"
    reading: "Mottles are read horizon by horizon as for the Vertisolic subgroups: mottle_contrast first (mottles recorded as absent rule a horizon out), then the horizon's own designation, a strong g standing for prominent mottles and a weak g (gj) for faint to distinct ones; a gj also counts for 'distinct to prominent' (Gleyed Podzols, and the 50-100 cm window of the Brunisols), as the 2016 key reads the Gleyed Podzols. Prominent mottles, or a strong g, do not count as 'faint to distinct' (Regosols, and the Brunisols within 50 cm). 'Within 1 m' or 'within 50 cm' of the mineral surface takes the horizons whose top lies there; 'at depths of 50-100 cm' (Brunisols) the horizons that reach into that window."
  - topic: "Podzolic subgroups"
    page: "Ch 3, pp. 40-41; Ch 10"
    reading: "The Luvisolic subgroups need a Bt horizon (as for the orders) whose top is more than 50 cm below the mineral surface. 'An Ah horizon 10 cm or more' (Sombric subgroups) is read from the Ah and Ahe horizons of the surface A; an Ap does not count, as the key writes Ah. The chapter's exclusions of placic, duric and fragipan horizons anywhere in the profile (Orthic subgroups) are not in the key and are not applied."
  - topic: "Gleysolic subgroups"
    page: "Ch 3, p. 42; Ch 7, pp. 84-87"
    reading: "The slickenside horizon of the Vertic subgroups (and of the Vertic Solonetz) is read horizon by horizon: an ss in a designation passes (in the FAO and USDA notations too, where ss also means slickensides), then common, many or continuous slickensides pass and any other record fails, as the order test reads them, then a horizon designated without ss fails and one with no designation is undecided. A fragipan 'within or below the Btg' is an x horizon whose top lies at or below the top of the Bt. 'The Ah or Ap of Humic Gleysols' is the Humic Gleysol test itself. A Bgf horizon is read from dithionite-extractable Fe at least 1 percentage point above that of the parent material (the lowest C of the first material) when both are measured, otherwise from a gf in a Canadian designation; adjacent Bgf horizons are added up towards the 10 cm, and a Btgf of any thickness qualifies the Luvic Gleysols when its own Bgf reading holds (measured Fe first). 'Lack a B horizon 10 cm or more' (Rego subgroups) is read from the B horizons by designation, adjacent ones added up; a transition such as BC is not a B, and undesignated mineral horizons below the surface A may be B horizons."
  - topic: "Brunisolic subgroups"
    page: "Ch 3, pp. 49-50; Ch 4, pp. 55-59"
    reading: "An Ae or Aej at least 2 cm thick is read from the designations (not an Ahe; an E in another notation; not a buried Aeb), adjacent ones added up. The chapter's Bm of at least 5 cm and the chernozemic-A exclusion of the Orthic subgroups are not in the key and are not applied. The book letters the Sombric subgroups ICA, ICB, ICB, ICC, ICD; the codes here are ICA-ICE, with the book's names."
  - topic: "Cumulic Regosols"
    page: "Ch 3, pp. 50-51; Ch 11, pp. 118-119"
    reading: "'Layers below the Ah horizon' are the mineral layers below the surface A (below the mineral surface when there is none) that begin within the control section (1 m when no C is read). They 'vary in colour value by one or more units' when their moist values span one unit or more; as the key words it, a gradual change counts as well as a buried layer. With fewer than two such layers there is nothing to vary, and only a buried A designated as such makes the soil cumulic. Layers of unknown depth may be among them, and every surface A the profile allows is tried. Organic matter 'varies irregularly with depth' when some layer holds at least 0.2 percentage points more organic C than the layer above it (the book gives no figure). The key's sentence is read as (colour or organic matter) and, for the Gleyed Cumulic subgroups, faint to distinct mottles. Without these properties, a buried A (b) in the designations below the surface A stands for cumulic layering."
  - topic: "Solonetzic subgroups"
    page: "Ch 3, pp. 42-45; Ch 12, pp. 123-129"
    reading: "The colour classes are read from the dry value of the surface A (the Ah, Ahe and Ap horizons from the mineral surface, weighted by thickness over the whole A, not horizon by horizon, as for the Chernozemic great groups; a buried A does not count): above 4.5 Brown or Gray, 3.5 to 4.5 Dark Brown or Dark Gray, below 3.5 Black. A horizon of the A with no value may hold any, so the class is decided only when every value it may hold gives the same class. The key's chroma limits say 'usually', and the sources disagree (for the Black subgroups the key, Ch 12 and the 2016 key give above 1.5, usually below 2 and below 1.5), so chroma is read only to tell the Brown and Dark Brown subgroups of the Solods and Solodized Solonetz from their Gray and Dark Gray ones: a chroma of 1.5 or less (dry, or moist when the dry one is missing, as Ch 12 writes 'moist or dry') with a subhumid climate makes the A Gray or Dark Gray; any other chroma or climate leaves it Brown or Dark Brown; a low chroma with no climate recorded leaves the subgroup undecided. The climate is site$soil_moisture_subclass: subhumid passes, perhumid, humid, semiarid, subarid and arid fail, the aquic subclasses (another scale) and other words leave it undecided; without it the USDA aridic, torric and perudic regimes fail and the others leave it undecided. The Black subgroups, and all those of the Vertic Solonetz and the Solonetz (which have no Gray subgroups), take any chroma. Where there is no Ah, Ahe or Ap at the surface (an LFH directly over an Ae, under forest), the key gives no colour class; the Gray Solods and Gray Solodized Solonetz then read the Ae at the mineral surface (adjacent Ae horizons, not buried ones; an undesignated horizon on the way leaves it undecided), as Ch 12 (pp. 125 and 127) words them ('an Ahe, Ae or Ap horizon'); Ch 12 gives the Dark Gray ones an Ah, Ahe or Ap only. The strongly alkaline A of the Alkaline Solonetz has a pH in water above 8.5 (the key's figure; Ch 12 writes 8.5 or more) in an A horizon of the soil: an A master in the Canadian notation, an A or E in another notation, or an undesignated horizon of the surface A; an undesignated horizon below the surface A may be an A (an Ae) down to the first horizon known not to be one (a B or C master, or a solonetzic B by its properties) and is not one from there down; a buried A does not count. None of the four great groups has a last 'other' subgroup, so a Solonetzic soil without an A (eroded down to its solonetzic B, which Ch 12 and the 2016 key place in the Brown and Dark Brown Solonetz, and the 1998 key does not) stops at the great group. Faint to distinct mottles within 50 cm are read as for the other mineral subgroups."
  - topic: "Chernozemic subgroups"
    page: "Ch 3, pp. 45-47; Ch 2, pp. 13-14; Ch 5, pp. 63-71"
    reading: "A Bnj, Bnjtj or Btnj (Solonetzic subgroups) is read from the designations in the Canadian notation: no attribute separates a weakly expressed n from its absence. In another notation, where n has no weak form, a B carrying an n is undecided and any other horizon is not one; the horizons of the surface A are not one. The Btnj of the Solonetzic Gray Luvisols is a strong t and a weak n in the same horizon (a Bnjtj is not one). The key gives no depth for it, and none is applied. The eluvial horizons (Ahe, Ae or Aej; an E in another notation; a buried one does not count) are added up towards the 2 cm when adjacent, as the key does not say whether one horizon or several. The Bmk of the Calcareous subgroups is a Bm (in another notation, or with no designation, a B may be one) that holds carbonates: 0.5 % CaCO3 equivalent or more passes (the level at which effervescence becomes visible, as soilKey reads the protocalcic properties of WRB), none fails, and a trace or no measurement leaves it to the k of the designation; a horizon of the surface A is not one; adjacent ones are added up towards the 5 cm. 'Lack a B horizon or have one less than 5 cm thick' (Rego subgroups) is read as for the Rego Gleysols, with 5 cm. The Dark Gray Chernozems have no Eluviated subgroups."
  - topic: "Luvisolic subgroups"
    page: "Ch 3, pp. 48-49; Ch 8, pp. 91-95"
    reading: "The Gleyed subgroups take distinct (or prominent) mottles within 50 cm of the mineral surface, or prominent mottles in a horizon that reaches into 50-100 cm. The Gleyed Vertic subgroups follow the key's own wording, faint to distinct mottles within 50 cm, where Ch 8 (pp. 93 and 95) words them as the other Gleyed subgroups. 'In the upper solum' (Podzolic and Brunisolic subgroups) is not defined by the book and is read as above the Bt, or within 50 cm when no Bt is found: the podzolic B of the Podzolic subgroups is podzolic B material, read layer by layer as for the Podzolic subgroups, in adjacent layers above the top of the Bt adding up to at least 10 cm, and the Bt must begin within 50 cm of the mineral surface. The Bm of the Brunisolic subgroups is at least 5 cm thick with a chroma of 3 or more (the key does not say moist or dry: the moist chroma is read, the dry one when the moist is missing); the key's other choice, a Bf less than 10 cm thick that does not extend below 15 cm, is podzolic B material above the Bt, less than 10 cm in all, all of it ending at 15 cm or less. The 'Ah or Ahe 5 cm or more' of the Dark Gray Luvisols is read from the Ah and Ahe horizons of the surface A; an Ap does not count (Ch 8 also admits some disturbed Ap horizons, the key does not). The Btnj of the Solonetzic Gray Luvisols is read as the weak solonetzic B of the Chernozems, with a strong t in the same horizon. The printed Ch 8 (p. 94) adds a dark Ah and a Btnj, Bm or Bf to the Fragic Gray Luvisols; the sentence is not in the HTML edition nor in the key, and is not applied."
