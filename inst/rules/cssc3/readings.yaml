# How soilKey reads the Canadian text where it is silent, or where the Key in
# Chapter 3 and an order chapter differ. The Chapter 3 key wins, and each
# difference is listed (national roadmap, decision D9).
readings:
  - topic: "Mineral surface"
    page: "used on pp. 11, 16, 34-51; not defined"
    reading: "The top of the first mineral horizon (A, B or C) below any L, F, H or O horizons; without designations, the first horizon with no more than 17 % organic C."
  - topic: "Route: properties or designations"
    page: "Ch 2"
    reading: "Properties decide whenever they can, whether they pass or fail (podzolic B chemistry, Bt clay increase and clay films, solonetzic B Ca/Na, chernozemic A, gley colours); the surveyor's designation decides only what the properties leave open, and the trace records which route decided."
  - topic: "Notation of the designations"
    page: "Ch 2, pp. 12-22"
    reading: "site$designation_system decides when present. Otherwise designations showing signs of the FAO/USDA notation (E master; Oi, Oe, Oa; the letters a, d, i, l, o, q, r, w; an Arabic number before the master) are not read, whatever the country (pedons described in Canada by the USDA survey use that notation); a Canadian site, or a site with no country, is read as Canadian; a site of another country is not. Where designations are not read, only measured properties are, because z, m, f and v mean other things in the other notations. A profile with only letters common to both notations (A, Btz, Cz) on a Canadian site, or with no country, is read as Canadian; declare designation_system to avoid it."
  - topic: "Bt clay increase"
    page: "Ch 2, p. 15"
    reading: "The limits are USDA's argillic ones (+3 points below 15 % clay, ratio 1.2 from 15 to 40 %, +8 points above 40 %), measured against the lowest-clay horizon above or the one just above; clay films are required as the evidence of illuviation (the thin-section route is not read). A designated Bt with no eluvial horizon above it (a truncated soil, or only an Ap above) or across a lithologic discontinuity (a change of Roman numeral) is not put to the clay-increase test (criterion 5): the designation decides there."
  - topic: "Podzolic B in sands"
    page: "Ch 2, p. 17"
    reading: "'Sands' are read as layers with at least 85 % sand, where the pyrophosphate Al + Fe limit is 0.4 % instead of 0.6 %."
  - topic: "Podzolic B colour and layers"
    page: "Ch 2, p. 17; Ch 10, p. 108"
    reading: "Moist colour black (value 2.5 or less, chroma 2 or less), or hue 10YR or redder with chroma above 3 or value 3 or less; the 10YR 'becoming yellower with depth' clause and the Ch 10 waiver for Ap horizons are not applied. The Bh chemistry also needs moist value and chroma 3 or less (Ch 10). Adjacent Bh, Bhf and Bf layers are added up towards the 10 cm. Without clay, the Bf/Bhf chemistry is undecided ((Al + Fe) / clay cannot be tested)."
  - topic: "Gleysolic exclusions and thickness"
    page: "Ch 3 key E, p. 34; Ch 7, p. 81"
    reading: "The key's colour tests are not applied to Ah, Ap or Ae horizons (an Ae over 20 cm thick reaching below 60 cm still counts), as Ch 7 specifies; without designations, the uppermost mineral horizon is taken for the A. Clause a (chroma 1 or less) needs a grey matrix, moist value 4 or more: the key limits it to materials that turn brighter when oxidised, which a dark, humus-stained AB or Bm does not. A neutral hue (N) has chroma 0. Ch 7's 10-cm minimum thickness is not in the key and is not applied. Mottle contrast is read from mottle_contrast and cover from redoximorphic_features_pct; when the contrast is unknown and mottles are not recorded as absent, clauses b and c are undecided. Red materials (hue 5YR or redder) are recognised by hue alone, without the dithionite test."
  - topic: "Vertisolic order depth"
    page: "Ch 3 key C, p. 34"
    reading: "'The top of which occurs within 1 m' is read as applying to the slickenside horizon; the vertic horizon may be anywhere in the pedon. The vertic horizon is read from a strong v in a designation (the book gives no measurable limit)."
  - topic: "Chernozemic A soil climate"
    page: "Ch 2, p. 16 (criterion 7)"
    reading: "Read from site$mean_annual_soil_temp_C (>= 0 C) and site$soil_moisture_subclass (subhumid, semiarid, subarid or arid pass; humid and perhumid fail; the aquic subclasses lie on a separate scale (Table 4, p. 143) and leave it undecided); failing those, approximated from the USDA soil_temperature_regime (pergelic or gelic fails) and soil_moisture_regime (aridic, torric, ustic or xeric passes; perudic fails; udic, which straddles the Canadian subhumid-humid limit, and aquic leave it undecided). Unknown climate leaves the chernozemic A undecided, so later orders become provisional."
  - topic: "Chernozemic A structure"
    page: "Ch 2, p. 16 (criterion 5)"
    reading: "'Characteristically neither massive and hard nor single-grained' fails the horizon only when that structure is recorded; it is never a reason for an undecided result."
  - topic: "Permafrost unknown"
    page: "Ch 3 key A, p. 33"
    reading: "As with USDA's Gelisols, no sign of permafrost (no horizon at or below 0 C, no z suffix) is read as none, and permafrost_temp_C is listed as missing data."
  - topic: "Organic surface of unknown kind"
    page: "Ch 3 key B, p. 33"
    reading: "When the surface organic layer is neither designated (Of, Om, Oh) nor described by rubbed fibre or bulk density, 60 cm of organic material passes and less than 40 cm fails; between 40 and 60 cm the order is undecided. Option 2 applies only when a mineral layer starts within 40 cm of the surface. Folic material qualifies when more than 40 cm thick, or at least 10 cm when a lithic contact (R) follows with any mineral layer between them thinner than 20 cm and less than half the folic thickness; fragmental materials are not read. The 10-cm minimum over a lithic contact is applied to folic materials only (the key words it so; Ch 9 item 3 also allows it for peat)."
  - topic: "Brunisolic order"
    page: "Ch 3 key I, p. 34"
    reading: "Read from the designations: Bm, Btj and Bfj horizons are summed towards the 5 cm; a strong Bf thinner than 10 cm in all also qualifies."
  - topic: "Anthroposolic order"
    page: "2016 Taxonomic Key"
    reading: "The provisional Anthroposolic order of the 2016 field key is not part of the 3rd edition and is not keyed."
  - topic: "Chernozemic A colour contrast with the parent material"
    page: "Ch 2, p. 16 (criterion 3)"
    reading: "The parent material is the lowest C horizon of the first material (C or IC, not a IIC). When its moist colour is not recorded, the criterion is taken as met. The 'thick and dark enough to give 10 cm' option for a thin Ap is not implemented."
  - topic: "Chernozemic Ae conditions"
    page: "Ch 3 key G, p. 34"
    reading: "An Aej is an Ae: it qualifies through G.2 (dry value below 5), G.3 (thinner than the Ah or Ap above) or G.4 (no more than 5 cm under an Ahe). An Aej with no dry value that meets neither G.3 nor G.4 leaves the test undecided."
