# How soilKey reads the Hungarian diagnostic soil classification (Michéli et
# al. 2024, second approximation), where the text is silent or leaves a
# choice. Summarised in soilKey's own words; the text is the authors'.
readings:
  - topic: "Depths and the soil surface"
    page: "Section 7 (key); section 8"
    reading: "Depths are from the soil surface, the top of the first horizon (organic layers included), as the key writes 'from the soil surface'; the humic horizon begins at the mineral soil surface. 'Within X cm' means a top above X cm: a horizon that begins at X cm is not within it (except the continuous hard rock of the Kőzethatású talajok, 'not deeper than 25 cm' in the type's description). A gap in the description, and the part below a description that does not end on rock, may hold anything: a horizon may continue through it or begin in it, so a verdict that needs it stays undecided; features recorded when met (artefacts, mottles, secondary carbonates, cracks) stay absent there."
  - topic: "Horizon notation"
    page: "Section 4, table 1 (genetic horizons in the FAO 2006 notation); section 9 (typical profiles)"
    reading: "The FAO (2006) notation is read: a lithologic prefix (2, 3), masters H (peat), O, A, E, B, C and R, transitions (AB, BC) and intermingled horizons (A/B, C/R), suffixes, a suffix in parentheses as a weak expression (C(k)), and trailing digits (A2). The suffixes read: b buried, g stagnic, i slickensides (USDA ss is read as i), k carbonates, l capillary fringe (groundwater) mottling, m cementation, n sodium, p ploughing, r strong reduction, t clay accumulation, u artefacts, w a cambic horizon. A Cr is a strongly reduced C, not weathered rock. An R horizon is rock, not soil material: it carries no soil property. A subsurface horizon is any horizon below the uppermost one that is not an A, H or O horizon (an A2 belongs to the surface horizon); a row with no designation in the run of A rows from the surface may be an A, so it may or may not be subsurface. Ploughed: a p horizon (not buried) at the soil or mineral soil surface, or a site land use naming cropland or arable land."
  - topic: "Texture classes"
    page: "Section 8.6, texture triangle (p. 36)"
    reading: "The triangle the text prints is the USDA triangle with Hungarian names (sand 0.05-2 mm, silt 0.002-0.05 mm). A Hungarian field texture (homok, vályogos homok, homokos vályog, vályog, iszapos vályog, iszap, homokos agyagos vályog, agyagos vályog, iszapos agyagos vályog, homokos agyag, iszapos agyag, agyag; durva homok is coarse sand) is read first, then an English name or an Australian code, then lab clay, silt and sand on the triangle. Clay thresholds read the measured clay, else the clay range of the class. With clay alone: more than 10 % clay is not sand, more than 15 % is not sandy (sand or loamy sand)."
  - topic: "Organic horizon and Láptalajok"
    page: "Key, Láptalajok; section 8.1, organic horizons"
    reading: "An organic horizon has 20 % organic carbon or more (oc_pct as given; the text measures it by loss on ignition and warns that wet oxidation is unreliable); an H or O horizon with no carbon measured is organic; a row with a mineral texture or particle size and no carbon measured is mineral. The 40 cm are a run of adjacent organic rows whose top lies within 40 cm of the surface. Hugo's decision, 2026-10-29: an organic horizon with no bulk density measured counts as 1 g/cm3 or less (the text says peat never exceeds it); a measured density above 1 fails."
  - topic: "Antropogén talajok"
    page: "Key, Antropogén talajok; sections 8.1 and 8.4"
    reading: "Ploughing or turning to 50 cm: the ploughed horizons (p, not buried) in a run from the surface reach 50 cm, or the site's mechanical_mixing_depth_cm is 50 or more. Artefacts: artefacts_pct averaged by thickness from the surface to 100 cm or to shallower rock; artefacts are recorded when met, so a row without a record, and the part below the description, read as none. A continuous artificial material: geomembrane_present in a row within 100 cm, technic_hardmaterial_pct of 95 or more, or the site geomembrane (above 100 cm, or of unknown depth). Anthropogenic horizon: the text defines it as a surface horizon (8.1), so a run from the surface, 50 cm or more thick, of rows whose layer_origin names fill or other human-made or carried material (terric, urban, spoil, dredged, garden, refuse ...) or with a u suffix. The hortic route of the anthropogenic horizon (Al-P P2O5 of 500 mg/kg or more in the upper 20 cm) is not read: soilKey has no AL-P attribute."
  - topic: "Continuous hard rock; Köves-sziklás and Kőzethatású talajok"
    page: "Key, Köves-sziklás váztalajok and Kőzethatású talajok; section 8.3"
    reading: "Continuous hard rock is an R horizon; a cemented soil horizon is not rock. Köves-sziklás: an R with its top at 10 cm or less from the surface (a profile described to 10 cm or less that does not reach rock is undecided). Kőzethatású: an R with its top at 25 cm or less ('not deeper than 25 cm', the type's description in section 9); or less than 20 % fine earth (more than 80 % coarse fragments) as a thickness-weighted average from the surface to 75 cm or to shallower rock, as the WRB Leptosols read it ('debris to 75 cm' does not say where it starts); coarse fragments not recorded read as none."
  - topic: "Solonetz horizon (szolonyeces szint)"
    page: "Key, Szolonyec talajok; section 8.2"
    reading: "A subsurface horizon with exchangeable Na 15 % or more, or Na + Mg 25 % or more, and a columnar structure; where the soil is ploughed (an Ap that is not buried, or a site land use naming cropland or arable land), a columnar or a coarse granular structure very hard when dry. Hugo's decision, 2026-10-29: the shares are of the CEC (na_cmol / cec_cmol, or esp_pct when only it is given)."
  - topic: "Solonchak horizon (szoloncsákos szint)"
    page: "Key, Szoloncsák talajok; section 8.2 and its note"
    reading: "Total water-soluble salts 0.15 % or more in a run of rows 15 cm or more thick with its top within 50 cm. Hugo's decision, 2026-10-29: a new attribute, soluble_salts_pct (salt % by mass as Hungarian laboratories report it, from the EC of the saturated paste); the EC is not converted, since the text finds that conversion unreliable, so a profile without soluble_salts_pct leaves this type undecided and every later type provisional."
  - topic: "Swelling horizon and Duzzadó agyagtalajok"
    page: "Key, Duzzadó agyagtalajok; section 8.2"
    reading: "The swelling horizon is a subsurface horizon. Hugo's decision, 2026-10-29: 10 % or more slickensides is the class common, many or continuous (few fails); wedge-shaped peds, or an i suffix, also pass (a structure not described may be wedge-shaped). The swelling horizon is a run 25 cm or more thick, clay 30 % or more, with its top within 100 cm; clay of 30 % or more in every row from the surface down to the top of that run (each row that may begin such a run is read with the clay above it). Cracks that open and close: recorded cracks (cracks_width_cm above 0); otherwise the slickensides of the swelling horizon stand for them (Hugo's decision)."
  - topic: "Réti talajok"
    page: "Key, Réti talajok; section 8.3 (reductive conditions, groundwater gley colour pattern)"
    reading: "Hugo's decision, 2026-10-29: reductive conditions within 50 cm are shown by a positive dipyridyl (Childs') test, iron sulfides (sulfidic_s_pct above 0), methane (the site's methane_odour), or an l or r suffix on a horizon that begins within 50 cm; negative tests covering the whole of 0-50 cm (or to shallower rock) fail; otherwise undecided. The redox potential (rH below 20) is not read: soilKey has no such attribute. The groundwater gley colour pattern of a horizon: reduced colours, red mottling of 5 % or more (redoximorphic_features_pct; not recorded reads as none), or an l or r suffix. The text lists the hues 2.5Y, 5Y, 5G, 5B and GLEY and calls the colours grey: soilKey reads 2.5Y and 5Y with a moist chroma of 2 or less, and green, blue or neutral hues; the matrix colour stands for the 90 % the text asks. 'At least half of the matrix between 50 and 100 cm' is half of that thickness; the matrix ends at continuous hard rock (rock at 50 cm or less leaves none)."
  - topic: "Carbonate classes and Karbonát talajok"
    page: "Key, Karbonát talajok; section 8.4"
    reading: "Weakly calcareous is 2 % CaCO3 or more. Without a measure: an effervescence of none is below 2 %; slight may be the trace class (audible only, below 2 %), so it leaves 2 % undecided; moderate or stronger is 2 % or more; a k suffix is weakly calcareous. Karbonát talajok: a run of rows with 25 % CaCO3 or more, 15 cm or more thick, its top within 50 cm; an effervescence alone does not show 25 % (none or slight shows less)."
  - topic: "Humic horizon and Mezőségi talajok"
    page: "Key, Mezőségi talajok; section 8.1"
    reading: "Favourable structure: granular, crumb or subangular blocky (not structureless, platy, prismatic, columnar or angular blocky); the grade is not read. Dark: moist value and chroma 3 or less, and, when recorded, dry value and chroma 5 or less. Base saturation 50 % or more; a calcareous horizon reads as saturated. The humic horizon is a run of such rows from the mineral soil surface, 20 cm or more thick. For the Mezőségi talajok every row of that run has 1 % organic carbon or more, is sandy loam or finer and has 20 % coarse fragments or less (not recorded: none). Secondary carbonates: secondary_carbonates_pct or carbonate_soft_pct above 0, or a k suffix, in a weakly calcareous run 15 cm or more thick within 100 cm. Base saturation from the surface: every row to 100 cm, or to the end of a shallower description that ends with a recorded bottom."
  - topic: "Clay accumulation horizon and Agyagbemosódásos talajok"
    page: "Key, Agyagbemosódásos talajok; section 8.2"
    reading: "A subsurface horizon with 8 % clay or more and loamy sand or finer. Where the soil is not ploughed and not truncated (the site's anthropic_truncation), the horizon as a whole has 1.4 times the clay of the horizon above it: a run of rows, each with 1.4 times the clay of the horizon directly above the run's top (so a Bt2 is not compared with the Bt1); a gap in the description above a row may hold a horizon of any clay. Otherwise, and for a row whose material differs from the horizon above it (another lithologic prefix: the text's 'lithologic change in the profile' is read where it makes the comparison meaningless), well-visible clay films (clay_films_amount common or more; a t suffix when the films are not recorded). A run 10 cm or more thick with its top within 100 cm; or lamellae (a designation naming them) of 15 cm in all (the thickness of each lamella, 1 cm or more, is not recorded)."
  - topic: "Homoktalajok"
    page: "Key, Homoktalajok"
    reading: "Coarse sand, sand or loamy sand to 100 cm or to shallower hard rock or a cemented layer (an m suffix, or a cementation class moderately cemented or stronger); finer mineral rows 15 cm or less in all, and some sandy material (a cemented layer at the surface leaves none). A part of the window the description does not reach may be finer."
  - topic: "Cambic horizon and Barnaföldek"
    page: "Key, Barnaföldek; section 8.2"
    reading: "A subsurface horizon (a B, or a transition with B such as AB, BA, BC or B/C; or a row with no designation below the uppermost; not buried) 15 cm or more thick within 100 cm. Against its parent material, the first C horizon below it in the same material: a more developed structure (pedal over massive or single grain, or a stronger grade), or a moist colour one or more Munsell units different (value, chroma, or one hue page). Against the horizon directly below it, as the text says: a different carbonate content, read as 2 percentage points of CaCO3 or more so that measurement noise does not count. A w suffix is the surveyor's mark of developed colour or structure and passes. With no C below in the same material, the structure and colour stay undecided. A row with no designation may also be a C (or an A), so it leaves the cambic horizon undecided at most."
  - topic: "Stratified material and Hordaléktalajok"
    page: "Key, Hordaléktalajok; section 8.4"
    reading: "Within 50 cm (or to shallower hard rock), two adjacent mineral layers that differ by 5 points or more of coarse fragments, or by 10 points or more of sand (Hugo's decision, 2026-10-29: USDA sand, 2-0.05 mm, where the text measures 2-0.02 mm), or an organic carbon that rises with depth by 0.2 points or more ('irregular change'); or organic carbon of 0.2 % or more in the horizon at 100 cm (a profile that ends on rock above 100 cm has none). Or, within 100 cm, a mineral layer with organic carbon 0.2 points or more above that of the layer directly over it. A gap in the description, or the soil below a description that ends (not on rock) above 50 or 100 cm, may hold such a layer, so a verdict of no stays undecided there."
  - topic: "Names"
    page: "Section 5 (rules of naming)"
    reading: "Hugo's decision, 2026-10-29: the type is written in the Hungarian singular, as the text's naming example does ('Savanyú, humuszszegény Agyagbemosódásos talaj (...)'); levels$name_en gives an English gloss (soilKey's, not the authors'). The codes (LAP ... FOL) are soilKey's; the text has none. The subtype properties (before the name) and the variety properties (after it, in parentheses) are not keyed in this release."
