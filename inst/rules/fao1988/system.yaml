# Registry entry for this classification system (read by R/systems-registry.R).
# The FAO-Unesco legend is one module with two editions (Hugo's decision Q1):
# one user function classify_fao(pedon, edition), two registry ids, fao1988
# (here, order 16) and fao1974 (order 17, in a later part), each a thin
# wrapper with its own rule folder.
id: fao1988
order: 16
aliases: [fao, fao88, revised_legend]
legacy: false
default: false
status: experimental
namespace: fao88
classifier: classify_fao1988
result_slot: fao1988
top_level: major_groups
# the 153 soil units (v0.9.385) are read from units/ (one file per
# grouping, the units of each grouping under its code, in the key's order)
levels: [major_groups, units]
