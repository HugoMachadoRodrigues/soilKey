# The numbers of the FAO-Unesco Revised Legend that soilKey's FAO readers
# and diagnostics use, as printed, with the printed page. Source: FAO (1988).
# FAO/Unesco Soil Map of the World, Revised Legend. World Soil Resources
# Report 60, FAO, Rome; reprinted with corrections 1990 and with updates as
# ISRIC Technical Paper 20, Wageningen, 1997 (the text in hand; PDF page =
# printed + 5). The criteria are paraphrased in soilKey's words; no text of
# the book is shipped. An entry whose source is "soilKey" is a number or a
# reading soilKey adds where the text gives none, with the decision that set
# it (data-raw/fao_readings.yaml). Organic carbon (OC) and CEC per kg of clay
# are the units of this edition.
#
# The copy of data-raw/fao_thresholds_1988.yaml (0.9.381) that the registry
# part of the 1988 legend (0.9.384) ships with the rules; the two are kept
# identical (test-v09384-fao88-groupings.R). The defaults of the readers in
# R/fao-readers.R are these numbers (test-v09381-fao-readers.R).
edition: "FAO-Unesco Revised Legend, World Soil Resources Report 60 (1988), text of the ISRIC reprint 1997"

general:
  page: 42
  buried_new_material_cm:        {value: 50, page: 42, source: "ch. VI principles: horizons buried by 50 cm or more of new material are not diagnostic"}
  buried_new_material_andic_cm:  {value: 35, page: 42, source: "the same, 35 cm when the new material has andic properties"}
  units_upper_boundary_cm:       {value: 50, page: 42, source: "soil units have their upper boundary at the surface or less than 50 cm below it"}
  diagnostic_upper_limit_cm:     {value: 125, page: 42, source: "diagnostic horizons and properties have their upper limit within 125 cm unless specified"}
  two_b_horizons_within_cm:      {value: 125, page: 42, source: "of two diagnostic B horizons within 125 cm the upper one decides"}
  mineral_soil_h_max_cm:         {value: 40, page: 42, source: "mineral soils lack an H horizon of 40 cm or more"}
  mineral_soil_h_sphagnum_cm:    {value: 60, page: 42, source: "60 cm if mainly sphagnum or moss or bulk density below 0.1"}
  mineral_soil_h_cumulative_cm:  {value: 80, page: 42, source: "from the surface or cumulative within the upper 80 cm"}
  depth_datum: {value: "soil surface", page: "25-42, 75", source: "soilKey: the top of the first recorded horizon, H and O included (Hugo's decision Q9 of 2026-11-08)"}
  within_reading: {value: "upper boundary at or above the depth", page: 42, source: "soilKey (default 11 of 2026-11-08)"}

units:
  cec_per_clay: {value: "cec_cmol x 100 / clay_pct", page: 25, source: "ch. IV preamble: CEC per kg clay; the deduction for organic matter 'may be desirable' and is not made (default 1)"}
  methods: {value: "USDA SCS 1984; ISRIC 1995", page: "25, 42, 127-131"}
  cec_method: {value: "NH4OAc pH 7", page: 130, source: "Appendix 5; bases and base saturation by NH4OAc (pp. 26-27, 75-89)"}
  ecec_ferralic: {value: "NH4OAc bases + 1 M KCl exchangeable acidity", page: 31, source: "ferralic B item 3; Appendix 5 (p. 130) sums bases and exchangeable Al: the definition at the point of use governs (Q12)"}
  om_to_oc_factor: {value: 1.724, page: "-", source: "soilKey (Q11): used only where a 1988 test is written in organic matter"}

texture_classes:
  page: 107
  source: "Appendix 2, guidelines for mapping; the class of the upper 30 cm"
  coarse:  {clay_lt: 15, sand_gt: 70}
  medium:  {clay_lt: 35, sand_lt: 70, sand_max_with_clay_15: 85}
  fine:    {clay_gt: 35}
  upper_cm: {value: 30, page: 107}
  unassigned: {value: "clay exactly 35 %; sand exactly 70 % with clay < 15 %", source: "soilKey reads both as medium (readings)"}

slope_classes:
  page: 107
  a: {min_pct: 0, max_pct: 8}
  b: {min_pct: 8, max_pct: 30}
  c: {min_pct: 30}

