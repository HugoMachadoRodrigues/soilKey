# The correspondence between the FAO-Unesco Legend of 1974 (system id
# fao1974) and the Revised Legend of 1988 (fao1988), from Appendix 4 of the
# Revised Legend, "Main changes in the revised legend", section 4 (printed
# pp. 115-126; ISRIC reprint of 1997, PDF page = printed + 5), with the
# three changes the appendix does not flag added in [brackets] (plan section
# 9; Hugo's decision Q8). Appendix 4 lists the 1988 groupings and units with
# a comment where one changed ("formerly Orthic Luvisols", "new", "deleted",
# "gleyic properties between 0-100 cm (was 0-50 cm)"); the 1974 code beside
# each row is read from the 1974 list (74 pp. 12-13) by name or by the
# "formerly" the appendix prints. The comments are paraphrased; no text of
# the book is shipped. Codes only: the names are read from the rule files of
# each edition (load_rules("fao1974"), load_rules("fao1988")).
#
# Used for display (the edition line of print() and the reports) and for
# reading labelled data; it NEVER classifies (Q8): classify_fao() keys each
# edition by its own text.
#
# relation:
#   same             the same name, a new code, no comment printed
#   renamed          the appendix prints "formerly <1974 name>"
#   amended          the appendix prints a change of the definition
#   renamed_amended  both
#   merged           several 1974 classes became one 1988 class
#   split            one 1974 class went to several 1988 classes
#   deleted          no 1988 class; `to` empty (the appendix prints
#                    "deleted", or soilKey reads a deletion it does not print)
# also:             soilKey's alternative targets, read from a group comment
#                   of the appendix (Lixisols, Alisols, Plinthosols,
#                   Calcisols, Gypsisols); [bracketed] in the display, with
#                   the condition in `also_when`.
# bracketed: true   a row the appendix does not print (soilKey's addition).

source: "FAO (1988). FAO/Unesco Soil Map of the World, Revised Legend. World Soil Resources Report 60; ISRIC reprint 1997, Appendix 4, pp. 113-126."

# --- the 26 major soil groups of 1974 -----------------------------------------------------
groups:
  - {from: "J", to: ["FL"], relation: "amended", page: 115, note: "Mollic or umbric A allowed; fluvic properties replace recent alluvial deposits; salic properties allowed."}
  - {from: "G", to: ["GL"], relation: "amended", page: 116, also: ["AR", "FL", "PT"], also_when: "coarse textured materials (Gleyic Arenosols), alluvium with fluvic properties (Fluvisols), plinthite within 125 cm (Plinthosols)", note: "Coarse textured materials and alluvium with fluvic properties excluded; plinthite within 125 cm not allowed."}
  - {from: "R", to: ["RG"], relation: "amended", page: 116, also: ["AR", "LP"], also_when: "coarse textured (Arenosols) or very stony materials (Leptosols)", note: "Coarse textured and very stony materials excluded."}
  - {from: "I", to: ["LP"], relation: "merged", page: 115, note: "Lithosols, Rendzinas and Rankers grouped in the new Leptosols."}
  - {from: "E", to: ["LP"], relation: "merged", page: 115, note: "Lithosols, Rendzinas and Rankers grouped in the new Leptosols."}
  - {from: "U", to: ["LP"], relation: "merged", page: 115, note: "Lithosols, Rendzinas and Rankers grouped in the new Leptosols."}
  - {from: "Q", to: ["AR"], relation: "amended", page: 117, note: "Fluvic and andic properties excluded; the albic material and B characteristics clause deleted; albic E allowed."}
  - {from: "T", to: ["AN"], relation: "amended", page: 118, note: "Defined by andic properties instead of bulk density and vitric material."}
  - {from: "V", to: ["VR"], relation: "amended", page: 118, note: "Subdivisions changed: base saturation and calcic or gypsic horizons replace the chroma split."}
  - {from: "B", to: ["CM"], relation: "amended", page: 118, also: ["CL", "GY"], also_when: "a calcic or gypsic horizon (Calcisols, Gypsisols)", note: "Calcic or gypsic horizon deleted from the definition (such soils now Calcisols or Gypsisols); 'lacking an aridic moisture regime' deleted."}
  - {from: "S", to: ["SN"], relation: "amended", page: 119, note: "The clause on an albic E with hydromorphic properties and an abrupt textural change deleted."}
  - {from: "Z", to: ["SC"], relation: "amended", page: 120, note: "Defined by salic properties: salinity within the upper 30 cm at least part of the year."}
  - {from: "K", to: ["KS"], relation: "same", page: 120}
  - {from: "C", to: ["CH"], relation: "amended", page: 120, note: "Gypsic horizon deleted from the definition."}
  - {from: "H", to: ["PH"], relation: "amended", page: 121, note: "Base saturation (NH4OAc) of 50 % or more throughout the upper 125 cm added."}
  - {from: "M", to: ["GR"], relation: "amended", page: 121, note: "Uncoated silt and sand grains replace bleached coatings; an argic B required."}
  - {from: "L", to: ["LV"], relation: "amended", page: 122, also: ["LX", "PT"], also_when: "an argic B with a CEC below 24 cmol(+)/kg clay (Lixisols); plinthite (Plinthosols)", note: "Argic B with a CEC of 24 cmol(+)/kg clay or more; soils with plinthite to the Plinthosols; 'lacking an aridic moisture regime' deleted."}
  - {from: "W", to: ["PL"], relation: "same", page: 123}
  - {from: "D", to: ["PD"], relation: "same", page: 123}
  - {from: "P", to: ["PZ"], relation: "amended", page: 124, note: "Thin iron pan deleted from the definition (now the placic phase)."}
  - {from: "A", to: ["AC"], relation: "amended", page: 124, also: ["AL"], also_when: "an argic B with a CEC of 24 cmol(+)/kg clay or more (Alisols)", note: "Argic B with a CEC below 24 cmol(+)/kg clay; 'lacking an aridic moisture regime' deleted."}
  - {from: "N", to: ["NT"], relation: "renamed_amended", page: 125, note: "Formerly Nitosols; requirements on horizon boundaries, clay content and nitic properties added; 'lacking an aridic moisture regime' deleted."}
  - {from: "F", to: ["FR"], relation: "amended", page: 125, also: ["PT"], also_when: "plinthite (Plinthosols, soils previously grouped with the Ferralsols or Gleysols)", note: "Ferralic B replaces oxic B."}
  - {from: "O", to: ["HS"], relation: "amended", page: 126, note: "Units by the decomposition of the plant materials and by drainage instead of Eutric and Dystric."}
  - {from: "X", to: [], relation: "deleted", page: 115, also: ["CL", "GY", "CM", "LV", "LX", "RG", "AR"], also_when: "by their morphology, with a yermic phase where appropriate", note: "Classified on an aridic moisture regime; now incorporated in other groups, with a yermic phase where appropriate."}
  - {from: "Y", to: [], relation: "deleted", page: 115, also: ["CL", "GY", "CM", "LV", "LX", "RG", "AR"], also_when: "by their morphology, with a yermic phase where appropriate", note: "Classified on an aridic moisture regime; now incorporated in other groups, with a yermic phase where appropriate."}

# The groupings of 1988 with no 1974 group (p. 115, note 2; the Leptosols
# take three 1974 groups, above).
new_groups:
  - {to: "AT", page: 126, note: "New: man-influenced soils."}
  - {to: "CL", page: 119, note: "New."}
  - {to: "GY", page: 119, note: "New."}
  - {to: "LX", page: 122, note: "New: argic B with a CEC below 24 cmol(+)/kg clay."}
  - {to: "AL", page: 124, note: "New: former Acrisols with a CEC of 24 cmol(+)/kg clay or more in the argic B."}
  - {to: "PT", page: 125, note: "New: soils previously grouped with the Ferralsols or Gleysols."}

