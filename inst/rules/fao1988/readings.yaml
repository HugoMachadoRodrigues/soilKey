# The readings soilKey makes of the FAO-Unesco Revised Legend (FAO 1988,
# World Soil Resources Report 60; the text of the ISRIC reprint of 1997,
# Technical Paper 20; PDF page = printed + 5), system id fao1988, where the
# text is silent or ambiguous: the entries of data-raw/fao_readings.yaml
# that concern the 1988 edition (the shared module reads both editions;
# fao1974 gets its own file with its key). Pages are printed pages; "74 p."
# is the 1974 legend. An entry ending "(Hugo, 2026-11-08)" or "(Hugo,
# 2026-11-09)" is a decision of the owner, in soilKey's words; an entry
# ending "(soilKey's reading, for Hugo to confirm, <date>)" is soilKey's own
# and waits for his word. The criteria are paraphrased; no text of the book
# is shipped. 0.9.381 holds the shared readers; 0.9.382 the diagnostic
# horizons; 0.9.383 the diagnostic properties; 0.9.384 the registry and the
# 28 major soil groupings; 0.9.385 the 153 soil units; 0.9.386 the phases;
# 0.9.391 the crosswalk of Appendix 4 (crosswalk.yaml); 0.9.392 the reading
# of labels and the ISIS benchmark.
readings:
  # --- the decisions of 2026-11-08 that this part applies -----------------------------
  - topic: "One module, two editions"
    edition: [1988, 1974]
    page: "pp. 75-89; 74 pp. 43-53"
    reading: "One module with an edition switch; two registry ids (fao1988, fao1974) in a later part, thin wrappers of one classify_fao(). The shared readers take the edition as an argument; no site attribute carries it (Q1, default 19) (Hugo, 2026-11-08)."
  - topic: "Depth datum"
    edition: [1988, 1974]
    page: "pp. 25-42, 75; 74 pp. 32, 43"
    reading: "Depths are read from the soil surface as the texts write it: the top of the first recorded horizon, H and O horizons included; a profile written with its O above 0 is read from the top of the O (.fao_depths()) (Q9) (Hugo, 2026-11-08)."
  - topic: "Depths not written; texture of the 125 / 90 / 75 cm rule; coarse textured materials"
    edition: [1988, 1974]
    page: "p. 42, 80; 74 pp. 5, 29, 49-53"
    reading: "A diagnostic with no depth in the key is read within 125 cm in both editions. The 1974 rule of 125, 90 and 75 cm for coarse, medium and fine textures reads the texture class of the upper 30 cm with the 1974 classes (.fao_texture_upper30(), .fao_depth_by_texture()). The coarse textured materials of the 1988 Gleysols are materials coarser than sandy loam (.fao_coarser_than_sandy_loam()) (Q10) (Hugo, 2026-11-08)."
  - topic: "pH ratios, CEC, ECEC and base saturation"
    edition: [1988, 1974]
    page: "pp. 31-32, 39, 130; 74 pp. 24, 27-29, 41, 47"
    reading: "Values as reported, flagged where the method is known to differ. The new ph_h2o_1to1 and ph_h2o_1to5 are read first, ph_h2o after them, flagged (.fao_ph()). The NH4Cl CEC is cec_cmol with cec_method nh4cl, else ecec_cmol, flagged (.fao_cec_clay(method = 'nh4cl')); the NH4OAc CEC is cec_cmol, flagged when cec_method names another method. The ECEC of 1988 is item 3 of the ferralic B: NH4OAc bases plus 1 M KCl exchangeable acidity (exch_acidity_kcl_cmol); the ECEC of 1974 is bases plus KCl aluminium (.fao_ecec_clay()). Base saturation is bs_pct by NH4OAc (.fao_bs()) (Q12) (Hugo, 2026-11-08)."
  - topic: "New attributes"
    edition: [1988, 1974]
    page: "pp. 25-41, 67-71; 74 pp. 20-32"
    reading: "All the attributes of plan section 10 are added, with the fallbacks written in their descriptions: horizon p2o5_citric_mg_kg, extractable_acidity_ph82_cmol, cec_ph82_cmol, al_dcb_pct, exch_acidity_kcl_cmol, ph_h2o_1to1, ph_h2o_1to5, rock_structure_pct, smeary_consistence, bleached_ped_coatings, ignition_redder, spodic_pellets, skeletans_pct, skeletan_thickness_mm, carbonate_coatings_faces_pct, nodule_size_max_cm, dta_low_endotherm, munsell_hue_rubbed, munsell_value_rubbed, munsell_chroma_rubbed, pitted_quartz_pct, palygorskite_pct, aeolian_crack_infill; site flooding_days_growing_period, rudic_recorded, reference_fao74. No other system reads them (Q19) (Hugo, 2026-11-08)."
  - topic: "Rubbed colours and the limits between Munsell chips"
    edition: [1988, 1974]
    page: "pp. 26, 82-89; 74 pp. 24, 47-53"
    reading: "The rubbed colour is munsell_*_rubbed where recorded, else the moist colour read as rubbed, flagged moist_colour_for_rubbed (.fao_colour_rubbed()); Chromic reads the moist colour. The limits 'less than 3.5' and '5.5' are compared with the recorded number: whole chips of 3 and 5 pass, a value recorded as 3.5 fails (Q24) (Hugo, 2026-11-08)."
  - topic: "'Many' coarse mottles of the ferric properties"
    edition: [1988, 1974]
    page: "p. 35; 74 p. 28"
    reading: "'Many' is 15 % or more and 'coarse' more than 20 mm, the classes of the 1990 Guidelines (fao_thresholds_*.yaml) (Q22) (Hugo, 2026-11-08)."
  - topic: "Technical defaults of the questions file"
    edition: [1988, 1974]
    page: "pp. 25-42; 74 pp. 25, 32"
    reading: "CEC per kg clay = cec_cmol x 100 / clay_pct, no deduction for organic matter (default 1); clay as reported (3); 'within X cm' = the upper boundary of the feature at or above X, 'between 20 and 50 cm' = every layer overlapping 20-50 cm, 'in some part' = one layer, two diagnostic B horizons within 125 cm: the upper one decides (11); the clay increase by .fao_clay_increase() with the bands 3 / 1.2 / 8 and the breaks 15 and 40 as arguments, equal to the usda branch of test_clay_increase_argic(), the exact 15 and 40 of 1974 read in the same way (< 15; 15 to < 40; >= 40) (12, 18) (Hugo, 2026-11-08)."

  # --- the readings of this part (0.9.381), decided on the review --------------------------
  - topic: "Texture classes at the printed boundaries"
    edition: [1988, 1974]
    page: "p. 107; 74 p. 5"
    reading: "Both texts leave a clay content of exactly 35 % and a sand content of exactly 70 % (1988) or 65 % (1974) with less than 15 (18) % clay unassigned. soilKey reads both as medium textured: coarse is clay below 15 (18) % and sand above 70 (65) %, fine is clay above 35 %, medium the rest (.fao_texture_class()). The 1974 case is plan section 12 item 25; the 1988 one is the same gap (Hugo, 2026-11-08)."
  - topic: "The solum"
    edition: [1988, 1974]
    page: "p. 26; 74 p. 24"
    reading: "The solum of the mollic A rule is the A, E and B horizons with their transitions (AB, BA, AE, EB, BC, AC, A/B); CB, C, R, H and O are not. Its base is the base of the deepest such horizon, measured from the soil surface of Q9, so an O or H horizon on top counts in its depth; a description that ends in the solum gives a lower bound (.fao_solum()). AC is counted because the mollic A of both editions counts AC as part of the A (Hugo, 2026-11-08)."
  - topic: "The solum with undesignated horizons"
    edition: [1988, 1974]
    page: "p. 26; 74 p. 24"
    reading: "A horizon without a designation above the last A, E or B does not matter. One between the last A, E or B and the first C or R below it (or below it with no C or R after) leaves the base of the solum undecided, with the designation named as missing (Hugo, 2026-11-09)."
  - topic: "Buried horizons"
    edition: [1988, 1974]
    page: "p. 42; 74 p. 32"
    reading: "A buried horizon is one whose designation has the suffix b (Ab, 2Btb); the new material is all that lies above the first of them, its thickness the depth of that horizon. When the mantle is 50 cm or more (1988 also 35 cm or more over an andic mantle) that horizon and every horizon below it are not diagnostic; with the andic reading of the mantle undecided between 35 and 50 cm the answer is undecided (.fao_buried()) (Hugo, 2026-11-08)."
  - topic: "Vertical distance of the clay increase"
    edition: [1988, 1974]
    page: "p. 28 item 4; 74 p. 25"
    reading: "'The increase must be reached within a vertical distance of 30 (15) cm' is read as the gap between the base of the coarser overlying layer and the top of the layer compared: the layers in between add up to no more than 30 (15) cm. A pair across a lithological discontinuity (a different material number in the designation) is undecided, not failed (.fao_clay_increase(distance =)) (Hugo, 2026-11-08)."
  - topic: "ECEC of 1988 without the KCl acidity"
    edition: [1988]
    page: "pp. 31, 130"
    reading: "Without exch_acidity_kcl_cmol the ECEC of the ferralic B reads al_kcl_cmol, then al_cmol (KCl aluminium, the acidity of most acid soils), flagged; without the bases, ecec_cmol as recorded, flagged ecec_as_recorded (Hugo, 2026-11-08)."
  - topic: "Base saturation not recorded"
    edition: [1988, 1974]
    page: "pp. 26-27, 75-89; 74 pp. 24, 43-53"
    reading: "Where bs_pct is not recorded and the four bases and cec_cmol are, the base saturation is 100 x bases / CEC (at most 100), flagged bs_computed (Hugo, 2026-11-08)."
  - topic: "Continuous rock in the readers"
    edition: [1988, 1974]
    page: "p. 35; 74 p. 32"
    reading: "A layer is rock for the windows and the weighted means when its designation is R (2R, R/Cr), or when bedrock_pct is 90 or more together with a hard rupture resistance recorded (hard, very hard, extremely hard or rigid: continuous hard rock, p. 35); bedrock_pct alone is not rock. A window that ends on rock is complete, and a weighted mean over it averages the soil above the rock, except the strongly humic mean of 1988, which counts the depth below the soil as zero (p. 40). The key's own test of continuous hard rock follows with the diagnostics (Hugo, 2026-11-09)."
  - topic: "Strongly humic in soils shallower than 50 cm"
    edition: [1988]
    page: "p. 40"
    reading: "The text gives the 100 cm average for soils 50 to 100 cm deep. A soil shallower than 50 cm over rock is read the same way: the carbon is divided by 100 cm, the depth below the soil counting as zero, flagged zero_below_rock_soil_shallower_than_50cm (Hugo, 2026-11-09)."
  - topic: "Windows with gaps or overlaps"
    edition: [1988, 1974]
    page: "p. 42; 74 p. 32"
    reading: "A window is described only when the clipped thicknesses of its soil layers fill it from its top to its base or to the rock: a gap in the depths, a layer without depths or a description that stops above the base leaves a test over it undecided (missing top_cm and bottom_cm); layers that overlap in depth are flagged overlapping_layers and a mean over them undecided. 'Within X cm' fails only when the description is filled to below X, or to rock at or above X (Hugo, 2026-11-09)."
  - topic: "Neutral hues"
    edition: [1988, 1974]
    page: "pp. 32-35; 74 pp. 27-28"
    reading: "A neutral hue (N) is neither redder nor yellower than any hue: 'redder than 7.5YR' and '2.5Y or more' fail on it (.fao_hue_cmp()) (Hugo, 2026-11-08)."
  - topic: "The ignition test from free iron, both ways"
    edition: [1988, 1974]
    page: "p. 81; 74 pp. 39, 47"
    reading: "Without ignition_redder, free iron (fe_dcb_pct) below 0.5 % of the fine earth reads as not turning redder, flagged (Q23); 0.5 % or more leaves the test undecided, because the footnote gives only the first direction (Hugo, 2026-11-09)."
  - topic: "Texture of the upper 30 cm under an organic surface"
    edition: [1988, 1974]
    page: "p. 107; 74 p. 5"
    reading: "Under H or O horizons (or an undesignated layer of 20 % organic carbon or more) the upper 30 cm of the texture class are measured from the top of the first mineral horizon, flagged texture_from_mineral_surface: the class of the map symbol describes the mineral soil (.fao_texture_upper30()) (Hugo, 2026-11-09)."

  # --- soilKey's readings of the code, for Hugo's word ------------------------------------------
  - topic: "Palygorskite named in the clay mineralogy"
    edition: [1988]
    page: "p. 70"
    reading: "Without palygorskite_pct, a clay_mineralogy naming palygorskite (or attapulgite), the dominant clay mineral, is read as 100 % of the clay, flagged; not named, absent (.fao_palygorskite()) (Hugo, 2026-11-09)."
  - topic: "Hue families beyond Y and RP"
    edition: [1988, 1974]
    page: "pp. 32, 35; 74 pp. 27-28"
    reading: "On the hue rank from red to blue, the GY, G, BG, B and PB hues count as '2.5Y or more' (the jarosite mottles), and RP hues as redder than 7.5YR (the ferric mottles) (.fao_hue_cmp()) (Hugo, 2026-11-09)."
  - topic: "Texture groups of tonguing"
    edition: [1988, 1974]
    page: "p. 41; 74 p. 31"
    reading: "One grouping serves both editions: fine (clay, silty clay, sandy clay), moderately fine (sandy clay loam, clay loam, silty clay loam) and medium or coarser (silt loam, loam, sandy loam and coarser, and silt, which neither text names). The very fine sandy loam that 1974 adds falls in the sandy loams, as soilKey records no very fine sand (.fao_tonguing_texture()) (Hugo, 2026-11-09)."

  # --- 0.9.382 (the diagnostic horizons of 1988, R/diagnostics-fao88-horizons.R) ----------
  # Hugo's decisions of 2026-11-08 that this part applies.
  - topic: "Clay skins of the argic B"
    edition: [1988]
    page: "p. 28 items 4 and 6"
    version: "0.9.382"
    reading: "Clay skins or oriented clay on 1 % or more: clay_films_amount few or more, or micromorph_argillans_pct or clay_coatings_thin_section_pct of 1 % or more; not recorded, a B designated with the suffix t counts as the observation, flagged bt_designation_for_clay_skins; else absent (Q13) (Hugo, 2026-11-08)."
  - topic: "Citric P2O5 of the mollic and umbric A"
    edition: [1988]
    page: "p. 27 item 6"
    version: "0.9.382"
    reading: "A measured P2O5 decides (250 mg/kg or more fails, unless it increases below the A); not measured, the anthropic layers the limit is meant to remove decide: recorded artefacts, anthropic material, a layer_origin naming anthropic, midden or plaggen material or an overthickened A at the site fail, flagged p2o5_exclusion_from_anthropic_record; none recorded passes, flagged p2o5_not_recorded_no_anthropic_layer (Q14) (Hugo, 2026-11-08)."
  - topic: "Eutric and dystric histic H; organic soil materials"
    edition: [1988]
    page: "pp. 25-26, 39; 74 p. 24"
    version: "0.9.382"
    reading: "histic_h_fao88(base = 'eutric') asks pH (H2O 1:5) 5.5 or more throughout the H, 'dystric' below 5.5 in some part (ph_h2o stands in, flagged). Organic soil materials: 20 % OC or more pass; below the saturated limit (12 + 0.1 x clay %, at most 18; 12 without clay) fail; between, the drainage recorded at the site decides, else undecided (Q15) (Hugo, 2026-11-08)."
  - topic: "Ferralic B clay and weatherable minerals"
    edition: [1988]
    page: "pp. 29-31, 41"
    version: "0.9.382"
    reading: "The ferralic B asks 8 % clay; weatherable_minerals_pct (20-200 um) is read for the 50-200 um fraction of the cambic and ferralic B, flagged weatherable_minerals_20_200um_for_50_200um (Q16) (Hugo, 2026-11-08)."
  - topic: "Spodic B chemistry and its stand-ins"
    edition: [1988]
    page: "pp. 30-31"
    version: "0.9.382"
    reading: "The extractable iron of item 3a is pyrophosphate iron (fe_pyro_pct). Where the 1975 chemistry leaves the horizon undecided, spodic_horizon_usda() and then the WRB spodic() stand in, flagged stand_in_for_spodic_chemistry_1975, with the result marked as a lower grade (Q17) (Hugo, 2026-11-08)."
  - topic: "Sulfuric horizon"
    edition: [1988]
    page: "p. 32"
    version: "0.9.382"
    reading: "pH (H2O 1:1) below 3.5 over 15 cm or more decides; jarosite mottles are reported, not required (Q18) (Hugo, 2026-11-08)."
  - topic: "Defaults applied to the horizons"
    edition: [1988]
    page: "pp. 26, 28, 32, 34, 42"
    version: "0.9.382"
    reading: "A solum of exactly 75 cm takes the rule of more than 25 cm (default 2); the petrocalcic and petrogypsic horizons have no minimum thickness (4); the abrupt textural transition of argic item 6 is a lower boundary recorded abrupt or clear, as the abrupt textural change (5); runs and windows as default 11; the clay increase by .fao_clay_increase() (18). The subsurface horizons have their upper limit within 125 cm (p. 42; argument max_top_cm) (Hugo, 2026-11-08)."

  # soilKey's readings of this part, decided by Hugo on the review (2026-11-09).
  - topic: "Upper bound of the histic H"
    edition: [1988]
    page: "pp. 25, 42"
    version: "0.9.382"
    reading: "The histic H is more than 20 cm thick; its printed upper bound (less than 40 cm, 60 cm if sphagnum or very light) only separates the Histosols, whose gate the key reads first, and is reported as evidence, not tested. A plough layer is a surface run of layers designated A, H or O with the suffix p (Hugo, 2026-11-09)."
  - topic: "Saturation of the organic soil materials from the drainage class"
    edition: [1988]
    page: "p. 39"
    version: "0.9.382"
    reading: "Saturated for long periods: very poorly, poorly, somewhat poorly or imperfectly drained, or an artificially drained site; never saturated for more than a few days: well drained or better. Moderately well drained leaves it undecided. Portuguese classes read likewise (Hugo, 2026-11-09)."
  - topic: "Mixing the 18 cm of the mollic A"
    edition: [1988]
    page: "p. 26"
    version: "0.9.382"
    reading: "The A is the run of A layers (AB, AE, AC included; undesignated layers flagged) from the first mineral layer; an O or H above it is not mixed into it. Its upper 18 cm are mixed (thickness-weighted means of moist value and chroma, dry value, OC, base saturation and CaCO3), and every A layer whose base lies below 18 cm, one that straddles 18 cm included, is also read on its own values. A dry value not recorded is the moist value + 1, flagged. The thickness of the A and the solum it is compared with are both measured from the mineral soil surface (the top of the A) (Hugo, 2026-11-09)."
  - topic: "Lime waiver of the mollic A"
    edition: [1988]
    page: "p. 26 items 2 and 4"
    version: "0.9.382"
    reading: "The colour and carbon pass either as printed (chroma and moist value below 3.5, dry value below 5.5, 0.6 % OC) or, with more than 40 % CaCO3 equivalent, with a moist value of 5 or less and 2.5 % OC, the dry value waived. CaCO3 not measured leaves the waiver undecided unless an HCl reaction recorded as none or a water pH below 6.5 reads it as absent, flagged (Hugo, 2026-11-09)."
  - topic: "Colour contrast and phosphate exceptions of the mollic A"
    edition: [1988]
    page: "pp. 26-27"
    version: "0.9.382"
    reading: "The mixed A is compared with the first C below it, else the layer right below; with rock right below the A the contrast cannot be read and is taken as met, flagged rock_below_a_contrast_not_read. Strongly humic waives it (p. 40). Dark parent material (the other waiver) and phosphate nodules (the exception to the P2O5 limit) are field observations soilKey does not record: absent. Massive and hard (hard, very hard or extremely hard) when dry is read per layer; not recorded, absent (Hugo, 2026-11-09)."
  - topic: "Fimic A"
    edition: [1988]
    page: "p. 27"
    version: "0.9.382"
    reading: "A layer is manured when its citric P2O5 is above 250 mg/kg or the record names anthropic material (as for the mollic A). Where neither is recorded in the upper 50 cm, the WRB plaggic, hortic and terric horizons stand in and can only make it pass; otherwise the man-made layer is absent. A layer meeting the mollic or umbric A with P2O5 measured at 250 or less is that A (Hugo, 2026-11-09)."
  - topic: "Fresh alluvium is not an ochric A"
    edition: [1988]
    page: "p. 27"
    version: "0.9.382"
    reading: "Finely stratified fresh alluvium: a stratification recorded in the surface layer together with recent_deposit or a fluvial layer_origin (Hugo, 2026-11-09)."
  - topic: "Layers that can hold a B horizon"
    edition: [1988]
    page: "pp. 27-31"
    version: "0.9.382"
    reading: "The argic, natric, cambic, spodic and ferralic B are not read in rock, in a layer designated A, E, H, O or C (CB, Cr), nor in the first layer of an undesignated surface; a B inside an E (E&Bt, E/B) is a B, and its t suffix records clay skins as a Bt does (Hugo, 2026-11-09)."
  - topic: "Extent of the argic B"
    edition: [1988]
    page: "p. 28 items 3, 5, 6"
    version: "0.9.382"
    reading: "The B is the layer where the increase is reached and the adjoining layers below it that keep the texture and the increase over the same coarser layer. Item 5 reads its thickness from the soil surface of Q9 (one tenth of the overlying horizons); lamellae, when lamellae_cumulative_cm is above 0 in every layer of the B, need 15 cm combined. The coarser overlying horizon of item 6 is the run of layers right above with less clay; a missing clay on that walk leaves item 6 undecided. 'Eroded' is read from anthropic_truncation only (Hugo, 2026-11-09)."
  - topic: "Tongues of the natric B"
    edition: [1988]
    page: "p. 29 item 1"
    version: "0.9.382"
    reading: "Blocky structure with tongues: tongue_depth_cm above 2.5 in the B or the layer above it; the tongue is taken to carry uncoated grains unless uncoated_grains_pct is recorded as 0. ESP not recorded is Na / CEC x 100, flagged (Hugo, 2026-11-09)."
  - topic: "Alteration of the cambic B"
    edition: [1988]
    page: "p. 30 item 5"
    version: "0.9.382"
    reading: "'The underlying horizon' of 5a is the layer right below (rock: not compared). The carbonate removal of 5b is read only over sure calcic layers below. The parent material of 5c is the C layers below, else the layers from the B down (Hugo, 2026-11-09)."
  - topic: "Carbonate and gypsum not measured"
    edition: [1988]
    page: "pp. 30-32"
    version: "0.9.382"
    reading: "caco3_pct not recorded: an HCl reaction recorded as none, or a water pH below 6.5, reads as no free carbonate, flagged; caso4_pct not recorded: an ECe below 2 dS/m reads as no gypsum, flagged. Else undecided (Hugo, 2026-11-09)."
  - topic: "Calcic and petrocalcic details"
    edition: [1988]
    page: "pp. 31-32"
    version: "0.9.382"
    reading: "The calcic '5 percent more than a deeper horizon' is in points. Resting on 40 % CaCO3 or more, the calcic horizon needs secondary carbonate recorded (secondary_carbonates_pct, carbonate_soft_pct, secondary_carbonates_form or the suffix k). The deepest layer of 15 % or more, with no deeper layer described, is undecided. The petrocalcic (petrogypsic) horizon is a cemented layer of 15 % CaCO3 or more (the gypsum of the gypsic horizon): cementation_class moderately cemented or harder, else a designation with k (y) and m, flagged; a silica pan (qm) is not read as theirs; the enrichment not asked (Hugo, 2026-11-09)."
  - topic: "Gypsic horizon compared with the C"
    edition: [1988]
    page: "p. 32"
    version: "0.9.382"
    reading: "The underlying C is the first layer designated C below; with no C designated, the layer right below, flagged no_c_horizon_layer_below_compared. The product is the thickness times the thickness-weighted gypsum % (Hugo, 2026-11-09)."
  - topic: "Spodic B without the chemistry"
    edition: [1988]
    page: "pp. 30-31"
    version: "0.9.382"
    reading: "Item 2: sandy or coarse-loamy is clay below 18 %; pellets and cracked coatings are field observations. Item 1: the cementing agent is read from an h, s or the older ir suffix. A layer with free carbonate or a water pH of 7.0 or more is not spodic, flagged; a missing chemistry is not otherwise read as absent. The stand-ins decide only the chemistry (item 3), both ways when they decide, and are recorded only then; the units of items 1 and 2 stay as read (Hugo, 2026-11-09)."
  - topic: "Volcanic glass not recorded"
    edition: [1988]
    page: "pp. 31, 34"
    version: "0.9.382"
    reading: "Item 7 of the ferralic B reads the andic properties of p. 34 itself until the diagnostic properties follow. Volcanic glass not recorded is none, flagged volcanic_glass_not_recorded_none, and andic properties left undecided are absent, flagged andic_absent_no_volcanic_material, unless the site's parent material, a layer_origin or pyroclastic fragments name volcanic material, where they stay undecided (Hugo, 2026-11-09)."
  - topic: "Albic E colours"
    edition: [1988]
    page: "pp. 32-33"
    version: "0.9.382"
    reading: "A layer designated E (EB, E/B, the A2 of the older notation); an undesignated layer is read by colour only, flagged, where it lies below a surface layer and above a layer designated B or C, else it is undecided. 'Closer to 2 than to 3' is a chroma below 2.5. Where both value classes apply (a dry value of 7 and a moist value of 5), the lighter one governs (chroma 3 or less). A dry value not recorded is the moist value + 1, flagged. The parent material of the 5YR rule is the first C below (Hugo, 2026-11-09)."
  - topic: "Code readings confirmed on the review"
    edition: [1988]
    page: "pp. 26-32"
    version: "0.9.382"
    reading: "The spodic B may start at any depth below an A or E (12.5 cm only without them); 'extremely hard' counts as hard for the massive and hard mollic A; the spodic index of accumulation is summed over every subhorizon of the profile that meets items 3a and 3b; 'moderately cemented' suffices for the petro horizons (Hugo, 2026-11-09)."
  - topic: "Dry chroma of the albic E not recorded"
    edition: [1988]
    page: "p. 33"
    version: "0.9.382"
    reading: "With the dry value taken as the moist value + 1, a dry chroma not recorded is the moist chroma, flagged dry_chroma_from_moist, so that the chroma rule ('either dry or moist') is decided by the moist chroma alone (Hugo, 2026-11-09)."

  # --- 0.9.383 (the diagnostic properties of 1988, R/diagnostics-fao88-properties.R) --------
  # Hugo's decisions of 2026-11-08 that this part applies.
  - topic: "Gleyic and stagnic properties"
    edition: [1988]
    page: "pp. 36-37"
    version: "0.9.383"
    reading: "Without a recorded reduction test (rH, ferricyanide, dipyridyl) the colour pattern counts as evidence of reduction, flagged reduction_from_colour_pattern; gleyic = two of the three signs (reduction, groundwater, gley colours in more than 95 % of the matrix); stagnic within 50 cm = reduction with the mottling pattern of item 3b (mottled) or 3c (not mottled); item 3d, the chroma increasing with depth, is reported as support, not required (Q21) (Hugo, 2026-11-08)."
  - topic: "'Many' coarse mottles of the ferric properties"
    edition: [1988]
    page: "p. 35"
    version: "0.9.383"
    reading: "redoximorphic_features_pct of 15 or more and mottle_size_class coarse (more than 20 mm), with a mottle colour of hue redder than 7.5YR or chroma above 5 (Q22) (Hugo, 2026-11-08)."
  - topic: "Defaults applied to the properties"
    edition: [1988]
    page: "pp. 34-41"
    version: "0.9.383"
    reading: "The abrupt textural change over less than 5 cm is a boundary recorded abrupt or clear, gradual and diffuse fail, and its two items are either-or by the clay of the upper layer (default 5); fluvic properties: the organic carbon and stratification criteria decide, the fluviatile, marine or lacustrine origin read where recorded (6); nitic properties: 30 % clay and the structure decide, oxalate and DCB iron read only where measured (7); vertic properties: clayey is 30 % clay or more (8); the geric 'plus' read (20); windows and depths as default 11 (Hugo, 2026-11-08)."

  # Hugo's decisions on the readings of this part and the review (2026-11-09).
  - topic: "Boundary distinctness not recorded"
    edition: [1988]
    page: "pp. 28, 34"
    version: "0.9.383"
    reading: "A boundary over less than 5 cm is one recorded abrupt or clear (abrupta, clara), read by one reader for the abrupt textural change and argic item 6 (.fao_boundary_sharp()); not recorded, absent, flagged boundary_distinctness_not_recorded_absent (a field observation). A layer starting less than 5 cm below the base of the upper one, across a thin transitional layer, is also compared, the distance read from the depths. An argic start that fails item 6 because the boundary is not recorded keeps the flag in the evidence (Hugo, 2026-11-09)."
  - topic: "Calcareous without CaCO3"
    edition: [1988]
    page: "p. 35"
    version: "0.9.383"
    reading: "Without caco3_pct strong effervescence (strong, very strong, violent; effervescence_class read for the 10 % HCl, flagged) in most of the fine earth decides, as calcareous, and a water pH (ph_h2o) below 6.5 reads as not calcareous, flagged no_carbonate_at_ph_below_6.5, as the horizons read it; both recorded conflict and leave it undecided, flagged; any other effervescence, none recorded, or no record leaves it undecided (a reaction recorded as none is not read here) (Hugo, 2026-11-09)."
  - topic: "Fluvic properties: irregular decrease and thin sand strata"
    edition: [1988]
    page: "p. 35"
    version: "0.9.383"
    reading: "Organic carbon decreasing irregularly with depth is an increase of more than 0.2 points from one layer to the next deeper one within 125 cm (oc_increase_min = 0.2, strict). A thin stratum of sand is a sand or loamy sand layer; it is exempt from the 0.20 % when a finer layer below it within 125 cm, not a buried A, has more. The origin is read where recorded (a parent material naming rock, residuum, loess, till or colluvium is not a fluvic sediment; a floodplain, levee, delta, tidal or backswamp landform is one); not recorded, the criteria decide, flagged sediment_origin_not_recorded_criteria_decide (Hugo, 2026-11-09)."
  - topic: "Groundwater with its capillary fringe at the surface"
    edition: [1988]
    page: "p. 36 item 2b"
    version: "0.9.383"
    reading: "A water table recorded at or above the surface, flooded, or not perched within 100 cm of the surface; perched, none observed or deeper is not the sign; not recorded, absent, flagged. The dye test is not recorded (Hugo, 2026-11-09)."
  - topic: "Reduction from tests and colour"
    edition: [1988]
    page: "pp. 36-37"
    version: "0.9.383"
    reading: "The three tests (rH 19 or less, ferricyanide, dipyridyl) are read as an OR: a negative test with the others not made is undecided, not a refutation. The colour confirms but never refutes: a matrix of moist value 4 or more with chroma 2 or less or a hue N, GY, BG, G or B, or a reduced matrix recorded, gives reduction, flagged reduction_from_colour_pattern, even beside a negative test; any other colour leaves it undecided; an E or albic E layer never takes the colour route. The same gley matrix may count for signs a and c of the gleyic properties (Hugo, 2026-11-09)."
  - topic: "The andic mantle of p. 42"
    edition: [1988]
    page: "p. 42"
    version: "0.9.383"
    reading: "A mantle of new material 35 to 50 cm thick over buried horizons has andic properties when every layer of it has them (three-valued) (Hugo, 2026-11-09)."
  - topic: "Burial of the properties"
    edition: [1988]
    page: "p. 42"
    version: "0.9.383"
    reading: "Below the first buried horizon under a thick enough mantle only the properties bound to a horizon are removed (ferralic, ferric, nitic, tonguing, interfingering); the properties of the present state (gleyic, stagnic, permafrost, salic, sodic, calcareous, sulfidic and the others) are read in the buried layers too (Hugo, 2026-11-09)."
  - topic: "Nitic properties"
    edition: [1988]
    page: "p. 38"
    version: "0.9.383"
    reading: "An angular blocky structure, moderate or strong, with no second-level structure recorded leaves the nitic properties undecided; a polyhedral or nutty structure_type is the flat-edged element itself; a structure, grade or shiny faces not recorded are absent. The oxalate iron of the text is Fe2O3: its 0.2 % is compared with fe_ox_pct (Fe) as 0.2 x 0.6994 = 0.14 % Fe; the ratio to DCB iron is the same in either form (Hugo, 2026-11-09)."
  - topic: "Depths of the properties"
    edition: [1988]
    page: "p. 42"
    version: "0.9.383"
    reading: "A property with no depth in the key is read in the layers starting within 125 cm, as the horizons of 0.9.382 are, without asking the description to reach 125 cm; a depth printed in a definition (salic 30 cm, stagnic 50 cm, fluvic 125 cm, strongly humic 100 cm, calcaric 20-50 cm) or passed by the key follows the fill rule of 2026-11-09. Strongly humic passes where the carbon of the layers described above 100 cm already exceeds 1.4 x 100. Permafrost is absent unless recorded, never undecided because the description stops above 200 cm, flagged (Hugo, 2026-11-09)."
  - topic: "Sulfidic materials"
    edition: [1988]
    page: "p. 40"
    version: "0.9.383"
    reading: "The waterlogged state is reported (the site's drainage), not tested; the pH is ph_h2o (else ph_h2o_1to1); without s_total_pct, sulfidic_s_pct plus sulfate_s_pct is a lower bound that can make it pass, and a CaCO3 of three times that bound then leaves it undecided (Hugo, 2026-11-09)."
  - topic: "Frozen and plinthite suffixes"
    edition: [1988]
    page: "pp. 39, 96-103"
    version: "0.9.383"
    reading: "The frozen suffix is read by the notation the site declares (.frozen_designation_pattern(): f in the FAO, WRB and USDA notations or none declared, z in the Canadian one); an f in another declared notation (SiBCS, KA5 ...) leaves permafrost undecided, flagged. The suffix v is plinthite of unknown amount, flagged, only in the FAO notation or none declared; in another notation it leaves plinthite undecided. Recorded ice is permafrost, flagged (Hugo, 2026-11-09)."
  - topic: "Field observations of the properties"
    edition: [1988]
    page: "pp. 35-41"
    version: "0.9.383"
    reading: "Stagnic: mottles recorded without colours are of higher chroma, flagged; ped-surface colours not recorded are absent. Ferric: mottles without their amount, size or colour leave the mottle path undecided; the enriched exteriors of nodules are taken as met and nodules of unrecorded size accepted, flagged; Fe-Mn nodules alone leave it undecided, flagged. Soft powdery lime: coatings, soft concretions or powdery forms named without an amount leave it undecided, flagged. Tonguing: read on the receiving layer, else on the layer above, flagged; Chernozem tongues without a width are undecided. Interfingering: skeletans not recorded are absent, flagged. Slickensides: any presence recorded that is not none passes. Continuous hard rock: a cemented pan (suffix m, petrocalcic or petrogypsic) is never rock. Ferralic properties: the horizon right below the A is the first layer after the run of A layers. Andic item 2: volcaniclastic material not recorded is absent (Hugo, 2026-11-09)."

  # The readings of the registry and the 28 major soil groupings (0.9.384),
  # decided by Hugo on the review (2026-11-09).
  - topic: "Organic layers of the Histosols"
    edition: [1988]
    page: "p. 75"
    version: "0.9.384"
    reading: "An H or O horizon is a layer of organic soil materials (p. 39, .f88_organic()); where the carbon leaves that undecided, a layer designated H or O counts, flagged organic_layer_from_designation. The 60 cm limit applies when a layer of the run has sphagnum_fibres_pct of 75 or more or a bulk density below 0.1; a bulk density not measured is read as 0.1 or more, flagged bulk_density_not_measured_read_0.1_or_more where the run is 40 to 60 cm. A description that stops above 80 cm leaves the cumulative path undecided when the depth not described could still complete it (Hugo, 2026-11-09)."
  - topic: "Thinner H or O horizon over rock or fragmental material"
    edition: [1988]
    page: "p. 75"
    version: "0.9.384"
    reading: "No minimum thickness is printed: organic layers from the surface that rest directly on continuous rock, or on fragmental material (coarse_fragments_pct of 90 or more, soilKey's number) whose fine earth is organic, make a Histosol when they are more than 20 cm thick, the minimum of the histic H (p. 25), flagged organic_layers_on_rock_thinner (Hugo, 2026-11-09)."
  - topic: "Profound modification of the Anthrosols"
    edition: [1988]
    page: "p. 75"
    version: "0.9.384"
    reading: "Read on the field record: a fimic A (0.9.382); anthropic layers (artefacts, anthropic material, a fill, midden or plaggen layer_origin) from the surface 50 cm thick or more, the thickness of the units ATc and ATu; or deep cultivation recorded at the site (deep_cultivation_kind, or mechanical_mixing_depth_cm of 50 or more). A truncation by people recorded alone does not make an Anthrosol. Nothing recorded: absent (Hugo, 2026-11-09)."
  - topic: "Highly calcareous material of the Leptosols"
    edition: [1988]
    page: "p. 76"
    version: "0.9.384"
    reading: "The material that limits the depth: a layer that is not an A, E, B, H or O (a C, or an undesignated layer below the first, flagged) starting within 30 cm with a CaCO3 equivalent above 40 % (CaCO3 not recorded read as for the calcic horizon). A calcareous A or B above deeper material does not count (Hugo, 2026-11-09)."
  - topic: "Fine earth of the Leptosols"
    edition: [1988]
    page: "p. 76"
    version: "0.9.384"
    reading: "Less than 20 % fine earth over 75 cm is the thickness-weighted fine earth (100 minus coarse_fragments_pct) of 0-75 cm, rock counting as no fine earth; coarse fragments not recorded are none, flagged (a field observation). A description that stops above 75 cm decides where the bounds already do (Hugo, 2026-11-09)."
  - topic: "Cracks and slickensides of the Vertisols"
    edition: [1988]
    page: "p. 77"
    version: "0.9.384"
    reading: "Cracks 1 cm wide (cracks_width_cm) that reach 50 cm (cracks_depth_cm, or recorded in a layer whose base is at 50 cm or deeper); on an irrigated site the cracks are waived, flagged. A crack recorded with its depth but not its width, or a wide crack of a shallow layer without its depth, leaves the cracks undecided. Any slickensides recorded are read as intersecting, flagged; wedge-shaped, parallelepiped or lenticular structure_type counts in a layer overlapping 25-100 cm. Not recorded: absent. A soil on rock above 50 cm fails the 50 cm of clay (Hugo, 2026-11-09)."
  - topic: "No diagnostic horizons other than ..."
    edition: [1988]
    page: "pp. 42, 77-86"
    version: "0.9.384"
    reading: "The 16 horizons of chapter IV, read by their predicates: buried horizons do not count, and a diagnostic horizon counts only with its upper limit within 125 cm, as p. 42 sets for every diagnostic horizon and property (the A horizons start at the surface); one of the others undecided leaves the gate undecided. 'An A horizon' of the Gleysols is any A (mollic, umbric, ochric or fimic). The gypsic or calcic horizon that defines the Gypsisols or Calcisols is allowed in its own gate. Sulfidic material is a material, not a horizon (Hugo, 2026-11-09)."
  - topic: "Coarse textured materials of the Gleysols"
    edition: [1988]
    page: "pp. 78, 80"
    version: "0.9.384"
    reading: "The test of the Arenosols: coarser than sandy loam in every mineral layer to 100 cm (Q10 decided the texture; the depth is soilKey's reading). H and O layers are not read; a soil on rock above 100 cm is not coarse textured (Hugo, 2026-11-09)."
  - topic: "Andic properties to 35 cm"
    edition: [1988]
    page: "p. 79"
    version: "0.9.384"
    reading: "Every layer from the top of the mineral soil to 35 cm below it has andic properties; an O or H on top is skipped, flagged andic_depth_from_mineral_surface (Hugo, 2026-11-09)."
  - topic: "Argic B permeated with gypsum or CaCO3; calcareous argic B"
    edition: [1988]
    page: "pp. 85-86"
    version: "0.9.384"
    reading: "Gypsisols: every layer of the argic B is calcareous or gypsiferous (5 % gypsum or more, p. 38). Calcisols: every layer of the argic B is calcareous (p. 35). One layer failing makes the argic B another horizon, and the gate fails (Hugo, 2026-11-09)."
  - topic: "Gleyic clause of the Plinthosols"
    edition: [1988]
    page: "p. 81"
    version: "0.9.384"
    reading: "Plinthite within 125 cm counts under an albic E or under a layer with stagnic properties starting within 50 cm (the layer above the plinthite), or under a horizon with gleyic or stagnic properties starting within 100 cm (ch. VI p. 60); the mottling of the plinthite layer itself does not count (Hugo, 2026-11-09)."
  - topic: "E and slowly permeable horizon of the Planosols"
    edition: [1988]
    page: "p. 82"
    version: "0.9.384"
    reading: "The E is a run of layers designated E or meeting the albic E; stagnic properties in any of its layers. The slowly permeable horizon is the layer right below it with an abrupt textural change (p. 34); or a fragipan (suffix x) under an abrupt or clear boundary of the E, flagged; or a measured ksat_mm_h below 4 under such a boundary, flagged (default 14; 4 mm/h is soilKey's number, the slowly permeable layer of soilKey's NZSC) (Hugo, 2026-11-09)."
  - topic: "Chroma of the mollic A to 15 cm"
    edition: [1988]
    page: "pp. 83-84"
    version: "0.9.384"
    reading: "The moist chroma is read in every layer from the top of the A (the mineral soil surface, as the mollic A of 0.9.382 measures its thickness) to 15 cm below it, each layer on its own value: the Chernozems need 2 or less in every layer, the Kastanozems more than 2 in any layer (the exact complement) (Hugo, 2026-11-09)."
  - topic: "Uncoated grains of the Greyzems"
    edition: [1988]
    page: "p. 83"
    version: "0.9.384"
    reading: "bleached_ped_coatings in any layer starting within 125 cm (p. 42); without it, uncoated_grains_pct above 0, flagged; not recorded, absent (Hugo, 2026-11-09)."
  - topic: "Base saturation throughout the upper 125 cm"
    edition: [1988]
    page: "p. 84"
    version: "0.9.384"
    reading: "Every mineral layer overlapping 0-125 cm (rock closes the window); H and O layers are not read, flagged; a description that stops above 125 cm leaves the Phaeozems undecided (Hugo, 2026-11-09)."
  - topic: "Irregular upper boundary of the Podzoluvisols"
    edition: [1988]
    page: "p. 85"
    version: "0.9.384"
    reading: "Tonguing of the E into the argic B (tonguing_fao88(), p. 41), or iron nodules larger than 2 cm (nodule_size_max_cm) in the first layer of the argic B or the layer above, their enriched, redder exteriors taken as met, flagged. The boundary topography recorded is not asked besides: the two causes decide (Hugo, 2026-11-09)."
  - topic: "Clay distribution and boundaries of the Nitisols"
    edition: [1988]
    page: "p. 86"
    version: "0.9.384"
    reading: "No layer from the layer of maximum clay (at or below the top of the argic B) to 150 cm has less than 0.8 x the maximum (default 13); a description that stops above 150 cm (not on rock) leaves it undecided. Only the A-to-B transition is tested: the lower boundary of the last A (or AB) layer is gradual or diffuse, with no abrupt textural change below it; a boundary not recorded is absent, as decided for the boundaries on 2026-11-09, so the Nitisols then fail (Hugo, 2026-11-09)."
  - topic: "CEC of the argic B (Alisols, Acrisols, Luvisols, Lixisols)"
    edition: [1988]
    page: "pp. 87-88"
    version: "0.9.384"
    reading: "The CEC (NH4OAc) per kg clay is read per layer, as ch. VI p. 52: the Alisols and Luvisols need 24 cmol(+)/kg clay or more in every layer of the upper argic B starting within 125 cm, the Acrisols and Lixisols less than 24 in at least one (exact complements). The base saturation is read on the same layers: below 50 % in one of them (AL, AC), 50 % or more in all of them (LV, LX) (Hugo, 2026-11-09)."
  - topic: "Names of the result when no grouping passes"
    edition: [1988]
    page: "pp. 75-89"
    version: "0.9.384"
    reading: "With every gate failed the name is '[Not classified in the FAO-Unesco Revised Legend (1988)]' and the warnings list the 28 codes (Q5); with no gate passed and some undecided, '[Undecided in the FAO-Unesco Revised Legend (1988): <candidates>, or not classified]'. The headings of the key are printed in capitals; the names are written as the text writes them elsewhere (Luvisols) (Hugo, 2026-11-09)."
  - topic: "The uppermost diagnostic B decides"
    edition: [1988]
    page: "p. 42"
    version: "0.9.384"
    reading: "Of the argic, natric, cambic, spodic and ferralic B starting within 125 cm, the uppermost decides at the key: the gate of a grouping defined by a B (Podzols, Ferralsols, Solonetz, Greyzems, Podzoluvisols, Nitisols, Alisols, Acrisols, Luvisols, Lixisols, Cambisols) passes only when its B is that uppermost one, and is undecided when an undecided B starts above it (upper_b_fao88()). An argic B over a ferralic B is not a Ferralsol; a cambic B over an argic B is not a Luvisol (Hugo, 2026-11-09)."

  # The readings of the 153 soil units (0.9.385), decided by Hugo on the
  # review (2026-11-09).
  - topic: "The soil units in the key's order; the decisions applied"
    edition: [1988]
    page: "pp. 75-89"
    version: "0.9.385"
    reading: "The 153 units are keyed under their grouping in the key's order, not the order of the lists of ch. III and the end (which start with Eutric or Haplic); the first unit whose gate passes is assigned, an undecided unit before it makes the unit provisional (units:<code>), and the last unit of each grouping is the key's residual. The key governs where ch. VI differs (Q6): Calcic Solonchaks and Calcic Gleysols with a calcic horizon only, Humic Plinthosols without the mollic A, the Dystric Plinthosols in the upper 50 cm of the plinthite horizon, Plinthic Ferralsols and Stagnic Solonetz as printed, Calcic Kastanozems with a petrocalcic horizon too, Petric Calcisols within 100 cm, Dystric Cambisols in some part of the B, Humic Alisols strongly humic only; the residuals keep any A horizon. The two italic passages of this part are applied as printed (Q4): soft powdery lime in the Calcic Solonetz (p. 83) and 'in at least some part of the B' in the Humic Cambisols (p. 89). Gypsiric Regosols is the name, Gypsic Regosols its alias (Q7). The Terric Histosols and Urbic Anthrosols are pure residuals, their descriptions shown (default 9); 'Planosolss' of the lists is read Planosols (default 20) (Hugo, 2026-11-08)."
  - topic: "Unit adjectives without a depth"
    edition: [1988]
    page: "p. 42; pp. 75-89"
    version: "0.9.385"
    reading: "A diagnostic named in a unit gate with no depth (Salic Fluvisols, Andic Gleysols, the Gypsic, Luvic and Calcic Kastanozems, the Calcic Chernozems and Gypsisols, the Ferric, Vertic and Albic units, the Ferralic Cambisols) is read within 125 cm (p. 42; plan section 4.2); the salic properties keep their own 30 cm. 'At less than 125 cm' (the Thionic units) is read as 'within 125 cm', the top of the feature at 125 cm or above, as every other depth of the legend (Hugo, 2026-11-09)."
  - topic: "Folic and Fibric Histosols: drainage and fibres"
    edition: [1988]
    page: "p. 75"
    version: "0.9.385"
    reading: "Folic: the site recorded well drained or better and not artificially drained. Fibric: very poorly drained, or undrained recorded, and not artificially drained, and every layer from the surface to 35 cm organic and fibric. 'Fibre content dominant' is read as the fibric material of Soil Taxonomy that the legend cites: rubbed fibre content (fiber_content_rubbed_pct) 40 % or more, else a von Post index of 4 or less, flagged; below 40 %, or von Post 5 or more, not fibric. A drainage class written as a range is read by both ends (.drainage_class()): undecided when it spans the limit; the codes E, SE, W, MW, I, SP, P, VP and Portuguese terms are read. Drainage or fibres not recorded leave the units undecided, not absent: both units turn on them, so the unit is provisional (Hugo, 2026-11-09)."
  - topic: "Aric, Fimic and Cumulic Anthrosols"
    edition: [1988]
    page: "pp. 75-76; ch. IV p. 27; ch. VI p. 61"
    version: "0.9.385"
    reading: "Aric: deep cultivation recorded at the site, as the Anthrosols gate reads it (deep_cultivation_kind, or mechanical_mixing_depth_cm of 50 or more); not recorded, absent. Fimic: the fimic A itself (fimic_a_fao88(), changed in this part) needs a sign of manuring: citric P2O5 above 250 mg/kg, a manuring term (plaggen, hortic, manure, compost, midden, kitchen garden; Portuguese too) in the layer_origin, anthropic_material or designation, or in the site's land_use (which marks the run of A layers at the surface as the man-made layer, flagged), or the WRB plaggic() or hortic() passing, always tried and flagged as a stand-in. Artefacts neither make nor exclude it; fills, wastes and man-made sediments without manuring are not fimic, stay Anthrosols by the anthropic layers of the gate and key to the Cumulic or Urbic units. One vocabulary of the anthropic record serves the gate, the fimic A and the Cumulic unit (.F88_ANTHROPIC_RE: anthropic, the manuring terms, fill, waste, refuse, spoil, rubble, garbage, landfill, mine as a word, dredged material, irrigation and raised-surface sediments, irragric, terric; a positive silting sieve test). Cumulic: a run from the surface more than 50 cm thick of layers whose layer_origin names man-made sediments (irrigation, irragric, terric, raised, man-made) or whose silting sieve test is positive, every layer sandy loam or finer (the 'fine' of ch. VI p. 61) (Hugo, 2026-11-09)."
  - topic: "Lithic, Rendzic and Dystric Leptosols"
    edition: [1988]
    page: "p. 76; ch. VI p. 45"
    version: "0.9.385"
    reading: "Lithic: continuous hard rock, or a cemented layer as the Leptosols gate reads it, starting within 10 cm. Rendzic: a mollic A (its lime waiver of 0.9.382 included) of which a layer, or the layer right below it, has a CaCO3 equivalent above 40 %; a calcareous rock right below the A counts: CaCO3 measured on it, else limestone, chalk, marble or dolomite recorded as its rock or as the parent material, flagged (a rock type not recorded is absent). Dystric (no depth in the key): base saturation below 50 % in some layer within 125 cm, as ch. VI p. 45 writes 'in at least some part of the soil' (Hugo, 2026-11-09)."
  - topic: "Vitric Andosols"
    edition: [1988]
    page: "p. 79"
    version: "0.9.385"
    reading: "Lacking a smeary consistence (smeary_fao88() in a layer starting within 100 cm; with no smeary record in those layers the item is undecided, so the unit passes on the texture alone when it is coarser than silt loam, and is undecided otherwise), or lacking a texture of silt loam or finer as the thickness-weighted clay and sand of the mineral layers over 0-100 cm; silt loam or finer is the USDA classes silt loam, silt, sandy clay loam, clay loam, silty clay loam, sandy clay, silty clay and clay (loam, sandy loam and coarser are coarser) (Hugo, 2026-11-09)."
  - topic: "Albic, Luvic, Ferralic and Cambic Arenosols"
    edition: [1988]
    page: "p. 80; ch. VI p. 47"
    version: "0.9.385"
    reading: "Albic: an albic E unit 50 cm thick or more whose top is within 125 cm. Luvic: a mineral layer starting within 125 cm with 3 points more clay than a mineral layer above it (no vertical distance is printed; default 10 for the points), or lamellae (lamellae_cumulative_cm above 0, or a designation with lamellae such as E&Bt, flagged). Ferralic: ferralic properties within 125 cm and the layer right below the A with a moist chroma of 5 or more or a hue redder than 10YR (Q24). Cambic: the layer right below the A (ch. VI) is not a C and meets item 5 of the cambic B (colour, clay, carbonate removal or structure), the texture the Arenosols lack not asked (Hugo, 2026-11-09)."
  - topic: "Carbic, Ferric and Cambic Podzols"
    edition: [1988]
    page: "p. 81; ch. VI p. 56"
    version: "0.9.385"
    reading: "Carbic: a layer of the spodic B with dispersed organic matter (organic carbon above 0, or an h in its designation) that does not turn redder on ignition (ignition_redder, else free iron below 0.5 %, flagged, Q23). Ferric: fe_dcb_pct / oc_pct of 6 or more in every layer of the spodic B (both recorded as 0: no ratio, fails). Cambic: no albic E, or only one 2 cm thick or less and discontinuous (boundary_topography broken or discontinuous; not recorded, continuous); 'a subhorizon of the B visibly more enriched with organic carbon' is the field record of it, an h in a designation of the spodic B (Bh, Bhs); not recorded, absent (Hugo, 2026-11-09)."
  - topic: "The plinthite horizon of the Dystric Plinthosols"
    edition: [1988]
    page: "p. 82"
    version: "0.9.385"
    reading: "The plinthite horizon is the upper run of layers with 25 % plinthite or more, 15 cm thick or more, starting within 125 cm (the horizon of the Plinthosols gate); the base saturation is read throughout its upper 50 cm, the whole horizon when it is thinner (Hugo, 2026-11-09)."
  - topic: "'The B horizon' of the unit gates"
    edition: [1988]
    page: "pp. 82-89"
    version: "0.9.385"
    reading: "Where a unit gate reads 'the B horizon' (the base saturation of the Humic Ferralsols, Humic Nitisols, Dystric Podzoluvisols, Humic and Dystric Cambisols; the geric properties of the Geric Ferralsols; the ferralic properties of the Ferralic Cambisols; the colours of the Rhodic, Xanthic and Chromic units), the B is the upper diagnostic B of the kind that defines the grouping (ferralic for FR, argic for NT, PD and LV, cambic for CM), starting within 125 cm (100 cm where printed): the uppermost unit decides; when it is undecided and a sure B lies below it, the answer stands only where both agree, else it is undecided (.f88_b_eval()); with none, the layers designated B, flagged (plan section 4.2) (Hugo, 2026-11-09)."
  - topic: "Humic units: what 'strongly humic, having an umbric A, or a mollic A and ...' joins"
    edition: [1988]
    page: "pp. 82, 86, 87"
    version: "0.9.385"
    reading: "Humic Ferralsols and Humic Nitisols are strongly humic and have either an umbric A, or a mollic A with a base saturation below 50 % in some part of the B within 100 (FR) or 125 (NT) cm; Humic Acrisols are strongly humic with an umbric or a mollic A; Humic Alisols are strongly humic only (Q6) (Hugo, 2026-11-09)."
  - topic: "Colours of the Rhodic, Xanthic and Chromic units"
    edition: [1988]
    page: "pp. 82, 86, 88, 89"
    version: "0.9.385"
    reading: "'A red B' is read as the B as a whole: every layer of the upper B of the grouping's kind starting within 125 cm meets the colour, on the rubbed colour or the moist colour standing in (Q24). Rhodic: hue redder than 5YR, moist value below 4, dry value no more than one above the moist value; a dry value not recorded leaves the item undecided, flagged dry_value_not_recorded (no moist + 1 here). Xanthic: hue 7.5YR or yellower, moist value 4 or more, moist chroma 5 or more. Chromic: hue 7.5YR with chroma above 4, or a hue redder than 7.5YR (Hugo, 2026-11-09)."
  - topic: "The slowly permeable horizon of the Dystric Planosols"
    edition: [1988]
    page: "p. 83"
    version: "0.9.385"
    reading: "The slowly permeable horizon is the layer below the E that the Planosols gate found, with the adjoining layers below it of the same master horizon, starting within 125 cm; a base saturation below 50 % in one of them suffices ('in at least a part') (Hugo, 2026-11-09)."
  # The readings of the phases and the map symbol (0.9.386).
  - topic: "The phases beside the unit; the decisions applied"
    edition: [1988]
    page: "pp. 67-71, 107"
    version: "0.9.386"
    reading: "The 16 phases of ch. VIII are given in $phases of the classify_fao() result, beside the unit, each three-valued (present, absent, undecided, or not shown for a unit the text excludes); they never change the unit (p. 67). Field-only phases (gelundic, gilgai, rudic, takyric, the desert features of the yermic phase) are absent when not recorded, with no substitute threshold; a measurement not recorded (ECe, ESP, the water table, the days of flooding, the organic carbon) leaves its phase undecided (Q25, default 16). The duripan, fragipan, petroferric and placic phases read soilKey's USDA predicates (Soil Taxonomy 1975, p. 67) with the depths of the legend, the WRB horizons only as stand-ins, flagged (default 17). The phreatic phase is a water table within 500 cm with no gleyic properties, not shown for the Fluvisols and Gleysols (Q25). The texture class (1, 2, 3) of the upper 30 cm and the slope class (a, b, c) of the map symbol are given as two more rows (Q3) (Hugo, 2026-11-08)."
  - topic: "Phases not shown for some units"
    edition: [1988]
    page: "pp. 68-70"
    version: "0.9.386"
    reading: "The salic phase is not shown for the Solonchaks (all their units, as printed) nor for the Salic Fluvisols (FLs), whose definition implies the same high salt content (the printed reason, p. 69, and the map rule of p. 109), soilKey's reading confirmed by Hugo; the sodic phase is not shown for the units whose definition holds a natric B or sodic properties, read as every unit of the Solonetz and the Sodic Solonchaks (SCn), not for any soil that happens to have them; the phreatic phase is not shown for the Fluvisols and Gleysols. The lithic phase has no exclusion in 1988 (the 1974 rule 'not for Lithosols' is not carried over), so it is shown for Leptosols too. When an excluded grouping or unit is only a candidate (undecided before the one assigned), a phase whose criterion is met is undecided, with the candidate (major_groups:SC, units:SCn) in its missing column (Hugo, 2026-11-09)."
  - topic: "Anthraquic phase: the irrigation history"
    edition: [1988]
    page: "p. 67"
    version: "0.9.386"
    reading: "Stagnic properties within 50 cm (stagnic_properties_fao88()) and a site history of long continued irrigation with surface waterlogging: flood_irrigated TRUE, paddy_years_frac above 0, or a land_use naming rice or paddy (a rice land use alone counts, flagged rice_land_use_for_irrigation). A recorded irrigated FALSE or flood_irrigated FALSE rules it out first, before the land use; irrigated TRUE without the kind of irrigation leaves the phase undecided (needs flood_irrigated); paddy_years_frac 0 rules it out; nothing recorded, absent, flagged (a site history is a field record). 'Long continued' has no number and is not tested (Hugo, 2026-11-09)."
  - topic: "Duripan, fragipan, petroferric and placic phases: what is read"
    edition: [1988]
    page: "pp. 67-69"
    version: "0.9.386"
    reading: "Each is a layer whose top is within 100 cm of the soil surface by one of: the layers of the USDA predicate when it passes (duripan_usda(), fragipan_usda(), petroferric_contact_usda(), placic_horizon_usda(); for the fragipan a moist rupture resistance of firm or more is a sign only, flagged usda_fragipan_rupture_resistance_only and undecided, unless a second sign holds in the layer: very or extremely firm with a massive structure, or a bulk density of 1.65 g/cm3 or more (no number in the text; the number of soilKey's WRB fragic(), WRB 2022 Ch. 3.1.10); for the petroferric phase iron must be shown: plinthite_pct 50 or more, pan_type ironstone or ferricrete, or a designation with m and v, c or s thicker than 2.5 cm, and a layer cemented by carbonates, gypsum or silica (km, ym, qm, calcrete, gypcrete, silcrete, duripan) is excluded; a NASIS fragipan feature without its depth leaves the phase undecided, needing top_cm); the kind of pan recorded in the field (pan_type: duripan or silcrete; fragipan; ferricrete or ironstone; thin ironpan), flagged; a designation with qm (duripan) or with the suffix x (fragipan, E/Bx too) in the FAO notation or none declared, flagged; else the WRB petroduric, fragic and petroplinthic horizons as stand-ins, flagged, only in layers where the attributes the USDA predicate reads are not recorded (a stand-in never overrules the 1975 definition). A pan none of them shows is absent (a field observation), flagged, when the description reaches below 100 cm; else undecided. The spacing of fractures (10 cm) and the organic matter of the petroferric layer are not recorded by soilKey and not tested (Hugo, 2026-11-09)."
  - topic: "Phreatic phase: the gleyic properties"
    edition: [1988]
    page: "p. 69"
    version: "0.9.386"
    reading: "'Not reflected in the morphology' is read as no gleyic properties starting within 125 cm (gleyic_properties_fao88() with the depth of p. 42); gleyic properties rule the phase out whatever the depth of the water table, and undecided gleyic properties leave a water table within 500 cm undecided (Hugo, 2026-11-09)."
  - topic: "Salic and sodic phases: the measurements"
    edition: [1988]
    page: "pp. 69-70"
    version: "0.9.386"
    reading: "Salic: ec_dS_m above 4 in a layer starting within 100 cm; ec_max_dS_m (an upper bound) of 4 or less rules the layer out; an EC of 1:5 is not converted (undecided). Sodic: esp_pct above 6, else na_cmol / cec_cmol x 100, flagged, in a layer starting within 100 cm. A description that stops above 100 cm with no layer passing leaves either undecided (Hugo, 2026-11-09)."
  - topic: "Skeletic phase"
    edition: [1988]
    page: "p. 70"
    version: "0.9.386"
    reading: "A run of adjoining layers each with coarse_fragments_pct of 40 or more (any hard fragments: the text lists oxidic concretions, hardened plinthite, ironstone 'or other hard materials'), 25 cm thick or more, its top within 50 cm; rock and layers recorded strongly cemented or indurated are not part of it (not continuously cemented); a layer whose coarse fragments are not recorded is not part of it, absent, flagged coarse_fragments_not_recorded_absent. A run thinner than 25 cm that reaches the base of the description is undecided (Hugo, 2026-11-09)."
  - topic: "Takyric phase: heavy texture, polygons and crust"
    edition: [1988]
    page: "p. 70"
    version: "0.9.386"
    reading: "'Heavy textured' is the fine texture class (3) of the upper 30 cm of the map symbol (p. 107; the text of p. 70 has no number). Read on the first mineral layer: cracking into polygons is polygonal_cracks_spacing_cm recorded above 0; the platy or massive crust is a platy or massive structure_type of that layer. Cracks or structure not recorded, absent; texture not recorded, undecided when the rest is present (Hugo, 2026-11-09)."
  - topic: "Yermic phase: carbon, texture and the desert features"
    edition: [1988]
    page: "pp. 70-71"
    version: "0.9.386"
    reading: "Organic carbon mixed over 0-18 cm below 0.6 %, or below 0.20 % where the 0-18 cm (thickness-weighted) is coarser than sandy loam (silt + 2 x clay below 30); the carbon condition is waived when the salic phase criterion is met, also in a Solonchak where the salic phase is not shown; when the carbon fails and the salic criterion is undecided, the phase is undecided (needs ec_dS_m). The features: (1) ventifact_pct or varnish_pct above 0 in the first mineral layer (a pavement alone does not count); (2) pitted_quartz_pct 10 or more there; (3) palygorskite 2 % or more of the clay in a layer starting within 50 cm (palygorskite_pct, else a clay_mineralogy naming it, flagged); (4) aeolian_crack_infill TRUE in any layer; (5) a platy structure_type of the first mineral layer; (6) an aeolian_morphology of that layer naming a sand sheet, cover sand or blown sand, not a dune or shifting sand, and not a negation (the 'stable surface' is read as excluding dunes and shifting sand). A feature not recorded is absent (Hugo, 2026-11-09)."
  - topic: "Gelundic and gilgai phases"
    edition: [1988]
    page: "p. 68"
    version: "0.9.386"
    reading: "Gelundic: patterned_ground naming polygons (circles, nets, stripes, hummocks alone do not). Gilgai: gilgai_presence; else a microrelief_form of the site or of the surface layer naming gilgai (another recorded microrelief rules it out), flagged; the ridge heights of the text are descriptive, not a threshold. Not recorded, absent (Hugo, 2026-11-09)."
  - topic: "Slope class of the map symbol"
    edition: [1988]
    page: "p. 107"
    version: "0.9.386"
    reading: "The printed ranges share their ends (0-8, 8-30, over 30 %): 8 % is class a and 30 % class b, as 'over 30' makes c open below. The slope_pct of the site stands for the dominant slope of the map unit (Hugo, 2026-11-09)."
  - topic: "Slips of the phase chapter"
    edition: [1988]
    page: "pp. 67, 114"
    version: "0.9.386"
    reading: "The introduction of ch. VIII (p. 67) still says that the petrocalcic and petrogypsic horizons are shown as phases: the 1974 text carried over; in 1988 they are diagnostic horizons and those phases are deleted (App. 4, pp. 113-114), so soilKey has no petrocalcic or petrogypsic phase. App. 4 (p. 114) says the salic phase replaces the 'salic phase': read 'saline phase' (default 20) (Hugo, 2026-11-08)."
  # A decision of 2026-11-10 shared by both editions.
  - topic: "Lime waiver of the mollic A: the dry contrast with the C"
    edition: [1988, 1974]
    page: "p. 26; 74 p. 24"
    version: "0.9.390"
    reading: "With more than 40 % finely divided lime, 'the limits of colour value dry are waived' (the same words in both editions): the dry value of the A and its dry contrast with the C (or the horizon below the A) are both waived; the moist contrast of one unit is still asked. A correction to the mollic and umbric A of 0.9.382 (1988) and 0.9.387 (1974); no example of 1988 changes (Hugo, 2026-11-10)."
  # --- 0.9.391: the crosswalk 1974 -> 1988 (Appendix 4, pp. 113-126) -------------------
  - topic: "Crosswalk: the 1974 side of each row"
    edition: [1988, 1974]
    page: "pp. 115-126; 74 pp. 12-13"
    version: "0.9.391"
    reading: "Appendix 4 prints only the 1988 groupings and units with a comment; the 1974 class of each row is read from the 1974 list by the same name, or by the 'formerly' the appendix prints (Orthic, Ochric, Humic, Leptic, Acric); a 1988 unit with the same name and no comment is 'same' (a new code only). Display and label reading only, never a classification (Q8) (Hugo, 2026-11-10)."
  - topic: "Crosswalk: comments printed between two rows"
    edition: [1988]
    page: "pp. 119-120, 123"
    version: "0.9.391"
    reading: "'Lacking gleyic or stagnic properties' printed on the row of the Mollic Solonchaks (SCm) is read as SCm's own comment (amended), not a continuation of the Haplic Solonchaks' 'formerly Orthic'. The gleyic comment of the Eutric Podzoluvisols runs onto the row of the Dystric ones, and the Gleyic Podzoluvisols are keyed before both: PDe and PDd are both amended (Hugo, 2026-11-10)."
  - topic: "Crosswalk: relations settled on the review"
    edition: [1988, 1974]
    page: "pp. 117-118, 125-126"
    version: "0.9.391"
    reading: "The Lithosols, Rendzinas and Rankers as units are 'renamed' (p. 117 prints 'formerly ...' beside LPq, LPk, LPu); as groups they are merged into the Leptosols (p. 115). The Vertisols and Histosols groups are 'same': pp. 118 and 126 print no group comment (the changes are at unit level). The Calcic Cambisols are 'split': CMc is 'formerly in Calcic Cambisols' (p. 118) and those with a calcic or gypsic horizon go to the Calcisols or Gypsisols. The Rhodic Nitisols (NTr) are new with no comment printed (bracketed), and the Eutric and Dystric Nitosols carry NTr as an alternative. The Calcic Luvisols carry the Luvic Calcisols as an alternative (p. 119: the Luvic Calcisols are keyed before the Luvisols) (Hugo, 2026-11-10)."
  - topic: "Crosswalk: alternatives read from the group comments"
    edition: [1988, 1974]
    page: "pp. 116-125"
    version: "0.9.391"
    reading: "Where a group comment sends part of a 1974 group elsewhere, the rows carry soilKey's alternative targets in brackets (`also`, `also_when`): the Luvisol units to the Lixisol unit of the same name, else Haplic (Lc, Lk, Lv to LXh), when the argic B has a CEC below 24 cmol(+)/kg clay (p. 122); a condition may be given per target, and a 1988 result shows the alternatives of the unit rows that name its unit, else those of the group rows that name its grouping (a unit row that names a grouping only when the result stops at the grouping); the Acrisol units to the Alisol unit of the same name (Ah to ALu) at 24 or more (p. 124); Bk to the Calcisols or Gypsisols (p. 118); Kk to the Gypsic Kastanozems (p. 120); Gp, Fp and Lp to the Plinthosols (pp. 116, 122, 125); the Gleysols to the Arenosols and Fluvisols and the Regosols to the Arenosols and Leptosols (p. 116) (Hugo, 2026-11-10)."
  - topic: "Crosswalk: the units of the Xerosols and Yermosols"
    edition: [1988, 1974]
    page: "p. 115"
    version: "0.9.391"
    reading: "The appendix deletes the two groups (note 1: incorporated in other groups, with a yermic phase) and prints no unit row. soilKey brackets targets by the unit's name: Haplic to the Cambisols, Regosols or Arenosols; Calcic to the Calcisols; Gypsic to the Gypsisols; Luvic to the Luvic Calcisols or Gypsisols, the Luvisols or Lixisols; Takyric Yermosols to no class (the takyric phase) (Hugo, 2026-11-10)."
  - topic: "Crosswalk: the three changes Appendix 4 does not flag"
    edition: [1988, 1974]
    page: "pp. 79, 116, 122, 126"
    version: "0.9.391"
    reading: "Bracketed rows: Calcaric Gleysols (Gc) to Calcic Gleysols (GLk) is a renaming with a change of definition (calcareous material in 1974, a calcic or gypsic horizon in 1988, p. 79); the Plinthic Luvisols (Lp) are deleted with no 1988 row (the Luvisols comment sends soils with plinthite to the Plinthosols, p. 122); the Thionic Histosols (HSt) are new (p. 126) (Q8) (Hugo, 2026-11-08)."
  - topic: "Slips of Appendix 4"
    edition: [1988]
    page: "pp. 115, 124"
    version: "0.9.391"
    reading: "On p. 115 the comment of the Fluvisols grouping is set one column to the right (its second line runs under the units); read as the grouping's comment. On p. 124 the Acrisols' ''lacking an aridic moisture regime' deleted' runs into the comment of the Gleyic Acrisols; read as the grouping's comment, the Gleyic Acrisols' own being the 0-100 cm of the gleyic properties (Hugo, 2026-11-10)."
  # --- 0.9.392: reading FAO-Unesco labels and the offline ISIS benchmark ------------------
  - topic: "Labels: edition from the publication year"
    edition: [1988, 1974]
    page: "title page; 74 Vol. I"
    version: "0.9.392"
    reading: "A label of 1974 is read in fao1974; one of 1988, 1990 or 1997 (the printings of the Revised Legend; ISIS stores the revised names under the ISRIC reprint of 1997) in fao1988. Any other year is not read (Hugo, 2026-11-10)."
  - topic: "Labels: singular, Nitosol and Nitisol, subunits, phases"
    edition: [1988, 1974]
    page: "pp. 63-66; 74 pp. 12-13"
    version: "0.9.392"
    reading: "A group word is read singular or plural, case alike, exact names only. The 1974 'Nitosol' and the 1988 'Nitisol' are read in the other edition too, flagged nitosol_nitisol. A hyphenated prefix of the unit adjective is ISRIC's third level ('Ferri-Haplic'), cut off and reported, never scored (the legend defines no list of subunits, p. 66). Words after the group are matched to the phase ids of the edition; others are reported apart. A single-unit group of 1974 named alone is its own unit (Hugo, 2026-11-10)."
  - topic: "ISIS benchmark: what counts"
    edition: [1988, 1974]
    page: "Q5, Q27"
    version: "0.9.392"
    reading: "Offline, on the cached ISIS profiles, the reader unchanged (Q27). Grouping and unit agreement with Wilson 95 % intervals; a fall-through (no gate passed: candidates undecided, or not classified, Q5) counts as a disagreement. Provisional = a class tested before the assigned one left undecided at that level or above; stand-in = a passed test of the assigned class resting on a USDA or WRB stand-in; firm = neither. A labelled phase is scored against soilKey's status of that phase; phases are not required to be exhaustive in the labels, so a phase soilKey finds present and the label omits is reported, not scored as an error (Hugo, 2026-11-10)."
  # --- decisions of 2026-11-10 on the causes the ISIS benchmark showed --------------------
  - topic: "ISIS cracks: large cracks and gilgai"
    edition: [1988, 1974]
    page: "pp. 37, 77; 74 pp. 31, 43"
    version: "0.9.392"
    reading: "The ISIS reader (R/isis-graphql.R) reads the profile's large cracking and, without a cracking record, gilgai as cracks of 1 cm or more in the horizons starting above 100 cm, the lower limit of the medium surface cracks (1-2 cm) of the FAO field guidelines' classes that ISIS's own cracksSurface uses; small cracking stays 0.5 cm, since a small crack may be a fine one (< 1 cm). ISIS gives the cracking itself no width (Hugo, 2026-11-10)."
  - topic: "Gypsum from an upper bound of the ECe"
    edition: [1988, 1974]
    page: "pp. 31-32; 74 p. 27"
    version: "0.9.392"
    reading: "With neither caso4_pct nor ec_dS_m recorded, an upper bound of the ECe (ec_max_dS_m, which the ISIS reader derives from an EC 1:2.5) below 2 dS/m reads as no gypsum, flagged no_gypsum_at_ece_upper_bound_below_2, the same rule as an ECe below 2 (.f88_gypsum(), shared by the gypsic horizon of 1974) (Hugo, 2026-11-10)."
  - topic: "Andic properties with the P retention not measured"
    edition: [1988]
    page: "p. 34"
    version: "0.9.392"
    reading: "When Alox + 1/2 Feox is 2 % or more and the bulk density 0.9 or less, and the P retention is not measured, the andic properties are undecided (flagged andic_undecided_p_retention_not_measured), volcanic material recorded or not; the rule that undecided andic properties are absent unless volcanic material is recorded applies only when fewer criteria are met. The amorphous complex of 1974 has no 'absent' rule: undecided stays undecided, then the stand-ins (Hugo, 2026-11-10)."
  - topic: "A layer designated as mineral is not organic material"
    edition: [1988, 1974]
    page: "p. 39; p. 75; 74 pp. 21, 43"
    version: "0.9.405"
    reading: "A layer whose designation names a mineral master horizon (A, E, B or C, a transition between them, with or without a lithological prefix: A1, 2Bt, Csk, AC, B/C) is not organic material (1988) and not an H horizon (1974) when the organic carbon leaves that undecided, flagged mineral_layer_from_designation: the designation is a field observation, and organic layers are written H or O. A layer with no designation and no organic carbon stays undecided (Hugo, 2026-11-12)."
  - topic: "No organic layer below the deepest layer described"
    edition: [1988, 1974]
    page: "p. 75; 74 p. 43"
    version: "0.9.405"
    reading: "The Histosols take no organic layer below the deepest layer described: a description that stops above 80 cm no longer leaves the cumulative 40 cm of organic layers undecided, since an organic layer is a field observation and none is described there (Hugo, 2026-11-12)."
  - topic: "The spodic B absent from a described profile"
    edition: [1988, 1974]
    page: "pp. 30-31; 74 p. 26"
    version: "0.9.405"
    reading: "When the chemistry of the spodic B is undecided, a profile with designations recorded none of whose B layers carries the h, s or ir of a spodic B (Bh, Bs, Bhs, Bir) has no spodic B, flagged spodic_b_not_in_the_designations; items 1 (cementation) and 2 (pellets, cracked coatings) still decide. A profile with no designation keeps the stand-ins (Hugo, 2026-11-12)."
