# The soil units of the Calcisols (CL), FAO-Unesco Revised Legend (FAO 1988, World
# Soil Resources Report 60; the text of the ISRIC reprint of 1997), ch. X, p. 86,
# in the key's order; the last unit is the key's "Other ..." residual
# (default: true). Codes and names as printed; name_pt is soilKey's
# Portuguese gloss. The criteria are summarised in soilKey's words; no text
# of the book is shipped. The predicates are those of
# R/diagnostics-fao88-horizons.R, R/diagnostics-fao88-properties.R,
# R/key-fao.R and R/key-fao-units.R; the readings in readings.yaml.

units:
  CL:
    - code: "CLp"
      name: "Petric Calcisols"
      name_pt: "Calcissolos Pétricos (Petric Calcisols)"
      page: 86
      tests:
        all_of:
          - petrocalcic_fao88: {max_top_cm: 100}
      notes: "A petrocalcic horizon whose upper part is within 100 cm of the surface."

    - code: "CLl"
      name: "Luvic Calcisols"
      name_pt: "Calcissolos Lúvicos (Luvic Calcisols)"
      page: 86
      tests:
        all_of:
          - argic_b_fao88: {}
      notes: "An argic B horizon."

    - code: "CLh"
      name: "Haplic Calcisols"
      name_pt: "Calcissolos Háplicos (Haplic Calcisols)"
      page: 86
      tests:
        default: true
      notes: "Other soils of the grouping (the key's residual)."
