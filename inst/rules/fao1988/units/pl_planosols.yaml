# The soil units of the Planosols (PL), FAO-Unesco Revised Legend (FAO 1988, World
# Soil Resources Report 60; the text of the ISRIC reprint of 1997), ch. X, p. 82-83,
# in the key's order; the last unit is the key's "Other ..." residual
# (default: true). Codes and names as printed; name_pt is soilKey's
# Portuguese gloss. The criteria are summarised in soilKey's words; no text
# of the book is shipped. The predicates are those of
# R/diagnostics-fao88-horizons.R, R/diagnostics-fao88-properties.R,
# R/key-fao.R and R/key-fao-units.R; the readings in readings.yaml.

units:
  PL:
    - code: "PLi"
      name: "Gelic Planosols"
      name_pt: "Planossolos Gélicos (Gelic Planosols)"
      page: 82
      tests:
        all_of:
          - permafrost_fao88: {max_top_cm: 200}
      notes: "Permafrost within 200 cm of the surface."

    - code: "PLm"
      name: "Mollic Planosols"
      name_pt: "Planossolos Mólicos (Mollic Planosols)"
      page: 82
      tests:
        all_of:
          - any_of:
              - mollic_a_fao88: {}
              - histic_h_fao88: {base: eutric}
      notes: "A mollic A horizon, or a eutric histic H horizon (pH 1:5 of 5.5 or more, Q15)."

    - code: "PLu"
      name: "Umbric Planosols"
      name_pt: "Planossolos Úmbricos (Umbric Planosols)"
      page: 83
      tests:
        all_of:
          - any_of:
              - umbric_a_fao88: {}
              - histic_h_fao88: {base: dystric}
      notes: "An umbric A horizon, or a dystric histic H horizon (pH 1:5 below 5.5, Q15)."

    - code: "PLd"
      name: "Dystric Planosols"
      name_pt: "Planossolos Distróficos (Dystric Planosols)"
      page: 83
      tests:
        all_of:
          - slow_horizon_bs_fao88: {lt: 50, to_cm: 125}
      notes: "Base saturation (NH4OAc) below 50 % in at least a part of the slowly permeable horizon within 125 cm."

    - code: "PLe"
      name: "Eutric Planosols"
      name_pt: "Planossolos Eutróficos (Eutric Planosols)"
      page: 83
      tests:
        default: true
      notes: "Other Planosols (the key's residual). The two lists print 'Eutric Planosolss' (pp. 18, 139), read Planosols."
