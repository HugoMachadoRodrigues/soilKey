# The soil units of the Regosols (RG), FAO-Unesco Revised Legend (FAO 1988, World
# Soil Resources Report 60; the text of the ISRIC reprint of 1997), ch. X, p. 80-81,
# in the key's order; the last unit is the key's "Other ..." residual
# (default: true). Codes and names as printed; name_pt is soilKey's
# Portuguese gloss. The criteria are summarised in soilKey's words; no text
# of the book is shipped. The predicates are those of
# R/diagnostics-fao88-horizons.R, R/diagnostics-fao88-properties.R,
# R/key-fao.R and R/key-fao-units.R; the readings in readings.yaml.

units:
  RG:
    - code: "RGi"
      name: "Gelic Regosols"
      name_pt: "Regossolos Gélicos (Gelic Regosols)"
      page: 80
      tests:
        all_of:
          - permafrost_fao88: {max_top_cm: 200}
      notes: "Permafrost within 200 cm of the surface."

    - code: "RGu"
      name: "Umbric Regosols"
      name_pt: "Regossolos Úmbricos (Umbric Regosols)"
      page: 80
      tests:
        all_of:
          - umbric_a_fao88: {}
      notes: "An umbric A horizon."

    - code: "RGy"
      name: "Gypsiric Regosols"
      name_pt: "Regossolos Gipsíricos (Gypsiric Regosols)"
      page: 80
      aliases: ["Gypsic Regosols"]
      tests:
        all_of:
          - gypsiferous_fao88: {window_cm: [20, 50]}
      notes: "Gypsiferous (5 % gypsum or more) at least between 20 and 50 cm from the surface. Printed Gypsiric in the key and ch. VI, Gypsic in the lists (Q7)."

    - code: "RGc"
      name: "Calcaric Regosols"
      name_pt: "Regossolos Calcáricos (Calcaric Regosols)"
      page: 80
      tests:
        all_of:
          - calcaric_fao88: {}
      notes: "Calcareous at least between 20 and 50 cm from the surface."

    - code: "RGd"
      name: "Dystric Regosols"
      name_pt: "Regossolos Distróficos (Dystric Regosols)"
      page: 81
      tests:
        all_of:
          - bs_below_fao88: {lt: 50, top: 20, bottom: 50}
      notes: "Base saturation (NH4OAc) below 50 % at least from 20 to 50 cm (every layer overlapping 20-50 cm)."

    - code: "RGe"
      name: "Eutric Regosols"
      name_pt: "Regossolos Eutróficos (Eutric Regosols)"
      page: 81
      tests:
        default: true
      notes: "Other soils of the grouping (the key's residual)."
