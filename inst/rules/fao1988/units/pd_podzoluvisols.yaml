# The soil units of the Podzoluvisols (PD), FAO-Unesco Revised Legend (FAO 1988, World
# Soil Resources Report 60; the text of the ISRIC reprint of 1997), ch. X, p. 85,
# in the key's order; the last unit is the key's "Other ..." residual
# (default: true). Codes and names as printed; name_pt is soilKey's
# Portuguese gloss. The criteria are summarised in soilKey's words; no text
# of the book is shipped. The predicates are those of
# R/diagnostics-fao88-horizons.R, R/diagnostics-fao88-properties.R,
# R/key-fao.R and R/key-fao-units.R; the readings in readings.yaml.

units:
  PD:
    - code: "PDi"
      name: "Gelic Podzoluvisols"
      name_pt: "Podzoluvissolos Gélicos (Gelic Podzoluvisols)"
      page: 85
      tests:
        all_of:
          - permafrost_fao88: {max_top_cm: 200}
      notes: "Permafrost within 200 cm of the surface."

    - code: "PDg"
      name: "Gleyic Podzoluvisols"
      name_pt: "Podzoluvissolos Gleicos (Gleyic Podzoluvisols)"
      page: 85
      tests:
        all_of:
          - gleyic_properties_fao88: {max_top_cm: 100}
      notes: "Gleyic properties within 100 cm of the surface."

    - code: "PDj"
      name: "Stagnic Podzoluvisols"
      name_pt: "Podzoluvissolos Estágnicos (Stagnic Podzoluvisols)"
      page: 85
      tests:
        all_of:
          - stagnic_properties_fao88: {max_top_cm: 50}
      notes: "Stagnic properties within 50 cm of the surface."

    - code: "PDd"
      name: "Dystric Podzoluvisols"
      name_pt: "Podzoluvissolos Distróficos (Dystric Podzoluvisols)"
      page: 85
      tests:
        all_of:
          - b_bs_below_fao88: {kind: argic_b, lt: 50, to_cm: 125}
      notes: "Base saturation (NH4OAc) below 50 % in at least a part of the B within 125 cm of the surface."

    - code: "PDe"
      name: "Eutric Podzoluvisols"
      name_pt: "Podzoluvissolos Eutróficos (Eutric Podzoluvisols)"
      page: 85
      tests:
        default: true
      notes: "Other soils of the grouping (the key's residual)."
