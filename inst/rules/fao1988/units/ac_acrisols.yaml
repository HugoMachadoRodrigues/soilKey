# The soil units of the Acrisols (AC), FAO-Unesco Revised Legend (FAO 1988, World
# Soil Resources Report 60; the text of the ISRIC reprint of 1997), ch. X, p. 87,
# in the key's order; the last unit is the key's "Other ..." residual
# (default: true). Codes and names as printed; name_pt is soilKey's
# Portuguese gloss. The criteria are summarised in soilKey's words; no text
# of the book is shipped. The predicates are those of
# R/diagnostics-fao88-horizons.R, R/diagnostics-fao88-properties.R,
# R/key-fao.R and R/key-fao-units.R; the readings in readings.yaml.

units:
  AC:
    - code: "ACp"
      name: "Plinthic Acrisols"
      name_pt: "Acrissolos Plínticos (Plinthic Acrisols)"
      page: 87
      tests:
        all_of:
          - plinthite_fao88: {max_top_cm: 125}
      notes: "Plinthite within 125 cm of the surface."

    - code: "ACg"
      name: "Gleyic Acrisols"
      name_pt: "Acrissolos Gleicos (Gleyic Acrisols)"
      page: 87
      tests:
        all_of:
          - gleyic_properties_fao88: {max_top_cm: 100}
      notes: "Gleyic properties within 100 cm of the surface."

    - code: "ACu"
      name: "Humic Acrisols"
      name_pt: "Acrissolos Húmicos (Humic Acrisols)"
      page: 87
      tests:
        all_of:
          - strongly_humic_fao88: {}
          - any_of:
              - umbric_a_fao88: {}
              - mollic_a_fao88: {}
      notes: "Strongly humic, with an umbric or a mollic A horizon."

    - code: "ACf"
      name: "Ferric Acrisols"
      name_pt: "Acrissolos Férricos (Ferric Acrisols)"
      page: 87
      tests:
        all_of:
          - ferric_properties_fao88: {}
      notes: "Ferric properties (no depth in the key: within 125 cm, p. 42)."

    - code: "ACh"
      name: "Haplic Acrisols"
      name_pt: "Acrissolos Háplicos (Haplic Acrisols)"
      page: 87
      tests:
        default: true
      notes: "Other soils of the grouping (the key's residual)."
