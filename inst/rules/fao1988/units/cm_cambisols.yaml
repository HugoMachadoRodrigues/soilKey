# The soil units of the Cambisols (CM), FAO-Unesco Revised Legend (FAO 1988, World
# Soil Resources Report 60; the text of the ISRIC reprint of 1997), ch. X, p. 89,
# in the key's order; the last unit is the key's "Other ..." residual
# (default: true). Codes and names as printed; name_pt is soilKey's
# Portuguese gloss. The criteria are summarised in soilKey's words; no text
# of the book is shipped. The predicates are those of
# R/diagnostics-fao88-horizons.R, R/diagnostics-fao88-properties.R,
# R/key-fao.R and R/key-fao-units.R; the readings in readings.yaml.

units:
  CM:
    - code: "CMi"
      name: "Gelic Cambisols"
      name_pt: "Cambissolos Gélicos (Gelic Cambisols)"
      page: 89
      tests:
        all_of:
          - permafrost_fao88: {max_top_cm: 200}
      notes: "Permafrost within 200 cm of the surface."

    - code: "CMg"
      name: "Gleyic Cambisols"
      name_pt: "Cambissolos Gleicos (Gleyic Cambisols)"
      page: 89
      tests:
        all_of:
          - gleyic_properties_fao88: {max_top_cm: 100}
      notes: "Gleyic properties within 100 cm of the surface."

    - code: "CMv"
      name: "Vertic Cambisols"
      name_pt: "Cambissolos Vérticos (Vertic Cambisols)"
      page: 89
      tests:
        all_of:
          - vertic_properties_fao88: {}
      notes: "Vertic properties (no depth in the key: within 125 cm, p. 42)."

    - code: "CMu"
      name: "Humic Cambisols"
      name_pt: "Cambissolos Húmicos (Humic Cambisols)"
      page: 89
      tests:
        all_of:
          - any_of:
              - umbric_a_fao88: {}
              - all_of:
                  - mollic_a_fao88: {}
                  - b_bs_below_fao88: {kind: cambic_b, lt: 50, to_cm: 125}
      notes: "An umbric A horizon, or a mollic A horizon over a cambic B with a base saturation (NH4OAc) below 50 % in at least some part of the B (this last phrase printed in italics in the 1997 text, applied as printed, Q4)."

    - code: "CMc"
      name: "Calcaric Cambisols"
      name_pt: "Cambissolos Calcáricos (Calcaric Cambisols)"
      page: 89
      tests:
        all_of:
          - calcaric_fao88: {}
      notes: "Calcareous at least between 20 and 50 cm from the surface."

    - code: "CMo"
      name: "Ferralic Cambisols"
      name_pt: "Cambissolos Ferrálicos (Ferralic Cambisols)"
      page: 89
      tests:
        all_of:
          - property_in_b_fao88: {property: ferralic, kind: cambic_b, to_cm: 125}
      notes: "A cambic B horizon with ferralic properties."

    - code: "CMd"
      name: "Dystric Cambisols"
      name_pt: "Cambissolos Distróficos (Dystric Cambisols)"
      page: 89
      tests:
        all_of:
          - b_bs_below_fao88: {kind: cambic_b, lt: 50, to_cm: 125}
      notes: "Base saturation (NH4OAc) below 50 % at least in some part of the B horizon."

    - code: "CMx"
      name: "Chromic Cambisols"
      name_pt: "Cambissolos Crômicos (Chromic Cambisols)"
      page: 89
      tests:
        all_of:
          - b_colour_fao88: {colour: chromic, kind: cambic_b}
      notes: "A strong brown to red B: rubbed hue 7.5YR with a chroma above 4, or a hue redder than 7.5YR."

    - code: "CMe"
      name: "Eutric Cambisols"
      name_pt: "Cambissolos Eutróficos (Eutric Cambisols)"
      page: 89
      tests:
        default: true
      notes: "Other soils of the grouping (the key's residual)."
