# The soil units of the Leptosols (LP), FAO-Unesco Revised Legend (FAO 1988, World
# Soil Resources Report 60; the text of the ISRIC reprint of 1997), ch. X, p. 76,
# in the key's order; the last unit is the key's "Other ..." residual
# (default: true). Codes and names as printed; name_pt is soilKey's
# Portuguese gloss. The criteria are summarised in soilKey's words; no text
# of the book is shipped. The predicates are those of
# R/diagnostics-fao88-horizons.R, R/diagnostics-fao88-properties.R,
# R/key-fao.R and R/key-fao-units.R; the readings in readings.yaml.

units:
  LP:
    - code: "LPq"
      name: "Lithic Leptosols"
      name_pt: "Leptossolos Líticos (Lithic Leptosols)"
      page: 76
      tests:
        all_of:
          - lithic_fao88: {depth: 10}
      notes: "Continuous hard rock or a continuous cemented layer within 10 cm of the surface."

    - code: "LPi"
      name: "Gelic Leptosols"
      name_pt: "Leptossolos Gélicos (Gelic Leptosols)"
      page: 76
      tests:
        all_of:
          - permafrost_fao88: {max_top_cm: 200}
      notes: "Permafrost within 200 cm of the surface."

    - code: "LPk"
      name: "Rendzic Leptosols"
      name_pt: "Leptossolos Rêndzicos (Rendzic Leptosols)"
      page: 76
      tests:
        all_of:
          - rendzic_fao88: {cce_gt: 40}
      notes: "A mollic A horizon that contains, or lies directly on, calcareous material with a CaCO3 equivalent above 40 %."

    - code: "LPm"
      name: "Mollic Leptosols"
      name_pt: "Leptossolos Mólicos (Mollic Leptosols)"
      page: 76
      tests:
        all_of:
          - mollic_a_fao88: {}
      notes: "A mollic A horizon."

    - code: "LPu"
      name: "Umbric Leptosols"
      name_pt: "Leptossolos Úmbricos (Umbric Leptosols)"
      page: 76
      tests:
        all_of:
          - umbric_a_fao88: {}
      notes: "An umbric A horizon."

    - code: "LPd"
      name: "Dystric Leptosols"
      name_pt: "Leptossolos Distróficos (Dystric Leptosols)"
      page: 76
      tests:
        all_of:
          - bs_below_fao88: {lt: 50, top: 0, bottom: 125, mode: some}
      notes: "Base saturation (NH4OAc) below 50 % (no depth in the key: in some part of the soil within 125 cm, ch. VI p. 45 and p. 42)."

    - code: "LPe"
      name: "Eutric Leptosols"
      name_pt: "Leptossolos Eutróficos (Eutric Leptosols)"
      page: 76
      tests:
        default: true
      notes: "Other soils of the grouping (the key's residual)."
