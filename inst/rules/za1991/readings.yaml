# The readings soilKey makes of the South African soil classification of 1991
# (Soil Classification Working Group, 1991. Soil classification: a taxonomic
# system for South Africa. Memoirs on the Agricultural Natural Resources of
# South Africa No. 15) where the open sources are silent or ambiguous. The
# book itself is not available: soilKey reads the open AGIS key and form
# pages (K), the family criteria (FC), the general rules (G), the topsoil
# pages (T), the preface of the second edition (P), SASRI 1999 (S) and van
# Huyssteen 2020 (V). An entry ending "(Hugo, 2026-11-04)" is a decision of
# the owner, in soilKey's words; an entry ending "(soilKey's reading, for
# Hugo to confirm, <date>)" is soilKey's own and waits for his word. The
# criteria are paraphrased; no text of the sources is shipped.
readings:
  # --- the decisions of 2026-11-04 that this part applies ------------------------
  - topic: "Registry names and declared notations"
    page: "-"
    reading: "The system will be za1991, namespace za, aliases za, sat, sat1991 and south_africa, experimental and opt-in. site$designation_system declares the South African notation with za, za1991, sat, sat1991 or south african; never inferred from the country, since a South African site may be described in the FAO notation. Every stored code and name carries its edition, and a name or code is never resolved between 1977, 1991 and 2018 (defaults 1 and 2) (Hugo, 2026-11-04)."
  - topic: "The notation: diagnostic_za and the designation"
    page: "P; S 30-33"
    reading: "A new horizon attribute diagnostic_za holds the name of the diagnostic horizon or material, the 30 names; the same names written in designation are read too; a name of 1977 is read as its 1991 equivalent, flagged (ferrihumic B is the podzol B). The FAO and USDA letters are hints only (Bt may be a pedocutanic, prismacutanic, red structured or neocutanic B), never the name. The written name gives the horizon, the recorded data its properties (Q5) (Hugo, 2026-11-04)."
  - topic: "The 1977 names"
    page: "P"
    reading: "As the preface of the second edition gives them: the ferrihumic B is the podzol B; the gleycutanic B is the G horizon (the Kroonstad form) or the unspecified material with signs of wetness (the Pinedene form); the calcareous red or yellow-brown apedal B and the calcareous neocutanic B are the neocarbonate B. Each is flagged '1977 name' (Q5) (Hugo, 2026-11-04)."
  - topic: "The new attributes"
    page: "-"
    reading: "diagnostic_za, plasticity_index, liquid_limit_method (the Casagrande cup when not recorded, flagged), bedrock_pct, coatings_hue_moist, coatings_chroma_moist, coatings_continuity, recent_deposit, cross_bedding and sand_grade on the horizons, and reference_za_form, reference_za_family, reference_za_raw and reference_za_edition on the site (benchmarks only, never read to classify). stone_line and stripped_grains are not added: a recorded stone line is evidence, the stripped grains are uncoated_grains_pct (default 21; Q8, Q17, Q19, Q23) (Hugo, 2026-11-04)."
  # --- the readings of this part, decided on its review (2026-11-04) ---------------
  - topic: "The short forms"
    page: "-"
    reading: "No open source prints abbreviations of the 1991 horizons (S abbreviates only the forms), and none of the 659 South African AfSP profiles writes a diagnostic name in its layers, so soilKey's two-letter short forms (ot, re, ye, sp, hp, ne, pd, pr, li, gh, do) are not read until they are checked on a survey sheet. The full names and soilKey's tokens (OA, RAB, SPL ...) are read in diagnostic_za, and E and G alone keep their meaning there, never inside a designation (reading 1, amended: the short forms dropped) (Hugo, 2026-11-04)."
  - topic: "Recognising the notation in the designations"
    page: "-"
    reading: "Without a declaration, a profile's designations are read as South African names when the profile records a name in diagnostic_za (a word that names nothing does not count) or when one designation holds a name only this system writes (the topsoil names, red apedal, yellow-brown apedal, red structured, neocutanic, neocarbonate, pedocutanic, prismacutanic, lithocutanic, podzol B, soft or hard plinthic, the carbonate horizons, dorbank, regic sand, man-made soil deposit, the materials with or without signs of wetness, and the 1977 ferrihumic and gleycutanic B). The names other writings share (E horizon, G horizon, placic pan, saprolite, hard rock, stratified alluvium; humic, vertic, melanic; calcrete, ferricrete, ouklip, hard plinthite, silcrete) are read only in a profile declared or recognised so: a Cr (saprolite) of a USDA description is not a South African name. A site that declares another notation has none of its designations read as names, and gives no FAO hints unless that notation writes the FAO or USDA letters; diagnostic_za is read whatever the site declares (reading 2) (Hugo, 2026-11-04)."
  - topic: "The gleycutanic B by position"
    page: "P"
    reading: "A gleycutanic B is the G horizon under a topsoil horizon or an E, and the unspecified material with signs of wetness under a red or yellow-brown apedal, neocutanic or neocarbonate B, read on the nearest layer above it that holds a diagnostic horizon (only the layers that hold none are skipped). When that layer is undecided or not read, its candidates, else the hints of its FAO letters, decide when they all lead to one of the two (red or yellow-brown apedal B: the unspecified material; a Bw: the same); anywhere else, or with nothing above, it stays undecided between the two (reading 3, amended after the review) (Hugo, 2026-11-04)."
  - topic: "Other words for the hard and carbonate horizons"
    page: "S 31; P"
    reading: "Read by their adjective: calcrete alone is undecided between the soft carbonate horizon and the hardpan carbonate horizon; hardpan calcrete is the hardpan carbonate horizon; powder (powdery) or nodular calcrete the soft carbonate horizon; ouklip, ferricrete, hardpan ferricrete and hard plinthite the hard plinthic B; nodular ferricrete undecided between the soft and the hard plinthic B; silcrete hard rock (P, Mispah). Ironpan and laterite are left out, as other systems use them otherwise. Each is read with a note and none recognises a profile by itself (reading 4, amended) (Hugo, 2026-11-04)."
  - topic: "Names in Afrikaans"
    page: "-"
    reading: "The 1991 system was also published in Afrikaans and many descriptions are written in it (ortiese A, rooi apedale B ...). No open source gives the Afrikaans names, so soilKey reads the English names only; a name that looks Afrikaans is left unread with a note that says so (reading 5) (Hugo, 2026-11-04)."
  - topic: "No diagnostic horizon, negations, doubt and two names"
    page: "S 31; K 1-3"
    reading: "In diagnostic_za, none, no diagnostic, no subsoil (the key's words), none with a remark (none (lithosol)) and a name marked non-diagnostic or not diagnostic, before or after it (non-diagnostic saprolite, saprolite (non-diagnostic); S 31 speaks of non-diagnostic saprolite), record a layer that holds no diagnostic horizon; NA, nd, '-' and '?' record nothing. A name negated by not, no, non, without, absent or none elsewhere in the text (not red apedal B, E horizon absent; but the name unconsolidated material without signs of wetness is read) is not read, with a note. A name written with doubt (?, possibly, probably, perhaps, maybe) stays a candidate, the token undecided, with a note. Two names in one field (red apedal B / soft plinthic B, '... or ...') leave the layer undecided between them; a name inside other words (B1 red apedal, B2 soft carbonate) is read, with a note, and 'calcareous' written after a name (red apedal B, calcareous) keeps the name, with a note that a calcareous apedal or neocutanic B is the neocarbonate B (reading 6, with the fixes of the review) (Hugo, 2026-11-04)."
  - topic: "The name against the master letter"
    page: "P"
    reading: "When a name, from diagnostic_za or from the designation itself, is a topsoil horizon on a layer designated E, B, C, R or G, or a subsoil horizon on one designated A, O or H, the name is kept and the disagreement noted (Bss vertic); the designation never changes the name (reading 7) (Hugo, 2026-11-04)."
  - topic: "The hints of the FAO letters"
    page: "-"
    reading: "Besides the letters of the plan: A gives the four mineral topsoils; Bkm and Ckm only the hardpan carbonate horizon (cemented), Ck the two carbonate horizons; Bc the soft and the hard plinthic B; Cqm the dorbank; Cu and ^C the man-made soil deposit; Cr the saprolite, the two wet materials, the G horizon and the lithocutanic B (Cr is weathered rock in the USDA notation and a strongly reduced C in the FAO's); Br the G horizon and the wet materials. A suffix is one of the FAO or USDA letters, ss (slickensides, no hint) or ^; at most three suffixes and two digits in a run, so a word (Bleached, Clay, Rock, Calcareous, Hutton, Hu1200) gives no hint. A B, C or transition with no suffix gives no hint beyond its master (B alone none). A master letter alone in diagnostic_za is a hint, never the name, except E and G (reading 8, amended: R2) (Hugo, 2026-11-04)."
  - topic: "The declared values"
    page: "-"
    reading: "designation_system is compared once lower-cased with spaces and punctuation dropped: za, za1991, sat and sat1991, and any value starting with south africa (South Africa, south_africa, South African, South African 1991) declare the notation. SA and RSA name the country, not a notation: they neither declare it nor count as another notation, so the distinctive names in the designations are still read (reading 9, amended) (Hugo, 2026-11-04)."
  # --- part 2 (0.9.356): the decisions of 2026-11-04 it applies -------------------
  - topic: "The colours of the subsoil horizons"
    page: "FC 4, 5, 6, 9, 15; S 32-33; V 19-20"
    reading: "Grey: the dry colour of the WRB albic material (value 7 or more and chroma 3 or less, or value 5 or more and chroma 2 or less), the moist colour not required; dry colour not recorded, undecided (Q9). Yellow-brown: the moist hue 7.5YR or yellower, the moist chroma above the low-chroma limit and the dry colour not grey (Q10). Red: the moist hue 5YR, 2.5YR, 10R or 7.5R, the dry hue only when no moist one is recorded, flagged; a colour yellow dry and red moist is red (Q11). Low chroma: a moist matrix chroma of 2 or less or a gley hue (N, GY, G, BG, B, PB); signs of wetness: those colours in the matrix or on 5 % or more of the layer as mottles (Q12). The numbers stand in for the book's charts, in thresholds.yaml, flagged (Hugo, 2026-11-04)."
  - topic: "Vertic against melanic, the organic O, the clay change, calcareous"
    page: "T-vertic; T-melanic; T-organic; S 32; FC 16"
    reading: "Slickensides common or more make the vertic A; few or none and no plasticity index, the melanic A if its other tests pass, flagged (Q17); the liquid limit by the Casagrande cup when its method is not recorded, flagged (default 18). The organic O is saturated when water_saturation_days says so (30 days, the WRB histic horizon standing in), else by its evidence (the site drained, a water table in the layer or the next one, signs of wetness below), flagged; nothing of it, undecided (Q18). The prismacutanic B compares its upper layer (the B1, Q20) with the layer directly above; 20 % clay exactly above by the +20 rule (Q21). Calcareous: effervescence recorded, else CaCO3 1 % or more, flagged (Q22) (Hugo, 2026-11-04)."
  - topic: "The topsoil defaults"
    page: "T"
    reading: "Topsoil tests in the order organic O, vertic, melanic, humic, orthic, the humic A tested a second time on the first subsoil and falling to orthic when that fails (default 7); stripped grains are uncoated_grains_pct of 25 % or more, not recorded absent (default 8); a melanic A with no dry colour is undecided, the moist colour + 1 value only as evidence (default 9); exchangeable cations, flagged when the EC is high (default 10); the CEC under 11 cmol(+)/kg soil by ammonium acetate only in the borderline apedal case, another method flagged (default 16) (Hugo, 2026-11-04)."
  # --- part 2 (0.9.356): soilKey's readings, decided by Hugo on the review (2026-11-05)
  - topic: "Structure not recorded"
    page: "V 21; S 31-32"
    reading: "A layer with no structure recorded is undecided between the apedal and the structured B horizons, not apedal: the structure is always there in some grade, so the rule that an observation not recorded is absent is not applied to it (Hugo, 2026-11-05)."
  - topic: "Weak structure: apedal or neocutanic"
    page: "V 21; S 32"
    reading: "A uniform layer with a weak structure is an apedal B (V 21: weaker than moderate blocky or prismatic) when it is red or yellow-brown; the neocutanic B needs variegated colours or cutans (clay films few or more), or a uniform weak structure in a colour that is neither red nor yellow-brown nor grey (the uniform dark brown of S 32; amended on the review, D8). 'Borderline' is a grade written weak to moderate: a CEC under 11 cmol(+)/kg soil makes it apedal, 11 or more moderate, flagged, not recorded undecided (amended, D7) (Hugo, 2026-11-05)."
  - topic: "Hues redder than 7.5R"
    page: "FC 9"
    reading: "FC 9 lists 5YR, 2.5YR, 10R and 7.5R; a hue redder still (5R, 2.5R, the RP hues) is read as red too, flagged (red_redder_hues in thresholds.yaml) (Hugo, 2026-11-05)."
  - topic: "Red structured against red pedocutanic B"
    page: "S 31; P"
    reading: "A red, moderate or strong blocky B is pedocutanic when its cutans differ in colour from the red matrix (variegated colours not all red, or coatings of another hue or value) or when the transition from the material above is abrupt; uniformly red with a transition recorded clear, gradual or diffuse it is the red structured B; the transition not recorded leaves both undecided, by one shared reading (amended, D2: a humic A over such a B stays a candidate, not orthic). The transition is that of the nearest layer above that is not part of the same B. A non-red blocky B with prominent cutans (clay films common or more; not recorded, soilKey's argic() stands in, flagged) is pedocutanic (Hugo, 2026-11-05)."
  - topic: "The prismacutanic transition and dark cutans"
    page: "S 32"
    reading: "The very abrupt change: a transition recorded clear, gradual or diffuse fails it (abrupt, very abrupt, sharp, a and smooth abrupt are abrupt; another word undecided); not recorded, the change of clay of S 32 is read as that change. The material above is the layer above the whole B: a blocky B1 over a columnar B2 is one B, its B1 compared with the A or E (amended). A wet prismacutanic B needs uniformly dark cutans, read as a moist coatings value of 3 or less (prismacutanic_dark_cutans, flagged); not the black of family criterion 12 (value 2 or less, chroma 1 or less) (Hugo, 2026-11-05)."
  - topic: "The lithocutanic B on the data"
    page: "S 31; K 31, 72"
    reading: "Weathering rock in place in a layer that still holds soil: bedrock_pct (else saprolite_pct) of 10 % or more and under 100 % (lithocutanic_rock, flagged), or a designation of a B with weathering rock (BCr, B/R); a BC or CB with no rock recorded is undecided; no rock recorded otherwise, not lithocutanic. Not dominated by carbonate (a calcrete pan or soilKey's calcic()). Cutans on the rock and soil tongues are noted, not required (K 31) (Hugo, 2026-11-05)."
  - topic: "The humic A position before the next part"
    page: "T-humic (iv)"
    reading: "Until the next part identifies every horizon, T-humic (iv) reads the layer directly below the topsoil: a name written for it decides; else the red structured and prismacutanic B and the signs of wetness by the tests of this part, the E by its grey dry colour unless its designation names another horizon, the podzol B by a Bh or Bs designation or soilKey's spodic(), the hard plinthic B and the placic pan by their designation or an indurated layer with plinthite or ferric nodules, the soft plinthic B by more than 10 % mottles. Nothing recorded below the topsoil: (iv) holds (Hugo, 2026-11-05)."
  - topic: "The topsoil layers"
    page: "T"
    reading: "The topsoil tests run on the surface run: the first layer by depth and the layers that continue it, named topsoil in diagnostic_za or the designation, else designated A, O or H (not a transition such as AB); a first layer named or designated a subsoil starts none (a truncated profile). AP and AH written in capitals are A layers. Each layer is tested; 'in some part' (humic (i), over 1.8 % OC) is read over the mineral A layers of the run, a litter O on top not counting (amended) (Hugo, 2026-11-05)."
  - topic: "The organic O on the data"
    page: "T-organic (i)"
    reading: "The 10 % organic carbon is averaged over the 200 mm from the top of the layer, through the layers below it; a layer of rock (R) counts 0 %, a part not recorded at most 58 %, or at most the nearest carbon recorded above it when it is designated B, C, E or G or lies under a layer with under 10 %, flagged (amended, D3), so the average is decided when its bounds agree and undecided otherwise. Signs of wetness count as evidence of the saturation of an organic O only in a layer that starts within 50 cm below it (organic_o_wetness_cm, flagged; amended) (Hugo, 2026-11-05)."
  - topic: "Undecided observations"
    page: "T-vertic; FC 15"
    reading: "Slickensides recorded only as present (TRUE) leave the vertic and melanic A undecided unless the plasticity index passes the vertic limit (amended, D1); slickensides in a transitional layer below (AB, AC, BA) count as 'in the transition'. Redoximorphic features of 5 % or more with no mottle colours recorded leave the signs of wetness undecided. A melanic A whose rupture resistance is not recorded is not hard (T-melanic (vi)); with no dry hue its moist hue stands in, flagged, and 10.0YR is 10YR. Effervescence none, nil, 0, '-' or non-effervescent is not calcareous, a degree of it calcareous, another word undecided (amended, D9); CaCO3 read with hard carbonate nodules recorded is undecided, as they may be relict nodules in a non-calcareous matrix (FC 16). With a base not recorded the sum of the others is a lower bound (it decides the melanic A when it reaches 4 per 1 % OC); with no base recorded, the base saturation times the CEC, flagged (Hugo, 2026-11-05)."
  # --- part 2 (0.9.356): Hugo's decisions on the review (2026-11-05) ---------------
  - topic: "Low chroma and the gley hues"
    page: "FC 5; FC 15; S 33"
    reading: "Outside the gley hues a moist chroma of 2 or less is grey only at a moist value of 4 or more (low_chroma_value): the dark colours of FC 5 (10YR 3/2 of a melanic A or a dark pedocutanic B) are not signs of wetness. The hue 10Y is a gley hue, with N, GY, G, BG, B and PB; a family written alone (GY) is read as the family. low_chroma and gley_hues are soilKey's reading of Q12, not WRB numbers, flagged (D4) (Hugo, 2026-11-05)."
  - topic: "Red is not grey"
    page: "FC 9; S 32"
    reading: "A red hue makes a red colour only when the colour is not a grey low-chroma one: 5YR 6/1 is not red; a dark red 2.5YR 3/2 is (D5) (Hugo, 2026-11-05)."
  - topic: "Grey dry with no dry colour"
    page: "S 32-33"
    reading: "With the dry colour not recorded, a moist chroma of 4 or more is read as not grey dry (grey_dry_moist_chroma), flagged; under 4, the grey dry colour is undecided (Hugo, 2026-11-05)."
  - topic: "No B horizon on rock"
    page: "S 31"
    reading: "No B horizon is tested on a layer of rock (designation R, or bedrock_pct of 100): every B test is FALSE there (D6) (Hugo, 2026-11-05)."
  - topic: "The A2 of the older notation"
    page: "P"
    reading: "An A2 under an A1 (the older notation) is a candidate E, flagged (a2_old_notation): it continues the topsoil only when it is not grey dry; grey dry or undecided, it leaves the topsoil and the next part tests it as an E (Hugo, 2026-11-05)."
  - topic: "A calcareous stratified layer"
    page: "S 32; K 38, 74, 75"
    reading: "Q6 confirmed: a calcareous stratified alluvium, regic sand or man-made deposit stays the material; the neocarbonate B is an unstratified B (no stratification, no cross bedding) (Hugo, 2026-11-05)."
  # --- part 3 (0.9.357): the decisions of 2026-11-04 it applies ---------------------
  - topic: "The WRB stand-ins of the podzol B, placic pan, dorbank and carbonate horizons"
    page: "P; V 30-33; K 72"
    reading: "No open source defines these horizons; the WRB numbers stand in, flagged, in thresholds.yaml: the podzol B as the spodic horizon soilKey tests (pH(H2O) 5.9 or less, Alox + 1/2 Feox 0.5 % or more, 2.5 cm or more, an illuvial mark), without oxalate data by its Bh, Bs or Bhs designation and illuvial colours (Q13); the placic pan 0.1 to under 2.5 cm cemented at least weakly by iron, or a Bsm designation of that thickness (Q14); the dorbank cemented at least moderately by silica, 10 cm or more (Q15); the hardpan carbonate horizon cemented at least moderately by carbonate, 10 cm or more; the soft carbonate horizon not cemented, 15 % CaCO3 or more with 5 % secondary carbonates, 15 cm or more; a layer only effervescent stays the neocarbonate B (Q16) (Hugo, 2026-11-04)."
  - topic: "The wet materials by position"
    page: "S 33; P"
    reading: "A grey low-chroma matrix is the G horizon under a topsoil horizon or an E, the unspecified material with signs of wetness under a red or yellow-brown apedal, neocutanic or neocarbonate B, the unconsolidated material with signs of wetness under a podzol or pedocutanic B (Q12, plan 4.2) (Hugo, 2026-11-04)."
  # --- part 3 (0.9.357): soilKey's readings, decided by Hugo on the review (2026-11-06)
  - topic: "The order of the tests over a layer"
    page: "-"
    reading: "Below the topsoil each layer is tested in this order, the first that holds giving the name and an undecided one before it leaving the layer undecided between them: man-made deposit, hard rock, hardpan carbonate, dorbank, hard plinthic B, placic pan, saprolite, soft carbonate, E, podzol B, soft plinthic B, prismacutanic B, lithocutanic B, a grey low-chroma matrix (G or a wet material), stratified alluvium, regic sand, pedocutanic B, red structured B, neocarbonate B, neocutanic B, red apedal B, yellow-brown apedal B, unconsolidated material. When no test holds and one is undecided, no diagnostic horizon stays a candidate. Amended (R1): when both the grey matrix and the pedocutanic B hold, the G (or wet material) needs one more sign of wetness, low-chroma mottles on 5 % or more, a gley hue or a moist value of 5 or more (g_sign_value); otherwise the layer is the pedocutanic B (Hugo, 2026-11-06)."
  - topic: "The E on the data"
    page: "S 33; V 19"
    reading: "An E is grey when dry (Q9), is not stratified or cross-bedded, not cemented at least moderately and has no moderate or strong blocky or prismatic structure. Amended (R2): it holds less clay than the layer below it, or at most 2 points more than the layer above (e_clay_above), and lies only directly under an orthic A or another E. A layer that fails only the WRB dry-colour stand-in but is grey and of low chroma moist and eluvial is an E, flagged (D3). A layer of the topsoil starting at 350 mm or deeper that is grey when dry is read as an E (S 33) (Hugo, 2026-11-06)."
  - topic: "The podzol B"
    page: "V 30; Q13"
    reading: "With oxalate data the podzol B also needs 0.5 % organic carbon or more (not recorded, undecided; D5). Without them it needs a Bh, Bs or Bhs designation and illuvial colours (moist hue 7.5YR or redder with value 5 or less and chroma 4 or less, or value 3 or less and chroma 2 or less), a pH(H2O) over 5.9 or an organic carbon under 0.5 % recorded failing it; a grey layer above with illuvial colours and no designation leaves it undecided (Hugo, 2026-11-06)."
  - topic: "Cementation and the cementing agent"
    page: "S 31; V 26, 32-33"
    reading: "'Cannot be cut with a spade when wet' (the hard plinthic B, S 31) is read as strongly cemented or indurated; a soft plinthic B is less cemented. The agent of a cemented layer is the pan_type recorded (calcrete, duripan or dorbank, ferricrete or ouklip; silcrete is hard rock), else what the layer holds (duripan material 10 % or more, plinthite or ferric nodules, 15 % CaCO3 or more, the letters Bkm, Bqm, Bsm); several or none leave the hardpan carbonate, the dorbank and the hard plinthic B undecided. Amended (R4): a pan type recorded with no cementation counts as evidence of the cementation, flagged; with neither recorded, none of them (an observation not recorded is absent) (Hugo, 2026-11-06)."
  - topic: "Secondary carbonates not recorded"
    page: "K 72; Q16"
    reading: "The soft carbonate horizon needs secondary carbonates recorded (secondary_carbonates_pct, carbonate_soft_pct or carbonate_hard_pct 5 % or more): not recorded, absent, so a layer with only a laboratory CaCO3 of 15 % or more is not one, and is read as a neocarbonate B when it is calcareous; nodular or powder calcrete recorded is one (Hugo, 2026-11-06)."
  - topic: "Saprolite on the data"
    page: "S 31; K 26, 51, 55"
    reading: "Saprolite: weathering_stage saprolite or moderately (partly, highly) weathered; else saprolite_pct or bedrock_pct of 50 % or more; else a C designated r (Cr), flagged. Default 17 both ways: weathering rock in a B under another B is saprolite, flagged; saprolite directly under the topsoil or an E is the lithocutanic B, flagged (D6) (Hugo, 2026-11-06)."
  - topic: "Unconsolidated material and C layers"
    page: "S 32-33; K 24, 25, 49, 50, 53, 54"
    reading: "A layer designated C, neither rock nor saprolite, is unconsolidated material, and is not tested for the apedal and structured B horizons. Under a podzol or pedocutanic B it is the unconsolidated material with signs of wetness when it shows them (a grey matrix, or grey mottles on 5 % or more, Q12) and without them otherwise; elsewhere it is no material of the key. A layer with no designation is undecided for it (Hugo, 2026-11-06)."
  - topic: "The B horizons by position"
    page: "S 32; K 25 note i; K 50 notes i-ii"
    reading: "The red apedal B lies only under a topsoil, an E, a yellow-brown apedal B or another red apedal B; the yellow-brown apedal, neocutanic, neocarbonate, pedocutanic and prismacutanic B only under a topsoil, an E or the same B (the red structured B only under an orthic A). Under a podzol or pedocutanic B, a layer that is neither rock nor saprolite and loses its B name so is the unconsolidated material, with or without signs of wetness (D2) (Hugo, 2026-11-06)."
  - topic: "A grey eluvial layer is no G"
    page: "K 19, 27, 28"
    reading: "Under an orthic A (where an E may lie), a grey layer with less clay than the orthic A is not a G (D3) (Hugo, 2026-11-06)."
  - topic: "Signs of wetness out of place"
    page: "FC 15; S 33"
    reading: "A grey low-chroma matrix that lies under no horizon naming a wet material (under a soft plinthic B, a prismacutanic B, an alluvium) is not a G or wet material: the layer takes the next name its data give, else none, and its wetness is a family feature (FC 15) (Hugo, 2026-11-06)."
  - topic: "G or prismacutanic at 500 mm exactly"
    page: "K 19; K 27"
    reading: "Under an E, a clay horizon that is both G and prismacutanic is G when the material above it is more than 500 mm thick and prismacutanic when less; exactly 500 mm leaves it undecided between the two (Hugo, 2026-11-06)."
  - topic: "Alluvium, regic sand and man-made deposits on the data"
    page: "S 33; P; K 38"
    reading: "Stratified alluvium: a recorded stratification with a fluvial or colluvial origin, or with no origin recorded (flagged), not with an aeolian one; a fluvial origin with no stratification recorded, soilKey's fluvic_material() standing in, flagged. Regic sand: an aeolian origin, cross bedding or recent_deposit recorded, loamy sand or coarser (silt + 2 x clay under 30 %), virtually structureless; without such a mark a sandy layer stays an apedal B. Man-made soil deposit: anthropic_material or a man-made layer_origin recorded, else artefacts of 20 % or more or the u and ^ letters, flagged (Hugo, 2026-11-06)."
  - topic: "Westleigh and plinthic mottles above (K 33)"
    page: "K 33"
    reading: "Amended (R3): a B1 is a soft plinthic B only with grey colours of its own, or with mottles at least those of the layer below; otherwise it stays the apedal B (or the E), its mottles allowed (Hugo, 2026-11-06)."
  - topic: "A red or yellow B at the surface (K 70 i, K 72 iv, K 73 iii)"
    page: "K 70; K 72; K 73"
    reading: "A surface layer with under 0.3 % organic carbon (surface_b_oc, flagged) that passes the red or yellow-brown apedal or the neocarbonate B and lies directly over hard rock, a lithocutanic B or a dorbank is that B at the surface; the key reads the profile as truncated, an orthic A supplied, flagged (D7) (Hugo, 2026-11-06)."
  - topic: "Any surface horizon is a topsoil"
    page: "G; T"
    reading: "soilKey's convention: a surface layer designated C (not Cr) starts the topsoil and is tested by the topsoil order, so a surface C that is none of the other four topsoils is an orthic A (R9) (Hugo, 2026-11-06)."
  # --- part 4 (0.9.358): the decisions of 2026-11-04 it applies ---------------------
  - topic: "The forms, their order and the longest prefix"
    page: "K 1-3; V 9; K 32"
    reading: "The 73 forms of the AGIS key are keyed, in the order of van Huyssteen (2020), which follows the book's (Q6); Lichtenburg (orthic A, red apedal B, hard plinthic B; V 5.42) is keyed after Bainsvlei and is always provisional, with no family; Tambankulu and Shepstone are not keyed (Q1). A form holds when its sequence is the first of the profile's and the horizon below it would not make another form (the closure lists of key.yaml, written by data-raw/za1991_key.R): Hutton over hard rock is Hutton; only Fernwood is closed on every subsoil horizon (Q3). A sequence no form has gives no form, with the three nearest forms; an orthic A under 100 mm over nothing diagnostic is the land class rock and lithosols (Q2) (Hugo, 2026-11-04)."
  - topic: "The general rules on the profile"
    page: "G; P; K 34, 70, 72, 73"
    reading: "A horizon counts only when its top lies above 1500 mm; one starting between 1500 and 1600 mm is noted (Q7). A recent deposit (recent_deposit, else an aeolian, fluvial, colluvial or transported layer_origin, anthropic_material, or the layers above a horizon marked b, flagged) thinner than 500 mm over a classifiable soil is set aside and the buried soil classified; 500 mm or thicker, the deposit alone is classified; over hard rock or saprolite, the deposit is classified whatever its thickness (R3, R4; Q8). A profile with no topsoil whose first horizon is a red or yellow-brown apedal B, a neocarbonate B, a dorbank or a hard plinthic B is read as truncated, an orthic A supplied, flagged (default 13). A description that stops above 1500 mm leaves the longer forms undecided; a pedocutanic or podzol B reaching 1500 mm has unconsolidated material below it, with or without signs of wetness by its lowest layer, flagged; hard rock directly under a pedocutanic B is Swartland, flagged (Q4) (Hugo, 2026-11-04)."
  # --- part 4 (0.9.358): soilKey's readings, decided by Hugo on the review (2026-11-06)
  - topic: "The match of a sequence"
    page: "K 1-3"
    reading: "The closure is read only on the horizon directly below the form's last one: a horizon foreign to every longer form (an E between an orthic A and a red apedal B) does not let a shorter form hold, since the form's horizons must be the first of the profile's in order. Layers of no diagnostic horizon are skipped everywhere (default 15), the 500 mm rules measuring the depths they span. The match is one pass over the horizons, each undecided horizon stepping with each of its candidates (and none), consecutive undecided layers with the same candidates one horizon (D4) (Hugo, 2026-11-06)."
  - topic: "A topsoil of several layers"
    page: "T"
    reading: "Amended (R5): the topsoil of several layers is a vertic, melanic or humic A (or an organic O) when that horizon covers half or more of the topsoil or its upper 200 mm (topsoil_upper), else the orthic A; with undecided layers the rule is applied to every completion of them (D9) (Hugo, 2026-11-06)."
  - topic: "The 500 mm rules below a horizon"
    page: "K 24-26, 49-51, 53-55, 38, 74, 75"
    reading: "Valsrivier and Sepane need 500 mm or more between the lower limit of the pedocutanic B and the first saprolite or hard rock (or the end of a description reaching 1500 mm); Swartland saprolite or hard rock within 500 mm of it; the podzol forms measure from the lower limit of the uppermost layer of the podzol B (its B1). Swartland, Houwhoek and Groenkop take unconsolidated material between the B and the saprolite (their third horizon may be the unconsolidated material when the saprolite lies within 500 mm; K 55 note ii, K 26 note i, K 51 note i; D1). Witbank, Dundee and Namib need the A and the material more than 500 mm thick when a classifiable soil (a diagnostic horizon other than rock, saprolite or a wet or unconsolidated material, or a horizon marked b) lies below; otherwise any thickness (Hugo, 2026-11-06)."
  - topic: "A deposit under the topsoil"
    page: "G R3; K 38; K 74 note i"
    reading: "When the layer under the surface run is a recent deposit, the topsoil is part of the deposit: the A and the deposit are measured together for the 500 mm of R3 (D8) (Hugo, 2026-11-06)."
  - topic: "A B of red and yellow-brown layers"
    page: "S 32; FC 9"
    reading: "A red over a yellow-brown apedal layer (or the reverse) is two horizons when each is 20 cm or more thick (colour_split_thickness); otherwise one horizon of the colour of the greater thickness, flagged (R6) (Hugo, 2026-11-06)."
  - topic: "A B reaching 1500 mm with a layer below"
    page: "G; Q4"
    reading: "A pedocutanic or podzol B that reaches 1500 mm with a layer described below it: the recorded layer below is read for the material (hard rock, saprolite, or unconsolidated material with or without signs of wetness), flagged; with none described, its lowest layer decides (R7) (Hugo, 2026-11-06)."
  - topic: "Conventions of the profile view"
    page: "G; P"
    reading: "soilKey's conventions (R9): the 1500 mm of R1 is applied before the burial of R3, so a buried soil keeps its depths from the original surface; a description is 'open' (the longer forms undecided) unless it ends on hard rock or reaches 1500 mm (Hugo, 2026-11-06)."
  # --- part 5 (0.9.359): the families; the decisions of 2026-11-04 it applies ------
  - topic: "The families and their codes"
    page: "K 4-77; FC; P"
    reading: "The 404 families of the 73 forms are keyed (families.yaml, written by data-raw/za1991_families.R from the family table of the key pages): the first family of a form whose classes all hold is its family; a criterion undecided for lack of data leaves the families it allows undecided, the result provisional, with the partial code (an x for each undecided digit, Hu1x00, in brackets: soilKey's notation). Codes are the form code and the four printed digits; Lichtenburg has no family (Q1). Every code carries the edition (default 2) (Hugo, 2026-11-04)."
  - topic: "The printing slips of the family table"
    page: "K 44; K 47; K 54-55; K 58; K 63"
    reading: "Plooysburg's families read 1000 and 2000 (the page prints three digits); the class headers printed 1110 in Valsrivier, Swartland, Etosha and Addo, and 2110> in Swartland, read 1100 and 2110 (headers only, the family codes as printed); the Shortlands 3000 families read the luvic criterion on the B1 like the other Shortlands families; the signs of wetness 'in the carbonate horizon' (Etosha, Addo, Brandvlei) are the criterion of FC 15 on the soft carbonate horizon, as Molopo and Kimberly print it; text-layer slips of the B1 ('131', 'Bi') read B1 (plan section 10, slips 1-4, 6, 7) (Hugo, 2026-11-04)."
  - topic: "The B1"
    page: "P; FC 8; FC 10; FC 14; FC 15"
    reading: "The B1 is the upper layer of the first B of the form, as P defines it, whatever its designation (a BA over a Bt1: the BA), with its recorded thickness (Q20; amended R5) (Hugo, 2026-11-06)."
  - topic: "The luvic B1 (FC 10)"
    page: "FC 10"
    reading: "The B1 is compared with the A or E directly above it (its lowest layer): when any layer of the A or E has 15 % clay or less, the B1 needs at least 5 points more clay; otherwise at least 1.3 times as much (Q21) (Hugo, 2026-11-04)."
  - topic: "Calcareous (FC 16)"
    page: "FC 16"
    reading: "Calcareous in some part: effervescence recorded (not none), else CaCO3 1 % or more, flagged; relict nodules in a non-effervescent matrix do not count (hard carbonate nodules with CaCO3 and no effervescence recorded: undecided); neither recorded, not calcareous. The calcareous families read the horizon the key names (the A, the B, the B or upper C, the upper G, within 1500 mm), not a calcareous A alone (plan section 10, slip 11: K over V) (Q22) (Hugo, 2026-11-04)."
  - topic: "Hard lithocutanic B and saprolite (FC 14)"
    page: "FC 14; K 9, 26, 51"
    reading: "Hard: more than 70 % rock in place (bedrock_pct); without it, saprolite_pct or coarse_fragments_pct over 70 % with a rupture resistance of hard or more in the state recorded, flagged; 70 % or less, not hard (Q19) (Hugo, 2026-11-04)."
  - topic: "The colours of the families (FC 4, 6, 9)"
    page: "FC 4; FC 6; FC 9"
    reading: "A bleached A is grey dry as the E is (the WRB albic dry colour, flagged; Q9); a yellow E is yellow moist (Q10); red is a moist hue of 5YR, 2.5YR, 10R or 7.5R over the greater part of the horizon, the dry hue only without a moist one, flagged (Q11); signs of wetness are the low-chroma colours of Q12 in the matrix or on 5 % of the layer (Hugo, 2026-11-04)."
  - topic: "Podzolic character below the yellow-brown apedal B (FC 17)"
    page: "FC 17; V 30"
    reading: "A layer under the yellow-brown apedal B of Constantia is read by soilKey's podzol B test (the WRB spodic standing in, flagged; Q13) as if it lay directly beneath an A or E (Hugo, 2026-11-04)."
  - topic: "The name"
    page: "G; P"
    reading: "The name is the form, the family code and the family name, then the USDA texture class of the A when its clay, silt and sand are recorded (the thickness-weighted mean of its layers), the sand grade before a class with sand only when sand_grade is recorded (Q23): 'Hutton, Hu1200 Kelvin, sandy loam' (Hugo, 2026-11-04)."
  - topic: "The defaults of the families"
    page: "FC 1; FC 7; FC 8; FC 11; FC 12; FC 13; FC 18; V 37"
    reading: "FC 1: fibrous is unrubbed fibre of 2/3 or more, else von Post H1-H4, in layers of 200 mm or more within the O (default 4). FC 8: the exchangeable bases x 100 / clay %, 5 and 15 mesotrophic, soluble salts flagged when the EC is high (default 10). FC 11: blocky alone, undecided (default 11). FC 12: coatings of moist value 2 or less and chroma 1 or less (or N), continuous; continuity not recorded, clay films many, flagged (default 5). FC 7: lamellae not recorded, absent; FC 13: ortstein at least weakly cemented; FC 18: slightly firm is friable (default 12). Positional labels (the upper C, the upper G, the lower B, immediately below the A) are the named layer, whatever its thickness (default 6) (Hugo, 2026-11-04)."
  # --- part 5 (0.9.359): soilKey's readings, confirmed or amended by Hugo on the review (2026-11-06)
  - topic: "A horizon of several layers"
    page: "FC 3-6; FC 9; FC 11"
    reading: "A colour or structure criterion on a horizon of several layers takes the class that covers more than half of its thickness (the red_greater_part of FC 9), in the order of the key; the residual class only when no other class can still reach half. FC 5: with no class over the greater part, dark or red by the larger share, dark on a tie, as it is tested first (R6); other colour only when neither is present. A presence (lamellae, black cutans, ortstein, signs of wetness, carbonates, podzolic character) is read in any layer of the part named (Hugo, 2026-11-06)."
  - topic: "A calcareous B1 has no base status"
    page: "FC 8"
    reading: "A diagnostic eutrophic horizon is not calcareous (FC 8): a calcareous B1 takes none of the three classes, so no family of a form whose families read the base status holds, and no partial code is given (a calcareous apedal B is normally a neocarbonate B, so this is met mostly in the red structured B of Shortlands, whose calcareous families take it). With a cation not recorded, the sum of the others is a lower end: over 15 cmol(+)/kg clay already, eutrophic, flagged; 5 or more already, mesotrophic or eutrophic undecided; less, undecided (Hugo, 2026-11-06)."
  - topic: "A humic A neither thick nor thin"
    page: "FC 2"
    reading: "The organic carbon of the 250-450 mm sample and of the whole A is the thickness-weighted mean of the layers there; a humic A with 1.8 % or less over its whole thickness and not thick takes neither class: no family and no partial code (Hugo, 2026-11-06)."
  - topic: "The yellow E (FC 6)"
    page: "FC 6"
    reading: "A yellow E has a moist hue of 5YR or yellower (FC 6 allows the occasional 5YR) with a moist chroma above the low chroma of Q12; every other E is grey, an E of a redder hue and a higher chroma included, since FC 6 sets apart only the E yellow when moist (R1) (Hugo, 2026-11-06)."
  - topic: "The luvic rule with clay not recorded"
    page: "FC 10"
    reading: "The A and E layers are all those of the topsoil and the E above the B; when the clay of one of them is not recorded and none recorded has 15 % or less, the B1 is decided only if both rules give the same answer (Hugo, 2026-11-06)."
  - topic: "The size of an angular blocky structure (FC 11)"
    page: "FC 11"
    reading: "Subangular blocky of any size is the first class; angular blocky by its size (very fine and fine, the first class; medium, coarse and very coarse, the second); a range of sizes read by its lower end; angular without a size, or a structure that is not blocky, undecided (Hugo, 2026-11-06)."
  - topic: "Black cutans and ortstein not recorded"
    page: "FC 12; FC 13"
    reading: "Coatings whose colour is not recorded are no black cutans, and a podzol B whose cementation is not recorded is not hardened (an observation not recorded is absent); coatings of value 2 or less without their chroma (and not N), undecided (Hugo, 2026-11-06)."
  - topic: "The words of hardness (FC 14)"
    page: "FC 14"
    reading: "The rows of the USDA rupture resistance (D4): hard or more is dry hard or harder (hard, very hard, extremely hard, slightly rigid, rigid, very rigid), moist very firm or firmer (very firm, extremely firm, slightly rigid, rigid, very rigid), or moderately cemented or more (moderately, strongly, very strongly cemented, indurated); softer: loose, soft, slightly hard, moderately hard, very friable, friable, firm, extremely weakly, very weakly or weakly cemented; any other word undecided (Hugo, 2026-11-06)."
  - topic: "Signs of wetness where the family names them (FC 15)"
    page: "FC 15"
    reading: "The layer the family names (the B1, the soft carbonate horizon, the layer immediately beneath the placic pan or the podzol B, the A and the layer under it) is read for signs of wetness whatever horizon the key identified it as: the exclusion of FC 15 is settled by the form key, not again here. Dundee is read from the stratified alluvium down, within 1500 mm, not in the A (a grey A is the bleaching of FC 4) (R2). In the soft carbonate horizon its pale matrix is no sign: only mottles (grey, low-chroma or of iron oxides) on 5 % or more of the layer or a gley hue count, none of these absent, flagged (D3). A layer named but not described leaves the class undecided (Hugo, 2026-11-06)."
  - topic: "A negative class at the end of the description (FC 15, FC 16)"
    page: "FC 15; FC 16"
    reading: "Over the profile within 1500 mm, the A and the layer under it, or a horizon and every layer under it, the absence of signs of wetness or of carbonates is undecided when the description stops above 1500 mm, or when no layer is described under the A (Inhoek); a positive finding still decides (D2) (Hugo, 2026-11-06)."
  - topic: "The B or upper C; Shortlands (FC 16)"
    page: "FC 16; K 47; K 53-55"
    reading: "'B or upper C' is the B and the upper layer of the horizon under it; a C below 1500 mm (supplied by Q4, not described) leaves the B alone. Shortlands: the third class when the B is calcareous in some part; the first two need the whole B non-calcareous (the lower B as printed, and no calcareous part anywhere in the B), so a calcareous middle layer gives Sd3xxx (R3) (Hugo, 2026-11-06)."
  - topic: "Podzolic character with nothing below"
    page: "FC 17"
    reading: "With no layer under the yellow-brown apedal B and a description that reaches 1500 mm (or rock), podzolic character is absent; a description that stops above 1500 mm leaves it undecided (Hugo, 2026-11-06)."
  - topic: "The consistence of the upper C (FC 18)"
    page: "FC 18"
    reading: "consistence_moist, else a rupture_resistance recorded in the moist words (loose to extremely firm), flagged; a C below 1500 mm, not described, undecided. The hardsetting coarse materials of FC 18 are not tested (no attribute records hardsetting) (Hugo, 2026-11-06)."
  - topic: "Rock under the organic O (FC 19)"
    page: "FC 19; K 17 note (ii)"
    reading: "Rock (designated R, or 100 % bedrock) or saprolite whose top lies within 500 mm of the lower limit of the O and above 1500 mm (organic_rock_depth; the numbers of the Champagne page, K 17 note ii); none, unconsolidated material when the description reaches that depth or is complete; otherwise undecided; the lower limit of the O not recorded, undecided (Hugo, 2026-11-06)."
  - topic: "A truncated profile and the families of the A"
    page: "K 34, 70, 72, 73"
    reading: "The orthic A supplied to a truncated profile has no layer: the criteria read on it (bleached, calcareous A) are undecided, the family provisional (Hugo, 2026-11-06)."
  - topic: "The texture in the name and the partial code"
    page: "G; P"
    reading: "The texture class follows the family name after a comma, in lower case (the USDA name: sandy loam, loamy sand ...): 'Hutton, Hu1200 Kelvin, sandy loam'. An undecided family is written with its partial code in one pair of brackets, without the brackets of a form code ('Hutton, [Hux200]', 'Plooysburg, [Pyx000]'); a digit whose classes all fail gives no family and no partial code (Hugo, 2026-11-06)."
  - topic: "The fibrous O (FC 1)"
    page: "FC 1; V 37"
    reading: "Fibrous is one contiguous run of fibrous layers of 200 mm or more within the O; fibrous layers are not summed across a humified one (R4) (Hugo, 2026-11-06)."
  - topic: "A diagnostic horizon of several layers on the data"
    page: "S 31-33; K 47; default 17"
    reading: "A layer under a layer of the same horizon is read as that horizon by the position pass: the red structured B under a red structured B (not only under the orthic A), the placic pan under a placic pan, the lithocutanic B under a lithocutanic B (saprolite there only by its own test, saprolite_rock), as the apedal, pedocutanic, prismacutanic, neocutanic and neocarbonate B, the E and the G already were (the part 3 decision: a B only under a topsoil, an E or the same B) (Hugo, 2026-11-06)."
  - topic: "A red or yellow B at the surface: its thickness (B1)"
    page: "K 70; K 72; K 73; G"
    reading: "Amended (B1): the reading of D7 holds only for a surface layer more than 100 mm thick (surface_b_thick, flagged; the limit of the lithosol rule). A layer of 100 mm or less with little carbon directly over hard rock, a lithocutanic B or a dorbank stays the orthic A, so a thin brown or red topsoil on hard rock is Mispah, as the AfSP surveyors wrote it (Hugo, 2026-11-10)."
  - topic: "Cutans not recorded in a structured B (C1)"
    page: "S 31; K 53-55"
    reading: "When clay films are not recorded, soilKey's argic horizon stands in for the cutans of the pedocutanic B one way only: the layer argic, cutans; the layer not argic, the cutans undecided, not absent, since the pedocutanic B asks for prominent cutans but no clay increase. So a strong blocky B under a melanic A with no clay films recorded leaves Bonheim undecided rather than giving Inhoek. Only the pedocutanic test reads it so; the shared reader of cutans used by other systems is unchanged (Hugo, 2026-11-10)."
  - topic: "The 1977 humic A in the AfSP benchmark (A1)"
    page: "T-humic; P; van Huyssteen (2020)"
    reading: "The key is not changed: the humic A of 1991 is thin or thick. The AfSP benchmark adds a second figure, flagged, beside the main one: for labels from surveys before 1991, soilKey's humic form whose humic A is 450 mm thick or less (humic_thick; the humic A of 1977 had to be thicker) is scored as its orthic counterpart (Inanda as Hutton, Magwa as Clovelly, Kranskop as Griffin, Sweetwater as Oakleaf, Nomanci as Glenrosa). The organic carbon is not corrected for the method (Hugo, 2026-11-10)."
  - topic: "No dry colour and a light moist colour: not melanic (M1)"
    page: "T-melanic (i); default 9"
    reading: "Amended (M1): the melanic A needs a dry value and chroma of 3 or less; the dry value is never darker than the moist, so a layer with no dry value recorded and a moist value over 3 is refused the melanic colour, flagged. With a moist value of 3 or less the colour stays undecided, the moist colour + 1 value evidence only (default 9). The window of the organic O below a description that ends in rock is not changed (O1 not adopted) (Hugo, 2026-11-10)."
