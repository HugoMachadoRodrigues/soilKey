# The readings soilKey makes of the South African soil classification of 1991
# (Soil Classification Working Group, 1991. Soil classification: a taxonomic
# system for South Africa. Memoirs on the Agricultural Natural Resources of
# South Africa No. 15) where the open sources are silent or ambiguous. The
# book itself is not available: soilKey reads the open AGIS key and form
# pages (K), the family criteria (FC), the general rules (G), the topsoil
# pages (T), the preface of the second edition (P), SASRI 1999 (S) and van
# Huyssteen 2020 (V). An entry ending "(Hugo, 2026-11-04)" is a decision of
# the owner, in soilKey's words; an entry ending "(soilKey's reading, for
# Hugo to confirm, <date>)" is soilKey's own and waits for his word. The
# criteria are paraphrased; no text of the sources is shipped.
readings:
  # --- the decisions of 2026-11-04 that this part applies ------------------------
  - topic: "Registry names and declared notations"
    page: "-"
    reading: "The system will be za1991, namespace za, aliases za, sat, sat1991 and south_africa, experimental and opt-in. site$designation_system declares the South African notation with za, za1991, sat, sat1991 or south african; never inferred from the country, since a South African site may be described in the FAO notation. Every stored code and name carries its edition, and a name or code is never resolved between 1977, 1991 and 2018 (defaults 1 and 2) (Hugo, 2026-11-04)."
  - topic: "The notation: diagnostic_za and the designation"
    page: "P; S 30-33"
    reading: "A new horizon attribute diagnostic_za holds the name of the diagnostic horizon or material, the 30 names; the same names written in designation are read too; a name of 1977 is read as its 1991 equivalent, flagged (ferrihumic B is the podzol B). The FAO and USDA letters are hints only (Bt may be a pedocutanic, prismacutanic, red structured or neocutanic B), never the name. The written name gives the horizon, the recorded data its properties (Q5) (Hugo, 2026-11-04)."
  - topic: "The 1977 names"
    page: "P"
    reading: "As the preface of the second edition gives them: the ferrihumic B is the podzol B; the gleycutanic B is the G horizon (the Kroonstad form) or the unspecified material with signs of wetness (the Pinedene form); the calcareous red or yellow-brown apedal B and the calcareous neocutanic B are the neocarbonate B. Each is flagged '1977 name' (Q5) (Hugo, 2026-11-04)."
  - topic: "The new attributes"
    page: "-"
    reading: "diagnostic_za, plasticity_index, liquid_limit_method (the Casagrande cup when not recorded, flagged), bedrock_pct, coatings_hue_moist, coatings_chroma_moist, coatings_continuity, recent_deposit, cross_bedding and sand_grade on the horizons, and reference_za_form, reference_za_family, reference_za_raw and reference_za_edition on the site (benchmarks only, never read to classify). stone_line and stripped_grains are not added: a recorded stone line is evidence, the stripped grains are uncoated_grains_pct (default 21; Q8, Q17, Q19, Q23) (Hugo, 2026-11-04)."
  # --- the readings of this part, decided on its review (2026-11-04) ---------------
  - topic: "The short forms"
    page: "-"
    reading: "No open source prints abbreviations of the 1991 horizons (S abbreviates only the forms), and none of the 659 South African AfSP profiles writes a diagnostic name in its layers, so soilKey's two-letter short forms (ot, re, ye, sp, hp, ne, pd, pr, li, gh, do) are not read until they are checked on a survey sheet. The full names and soilKey's tokens (OA, RAB, SPL ...) are read in diagnostic_za, and E and G alone keep their meaning there, never inside a designation (reading 1, amended: the short forms dropped) (Hugo, 2026-11-04)."
  - topic: "Recognising the notation in the designations"
    page: "-"
    reading: "Without a declaration, a profile's designations are read as South African names when the profile records a name in diagnostic_za (a word that names nothing does not count) or when one designation holds a name only this system writes (the topsoil names, red apedal, yellow-brown apedal, red structured, neocutanic, neocarbonate, pedocutanic, prismacutanic, lithocutanic, podzol B, soft or hard plinthic, the carbonate horizons, dorbank, regic sand, man-made soil deposit, the materials with or without signs of wetness, and the 1977 ferrihumic and gleycutanic B). The names other writings share (E horizon, G horizon, placic pan, saprolite, hard rock, stratified alluvium; humic, vertic, melanic; calcrete, ferricrete, ouklip, hard plinthite, silcrete) are read only in a profile declared or recognised so: a Cr (saprolite) of a USDA description is not a South African name. A site that declares another notation has none of its designations read as names, and gives no FAO hints unless that notation writes the FAO or USDA letters; diagnostic_za is read whatever the site declares (reading 2) (Hugo, 2026-11-04)."
  - topic: "The gleycutanic B by position"
    page: "P"
    reading: "A gleycutanic B is the G horizon under a topsoil horizon or an E, and the unspecified material with signs of wetness under a red or yellow-brown apedal, neocutanic or neocarbonate B, read on the nearest layer above it that holds a diagnostic horizon (only the layers that hold none are skipped). When that layer is undecided or not read, its candidates, else the hints of its FAO letters, decide when they all lead to one of the two (red or yellow-brown apedal B: the unspecified material; a Bw: the same); anywhere else, or with nothing above, it stays undecided between the two (reading 3, amended after the review) (Hugo, 2026-11-04)."
  - topic: "Other words for the hard and carbonate horizons"
    page: "S 31; P"
    reading: "Read by their adjective: calcrete alone is undecided between the soft carbonate horizon and the hardpan carbonate horizon; hardpan calcrete is the hardpan carbonate horizon; powder (powdery) or nodular calcrete the soft carbonate horizon; ouklip, ferricrete, hardpan ferricrete and hard plinthite the hard plinthic B; nodular ferricrete undecided between the soft and the hard plinthic B; silcrete hard rock (P, Mispah). Ironpan and laterite are left out, as other systems use them otherwise. Each is read with a note and none recognises a profile by itself (reading 4, amended) (Hugo, 2026-11-04)."
  - topic: "Names in Afrikaans"
    page: "-"
    reading: "The 1991 system was also published in Afrikaans and many descriptions are written in it (ortiese A, rooi apedale B ...). No open source gives the Afrikaans names, so soilKey reads the English names only; a name that looks Afrikaans is left unread with a note that says so (reading 5) (Hugo, 2026-11-04)."
  - topic: "No diagnostic horizon, negations, doubt and two names"
    page: "S 31; K 1-3"
    reading: "In diagnostic_za, none, no diagnostic, no subsoil (the key's words), none with a remark (none (lithosol)) and a name marked non-diagnostic or not diagnostic, before or after it (non-diagnostic saprolite, saprolite (non-diagnostic); S 31 speaks of non-diagnostic saprolite), record a layer that holds no diagnostic horizon; NA, nd, '-' and '?' record nothing. A name negated by not, no, non, without, absent or none elsewhere in the text (not red apedal B, E horizon absent; but the name unconsolidated material without signs of wetness is read) is not read, with a note. A name written with doubt (?, possibly, probably, perhaps, maybe) stays a candidate, the token undecided, with a note. Two names in one field (red apedal B / soft plinthic B, '... or ...') leave the layer undecided between them; a name inside other words (B1 red apedal, B2 soft carbonate) is read, with a note, and 'calcareous' written after a name (red apedal B, calcareous) keeps the name, with a note that a calcareous apedal or neocutanic B is the neocarbonate B (reading 6, with the fixes of the review) (Hugo, 2026-11-04)."
  - topic: "The name against the master letter"
    page: "P"
    reading: "When a name, from diagnostic_za or from the designation itself, is a topsoil horizon on a layer designated E, B, C, R or G, or a subsoil horizon on one designated A, O or H, the name is kept and the disagreement noted (Bss vertic); the designation never changes the name (reading 7) (Hugo, 2026-11-04)."
  - topic: "The hints of the FAO letters"
    page: "-"
    reading: "Besides the letters of the plan: A gives the four mineral topsoils; Bkm and Ckm only the hardpan carbonate horizon (cemented), Ck the two carbonate horizons; Bc the soft and the hard plinthic B; Cqm the dorbank; Cu and ^C the man-made soil deposit; Cr the saprolite, the two wet materials, the G horizon and the lithocutanic B (Cr is weathered rock in the USDA notation and a strongly reduced C in the FAO's); Br the G horizon and the wet materials. A suffix is one of the FAO or USDA letters, ss (slickensides, no hint) or ^; at most three suffixes and two digits in a run, so a word (Bleached, Clay, Rock, Calcareous, Hutton, Hu1200) gives no hint. A B, C or transition with no suffix gives no hint beyond its master (B alone none). A master letter alone in diagnostic_za is a hint, never the name, except E and G (reading 8, amended: R2) (Hugo, 2026-11-04)."
  - topic: "The declared values"
    page: "-"
    reading: "designation_system is compared once lower-cased with spaces and punctuation dropped: za, za1991, sat and sat1991, and any value starting with south africa (South Africa, south_africa, South African, South African 1991) declare the notation. SA and RSA name the country, not a notation: they neither declare it nor count as another notation, so the distinctive names in the designations are still read (reading 9, amended) (Hugo, 2026-11-04)."
  # --- part 2 (0.9.356): the decisions of 2026-11-04 it applies -------------------
  - topic: "The colours of the subsoil horizons"
    page: "FC 4, 5, 6, 9, 15; S 32-33; V 19-20"
    reading: "Grey: the dry colour of the WRB albic material (value 7 or more and chroma 3 or less, or value 5 or more and chroma 2 or less), the moist colour not required; dry colour not recorded, undecided (Q9). Yellow-brown: the moist hue 7.5YR or yellower, the moist chroma above the low-chroma limit and the dry colour not grey (Q10). Red: the moist hue 5YR, 2.5YR, 10R or 7.5R, the dry hue only when no moist one is recorded, flagged; a colour yellow dry and red moist is red (Q11). Low chroma: a moist matrix chroma of 2 or less or a gley hue (N, GY, G, BG, B, PB); signs of wetness: those colours in the matrix or on 5 % or more of the layer as mottles (Q12). The numbers stand in for the book's charts, in thresholds.yaml, flagged (Hugo, 2026-11-04)."
  - topic: "Vertic against melanic, the organic O, the clay change, calcareous"
    page: "T-vertic; T-melanic; T-organic; S 32; FC 16"
    reading: "Slickensides common or more make the vertic A; few or none and no plasticity index, the melanic A if its other tests pass, flagged (Q17); the liquid limit by the Casagrande cup when its method is not recorded, flagged (default 18). The organic O is saturated when water_saturation_days says so (30 days, the WRB histic horizon standing in), else by its evidence (the site drained, a water table in the layer or the next one, signs of wetness below), flagged; nothing of it, undecided (Q18). The prismacutanic B compares its upper layer (the B1, Q20) with the layer directly above; 20 % clay exactly above by the +20 rule (Q21). Calcareous: effervescence recorded, else CaCO3 1 % or more, flagged (Q22) (Hugo, 2026-11-04)."
  - topic: "The topsoil defaults"
    page: "T"
    reading: "Topsoil tests in the order organic O, vertic, melanic, humic, orthic, the humic A tested a second time on the first subsoil and falling to orthic when that fails (default 7); stripped grains are uncoated_grains_pct of 25 % or more, not recorded absent (default 8); a melanic A with no dry colour is undecided, the moist colour + 1 value only as evidence (default 9); exchangeable cations, flagged when the EC is high (default 10); the CEC under 11 cmol(+)/kg soil by ammonium acetate only in the borderline apedal case, another method flagged (default 16) (Hugo, 2026-11-04)."
  # --- part 2 (0.9.356): soilKey's readings, decided by Hugo on the review (2026-11-05)
  - topic: "Structure not recorded"
    page: "V 21; S 31-32"
    reading: "A layer with no structure recorded is undecided between the apedal and the structured B horizons, not apedal: the structure is always there in some grade, so the rule that an observation not recorded is absent is not applied to it (Hugo, 2026-11-05)."
  - topic: "Weak structure: apedal or neocutanic"
    page: "V 21; S 32"
    reading: "A uniform layer with a weak structure is an apedal B (V 21: weaker than moderate blocky or prismatic) when it is red or yellow-brown; the neocutanic B needs variegated colours or cutans (clay films few or more), or a uniform weak structure in a colour that is neither red nor yellow-brown nor grey (the uniform dark brown of S 32; amended on the review, D8). 'Borderline' is a grade written weak to moderate: a CEC under 11 cmol(+)/kg soil makes it apedal, 11 or more moderate, flagged, not recorded undecided (amended, D7) (Hugo, 2026-11-05)."
  - topic: "Hues redder than 7.5R"
    page: "FC 9"
    reading: "FC 9 lists 5YR, 2.5YR, 10R and 7.5R; a hue redder still (5R, 2.5R, the RP hues) is read as red too, flagged (red_redder_hues in thresholds.yaml) (Hugo, 2026-11-05)."
  - topic: "Red structured against red pedocutanic B"
    page: "S 31; P"
    reading: "A red, moderate or strong blocky B is pedocutanic when its cutans differ in colour from the red matrix (variegated colours not all red, or coatings of another hue or value) or when the transition from the material above is abrupt; uniformly red with a transition recorded clear, gradual or diffuse it is the red structured B; the transition not recorded leaves both undecided, by one shared reading (amended, D2: a humic A over such a B stays a candidate, not orthic). The transition is that of the nearest layer above that is not part of the same B. A non-red blocky B with prominent cutans (clay films common or more; not recorded, soilKey's argic() stands in, flagged) is pedocutanic (Hugo, 2026-11-05)."
  - topic: "The prismacutanic transition and dark cutans"
    page: "S 32"
    reading: "The very abrupt change: a transition recorded clear, gradual or diffuse fails it (abrupt, very abrupt, sharp, a and smooth abrupt are abrupt; another word undecided); not recorded, the change of clay of S 32 is read as that change. The material above is the layer above the whole B: a blocky B1 over a columnar B2 is one B, its B1 compared with the A or E (amended). A wet prismacutanic B needs uniformly dark cutans, read as a moist coatings value of 3 or less (prismacutanic_dark_cutans, flagged); not the black of family criterion 12 (value 2 or less, chroma 1 or less) (Hugo, 2026-11-05)."
  - topic: "The lithocutanic B on the data"
    page: "S 31; K 31, 72"
    reading: "Weathering rock in place in a layer that still holds soil: bedrock_pct (else saprolite_pct) of 10 % or more and under 100 % (lithocutanic_rock, flagged), or a designation of a B with weathering rock (BCr, B/R); a BC or CB with no rock recorded is undecided; no rock recorded otherwise, not lithocutanic. Not dominated by carbonate (a calcrete pan or soilKey's calcic()). Cutans on the rock and soil tongues are noted, not required (K 31) (Hugo, 2026-11-05)."
  - topic: "The humic A position before the next part"
    page: "T-humic (iv)"
    reading: "Until the next part identifies every horizon, T-humic (iv) reads the layer directly below the topsoil: a name written for it decides; else the red structured and prismacutanic B and the signs of wetness by the tests of this part, the E by its grey dry colour unless its designation names another horizon, the podzol B by a Bh or Bs designation or soilKey's spodic(), the hard plinthic B and the placic pan by their designation or an indurated layer with plinthite or ferric nodules, the soft plinthic B by more than 10 % mottles. Nothing recorded below the topsoil: (iv) holds (Hugo, 2026-11-05)."
  - topic: "The topsoil layers"
    page: "T"
    reading: "The topsoil tests run on the surface run: the first layer by depth and the layers that continue it, named topsoil in diagnostic_za or the designation, else designated A, O or H (not a transition such as AB); a first layer named or designated a subsoil starts none (a truncated profile). AP and AH written in capitals are A layers. Each layer is tested; 'in some part' (humic (i), over 1.8 % OC) is read over the mineral A layers of the run, a litter O on top not counting (amended) (Hugo, 2026-11-05)."
  - topic: "The organic O on the data"
    page: "T-organic (i)"
    reading: "The 10 % organic carbon is averaged over the 200 mm from the top of the layer, through the layers below it; a layer of rock (R) counts 0 %, a part not recorded at most 58 %, or at most the nearest carbon recorded above it when it is designated B, C, E or G or lies under a layer with under 10 %, flagged (amended, D3), so the average is decided when its bounds agree and undecided otherwise. Signs of wetness count as evidence of the saturation of an organic O only in a layer that starts within 50 cm below it (organic_o_wetness_cm, flagged; amended) (Hugo, 2026-11-05)."
  - topic: "Undecided observations"
    page: "T-vertic; FC 15"
    reading: "Slickensides recorded only as present (TRUE) leave the vertic and melanic A undecided unless the plasticity index passes the vertic limit (amended, D1); slickensides in a transitional layer below (AB, AC, BA) count as 'in the transition'. Redoximorphic features of 5 % or more with no mottle colours recorded leave the signs of wetness undecided. A melanic A whose rupture resistance is not recorded is not hard (T-melanic (vi)); with no dry hue its moist hue stands in, flagged, and 10.0YR is 10YR. Effervescence none, nil, 0, '-' or non-effervescent is not calcareous, a degree of it calcareous, another word undecided (amended, D9); CaCO3 read with hard carbonate nodules recorded is undecided, as they may be relict nodules in a non-calcareous matrix (FC 16). With a base not recorded the sum of the others is a lower bound (it decides the melanic A when it reaches 4 per 1 % OC); with no base recorded, the base saturation times the CEC, flagged (Hugo, 2026-11-05)."
  # --- part 2 (0.9.356): Hugo's decisions on the review (2026-11-05) ---------------
  - topic: "Low chroma and the gley hues"
    page: "FC 5; FC 15; S 33"
    reading: "Outside the gley hues a moist chroma of 2 or less is grey only at a moist value of 4 or more (low_chroma_value): the dark colours of FC 5 (10YR 3/2 of a melanic A or a dark pedocutanic B) are not signs of wetness. The hue 10Y is a gley hue, with N, GY, G, BG, B and PB; a family written alone (GY) is read as the family. low_chroma and gley_hues are soilKey's reading of Q12, not WRB numbers, flagged (D4) (Hugo, 2026-11-05)."
  - topic: "Red is not grey"
    page: "FC 9; S 32"
    reading: "A red hue makes a red colour only when the colour is not a grey low-chroma one: 5YR 6/1 is not red; a dark red 2.5YR 3/2 is (D5) (Hugo, 2026-11-05)."
  - topic: "Grey dry with no dry colour"
    page: "S 32-33"
    reading: "With the dry colour not recorded, a moist chroma of 4 or more is read as not grey dry (grey_dry_moist_chroma), flagged; under 4, the grey dry colour is undecided (Hugo, 2026-11-05)."
  - topic: "No B horizon on rock"
    page: "S 31"
    reading: "No B horizon is tested on a layer of rock (designation R, or bedrock_pct of 100): every B test is FALSE there (D6) (Hugo, 2026-11-05)."
  - topic: "The A2 of the older notation"
    page: "P"
    reading: "An A2 under an A1 (the older notation) is a candidate E, flagged (a2_old_notation): it continues the topsoil only when it is not grey dry; grey dry or undecided, it leaves the topsoil and the next part tests it as an E (Hugo, 2026-11-05)."
  - topic: "A calcareous stratified layer"
    page: "S 32; K 38, 74, 75"
    reading: "Q6 confirmed: a calcareous stratified alluvium, regic sand or man-made deposit stays the material; the neocarbonate B is an unstratified B (no stratification, no cross bedding) (Hugo, 2026-11-05)."
