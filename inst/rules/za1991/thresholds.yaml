# Every number the identification of the South African horizons on the data
# reads (R/diagnostics-za-horizons.R), in one file: the South African soil
# classification of 1991 (Soil Classification Working Group, 1991. Soil
# classification: a taxonomic system for South Africa. Memoirs on the
# Agricultural Natural Resources of South Africa No. 15).
#
# The book itself is not available. Where an open source gives the number it
# is cited (T = the topsoil pages, S = SASRI 1999 printed page, V = van
# Huyssteen 2020 printed page, FC = family criterion, K = AGIS page, P = the
# preface of the second edition, G = the general rules). Where none does,
# soilKey stands in with a WRB 2022 number or a reading of its own, and the
# entry says stand_in: true; every test that reads such an entry flags its
# answer ("stand_in:<name>" in the trace). When the book's numbers are
# supplied, only this file changes: replace the value, cite the page, set
# stand_in: false, and the flags drop without a change to the code.
#
# Fields:
#   value     the number, or the list of values
#   op        how the test compares (">=", ">", "<=", "<")
#   unit      the unit, or what the number counts
#   basis     the colour state or the method the number is read in
#   source    the page tags, or wrb_standin / soilkey
#   decision  Hugo's decision behind it, when there is one
#   stand_in  true when the number is not the book's (flagged in the trace)
#   note      soilKey's words on how it is read

edition_id: za1991

thresholds:
  # --- general rules (G; read by later parts) ----------------------------------
  diagnostic_depth:
    value: 1500
    unit: "mm, the top of a horizon above it"
    source: "G; P"
    decision: "Q7"
    stand_in: false
  burial_deposit:
    value: 500
    unit: "mm of a recent deposit over a classifiable buried soil"
    source: "G"
    decision: "Q8"
    stand_in: false
  lithosol_topsoil:
    value: 100
    op: "<"
    unit: "mm, an orthic A thinner than this over nothing diagnostic: the land class rock and lithosols, not a form"
    source: "G"
    decision: "Q2"
    stand_in: false

  # --- the topsoil horizons (T) ---------------------------------------------------
  organic_o_oc:
    value: 10
    op: ">="
    unit: "% organic carbon, thickness-weighted over organic_o_depth from the top of the layer"
    source: "T-organic (i); S 30"
    stand_in: false
  organic_o_depth:
    value: 200
    unit: "mm, the vertical distance of the average"
    source: "T-organic (i)"
    stand_in: false
  organic_o_saturation_days:
    value: 30
    op: ">="
    unit: "days saturated with water in most years (water_saturation_days)"
    source: "wrb_standin"
    decision: "Q18"
    stand_in: true
    note: "T-organic (ii) says 'for long periods' with no number; the WRB 2022 histic horizon (saturated 30 consecutive days or more, the folic horizon less) stands in. Not recorded, the saturation is read from its evidence (Q18): the site artificially drained, a water table in the layer or the next one, or signs of wetness below; nothing of it, undecided."
  organic_o_wetness_cm:
    value: 50
    op: "<"
    unit: "cm below the lower boundary of the O: signs of wetness in a layer starting within it are evidence of saturation"
    source: "soilkey"
    decision: "Q18 (Hugo, 2026-11-05)"
    stand_in: true
  humic_oc:
    value: 1.8
    op: ">"
    unit: "% organic carbon, in some part of the topsoil"
    source: "T-humic (i)"
    stand_in: false
  base_ratio:
    value: 4
    unit: "cmol(+) exchangeable Ca + Mg + K + Na per kg clay, for each 1 % organic carbon"
    source: "T-humic (ii); T-melanic (iv)"
    stand_in: false
    note: "Humic A under the value, melanic A at or over it: the two never both hold. Exchangeable cations; with ec_high, flagged (default 10)."
  ec_high:
    value: 4
    op: ">="
    unit: "dS/m (ec_dS_m), saline enough that soluble cations may inflate the bases"
    source: "soilkey"
    decision: "default 10"
    stand_in: true
  uncoated_grains:
    value: 25
    op: ">="
    unit: "% of sand and silt grains with no coating (uncoated_grains_pct)"
    source: "soilkey"
    decision: "default 8"
    stand_in: true
    note: "T-humic (iii), evidence of stripped sesquioxide coatings, has no number; soilKey's threshold for stripped grains stands in. Not recorded, absent."
  vertic_structure_grade:
    value: strong
    unit: "structure_grade"
    source: "T-vertic (i)"
    stand_in: false
  vertic_slickensides:
    value: common
    op: ">="
    unit: "slickensides amount (absent < few < common < many)"
    source: "T-vertic (ii); V 17"
    decision: "Q17"
    stand_in: false
    note: "'Clearly visible, regularly occurring slickensides' read as common or more (Q17). Without the plasticity index the slickensides decide vertic against melanic, flagged."
  plasticity_index_cup:
    value: 32
    op: ">"
    unit: "plasticity index, liquid limit by the South African Casagrande cup"
    source: "T-vertic (ii); T-melanic (iii)"
    stand_in: false
  plasticity_index_cone:
    value: 36
    op: ">"
    unit: "plasticity index, liquid limit by the British Standard cone"
    source: "T-vertic (ii); T-melanic (iii)"
    stand_in: false
  melanic_dry_value:
    value: 3
    op: "<="
    basis: dry
    unit: "Munsell value"
    source: "T-melanic (i)"
    stand_in: false
  melanic_dry_chroma:
    value: 3
    op: "<="
    basis: dry
    unit: "Munsell chroma"
    source: "T-melanic (i)"
    stand_in: false
  melanic_excluded_colour:
    value: "10YR 3/3"
    basis: dry
    source: "T-melanic (i)"
    stand_in: false
  melanic_excluded_hue:
    value: "5YR"
    op: "<="
    unit: "hues of 5YR or redder are not melanic"
    basis: dry
    source: "T-melanic (i)"
    stand_in: false

  # --- the colours (Q9-Q12) -------------------------------------------------------
  red_hues:
    value: ["5YR", "2.5YR", "10R", "7.5R"]
    basis: moist
    unit: "Munsell hue of the matrix"
    source: "FC 5; FC 9; S 32"
    decision: "Q11"
    stand_in: false
    note: "Moist hue; the dry hue only when no moist one is recorded, flagged. A colour yellow dry and red moist is red (S 32)."
  red_redder_hues:
    value: true
    unit: "hues redder than the listed ones (5R, 2.5R, the RP hues) read as red"
    source: "soilkey"
    stand_in: true
  red_greater_part:
    value: 50
    op: ">"
    unit: "% of the thickness of the horizon"
    source: "FC 9"
    decision: "Q11"
    stand_in: false
    note: "Read by the part that merges the layers of one horizon; each layer is read by its matrix hue."
  grey_dry:
    value:
      - {value_min: 7, chroma_max: 3}
      - {value_min: 5, chroma_max: 2}
    basis: dry
    unit: "Munsell value and chroma, dry (either pair)"
    source: "wrb_standin"
    decision: "Q9"
    stand_in: true
    note: "The dry part of the WRB 2022 albic material as soilKey tests it, without its moist colour (a yellow E is yellow moist). Read for the E, the bleached orthic A (FC 4), the grey E (FC 6) and the yellow-brown apedal B (not grey dry). Dry colour not recorded: undecided."
  grey_dry_moist_chroma:
    value: 4
    op: ">="
    basis: moist
    unit: "Munsell chroma, moist: with the dry colour not recorded, this moist chroma or more is not grey dry"
    source: "soilkey"
    decision: "Hugo, 2026-11-05"
    stand_in: true
  yellow_brown_hue:
    value: "7.5YR"
    op: ">="
    basis: moist
    unit: "Munsell hue of the matrix, 7.5YR or yellower (YR and Y hues)"
    source: "soilkey"
    decision: "Q10"
    stand_in: true
    note: "No open source gives the chart (K 4-5 give only 10YR 3/4 moist, 10YR 4/4 dry). Yellow-brown: this hue or yellower, the moist chroma above low_chroma, and not grey dry (Q9)."
  low_chroma:
    value: 2
    op: "<="
    basis: moist
    unit: "Munsell chroma of the dominant matrix (outside the gley hues, at a moist value of low_chroma_value or more)"
    source: "soilkey"
    decision: "Q12 (soilKey's reading, Hugo, 2026-11-04)"
    stand_in: true
  low_chroma_value:
    value: 4
    op: ">="
    basis: moist
    unit: "Munsell value: a chroma of 2 or less is grey only at this value or more (the dark colours of FC 5 are not grey)"
    source: "soilkey"
    decision: "D4 (Hugo, 2026-11-05)"
    stand_in: true
  gley_hues:
    value: ["N", "GY", "G", "BG", "B", "PB", "10Y"]
    basis: moist
    unit: "Munsell hue families (and the hue 10Y) of a reduced matrix: low chroma whatever the chroma"
    source: "soilkey"
    decision: "Q12; 10Y added (Hugo, 2026-11-05)"
    stand_in: true
  wetness_signs:
    value: 5
    op: ">="
    unit: "% of the layer in the grey low-chroma colours (matrix or mottles)"
    source: "soilkey"
    decision: "Q12"
    stand_in: true
    note: "Signs of wetness: a low-chroma matrix, or low-chroma mottles on 5 % or more of the layer (redoximorphic_features_pct), the redoximorphic threshold soilKey already uses."

  # --- the apedal and structured B horizons (S 31-32; V 21-29) -------------------
  apedal_max_grade:
    value: weak
    unit: "structure grade, moist: weaker than moderate blocky or prismatic"
    source: "V 21; S 32"
    stand_in: false
  apedal_cec:
    value: 11
    op: "<"
    unit: "cmol(+)/kg soil"
    basis: "NH4OAc pH 7 (cec_method acetate_ph7)"
    source: "V 21; P"
    decision: "default 16"
    stand_in: false
    note: "Only when the structure is borderline (weak to moderate). A CEC by another method stands in, flagged; not recorded, read as by ammonium acetate, with a note."
  plinthic_mottles:
    value: 10
    op: ">"
    unit: "% by volume of mottles and concretions (redoximorphic features; plinthite plus ferric nodules)"
    source: "S 33; V 25"
    stand_in: false
    note: "More than this makes the soft plinthic B; the apedal B horizons hold this much or less (S 32)."
  calcareous_caco3:
    value: 1
    op: ">="
    unit: "% CaCO3, when no effervescence is recorded"
    source: "soilkey"
    decision: "Q22"
    stand_in: true
    note: "Calcareous: effervescence recorded (effervescence_class not none, read as with cold 10 % HCl), else caco3_pct at or over this, flagged; neither recorded, not calcareous (an observation not recorded is absent)."
  prismacutanic_clay:
    value:
      low: {above_lt: 20, factor: 2}
      high: {above_ge: 20, plus: 20}
    unit: "% clay of the B against the A or E directly above"
    source: "S 32"
    decision: "Q21"
    stand_in: false
    note: "Under 20 % clay above, the B at least twice as much; 20 % or more above, at least 20 points more (20 % exactly by the second rule: 40 % in both, Q21)."
  prismacutanic_dark_cutans:
    value: 3
    op: "<="
    basis: moist
    unit: "Munsell value of the coatings (coatings_value_moist) of a wet prismacutanic B"
    source: "soilkey"
    stand_in: true
    note: "S 32: with signs of wetness the clayskins are uniformly dark; no number."
  red_structured_clay:
    value: 35
    op: ">"
    unit: "% clay, 'usually' (descriptive, evidence only, never a test)"
    source: "S 31"
    stand_in: false
  lithocutanic_rock:
    value: 10
    op: ">="
    unit: "% by volume of weathering rock in place (bedrock_pct, else saprolite_pct) in a layer that still holds soil"
    source: "soilkey"
    stand_in: true
    note: "S 31: the lithocutanic B merges into weathering rock, soil penetrating it in tongues; no number. Under 100 %: a layer of rock alone is not a B."

  # --- part 3 (0.9.357): the other seventeen horizons and materials -------------
  e_light_topsoil:
    value: 350
    op: ">="
    unit: "mm, the depth from which a grey (dry) layer of the topsoil is read as an E"
    source: "S 33"
    stand_in: false
    note: "S 33: a light grey topsoil deeper than 350 mm that cannot be told from what lies below has an E. A layer of the surface run starting at 350 mm or deeper that is grey when dry is tested as a subsoil layer (an E), with a note."
  g_or_prismacutanic:
    value: 500
    unit: "mm of coarser material above a clay horizon under an E that is both G and prismacutanic"
    source: "K 19; K 27"
    stand_in: false
    note: "More than this, the G horizon (Kroonstad); less, the prismacutanic B (Estcourt); exactly 500 mm undecided (soilKey's reading)."
  podzol_ph:
    value: 5.9
    op: "<="
    unit: "pH(H2O) of a podzol B"
    source: "wrb_standin"
    decision: "Q13"
    stand_in: true
    note: "The spodic horizon as soilKey's spodic() tests it stands in for the podzol B, of which no open source gives a definition (P names it the ferrihumic B of 1977)."
  podzol_alfe:
    value: 0.5
    op: ">="
    unit: "% Alox + 1/2 Feox (acid ammonium oxalate)"
    source: "wrb_standin"
    decision: "Q13"
    stand_in: true
  podzol_oc:
    value: 0.5
    op: ">="
    unit: "% organic carbon, on the morphological route (no oxalate data)"
    source: "wrb_standin"
    decision: "Q13"
    stand_in: true
  podzol_thickness:
    value: 2.5
    op: ">="
    unit: "cm"
    source: "wrb_standin"
    decision: "Q13"
    stand_in: true
  podzol_colour:
    value: {hue_max: "7.5YR", value_max: 5, chroma_max: 4, dark_value_max: 3, dark_chroma_max: 2}
    basis: moist
    unit: "illuvial colours of the morphological route: hue 7.5YR or redder with value and chroma at most value_max, chroma_max; or any hue with value and chroma at most dark_value_max, dark_chroma_max"
    source: "wrb_standin"
    decision: "Q13"
    stand_in: true
  placic_min_thickness:
    value: 0.1
    op: ">="
    unit: "cm"
    source: "wrb_standin"
    decision: "Q14"
    stand_in: true
  placic_max_thickness:
    value: 2.5
    op: "<"
    unit: "cm (a placic pan is thinner; a cemented iron layer this thick or more is a hard plinthic B)"
    source: "wrb_standin"
    decision: "Q14"
    stand_in: true
  hard_plinthic_cementation:
    value: strongly
    op: ">="
    unit: "cementation_class: cannot be cut with a spade when wet (S 31), read as strongly cemented or indurated; a soft plinthic B is less cemented"
    source: "soilkey"
    stand_in: true
  hardpan_carbonate_cementation:
    value: moderately
    op: ">="
    unit: "cementation_class of the hardpan carbonate horizon (the WRB petrocalcic horizon)"
    source: "wrb_standin"
    decision: "Q16"
    stand_in: true
  hardpan_carbonate_thickness:
    value: 10
    op: ">="
    unit: "cm"
    source: "wrb_standin"
    decision: "Q16"
    stand_in: true
  carbonate_caco3:
    value: 15
    op: ">="
    unit: "% CaCO3 equivalent of a carbonate horizon (the WRB calcic horizon)"
    source: "wrb_standin"
    decision: "Q16"
    stand_in: true
  soft_carbonate_secondary:
    value: 5
    op: ">="
    unit: "% by volume of secondary carbonates (secondary_carbonates_pct, carbonate_soft_pct or carbonate_hard_pct)"
    source: "wrb_standin"
    decision: "Q16"
    stand_in: true
    note: "Not recorded: absent (an observation), so a layer with only a laboratory CaCO3 is not a soft carbonate horizon (soilKey's reading, for Hugo to confirm, 2026-11-05)."
  soft_carbonate_thickness:
    value: 15
    op: ">="
    unit: "cm"
    source: "wrb_standin"
    decision: "Q16"
    stand_in: true
  dorbank_cementation:
    value: moderately
    op: ">="
    unit: "cementation_class of the dorbank (the WRB petroduric horizon)"
    source: "wrb_standin"
    decision: "Q15"
    stand_in: true
  dorbank_thickness:
    value: 10
    op: ">="
    unit: "cm"
    source: "wrb_standin"
    decision: "Q15"
    stand_in: true
  dorbank_duripan:
    value: 10
    op: ">="
    unit: "% by volume of duripan material (duripan_pct): the cementing agent read as silica"
    source: "wrb_standin"
    decision: "Q15"
    stand_in: true
  saprolite_rock:
    value: 50
    op: ">="
    unit: "% by volume of weathering rock in place (saprolite_pct, else bedrock_pct) of a saprolite"
    source: "soilkey"
    stand_in: true
    note: "S 31 gives no number; the greater part of the layer (soilKey's reading, for Hugo to confirm, 2026-11-05). weathering_stage, when recorded, decides first."
  regic_sand_texture:
    value: 30
    op: "<"
    unit: "% silt + 2 x % clay: loamy sand or coarser (the USDA limit of the loamy sand)"
    source: "wrb_standin"
    stand_in: true
    note: "'Little silt or clay' (S 33) has no number; the Arenosol texture (loamy sand or coarser) stands in (V 30)."
  man_made_artefacts:
    value: 20
    op: ">="
    unit: "% by volume of artefacts (artefacts_pct or technic_hardmaterial_pct)"
    source: "wrb_standin"
    stand_in: true
    note: "With no anthropic_material or layer_origin recorded, artefacts of 20 % or more (the WRB Technosols) make the man-made soil deposit, flagged."
  e_clay_above:
    value: 2
    op: "<="
    unit: "percentage points of clay an E may hold over the layer above it (else it needs less clay than the layer below)"
    source: "soilkey"
    decision: "R2 (Hugo, 2026-11-06)"
    stand_in: true
  g_sign_value:
    value: 5
    op: ">="
    basis: moist
    unit: "Munsell value: with a grey matrix that is also a pedocutanic B, this moist value or more (or a gley hue, or low-chroma mottles on wetness_signs) makes the G"
    source: "soilkey"
    decision: "R1 (Hugo, 2026-11-06)"
    stand_in: true
  surface_b_oc:
    value: 0.3
    op: "<"
    unit: "% organic carbon of a surface layer read as a B at the surface (an apedal or neocarbonate B over hard rock, a lithocutanic B or a dorbank)"
    source: "K 70; K 72; K 73"
    decision: "D7 (Hugo, 2026-11-06)"
    stand_in: true
    note: "The form pages say 'usually' under 0.3 %: a descriptive number read as the limit, flagged."
  topsoil_upper:
    value: 200
    unit: "mm, the upper part of a topsoil of several layers: a vertic, melanic or humic A covering it (or half the topsoil or more) is the topsoil"
    source: "soilkey"
    decision: "R5 (Hugo, 2026-11-06)"
    stand_in: true
  colour_split_thickness:
    value: 20
    op: ">="
    unit: "cm: a red and a yellow-brown apedal layer are two horizons when each is this thick, else one of the colour of the greater thickness"
    source: "soilkey"
    decision: "R6 (Hugo, 2026-11-06)"
    stand_in: true

  # --- part 5 (0.9.359): the family criteria (FC 1-19; R/families-za.R) ----------
  fibrous_fibre:
    value: 66.7
    op: ">="
    unit: "% unrubbed fibre by volume (2/3) of a fibrous organic layer (fiber_content_unrubbed_pct)"
    source: "V 37"
    decision: "default 4 (Hugo, 2026-11-04)"
    stand_in: false
  fibrous_von_post:
    value: 4
    op: "<="
    unit: "von Post degree (H1 to H4) of a fibrous organic layer, read when the fibre is not recorded"
    source: "V 37"
    decision: "default 4 (Hugo, 2026-11-04)"
    stand_in: false
  fibrous_thickness:
    value: 200
    op: ">="
    unit: "mm of fibrous layers in the O for the fibrous families"
    source: "FC 1"
    stand_in: false
  humic_thick:
    value: 450
    op: ">"
    unit: "mm, the thickness of a thick humic A"
    source: "FC 2"
    stand_in: false
  humic_thick_sample:
    value: [250, 450]
    unit: "mm from the top of the A: the part whose organic carbon (weighted) must be over humic_oc in a thick humic A"
    source: "FC 2"
    stand_in: false
    note: "A thin humic A has over humic_oc as the weighted mean of its whole thickness (FC 2)."
  dark_a_value:
    value: 4
    op: "<="
    basis: moist
    unit: "Munsell value of a dark A over the E (Fernwood families)"
    source: "FC 3"
    stand_in: false
  dark_a_chroma:
    value: 1
    op: "<="
    basis: moist
    unit: "Munsell chroma of a dark A over the E (Fernwood families)"
    source: "FC 3"
    stand_in: false
  fc5_dark_value:
    value: 4
    op: "<="
    basis: moist
    unit: "Munsell value of a dark vertic A or pedocutanic B (FC 5)"
    source: "FC 5"
    stand_in: false
  fc5_dark_chroma:
    value: 1
    op: "<="
    basis: moist
    unit: "Munsell chroma of a dark vertic A or pedocutanic B, any hue"
    source: "FC 5"
    stand_in: false
  fc5_dark_chroma_yr:
    value: 2
    op: "<="
    basis: moist
    unit: "Munsell chroma of a dark vertic A or pedocutanic B with a hue of fc5_dark_hues"
    source: "FC 5"
    stand_in: false
  fc5_dark_hues:
    value: ["10YR", "7.5YR"]
    basis: moist
    unit: "the hues with which a chroma of 2 is still dark"
    source: "FC 5"
    stand_in: false
  yellow_e_hue:
    value: "5YR"
    op: ">="
    basis: moist
    unit: "Munsell hue, 5YR or yellower (YR and Y hues), of a yellow E, with a moist chroma above low_chroma"
    source: "soilkey"
    decision: "Q10 with FC 6; a redder E is grey (R1, Hugo, 2026-11-06)"
    stand_in: true
    note: "FC 6: yellow when moist as the yellow-brown apedal B is yellow, occasionally a 5YR hue; grey dry. A redder E with a higher chroma is grey (R1)."
  dystrophic_max:
    value: 5
    op: "<"
    unit: "cmol(+) exchangeable Ca + Mg + K + Na per kg clay (S-value x 100 / clay %) of a dystrophic B1"
    source: "FC 8"
    decision: "plan section 10, slip 16; default 10 (Hugo, 2026-11-04)"
    stand_in: false
    note: "5 and 15 exactly are mesotrophic."
  eutrophic_min:
    value: 15
    op: ">"
    unit: "cmol(+) exchangeable Ca + Mg + K + Na per kg clay of a eutrophic B1 (not calcareous)"
    source: "FC 8"
    decision: "default 10 (Hugo, 2026-11-04)"
    stand_in: false
  luvic_clay_low:
    value: 15
    op: "<="
    unit: "% clay of any layer of the A or E that calls for the rule of luvic_points (else luvic_ratio)"
    source: "FC 10"
    decision: "Q21 (Hugo, 2026-11-04)"
    stand_in: false
  luvic_points:
    value: 5
    op: ">="
    unit: "percentage points of clay the B1 holds over the A or E directly above"
    source: "FC 10"
    decision: "Q21 (Hugo, 2026-11-04)"
    stand_in: false
  luvic_ratio:
    value: 1.3
    op: ">="
    unit: "clay % of the B1 / clay % of the A or E directly above"
    source: "FC 10"
    decision: "Q21 (Hugo, 2026-11-04)"
    stand_in: false
  black_cutans_value:
    value: 2
    op: "<="
    basis: moist
    unit: "Munsell value of the coatings (coatings_value_moist) of continuous black cutans"
    source: "soilkey"
    decision: "default 5 (Hugo, 2026-11-04)"
    stand_in: true
  black_cutans_chroma:
    value: 1
