implementation_status: "soilKey v0.9.359 -- the 73 soil forms (and Lichtenburg, outside the AGIS key, provisional), keyed by their sequences of diagnostic horizons and materials in the order of van Huyssteen (2020), with the general rules (1500 mm, burial, truncation) and the 500 mm rules of the form pages; the 30 diagnostic horizons and materials from the South African notation or on the data (v0.9.355-0.9.357); since v0.9.359 the 404 families of the forms, by the 19 family criteria, with the partial code of an undecided family (Hu1x00) and the name of Q23 (form, family code and name, texture of the A)."
source: |
  The key to the 73 forms (AGIS pages), the general rules (1.5 m, burial,
  500 mm), the five topsoil horizons. The subsoil horizons are read from van
  Huyssteen (2020) and SASRI (1999); where no open source gives a number, a
  WRB diagnostic stands in, flagged (readings.yaml, thresholds.yaml).
