# The 404 families of the 73 soil forms of the South African soil
# classification of 1991 (Soil Classification Working Group, 1991), and its
# 19 family criteria. Written by data-raw/za1991_families.R; edit there.
#
#   family_criteria  the 19 criteria (FC), soilKey's names and class keys
#                    (paraphrased; no text of the sources)
#   family_digits    per form, the digits of the family code in order: the
#                    conditions of each class (1, 2, 3 ...), for the partial
#                    code of an undecided family (Hu1x00)
#   families         per form code, its families in the order of the key:
#                    code (form code and the four printed digits), name as
#                    printed, the K page, and the tests: all_of the
#                    family_class_za() conditions of its digits

edition_id: za1991
family_criteria:
- number: 1
  name: Fibrous or humified organic material
  reads: the organic O
  classes:
  - fibrous
  - humified
  page: FC 1
- number: 2
  name: Thin or thick humic A
  reads: the humic A
  classes:
  - thin
  - thick
  page: FC 2
- number: 3
  name: Dark or light A over the E (Fernwood)
  reads: the orthic A
  classes:
  - dark
  - light
  page: FC 3
- number: 4
  name: Bleached orthic A
  reads: the orthic A
  classes:
  - bleached
  - not_bleached
  page: FC 4
- number: 5
  name: Dark, red or other colour (vertic A; pedocutanic B under a melanic A)
  reads: the vertic A or the pedocutanic B
  classes:
  - dark
  - red
  - other
  page: FC 5
- number: 6
  name: Grey or yellow E
  reads: the E
  classes:
  - grey
  - yellow
  page: FC 6
- number: 7
  name: Lamellae in the E (Fernwood)
  reads: the E
  classes:
  - absent
  - present
  page: FC 7
- number: 8
  name: 'Base status of the B1: dystrophic, mesotrophic, eutrophic'
  reads: the B1
  classes:
  - dystrophic
  - mesotrophic
  - eutrophic
  page: FC 8
- number: 9
  name: Red or non-red B, stratified alluvium or regic sand
  reads: the B, the alluvium or the regic sand
  classes:
  - non_red
  - red
  page: FC 9
- number: 10
  name: Luvic B1
  reads: the B1 against the A or E directly above
  classes:
  - non_luvic
  - luvic
  page: FC 10
- number: 11
  name: Subangular or fine angular against medium or coarse angular structure
  reads: the pedocutanic or red structured B
  classes:
  - subangular_fine
  - medium_coarse
  page: FC 11
- number: 12
  name: Continuous black cutans in the prismacutanic B (Estcourt)
  reads: the prismacutanic B
  classes:
  - without
  - with
  page: FC 12
- number: 13
  name: Ortstein in the podzol B
  reads: the podzol B
  classes:
  - not_hardened
  - hardened
  page: FC 13
- number: 14
  name: Hard or not hard lithocutanic B or saprolite
  reads: the lithocutanic B1 or the upper saprolite
  classes:
  - not_hard
  - hard
  page: FC 14
- number: 15
  name: Signs of wetness
  reads: the horizon the family names
  classes:
  - absent
  - present
  page: FC 15
- number: 16
  name: Calcareous
  reads: the horizon the family names
  classes:
  - non_calcareous
  - calcareous
  page: FC 16
- number: 17
  name: Podzolic character below the yellow-brown apedal B (Constantia)
  reads: the layers below the yellow-brown apedal B
  classes:
  - absent
  - present
  page: FC 17
- number: 18
  name: Friable or firm C
  reads: the upper C
  classes:
  - friable
  - firm
  page: FC 18
- number: 19
  name: Material under the organic O
  reads: the layers below the O
  classes:
  - rock_or_saprolite
  - unconsolidated
  page: FC 19
