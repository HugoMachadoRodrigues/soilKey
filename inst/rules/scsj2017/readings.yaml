# How soilKey reads the Soil Classification System of Japan (SCSJ 2017,
# Japanese Society of Pedology), where the text is silent or leaves a choice.
# Summarised in soilKey's own words; the text is the Japanese Society of
# Pedology's. Page numbers are book pages.
readings:
  - topic: "Decisions taken before the code (Hugo, 2026-10-31)"
    page: "-"
    reading: "SCSJ 2017 complete (great groups, groups, subgroups and the three soil phases), then the CSCJ 2011 as a system of its own. Names: the official English names of the SCSJ table (pp. 17-19), with the Japanese names beside them (levels$name_native). The kuroboku feature reads the new attribute phosphate_absorption_coef (mg P2O5/100 g; the text writes mg/g, 15.00 = 1500) and the new field test active_al_test, with the substitutes the text allows when the coefficient is missing. Paddy land is read from site$land_use (rice, paddy, the Japanese word; not upland rice) or site$flood_irrigated; with no land use recorded the paddy horizons are undecided, not absent."
  - topic: "Soil surface"
    page: "IV.4, soil surface (pp. 29-30)"
    reading: "The ground surface (the top of the first horizon) when the first horizon is peat material, or the site is artificially drained (site$artificially_drained) or very poorly drained (saturated for most of the year). Otherwise a forest floor on top (organic material: an O horizon unless its carbon is measured under 20 %) is skipped: the soil surface is the top of the first horizon with the kuroboku feature or that is not organic material. A site whose drainage is not recorded is read as not saturated for that rule, since forest floors seldom are. When the first horizons cannot be read (it is not known whether they are a forest floor), the soil surface is undecided and so is every gate. Depths in the key are from the soil surface."
  - topic: "Horizon notation"
    page: "IV.4, master horizons (pp. 30-31)"
    reading: "The Japanese notation of the Soil Survey Handbook (JSP 1997) is read: a lithologic number (2, 3 or II, III), masters H, O (Oi, Oe, Oa), A, E, B, C, G (Go, Gr) and R, transitions (AB, BC, A/B), and the suffixes p (plough layer), g (gleyed or redox-mottled), t, w, s, h, k, ir and mn, b (buried) and trailing digits. The FAO/USDA notation is read by the same letters; a leading ^ (USDA human-transported material) is fill. A Cr is weathered (semi-weathered) bedrock, as in the USDA notation, unless the site declares the FAO notation (site$designation_system 'fao'), where it is a strongly reduced C, the G of Japan. The forest-floor notation (L, F, H, the A0 layers of forest soil surveys) is read as O horizons; with L or F recorded, an H above the first mineral horizon is the humus layer of the floor, not peat (Hugo, 2026-10-31). The Australian, Canadian and New Zealand notations are not read (site$designation_system in any of their spellings: asc, cssc, cssc3, nzsc, New Zealand ...); the FAO notation is declared by fao, wrb, wrb2022 and the like."
  - topic: "Materials from the description: fill, volcanic ejecta, alluvial deposits"
    page: "IV.3 (pp. 27-28); II A, C, E, G"
    reading: "Read from the recorded origin of the layers and, for a layer with none (a fill excepted), the site parent material; a profile that records none of them has none (recorded when present). Fill: layer_origin words such as fill, backfill, made ground, dredged material, soil dressing, spoil, landfill and the Japanese words for fill, soil dressing and dredged material, or a ^ of the notation. Volcanic ejecta (pyroclastic materials): tephra, volcanic ash, ash fall, pumice, scoria, lapilli, pyroclastic, cinders, volcanic sand and the Japanese words, from layer_origin or rock_origin (pumice or scoria fragments); not volcanic rock (rock, lava, andesite, basalt, rhyolite, dacite, tuff and the Japanese word for rock), not non-volcanic material, not ash redeposited as dunes. Alluvial deposits (Holocene, unconsolidated): alluvium, fluvial, river, marine, lacustrine, estuarine, delta, lagoon, backswamp, floodplain, Holocene and the Japanese words, from layer_origin or the parent material only (rock_origin names the rock the material came from); not Pleistocene, terrace, Tertiary, Miocene, Pliocene or glacial deposits, nor rock (mudstone, sandstone, shale ...). A fill row keeps the material it records ('fill (river alluvium)'): a fill of the same material is part of an ordinary profile (chapter VI, the fill phase), and the 35 cm rules of the key name a fill of other material (0.9.322). The canonical layer_origin values tephric and fluvic are read as volcanic ejecta and alluvial deposits."
  - topic: "Peat material and organic material"
    page: "IV.3, peat material and organic material (p. 28)"
    reading: "Measured carbon decides. Peat material is 12 % organic carbon or more without the kuroboku feature (or with it, when a sixth of the volume or more is fibre after rubbing); without a carbon value, or with one but no data on the kuroboku feature, an H horizon is peat material (0.9.323). An O horizon is never peat: it is organic material of the forest floor, unless its carbon is measured under 20 %. An undesignated layer of 20 % carbon or more is peat on a poorly or very poorly drained site and organic material on any other recorded drainage class, undecided without one (Hugo, 2026-10-31). A designated horizon of another master without a carbon value is neither."
  - topic: "Kuroboku feature"
    page: "IV.2, kuroboku feature (p. 25)"
    reading: "A measured phosphate absorption coefficient decides (1500 mg P2O5/100 g or more). Without it, a measured substitute that passes decides (P retention 85 % or more, or Alo + 1/2 Feo 2.0 % or more), and so do substitutes that all fail. Without any of them, the field active-aluminium test of the text's field note: a vivid red within a minute (2+ or more) is the feature, none or +- is not, + is undecided. Rubbed fibre not recorded is read as under a sixth of the volume, except in H and O horizons."
  - topic: "Immature kuroboku feature"
    page: "IV.2, immature kuroboku feature (p. 27)"
    reading: "A layer with the kuroboku feature does not have the immature one (the field note of IV.2 splits ejecta layers between the two). Volcanic ejecta (60 % or more by weight) are read from the recorded origin; coarse fragments not recorded are read as under half of the area. The third criterion is a coefficient of 300 to under 1500 (P retention 25 to under 85 %, or Alo + 1/2 Feo 0.4 to under 2.0 %) or 3 % carbon or more."
  - topic: "Gley feature and physical immaturity"
    page: "IV.2, gley feature and physical immaturity (pp. 25-27); IV.4, G"
    reading: "The dipyridyl reaction is the existing childs_test attribute (2,2'-bipyridine): positive (or +, 2+, strong, immediate) is an immediate vivid reaction; negative, - or a weak +- is not. Measured tests decide; a G horizon of the notation has the gley feature when they do not (the text defines G by that reaction, or a soft blue-grey layer); another master of a designated profile has not. Physically immature: the material squeezes between the fingers (fluidity_class slightly, moderately or very fluid) or an n value of 1 or more (the new attribute n_value, as recorded: soilKey has no field water content to compute it)."
  - topic: "Wetness features (groundwater and surface water)"
    page: "IV.2, groundwater and surface-water wetness features (pp. 25-26)"
    reading: "Saturation at some time of the year is read from redox mottles of 2 % or more (or a g suffix). Where the mottles are tells the kind: on ped faces or pore walls (redox_segregations_location: ped faces, voids) the groundwater feature; within peds or in the matrix (grey faces, redder and more chromatic interiors) the surface-water feature; a g suffix or mottles without a location are one of the two, not said which, which is enough where the key accepts either. A designated horizon without g and without a mottle record has neither; neither goes with the gley feature."
  - topic: "Argic (clay accumulation) horizon"
    page: "IV.1, argic horizon (p. 22)"
    reading: "Criterion (1) is read against the horizon directly above: a horizon of another lithologic number is not an argic horizon. Clay coatings are a t of the notation or recorded clay films; a designated horizon without t and without a clay-film record has none (surveyors write t). A Bt without a clay value is read as 8 % clay or more. The clay increase is measured against each mineral horizon above in the same lithologic layer whose base is within 30 cm above the horizon's top; with no such horizon there is no increase to measure. In a designated profile, a horizon without t whose increase cannot be measured (no clay values) is not one. The 7.5 cm is the run of adjacent rows."
  - topic: "Weathered (cambic) horizon"
    page: "IV.1, weathered horizon (p. 23)"
    reading: "A B horizon of the notation with no mark of another horizon (not t, s, h or G) has the weathering of criteria 1 and 2 (the B master is defined by the loss of rock structure and soil development); an undesignated horizon below the first by a recorded structure grade other than structureless; A, E and C horizons are not weathered horizons. Texture not recorded is read as sandy loam or finer for such a B. Criterion 5 removes the argic, gley, pseudogley, paddy iron accumulation and paddy greyed horizons, and an undecided one leaves the weathered horizon undecided. A podzolic accumulation horizon and a bleached horizon are not removed: the Brown Forest soils have a Podzolic subgroup, and a pale B is not an eluvial horizon. The 15 cm is the run of adjacent rows."
  - topic: "Bleached and podzolic accumulation horizons; Podzols"
    page: "IV.1, bleached horizon and podzolic accumulation horizon (pp. 23-24); II D"
    reading: "Without a colour, an E horizon is a bleached horizon; a Bs, Bh or Bhs never is. An E horizon is never a podzolic accumulation horizon. A Bs, Bh or Bhs is the visible free-oxide accumulation of colour criterion c (with the reddest hue of the profile, not required over a buried soil); a designated horizon without s or h is not, nor (without Alo and Feo) one by analysis. Criterion (2) of the morphology, no layer with the red-yellow feature and no argic horizon, is read for the soil, as its verb says (Hugo, 2026-10-31). The analysis compares Alo + 1/2 Feo with the lowest value of the A and bleached horizons. In the Podzols gate the bleached horizon must lie above the accumulation horizon (the sequence of the great group's concept; Hugo, 2026-10-31), both in one lithologic layer (one parent material; candidate horizons are split at lithologic boundaries, so a pair inside one material is found even next to a layer of another); an analysis horizon with a morphology horizon may be at any depth. The paddy surface horizon of criterion (2) is the unbleached one (the text names it alone)."
  - topic: "Red-yellow feature"
    page: "IV.2, red-yellow feature (p. 25); IV.4, soil colour (p. 29)"
    reading: "Red and yellow are the colour words of IV.4 on the moist matrix colour (red: 5YR or redder, value over 3, chroma 3 or more, not 4/3 or 4/4; yellow: yellower than 5YR, value 3 or more, chroma 6 or more, not 3/6 or 4/6; hues of 10Y or bluer are blue-grey; purple hues count as redder than 5YR). A value or chroma alone that rules a word out decides it without the hue (a value under 3 is never brown). Carbon not measured: a B, C or E horizon (not a Bh or Bs) is read as under 2 %; the red-yellow weathered horizon (under 1 %) needs a measured carbon. The Red-Yellow soils' 25 cm are those of one horizon (adjacent layers, a gap breaking it) whose top is within 50 cm (the argic horizon with the feature) or 35 cm (the red-yellow weathered horizon), not added up over separate horizons (Hugo, 2026-11-01)."
  - topic: "Paddy horizons"
    page: "IV.1, paddy surface, bleached paddy surface, paddy iron accumulation, paddy greyed horizons (pp. 20-22)"
    reading: "The plough layer is an Ap (Ap1, Ap2: a former plough layer counts too). On paddy land an Ap run of 7.5 cm or more is the paddy surface horizon (mottles of 2 % or more and Fe(d) 0.4 % or more) or the bleached one (fewer mottles and Fe(d) under 0.4 %). The paddy iron accumulation horizon is the horizon directly under it, 2 cm or more by either route (thickness unknown: undecided), with Fe(d) twice that of the plough layer (1.6 times at 5 cm, 1.4 times at 10 cm, as the note allows); without Fe(d), an ir or mn of the notation; with its own Fe(d) but not the plough layer's, undecided. The paddy greyed horizon is the run directly under it with the surface-water feature, 10 cm or more."
  - topic: "Subsurface control section and base status"
    page: "IV.4, subsurface (p. 30); II F (2), II H (2)"
    reading: "The subsurface is the horizons with 5 cm or more between 20 and 60 cm of the soil surface (Hugo, 2026-10-31), the plough layer excepted, cut at the top of a gravel layer (gravel_pct, or else coarse_fragments_pct, 20 % or more) that starts at 20 cm or deeper, or of the bedrock, when either appears within 60 cm of the ground surface (the text measures that limit from the ground). Red-Yellow soils need one subhorizon with pH(H2O) under 5.5 or base saturation under 50 %; Eutrosols need every subhorizon with pH(H2O) 5.5 or more or base saturation 50 % or more, and are undecided when site$acid_neutralising_amendment says the soil was limed (the text excludes a status that comes from liming). A horizon without a bottom that starts in the section counts, and covers the section only possibly; a section the closed horizons do not cover leaves both undecided where the missing part could change them."
  - topic: "Bedrock within 30 cm"
    page: "II F (3), H (3), I (2); IV.4, bedrock"
    reading: "Bedrock is an R horizon, or a Cr outside the FAO notation (semi-weathered bedrock). A row whose designation cannot be read, or an undesignated row without fine-earth data in a designated profile, may be bedrock. A profile whose closed horizons reach below 30 cm without it has none within 30 cm; one that stops above 30 cm without it is undecided, a last horizon without a bottom included (it may end at once)."
  - topic: "Missing depths"
    page: "-"
    reading: "A horizon without a bottom depth (the deepest, after the classifier fills the others from the next top) counts as possibly extending down from its top: it adds to the possible thickness of a horizon, never to the certain one."
  - topic: "Man-made soils"
    page: "II A (p. 2); IV.3, artificial material, heterogeneous soil material"
    reading: "Artificial material is artefacts_pct (20 % or more of the section); a continuous impermeable artificial layer is technic hard material of 90 % or more (from its horizon's top) or a geomembrane, at site$geomembrane_depth_cm when recorded and otherwise somewhere in the horizon marked geomembrane_present (undecided when that horizon spans 30 cm). Fill of heterogeneous soil material: the fill (35 cm or more, from the soil surface) and the soil under it key, each on its own, to different great groups (B to J); a recorded fill is read as not a natural combination of materials. The classes each part may key to are compared (a Regosol by its groups: in Regosols, material of another group is heterogeneous too): no class in common is heterogeneous, one and the same class is not, anything else is undecided. The fill keyed on its own is complete; the soil under it only where the original profile ends on rock. Criterion (1) is checked on the fill and the layers of artificial material."
  - topic: "Stagnic soils"
    page: "II G (p. 4)"
    reading: "The gley layer and the wetness layers are taken together: a run of adjacent rows, each with the gley feature or a wetness feature, 10 cm or more, its top within 50 cm, reaching 50 cm or deeper or the bedrock. A gap in the description, or a description that stops above 50 cm, leaves the gate undecided where it could pass."
  - topic: "Gley layers: groundwater, stagnant and paddy reverse gley (groups C3, E2, G1)"
    page: "IV.1, subdivisions of the gley layer (p. 20); III C, E, G"
    reading: "A gley layer (gley feature, 10 cm or more) is a run of adjacent gley horizons, taken together (Hugo, 2026-10-31: the text's 'several gley layers' are adjacent ones; an oxidised layer between two gley layers separates them). A groundwater gley layer reaches 75 cm or deeper; a gley layer without a bottom depth, or ending where a description stops (not on rock), may: undecided; its certain depth is its last closed bottom, or the top of its open last horizon. Gaps and undescribed depth leave a gley layer undecided only where, with the horizons that may have the feature, they could make one of the depth the group needs (a 5 cm gap between horizons without the feature cannot). Stagnogley soils need a gley layer whose top is within 50 cm, reaching 50 cm or deeper or the bedrock."
  - topic: "Groundwater wetness layer (groups C4, E3)"
    page: "III C (p. 8), E (p. 11)"
    reading: "A layer with the groundwater wetness feature counts at any thickness (the groups name no thickness); its top within 50 cm; a gap in the description above 50 cm leaves it undecided. On paddy land the paddy surface, paddy iron accumulation and paddy greyed horizons do not count, their mottles coming from the irrigation water (Hugo, 2026-10-31; chapter VI: paddy fields on well-drained Andosols are not Wet Andosols); with no land use recorded, their wetness is undecided."
  - topic: "Non-allophanic kuroboku feature (group C5)"
    page: "IV.2, non-allophanic kuroboku feature (p. 26)"
    reading: "The kuroboku feature with an exchange acidity y1 of 5 or more (the new attribute exchange_acidity_y1), Sio under 0.6 % (si_ox_pct) or Alp/Alo 0.5 or more (al_pyro_pct / al_ox_pct). On farmland y1 is not read, as the text says (fertilising and liming change it). A recorded land use decides: paddy land, or whole words for crops, cropping, fields, arable land, cultivation, farms, orchards, tea gardens, vegetables, pasture or upland rice (or the Japanese words for upland fields, orchards, tea gardens, farmland, improved grassland and upland rice), not 'uncultivated' or 'non-farm', not forests or wild grassland. With no land use recorded, a plough layer (not buried) says farmland; with neither, a passing y1 is undecided."
  - topic: "Brown Fluvic soils (group E4)"
    page: "III E (p. 11); IV.4, subsurface (p. 30)"
    reading: "The subsurface colour is the colour of the thickest horizon of the subsurface section (the text: several horizons in 20-60 cm are represented by the thickest), by the colour word brown of IV.4; horizons of equal thickness must agree. A section the description does not cover, or an open thickest horizon, leaves it undecided unless the thickest horizon is thicker than what is not described; no section at all (gravel or bedrock at 20 cm) is not brown."
  - topic: "Fluvic Paddy soils (group E1)"
    page: "III E (p. 10)"
    reading: "A paddy iron accumulation horizon, or a paddy greyed horizon whose lower boundary is 50 cm or deeper from the soil surface. A description that stops at the plough layer or inside the greyed horizon (not on rock) leaves it undecided."
  - topic: "Magnesian Eutrosols (group H1)"
    page: "III H (p. 14)"
    reading: "The exchangeable Ca/Mg ratio of each subhorizon of the subsurface section (ca_cmol / mg_cmol; no magnesium reads as a large ratio): one under 0.1, or every one under 1.0."
  - topic: "Regosols (groups J1 to J4)"
    page: "III J (p. 15)"
    reading: "Volcanogenous Regosols: 25 cm or more of volcanic ejecta within 50 cm; the undeveloped horizons the text names are those of a Regosol. Volcanogenous Regosols also need undeveloped horizons: no weathered or argic horizon. Sandy Regosols: every horizon to 100 cm with coarse fragments under 35 % (coarse_fragments_pct, else gravel_pct; not recorded: under 35 %) and a texture of loamy sand or coarser (field texture, else lab silt + 2 clay under 30); bedrock or an organic layer within 100 cm is not sand (the text names no bedrock alternative, unlike the Marlitic subgroup); a gap or a description that stops above 100 cm is undecided. Argic Red-Yellow soils: an argic horizon within 1 m (the depth the system classifies). Lithosols: consolidated bedrock (an R horizon) within 30 cm; a Cr (semi-weathered bedrock) is not consolidated, as the Para-lithic subgroup of the Terrestrial Regosols shows."
  - topic: "Subgroup names"
    page: "Table, pp. 16-19"
    reading: "A subgroup is named by its word before the group's name, in English (Haplic Allophanic Andosols) and in Japanese (the subgroup word written before the group's Japanese name, as the text writes them)."
  - topic: "The top of a layer within or between depths (most subgroups)"
    page: "III (subgroups)"
    reading: "'The top of a layer with ... within X cm' holds when such a layer (with the thickness the subgroup names, if any) starts at X cm or shallower; 'at A to B cm' when it starts between A and B cm, a layer that starts above A not counting (so an undecided horizon directly above, or a gap, leaves a layer starting at A undecided). Gaps, open bottoms and a description that stops above the depth leave it undecided where a layer could start in the window. Epi-gray is the exception: its text names no top, so a layer with the groundwater wetness feature anywhere between 25 and 50 cm. The gley layers are those of 10 cm or more; the groundwater gley layers reach 75 cm or deeper, taken together; the pseudogley horizon is the surface-water wetness feature, 10 cm or more, not on paddy land."
  - topic: "Humic and polyhumic surface horizons; Humic, Cumulic and Brown-humic subgroups"
    page: "IV.1, humic and polyhumic surface horizons (pp. 21-24)"
    reading: "Read from the soil surface down through the surface horizons (A, buried A included, or undesignated) that have a moist value of 3 or less and chroma of 3 or less (not 3/3), 3 % carbon or more (6 % for polyhumic) and are mineral; layers that fail the colour or the carbon sandwiched inside it do not break it while they total less than 10 cm, and only the layers that meet the criteria add to the thickness (the note to both definitions: the layers that meet them must total 25 cm); a failing layer at the top, a horizon designated other than A (E, B, C, G, R) or a layer that is not mineral ends it. Gaps, a horizon without a bottom and the end of a description (not on rock) count as possible thickness. A polyhumic surface horizon is also a humic one, so 'a humic or polyhumic surface horizon' is read as a humic one: 25 cm or more (Humic), 50 cm or more (Cumulic). Brown-humic: every requirement of the humic surface horizon but its colour, with a moist value and chroma both 3 or more (the colour chapter VI gives the name; Hugo, 2026-10-31)."
  - topic: "Buried humic layer and buried non-kuroboku upland soil"
    page: "IV.1, buried humic layer (p. 24); IV.4, buried non-kuroboku upland soil (p. 30)"
    reading: "A buried humic layer is read by its own criteria: dark (value and chroma 3 or less, not 3/3), 3 % carbon or more, 10 cm or more (a run of such horizons, as 2Ab1 and 2Ab2), under 10 cm or more of layers below the soil surface with a value at least 1 higher and at least 1 % less carbon than its top horizon (a b of the notation is not needed). A buried non-kuroboku upland soil is a layer buried (a b of the notation, or a lithologic number deeper than the surface layer's) with neither kuroboku feature, not peat material and not alluvial deposits."
  - topic: "Endofluvic subgroups"
    page: "III C (pp. 8, 10)"
    reading: "The Wet Andosols need 25 cm or more of alluvial deposits within 75 cm (cumulative within the depth); the Allophanic Andosols the top of alluvial deposits within 75 cm, 25 cm or more of them within the 1 m the system classifies, as the two texts are worded. Thionic subgroups count their 15 cm within 1 m too."
  - topic: "Thionic subgroups"
    page: "IV.2, sulfuric feature (p. 27); IV.3, potential sulfuric material (p. 28); III E"
    reading: "The sulfuric feature is jarosite mottles (jarosite_present) with pH(H2O) under 4.0; potential sulfuric material is pH(H2O) 4.0 or more with a pH after hydrogen peroxide under 3.0 (the new attribute ph_h2o2), its saturation being that of the Gley and Gray Fluvic soils where the subgroup is keyed. Neither recorded: none."
  - topic: "Paddy subgroups"
    page: "IV.1, paddy reverse gley layer (p. 20); III E, F, G, I"
    reading: "Anthraquic: a paddy iron accumulation horizon. Albic (Fluvic Paddy soils): a bleached paddy surface horizon. The paddy reverse gley layer: on paddy land, a gley layer starting directly under the plough layer, the gley layers ending above 75 cm. Protoanthraquic Brown Fluvic soils: the horizon directly under the plough layer is grey (IV.4) with mottles of 2 % or more (or a g). The plough layer is a current one (a buried Apb is not). On paddy land a paddy greyed horizon within 30 cm rules the Aeric Pseudogley soils out (Hugo, 2026-10-31: it is grey, not the brown the name says); in the Aquic and Epi-gleyed subgroups its surface-water feature counts as the text says. Endoaeric: a brown layer below the plough layer and the surface horizons (a brown subsoil, as the name says; Hugo, 2026-10-31). Where the key accepts either wetness feature, a wetness feature of an unknown kind (a g, or mottles without a location) counts."
  - topic: "Strong and Mottled Gley Fluvic soils"
    page: "III E (p. 11)"
    reading: "Strong: no iron mottles of the class 'contains' (含む) or more in the gley layers deeper than 25 cm (a horizon that may be in a gley layer counts as possibly one; a description stopping above 1 m, not on rock, leaves Strong undecided). The text gives the classes 'present' (2 %) and 'rich' (15 %) but no figure for 'contains', read as 5 % or more of redox features (redoximorphic_features_pct; Hugo, 2026-10-31). Without a mottle record, a Gr of the notation (strongly reduced) has none and a Go (oxidised, with iron mottles) has them."
  - topic: "Aquic Regosolic Fluvic soils"
    page: "III E (p. 12)"
    reading: "Groundwater within 50 cm for half the year or more: site$groundwater_depth_cm of 50 cm or less; without it, a poorly or very poorly drained site has it, a somewhat poorly drained one is undecided and a better drained one has not."
  - topic: "Andic, Reddish, Eutric and Thapto-red-yellow subgroups"
    page: "III F, I"
    reading: "Andic: within 50 cm, 25 cm or more of layers with a phosphate absorption coefficient of 1000 mg P2O5/100 g or more (P retention 60 % or Alo + 1/2 Feo 1.2 % when it is missing). Reddish: an argic (Argic Red-Yellow soils) or weathered (Cambic) horizon of the colour word red. Eutric Brown Forest soils: a subhorizon of the subsurface section (5 cm or more inside 20-60 cm) with pH(H2O) 6.5 or more or base saturation 50 % or more. Thapto-red-yellow: within 75 cm, a weathered or argic horizon with the red-yellow feature."
  - topic: "Regosols subgroups"
    page: "III J (pp. 15-16)"
    reading: "Calcaric: carbonates of 2.0 % or more (caco3_pct) in a horizon between 20 and 50 cm (Lithosols: in the horizon on the bedrock); a horizon without effervescence has none. Marlitic and Granitic: the recorded origin or the site parent material names marl or granite (or masa); marl also needs 30 % clay or more in every horizon to 100 cm or the bedrock. Para-lithic: a Cr (semi-weathered bedrock) of the notation, or rock of soft or slightly hard rupture resistance (soft gravel is not recorded and is not read). The table (pp. 17-19) lists Para-lithic before Granitic and says 119 subgroups while listing 120; the key (p. 16) and chapter VI put Granitic first, which soilKey follows, with 120 subgroups."
  - topic: "Man-made and Peat soils subgroups"
    page: "III A, B (p. 7)"
    reading: "Organic Artifactual soils: the new attribute artefacts_organic (the artificial material mainly organic: more than half the thickness of the layers with 20 % or more artificial material), per layer or for the site (a horizon without a bottom may be of any thickness); an impermeable layer alone (concrete, asphalt) is not organic. Ekranic: a continuous impermeable artificial layer at any depth. Upland Reformed soils: site$landform names a terrace, hill, mountain, upland, plateau, slope or ridge (or the Japanese words); lowland words are Lowland; a landform naming both is undecided. Sapric Peat soils: sapric peat (rubbed fibre under a sixth) has the largest thickness of the peat layers to 50 cm, the decomposition letter of the notation (a sapric, e hemic, i fibric) standing in for fibre; layers of undecided peat status or decomposition, open horizons and undescribed depth count as unknown. High-moor and Transitional-moor: the new attribute peat_moor_type for the uppermost 25 cm of the peat, counted on the peat layers alone in depth order (a mineral layer between them is skipped; a gap, a horizon without a bottom or a description that stops above 1 m leave it undecided while less than 25 cm of peat is certain)."
  - topic: "Soil phases: where they are"
    page: "V (pp. 32-36)"
    reading: "The text writes a phase in parentheses after the class name. soilKey keeps the class name as it is and returns the phases in ClassificationResult$phases (kind, code, English name, Japanese name, basis), so that only the class enters comparisons and benchmarks (Hugo, 2026-10-31); print() lists them. The English names of the phases are soilKey's glosses: the text names them in Japanese only. A phase is given only when it is decided: a test earlier in a phase's order that the data leave undecided gives no phase (Hugo, 2026-11-01)."
  - topic: "Soil temperature phase"
    page: "V.1 (p. 32)"
    reading: "From the mean annual soil temperature (site$mean_annual_soil_temp_C, read as the temperature at 50 cm the text names; a decimal comma is read): frigid under 8, mesic 8 to under 15, thermic 15 to under 22, hyperthermic 22 C or more. Without it, the USDA soil temperature regime (an iso- regime as its base; cryic, gelic and pergelic as frigid; two regimes at once give none). Without either, no phase: the text points to the national soil information system, and no estimate from the air temperature is made (Hugo, 2026-10-31)."
  - topic: "Man-made phases"
    page: "V.2 (pp. 33-34)"
    reading: "Outside the Man-made soils: the mixed-layer phase where mechanical mixing is recorded below the plough layer (site$mechanical_mixing_depth_cm deeper than the bottom of the Ap, or than 30 cm with no Ap), or, when no depth is recorded, a land use or site$mechanical_mixing_purpose naming deep ploughing, deep ripping, inversion or tephra flipping (a recorded depth decides); mixing within the plough layer, an Ap without a bottom, or a purpose recorded as none, gives none (Hugo, 2026-11-01; the supplement gives no phase when only the plough layer was turned). The cut phase where truncation is recorded (site$anthropic_truncation: TRUE, yes, 1) or a land use names a cut (cut slope, cut and fill, the Japanese word); land consolidation alone does not, nor does a clear-cut forest. The fill phase where a fill is recorded, named by its material: its artificial material, dredged sediment, or the great group its material features name in the order of the key (peat: Organic soils; the kuroboku feature: Andosols; alluvial deposits: Fluvic soils; the red-yellow colour: Red-Yellow soils), so that a fill thinner than the groups' 25 cm is named as the text's example of a thin kuroboku fill (Hugo, 2026-11-01); none decided, or a fill that may go on below a description that stops (where artificial material, which comes first, may lie): the fill phase without a material. Man-made soils: one phase, gley (a layer with the gley feature within 75 cm of the ground surface), else wet (a wetness feature within 75 cm), else gravelly (a gravel layer, 20 % or more gravel, within 60 cm), else plain (Hugo, 2026-10-31: gley before wet before gravelly); a test before the one that holds left undecided (gravel not recorded, say) gives none. A gravel layer: 20 % or more in gravel_pct or coarse_fragments_pct (the text's word for gravel covers all coarse fragments); under 20 % in coarse fragments, or in gravel when coarse fragments are not recorded, is none. The Artifactual soils are named by the recorded artificial material (the layer_origin of the first layer with 20 % or more artefacts, without the words that only say fill; recorded in English, the Japanese name keeps the generic word for artificial material, as does a record that names no material once those words are taken out). The Reformed soils: the fill's material (its great group, keyed on its own, or its artificial material or dredged sediment) over the original soil's great group, with the same phase ending (Hugo, 2026-11-01: the supplement's example of a gley phase after fill over original; chapter V shows only the plain ending); either part undecided: none."
  - topic: "Forest soil phases"
    page: "V.3 (pp. 34-36)"
    reading: "On forest or grazing land (site$land_use: whole words such as forest, woodland, pasture, grazing, range, and the Japanese words; not deforested land, agroforestry, orchards or tea plantations); a recorded 1975 forest soil type also says forest land when no land use is recorded. The great groups the text names: Podzols (development phases) and Andosols, Fluvic, Red-Yellow, Eutrosols and Brown Forest soils (moisture phases); none for the others. The 1975 type is read when recorded (site$forest_soil_type: BA, BB, BC, BD, BD(d), BE, BF; PDI, PDII, PDIII; in any spelling), the types of the other 1975 groups by their moisture letter (BlD gives BD, rBD gives BD, RC gives BC; the drier subtype by (d) or a small d; Hugo, 2026-11-01), a wet podzol (PW) gives no development phase, and the types without a moisture letter (muck, peat, immature, eroded, gley) give no moisture phase. Otherwise (Hugo, 2026-10-31 and 2026-11-01) the Podzols' phases come from the key's own pairings of a podzolic accumulation horizon under a bleached horizon: highly developed (one by morphology with a bleached horizon), moderately (one by analysis with a bleached horizon, or with one by morphology and leached spots, the new attribute leached_spots), weakly (one by analysis with one by morphology); leached spots (in the mineral soil, not the forest floor; a layer whose mineral status is undecided leaves them undecided) not recorded where they decide: none. The moisture phases come from soilKey's reading of the descriptions, which give no figures, tested in this order and three-valued: wet (BF) a B horizon both massive and mottled, grey or blue-grey; fine-granular dry (BA) fine granular structure in the A and the B; granular dry (BB) granular structure in the A, no crumb, an O horizon; moderately dry (BC) nutty structure in the lower A and the upper B; slightly wet (BE) no O horizon, a crumb A of 25 cm or more (soilKey's figure for the text's 'very thick'; its footnote declines to set one) and a B without blocky, nutty or granular structure (its colour is not read); moderately moist, drier type (BD(d)) granular structure in the upper A or nutty structure in the lower A; moderately moist (BD) a crumb A or a blocky upper B. Structures: crumb before granular (the Japanese word for crumb contains the one for granular); angular blocky is the text's nutty structure (angular, shiny, dense, 1 to 3 cm), subangular blocky its blocky one (Hugo, 2026-11-01); USDA codes are read. English granular structure without a size may be the text's fine granular or its granular structure: undecided between them. No A or no B described, no structure recorded, or a rule before the one that holds undecided: no moisture phase."
