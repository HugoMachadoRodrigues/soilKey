# How soilKey reads the Soil Classification System of Japan (SCSJ 2017,
# Japanese Society of Pedology), where the text is silent or leaves a choice.
# Summarised in soilKey's own words; the text is the Japanese Society of
# Pedology's. Page numbers are book pages.
readings:
  - topic: "Decisions taken before the code (Hugo, 2026-10-31)"
    page: "-"
    reading: "SCSJ 2017 complete (great groups, groups, subgroups and the three soil phases), then the CSCJ 2011 as a system of its own. Names: the official English names of the SCSJ table (pp. 17-19), with the Japanese names beside them (levels$name_native). The kuroboku feature reads the new attribute phosphate_absorption_coef (mg P2O5/100 g; the text writes mg/g, 15.00 = 1500) and the new field test active_al_test, with the substitutes the text allows when the coefficient is missing. Paddy land is read from site$land_use (rice, paddy, the Japanese word; not upland rice) or site$flood_irrigated; with no land use recorded the paddy horizons are undecided, not absent."
  - topic: "Soil surface"
    page: "IV.4, soil surface (pp. 29-30)"
    reading: "The ground surface (the top of the first horizon) when the first horizon is peat material, or the site is artificially drained (site$artificially_drained) or very poorly drained (saturated for most of the year). Otherwise a forest floor on top (organic material: an O horizon unless its carbon is measured under 20 %) is skipped: the soil surface is the top of the first horizon with the kuroboku feature or that is not organic material. A site whose drainage is not recorded is read as not saturated for that rule, since forest floors seldom are. When the first horizons cannot be read (it is not known whether they are a forest floor), the soil surface is undecided and so is every gate. Depths in the key are from the soil surface."
  - topic: "Horizon notation"
    page: "IV.4, master horizons (pp. 30-31)"
    reading: "The Japanese notation of the Soil Survey Handbook (JSP 1997) is read: a lithologic number (2, 3 or II, III), masters H, O (Oi, Oe, Oa), A, E, B, C, G (Go, Gr) and R, transitions (AB, BC, A/B), and the suffixes p (plough layer), g (gleyed or redox-mottled), t, w, s, h, k, ir and mn, b (buried) and trailing digits. The FAO/USDA notation is read by the same letters; a leading ^ (USDA human-transported material) is fill. A Cr is weathered (semi-weathered) bedrock, as in the USDA notation, unless the site declares the FAO notation (site$designation_system 'fao'), where it is a strongly reduced C, the G of Japan. The forest-floor notation (L, F, H, the A0 layers of forest soil surveys) is read as O horizons; with L or F recorded, an H above the first mineral horizon is the humus layer of the floor, not peat (Hugo, 2026-10-31). The Australian, Canadian and New Zealand notations are not read (site$designation_system in any of their spellings: asc, cssc, cssc3, nzsc, New Zealand ...); the FAO notation is declared by fao, wrb, wrb2022 and the like."
  - topic: "Materials from the description: fill, volcanic ejecta, alluvial deposits"
    page: "IV.3 (pp. 27-28); II A, C, E, G"
    reading: "Read from the recorded origin of the layers and, for a layer with none (a fill excepted), the site parent material; a profile that records none of them has none (recorded when present). Fill: layer_origin words such as fill, backfill, made ground, dredged material, soil dressing, spoil, landfill and the Japanese words for fill, soil dressing and dredged material, or a ^ of the notation. Volcanic ejecta (pyroclastic materials): tephra, volcanic ash, ash fall, pumice, scoria, lapilli, pyroclastic, cinders, volcanic sand and the Japanese words, from layer_origin or rock_origin (pumice or scoria fragments); not volcanic rock (rock, lava, andesite, basalt, rhyolite, dacite, tuff and the Japanese word for rock), not non-volcanic material, not ash redeposited as dunes. Alluvial deposits (Holocene, unconsolidated): alluvium, fluvial, river, marine, lacustrine, estuarine, delta, lagoon, backswamp, floodplain, Holocene and the Japanese words, from layer_origin or the parent material only (rock_origin names the rock the material came from); not Pleistocene, terrace, Tertiary, Miocene, Pliocene or glacial deposits, nor rock (mudstone, sandstone, shale ...). A fill row keeps the material it records ('fill (river alluvium)'): a fill of the same material is part of an ordinary profile (chapter VI, the fill phase), and the 35 cm rules of the key name a fill of other material (0.9.322). The canonical layer_origin values tephric and fluvic are read as volcanic ejecta and alluvial deposits."
  - topic: "Peat material and organic material"
    page: "IV.3, peat material and organic material (p. 28)"
    reading: "Measured carbon decides. Peat material is 12 % organic carbon or more without the kuroboku feature (or with it, when a sixth of the volume or more is fibre after rubbing); without a carbon value an H horizon is peat material. An O horizon is never peat: it is organic material of the forest floor, unless its carbon is measured under 20 %. An undesignated layer of 20 % carbon or more is peat on a poorly or very poorly drained site and organic material on any other recorded drainage class, undecided without one (Hugo, 2026-10-31). A designated horizon of another master without a carbon value is neither."
  - topic: "Kuroboku feature"
    page: "IV.2, kuroboku feature (p. 25)"
    reading: "A measured phosphate absorption coefficient decides (1500 mg P2O5/100 g or more). Without it, a measured substitute that passes decides (P retention 85 % or more, or Alo + 1/2 Feo 2.0 % or more), and so do substitutes that all fail. Without any of them, the field active-aluminium test of the text's field note: a vivid red within a minute (2+ or more) is the feature, none or +- is not, + is undecided. Rubbed fibre not recorded is read as under a sixth of the volume, except in H and O horizons."
  - topic: "Immature kuroboku feature"
    page: "IV.2, immature kuroboku feature (p. 27)"
    reading: "A layer with the kuroboku feature does not have the immature one (the field note of IV.2 splits ejecta layers between the two). Volcanic ejecta (60 % or more by weight) are read from the recorded origin; coarse fragments not recorded are read as under half of the area. The third criterion is a coefficient of 300 to under 1500 (P retention 25 to under 85 %, or Alo + 1/2 Feo 0.4 to under 2.0 %) or 3 % carbon or more."
  - topic: "Gley feature and physical immaturity"
    page: "IV.2, gley feature and physical immaturity (pp. 25-27); IV.4, G"
    reading: "The dipyridyl reaction is the existing childs_test attribute (2,2'-bipyridine): positive (or +, 2+, strong, immediate) is an immediate vivid reaction; negative, - or a weak +- is not. Measured tests decide; a G horizon of the notation has the gley feature when they do not (the text defines G by that reaction, or a soft blue-grey layer); another master of a designated profile has not. Physically immature: the material squeezes between the fingers (fluidity_class slightly, moderately or very fluid) or an n value of 1 or more (the new attribute n_value, as recorded: soilKey has no field water content to compute it)."
  - topic: "Wetness features (groundwater and surface water)"
    page: "IV.2, groundwater and surface-water wetness features (pp. 25-26)"
    reading: "Saturation at some time of the year is read from redox mottles of 2 % or more (or a g suffix). Where the mottles are tells the kind: on ped faces or pore walls (redox_segregations_location: ped faces, voids) the groundwater feature; within peds or in the matrix (grey faces, redder and more chromatic interiors) the surface-water feature; a g suffix or mottles without a location are one of the two, not said which, which is enough where the key accepts either. A designated horizon without g and without a mottle record has neither; neither goes with the gley feature."
  - topic: "Argic (clay accumulation) horizon"
    page: "IV.1, argic horizon (p. 22)"
    reading: "Criterion (1) is read against the horizon directly above: a horizon of another lithologic number is not an argic horizon. Clay coatings are a t of the notation or recorded clay films; a designated horizon without t and without a clay-film record has none (surveyors write t). A Bt without a clay value is read as 8 % clay or more. The clay increase is measured against each mineral horizon above in the same lithologic layer whose base is within 30 cm above the horizon's top; with no such horizon there is no increase to measure. In a designated profile, a horizon without t whose increase cannot be measured (no clay values) is not one. The 7.5 cm is the run of adjacent rows."
  - topic: "Weathered (cambic) horizon"
    page: "IV.1, weathered horizon (p. 23)"
    reading: "A B horizon of the notation with no mark of another horizon (not t, s, h or G) has the weathering of criteria 1 and 2 (the B master is defined by the loss of rock structure and soil development); an undesignated horizon below the first by a recorded structure grade other than structureless; A, E and C horizons are not weathered horizons. Texture not recorded is read as sandy loam or finer for such a B. Criterion 5 removes the argic, gley, pseudogley, paddy iron accumulation and paddy greyed horizons, and an undecided one leaves the weathered horizon undecided. A podzolic accumulation horizon and a bleached horizon are not removed: the Brown Forest soils have a Podzolic subgroup, and a pale B is not an eluvial horizon. The 15 cm is the run of adjacent rows."
  - topic: "Bleached and podzolic accumulation horizons; Podzols"
    page: "IV.1, bleached horizon and podzolic accumulation horizon (pp. 23-24); II D"
    reading: "Without a colour, an E horizon is a bleached horizon; a Bs, Bh or Bhs never is. An E horizon is never a podzolic accumulation horizon. A Bs, Bh or Bhs is the visible free-oxide accumulation of colour criterion c (with the reddest hue of the profile, not required over a buried soil); a designated horizon without s or h is not, nor (without Alo and Feo) one by analysis. Criterion (2) of the morphology, no layer with the red-yellow feature and no argic horizon, is read for the soil, as its verb says (Hugo, 2026-10-31). The analysis compares Alo + 1/2 Feo with the lowest value of the A and bleached horizons. In the Podzols gate the bleached horizon must lie above the accumulation horizon (the sequence of the great group's concept; Hugo, 2026-10-31), both in one lithologic layer (one parent material; candidate horizons are split at lithologic boundaries, so a pair inside one material is found even next to a layer of another); an analysis horizon with a morphology horizon may be at any depth. The paddy surface horizon of criterion (2) is the unbleached one (the text names it alone)."
  - topic: "Red-yellow feature"
    page: "IV.2, red-yellow feature (p. 25); IV.4, soil colour (p. 29)"
    reading: "Red and yellow are the colour words of IV.4 on the moist matrix colour (red: 5YR or redder, value over 3, chroma 3 or more, not 4/3 or 4/4; yellow: yellower than 5YR, value 3 or more, chroma 6 or more, not 3/6 or 4/6; hues of 10Y or bluer are blue-grey; purple hues count as redder than 5YR). A value or chroma alone that rules a word out decides it without the hue (a value under 3 is never brown). Carbon not measured: a B, C or E horizon (not a Bh or Bs) is read as under 2 %; the red-yellow weathered horizon (under 1 %) needs a measured carbon. The Red-Yellow soils' 25 cm are those of one horizon (adjacent layers, a gap breaking it) whose top is within 50 cm (the argic horizon with the feature) or 35 cm (the red-yellow weathered horizon), not added up over separate horizons (Hugo, 2026-11-01)."
  - topic: "Paddy horizons"
    page: "IV.1, paddy surface, bleached paddy surface, paddy iron accumulation, paddy greyed horizons (pp. 20-22)"
    reading: "The plough layer is an Ap (Ap1, Ap2: a former plough layer counts too). On paddy land an Ap run of 7.5 cm or more is the paddy surface horizon (mottles of 2 % or more and Fe(d) 0.4 % or more) or the bleached one (fewer mottles and Fe(d) under 0.4 %). The paddy iron accumulation horizon is the horizon directly under it, 2 cm or more by either route (thickness unknown: undecided), with Fe(d) twice that of the plough layer (1.6 times at 5 cm, 1.4 times at 10 cm, as the note allows); without Fe(d), an ir or mn of the notation; with its own Fe(d) but not the plough layer's, undecided. The paddy greyed horizon is the run directly under it with the surface-water feature, 10 cm or more."
  - topic: "Subsurface control section and base status"
    page: "IV.4, subsurface (p. 30); II F (2), II H (2)"
    reading: "The subsurface is the horizons with 5 cm or more between 20 and 60 cm of the soil surface (Hugo, 2026-10-31), the plough layer excepted, cut at the top of a gravel layer (gravel_pct or coarse_fragments_pct 20 % or more, Hugo, 2026-11-01) that reaches into the section (one from above 20 cm leaves no subsurface, as the bedrock does; Hugo, 2026-11-01), or of the bedrock, when either appears within 60 cm of the ground surface (the text measures that limit from the ground). Red-Yellow soils need one subhorizon with pH(H2O) under 5.5 or base saturation under 50 %; Eutrosols need every subhorizon with pH(H2O) 5.5 or more or base saturation 50 % or more, and are undecided when site$acid_neutralising_amendment says the soil was limed (the text excludes a status that comes from liming). A horizon without a bottom that starts in the section counts, and covers the section only possibly; a section the closed horizons do not cover leaves both undecided where the missing part could change them. With no subsurface at all (a gravel layer or the bedrock from 20 cm, or a plough layer through the section), neither criterion is met (Hugo, 2026-11-01)."
  - topic: "Bedrock within 30 cm"
    page: "II F (3), H (3), I (2); IV.4, bedrock"
    reading: "Bedrock is an R horizon, or a Cr outside the FAO notation (semi-weathered bedrock). A row whose designation cannot be read, or an undesignated row without fine-earth data in a designated profile, may be bedrock. A profile whose closed horizons reach below 30 cm without it has none within 30 cm; one that stops above 30 cm without it is undecided, a last horizon without a bottom included (it may end at once)."
  - topic: "Missing depths"
    page: "-"
    reading: "A horizon without a bottom depth (the deepest, after the classifier fills the others from the next top) counts as possibly extending down from its top: it adds to the possible thickness of a horizon, never to the certain one."
  - topic: "Man-made soils"
    page: "II A (p. 2); IV.3, artificial material, heterogeneous soil material"
    reading: "Artificial material is artefacts_pct (20 % or more of the section); a continuous impermeable artificial layer is technic hard material of 90 % or more (from its horizon's top) or a geomembrane, at site$geomembrane_depth_cm when recorded and otherwise somewhere in the horizon marked geomembrane_present (undecided when that horizon spans 30 cm). Fill of heterogeneous soil material: the fill (35 cm or more, from the soil surface) and the soil under it key, each on its own, to different great groups (B to J); a recorded fill is read as not a natural combination of materials. The classes each part may key to are compared (a Regosol by its groups: in Regosols, material of another group is heterogeneous too): no class in common is heterogeneous, one and the same class is not, anything else is undecided. The fill keyed on its own is complete; the soil under it only where the original profile ends on rock. Criterion (1) is checked on the fill and the layers of artificial material."
  - topic: "Stagnic soils"
    page: "II G (p. 4)"
    reading: "The gley layer and the wetness layers are taken together: a run of adjacent rows, each with the gley feature or a wetness feature, 10 cm or more, its top within 50 cm, reaching 50 cm or deeper or the bedrock. A gap in the description, or a description that stops above 50 cm, leaves the gate undecided where it could pass."
  - topic: "Gley layers: groundwater, stagnant and paddy reverse gley (groups C3, E2, G1)"
    page: "IV.1, subdivisions of the gley layer (p. 20); III C, E, G"
    reading: "A gley layer (gley feature, 10 cm or more) is a run of adjacent gley horizons, taken together (Hugo, 2026-10-31: the text's 'several gley layers' are adjacent ones; an oxidised layer between two gley layers separates them). A groundwater gley layer reaches 75 cm or deeper; a gley layer without a bottom depth, or ending where a description stops (not on rock), may: undecided; its certain depth is its last closed bottom, or the top of its open last horizon. Gaps and undescribed depth leave a gley layer undecided only where, with the horizons that may have the feature, they could make one of the depth the group needs (a 5 cm gap between horizons without the feature cannot). Stagnogley soils need a gley layer whose top is within 50 cm, reaching 50 cm or deeper or the bedrock."
  - topic: "Groundwater wetness layer (groups C4, E3)"
    page: "III C (p. 8), E (p. 11)"
    reading: "A layer with the groundwater wetness feature counts at any thickness (the groups name no thickness); its top within 50 cm; a gap in the description above 50 cm leaves it undecided. On paddy land the paddy surface, paddy iron accumulation and paddy greyed horizons do not count, their mottles coming from the irrigation water (Hugo, 2026-10-31; chapter VI: paddy fields on well-drained Andosols are not Wet Andosols); with no land use recorded, their wetness is undecided."
  - topic: "Non-allophanic kuroboku feature (group C5)"
    page: "IV.2, non-allophanic kuroboku feature (p. 26)"
    reading: "The kuroboku feature with an exchange acidity y1 of 5 or more (the new attribute exchange_acidity_y1), Sio under 0.6 % (si_ox_pct) or Alp/Alo 0.5 or more (al_pyro_pct / al_ox_pct). On farmland y1 is not read, as the text says (fertilising and liming change it). A recorded land use decides: paddy land, or whole words for crops, cropping, fields, arable land, cultivation, farms, orchards, tea gardens, vegetables, pasture or upland rice (or the Japanese words for upland fields, orchards, tea gardens, farmland, improved grassland and upland rice), not 'uncultivated' or 'non-farm', not forests or wild grassland. With no land use recorded, a plough layer (not buried) says farmland; with neither, a passing y1 is undecided."
  - topic: "Brown Fluvic soils (group E4)"
    page: "III E (p. 11); IV.4, subsurface (p. 30)"
    reading: "The subsurface colour is the colour of the thickest horizon of the subsurface section (the text: several horizons in 20-60 cm are represented by the thickest), by the colour word brown of IV.4; horizons of equal thickness must agree. A section the description does not cover, or an open thickest horizon, leaves it undecided unless the thickest horizon is thicker than what is not described; no section at all (gravel or bedrock at 20 cm) is not brown."
  - topic: "Fluvic Paddy soils (group E1)"
    page: "III E (p. 10)"
    reading: "A paddy iron accumulation horizon, or a paddy greyed horizon whose lower boundary is 50 cm or deeper from the soil surface. A description that stops at the plough layer or inside the greyed horizon (not on rock) leaves it undecided."
  - topic: "Magnesian Eutrosols (group H1)"
    page: "III H (p. 14)"
    reading: "The exchangeable Ca/Mg ratio of each subhorizon of the subsurface section (ca_cmol / mg_cmol; no magnesium reads as a large ratio): one under 0.1, or every one under 1.0."
  - topic: "Regosols (groups J1 to J4)"
    page: "III J (p. 15)"
    reading: "Volcanogenous Regosols: 25 cm or more of volcanic ejecta within 50 cm; the undeveloped horizons the text names are those of a Regosol. Volcanogenous Regosols also need undeveloped horizons: no weathered or argic horizon, a buried one not counting (Hugo, 2026-11-01). Sandy Regosols: every horizon to 100 cm with coarse fragments under 35 % (coarse_fragments_pct, else gravel_pct; not recorded: under 35 %) and a texture of loamy sand or coarser (field texture, else lab silt + 2 clay under 30); bedrock or an organic layer within 100 cm is not sand (the text names no bedrock alternative, unlike the Marlitic subgroup); a gap or a description that stops above 100 cm is undecided. Argic Red-Yellow soils: an argic horizon within 1 m (the depth the system classifies). Lithosols: consolidated bedrock (an R horizon) within 30 cm; a Cr (semi-weathered bedrock) is not consolidated, as the Para-lithic subgroup of the Terrestrial Regosols shows."
