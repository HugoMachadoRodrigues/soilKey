# Groups of the Man-made soils, Soil Classification System of Japan (2017),
# chapter III A (p. 7). Criteria summarised from the text; see
# R/diagnostics-scsj-groups.R and inst/rules/scsj2017/readings.yaml.
groups:
  "A":
    - code: "A1"
      name: Artifactual soils
      name_native: 人工物質土
      tests:
        all_of:
          - artifactual_soils_scsj: {}
      notes: "25 cm or more (cumulative) of layers with 20 % or more artificial material within 50 cm, or a continuous impermeable artificial layer within 30 cm."
    - code: "A2"
      name: Reformed soils
      name_native: 盛土造成土
      tests:
        default: true
      notes: "Other Man-made soils (a fill of heterogeneous soil material)."
