# Groups of the Regosols, Soil Classification System of Japan (2017),
# chapter III J (p. 15). Criteria summarised from the text; see
# R/diagnostics-scsj-groups.R and inst/rules/scsj2017/readings.yaml.
groups:
  "J":
    - code: "J1"
      name: Volcanogenous Regosols
      name_native: 火山放出物未熟土
      tests:
        all_of:
          - volcanogenous_regosols_scsj: {}
      notes: "Undeveloped horizons and 25 cm or more (cumulative) of volcanic ejecta within 50 cm."
    - code: "J2"
      name: Sandy Regosols
      name_native: 砂質未熟土
      tests:
        all_of:
          - sandy_regosols_scsj: {}
      notes: "To 100 cm, coarse fragments under 35 % and a texture of loamy sand or coarser (calcareous and coral sands included)."
    - code: "J3"
      name: Lithosols
      name_native: 固結岩屑土
      tests:
        all_of:
          - lithosols_scsj: {}
      notes: "Consolidated bedrock within 30 cm."
    - code: "J4"
      name: Terrestrial Regosols
      name_native: 陸成未熟土
      tests:
        default: true
      notes: "Other Regosols."
