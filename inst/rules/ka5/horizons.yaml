  - {code: "Gso",   master: G, page: 104, detection: strong, name: "Go mit Raseneisen", name_en: "Go with bog iron", definition: "Clear unconsolidated bog iron."}
  - {code: "Gkso",  master: G, page: 104, name: "Go mit Raseneisenkonkretionen", name_en: "Go with bog-iron concretions", definition: "Bog-iron concretions."}
  - {code: "Gmso",  master: G, page: 104, name: "Go mit Raseneisenstein", name_en: "Go with banked bog-iron stone", definition: "Banked bog-iron stone."}
  - {code: "Gro",   master: G, page: 105, name: "Go mit Reduktionsmerkmalen", name_en: "Go with about equal reducing and oxidising periods", definition: "5 % or more rust spots; reduction colours present, 10 to 50 %."}
  - {code: "Gcro",  master: G, page: 105, name: "Gro mit sekundärem Carbonat", name_en: "Gro with secondary carbonate", definition: "Gro with secondary carbonate."}
  - {code: "Ghro",  master: G, page: 105, name: "Gro mit sekundärem Humus", name_en: "Gro with secondary humus", definition: "Gro with secondary humus."}
  - {code: "Gzro",  master: G, page: 105, name: "Gro mit sekundären Salzen", name_en: "Gro with secondary salts", definition: "Gro with secondary salts."}
  - {code: "Gw",    master: G, page: 105, name: "zeitweilig grundwassererfüllter G-Horizont", name_en: "temporarily water-filled G without features", definition: "Above a Gr, without the features of other G horizons for lack of colouring material; no positive dipyridyl test."}
