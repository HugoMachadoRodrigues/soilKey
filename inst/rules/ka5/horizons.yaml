  - {code: "Ghr",   master: G, page: 106, name: "Gr mit sekundärem Humus", name_en: "Gr with secondary humus", definition: "Gr with secondary humus."}
  - {code: "Gcr",   master: G, page: 106, name: "Gr mit sekundärem Carbonat", name_en: "Gr with secondary carbonate", definition: "Gr with secondary carbonate."}
  - {code: "Gzr",   master: G, page: 106, name: "Gr mit sekundären Salzen", name_en: "Gr with secondary salts", definition: "Gr with secondary salts."}
  - {code: "Gor",   master: G, page: 106, detection: strong, name: "Gr mit Oxidationsmerkmalen", name_en: "Gr with mostly reducing conditions", definition: "5 % or more rust spots; reduction colours dominant (> 50 %)."}
  - {code: "Ghor",  master: G, page: 106, name: "Gor mit sekundärem Humus", name_en: "Gor with secondary humus", definition: "Gor with secondary humus."}
  - {code: "Gcor",  master: G, page: 106, name: "Gor mit sekundärem Carbonat", name_en: "Gor with secondary carbonate", definition: "Gor with secondary carbonate."}
  - {code: "Gzor",  master: G, page: 106, name: "Gor mit sekundären Salzen", name_en: "Gor with secondary salts", definition: "Gor with secondary salts."}
  # --- M, E, R, Y (pp. 106-108) ---------------------------------------------------------
  - {code: "M",     master: M, page: 106, name: "M-Horizont", name_en: "colluvial solum material", definition: "Holocene sedimented solum material: organic substance as an Ah or chroma 3 or more, visible stratification, no dominant features of other horizons."}
