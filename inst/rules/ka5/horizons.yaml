  - {code: "Cc",    master: C, page: 100, name: "C mit sekundärem Carbonat", name_en: "C with secondary carbonate", definition: "Visible secondary carbonate."}
  - {code: "Ckc",   master: C, page: 100, name: "Cc mit Carbonatkonkretionen", name_en: "Cc with carbonate concretions", definition: "Secondary carbonate concretions (Lösskindel)."}
  # --- P (pp. 100-101) ---------------------------------------------------------------
  - {code: "P",     master: P, page: 100, detection: likely, name: "P-Horizont", name_en: "Pelosol subsoil", definition: "From clay or clay-marl stone; coarse prisms and blocks, marked shrink-swell, cracks to > 5 dm; clay as a rule > 45 %; S features at most subordinate."}
  - {code: "Ah-P",  master: P, page: 100, name: "P mit Humus wie Ah", name_en: "P with the Ah humus minimum", definition: "P with humus as an Ah."}
