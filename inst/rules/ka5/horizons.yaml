# Field codes of the KA5 description sheet that look like designations
# (fields 30 and 31, p. 113; field 34, p. 116): features, never horizons. In a
# profile not in the KA5 notation, Ck and Oe keep their FAO or USDA meaning.
field_codes:
  - {code: "Ck",  field: 34, page: 116, name_en: "secondary carbonate concretions (Lösskindel)"}
  - {code: "Oe",  field: 34, page: 116, name_en: "Orterde (weakly cemented)"}
