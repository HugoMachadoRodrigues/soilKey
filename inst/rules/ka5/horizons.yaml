# Recognising an undeclared profile (Hugo's decision Q3, 2026-11-04): one
# strong sign, or two likely ones of two kinds, and no symbol only another
# notation writes. The strong symbols are exactly those of the decision card
# (Sw, Sd, Srw, Sew, Sq, Tv, Tu, Axh, Ael, Ahe, Bfv, Bsv, Bbt, Gor, Gso, Ex),
# marked in `symbols`; these are the signs that are not one symbol.
detection:
  strong_rules:
    - "the degree sign joining two parts (fAh°Sd)"
    - "a lower-case prefix before a capital master (lC, mC, xC, cC, eC, iC, fAh, rGo, aM, aAh, tmGo, jY, yC, oG)"
    - "a base-saturation mark after a symbol (Ah>, Bv<<)"
  likely_rules:
    - "E under an Ah over a layer II"
    - "M over a layer II"
  foreign:
    fao_usda: "a B, C, A, E, H or O with a suffix KA5 does not write on it (Bw, Bk, Bg, Btg, Bss, Bf, Bm, Cr, Cg, Oi, Oa, Ag, Eg, Hi, He), the Canadian j with other letters (Btj, Bmj, Aej), Ck and Oe written as designations, two masters run together (AB, BC, LFH), a slash inside a designation (E/B), or an Arabic layer number (2Bt)"
    rp: "a code only the RP 2008 writes that KA5 does not define (OL, OF, OH, BP, LA, SV, FS, Sca, Aca, Kc, Js ...)"
    russian: "a profile the Russian reader recognises (AY, EL, BHF, BCA, PU, TUR ...)"
    cpcs: "a symbol only the CPCS 1967 writes (A00, A0, (B), Bfe, Can, an A2 used as E)"

