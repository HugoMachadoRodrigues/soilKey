  - {code: "Bv-P",  master: P, page: 101, name: "P mit Bv-Merkmalen", name_en: "P with Bv features", definition: "As P but < 45 % clay and with Bv features."}
  # --- T (p. 101) ---------------------------------------------------------------------
  - {code: "T",     master: T, page: 101, detection: likely, name: "T-Horizont", name_en: "Terra subsoil", definition: "From the solution residue of carbonate rock; clay 65 % or more (45 to 65 % in transitions); marked subangular blocky; fine earth free of primary carbonate."}
