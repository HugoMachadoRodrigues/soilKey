  - {code: "Tcv",   master: T, page: 101, name: "Tv mit sekundärem Carbonat", name_en: "Tv with secondary carbonate", definition: "Tv with secondary carbonate."}
  - {code: "Tu",    master: T, page: 101, detection: strong, name: "Terra rossa-Horizont", name_en: "rubefied T", definition: "Redder than 5YR; only fossil or relict in Germany."}
  # --- S (pp. 101-103) ---------------------------------------------------------------
  - {code: "S",     master: S, page: 101, name: "S-Horizont", name_en: "perched-water subsoil", definition: "Subsoil with perched-water influence, at times wet."}
  - {code: "Sw",    master: S, page: 101, detection: strong, name: "Stauwasserleiter", name_en: "perched-water conducting S", definition: "80 % or more of the area with wet bleaching and oxidation features; rH 19 or less or a positive dipyridyl test in wet phases; more permeable than the Sd below."}
  - {code: "Sdw",   master: S, page: 102, name: "schwach stauender Sw", name_en: "weakly stagnating Sw", definition: "Permeability a little above 10 cm/d."}
  - {code: "Sew",   master: S, page: 102, detection: strong, name: "stark gebleichter Sw", name_en: "strongly bleached Sw", definition: "Depleted in sesquioxides by wet bleaching; value moist 4 or more, value/chroma 2.5 or more; < 5 % rust."}
  - {code: "Scw",   master: S, page: 102, name: "Sw mit sekundärem Carbonat", name_en: "Sw with secondary carbonate", definition: "Sw with secondary carbonate."}
  - {code: "Ssw",   master: S, page: 102, name: "Sw mit Sesquioxidanreicherung", name_en: "Sw enriched with sesquioxides", definition: "Sw enriched with sesquioxides."}
  - {code: "Srw",   master: S, page: 102, detection: strong, name: "langzeitig nasser Sw", name_en: "long-wet Sw", definition: "Wet about 200 to 300 days a year; reduction features; rust only on root channels."}
  - {code: "Serw",  master: S, page: 102, name: "gebleichter Srw", name_en: "bleached Srw", definition: "Srw clearly depleted in sesquioxides."}
  - {code: "Ah-Sw", master: S, page: 102, name: "Sw mit Humus wie Ah", name_en: "Sw with the Ah humus minimum", definition: "Sw with humus as an Ah."}
  - {code: "Ah-Srw", master: S, page: 102, name: "Srw mit Humus wie Ah", name_en: "Srw with the Ah humus minimum", definition: "Srw with humus as an Ah."}
  - {code: "Sd",    master: S, page: 102, detection: strong, name: "Staukörper", name_en: "stagnating S", definition: "As a rule 50 to 70 % rust and bleached spots and marbled; less permeable than the Sw above (< 10 cm/d); air capacity < 3 %."}
  - {code: "Scd",   master: S, page: 103, name: "Sd mit sekundärem Carbonat", name_en: "Sd with secondary carbonate", definition: "Sd with secondary carbonate."}
  - {code: "Srd",   master: S, page: 103, name: "reduzierter Sd", name_en: "reduced Sd", definition: "Reduction features and permanent air shortage."}
  - {code: "Swd",   master: S, page: 103, name: "schwach stauwasserleitender Sd", name_en: "weakly conducting Sd", definition: "Permeability mostly a little below 10 cm/d."}
  - {code: "Sg",    master: S, page: 103, name: "haftnasser S-Horizont", name_en: "adhesive-water wet S", definition: "80 % or more bleaching and oxidation features with Sd features; air shortage at field capacity; high silt and finest sand."}
  - {code: "Sdg",   master: S, page: 103, name: "toniger Sg", name_en: "Sg with 17 to < 35 % clay", definition: "Sg with 17 to < 35 % clay."}
  - {code: "Sq",    master: S, page: 103, detection: strong, name: "Knickhorizont", name_en: "Knick horizon", definition: "Stagnating and solonetz-like horizon of the Knickmarsch (strong or weak)."}
  # --- G (pp. 104-106) ---------------------------------------------------------------
