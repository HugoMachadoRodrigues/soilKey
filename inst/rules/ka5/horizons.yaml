  - {code: "Bv-Cv", master: C, page: 100, name: "Cv mit Bv-Merkmalen", name_en: "Cv with Bv features", definition: "Cv with Bv features below the Bv limits."}
  - {code: "Bbt+Cv", master: C, page: 100, name: "Cv mit Tonbändern", name_en: "Cv with clay bands", definition: "Clay bands mostly < 1 cm, together 10 to < 50 % of the area."}
  - {code: "Ctv",   master: C, page: 100, name: "Cv mit schwacher Tonanreicherung", name_en: "Cv with weak clay enrichment", definition: "Weak or diffuse, low-area clay enrichment."}
