# The readings soilKey makes of the German soil systematics of the
# Bodenkundliche Kartieranleitung, 5th edition (Ad-hoc-AG Boden, Hannover
# 2005, KA5) where the text is silent or ambiguous. An entry ending "(Hugo,
# 2026-11-04)" is a decision of the owner, in soilKey's words; an entry ending
# "(soilKey's reading, for Hugo to confirm, 2026-11-05)" is soilKey's own and
# waits for his word. Hugo confirmed soilKey's nine readings of the first draft
# on 2026-11-04, changing two (1 and 8), and decided the points of its review. Pages are the printed pages of the book (PDF page =
# printed + 1). The criteria are paraphrased; no text of the book is shipped.
readings:
  - topic: "Registry names and declared notations"
    page: "pp. 81, 190"
    reading: "The KA5 will be the system ka5, namespace ka5, aliases germany, kartieranleitung and bodensystematik; site$designation_system declares its notation with ka5, ka4, ka3, kartieranleitung, bodensystematik, agboden or dbg (and any value starting with them); KA3 and KA4 are read as KA5 with a note that the G horizons were redefined in 2005 (Q2) (Hugo, 2026-11-04)."
  - topic: "Recognising the notation"
    page: "pp. 82-88"
    reading: "As the decision card reads: \"Declarada, ou um sinal forte só da KA5 (o sinal de grau \"°\", um prefixo minúsculo antes da maiúscula como lC, mC, fAh, aM, tmGo, as marcas > < <<, Sw, Sd, Srw, Sew, Sq, Tv, Tu, Axh, Ael, Ahe, Bfv, Bsv, Bbt, Gor, Gso, Ex) ou dois prováveis (Bv, Cv, Cn, Al, Aa, Hm, Hw), sem símbolo só da FAO/USDA (Bw, Bk, Bg, Oi, Oe, Oa, 2Bt), do RP, do russo ou do CPCS; perfil misto = notação indecisa. Nunca pelo país.\" The strong symbols are exactly those of the card (Btv, Acxh, Srd and the others the plan listed are not signs); the likely ones are the card's with Hr, P, T, an E under an Ah over a layer II and an M over a layer II as the plan lists them (Q3) (Hugo, 2026-11-04)."
  - topic: "KA6 symbols"
    page: "KA6 decks (DBG 2022-2023)"
    reading: "The KA6 symbols with a one-to-one KA5 reading (Ol, Ax, Ee, El, Eal, Ks, Kh, Kt, Khs, Dj, De, Mm, Pv) are read as L, Axh, Ae, Al, Ael, Bs, Bh, Bt, Bhs, M, E, aM and P with a flag; N, V, U, W, Hn, Au and the new prefixes stay unread; a profile declared ka6 is read so and labelled (Q4) (Hugo, 2026-11-04)."
  - topic: "The last symbol carries the horizon"
    page: "pp. 82, 191"
    reading: "In a designation and in a formula the last part carries the horizon (Ah-Bv is a Bv, Bv+Ah an Ah, fAh°Sd an Sd), in the key gates and in the subtype windows alike (Q8) (Hugo, 2026-11-04)."
  - topic: "Defaults of the reader"
    page: "pp. 82-88, 108, 199"
    reading: "A combination outside Tab. 12 or 5.6.3.3 is read by the grammar with a note (p. 82); a prefix written on a master its list does not name is read with a note; trailing digits are sub-horizons; a capital I before C in a KA5 profile is the prefix l (IC, ICv), AI is read Al with a note; a letter in parentheses gives a set of readings (B(h)s = Bs or Bhs), the data choose, with no data the reading without the letter, flagged; the base-saturation mark is read last, its scale is the key's (Q14); the field codes of fields 30, 31 and 34 (Ck, Oe, Ost ...) are never designations; the degree sign typed o or O is read only in a KA5 profile and only when the result reads; fGo-°Sd (p. 201) is fGo°Sd (defaults 11, 12, 13) (Hugo, 2026-11-04)."
  - topic: "Attributes"
    page: "pp. 50-55, 102-116, 310-316"
    reading: "The 37 entries of the plan's section 7 enter the schemas (26 horizon columns, 13 site properties, four layer_origin values, the l-mull and f-mull humus forms); the KA5 field codes (humus h0-h7, carbonate c0-c7, Bodenart, colour words, hydromorphic features) are read into them by their class ranges; the informative ones (wetness degree, boundary form and inclination, micromorphology) stay out (Q24) (Hugo, 2026-11-04)."
  - topic: "A geogenic prefix written in front"
    page: "pp. 82-84, 241, 249-252"
    reading: "A geogenic prefix written in front of a designation of several parts (a, tb, tm, tp, e, z, s, q, o) holds for the whole horizon, in the profile frame and in the formula: aSw-Ah is an aAh with Sw features, tmzeGo-Ah a tmzeAh; f and r (fossil, relict) hold only for their part (fAh°Sd is a present Sd in a fossil Ah), and the rock prefixes c, i, j, l, m, x, y only for theirs. So aSw-Ah/aSw-M/aM-Sd/aG is a Pseudogley-Vega by its own formula a(Sw-)Ah/aSw-M/a(M-)Sd/aG (Hugo's decision on reading 1, 2026-11-04, changing soilKey's reading, which put the prefix on both parts only inside the formulas)."
  - topic: "Two horizons with one carrying code"
    page: "pp. 82, 199-262"
    reading: "In the frame the sequence engine reads, the token code of a horizon is its whole symbol without numeral and digits (Bv-Ah, ilCv, fAh°Sd, Ah<), and the carrying code and the master are its overlay: a formula slot written Ah takes Bv-Ah, a slot written G takes Go, and sub-horizons (Bv1, Bv2) merge (Hugo, 2026-11-04). For each formula, before the engine reads the table (its prepare_table hook, which only KA5 formulas carry): a transitional row merges into the neighbour with the same carrying code (Al+Bt into the Bt, Sw-Sd into the Sd, Go-Bv into the Bv, Ex-C into the C) unless the formula names the transition in a slot of its own (Ah/Ah-Go/(Go/)Gr); a slot written as a master without suffix (C, G, aG, O) or with commas takes a run of consecutive rows that fit it, since a bare master stands for one or several of its combinations and commas mean alternatives or a sequence (p. 199): Ah/Bv/Cv/Cn is Ah/Bv/C, Ahe/Ae/Bsh/Bhs/Bs/Bv/Cv is Ahe/Ae/Bsh,Bhs,Bs/Bv/Cv, L/Of/Oh/mC is O/mC (the review's D1; Hugo, 2026-11-04)."
  - topic: "Ap for Ah"
    page: "p. 199"
    reading: "Ah and Ap are used alike for topsoils in the formulas: an Ap, with prefixes or a base-saturation mark, takes a formula's plain Ah slot (the review's D2; Hugo, 2026-11-04)."
  - topic: "Buried soils, open ends and wildcards in the formulas"
    page: "pp. 199-201, 235"
    reading: "II... (and III(f)...) is the slot of a buried soil (the engine's [ABC]), optional, since a description may stop above it; in the frame the buried soil runs from the first fossil (f) row of a layer II or deeper downward, so Ah/M/IIfAh/IIBv is a Kolluvisol and Ah/E/IIfAh/IIfBv a Plaggenesch (the review's D3); ... at the start or the end is an open slot the engine does not test; R+... is an R interfingered with any horizon; (...fF/) an fF in any layer; a joined head written only on the first alternative holds for the others (R+B(h)s,B(s)h: R+B(s)h too; the review's R6) (Hugo, 2026-11-04)."
  - topic: "Numerals in the formulas"
    page: "pp. 201, 229-235, 245, 254"
    reading: "A numeral written before an optional group holds for that group and for the horizon after it (II(Sw/)Sd: IISw and IISd); a numeral on the first of several alternatives holds for the others (IIfAe°Go,fAe°Gr: both in layer II); II(III)aM is layer II or III; (II)Sd an optional numeral. Options: (a) as chosen; (b) a numeral only where it is written. Hugo chose (a) (2026-11-04)."
  - topic: "The FAO, USDA and Canadian vetoes"
    page: "pp. 82-88"
    reading: "Symbols only another notation writes are: an Arabic layer number (2Bt), two masters run together (AB, BC, LFH), a slash inside a designation (E/B), a B, C, A, E, H or O with a suffix the KA5 does not write on it (Bw, Bg, Btg, Cr, Cg, Oi, Oa, Ag, Eg, Hi, He) or writes only with others (Bk, Bf, Bm, Bss, Ak), the Canadian j with other letters (Btj, Bmj, Aej, Ckj; the KA5 Bj and Cj stand alone), and Ck and Oe written as designations (in the KA5 they are field codes, never horizons). Ahe stays a strong sign; Ahe/Ae/Bt/Ck and Ap/Ahe/Ae/Btj/Bt/Ck are therefore not read as KA5 (undecided) (Hugo, 2026-11-04)."
  - topic: "KA6 symbols in an undeclared profile"
    page: "KA6 decks"
    reading: "A KA6 symbol read through the crosswalk is neither a sign of the KA5 notation nor a veto: Ol/Ah/Ks/Kt/Cv alone is not recognised, but a KA6 symbol in a profile recognised by KA5 signs is read, flagged. Options: (a) neutral (chosen); (b) a KA6 symbol a strong sign of the German notation; (c) a KA6 symbol a veto, the profile left to a future ka6 reader. Hugo chose (a) (2026-11-04)."
  - topic: "The RP codes the KA5 also defines"
    page: "pp. 93-94"
    reading: "An RP 2008 strong code vetoes the KA5 only when the KA5 neither defines nor permits it: Ach (Ah with secondary carbonate in the KA5, the chernic A of the RP) is no veto; Sd, a KA5 strong sign, is also an RP writing (BTd, Sd), so an RP profile with RP signs and Sd is undecided. Options: (a) as chosen; (b) every RP strong code a veto. Hugo chose (a) (2026-11-04)."
  - topic: "A capital I after a numeral"
    page: "pp. 84, 108"
    reading: "IIIC in a profile with no layer II above it is read as layer II and a typed lC (IIlC); with a layer II above, as layer III and C; a note in both cases. Read alone, without the profile, IIIC is layer III and C with a note (Hugo's decision on reading 8, 2026-11-04, changing soilKey's reading, which always took the longest numeral)."
  - topic: "Slips and doubts of the printed formulas"
    page: "pp. 216, 222, 235, 259, 261"
    reading: "Kept as printed and read: SS-YE p. 235 prints Ah/(Sw-)E/E-Sw/IISw/Sd without the parentheses its siblings have (YK-SS, YE-SS, SS-YK: II(Sw/)Sd); the Niedermoor overlays GG\\HN, GG/HN, MO\\HN, MO/HN p. 259 print IIrnHw and IIrnH, read as a relict r before nH; KMc p. 261 prints nHcw twice (once optional): the fixture keeps it as printed and the subtype rules will read it once (slip 36); BBl p. 216 prints IIC (layer II, C), not lIC; PPn p. 222 writes (Ahe)/Ae in its second form. Options for IIrnH: (a) relict nH (chosen); (b) a misprint for IInH. Hugo chose (a) (2026-11-04)."
  - topic: "Liste 31 against the type texts"
    page: "pp. 201, 252"
    reading: "Liste 31 writes the Dwogmarsch Ah/Go-Sw/IIfAh°Sd/fGo-°Sd/Go/Gr, its type text Ah/Sw/...: both formulas are kept in the fixture and both read; the key will use the criterion (layer II under 4 dm and the Dwog), as the plan's slip 31 says (default) (Hugo, 2026-11-04)."
  - topic: "Smaller points of the review"
    page: "pp. 110-116, 142, 199"
    reading: "The degree sign typed o or O is read only in a profile declared or recognised as KA5, never as a sign of the notation; (Bv) is read as Bv with a note (an uncertain or discontinuous horizon), B v as Bv; Bodenkundliche Kartieranleitung 6 and Bodensystematik (KA6) declare the KA6; dbg declares the KA5 only alone or with a year (dbg-wrb does not); the texture classes take their main group from Abb. 17 (p. 142: Sl4, Slu, St3, Ts3 and Ts4 loams, Lu a silt, Lt3 a clay); the humus classes h3 to h5 take the forest ranges of the footnote of Tab. 15 under forest; the unspecified reductive feature r of Tab. 16 counts as a reduction colour; an empty alternative or an empty horizon between two '/' in a formula is an unknown token (Hugo, 2026-11-04)."
  # --- v0.9.361: the key to horizons on the data (plan section 6) ---------------------------
  - topic: "The order of tests on the data"
    page: "pp. 88-108"
    reading: "Hugo's order Q9 (F, organic, anthropogenic, G, S, A, B with P and T, C, the prefixes and suffixes, the transitions). An undecided organic, G or S test leaves the layer undecided against what follows, since those horizons dominate a layer's reading; the C is the fallback and does not win over an undecided soil horizon; inside the B step the T and the P are asked before the Bfv and the Bv. Options were: (a) as written; (b) any undecided test only a candidate, the first that holds decides. Hugo chose (a) (Hugo, 2026-11-06)."
  - topic: "The F horizons on the data"
    page: "p. 89"
    reading: "On a site recorded under water (subaqueous) or in the tidal zone: rust 5 % or more (the limit of the Go) an Fo; dark brown humic (a YR hue, chroma 2 or more, value 4 or less, organic substance 1 % or more) an Fh; black to dark grey (value 3 or less, chroma 2 or less) or a sulfide smell an Fr; in the tidal zone without features an Fw; organic substance under 1 % an Fi. Options were: (a) as written; (b) the F kind only from the notation, the data giving F undecided. Hugo chose (a) (Hugo, 2026-11-06). Amended by the review: the F kind read from soilKey's colour cuts (Fh, Fr) carries the lower grade of evidence and makes the result provisional (Hugo, 2026-11-06)."
  - topic: "Peat or forest floor"
    page: "pp. 89-91"
    reading: "An organic layer is an H when a peat descriptor is recorded (moor type, fibre, von Post, decomposition) or the site is wet (poorly or very poorly drained, groundwater within 40 cm); an O when the fine substance or a humus form of the forest floor is recorded; otherwise H and O are both candidates. The H suffixes on the data: m (von Post 7 or more, black, water-repellent or powdery, at the top), v (crumb or fine subangular in a drained moor, at the top), a (subangular blocky in the subsoil), t (prisms), w (oxidation features), r (wet over 300 days or reduction colours over 50 %), p (tilled); the prefix h, u or n from the moor type. Options were: (a) as written; (b) no wet-site rule (H only with a peat descriptor). Hugo chose (a) (Hugo, 2026-11-06)."
  - topic: "The shares of rust, bleaching and reduction colours"
    page: "pp. 53, 102-106, 113"
    reading: "Measured shares first (redoximorphic_features_pct for the oxidation features, bleached_pct, reduction_colours_pct), else the field codes of fields 30 and 31 by their area classes; rust and bleaching not recorded are absent (a field observation not recorded is absent); reduction colours not recorded are read from the matrix only in the hues of the Gr set (N, 5Y to 10Y, GY, G, BG, B, PB) with a moist value of 4 or more (100 %), since dark humus colours are not reduction colours; no matrix colour leaves them undecided. Options were: (a) as written; (b) every matrix colour of the Gr list (N1 to N8, any hue under chroma 1.5) read as reduction colours. Hugo chose (a) (Hugo, 2026-11-06)."
  - topic: "Groundwater or perched water"
    page: "pp. 101-106, 311; Q13"
    reading: "Whether a row's redox features are of groundwater (G) or perched water (S) is read from the site: groundwater observed, apparent or flooded, a groundwater depth, a level or step of Tab. 59 or a groundwater source make them G (except a row wholly above the MHGW); a perched water table makes them S; neither recorded, soilKey's WRB gleyic or stagnic properties stand in, flagged; else G and S are both candidates. The record is one for the profile, so a profile with perched water over groundwater needs the notation. Options were: (a) as written; (b) the depth decides (S in the upper 4 dm, G below). Hugo chose (a) (Hugo, 2026-11-06). Amended by the review (D12): the record is depth-aware: a recorded level makes a row G only at or below the MHGW, or within the fluctuation zone of 1 m above the recorded MNGW or water table (thresholds.yaml); above it the features are of perched water (Hugo, 2026-11-06)."
  - topic: "The reducing-gas horizon Y and the Esch E on the data"
    page: "pp. 106-108; Q20, Q23"
    reading: "A Y is tested only where the site records a reducing-gas source or a methane smell (soil gas 10 vol-% or more when measured; undecided when not); without either no Y. An E needs a plaggen or garden culture recorded (deep_cultivation_kind), the Ah humus minimum, cultural remains (artefacts) or a phosphate measurement, and a lower boundary deeper than the plough depth (mechanical_mixing_depth_cm; not recorded, undecided, Q23); marked bioturbation in a garden makes the Ex. Options were: (a) as written; (b) the phosphate read against a soilKey limit. Hugo chose (a) (Hugo, 2026-11-06)."
  - topic: "The topsoils on the data"
    page: "pp. 92-95"
    reading: "The A horizons are tested in the run of topsoils: the first mineral row and the rows under it while the row above was read as an A. Under the first row a humic layer that is a Bh, Bs, Bt or Bv is that B (with the Ah minimum an Ah-Bv), undecided when the B test is. The Ai is the first mineral row with organic substance under the Ah minimum, or patchy and under 2 cm. The Ap needs arable land use; the Axh 1 dm, base saturation 50 %, marked bioturbation (worm holes or common or many burrows; not recorded, absent unless soilKey's mollic horizon stands in as a candidate) and granular or crumb structure. Options were: (a) as written; (b) the Ah humus minimum alone makes an Ah at any depth. Hugo chose (a) (Hugo, 2026-11-06). Amended by the review (D19): no run of topsoils starts under 30 cm or more of H (Hugo, 2026-11-06)."
  - topic: "The Bt, Bfv, Bu, P and T on the data"
    page: "pp. 95-101"
    reading: "The clay coatings not recorded are absent, unless soilKey's argic horizon stands in, flagged, beside the measured clay difference; the clay difference of two adjacent horizons of one layer is reached at their boundary, within 30 cm (p. 97). The Bfv is tested only where bulk density or porosity is recorded, the Bu only where the clay CEC is; with clay not recorded the P and the T are candidates only on a recorded clay stone or carbonate rock; a carbonate rock below is no clay stone. Options were: (a) as written; (b) every unrecorded measurement leaves these tests undecided. Hugo chose (a) (Hugo, 2026-11-06)."
  - topic: "Rock and the substratum C"
    page: "pp. 98-100; Q15"
    reading: "A row described as rock (rock_diggable, weathering_stage or the carbonate of the whole rock recorded, or coarse fragments of 75 % or more) is mineral and a C, not a B. The C is xC with fine earth under 5 vol-%, mC when not diggable, strongly cemented or written R in the FAO notation, lC when diggable, weakly cemented or with its particle size recorded; the prefix i, e or c by Q15 (left open, with its options, when the carbonate is not recorded); n fresh, v weathered, c secondary carbonate. Options were: (a) as written; (b) only rock_diggable decides l or m. Hugo chose (a) (Hugo, 2026-11-06). Amended by Hugo: an Ai on block debris (xC) is a Syrosem (OO), as the Ranker takes imC and ixC (Hugo, 2026-11-06)."
  - topic: "Prefixes and the texture classes on the data"
    page: "pp. 84, 93, 141-142"
    reading: "On the data the prefix a is written in a floodplain (landform or valley position, flooding, fluvial material), tm, tb or tp from a tidal layer_origin, z at EC 0.75 dS/m or more, o with 2 % or more of sedimentary organic substance; e on an A, G or F only beside a or a tidal prefix (the marsh and floodplain formulas write it). With clay not recorded, a Bodenart gives the texture class of the Ah minimum and the Bt by its main group: S class 1 or 2, U and L class 2, T class 2 or 3. Options were: (a) as written; (b) e on every A, G and F with 2 to < 75 % carbonate. Hugo chose (a) (Hugo, 2026-11-06)."
  - topic: "The WRB stand-ins on the data"
    page: "plan section 6"
    reading: "A soilKey WRB diagnostic stands in for a missing field descriptor, flagged and of a lower grade, never deciding alone: a stand-in that holds makes a candidate (spodic for a Bh or Bs, albic for an Ae, mollic for an Axh, cambic for a Bv, plaggic and hortic for an E), and decides only beside a measured value (argic for the clay coatings with the clay difference, vertic for the shrink signs with 45 % clay, fluvic for the stratification of an M with its humus or chroma, gleyic and stagnic for the water of a G or S with its shares); a stand-in that fails or is undecided leaves the field observation absent. Options were: (a) as written; (b) stand-ins only as notes. Hugo chose (a) (Hugo, 2026-11-06). Amended by the review (D13): a stand-in that decided a horizon is shown in the result (provisional_because 'horizons:<code>' and a warning) (Hugo, 2026-11-06)."
  # --- v0.9.362: the key to the type (Tab. 51) -------------------------------------------------
  - topic: "The Marschen: tidal, decalcified, under the Ah"
    page: "pp. 249-254, 285"
    reading: "Tidal is a tm, tb or tp prefix on a horizon, or the site in the intertidal or supratidal zone; redoximorphic features under the Ah are a G or S part in the topsoil (Go-Ah) or a G or S horizon directly under it. The decalcification depth (Entkalkungstiefe) is the top of the first carbonatic horizon, carbonatic meaning the prefix e or c or 2 % carbonate or more; a profile described to less than the depth asked leaves it undecided. The Strand's 'sandy sediments' are not tested (its Ai solum and the tidal record are). Options were: (a) as written; (b) carbonatic from any carbonate (0.5 % or more). Hugo chose (a) (Hugo, 2026-11-06). Amended by the review (D8, D17): the Kalkmarsch needs a carbonatic horizon with its top under 4 dm, the complement of the Kleimarsch (type text p. 250, Q6); a marsh written only in the notation without the o is no Organomarsch (the MOn always writes it), on the data its own 8 % humus and 45 % clay (Hugo, 2026-11-06)."
  - topic: "The Ah/C-Boeden and the Schwarzerden"
    page: "pp. 204-213, 286-287; Q17, Q18"
    reading: "The R gate takes a topsoil of Ah horizons (Ah, Ap, Axh, Ahe, Ae, Aih, Bv-Ah); an Al, Ael or Aa makes no Ah/C soil; below it only rock (a C, with B-C and B+C transitions), an S or G only from 4 dm. Q17 reads the thickness of the Ah horizons (not the Ae or Al): 4 dm or more without an Axh leaves the R gate undecided. The Schwarzerden's colour (moist chroma under 3.5, value 4 or less, p. 211) is tested only where recorded. Options were: (a) as written; (b) the colour required. Hugo chose (a) (Hugo, 2026-11-06). Amended by the review (D4, D5): the Schwarzerden gate reads an Axh with its top under 4 dm and the Axh run from it of 4 dm or more (under an Ap or a thin M too; the Tschernitza alike); an Axh that fails only on its colour is undecided (Q17), a conflict of the designation and the data, never a silent no (Hugo, 2026-11-06)."
  - topic: "Inland or tidal water; floodplain"
    page: "pp. 238, 255-257, 284-286"
    reading: "The classes J and I are told by the site (subaqueous: inland; tidal_zone subtidal or intertidal: tidal), else by a tidal prefix on the F at the GOF (tidal), else an F written in the notation is inland. A floodplain soil is one with an aX horizon (the prefix a) or a site in a floodplain (landform, valley position, flooding, fluvial material). Options were: (a) as written; (b) the site record required. Hugo chose (a) (Hugo, 2026-11-06). Amended by the review (D14): a z prefix on the F at the GOF counts as tidal evidence (Tab. 51 writes (z)(e)Fo for the Watt); with neither site record nor prefix, inland or tidal stays undecided; the tidal prefixes of the semiterrestrial gate count only on rows of the present solum, top under 4 dm and not buried (D2) (Hugo, 2026-11-06)."
  - topic: "The R body of the Rigosol and Treposol, and the Moore types"
    page: "pp. 236-237, 260-262; Q22, Q23"
    reading: "The R body counts the R horizons and the horizons with an R part (R-Ap, R+Bhs): R+... is the Treposol's single deep ploughing when the kind of cultivation is not recorded. The Moore types by the carrying H of the topsoil: Hv and Hvp the Erd-, Hm, Hvm and Hmp the Mulm-moore (the transition Hvm read as mulmified); the prefix n or u for the Niedermoore, h for the Erdhochmoor; the Hochmoor's pH (CaCl2) under 4 in any measured hH. Options were: (a) as written; (b) the Hvm left undecided between KV and KM. Hugo chose (a) (Hugo, 2026-11-06). Amended by the review (D9, D10): one strict bound, deeper than 4 dm, for the Y class and the Rigosol and Treposol; the Moore types read the earthified topsoil itself (KH not a plain hH or hHp) (Hugo, 2026-11-06)."
  - topic: "The figures as consistency flags"
    page: "pp. 192-194; Q5"
    reading: "Tab. 51 decides; the trace (phase figures) and the warnings say where Abb. 21 or 22 would read the profile otherwise: an F at the GOF of a Moor (Abb. 21 asks the subhydric soils first), an M, E or R reaching 4 dm outside the class Y (Abb. 22 asks the anthropogenic soils first), an S beginning at exactly 4 dm (Abb. 22: 4 dm or less), and Ah horizons of 4 dm or more outside the Schwarzerden. Options: (a) these four; (b) the whole of Abb. 22 run as a second key. Hugo chose (a) (Hugo, 2026-11-06)."
  - topic: "The levels of the registry"
    page: "pp. 191, 283"
    reading: "The registry lists the levels divisions, classes and types; the subtypes join the levels when they are keyed (the next releases), so that no level is shown empty. The type's name is the deepest name; the overlays of a Moor under 2 to < 4 dm of cover and of the V palaeosols are noted, named with the subtypes. Options were: (a) as written; (b) the level subtypes listed now. Hugo chose (a) (Hugo, 2026-11-06)."
  # --- the review of 2026-11-06 (Hugo: "Corrigir os 19") --------------------------------------------
  - topic: "Buried soils and the present soil"
    page: "p. 283"
    reading: "A buried soil (from the first fossil row of a layer II or deeper down, the f prefix) does not decide the present soil: every gate of the key reads the present solum only; the podzol search starts at the present GOF; the peat body of the Moore and the palaeosols of class V read the buried rows too (D1) (Hugo, 2026-11-06)."
  - topic: "A prefix the notation leaves out"
    page: "pp. 84, 204-211, 239; Q15"
    reading: "A C written without its rock prefix (i, e, c) takes it from the carbonate recorded (the whole soil, else the fine earth flagged), an H without its moor prefix (h, n, u) from peat_moor_type; neither recorded, the prefix stays open and the types that ask it undecided; the Vega is not reached while the Paternia or Kalkpaternia is undecided (D3) (Hugo, 2026-11-06)."
  - topic: "Truncated descriptions and missing depths"
    page: "pp. 79, 284; D6, D7"
    reading: "A run of horizons that reaches the bottom of the description short of the thickness or depth a gate asks leaves the gate undecided, not failed (the Moor, the Axh, an M, E or R reaching 4 dm); a missing depth leaves it undecided too. The peat body of the Moore sums the H horizons from the first, thin interbeds of 10 cm or less (a buried fF included) not breaking it (D7) (Hugo, 2026-11-06)."
  - topic: "A class with no type, and no differentiation"
    page: "pp. 283-288; D16"
    reading: "When a class passes and none of its types does, the type level is provisional (types:<class>); the note 'no horizon differentiation recognisable' is given only when every terrestrial class failed; a semiterrestrial division that keys no class falls through to the terrestrial soils (D2) (Hugo, 2026-11-06)."
  - topic: "soilKey's conventions in the code"
    page: "plan section 6; the review of 2026-11-06"
    reading: "Recorded as soilKey's conventions (Hugo, 2026-11-06), each a number of thresholds.yaml or a rule of the code: the Srd's reduction colours over 10 % and wetness over 300 days, the Srw's rust on voids (the root channels), the Fo's rust of 5 % (the Go's limit); no Bv- part on a G or S row over a hydromorphic row (the colour of the redox features, not of weathering); the Gw never in the first mineral row; the Ahe only in the first mineral row when pale and at the Ah minimum; carbonatic means 2 % carbonate or more (the e prefix); a fluctuation zone of 1 m above a recorded water table (D12); interbeds of 10 cm or less in a peat body (D7); no topsoil under 30 cm of peat (D19); the layer of a profile not in the KA5 notation from its Arabic numeral (2Bt) when written; an FAO R read as solid rock (mC); the transitions written with Go- for rust under 5 % in the groundwater zone, -Sw for S features 10 to < 80 % and Sw- under 10 %; the Rigosol listed provisional when the kind of cultivation is not recorded (Q23); the Fahlerde provisional on its designation when its clay is not recorded (C13)."
  # --- v0.9.363: the subtypes of the terrestrial types (pp. 202-237) --------------------------
  - topic: "The order of the subtypes inside a type"
    page: "pp. 191, 268, 270-272; Q21"
    reading: "Inside a type the transitional subtypes (X-Y, a subtype of the type Y named last, with strong features of X as transitional horizons or full horizons in a window) are tested first in printed order, then the deviation subtypes in printed order, the Norm subtype last as the fallback; the first that passes names the subtype; every subtype of the type that passes is listed in trace$subtypes_passing and the others are noted (with the varieties they will join the name, Tab. 46 no. 17); a subtype the data leave open before the one assigned makes it provisional, a candidate (Q21) (Hugo, 2026-11-04)."
  - topic: "The Treposol and the Rigosol"
    page: "pp. 236-237; Q22"
    reading: "The Treposol has no Norm subtype and its four printed subtypes are examples; the Rigosol and the Treposol take an open subtype in brackets for the type X still recognisable under or in the R, [X-YY] and [X-YU], tested after the printed ones of the Treposol and before the Normrigosol (Q22) (Hugo, 2026-11-04). The VV and VW have no subtypes (p. 226): their palaeosol is named as an overlay of the soil above (Q19)."
  - topic: "The base-saturation marks of the subtypes"
    page: "pp. 85-86, 204-210; Q14"
    reading: "The marks Ah> and Ah< of the subtypes of the Ah/C-Boeden read the subtype scale: > base saturation 50 % or more, < under 50 % (Q14) (Hugo, 2026-11-04). The marks are tested apart from the horizon sequence, on every horizon of the topsoil run from the GOF: each by its measured bs_pct, else by the mark written on it, else undecided; the mark holds when every horizon meets it, fails when one does not, and is undecided otherwise; a written mark the measured value contradicts is noted and the data decide (Hugo, 2026-11-06; the review's D8)."
  - topic: "The windows of the subtypes"
    page: "plan 4.2; pp. 202-237; Q8"
    reading: "A number under an underlined part of a formula is the depth of the lower boundary of the underlined horizons under the GOF (the plan's default 10); the windows are read with the range rule (lower end inclusive, upper exclusive) on the horizon carried by the last symbol (Q8): the Gley-X subtypes by the top of the first G horizon (Bv-Go included, Go-Bv not) at 4 to < 8 dm, the Pseudogley-X by the first S at 4 to < 8 dm (the Sd in the second forms), the Podsol-X by the bottom of the last Bh or Bs above 1.5 dm, the X-Podsol by it at 1.5 to < 7 dm, the humic, chernozemic and anthropogenic parts by the run of horizons with an A (or M, E) part from the GOF reaching 4 dm; RQ-DD's two stacked lines: the P begins under 3 dm and the loose material over an imC is 3 dm or more (default 10) (Hugo, 2026-11-04)."
  - topic: "The Fahlerde and the Parabraunerde-Braunerde in the subtypes"
    page: "pp. 217, 219; C13, C14"
    reading: "The transitional subtypes LF-BB, LF-SS, LF-SH and LF-YU take the Fahlerde's clay difference (9 or 12 points) as the type does (C13): measured and short, no such subtype and the conflict reported; not measured, across a layer change, or the Ael and Bt in one interfingering horizon, the subtype holds on the designation, provisionally. The LL-BB band (1 to 3, 2 to 5, 3 to 8 points by the Btv's texture, under the Parabraunerde's 3, 5, 8; C14) is read the same way, measured or provisionally on the Btv written (Hugo, 2026-11-06). The Fahlerde's difference is the Ael against the Bt: the first row under the Ael holding a Bt and no Ael part (the Bt-Sd of SS-LF), not the Ael+Bt, which counts as the interfingering between them, the two then read as adjacent (p. 220; the review's D4, in the type gate too)."
  - topic: "The Norm subtype as the fallback"
    page: "pp. 191, 202-237; Q21"
    reading: "The Norm subtype comes last (Q21) and tests its printed formula and the marks that complement a deviation: RNn and RQn Ah< and no Bv, RRn and RZn Ah>, PPn Cp/Fep 3 to < 10 in the Bsh and Bhs, XXn the Yr under 4 dm, DDn the (P-)Ah/P 3 dm or more; when one is not met or is undecided the Norm holds provisionally, with the deviation it complements as a candidate (Hugo, 2026-11-06, R1, replacing soilKey's reading that the Norm passes by default untested; the review's D6)."
  - topic: "The formulas of the subtypes on the horizons"
    page: "pp. 199, 202-237"
    reading: "Each printed alternative is matched with the sequence engine, closed on its own horizons (a horizon the formula does not write is ignored): (1) the formulas list only the characteristic horizons (p. 199): horizons under the last one matched are free, and a final C that names no kind of rock (C, eC, cC, i,eC, C(c), IIC; not lC, mC, xC), or a final II..., is met by any deeper row; with no row under the formula the description ends there and the subtype is undecided, not failed (the review's D1); (2) a formula that fails only because the description ends above its last horizons is undecided; (3) a slot written (X-)Y takes a run of X-Y and Y rows (Bt-Go/Go, Bv-Tv/Tv), read as a second reading of the profile (D2); (4) the trailing Gr or G of the Gley-X formulas that write another G before it is optional, the Gr lying typically 13 dm or deeper; (5) one podzol B stands for the pair B(s)h/B(h)s; (6) seven subtypes are also closed on a horizon a sibling formula writes (XXu on the Yo; OO-RN, OO-RR, OO-RZ on the loose lC; RN-DD on the ilCv; PPe on the Bh, Bsh, Bhs; PPh on the Bs, Bsh, Bhs) and LL-YU on any Ael part, RNr and RQr on any Bv part (no trace of a Bv, pp. 204-206, D5) (Hugo, 2026-11-06)."
  - topic: "The numbers the subtypes test where recorded"
    page: "pp. 205, 209, 222, 225, 227"
    reading: "The Cp/Fep of the Bs (under 3, PPe) and the Bh (10 or more, PPh), the hue of the Bs one page redder than a neighbour (PPe, Q12), the Terra material of the (Bv-)Tv+cCv (50 % or more, CF-RR), the clay of the Bv-Tv (45 to < 65 %, BB-CF) and the Bv-ilCv thinner than the Ah (BB-RN) are tested where recorded, a measured value against the designation deciding; not recorded, the designation stands. The Hangpseudogley is read in the notation by the prefix s; an S written without it is no Hangpseudogley unless a slope of 9 % or more is recorded, which leaves it undecided, SSg a candidate (the book defines it by the slope, p. 227; Hugo, 2026-11-06, R2); on the data by slope_pct 9 % or more, a slope not recorded leaving it undecided. The clay of the Braunerde-Terra fusca is read on the rows holding both a Bv and a Tv part (D2) (Hugo, 2026-11-06)."
  - topic: "The open subtypes of the Rigosol and the Treposol"
    page: "pp. 236-237; Q22"
    reading: "The type X under or in the R is read from the horizons of the present soil in this order: an Ael part with a Bt in the profile LF, a Bt LL, a Bh or Bs PP, a G or an S beginning at 4 to < 8 dm (the window of the printed Gley-Treposol) GG or SS, a P DD, a Tu CR, a Tv CF, an Axh TT, an M YK, an E YE, a Bv BB; a type whose X-Y is a printed subtype of the type (one that failed) is never issued as an open code, the search going on; the name [X-Rigosol] and [Treposol aus X] as the printed examples write it; the open subtype is not listed among the further subtypes that pass. None recognisable, the Normrigosol, and the Treposol keeps no subtype (Hugo, 2026-11-06; the review's D7)."
  - topic: "Gates of the key mended for the subtypes"
    page: "pp. 204-207, 217-221, 227"
    reading: "The Pseudogley gate takes the Scw and Scd of the Kalkpseudogley (A(c)h/Scw/(II)S(c)d) with the Sw and Sd; the Ranker gate reads a thin loose layer over solid rock (Ah/ilCv/imC of RNn, OL-RN, PP-RN) by the solid rock: beginning under 3 dm it is a Ranker, the Regosol's loose material being the part above it, and a solid rock whose top is not recorded leaves the gate undecided (D8); the Lessives gate takes an S horizon with a Bt part (the Bt-Sd of the first forms of SS-LL and SS-LF, pp. 219, 221; D3), not a Bt part on a Terra (the Bt-Tv of LL-CF). No example of v0.9.362 changes its type (Hugo, 2026-11-06)."
  # --- v0.9.364: the subtypes of the semiterrestrial, subhydric and Moore types; the overlays -----------
  - topic: "The Norm subtypes of the Auenboeden"
    page: "pp. 238-241"
    reading: "The Norm subtypes AOn, AQn, AZn, ATn, ABn and the AQ-AB and SS-AB read their aG at 8 dm or deeper (often deeper than 20 dm, p. 238): the aG at the end of the formula may lie under the description, absent from a description reaching 8 dm counts as deeper, and a shallower description leaves the subtype undecided. Rejected: the aG required as printed (an Auenboden described without its G would keep its Norm only provisionally). (Hugo, 2026-11-06)"
  - topic: "The two forms of the Pseudogley-Vega"
    page: "p. 241"
    reading: "The two stacked annotations of SS-AB read: the first S (the aSw of the first form, the a(M-)Sd of the second) begins at 4 to < 8 dm, and the aG at 8 dm or deeper. Rejected: the 8 dm line read as the bottom of the S part. (Hugo, 2026-11-06)"
  - topic: "Gates of the key mended for the wet subtypes"
    page: "pp. 239, 241"
    reading: "The Paternia gate (Ah over an ilC) fails when an aM (prefix a) of the present soil beginning above 8 dm lies under the ilC, aM bands in the ilC (ailC+aM, aM+aelC) keeping the Paternia (Hugo, 2026-11-06, D1): the profile is a Paternia-Vega (AQ-AB, aAh/(II)ailC/II(III)aM/...), a subtype of the Vega, which the gate would otherwise never reach; the Auenboeden take an S horizon under an aM anywhere above it, or with an M part, not only directly under it (the printed Pseudogley-Vega aAh/aM/aSw/aSd). No example of v0.9.363 changes its type. Rejected: the gates as written, leaving AQ-AB and SS-AB unreachable. (Hugo, 2026-11-06)"
  - topic: "The Gley transitions of the terrestrial and the Auen types"
    page: "pp. 244-246"
    reading: "The Go begins above 4 dm by the class gate and the Gr typically at 8 to 13 dm (p. 244): the final Gr of the X-GG formulas is optional, as in the terrestrial Gley-X subtypes; only the humic, colluvial and plaggen parts of TT-GG, AT-GG, YK-GG, YE-GG and AB-GG are windows (4 dm or more). The transitions of the terrestrial types (RQ-GG to YE-GG) do not take a profile with floodplain horizons (prefix a), which the Auen-X-Gley subtypes write (p. 246: without the ilC an Auengley); the Fahlerde-Gley tests the Fahlerde's clay difference (C13). Rejected: the printed order alone, under which an aAh/ailC/aGo/aGr is a Regosol-Gley. (Hugo, 2026-11-06)"
  - topic: "The Oxigley and the Normgley"
    page: "pp. 242, 311; Q16"
    reading: "The Oxigley has no Gr and no Gor (the reduction colours of a Gor dominate, against oxidation through the whole profile); the groundwater_oxygen_rich recorded decides, else no Gr in a mineral profile described to 13 dm or deeper (the rows from the GOF down to the first peat or F horizon), else the subtype is undecided and the Normgley holds provisionally with the Oxigley a candidate (Q16, Hugo 2026-11-04; the Gor, the depth of the description and the peat are soilKey's readings). The Wechselgley needs a Gor, its depth typical. Rejected: a Gor compatible with the Oxigley. (Hugo, 2026-11-06)"
  - topic: "The Hang- and Quellen- subtypes of the Gleye"
    page: "pp. 243-249"
    reading: "In the notation by the prefix s or q on the G horizons; a G written without it is none, unless groundwater_source records the slope or spring water, or (for the s) a slope of 9 % or more is recorded, which leaves the subtype undecided (as the Hangpseudogley, R2); on the data by groundwater_source, and for the slope water also by slope_pct 9 % or more. Rejected: the slope alone deciding in the notation. (Hugo, 2026-11-06)"
  - topic: "The Moorgley and the Erdhochmoor"
    page: "pp. 248-249, 262; Q22"
    reading: "The Moorgley has no Norm subtype (its n means Nieder-, Tab. 49): GHg, GHq, GHh and the open [Übergangsmoorgley] ([GHu], uH/IIGr) are tested before GHn, the de facto Norm, so that the source of the water names a Hang- or Quellenmoorgley (Hugo, 2026-11-06, R1, replacing the printed order); an H whose kind of peat (n, h, u) is neither written nor recorded leaves GHn, GHh and [GHu] undecided, the subtype undecided with them as candidates (the review's D4); an hHm or hHvm under the Erdhochmoor takes the open [vermulmtes Erdhochmoor] ([KHm]) before the KHn (Q22, Hugo 2026-11-04; the codes [GHu], [KHm] are soilKey's). Rejected: the GHn read as a Norm and fallback. (Hugo, 2026-11-06)"
  - topic: "The Kalkmulmniedermoor and the pH of the Moore"
    page: "pp. 258-261"
    reading: "The KMc prints nHcw twice (optional, then obligatory; slip 36): read once and optional, as in KMn and KMu. The pH (CaCl2) where measured: the Normniedermoor 4 to < 6 on its nH ((4 to) 5 to 6, against the Kalkniedermoor's 6), as the mark of the Norm (R1: not met, the Norm holds provisionally with HNc and HNu candidates); the Kalkniedermoor 6 or more on the nHc under the uppermost (the subsoil); the Normhochmoor under 4 on its hH; the Uebergangsmoor's 4 (to 5), often under 4, is typical and not tested. Rejected: nHcw obligatory; all the pH values typical only. (Hugo, 2026-11-06)"
  - topic: "The Watt"
    page: "pp. 255-256"
    reading: "The marine and estuarine Watt (EC of the soil solution 15 mS/cm, p. 255) describe the type, not its subtypes: IWn, IWb and IWf are read by their tidal prefixes and the salt prefix printed (z on IWn and IWb), the EC not tested. Rejected: IWn marine (15 or more) and IWf estuarine (under 15) as checks. (Hugo, 2026-11-06)"
  - topic: "The overlay splitter"
    page: "pp. 268, 283; plan 4.4"
    reading: "A profile is split only at a Moor under a mineral cover (Q7), at a relict or fossil Bj or Bu (the palaeosols, Q19) and at a buried soil: the fossil horizons (prefix f) of a layer II or deeper, or the fossil part of a row overprinted with the degree sign (fAe°Go); never at a Roman numeral alone, never in the Dwogmarsch, and not when the buried part holds only F, H or C horizons. The buried soil is keyed alone from its own top: the numerals renumbered, the fossil part of an overprinted row, the prefix f taken off, a G written without f dropped as the present groundwater. Rejected: every layer change read as an overlay. (Hugo, 2026-11-06)"
  - topic: "The covers of the Moore"
    page: "pp. 258-259, 283; Q7"
    reading: "The cover of a Moor is named as the mineral type the profile keys to without the Moor gate (a Gley, an Organomarsch); under 2 dm it is substrate only; at 4 dm or more the profile goes to the mineral type and no overlay is named, the peat noted in the trace (the Moor's own limits of p. 259 end at 4 dm). Rejected: the cover keyed alone (its gates reading under its bottom, undecided); the general step 4 to < 7 dm 'X/HN'. (Hugo, 2026-11-06)"
  - topic: "The steps and names of the overlays"
    page: "pp. 254, 268"
    reading: "Tab. 46 no. 18: the upper soil under 3 dm 'flach X ueber Y' (X\\Y), 3 to < 7 dm 'X ueber Y' (X/Y), 7 dm or more the upper soil alone (noted in the trace); the Organomarsch over a Podsol 1.5 to < 3 and 3 to < 7 dm, not named under 1.5 dm; the palaeosols named Fersiallit and Ferrallit; 'flacher', 'flache', 'flaches' by the gender of the upper type's name. The overlay is a variety: it is reported in trace$overlay and the warnings and changes neither the levels, the name nor provisional_because. Rejected: the general '\\' for an Organomarsch under 1.5 dm over a Podsol. (Hugo, 2026-11-06)"
  - topic: "The review of the wet subtypes"
    page: "pp. 239-262"
    reading: "Amended by the review (Hugo, 2026-11-06): the Gley-Rambla, Gley-Paternia and Gley-Kalkpaternia read their final aG like the Norm subtypes, under the description allowed (D2); the Wechselgley does not take a q (the Quellengley's formula), its Gor at 8 dm or deeper typical (D3, Q16); the Normhochmoor and the Hochmoor gate read the pH (CaCl2) under 4 in the hH(w), the hH or hHw where there is one, else any hH (D5); on the data route a horizon a formula needs that is among a row's candidates, or that the order of tests on the data does not build (Gso, Hvm, a secondary carbonate c not recorded in a G holding carbonate, the layer of a II horizon, an A part with the humus of an Ah, an M part of a stratified sediment), leaves the subtype undecided, not failed (D6); a Moor under a mineral cover of less than 4 dm reads its type (the Erd- and Mulmmoore) from the top of the peat, so Ah/Go 0-35 cm over an nHv is an Erdniedermoor, GG/KV (R2); the Normniedermoor keeps pH 4 to < 6 (R3); a Marsch subtype without its printed salt or carbonate prefix keeps the Norm provisionally (R4)."
  - topic: "The bleached and podzolic horizons on the data"
    page: "pp. 94-97"
    reading: "On the data the Ae is pale (the Ae colour, p. 94: moist value 4 or more and the value/chroma ratio of the thresholds) over a Bh or Bs, and a pale, humic first row over such an Ae is the Ahe; an Al needs the Bt under it. A B is a podzolic B, not a Bt, when its Cp/Fep makes it a Bh, Bsh, Bhs or Bs (p. 97) and no clay coatings are recorded; under a pale horizon, illuvial humus (the B at the humus minimum of an Ah, p. 93, the pale horizon above under it) or oxalate Fe and Al (Al + 1/2 Fe) higher than above, with no clay coatings recorded and the Cp/Fep not measured, leave the Bt and the podzolic B both as candidates, undecided; clay coatings recorded keep the Bt; under a podzolic B (not an eluvial horizon) a clay increase with no clay coatings recorded is no Bt. A G or S of the topsoil run with a podzolic B is a Bhs-Go (Bsp-), not an Ah-Go (Hugo, 2026-11-06)."
