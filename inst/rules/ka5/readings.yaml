# The readings soilKey makes of the German soil systematics of the
# Bodenkundliche Kartieranleitung, 5th edition (Ad-hoc-AG Boden, Hannover
# 2005, KA5) where the text is silent or ambiguous. An entry ending "(Hugo,
# 2026-11-04)" is a decision of the owner, in soilKey's words; an entry ending
# "(soilKey's reading, for Hugo to confirm, 2026-11-05)" is soilKey's own and
# waits for his word. Hugo confirmed soilKey's nine readings of the first draft
# on 2026-11-04, changing two (1 and 8), and decided the points of its review. Pages are the printed pages of the book (PDF page =
# printed + 1). The criteria are paraphrased; no text of the book is shipped.
readings:
  - topic: "Registry names and declared notations"
    page: "pp. 81, 190"
    reading: "The KA5 will be the system ka5, namespace ka5, aliases germany, kartieranleitung and bodensystematik; site$designation_system declares its notation with ka5, ka4, ka3, kartieranleitung, bodensystematik, agboden or dbg (and any value starting with them); KA3 and KA4 are read as KA5 with a note that the G horizons were redefined in 2005 (Q2) (Hugo, 2026-11-04)."
  - topic: "Recognising the notation"
    page: "pp. 82-88"
    reading: "As the decision card reads: \"Declarada, ou um sinal forte só da KA5 (o sinal de grau \"°\", um prefixo minúsculo antes da maiúscula como lC, mC, fAh, aM, tmGo, as marcas > < <<, Sw, Sd, Srw, Sew, Sq, Tv, Tu, Axh, Ael, Ahe, Bfv, Bsv, Bbt, Gor, Gso, Ex) ou dois prováveis (Bv, Cv, Cn, Al, Aa, Hm, Hw), sem símbolo só da FAO/USDA (Bw, Bk, Bg, Oi, Oe, Oa, 2Bt), do RP, do russo ou do CPCS; perfil misto = notação indecisa. Nunca pelo país.\" The strong symbols are exactly those of the card (Btv, Acxh, Srd and the others the plan listed are not signs); the likely ones are the card's with Hr, P, T, an E under an Ah over a layer II and an M over a layer II as the plan lists them (Q3) (Hugo, 2026-11-04)."
  - topic: "KA6 symbols"
    page: "KA6 decks (DBG 2022-2023)"
    reading: "The KA6 symbols with a one-to-one KA5 reading (Ol, Ax, Ee, El, Eal, Ks, Kh, Kt, Khs, Dj, De, Mm, Pv) are read as L, Axh, Ae, Al, Ael, Bs, Bh, Bt, Bhs, M, E, aM and P with a flag; N, V, U, W, Hn, Au and the new prefixes stay unread; a profile declared ka6 is read so and labelled (Q4) (Hugo, 2026-11-04)."
  - topic: "The last symbol carries the horizon"
    page: "pp. 82, 191"
    reading: "In a designation and in a formula the last part carries the horizon (Ah-Bv is a Bv, Bv+Ah an Ah, fAh°Sd an Sd), in the key gates and in the subtype windows alike (Q8) (Hugo, 2026-11-04)."
  - topic: "Defaults of the reader"
    page: "pp. 82-88, 108, 199"
    reading: "A combination outside Tab. 12 or 5.6.3.3 is read by the grammar with a note (p. 82); a prefix written on a master its list does not name is read with a note; trailing digits are sub-horizons; a capital I before C in a KA5 profile is the prefix l (IC, ICv), AI is read Al with a note; a letter in parentheses gives a set of readings (B(h)s = Bs or Bhs), the data choose, with no data the reading without the letter, flagged; the base-saturation mark is read last, its scale is the key's (Q14); the field codes of fields 30, 31 and 34 (Ck, Oe, Ost ...) are never designations; the degree sign typed o or O is read only in a KA5 profile and only when the result reads; fGo-°Sd (p. 201) is fGo°Sd (defaults 11, 12, 13) (Hugo, 2026-11-04)."
  - topic: "Attributes"
    page: "pp. 50-55, 102-116, 310-316"
    reading: "The 37 entries of the plan's section 7 enter the schemas (26 horizon columns, 13 site properties, four layer_origin values, the l-mull and f-mull humus forms); the KA5 field codes (humus h0-h7, carbonate c0-c7, Bodenart, colour words, hydromorphic features) are read into them by their class ranges; the informative ones (wetness degree, boundary form and inclination, micromorphology) stay out (Q24) (Hugo, 2026-11-04)."
  - topic: "A geogenic prefix written in front"
    page: "pp. 82-84, 241, 249-252"
    reading: "A geogenic prefix written in front of a designation of several parts (a, tb, tm, tp, e, z, s, q, o) holds for the whole horizon, in the profile frame and in the formula: aSw-Ah is an aAh with Sw features, tmzeGo-Ah a tmzeAh; f and r (fossil, relict) hold only for their part (fAh°Sd is a present Sd in a fossil Ah), and the rock prefixes c, i, j, l, m, x, y only for theirs. So aSw-Ah/aSw-M/aM-Sd/aG is a Pseudogley-Vega by its own formula a(Sw-)Ah/aSw-M/a(M-)Sd/aG (Hugo's decision on reading 1, 2026-11-04, changing soilKey's reading, which put the prefix on both parts only inside the formulas)."
  - topic: "Two horizons with one carrying code"
    page: "pp. 82, 199-262"
    reading: "In the frame the sequence engine reads, the token code of a horizon is its whole symbol without numeral and digits (Bv-Ah, ilCv, fAh°Sd, Ah<), and the carrying code and the master are its overlay: a formula slot written Ah takes Bv-Ah, a slot written G takes Go, and sub-horizons (Bv1, Bv2) merge (Hugo, 2026-11-04). For each formula, before the engine reads the table (its prepare_table hook, which only KA5 formulas carry): a transitional row merges into the neighbour with the same carrying code (Al+Bt into the Bt, Sw-Sd into the Sd, Go-Bv into the Bv, Ex-C into the C) unless the formula names the transition in a slot of its own (Ah/Ah-Go/(Go/)Gr); a slot written as a master without suffix (C, G, aG, O) or with commas takes a run of consecutive rows that fit it, since a bare master stands for one or several of its combinations and commas mean alternatives or a sequence (p. 199): Ah/Bv/Cv/Cn is Ah/Bv/C, Ahe/Ae/Bsh/Bhs/Bs/Bv/Cv is Ahe/Ae/Bsh,Bhs,Bs/Bv/Cv, L/Of/Oh/mC is O/mC (the review's D1; Hugo, 2026-11-04)."
  - topic: "Ap for Ah"
    page: "p. 199"
    reading: "Ah and Ap are used alike for topsoils in the formulas: an Ap, with prefixes or a base-saturation mark, takes a formula's plain Ah slot (the review's D2; Hugo, 2026-11-04)."
  - topic: "Buried soils, open ends and wildcards in the formulas"
    page: "pp. 199-201, 235"
    reading: "II... (and III(f)...) is the slot of a buried soil (the engine's [ABC]), optional, since a description may stop above it; in the frame the buried soil runs from the first fossil (f) row of a layer II or deeper downward, so Ah/M/IIfAh/IIBv is a Kolluvisol and Ah/E/IIfAh/IIfBv a Plaggenesch (the review's D3); ... at the start or the end is an open slot the engine does not test; R+... is an R interfingered with any horizon; (...fF/) an fF in any layer; a joined head written only on the first alternative holds for the others (R+B(h)s,B(s)h: R+B(s)h too; the review's R6) (Hugo, 2026-11-04)."
  - topic: "Numerals in the formulas"
    page: "pp. 201, 229-235, 245, 254"
    reading: "A numeral written before an optional group holds for that group and for the horizon after it (II(Sw/)Sd: IISw and IISd); a numeral on the first of several alternatives holds for the others (IIfAe°Go,fAe°Gr: both in layer II); II(III)aM is layer II or III; (II)Sd an optional numeral. Options: (a) as chosen; (b) a numeral only where it is written. Hugo chose (a) (2026-11-04)."
  - topic: "The FAO, USDA and Canadian vetoes"
    page: "pp. 82-88"
    reading: "Symbols only another notation writes are: an Arabic layer number (2Bt), two masters run together (AB, BC, LFH), a slash inside a designation (E/B), a B, C, A, E, H or O with a suffix the KA5 does not write on it (Bw, Bg, Btg, Cr, Cg, Oi, Oa, Ag, Eg, Hi, He) or writes only with others (Bk, Bf, Bm, Bss, Ak), the Canadian j with other letters (Btj, Bmj, Aej, Ckj; the KA5 Bj and Cj stand alone), and Ck and Oe written as designations (in the KA5 they are field codes, never horizons). Ahe stays a strong sign; Ahe/Ae/Bt/Ck and Ap/Ahe/Ae/Btj/Bt/Ck are therefore not read as KA5 (undecided) (Hugo, 2026-11-04)."
  - topic: "KA6 symbols in an undeclared profile"
    page: "KA6 decks"
    reading: "A KA6 symbol read through the crosswalk is neither a sign of the KA5 notation nor a veto: Ol/Ah/Ks/Kt/Cv alone is not recognised, but a KA6 symbol in a profile recognised by KA5 signs is read, flagged. Options: (a) neutral (chosen); (b) a KA6 symbol a strong sign of the German notation; (c) a KA6 symbol a veto, the profile left to a future ka6 reader. Hugo chose (a) (2026-11-04)."
  - topic: "The RP codes the KA5 also defines"
    page: "pp. 93-94"
    reading: "An RP 2008 strong code vetoes the KA5 only when the KA5 neither defines nor permits it: Ach (Ah with secondary carbonate in the KA5, the chernic A of the RP) is no veto; Sd, a KA5 strong sign, is also an RP writing (BTd, Sd), so an RP profile with RP signs and Sd is undecided. Options: (a) as chosen; (b) every RP strong code a veto. Hugo chose (a) (2026-11-04)."
  - topic: "A capital I after a numeral"
    page: "pp. 84, 108"
    reading: "IIIC in a profile with no layer II above it is read as layer II and a typed lC (IIlC); with a layer II above, as layer III and C; a note in both cases. Read alone, without the profile, IIIC is layer III and C with a note (Hugo's decision on reading 8, 2026-11-04, changing soilKey's reading, which always took the longest numeral)."
  - topic: "Slips and doubts of the printed formulas"
    page: "pp. 216, 222, 235, 259, 261"
    reading: "Kept as printed and read: SS-YE p. 235 prints Ah/(Sw-)E/E-Sw/IISw/Sd without the parentheses its siblings have (YK-SS, YE-SS, SS-YK: II(Sw/)Sd); the Niedermoor overlays GG\\HN, GG/HN, MO\\HN, MO/HN p. 259 print IIrnHw and IIrnH, read as a relict r before nH; KMc p. 261 prints nHcw twice (once optional): the fixture keeps it as printed and the subtype rules will read it once (slip 36); BBl p. 216 prints IIC (layer II, C), not lIC; PPn p. 222 writes (Ahe)/Ae in its second form. Options for IIrnH: (a) relict nH (chosen); (b) a misprint for IInH. Hugo chose (a) (2026-11-04)."
  - topic: "Liste 31 against the type texts"
    page: "pp. 201, 252"
    reading: "Liste 31 writes the Dwogmarsch Ah/Go-Sw/IIfAh°Sd/fGo-°Sd/Go/Gr, its type text Ah/Sw/...: both formulas are kept in the fixture and both read; the key will use the criterion (layer II under 4 dm and the Dwog), as the plan's slip 31 says (default) (Hugo, 2026-11-04)."
  - topic: "Smaller points of the review"
    page: "pp. 110-116, 142, 199"
    reading: "The degree sign typed o or O is read only in a profile declared or recognised as KA5, never as a sign of the notation; (Bv) is read as Bv with a note (an uncertain or discontinuous horizon), B v as Bv; Bodenkundliche Kartieranleitung 6 and Bodensystematik (KA6) declare the KA6; dbg declares the KA5 only alone or with a year (dbg-wrb does not); the texture classes take their main group from Abb. 17 (p. 142: Sl4, Slu, St3, Ts3 and Ts4 loams, Lu a silt, Lt3 a clay); the humus classes h3 to h5 take the forest ranges of the footnote of Tab. 15 under forest; the unspecified reductive feature r of Tab. 16 counts as a reduction colour; an empty alternative or an empty horizon between two '/' in a formula is an unknown token (Hugo, 2026-11-04)."
