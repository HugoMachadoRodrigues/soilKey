# The subtypes of the class I, Semisubhydrische Böden (KA5 2005, the type texts pp. 255-256), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  # IA: no subtypes (p. 255; the Nassstrand is still discussed as a deviation subtype of the Watt).
  "IW":
    - code: "IWb"
      name: "Brackwatt"
      name_en: "Brackish tidal flat"
      name_pt: "Planície de maré salobra"
      kind: "deviation"
      page: "p. 256"
      formulas:
        - "tbz(e)Fo/tbzeFr"
      tests:
        all_of:
          - subtype_ka5: {code: "IWb"}
      notes: "Brackish flats of the lower river reaches and coasts with a fresh water inflow (tb) (p. 256)."
    - code: "IWf"
      name: "Flusswatt"
      name_en: "River tidal flat"
      name_pt: "Planície de maré fluvial"
      kind: "deviation"
      page: "p. 256"
      formulas:
        - "tp(e)Fo/tp(e)Fr"
      tests:
        all_of:
          - subtype_ka5: {code: "IWf"}
      notes: "Tidal backwater flats of the rivers (tp) (p. 256)."
    - code: "IWn"
      name: "Normwatt"
      name_en: "Typical tidal flat"
      name_pt: "Planície de maré típica"
      kind: "norm"
      page: "p. 256"
      formulas:
        - "tmz(e)Fo/tmzeFr"
      tests:
        all_of:
          - subtype_ka5: {code: "IWn", norm: true}
      notes: "Marine and brackish-marine flats (sand, mixed and mud flats), tm with salt (z) (p. 256). The fallback of the Watt (Q21). The marine (soil solution 15 mS/cm or more) and estuarine Watt of p. 255 describe the type and are not tested here."
