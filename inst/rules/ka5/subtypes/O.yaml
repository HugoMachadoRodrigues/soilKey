# The subtypes of the class O, Terrestrische Rohböden (KA5 2005, the type texts pp. 202-237), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "OO":
    - code: "OOp"
      name: "Protosyrosem"
      name_en: "Proto-syrosem"
      name_pt: "Proto-syrosem"
      kind: "deviation"
      page: "p. 203"
      formulas:
        - "mAi/mC"
      tests:
        all_of:
          - subtype_ka5: {code: "OOp"}
      notes: "Some organic matter in the pores of a porous solid rock (mAi) (p. 203)."
    - code: "OOn"
      name: "Normsyrosem"
      name_en: "Typical syrosem"
      name_pt: "Syrosem típico"
      kind: "norm"
      page: "p. 203"
      formulas:
        - "Ai/mC"
      tests:
        all_of:
          - subtype_ka5: {code: "OOn", norm: true}
      notes: "A thin, patchy Ai (under 2 cm, typical) directly on solid rock (p. 203)."
  "OL":
    - code: "OLn"
      name: "Normlockersyrosem"
      name_en: "Typical loose syrosem"
      name_pt: "Syrosem sobre material solto típico"
      kind: "norm"
      page: "p. 204"
      formulas:
        - "Ai/lC"
      tests:
        all_of:
          - subtype_ka5: {code: "OLn", norm: true}
      notes: "An Ai on loose rock, thin and patchy or thicker with hardly visible humus (p. 204)."
