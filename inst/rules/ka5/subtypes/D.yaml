# The subtypes of the class D, Pelosole (KA5 2005, the type texts pp. 202-237), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "DD":
    - code: "RN-DD"
      name: "Ranker-Pelosol"
      name_en: "Ranker-pelosol"
      name_pt: "Ranker-pelossolo"
      kind: "transition"
      page: "p. 214"
      formulas:
        - "Ah/ilCv-P/imC"
      closed_on: ["ilC", "ilCv"]
      tests:
        all_of:
          - subtype_ka5: {code: "RN-DD"}
      notes: "An ilCv-P over solid rock under the Ah (p. 214)."
    - code: "RQ-DD"
      name: "Regosol-Pelosol"
      name_en: "Regosol-pelosol"
      name_pt: "Regossolo-pelossolo"
      kind: "transition"
      page: "p. 214"
      formulas:
        - formula: "Ah/ilCv-P/ilCv(/imC)"
          windows:
            - {kind: "first_top", of: {masters: ["P"]}, thr: "st_rq_dd_cm", side: "max", what: "the first P horizon"}
            - {kind: "first_top", of: {masters: ["C"], prefixes: ["m"]}, thr: "st_rq_dd_cm", side: "min", absent_ok: true, what: "the solid rock (imC) under the loose material"}
        - formula: "Ah/P/ilCv(/imC)"
          windows:
            - {kind: "first_top", of: {masters: ["P"]}, thr: "st_rq_dd_cm", side: "max", what: "the first P horizon"}
            - {kind: "first_top", of: {masters: ["C"], prefixes: ["m"]}, thr: "st_rq_dd_cm", side: "min", absent_ok: true, what: "the solid rock (imC) under the loose material"}
      tests:
        all_of:
          - subtype_ka5: {code: "RQ-DD"}
      notes: "The P begins under 3 dm; the loose material over a solid rock (imC) 3 dm or more; the ilCv mostly claystone grit (p. 214; the two stacked annotations read by default 10 of the plan)."
    - code: "RZ-DD"
      name: "Pararendzina-Pelosol"
      name_en: "Pararendzina-pelosol"
      name_pt: "Pararendzina-pelossolo"
      kind: "transition"
      page: "p. 214"
      formulas:
        - "(e)Ah/elCv-P/eC"
      tests:
        all_of:
          - subtype_ka5: {code: "RZ-DD"}
      notes: "An elCv-P under the Ah (p. 214)."
    - code: "BB-DD"
      name: "Braunerde-Pelosol"
      name_en: "Brown earth-pelosol"
      name_pt: "Terra parda-pelossolo"
      kind: "transition"
      page: "p. 215"
      formulas:
        - "Ah/Bv-P/(P/)i,eC"
      tests:
        all_of:
          - subtype_ka5: {code: "BB-DD"}
      notes: "A brown Bv-P, mostly in a periglacial layer bearing loess loam (p. 215)."
    - code: "SS-DD"
      name: "Pseudogley-Pelosol"
      name_en: "Pseudogley-pelosol"
      name_pt: "Pseudogleissolo-pelossolo"
      kind: "transition"
      page: "p. 215"
      formulas:
        - "(Sw-)Ah/Sw-P/(P-Sw/)P-Sd/(P/)i,eC"
      windows:
        - {kind: "first_top", of: {masters: ["S"]}, thr: "st_s_window_cm", side: "range", what: "the first S horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "SS-DD"}
      notes: "The S horizons begin 4 to < 8 dm under the GOF (p. 215)."
    - code: "GG-DD"
      name: "Gley-Pelosol"
      name_en: "Gley-pelosol"
      name_pt: "Gleissolo-pelossolo"
      kind: "transition"
      page: "p. 215"
      formulas:
        - "Ah/(Go-)P/P-Go,Go/Gr"
      typical_tail: true
      windows:
        - {kind: "first_top", of: {masters: ["G"]}, thr: "st_g_window_cm", side: "range", what: "the first G horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "GG-DD"}
      notes: "The Go begins 4 to < 8 dm under the GOF (p. 215)."
    - code: "DDh"
      name: "Humuspelosol"
      name_en: "Humic pelosol"
      name_pt: "Pelossolo húmico"
      kind: "deviation"
      page: "p. 214"
      formulas:
        - "Ah/Ah-P/(P/)i,eC"
      windows:
        - {kind: "run_bottom", parts: "^A", thr: "st_humic_min_cm", side: "min", what: "the humic part (A horizons and A parts)"}
      tests:
        all_of:
          - subtype_ka5: {code: "DDh"}
      notes: "The Ah/Ah-P reaches 4 dm or deeper, the Ah-P with the humus minimum of an Ah (p. 214)."
    - code: "DDn"
      name: "Normpelosol"
      name_en: "Typical pelosol"
      name_pt: "Pelossolo típico"
      kind: "norm"
      page: "p. 214"
      formulas:
        - "(P-)Ah/P/i,eC"
      windows:
        - {kind: "last_bottom", of: {masters: ["P"]}, thr: "st_ddn_min_cm", side: "min", what: "the (P-)Ah/P"}
      complement: ["DDh"]
      tests:
        all_of:
          - subtype_ka5: {code: "DDn", norm: true}
      notes: "The (P-)Ah/P 3 dm or more, neutral to strongly acid, the P highly plastic and carbonate-free (typical, p. 214). The fallback of the Pelosol (Q21): with its formula or this mark not met it holds provisionally, the deviation a candidate (R1)."
