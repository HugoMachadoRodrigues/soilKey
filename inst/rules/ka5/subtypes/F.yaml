# The subtypes of the class F, O/C-Böden (KA5 2005, the type texts pp. 202-237), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "FF":
    - code: "FFn"
      name: "Normfelshumusboden"
      name_en: "Typical humus soil on rock"
      name_pt: "Solo húmico sobre rocha típico"
      kind: "norm"
      page: "p. 202"
      formulas:
        - "O/mC"
      tests:
        all_of:
          - subtype_ka5: {code: "FFn", norm: true}
      notes: "Any humus layer over solid rock, however thin, where higher plants grow or could grow (p. 202)."
  "FS":
    - code: "FSn"
      name: "Normskeletthumusboden"
      name_en: "Typical humus soil in block debris"
      name_pt: "Solo húmico em cascalheira típico"
      kind: "norm"
      page: "p. 203"
      formulas:
        - "(O/)xC+O/(xC/)mC,lC"
      tests:
        all_of:
          - subtype_ka5: {code: "FSn", norm: true}
      notes: "Humus in the voids of block debris; the lower part of the skeleton may be free of humus (p. 203)."
