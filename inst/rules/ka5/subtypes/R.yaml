# The subtypes of the class R, Ah/C-Böden (KA5 2005, the type texts pp. 202-237), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "RN":
    - code: "OO-RN"
      name: "Syrosem-Ranker"
      name_en: "Syrosem-ranker"
      name_pt: "Syrosem-ranker"
      kind: "transition"
      page: "p. 205"
      formulas:
        - "Aih/imC,ixC"
      closed_on: ["ilC", "ilCv", "lC", "lCv"]
      tests:
        all_of:
          - subtype_ka5: {code: "OO-RN"}
      notes: "A continuous Aih of about 2 cm on unweathered or slightly weathered solid rock (p. 205)."
    - code: "OL-RN"
      name: "Lockersyrosem-Ranker"
      name_en: "Loose syrosem-ranker"
      name_pt: "Syrosem solto-ranker"
      kind: "transition"
      page: "p. 205"
      formulas:
        - "Aih/ilCv/imC,ixC"
      tests:
        all_of:
          - subtype_ka5: {code: "OL-RN"}
      notes: "A continuous Aih of about 2 cm on a thin loose rock over solid rock (p. 205)."
    - code: "BB-RN"
      name: "Braunerde-Ranker"
      name_en: "Brown earth-ranker"
      name_pt: "Terra parda-ranker"
      kind: "transition"
      page: "p. 205"
      formulas:
        - formula: "Ah/(Bv-Ah/)Bv-ilCv/(ilCv/)imC,ixC"
          checks:
            - {check: "thinner"}
        - "Ah/(Bv-Ah,Bv+Ah/)Bv+ixCv/(ixCv/)imC"
      tests:
        all_of:
          - subtype_ka5: {code: "BB-RN"}
      notes: "Browning under the Ah, as a rule 0.2 to 1 dm: a Bv-ilCv thinner than the Ah (first form), or a Bv+ixCv with full Bv features in coarse skeleton (second form) (p. 205)."
    - code: "PP-RN"
      name: "Podsol-Ranker"
      name_en: "Podzol-ranker"
      name_pt: "Podzol-ranker"
      kind: "transition"
      page: "p. 205"
      formulas:
        - "Ahe,Ahe+Ae/(Ae/)B(h)s-ilCv,B(s)h-ilCv/(ilCv/)(ixCv/)imC"
        - "Ahe,Ahe+Ae/(Ae/)B(h)s+ixCv,B(s)h+ixCv/ixCv,imC"
      tests:
        all_of:
          - subtype_ka5: {code: "PP-RN"}
      notes: "Podzolisation under moder or raw humus, with no marked B(s)h or B(h)s (p. 205)."
    - code: "RNr"
      name: "Euranker"
      name_en: "Base-rich ranker"
      name_pt: "Ranker eutrófico"
      kind: "deviation"
      page: "p. 205"
      formulas:
        - "Ah>/(ilC/)imC,ixC"
      checks:
        - {check: "bs", mark: ">"}
        - {check: "absent", parts: "^Bv"}
      tests:
        all_of:
          - subtype_ka5: {code: "RNr"}
      notes: "Base saturation of the Ah 50 % or more (Ah>, Q14 subtype scale), every horizon of the topsoil; no trace of a Bv (pp. 204-205)."
    - code: "RNn"
      name: "Normranker"
      synonyms: ["Sauerranker"]
      name_en: "Typical (acid) ranker"
      name_pt: "Ranker típico (ácido)"
      kind: "norm"
      page: "p. 204"
      formulas:
        - "Ah</(ilCv/)imC,ixC"
      checks:
        - {check: "bs", mark: "<"}
        - {check: "absent", parts: "^Bv"}
      complement: ["RNr"]
      tests:
        all_of:
          - subtype_ka5: {code: "RNn", norm: true}
      notes: "Base saturation of the Ah under 50 % (Ah<); no trace of a Bv. The fallback of the Ranker (Q21): with its formula or these marks not met it holds provisionally, RNr a candidate (R1)."
  "RQ":
    - code: "OL-RQ"
      name: "Lockersyrosem-Regosol"
      name_en: "Loose syrosem-regosol"
      name_pt: "Syrosem solto-regossolo"
      kind: "transition"
      page: "p. 206"
      formulas:
        - "Aih/ilC"
      tests:
        all_of:
          - subtype_ka5: {code: "OL-RQ"}
      notes: "A continuous Aih of about 2 cm on loose silicate rock (p. 206)."
    - code: "BB-RQ"
      name: "Braunerde-Regosol"
      name_en: "Brown earth-regosol"
      name_pt: "Terra parda-regossolo"
      kind: "transition"
      page: "p. 207"
      formulas:
        - "Ah/(Bv-Ah/)Bv-ilCv/ilC"
      tests:
        all_of:
          - subtype_ka5: {code: "BB-RQ"}
      notes: "Weak browning under the Ah (Bv-ilCv) (p. 207)."
    - code: "PP-RQ"
      name: "Podsol-Regosol"
      name_en: "Podzol-regosol"
      name_pt: "Podzol-regossolo"
      kind: "transition"
      page: "p. 207"
      formulas:
        - "Ahe,Ahe+Ae/(Ae/)B(h)s-ilCv,B(s)h-ilCv/ilC"
      tests:
        all_of:
          - subtype_ka5: {code: "PP-RQ"}
      notes: "A weak, seam-like illuvial horizon (B(h)s-ilCv or B(s)h-ilCv) under the Ahe or Ae (p. 207)."
    - code: "SS-RQ"
      name: "Pseudogley-Regosol"
      name_en: "Pseudogley-regosol"
      name_pt: "Pseudogleissolo-regossolo"
      kind: "transition"
      page: "p. 207"
      formulas:
        - "(Sw-)Ah/(Sw-)ilC/(ilC-)Sw/II(ilC-)Sd"
      windows:
        - {kind: "first_top", of: {masters: ["S"]}, thr: "st_s_window_cm", side: "range", what: "the first S horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "SS-RQ"}
      notes: "The S horizons begin 4 to < 8 dm under the GOF (p. 207)."
    - code: "GG-RQ"
      name: "Gley-Regosol"
      name_en: "Gley-regosol"
      name_pt: "Gleissolo-regossolo"
      kind: "transition"
      page: "p. 207"
      formulas:
        - "Ah/(Go-)ilC/Go/Gr"
      typical_tail: true
      windows:
        - {kind: "first_top", of: {masters: ["G"]}, thr: "st_g_window_cm", side: "range", what: "the first G horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "GG-RQ"}
      notes: "The Go begins 4 to < 8 dm under the GOF (p. 207)."
    - code: "RQr"
      name: "Euregosol"
      name_en: "Base-rich regosol"
      name_pt: "Regossolo eutrófico"
      kind: "deviation"
      page: "p. 206"
      formulas:
        - "Ah>/ilC"
      checks:
        - {check: "bs", mark: ">"}
        - {check: "absent", parts: "^Bv"}
      tests:
        all_of:
          - subtype_ka5: {code: "RQr"}
      notes: "Base saturation of the Ah 50 % or more (Ah>, Q14), every horizon of the topsoil; no trace of a Bv (p. 206)."
    - code: "RQn"
      name: "Normregosol"
      synonyms: ["Sauerregosol"]
      name_en: "Typical (acid) regosol"
      name_pt: "Regossolo típico (ácido)"
      kind: "norm"
      page: "p. 206"
      formulas:
        - "Ah</ilC"
      checks:
        - {check: "bs", mark: "<"}
        - {check: "absent", parts: "^Bv"}
      complement: ["RQr"]
      tests:
        all_of:
          - subtype_ka5: {code: "RQn", norm: true}
      notes: "Base saturation of the Ah under 50 % (Ah<); no trace of a Bv. The fallback of the Regosol (Q21): with its formula or these marks not met it holds provisionally, RQr a candidate (R1)."
  "RR":
    - code: "OO-RR"
      name: "Syrosem-Rendzina"
      synonyms: ["Protorendzina"]
      name_en: "Syrosem-rendzina"
      name_pt: "Syrosem-rendzina"
      kind: "transition"
      page: "p. 208"
      formulas:
        - "Aih/cmC"
      closed_on: ["clC", "clCv"]
      tests:
        all_of:
          - subtype_ka5: {code: "OO-RR"}
      notes: "An initial Aih of about 2 cm on solid carbonate rock under pioneer plants (p. 208)."
    - code: "OL-RR"
      name: "Lockersyrosem-Rendzina"
      name_en: "Loose syrosem-rendzina"
      name_pt: "Syrosem solto-rendzina"
      kind: "transition"
      page: "p. 208"
      formulas:
        - "Aih/clC"
      tests:
        all_of:
          - subtype_ka5: {code: "OL-RR"}
      notes: "As the Syrosem-Rendzina, on loose carbonate rock (p. 208)."
    - code: "BB-RR"
      name: "Braunerde-Rendzina"
      name_en: "Brown earth-rendzina"
      name_pt: "Terra parda-rendzina"
      kind: "transition"
      page: "p. 208"
      formulas:
        - "Ah/Bv+cCv,Bv-cCv/cC"
        - "Ah/Bv-Ah,Bv+Ah/cCv/cC"
      tests:
        all_of:
          - subtype_ka5: {code: "BB-RR"}
      notes: "A thin transitional or interfingering horizon with Bv features under the Ah (p. 208)."
    - code: "CF-RR"
      name: "Terra fusca-Rendzina"
      name_en: "Terra fusca-rendzina"
      name_pt: "Terra fusca-rendzina"
      kind: "transition"
      page: "p. 209"
      formulas:
        - "Ah/(Bv-)Tv+cCv/cC"
      checks:
        - {check: "value", parts: "^Tv$", attr: "terra_material_pct", thr: "st_terra_material_min_pct", side: "min"}
      tests:
        all_of:
          - subtype_ka5: {code: "CF-RR"}
      notes: "Terra material 50 % or more of the fine soil of the (Bv-)Tv+cCv, marked polyhedral structure (p. 209); the share tested where recorded (terra_material_pct)."
    - code: "GG-RR"
      name: "Gley-Rendzina"
      name_en: "Gley-rendzina"
      name_pt: "Gleissolo-rendzina"
      kind: "transition"
      page: "p. 209"
      formulas:
        - "Ah/(Go-)cCv/Go/Gr"
      typical_tail: true
      windows:
        - {kind: "first_top", of: {masters: ["G"]}, thr: "st_g_window_cm", side: "range", what: "the first G horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "GG-RR"}
      notes: "The Go begins 4 to < 8 dm under the GOF (p. 209)."
    - code: "RRs"
      name: "Sauerrendzina"
      name_en: "Acid rendzina"
      name_pt: "Rendzina ácida"
      kind: "deviation"
      page: "p. 208"
      formulas:
        - "Ah</cC"
      checks:
        - {check: "bs", mark: "<"}
      tests:
        all_of:
          - subtype_ka5: {code: "RRs"}
      notes: "Base saturation of the Ah under 50 % (Ah<, Q14) (p. 208)."
    - code: "RRn"
      name: "Normrendzina"
      synonyms: ["Eurendzina"]
      name_en: "Typical (base-rich) rendzina"
      name_pt: "Rendzina típica (eutrófica)"
      kind: "norm"
      page: "p. 208"
      formulas:
        - "(e)Ah>/cC"
      checks:
        - {check: "bs", mark: ">"}
      complement: ["RRs"]
      tests:
        all_of:
          - subtype_ka5: {code: "RRn", norm: true}
      notes: "The Ah with or without carbonate, its base saturation 50 % or more (Ah>). The fallback of the Rendzina (Q21): with its formula or this mark not met it holds provisionally, the deviation a candidate (R1)."
  "RZ":
    - code: "OO-RZ"
      name: "Syrosem-Pararendzina"
      synonyms: ["Protopararendzina"]
      name_en: "Syrosem-pararendzina"
      name_pt: "Syrosem-pararendzina"
      kind: "transition"
      page: "p. 210"
      formulas:
        - "Aih/emC"
      closed_on: ["elC", "elCv"]
      tests:
        all_of:
          - subtype_ka5: {code: "OO-RZ"}
      notes: "An Aih of about 2 cm on carbonate-bearing solid siliceous or silicate rock (p. 210)."
    - code: "OL-RZ"
      name: "Lockersyrosem-Pararendzina"
      name_en: "Loose syrosem-pararendzina"
      name_pt: "Syrosem solto-pararendzina"
      kind: "transition"
      page: "p. 210"
      formulas:
        - "Aih/elC"
      tests:
        all_of:
          - subtype_ka5: {code: "OL-RZ"}
      notes: "As the Syrosem-Pararendzina, on loose carbonate-bearing rock (p. 210)."
    - code: "BB-RZ"
      name: "Braunerde-Pararendzina"
      name_en: "Brown earth-pararendzina"
      name_pt: "Terra parda-pararendzina"
      kind: "transition"
      page: "p. 210"
      formulas:
        - "Ah/Bv+eCv,Bv-eCv/eC"
        - "Ah/Bv-Ah,Bv+Ah/eC"
      tests:
        all_of:
          - subtype_ka5: {code: "BB-RZ"}
      notes: "A thin transitional or interfingering horizon with Bv features under the Ah (p. 210)."
    - code: "SS-RZ"
      name: "Pseudogley-Pararendzina"
      name_en: "Pseudogley-pararendzina"
      name_pt: "Pseudogleissolo-pararendzina"
      kind: "transition"
      page: "p. 210"
      formulas:
        - "(Sw-)Ah/(Sw-)eCv/(C-)Sw/II(C-)Sd"
      windows:
        - {kind: "first_top", of: {masters: ["S"]}, thr: "st_s_window_cm", side: "range", what: "the first S horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "SS-RZ"}
      notes: "The S horizons begin 4 to < 8 dm under the GOF (p. 210)."
    - code: "GG-RZ"
      name: "Gley-Pararendzina"
      name_en: "Gley-pararendzina"
      name_pt: "Gleissolo-pararendzina"
      kind: "transition"
      page: "p. 211"
      formulas:
        - "Ah/(Go-)eCv/Go/Gr"
      typical_tail: true
      windows:
        - {kind: "first_top", of: {masters: ["G"]}, thr: "st_g_window_cm", side: "range", what: "the first G horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "GG-RZ"}
      notes: "The Go begins 4 to < 8 dm under the GOF (p. 211)."
    - code: "RZs"
      name: "Sauerpararendzina"
      name_en: "Acid pararendzina"
      name_pt: "Pararendzina ácida"
      kind: "deviation"
      page: "p. 210"
      formulas:
        - "Ah</eC"
      checks:
        - {check: "bs", mark: "<"}
      tests:
        all_of:
          - subtype_ka5: {code: "RZs"}
      notes: "Base saturation of the Ah under 50 % (Ah<, Q14) (p. 210)."
    - code: "RZn"
      name: "Normpararendzina"
      synonyms: ["Eupararendzina"]
      name_en: "Typical (base-rich) pararendzina"
      name_pt: "Pararendzina típica (eutrófica)"
      kind: "norm"
      page: "p. 209"
      formulas:
        - "(e)Ah>/eC"
      checks:
        - {check: "bs", mark: ">"}
      complement: ["RZs"]
      tests:
        all_of:
          - subtype_ka5: {code: "RZn", norm: true}
      notes: "The Ah with or without carbonate, its base saturation 50 % or more (Ah>). The fallback of the Pararendzina (Q21): with its formula or this mark not met it holds provisionally, the deviation a candidate (R1)."
