# The subtypes of the class M, Marschen (KA5 2005, the type texts pp. 249-253), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "MR":
    - code: "MRb"
      name: "Brackrohmarsch"
      synonyms: ["Unentwickelte Brackmarsch", "Unreife Brackmarsch"]
      name_en: "Brackish raw marsh"
      name_pt: "Marisma bruta salobra"
      kind: "deviation"
      page: "p. 249"
      formulas:
        - "tbGo-Ah/(tbGo/)tbGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MRb"}
      notes: "Brackish tidal sediment (tb) (pp. 249-250)."
    - code: "MRf"
      name: "Flussrohmarsch"
      synonyms: ["Unentwickelte Flussmarsch", "Unreife Flussmarsch"]
      name_en: "River raw marsh"
      name_pt: "Marisma bruta fluvial"
      kind: "deviation"
      page: "p. 250"
      formulas:
        - "tp(e)Go-Ah/(tp(e)Go/)tp(e)Gr"
      tests:
        all_of:
          - subtype_ka5: {code: "MRf"}
      notes: "Tidal river sediment (tp) (p. 250)."
    - code: "MRn"
      name: "Normrohmarsch"
      synonyms: ["Salzmarsch", "Unentwickelte Marsch", "Unreife Seemarsch"]
      name_en: "Typical raw marsh"
      name_pt: "Marisma bruta típica"
      kind: "norm"
      page: "p. 249"
      formulas:
        - "tm(z)eGo-Ah/(tmzeGo/)tmzeGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MRn", norm: true}
      notes: "Marine tidal sediment (tm), calcareous (e) and salty (z) Gr (p. 249). The fallback of the Rohmarsch (Q21)."
  "MC":
    - code: "MCb"
      name: "Brackkalkmarsch"
      synonyms: ["Kalkbrackmarsch"]
      name_en: "Brackish calcareous marsh"
      name_pt: "Marisma calcária salobra"
      kind: "deviation"
      page: "p. 250"
      formulas:
        - "tb(e)Ah/tbeGo/tbeGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MCb"}
      notes: "Brackish (tb), the Go and Gr calcareous (p. 250)."
    - code: "MCf"
      name: "Flusskalkmarsch"
      synonyms: ["Kalk-Flussmarsch"]
      name_en: "River calcareous marsh"
      name_pt: "Marisma calcária fluvial"
      kind: "deviation"
      page: "p. 250"
      formulas:
        - "tp(e)Ah/tpeGo/tpeGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MCf"}
      notes: "Tidal river sediment (tp), the Go and Gr calcareous (p. 250)."
    - code: "MCn"
      name: "Normkalkmarsch"
      synonyms: ["Typische Kalkmarsch", "Typische Seemarsch"]
      name_en: "Typical calcareous marsh"
      name_pt: "Marisma calcária típica"
      kind: "norm"
      page: "p. 250"
      formulas:
        - "tm(e)Ah/tmeGo/tmzeGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MCn", norm: true}
      notes: "Marine (tm), the Go calcareous (p. 250). The fallback of the Kalkmarsch (Q21)."
  "MO":
    - code: "MOn"
      name: "Normorganomarsch"
      synonyms: ["Typische Humusmarsch", "Typische Organomarsch"]
      name_en: "Typical organic marsh"
      name_pt: "Marisma orgânica típica"
      kind: "norm"
      page: "p. 253"
      formulas:
        - "tmo,tbo,tpoAh/tmo,tbo,tpoGo/tmo,tbo,tpoGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MOn", norm: true}
      notes: "Organic marsh of marine, brackish or tidal river sediment (tmo, tbo, tpo) (p. 253); the only subtype."
  "MK":
    - code: "MKn"
      name: "Normknickmarsch"
      synonyms: ["Typische Knickmarsch", "Knick-Brackmarsch"]
      name_en: "Typical knick marsh"
      name_pt: "Marisma com Knick típica"
      kind: "norm"
      page: "p. 253"
      formulas:
        - "tb,tpAh/tb,tpSw/tb,tpSq/tb,tpGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MKn", norm: true}
      notes: "Brackish or tidal river sediment (tb, tp) with the Knick horizon Sq (p. 253); the only subtype."
  "MD":
    - code: "MDn"
      name: "Normdwogmarsch"
      synonyms: ["Dwog-Flussmarsch"]
      name_en: "Typical dwog marsh"
      name_pt: "Marisma com Dwog típica"
      kind: "norm"
      page: "p. 252"
      formulas:
        - "tp,tbAh/tp,tbSw/IIftp,tbAh°Sd/ftp,tbGo°Sd/tp,tbGo/tp,tbGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MDn", norm: true}
      notes: "Tidal river or brackish sediment (tp, tb), the layer II with its humus and iron Dwog (fAh, fGo overprinted by the Sd) (p. 252); the only subtype."
  "MH":
    - code: "MHb"
      name: "Brackhaftnässemarsch"
      name_en: "Brackish adhesive-water marsh"
      name_pt: "Marisma de umidade aderente salobra"
      kind: "deviation"
      page: "p. 252"
      formulas:
        - "tbAh/tbSg-Go/tbGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MHb"}
      notes: "Brackish (tb), an Sg-Go under the Ah (p. 252)."
    - code: "MHf"
      name: "Flusshaftnässemarsch"
      name_en: "River adhesive-water marsh"
      name_pt: "Marisma de umidade aderente fluvial"
      kind: "deviation"
      page: "p. 252"
      formulas:
        - "tpAh/tpSg-Go/tpGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MHf"}
      notes: "Tidal river sediment (tp), an Sg-Go under the Ah (p. 252)."
    - code: "MHn"
      name: "Normhaftnässemarsch"
      name_en: "Typical adhesive-water marsh"
      name_pt: "Marisma de umidade aderente típica"
      kind: "norm"
      page: "p. 252"
      formulas:
        - "tmAh/tm(e)Sg-Go/tmzeGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MHn", norm: true}
      notes: "Marine (tm), an Sg-Go under the Ah (p. 252). The fallback of the Haftnaessemarsch (Q21)."
  "MN":
    - code: "MNb"
      name: "Brackkleimarsch"
      synonyms: ["Übergangsbrackmarsch"]
      name_en: "Brackish clay marsh"
      name_pt: "Marisma argilosa salobra"
      kind: "deviation"
      page: "p. 251"
      formulas:
        - "tbAh/tbGo/tb(e)Gr"
      tests:
        all_of:
          - subtype_ka5: {code: "MNb"}
      notes: "Brackish (tb) (p. 251)."
    - code: "MNf"
      name: "Flusskleimarsch"
      synonyms: ["Typische Flussmarsch"]
      name_en: "River clay marsh"
      name_pt: "Marisma argilosa fluvial"
      kind: "deviation"
      page: "p. 251"
      formulas:
        - "tpAh/tpGo/tp(e)Gr"
      tests:
        all_of:
          - subtype_ka5: {code: "MNf"}
      notes: "Tidal river sediment (tp) (p. 251)."
    - code: "MNn"
      name: "Normkleimarsch"
      synonyms: ["Typische Kleimarsch"]
      name_en: "Typical clay marsh"
      name_pt: "Marisma argilosa típica"
      kind: "norm"
      page: "p. 251"
      formulas:
        - "tmAh/tmGo/tmzeGr"
      tests:
        all_of:
          - subtype_ka5: {code: "MNn", norm: true}
      notes: "Marine (tm), the Gr calcareous and salty (p. 251). The fallback of the Kleimarsch (Q21)."
