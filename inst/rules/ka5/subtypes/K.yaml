# The subtypes of the class K, Erd- und Mulmmoore (KA5 2005, the type texts pp. 260-262), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "KV":
    - code: "KVc"
      name: "Kalkerdniedermoor"
      name_en: "Calcareous earthified fen"
      name_pt: "Turfa baixa terrificada calcária"
      kind: "deviation"
      page: "p. 261"
      formulas:
        - "nHcv/(nHct/)(nHw/)(nHcr/)(IIfF/)..."
      tests:
        all_of:
          - subtype_ka5: {code: "KVc"}
      notes: "Secondary carbonate in the earthified fen (nHcv) (p. 261)."
    - code: "KVu"
      name: "Übergangserdmoor"
      name_en: "Earthified transitional moor"
      name_pt: "Turfa de transição terrificada"
      kind: "deviation"
      page: "p. 261"
      formulas:
        - "uHv/(uHt/)(uHw/)(uHr/)(nHr/)(IIfF/)III(f)..."
      tests:
        all_of:
          - subtype_ka5: {code: "KVu"}
      notes: "An earthified transitional moor (uHv) (p. 261)."
    - code: "KVn"
      name: "Normerdniedermoor"
      name_en: "Typical earthified fen"
      name_pt: "Turfa baixa terrificada típica"
      kind: "norm"
      page: "p. 261"
      formulas:
        - "nHv/(nHt/)(nHw/)(nHr/)(IIfF/)..."
      tests:
        all_of:
          - subtype_ka5: {code: "KVn", norm: true}
      notes: "Typically base-rich (p. 261). The fallback of the Erdniedermoor (Q21)."
  "KM":
    - code: "KV-KM"
      name: "Erdniedermoor-Mulmniedermoor"
      name_en: "Earthified fen-mulmified fen"
      name_pt: "Turfa baixa terrificada-turfa baixa pulverulenta"
      kind: "transition"
      page: "p. 262"
      formulas:
        - "nHvm/(nHa/)(nHt/)(nHw/)(nHr/)(IIfF/)..."
      tests:
        all_of:
          - subtype_ka5: {code: "KV-KM"}
      notes: "The only transitional unit between the Erd- and Mulmniedermoore: an nHvm at the top (p. 262)."
    - code: "KMc"
      name: "Kalkmulmniedermoor"
      name_en: "Calcareous mulmified fen"
      name_pt: "Turfa baixa pulverulenta calcária"
      kind: "deviation"
      page: "p. 261"
      formulas:
        - "nHcm/nHca/(nHcw/)(nHcr/)(IIfF/)..."
      tests:
        all_of:
          - subtype_ka5: {code: "KMc"}
      notes: "Secondary carbonate in the mulmified fen (nHcm, nHca) (p. 261); the nHcw printed twice is read once, optional as in KMn and KMu (slip 36)."
    - code: "KMu"
      name: "Übergangsmulmmoor"
      name_en: "Mulmified transitional moor"
      name_pt: "Turfa de transição pulverulenta"
      kind: "deviation"
      page: "p. 261"
      formulas:
        - "uHm/uHa/uHt/(uHw/)(uHr/)(IInHr/)(II,IIIfF/)..."
      tests:
        all_of:
          - subtype_ka5: {code: "KMu"}
      notes: "A mulmified transitional moor (uHm, uHa, uHt) (p. 261)."
    - code: "KMn"
      name: "Normmulmniedermoor"
      name_en: "Typical mulmified fen"
      name_pt: "Turfa baixa pulverulenta típica"
      kind: "norm"
      page: "p. 261"
      formulas:
        - "nHm/nHa/nHt/(nHw/)(nHr/)(IIfF/)..."
      tests:
        all_of:
          - subtype_ka5: {code: "KMn", norm: true}
      notes: "Typically base-rich (p. 261). The fallback of the Mulmniedermoor (Q21)."
  "KH":
    - code: "[KHm]"
      name: "[vermulmtes Erdhochmoor]"
      name_en: "[Earthified bog, mulmified]"
      name_pt: "[Turfa alta terrificada, pulverulenta]"
      kind: "deviation"
      page: "pp. 262, 284; Q22"
      formulas:
        - "hH(v)m/..."
      tests:
        all_of:
          - subtype_ka5: {code: "[KHm]"}
      notes: "soilKey's open subtype (Q22): an hHm or hHvm at the top, a mulmified bog that no KA5 type takes, read under the Erdhochmoor with the note [vermulmt] (KA6 has a Mulmhochmoor)."
    - code: "KHn"
      name: "Normerdhochmoor"
      name_en: "Typical earthified bog"
      name_pt: "Turfa alta terrificada típica"
      kind: "norm"
      page: "p. 262"
      formulas:
        - "hHv/hHw/(hHr/)(IIuHr/)(II,IIInHr/)(...fF/)..."
      tests:
        all_of:
          - subtype_ka5: {code: "KHn", norm: true}
      notes: "The only printed subtype of the Erdhochmoor (p. 262)."
