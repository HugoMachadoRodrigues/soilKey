# The subtypes of the class C, Terrae calcis (KA5 2005, the type texts pp. 202-237), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "CF":
    - code: "BB-CF"
      name: "Braunerde-Terra fusca"
      name_en: "Brown earth-terra fusca"
      name_pt: "Terra parda-terra fusca"
      kind: "transition"
      page: "p. 225"
      formulas:
        - "Ah/Bv-Tv/cC"
      checks:
        - {check: "value", of: {masters: ["T"], with: ["Bv"]}, attr: "clay_pct", thr: "st_bv_tv_clay_pct", side: "range", what: "the Bv-Tv"}
      tests:
        all_of:
          - subtype_ka5: {code: "BB-CF"}
      notes: "A Bv-Tv with 45 to < 65 % clay, e.g. from loess loam mixed in (p. 225); the clay tested where recorded."
    - code: "LL-CF"
      name: "Parabraunerde-Terra fusca"
      name_en: "Parabraunerde-terra fusca"
      name_pt: "Parabraunerde-terra fusca"
      kind: "transition"
      page: "p. 225"
      formulas:
        - "Ah/Al/(II)Bt-(r)Tv/(Tv/)C"
      windows:
        - {kind: "first_top", of: {masters: ["T"]}, thr: "st_ll_cf_max_cm", side: "max", what: "the Bt-Tv under the Ah/Al"}
      tests:
        all_of:
          - subtype_ka5: {code: "LL-CF"}
      notes: "Loess mixed in, its clay translocation overprinting the Terra material; the Ah/Al ends above 3 dm (p. 225)."
    - code: "SS-CF"
      name: "Pseudogley-Terra fusca"
      name_en: "Pseudogley-terra fusca"
      name_pt: "Pseudogleissolo-terra fusca"
      kind: "transition"
      page: "p. 225"
      formulas:
        - "Ah/Sw-Ah,Sw-Tv/(Tv-Sw/)Tv-Sd/C"
      windows:
        - {kind: "first_top", of: {masters: ["S"]}, thr: "st_s_window_cm", side: "range", what: "the first S horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "SS-CF"}
      notes: "Waterlogging from reduced karst drainage; the S horizons begin 4 to < 8 dm under the GOF (p. 225)."
    - code: "CFc"
      name: "Kalkterra fusca"
      name_en: "Calcareous terra fusca"
      name_pt: "Terra fusca calcária"
      kind: "deviation"
      page: "p. 224"
      formulas:
        - "A(c)h/Tcv/cC"
      tests:
        all_of:
          - subtype_ka5: {code: "CFc"}
      notes: "Secondary carbonate (Tcv), only partly to the topsoil (p. 224)."
    - code: "CFn"
      name: "Normterra fusca"
      name_en: "Typical terra fusca"
      name_pt: "Terra fusca típica"
      kind: "norm"
      page: "p. 224"
      formulas:
        - "Ah/Tv/cC"
      tests:
        all_of:
          - subtype_ka5: {code: "CFn", norm: true}
      notes: "The Tv mostly bright yellowish to reddish brown (typical, p. 224). The fallback of the Terra fusca (Q21)."
  "CR":
    - code: "CRn"
      name: "Normterra rossa"
      name_en: "Typical terra rossa"
      name_pt: "Terra rossa típica"
      kind: "norm"
      page: "p. 225"
      formulas:
        - "Ah/Tu/cC"
      tests:
        all_of:
          - subtype_ka5: {code: "CRn", norm: true}
      notes: "The only subtype of the Terra rossa (p. 225)."
