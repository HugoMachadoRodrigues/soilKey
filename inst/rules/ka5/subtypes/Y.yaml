# The subtypes of the class Y, Terrestrische anthropogene Böden (KA5 2005, the type texts pp. 202-237), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "YK":
    - code: "PP-YK"
      name: "Podsol-Kolluvisol"
      name_en: "Podzol-colluvisol"
      name_pt: "Podzol-coluvissolo"
      kind: "transition"
      page: "p. 234"
      formulas:
        - "(Ahe/)Ae/Bhs/M/II..."
      windows:
        - {kind: "last_bottom", of: {pattern: "^B[hms]*(h|s)[hms]*$"}, thr: "st_podzol_part_max_cm", side: "max", what: "the podzol part (its last Bh or Bs)"}
      tests:
        all_of:
          - subtype_ka5: {code: "PP-YK"}
      notes: "The podzol part (Ahe/Ae/Bhs) ends above 1.5 dm over the M (p. 234)."
    - code: "SS-YK"
      name: "Pseudogley-Kolluvisol"
      name_en: "Pseudogley-colluvisol"
      name_pt: "Pseudogleissolo-coluvissolo"
      kind: "transition"
      page: "p. 234"
      formulas:
        - "Ah/M/(Sw-M/)(M-)Sw/II(Sw/)Sd"
      windows:
        - {kind: "first_top", of: {masters: ["S"]}, thr: "st_s_window_cm", side: "range", what: "the first S horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "SS-YK"}
      notes: "The S horizons begin 4 to < 8 dm under the GOF (p. 234)."
    - code: "GG-YK"
      name: "Gley-Kolluvisol"
      name_en: "Gley-colluvisol"
      name_pt: "Gleissolo-coluvissolo"
      kind: "transition"
      page: "p. 234"
      formulas:
        - "Ah/(Go-)M/(M-Go/)IIGo/Gr"
      typical_tail: true
      windows:
        - {kind: "first_top", of: {masters: ["G"]}, thr: "st_g_window_cm", side: "range", what: "the first G horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "GG-YK"}
      notes: "The Go (transitional Go included) begins 4 to < 8 dm under the GOF; the Gr often 13 dm or deeper (p. 234)."
    - code: "YKn"
      name: "Normkolluvisol"
      name_en: "Typical colluvisol"
      name_pt: "Coluvissolo típico"
      kind: "norm"
      page: "p. 234"
      formulas:
        - "Ah/M/II..."
      tests:
        all_of:
          - subtype_ka5: {code: "YKn", norm: true}
      notes: "The fallback of the Kolluvisol (Q21) (p. 234)."
  "YE":
    - code: "PP-YE"
      name: "Podsol-Plaggenesch"
      name_en: "Podzol-plaggen soil"
      name_pt: "Podzol-solo plaggen"
      kind: "transition"
      page: "p. 235"
      formulas:
        - "(Ahe/)Ae/Bhs/E/II..."
      windows:
        - {kind: "last_bottom", of: {pattern: "^B[hms]*(h|s)[hms]*$"}, thr: "st_podzol_part_max_cm", side: "max", what: "the podzol part (its last Bh or Bs)"}
      tests:
        all_of:
          - subtype_ka5: {code: "PP-YE"}
      notes: "The podzol part (Ahe/Ae/Bhs) ends above 1.5 dm over the E (p. 235)."
    - code: "SS-YE"
      name: "Pseudogley-Plaggenesch"
      name_en: "Pseudogley-plaggen soil"
      name_pt: "Pseudogleissolo-solo plaggen"
      kind: "transition"
      page: "p. 235"
      formulas:
        - "Ah/(Sw-)E/E-Sw/IISw/Sd"
      windows:
        - {kind: "first_top", of: {masters: ["S"]}, thr: "st_s_window_cm", side: "range", what: "the first S horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "SS-YE"}
      notes: "The S horizons begin 4 to < 8 dm under the GOF (p. 235)."
    - code: "GG-YE"
      name: "Gley-Plaggenesch"
      name_en: "Gley-plaggen soil"
      name_pt: "Gleissolo-solo plaggen"
      kind: "transition"
      page: "p. 235"
      formulas:
        - "Ah/(Go-)E/(E-Go/)IIGo/Gr"
      typical_tail: true
      windows:
        - {kind: "first_top", of: {masters: ["G"]}, thr: "st_g_window_cm", side: "range", what: "the first G horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "GG-YE"}
      notes: "The Go begins 4 to < 8 dm under the GOF (p. 235)."
    - code: "YEn"
      name: "Normplaggenesch"
      name_en: "Typical plaggen soil"
      name_pt: "Solo plaggen típico"
      kind: "norm"
      page: "p. 235"
      formulas:
        - "Ah/E/II..."
      tests:
        all_of:
          - subtype_ka5: {code: "YEn", norm: true}
      notes: "The fallback of the Plaggenesch (Q21) (p. 235)."
  "YO":
    - code: "YOn"
      name: "Normhortisol"
      name_en: "Typical hortisol"
      name_pt: "Hortissolo típico"
      kind: "norm"
      page: "p. 236"
      formulas:
        - "Ap/Ex/(Ex-)C"
      tests:
        all_of:
          - subtype_ka5: {code: "YOn", norm: true}
      notes: "The only subtype of the Hortisol (p. 236; OCR 'VOn')."
  "YY":
    - code: "[X-YY]"
      name: "[X-Rigosol]"
      name_en: "[Rigosol from X]"
      name_pt: "[Rigossolo de X]"
      kind: "transition"
      page: "p. 236"
      tests:
        all_of:
          - open_transition_ka5: {type: "YY"}
      notes: "soilKey's open subtype (Q22): the type X still recognisable under or in the R (an Ael with a Bt: LF; a Bt: LL; a Bh or Bs: PP; a G or S beginning under 8 dm: GG, SS; a P: DD; a Tu: CR; a Tv: CF; an Axh: TT; an M: YK; an E: YE; a Bv: BB) names it, written in brackets ([BB-YY]). The text invites further subtypes so named (p. 236)."
    - code: "YYn"
      name: "Normrigosol"
      name_en: "Typical rigosol"
      name_pt: "Rigossolo típico"
      kind: "norm"
      page: "p. 236"
      formulas:
        - "R-Ap/(Ah-)R/C"
        - "R/C"
      tests:
        all_of:
          - subtype_ka5: {code: "YYn", norm: true}
      notes: "The fallback of the Rigosol (Q21); further subtypes name the type the Rigosol formed from, as far as it is still recognisable (p. 236, Q22: the open subtype [X-YY])."
  "YU":
    - code: "PP-YU"
      name: "Treposol aus Podsol"
      synonyms: ["Heidekulturboden", "Podsol-Treposol"]
      name_en: "Podzol-treposol"
      name_pt: "Podzol-treposol"
      kind: "transition"
      page: "p. 237"
      formulas:
        - "R-Ap/R+B(h)s,B(s)h/C"
      tests:
        all_of:
          - subtype_ka5: {code: "PP-YU"}
      notes: "An example subtype: the podzol B ploughed into the R (R+B(h)s) (p. 237)."
    - code: "LL-YU"
      name: "Treposol aus Parabraunerde"
      synonyms: ["Parabraunerde-Treposol"]
      name_en: "Parabraunerde-treposol"
      name_pt: "Parabraunerde-treposol"
      kind: "transition"
      page: "p. 237"
      formulas:
        - "R-Ap/R+Bt/C"
      checks:
        - {check: "absent", parts: "^Ael$"}
      tests:
        all_of:
          - subtype_ka5: {code: "LL-YU"}
      notes: "An example subtype: the Bt ploughed into the R (R+Bt) (p. 237)."
    - code: "LF-YU"
      name: "Treposol aus Fahlerde"
      synonyms: ["Fahlerde-Treposol"]
      name_en: "Fahlerde-treposol"
      name_pt: "Fahlerde-treposol"
      kind: "transition"
      page: "p. 237"
      formulas:
        - "R-Ap/R+Ael+Bt/C"
      checks:
        - {check: "fahlerde"}
      tests:
        all_of:
          - subtype_ka5: {code: "LF-YU"}
      notes: "An example subtype: the Ael and Bt ploughed into the R (R+Ael+Bt) (p. 237); the Fahlerde's clay difference tested where measured (C13)."
    - code: "GG-YU"
      name: "Treposol aus Gley"
      synonyms: ["Gley-Treposol"]
      name_en: "Gley-treposol"
      name_pt: "Gleissolo-treposol"
      kind: "transition"
      page: "p. 237"
      formulas:
        - "R-Ap/Go+R/G"
      windows:
        - {kind: "first_top", of: {masters: ["G"]}, thr: "st_g_window_cm", side: "range", what: "the first G horizon"}
      tests:
        all_of:
          - subtype_ka5: {code: "GG-YU"}
      notes: "An example subtype: the Go ploughed with the R (Go+R) over a G that begins 4 to < 8 dm under the GOF (p. 237)."
    - code: "[X-YU]"
      name: "[Treposol aus X]"
      name_en: "[Treposol from X]"
      name_pt: "[Treposol de X]"
      kind: "transition"
      page: "p. 237"
      tests:
        all_of:
          - open_transition_ka5: {type: "YU"}
      notes: "soilKey's open subtype (Q22): the type X still recognisable under or in the R (an Ael with a Bt: LF; a Bt: LL; a Bh or Bs: PP; a G or S beginning under 8 dm: GG, SS; a P: DD; a Tu: CR; a Tv: CF; an Axh: TT; an M: YK; an E: YE; a Bv: BB) names it, written in brackets ([BB-YU]). The four printed subtypes are examples (p. 237); the Treposol has no Norm subtype."
