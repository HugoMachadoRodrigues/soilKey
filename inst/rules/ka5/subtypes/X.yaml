# The subtypes of the class X, Reduktosole (KA5 2005, the type texts pp. 202-237), keyed
# after the type by subtype_ka5() (R/subtypes-ka5.R). Order inside a type: the transitional
# subtypes in printed order, then the deviation subtypes in printed order, the Norm subtype last
# as the fallback (Hugo's decision Q21, 2026-11-04). Each formula is a printed alternative as the
# book writes it (tests/testthat/fixtures/ka5-formulas.tsv, from the page images); the windows
# are the annotations under the formulas, read from the GOF with the range rule, the numbers in
# thresholds.yaml; the checks are the numbers of the text, tested where recorded. Names as
# printed (German), with soilKey's English and Portuguese glosses; the criteria are paraphrased.
subtypes:
  "XX":
    - code: "XXt"
      name: "Rohreduktosol"
      name_en: "Raw reductosol"
      name_pt: "Redutossolo bruto"
      kind: "deviation"
      page: "p. 233"
      formulas:
        - "(Yo-)Ai/(Yo/)Yr"
      tests:
        all_of:
          - subtype_ka5: {code: "XXt"}
      notes: "An Ai, with or without Yo, over the Yr (p. 233)."
    - code: "XXx"
      name: "Ockerreduktosol"
      name_en: "Ochre reductosol"
      name_pt: "Redutossolo ocre"
      kind: "deviation"
      page: "p. 233"
      formulas:
        - "Ah/Yo/Yr"
      windows:
        - {kind: "first_top", of: {codes: ["Yr"]}, thr: "st_xx_yr_cm", side: "min", what: "the Yr"}
      tests:
        all_of:
          - subtype_ka5: {code: "XXx"}
      notes: "The Yr begins 4 dm or deeper under the Yo (p. 233)."
    - code: "XXu"
      name: "Fahlreduktosol"
      name_en: "Pale reductosol"
      name_pt: "Redutossolo pálido"
      kind: "deviation"
      page: "p. 233"
      formulas:
        - "Ah/Yr"
      closed_on: ["Yo"]
      tests:
        all_of:
          - subtype_ka5: {code: "XXu"}
      notes: "A Yr directly under the Ah (p. 233)."
    - code: "XXn"
      name: "Normreduktosol"
      name_en: "Typical reductosol"
      name_pt: "Redutossolo típico"
      kind: "norm"
      page: "p. 232"
      formulas:
        - "Ah/Yo/Yr"
      windows:
        - {kind: "first_top", of: {codes: ["Yr"]}, thr: "st_xx_yr_cm", side: "max", what: "the Yr"}
      complement: ["XXx"]
      tests:
        all_of:
          - subtype_ka5: {code: "XXn", norm: true}
      notes: "The Yr begins under 4 dm (p. 232). The fallback of the Reduktosol (Q21): with its formula or this mark not met it holds provisionally, the deviation a candidate (R1)."
