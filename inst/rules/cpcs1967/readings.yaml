# The readings soilKey makes of the CPCS 1967 where the text is silent or
# ambiguous, and the owner's decisions. Pages are the printed pages of the
# 1967 text (the AFES PDF page is the printed page + 2).
readings:
  - topic: "Scope, levels and names"
    page: "pp. 3, 5-10, 15"
    reading: "soilKey keys the major units of the CPCS (class, sub-class, group, subgroup), the units of the reference classification; the text stops at the subgroup (p. 10). This release keys the twelve classes, their 35 sub-classes, their 101 groups and their 276 subgroups. The names are French, as the text writes them, in name and name_native: the CPCS has no official English names (Hugo, 2026-11-01). Class IX takes the name of the table of classes (p. 15), sols à sesquioxydes de fer et manganèse; its chapter heading says sols à sesquioxydes de fer (ou de manganèse). The codes are the text's Roman numerals."
  - topic: "Order of the classes"
    page: "pp. 8, 22-23, 24, 28-29, 35, 50, 61, 67, 73, 77"
    reading: "The CPCS gives no key. The classes are keyed in an order built from the text's statements of precedence (Hugo, 2026-11-01): I (sols minéraux bruts), III (vertisols), XII (sols sodiques), IV (andosols), VIII (sols podzolisés), X (sols ferrallitiques), IX (sols à sesquioxydes de fer et manganèse), XI (sols hydromorphes), II (sols peu évolués), VI (sols isohumiques), V (sols calcimagnésiques), VII (sols brunifiés). From the text: the vertisols, podzolised, ferrallitic and sesquioxide soils keep their own strong hydromorphy (pp. 28-29, 50, 61, 67); hydromorphy and halomorphy make a class only when intense (pp. 8, 73, 77); permafrost soils stay in class II even when waterlogged (pp. 22-23), so class XI excludes them; class V excludes the vertisols and the isohumic soils (p. 35). Decided by Hugo (2026-11-01), not stated by the text: the sesquioxide soils exclude the isohumic soils; a peat (the peat route of class XI) excludes the mineral classes keyed before class XI, as the permafrost excludes class XI, so a peat over an andosol, a podzol or a vertisol is a hydromorphic soil; class VII is what remains of the developed soils."
  - topic: "Organic matter, depths, ranges"
    page: "pp. 11, 17, 21"
    reading: "Every threshold of the text is in % organic matter: OM = 1.72 x organic carbon, the French convention of the time. Depths are measured from the top of the first mineral horizon (Aoo and Ao are measured upward from the top of A1, p. 11); the peat of class XI is measured from the ground. A range given as a threshold is read by its lower end for a minimum and its upper end for a maximum, as in the SiBCS (Hugo, 2026-11-01)."
  - topic: "Horizon notation and the profile types"
    page: "pp. 11-13"
    reading: "The old French notation is read when site$designation_system is 'cpcs' (or 'cpcs1967', 'french'), or recognised by its own symbols (Aoo or Ao, (A), (B), Bfe, Ca, Can, Cs, Cn or Sa after a master, a G master, the B1 to B3 numbering), never by the country: later French descriptions use other notations. Only the symbol is read: a Roman or Arabic numeral written apart is joined to its master ('II B3', p. 12); a word after a space or a slash ('Btg/glossic') and a bracketed letter after the master (the New Zealand 'Bw(h)') are notes; a designation written all in lower case takes capital masters (ab, bc and ac are transitions; an r after c is a weathered rock). In the CPCS notation A2 is the eluvial horizon (E), and a g master (the molken podzols, pp. 52, 54) is read as an A2; in the FAO notation A1 and A2 are subdivisions of the A. A3 and AB are transitions closer to A (p. 13; p. 11 calls AB a horizon that cannot be assigned to A or B), and A/B, a mixed horizon (p. 13), is read as AB; (B) is a structural or colour B, which differs from A or C in consistence, structure or colour (p. 12); a B alone is an enriched B in the CPCS notation. B1 and B3 are parts of the B closer to A or C, and BA and BC transitions: on their own they leave an enriched B undecided. g is pseudogley and G (Go, Gr) gley; Ca, Can, Cs, Cn and Sa are carbonate, carbonate nodules, gypsum, ferro-aluminous concretions and salts, also written after an A or B master (BCa, B2Cn); a Roman numeral marks a change of parent material; a buried horizon (b) belongs to a buried profile and not to the profile type. The FAO letters (E, Bw, Bt, Bs, Bh, Bk, Ck, Oi ...) are read beside them; a Cr is weathered rock; f is frozen only on a mineral master, and not in the Canadian, New Zealand or Australian notations (declared, or the country when none is declared), where it is iron or fibric: a Bf there is an iron B, read as a Bfe; in those notations v is vertic, y cryoturbated and z frozen (the CSSC), not the FAO plinthite, gypsum and salts. In the CPCS notation a B with letters the CPCS does not use (an FAO Bdu) leaves the enriched B undecided. The profile type (is there a B, a (B), an A2?) is read from the notation; soilKey's diagnostic horizons stand in where a mineral row has no designation or the FAO notation leaves the enriched B open: a B when one of the argic, cambic, natric, ferralic or nitic horizons passes (the spodic horizon only when it passes), none when all fail, an A2 when a layer of albic material (soilKey's claric colours) lies over a mineral layer that is not albic (a pale C at the base of a sand is not an A2). The properties (organic matter, C/N, Ki, mottles, colours, carbonate, gypsum, concretions) are read from the recorded data first and from the notation only where the data are missing (Hugo, 2026-11-01): a Ca, Cs or Cn of the notation counts only where caco3_pct, caso4_pct or ferric_nodules_pct is not recorded."
  - topic: "Class I, sols minéraux bruts"
    page: "p. 17"
    reading: "A profile (A)C, (A)R or R: no A2, B or (B), no organic layer over the mineral soil, and only traces of organic matter in the top 20 cm: every mineral layer starting within 20 cm has 0.5 % OM or less, the top 3 cm 1.5 % (Hugo, 2026-11-01); this keeps the grey subdesert soils of II/31, with under 1 % OM, in class II. Without carbon, an (A), C, R or G is a raw layer and an A or a B is not. A profile of organic layers only is not a raw mineral soil."
  - topic: "Class II, sols peu évolués"
    page: "pp. 21-25, 35"
    reading: "Permafrost (a gelic or pergelic regime, a permafrost temperature of 0 C or less, ice, or a frozen layer of the notation); or an AC profile (no A2, B or (B)) with more than traces of organic matter; an organic layer over the mineral soil (a litter, a mor) is more than traces, so a thin litter over a raw sand is a weakly developed soil. The text says class V does not take the weakly developed soils on carbonate rocks, and that class II owes its lack of weathering to a cold or dry desert climate, or to material laid down or exposed by erosion some years or decades before (p. 21): an AC soil with the chemistry of class V (pH above 6.8, saturation by Ca and Mg above 90 % or a calcareous A) and a source of Ca or Mg (carbonate in the profile, or a calcareous or ultrabasic rock) is therefore a calcimagnesic soil, unless a recent deposit (alluvial, colluvial, aeolian, volcanic, anthropic, from the recorded origin of the layers; not a glacial or fluvioglacial deposit, nor loess) or recent erosion (recorded truncation or deflation, or erosion named, with negated words taken out) is recorded (Hugo, 2026-11-01). The humic lithocalcic soils (pH under 6.8) stay in class II."
  - topic: "Class III, vertisols"
    page: "p. 27"
    reading: "Slickensides or wedge-shaped aggregates, common or more, in a layer starting within 150 cm (the text places them at least at the base of the profile, not within 100 cm); 30 % clay or more through the (B); shrinkage cracks of 0.5 cm or more when cracks are recorded, the width soilKey reads for the WRB (unrecorded cracks do not block; the text only says wide; Hugo, 2026-11-01, after the canonical Vertisol, with cracks of 0.5 to 0.8 cm, fell out of the class at 1 cm); no B other than (B) (Hugo, 2026-11-01). Slickensides that are not recorded are read as absent, as surveyors note them when they see them."
  - topic: "Class XII, sols sodiques"
    page: "pp. 77-79"
    reading: "EC of the saturated paste above 7 dS/m in every horizon of the solum (the A and B horizons and their transitions to 100 cm; in a profile without a B, the horizons to 50 cm and any deeper A; in an undesignated profile, the horizons to 50 cm, deeper ones under 7 dS/m leaving the class undecided unless soilKey finds no B; the C below the solum is the parent material: the text's 'ensemble du profil'; Hugo, 2026-11-01, after the canonical Solonchak, with a non-saline C below 60 cm, fell out of the class when every horizon to 100 cm counted), or exchangeable Na above 10 % of the CEC in a horizon within 100 cm with the text's massive, diffuse structure (structure type massive or columnar, or grade structureless) and a compact consistence (very firm or harder, or very hard or harder) (Hugo, 2026-11-01). Only Na counts: the text says the Mg threshold is not known. Clean sands (sand of 85 % or more, silt + 1.5 x clay under 15 in every horizon to 100 cm) and a salinity of gypsum alone (gypsum recorded and Na at 10 % of the CEC or less) are not sodic. With no EC and no Na recorded the class is not met, unless salts are seen (a Sa of the notation, visible halite), which leaves it undecided."
  - topic: "Class IV, andosols"
    page: "pp. 24, 31-34"
    reading: "soilKey's andic properties over 30 cm or more within 100 cm (undecided layers counted as possible), a CEC above 25 cmol(+)/kg where it is measured, as the thickness-weighted mean of the andic A and (B) within 100 cm (soilKey's reading: the text gives the CEC of the andosol as a whole, best obtained by summing H, Al and the bases, p. 32; cec_cmol is read whatever its method), and a B or (B): an allophanic AC soil is a weakly developed soil (II/23, 'ce ne sont pas des andosols', p. 24) (Hugo, 2026-11-01). The text gives the cold-country andosols of IV/11 a profile 'A (B) C, le plus souvent, ou AC' (p. 33); the decision keeps the (B) for the class, so such an AC andosol falls to class II. Where the andic data are missing, a soil with no sign of volcanic material (tephra, ash, pumice, glass named in the origin of a layer or the parent material, or volcanic glass recorded) is not an andosol."
  - topic: "Class VIII, sols podzolisés"
    page: "pp. 49-55"
    reading: "A podzolic B by criterion 2 of the text: OM above 0.5 %, C/N above 14, and more carbon than the A2 when there is one; without C or N, a Bh, Bs or Bfe of the notation, unless the OM is recorded at 0.5 % or less. The notation gives the kind of B: a (B), Bw or Bt, or a B with other symbols only, is not a podzolic B; a plain B of the FAO notation stays undecided. In an undesignated profile, soilKey's spodic horizon decides when it can (the C/N of an undesignated layer may be that of a C); otherwise the C/N of the layers below the A, a layer of albic material being an A2, not a B. A transition (BA, BC, B1, B3) follows its core B: on its own, without h, s or fe, it is not a podzolic B. Or an ashy A2 (albic material, soilKey's claric colours) without a B, the humo-ashy soils; not a g master nor an A2 with 5 % mottles or more, which the text says must not be confused with the A2 (p. 51). The US ratio of 0.15, which the text quotes as indicative, is not used (Hugo, 2026-11-01)."
  - topic: "Class X, sols ferrallitiques, and class IX, sols à sesquioxydes de fer et manganèse"
    page: "pp. 57-60, 63-66"
    reading: "Both need a B or (B). The B is read in the larger part of its first 100 cm, as soilKey reads the SiBCS B; without a designated B, the undesignated rows below the A. Class X: Ki (SiO2/Al2O3) of 2.0 or less. The figure is the one the class IX definition gives (SiO2/Al2O3 above 2, p. 57); the class X chapter speaks of the silica/alumina ratio with no figure (p. 63) and says a CEC limit is hard to set (p. 64). The sulfuric attack (sio2_sulfuric_pct, al2o3_sulfuric_pct) and, without Ki, a CEC of the clay of 16 cmol(+)/kg or less are soilKey's (Hugo, 2026-11-01). Class IX: Ki above 2 (without Ki, a CEC of the clay above 16), base saturation above 50 % (bs_pct, else the sum of the bases over the CEC, a missing K or Na counted as nil) and individualised iron (Hugo, 2026-11-01). Individualised iron: a reddened B (5YR or redder with a moist chroma of 4 or more, the fersiallitic colours of p. 60), or iron concretions; a 7.5YR or 10YR B with chroma 4 or more and value 5 or more (the ferruginous tropical colours of p. 58) only under a tropical climate (an isothermic, isohyperthermic or hyperthermic soil temperature regime, or a latitude of 23.5 degrees or less); a neutral B is not (Hugo, 2026-11-01: 10YR or redder with chroma 4 took most temperate brown and leached soils, as the canonical Cambisol and Luvisol showed). Not tested at the class level: the low organic matter of class IX (p. 57), the black colours of abundant manganese oxides (p. 57), and the brown subgroup 212 (p. 60), which the reddened B leaves out unless concretions are recorded."
  - topic: "Class XI, sols hydromorphes"
    page: "pp. 73-76"
    reading: "No permafrost, and one of (Hugo, 2026-11-01): peat (more than 30 % OM, more than 20 % in a sandy material, as the text says 'plus de'; 30 % for every material that is not sandy, where the text names clayey material) over 40 cm or more of the top 80 cm of the ground (above any rock); 8 to 30 % OM over 20 cm or more from the mineral surface, directly over a gley or stagnogley; hydromorphic layers over more than half of the profile from the base of the A1 (the A1 rows, not an A3 or AB, 'dès la base de A1', p. 76) to 100 cm. A hydromorphic layer: a recorded mottle percentage of 5 or more, or a reduced matrix; a g or G of the notation only where no mottles are recorded (the recorded data first). A reduced matrix: a positive dipyridyl test, or chroma 2 or less with value 4 or more (not in an A2 or an organic layer); the text's 'teintes grises, verdâtres ou bleutées de chroma 2 ou moins' (p. 75) is restricted by soilKey to a hue of 5Y or bluer, or neutral, unless a G of the notation names the gley, to keep grey parent materials out; a G with no colour recorded is reduced. A deep gley alone does not make the class. A mottle that is not recorded is absent (Hugo, 2026-11-01). In the CPCS notation an H is a layer of the Ao (p. 11), not peat, so with no carbon it is undecided; in the FAO notation it is peat."
  - topic: "Class VI, sols isohumiques"
    page: "pp. 39-40"
    reading: "OM in the top 15 cm of at least 0.5 % (sandy: clay + silt under 15 %) or 1 % (clayey: clay above 40 %), the text's two figures, and 0.75 % for the textures between, soilKey's (Hugo, 2026-11-01); marked horizons (OM at least their texture minimum, 0.75 % when the texture is not known) from the top over half the depth to the C or more; a gradual decrease: no marked horizon with a third or less of the OM of the one above, and the horizon under the A with more than a third of the OM of the A (an A directly on rock is a sharp transition; nothing described under the A leaves it undecided) (Hugo, 2026-11-01: at a half, the canonical Kastanozem and Phaeozem, whose OM halves from one horizon to the next, fell out of the class). The transition under the A is read because in an AC profile the depth to the C is the thickness of the A, so the marked horizons alone cannot tell an isohumic soil from a rendzina, and the text separates the two classes by it (p. 35). The complex is saturated: S/T of 50 % or more in the upper horizons, rising to 80 % or more in the B (p. 39), read in the larger part of its first 100 cm; a calcareous horizon counts as saturated. Organic matter that is not recorded leaves the class undecided."
  - topic: "Class V, sols calcimagnésiques"
    page: "p. 35"
    reading: "No enriched B (a (B) is allowed); in the A, pH(H2O) above 6.8 and saturation by Ca and Mg above 90 % (a calcareous A counts as saturated; base saturation when Ca or Mg is not given). The class excludes the isohumic soils (p. 35), which are keyed before it, so the fall of organic matter is not tested here (Hugo, 2026-11-01: a soil poor in OM throughout, as the canonical Gypsisol, could not show a sharp fall)."
  - topic: "Class VII, sols brunifiés"
    page: "p. 45"
    reading: "The developed soils that remain: a B, a (B) or an A2 (an eluvial horizon is already a developed horizon; Hugo, 2026-11-01)."
  - topic: "Sub-classes and the climate"
    page: "pp. 8-9"
    reading: "The sub-classes rest where possible on the pedoclimate. A climatic sub-class needs its climate and the morphology of one of its groups; with no climate recorded the soil falls to the class's non-climatic or temperate sub-class (I-1, II-4, VII-1, VIII-1), and the trace says so (Hugo, 2026-11-01). The temperate sub-classes VII-1 and VIII-1 hold under a temperate climate (Köppen C, or D with a or b; regimes that are not tropical, cryic, gelic, pergelic, aridic or torric) or with no climate recorded; under another recorded climate, a soil without the morphology of the climatic sub-class has an undecided sub-class rather than a temperate name (Hugo, 2026-11-01). The Köppen code is read in its own case (dfc is Dfc); a value that is not a Köppen code is not read. The climate is read from site$koppen_climate (a new field: the Koppen code, Af to EF), else from the USDA soil temperature and moisture regimes, else from the latitude (23.5 degrees or less is tropical; Brazil, soilKey's convention for the WRB ferralic horizon, when no latitude is recorded). The isohumic soils have four climatic sub-classes and no default: with no climate recorded, and without the property test of VI-1, their sub-class is undecided. site$mean_annual_precip_mm (new) is recorded for the CPCS climate but decides nothing yet."
  - topic: "Sub-classes of classes I and II"
    page: "pp. 18-25"
    reading: "I-2, cold deserts: permafrost, a cryic, pergelic or gelic regime, or Koppen E. I-3, hot deserts: an aridic or torric regime, or Koppen BW. I-1: the others. II-1: permafrost. II-2, humic: 5 % OM or more in the A (the text says only 'teneurs élevées'; Hugo, 2026-11-01), pH under 6.8, and not an arid climate. II-3, xeric: a dry climate (an aridic, torric, xeric or ustic regime, or Koppen B or Cs), under 2 % OM in the A, and no calcareous accumulation horizon (a Ca of the notation below the A, or soilKey's calcic horizon). II-4: the others (Hugo, 2026-11-01)."
  - topic: "Sub-classes of classes III and IV"
    page: "pp. 27-29, 33"
    reading: "III-1, external drainage nil or reduced (the text's runoff, p. 27): a slope under 2 %, else a flat or low landform (depression, plain, basin, valley floor, playa); a slope of 2 % or more, or a sloping landform, is III-2; with neither recorded the sub-class is undecided (Hugo, 2026-11-01). IV-1, cold countries: OM above 10 % in the A over 25 cm or more, which is how the text tells the two sub-classes apart (p. 33); IV-2 the others (Hugo, 2026-11-01)."
  - topic: "Sub-classes of class V"
    page: "pp. 36-38"
    reading: "V-3, gypseous, keyed first: gypsum in the A, 5 % or more of caso4_pct or any visible gypsum, or a Cs of the notation where neither is recorded. V-1, carbonated: carbonate in the fine earth of the A, 1 % or more, or with no value an effervescence moderate or stronger (or a Ca of the notation). V-2, saturated: the others (Hugo, 2026-11-01)."
  - topic: "Sub-classes of class VI"
    page: "pp. 40-43"
    reading: "Every Koppen climate falls in one isohumic sub-class (Hugo, 2026-11-01). VI-1, relatively humid: a udic regime, or Koppen Cf, Dfa, Af or Am, or the property test of the text (the upper horizons partly desaturated, S/T 50 to under 80 %, and 80 % or more at depth). VI-2, very cold: a frigid or cryic regime that is not udic, a mesic regime with an ustic or aridic one (cold winters and summer rains), or Koppen D (not Dfa), BSk, BWk or E. VI-3, cool in the rainy season: a xeric regime, or Koppen Cs. VI-4, hot in the rainy season: an ustic, aridic or torric regime with a thermic or warmer one, or Koppen BSh, BWh, Aw, As or Cw (Hugo, 2026-11-01)."
  - topic: "Sub-classes of classes VII and VIII"
    page: "pp. 45-55"
    reading: "VII-4, tropical countries: a tropical climate (Koppen A, an isothermic, isohyperthermic or hyperthermic regime, or a latitude of 23.5 degrees or less) and the eutrophic brown soils of VII/41, a B or (B) whose larger part has base saturation of 50 % or more. VII-3, boreal: Koppen D with c or d (Dfc, Dfd, Dsc, Dsd, Dwc, Dwd), or a cryic regime, and the boreal leached soils of VII/31, an A2 over a textural B. VII-2, continental temperate: Koppen D with a or b (the USDA regimes do not tell it from the humid temperate climate), and the grey forest or sod-podzolic soils, an A2 over a textural B. VII-1, humid temperate: the others, under a temperate climate or none recorded. VIII-3, hydromorphic: a hydromorphic layer in the A2 or the top of the B, or a gley above the B (slight signs below the B stay in the other sub-classes, as subgroups). VIII-2, cold: Koppen E, or D with c or d, or a cryic, gelic or pergelic regime, and the podzol morphology of its groups, an A2 over the B. VIII-1: the others, under a temperate climate or none recorded (Hugo, 2026-11-01)."
  - topic: "Sub-classes of classes IX to XII"
    page: "pp. 57-78"
    reading: "IX-1, ferruginous tropical soils: base saturation under 65 % in the larger part of the B; without it, a yellow B (10YR or 7.5YR, moist value 5 or more and chroma 4 or more, p. 58). IX-2, fersiallitic: the others. X: the thickness-weighted mean base saturation of the first 100 cm of the (B) decides, the only one of the text's three criteria whose ranges do not overlap: 40 % or more X-1, 20 to under 40 % X-2, under 20 % X-3; without it, the sum of the bases (above 3 cmol(+)/kg X-1, under 1 X-3, between undecided); the pH is evidence only, and X has no default. XI-1: the peat route; XI-2: 8 to 30 % OM over 20 cm or more over a gley (a reduced matrix) or a stagnogley (a hydromorphic layer); XI-3: the others. XII-2, degraded structure: the sodium route (Na above 10 % of the CEC with a massive, compact structure); XII-1: the others (Hugo, 2026-11-01)."
  - topic: "Groups: what the text leaves open"
    page: "pp. 17-79"
    reading: "Most groups are defined by a profile type, a colour word or a property with no number; the readings below are soilKey's, decided by Hugo on 2026-11-01. A group the data cannot decide leaves the name provisional. A sub-class whose groups all fail stops the name at the sub-class, and the trace says why (the text gives no residual group there, and none is invented). The names are French, as the text writes them, without 'Groupe des'."
  - topic: "Groups of the deposits and of erosion (I-1, II-4)"
    page: "pp. 18, 25"
    reading: "The origin is read from layer_origin and rock_origin of the material under the A within 50 cm (in a stratified profile that material decides), else from the site parent material. Order: anthropic (artefacts of 20 % or more within 50 cm, or a fill, spoil or refuse named), volcanic (tephra, ash, pumice, scoria), alluvial (with the lacustrine and marine deposits), colluvial, aeolian. Glacial and fluvioglacial deposits and loess are not recent deposits. With no origin recorded: the erosion group (I/11, II/41) (Hugo, 2026-11-01)."
  - topic: "Groups of the cold and hot deserts (I-2, I-3)"
    page: "pp. 18-20"
    reading: "I/21 and I/31, lithosols: hard rock (an R, a strongly cemented or indurated layer) at the surface or under 10 cm or less of loose material. I/23, organised cryosols: patterned ground recorded in the new site field patterned_ground with geometric figures or a network (polygons, circles, nets, stripes, mud boils, wedges, cracks); hummocks, thufurs and palsas alone are not organised; not recorded, undecided (Hugo, 2026-11-01). The synoptic table repeats 'inorganisés' for I/23 by a slip (p. 81). I/33: soilKey's yermic properties (a desert pavement); I/35: soilKey's takyric properties; I/34: an aeolian deposit or a dune landform, sandy (clay + silt under 15 %) within 50 cm; I/32 the others."
  - topic: "Groups of the permafrost soils (II-1)"
    page: "pp. 22-23"
    reading: "Strong ice segregation: 20 % ice or more in a layer (ice_pct), ice lenses or segregated ice in the new horizon field ice_form, or ice-wedge polygons in patterned_ground (II/12 is defined by its ice-wedge network). A network: patterned_ground with polygons, nets, wedges, circles, stripes, mud boils or cracks ('non-sorted' circles and polygons are patterned ground, not a negation; TRUE or 'yes' is read as a network). II/11 strong ice and no network, II/12 strong ice and a network, II/13 no strong ice and a network, II/14 the others; with neither field recorded the groups before II/14 are undecided (Hugo, 2026-11-01)."
  - topic: "Groups of the humic and xeric weakly developed soils (II-2, II-3)"
    page: "p. 24"
    reading: "II/23, allophanic, keyed first: in the top 50 cm, a pH in NaF of 9.5 or more, or Alo + 1/2 Feo of 2 % or more; with no such data, none without a sign of volcanic material. II/22, lithocalcic: a calcareous rock under the A (carbonate of 2 % or more, effervescence, or a limestone, chalk, marl or dolomite named); with nothing recorded about the rock, undecided. II/21, rankers: the others. II/31, grey subdesert soils: an arid climate (Koppen B, or an aridic or torric regime) and under 1 % OM in the surface horizons; II/32, xerorankers, the others (Hugo, 2026-11-01)."
  - topic: "Groups of the vertisols (III)"
    page: "pp. 28-29"
    reading: "The structure of the rows covering the top 15 cm: rounded (granular, crumb, nutty, subangular blocky) in all of them gives III/11 or III/21; angular (angular blocky, polyhedral, prismatic, platy, columnar, wedge) in any, or a self-mulching surface, gives III/12 or III/22; massive or not recorded leaves the rounded group undecided (Hugo, 2026-11-01; subangular blocky is read as the text's nutty structure). The text prints 'nul' for III/21 and III/22, in the body (p. 29) and the synoptic table (p. 84), by a slip: they are the groups of III-2, and their names carry the word '[possible]' in brackets, soilKey's insertion (Hugo, 2026-11-01). The structure named first decides ('prismatic parting to subangular blocky' is angular)."
  - topic: "Groups of the andosols (IV)"
    page: "p. 33"
    reading: "IV/11, the only group of IV-1. IV/21, saturated: base saturation of 50 % or more in the larger part of the (B); without it, pH(H2O) 6 or more; IV/22 the others (Hugo, 2026-11-01). The clay minerals the text names are not read."
  - topic: "Groups of the calcimagnesic soils (V)"
    page: "pp. 36-38"
    reading: "V-1: V/13, cryptorendzinas, keyed first (a dolomitic material named, an effervescence only with hot acid, or carbonate with no or a slight cold effervescence; no (B)), V/11 rendzinas (no (B)), V/12 calcareous brown soils (with a (B)). V-2: V/22 (OM above 20 % in the A, thickness-weighted, on a hard carbonate rock), V/23 (a fine or very fine polyhedral A, a CEC of the clay of 50 cmol(+)/kg or more in the A, on hard rock or a calcareous crust), V/21 the others (Hugo, 2026-11-01). V-3: V/31, an AR or ACR profile (no A3 and no (B); the text's thinness, under 50 cm, is a description), V/32 the others, with an A3 or a (B): the text has two groups in V-3 (p. 38) (Hugo, 2026-11-01). A subangular blocky A is not the 'franchement polyédrique' A of V/23."
  - topic: "Groups of the isohumic soils (VI)"
    page: "pp. 40-43"
    reading: "The thickness-weighted mean OM of the top 20 cm of the mineral soil. VI-2: VI/21 chernozems above 5 % (the 5 to 6 % the text gives both to them and to the chestnut soils goes to the chernozems, keyed first), VI/22 chestnut soils 3 % or more, VI/23 isohumic brown soils the others. VI-3: VI/31 marron soils 1 % or more, VI/32 sierozems the others. VI-1 and VI-4 have one group each (Hugo, 2026-11-01)."
  - topic: "Groups of the brunified soils (VII)"
    page: "pp. 45-48"
    reading: "The clay index: the largest clay of the B over the smallest clay of the A rows above it (A1, A2, A3). VII/12, leached soils: the index above 1.4 and 5 % clay more, the text's textural B; clay films recorded as none or few rule it out, films not recorded do not; without clay, a Bt, or a plain B or B2 of the CPCS notation (the A B C profile of p. 46), is a textural B, and a Bh, Bfe or (B) is not (Hugo, 2026-11-01); clay films count as recorded when they are recorded in every B row, so films noted in a BA only do not rule the B out; a designated profile with no B is not leached. VII/11 the others. VII-2: VII/22, sod-podzolic, an A1 of 25 cm or more and an A2 tonguing into the B (a tonguing boundary, an E/B or B/E, or soilKey's retic properties); VII/21, grey forest soils, the others. VII-3 and VII-4 have one group each (Hugo, 2026-11-01)."
  - topic: "Groups of the podzolised soils (VIII)"
    page: "pp. 50-55"
    reading: "One colour table (Hugo, 2026-11-01): an ashy A2 is albic material (soilKey's claric colours); a pale A2 is one Munsell value or more above both the A1 above and the B below, in the dry colours when all three are recorded, else in the moist ones; an ochre B has a hue of 10YR to 5YR with a moist chroma of 6 or more; a brown B a moist chroma of 4 or less. VIII-1: VIII/11 podzols (an ashy A2); VIII/12 podzolic soils (a pale A2 over a B with more than 1 % OM; or an A2 directly over a Bg, the text's 'à pseudogley'; or an Ap directly over such a B, the A2 ploughed in); VIII/13 ochre-podzolic soils (no A2, a broken one or one under 5 cm, an ochre B, and never a Bh over 3 cm, 'jamais d'un Bh', p. 52); VIII/14 crypto-podzolic soils (no A2 of 5 cm or more, and a brown B with more than 2 % OM or an A1 of 30 to 60 cm with more than 10 % OM); no default. VIII-2: VIII/21 boreal (Koppen D with c or d, or a latitude of 50 degrees or more, but not at 1,500 m or more below 60 degrees), VIII/22 alpine (Koppen ET or EF below 60 degrees, or an elevation of 1,500 m or more); no default. VIII-3: VIII/32 molken-podzols (a g master in the place of the A2; only a recorded phreatic water table rules it out, not 'none'), VIII/33 tropical groundwater podzols (a tropical climate, an A2 of 50 cm or more, a concretioned or cemented B), VIII/31 gley podzols the others."
  - topic: "Groups of the sesquioxide soils (IX)"
    page: "pp. 58-61"
    reading: "IX-1 (Hugo, 2026-11-01): the clay index of class VII, above 1.4 with 5 % clay more, and an A of 15 cm or more, or a third or more of the solum (to the top of the C); then IX/12, leached, when the C is intermediate (its clay under 0.9 x the largest clay of the B), or when the B has common or many clay films whatever the thickness of the A (a thin A with visible films is leached, p. 59), IX/13, impoverished, when the C is as clayey and there are no films (none, few or not recorded), IX/11 the others. IX-2: IX/21, a calcium reserve (carbonate, secondary carbonates, effervescence or a Ca of the notation in a layer starting within 100 cm, or a calcareous rock named, or a (B) whose larger part has base saturation of 95 % or more with pH 7 to 7.5); IX/22 the others."
  - topic: "Groups of the ferrallitic soils (X)"
    page: "pp. 67-70"
    reading: "Order (Hugo, 2026-11-01): humic (a mean OM of 7 % or more over 0-20 cm, or more than 1 % in every horizon to 100 cm, 'jusqu'à au moins 1 m', p. 68: a description that stops short of 100 cm leaves it open), leached (X/36, the textural B of VII/12), impoverished (the clay index 1.4 or more, no common or many clay films), reworked (a stone line: 15 % coarse fragments or more at the base of the A or in the B, more than in the recorded rows above and below, the last row described never one, or a stone line named; a lithological discontinuity of the notation; or a colluvial origin), rejuvenated (feldspars, micas and amphiboles in the sand, 10 % or more together, or a micaceous, feldspathic or amphibolitic sand named, negations and traces left out), then typical as the default. Each sub-class keys the groups the text gives it. X/24 prints no qualifier in its title; its subgroups are those of the reworked soils, and it is read so. A sand mineral or a stone line that is not recorded is absent."
  - topic: "Groups of the hydromorphic soils (XI)"
    page: "pp. 74-76"
    reading: "XI-1: the fibre class over the greatest thickness of peat in the top 80 cm of the ground: unrubbed fibre above 2/3 fibrous, 1/3 to 2/3 semi-fibrous, under 1/3 altered; else von Post H1-H3, H4-H6, H7-H10; else rubbed fibre 40 % or more, 17 to 40 %, under 17 % (the SiBCS figures); else the i, e or a of an FAO or USDA O or H; a tie goes to the first class of the key; no default (Hugo, 2026-11-01). XI-2: XI/21 when the layer under the humic horizon is a gley (a reduced matrix), else XI/22. XI-3, in this order: XI/35, a layer cemented by iron starting within 100 cm (a ferricrete, ironpan, carapace or cuirasse, or a cemented layer with iron, or soilKey's petroplinthic horizon); XI/36, secondary carbonates or visible gypsum of 5 % or more within 100 cm (a Ca or Cs of the notation where neither is measured); XI/34, amphigley, a pseudogley over a deep gley starting at 80 cm or deeper (the text's 'gley profond' of XI/312, p. 75), told from the oxidised top of one gley by a layer without hydromorphy between them, by a g over a G of the CPCS notation, or in a declared FAO notation by a g (stagnic) rather than an l (the capillary fringe of a gley); continuous mottling over the reduced matrix is the gley's own; XI/31, a reduced matrix starting within 130 cm, unless the water table is perched, or is recorded as none with the stagnogley morphology (not recorded with that morphology: undecided); XI/33, a reduced matrix from just under the A over most of the profile to 100 cm, with a perched water table, none, or none recorded (the thin A of the text is a description); XI/32, pseudogley, the others (Hugo, 2026-11-01). For the groups a reduced matrix is three-valued: a row whose matrix colour is not recorded (no G of the notation, no dipyridyl test) may be reduced, which leaves the group undecided; a g of the CPCS notation with no colour is a pseudogley."
  - topic: "Groups of the sodic soils (XII)"
    page: "pp. 78-79"
    reading: "XII/11, the only group of XII-1. XII-2, in this order (Hugo, 2026-11-01): XII/23, solodised, an albic A2 over a B with the clay increase of the WRB argic horizon (6 % more under 15 % clay, a ratio of 1.4 from 15 to 50 %, 20 % more above), and a surface pH under 7 (with no pH recorded, undecided: the text names the acid surface first); XII/22, Solonetz, a B with that clay increase over the layers above, a compact consistence (very or extremely firm, or very or extremely hard; without a consistence, a columnar B) and Na above 10 % of the CEC; XII/21 the others, the clay constant through the horizons. The 'little or no soluble salt' of XII/22 is a description, not a test."
  - topic: "Subgroups: inventory, codes, names and order"
    page: "pp. 17-79"
    reading: "The inventory is the main text of the AFES edition (2011): 276 subgroups. The common subgroups of class I go to groups 12 to 15 only, as the text says, not to I/16; the two subgroups of the peats (XI-1) go under each peat group (XI/111 to XI/132, soilKey's codes, the text giving none); 'Sans horizon B' is XI/221, as the main text numbers it (the synoptic tables print 222); VII/115 (Bruns Rankers, inserted by Baize in 2011) and VII/413 are included; IV/22 takes the subgroups of IV/21 ('mêmes que précédemment'), with their names in brackets. A code is the class and the text's three digits (I/111 under I/11). Names are French as printed, without 'Sous-groupe (des)'; a name the text writes in full stands alone ('Podzols humo-ferrugineux'), one it writes as an adjective follows the group name ('Rankers, à mor'). Order: the printed order with the modal last, with two corrections so that every subgroup can be reached: a subgroup that splits the group by a measure (pH 5.5, clay index, depth of the gley, kind of B, thickness of the A1) comes after those of a secondary process, and a composite subgroup before its parts (IX/225, VII/412, VI/116, IX/123 before 122); so the vertic subgroups of the vertisols come after the hydromorphic, halomorphic and self-mulching ones, the textural B of the chernozems before the very humic ones, the yellow (jaune) and brown (brun) subgroups of classes IX and X after the subgroups of a process, and the thick calcic brown soils (V/213) before the brunified rendzinas. The first subgroup whose test passes is assigned; the others that pass go to the trace as 'intergrade vers...'. A subgroup left undecided before the assigned one makes it provisional, as at the other levels, and a provisional group is also keyed to its subgroups; a group whose listed subgroups all fail stops the name at the group, and none is invented; the 22 groups the text gives no subgroups keep the group name (Hugo, 2026-11-01)."
  - topic: "Subgroups: hydromorphy"
    page: "pp. 18-76"
    reading: "Hydromorphic signs (the IX-X reading): redox features above 0 %, mottle colours recorded, a reduced matrix, or a g or G of the notation where no mottles are recorded; pronounced: 15 % or more, a reduced matrix, or a G; slight: the other signs ('quelques taches', 'légèrement'). Not recorded, absent. Window: a layer starting within 100 cm ('à pseudogley', 'hydromorphe'); I x2 and II 4x2 ('à nappe... à moins de 1 m') also a water table recorded within 1 m; II/142 ('de profondeur') signs from 50 cm and none above; III x3 ('très accusés') pronounced signs or Fe-Mn concretions of 5 % or more within 50 cm; VII/125 signs or concretions in the B or the lowest A2 row; VII/412-413 and IX/213 in the (B); IX/225 pronounced in the B; the ferrallitic soils the A and the top 50 cm of the B (the text: base of the A or upper part of the B). A brown soil with signs only below its (B) gets the trace note 'faciès hydromorphe' (p. 46), not a subgroup (Hugo, 2026-11-01)."
  - topic: "Subgroups: shallow profiles and rock"
    page: "pp. 18, 25, 33, 46-48, 37-38"
    reading: "Read by the profile type: Lithosols (I/111) and 'lithique' (II/412) have hard rock (an R, or a layer strongly cemented or indurated that is not a calcareous crust) directly under the (A) or A, with no C between; otherwise 'régosol(ique)' is the default. 'Peu développé' (IV x13): the top of the C or R at 45 cm or less, the minimum A of 15 cm plus the minimum (B) of 30 cm (p. 31); VII/411: the top of the C or R at 50 cm or less; with no C or R described above the limit the subgroup is undecided. VII/115, Bruns Rankers: a (B) directly on hard non-calcareous rock within 50 cm (carbonate, effervescence or a calcareous rock named make it calcareous). V/231 (profil AR): the A directly on hard rock; V/232 (profil A Cca R, Baize's correction of 'C K'): a calcareous accumulation or crust directly under the A. V/213, 'épais (plus de 50 cm)': the top of the C or R below 50 cm, or, with none, a profile described to 50 cm or more (Hugo, 2026-11-01)."
  - topic: "Subgroups of the vertisols (III)"
    page: "pp. 28-29"
    reading: "'Vertiques', vertic characters moderately marked: slickensides recorded, none many or continuous (common at most, the minimum of the class); not recorded, the subgroup is not met. 'Halomorphes': an EC of 4 dS/m or more within 100 cm, with no upper limit (class III is keyed before class XII). 'À structure finement divisée' and 'à auto-division': self-mulching recorded in surface_condition, with the top rows of fine or very fine structure reaching 10 cm (III/125) or 20 cm (III/225); self-mulching with no structure size recorded gives III/125 and leaves III/225 undecided (Hugo, 2026-11-01)."
  - topic: "Subgroups: salt and sodium"
    page: "pp. 24, 28, 41-44, 75, 77"
    reading: "Below class XII: 'salé', 'salin', 'halomorphe' (II/312, III x4, VI 'salé ou alcalisé', XI/211, XI/313) is an EC of the saturated paste of 4 dS/m or more in a layer within 100 cm (the limit of the time, soilKey's Hyposalic); 'alcalisé', 'à alcali' is exchangeable Na of 6 % of the CEC or more in a layer within 100 cm (the WRB Sodic), in the textural B for VI/116. With neither recorded the subgroup is not met, but salts seen (a Sa of the notation, visible halite) with no EC leave it undecided (Hugo, 2026-11-01)."
  - topic: "Subgroups of the rendzinas (V/11)"
    page: "p. 36"
    reading: "The rendzinas the text names without a figure: V/111, 10 % OM or more in the A (the range 10-20 % read by its lower end); V/112, a very strong effervescence in the A, or 10 % active carbonate or more in the new horizon field caco3_active_pct; V/114, under 10 % carbonate in the fine earth of the A with 15 % coarse fragments or more; V/115, the dry climate of II-3 (Koppen B or Cs, or an aridic, torric, xeric or ustic regime); with no climate recorded, not dry (Hugo, 2026-11-01)."
  - topic: "Subgroups: calcareous and gypseous crusts"
    page: "pp. 37-44, 76"
    reading: "Encroûtement calcaire (V/122, V/232, VI x15, VI/224, VI/234): a recorded accumulation, 5 % secondary carbonates or more, 5 % more carbonate than the layer below (the WRB calcic step), or a Ca of the notation where neither is measured; soilKey's calcic horizon alone, which passes plain calcareous layers, is not enough (Hugo, 2026-11-01, after the review). Croûte (VI/314, VI/322) and XI/361: a cemented layer, the petrocalcic or petrogypsic horizon, a calcrete, or a Ca or Cs cemented moderately or more. For the gypsum (V/322), 1 % visible gypsum or more (the WRB gypsic figure) or a Cs. 'Au sommet de C' (VI x15): in the first C row, or in a BCca just above it. XI/362: carbonate nodules or concretions recorded (secondary_carbonates_form, carbonate_hard_pct, a Can) within 100 cm (Hugo, 2026-11-01)."
  - topic: "Subgroups of the isohumic soils (VI)"
    page: "pp. 40-44"
    reading: "The readings of the CPCS: 'vertique' is soilKey's protovertic horizon (the reading of class IX; the strict vertic horizon, which the protovertic horizon leaves out, counts too, soilKey's reading) or a (B) of coarse or very coarse prismatic structure, the words of VI/114 and VI/222; 'en profondeur' (VI/324) from 50 cm. 'À B textural' is the textural B of VII/12 (the clay index above 1.4 with 5 % clay more). 'Rubéfié' and 'brun rouge' are the reddened B of class IX (5YR or redder, chroma 4 or more) in the larger part of the (B). 'Très humifère' (VI/211): a mean OM above 10 % over the top 20 cm. 'À pseudogley' of the chestnut soils (VI/223) also takes iron concretions, as the text says (Hugo, 2026-11-01, except the readings marked soilKey's)."
  - topic: "Subgroups of the brunified soils (VII)"
    page: "pp. 46-48"
    reading: "The measures decide. VII/11: 113 andiques, the allophane reading of II/23 (pH NaF 9.5 or more, or Alo + 1/2 Feo 2 % or more) in the top 50 cm or in the (B), none without volcanic signs; 114, the clay index above 1.1, not where truncation or erosion is recorded ('en l'absence d'érosion'); 115 as read under the shallow profiles; 112, pH(H2O) under 5.5 in the larger part of the (B); 111 the others. The '(B) non ocreux' and the mull are descriptions. VII/12: 124, an ashy A2 (albic material) over an ochre B (10YR to 5YR, moist chroma 6 or more, the colour table of class VIII), the iron and clay indices being supporting only ('souvent'); 125, hydromorphic signs or concretions in the B or the base of the A2; 126, A2 tongues (the test of VII/22); then the clay index and the pH of the larger part of the B: 121 an index above 1.4 and 2.0 or less, 123 pH under 5.5, 122 the others. The colour words of the A2 and the humus are descriptions (Hugo, 2026-11-01)."
  - topic: "Subgroups of the podzolised soils (VIII)"
    page: "pp. 50-54"
    reading: "The notation, then the colour: a Bh by h (B2h, Bh), a Bfe by fe or s (B2fe, Bs); without a symbol, by the moist colour: Bh value 3 or less and chroma 2 or less, Bfe chroma 4 or more. Podzols humiques: a Bh and no Bfe; ferrugineux: a Bfe and no Bh; humo-ferrugineux: a Bh above a Bfe, or a B marked both (Bhs, Bhfe), soilKey's reading of a single humo-ferruginous row; humo-cendreux: no B. 'À hydromorphie profonde': a hydromorphic layer (5 % mottles or more, g or G, a reduced matrix) starting at or below the base of the podzolic B, none above the B; it is the secondary process and comes first. VIII/123, an A2 directly over a Bg; VIII/124, a g master or a reduced greenish-white layer (5Y or bluer, or neutral, value 6 or more, chroma 2 or less, or a positive Childs test) between the A2 and the B; VIII/125, an Ap directly over the podzolic B. VIII/141 and 142 are the two paths of the group: the humic A1 (30 to 60 cm, OM above 10 %) and the brown B (chroma 4 or less, OM above 2 %). VIII/311, a Bh with a gley (a reduced matrix, or a G) above it or in contact; VIII/312, a concretioned or cemented B (Hugo, 2026-11-01, except the readings marked soilKey's)."
  - topic: "Subgroups of the sesquioxide and ferrallitic soils (IX, X)"
    page: "pp. 59-71"
    reading: "The table accepted for IX and X: 'induré', a carapace or cuirasse (cemented moderately or more, a ferricrete or ironpan, an m, soilKey's petroplinthic horizon), in a B row (X) or within 100 cm (IX/123, before 122); 'à concrétions', iron nodules of 5 % or more, or a Cn; IX/114, V 80 % or more in the larger part of the B, OM under 1 % in the A, clay 8 % or less to 100 cm, the sub-class IX-1 taking these sands under a tropical climate whatever their V (its 65 % is 'très généralement', p. 57; Hugo, 2026-11-01, after the review); IX/213 and IX/222, any hydromorphic sign (Hugo, after the review); IX/212 'brun', a (B) of 7.5YR or yellower; IX/224 'très lessivé', the clay index above 2.0, and IX/225 with pronounced signs in the B; X 'faiblement appauvri', the index above 1.1 and under 1.4; 'jaune', a B of 7.5YR or yellower; 'humique', a mean OM above 3 % over 0-20 cm; 'éluvié', a row at the A/(B) boundary with twice the coarse elements (coarse fragments or gravel, and nodules) of the rows above and below; X/221, an A of moist value 3 or less over a (B) of 5YR or redder; X/222, the A and AB 50 cm or more thick and half the described depth or more; X/362, an albic A2 over the textural B; vertic, soilKey's protovertic horizon or its vertic horizon; for IX/113 anywhere in the profile, with a coarse or very coarse structure in a row reaching below 50 cm when sizes are recorded there. Beyond the table: 'faiblement rajeuni', feldspars, micas and amphiboles in the sand of 3 % or more (under the 10 % of the rejuvenated groups) or named without 'traces'; 'faiblement remanié' and 'avec érosion et remaniement', the evidence of the reworked groups (stone line, discontinuity, colluvial origin), as the impoverished groups are keyed before the reworked ones, and for the second also recorded erosion; IX/125, that evidence at the base of the A; X/223, weatherable minerals of 10 % or more, volcanic glass, or a volcanic or aeolian deposit within 50 cm; X/322, a dark brown B (7.5YR to 10YR, value 3 or less, chroma 3 or less), pH under 4.5, and gibbsite (25 % of the clay or more where gibbsite_pct is measured, else Ki under 1.0 where Ki exists, else the colour and pH alone); IX/215, carbonate in the A or the (B) (1 % or more, an effervescence moderate or stronger, a Ca), a Cca alone being the modal's. Note: an IX/22 soil with pronounced pseudogley and a clay index of 2.0 or less fits neither 225 nor 222 and falls to the modal (Hugo, 2026-11-01, except the readings marked soilKey's)."
  - topic: "Subgroups of the peats and humic gley soils (XI-1, XI-2)"
    page: "pp. 74-75"
    reading: "Peats: oligotrophes, a pH(H2O) under 5.5, thickness-weighted over the peat layers of the top 80 cm of the ground; mésotrophes et eutrophes, 5.5 or more; with no pH, peat_moor_type decides (high-moor oligotrophic, low-moor meso- and eutrophic, transitional undecided). XI/21: salés by the EC; anmoor, a C/N under 20 in the humic horizon (the run of 8-30 % OM from the mineral surface), calcique with carbonate of 1 % or more or an effervescence there (with neither recorded, pH 7 or more), acide otherwise; hydromor, humus_form hydromor, else a C/N of 20 or more. A recorded humus form (anmoor, hydromor) decides before the C/N, so that a hydromor is never read as an anmoor (soilKey's reading). With no C/N and no humus form the subgroup is undecided. XI/221 'Sans horizon B': no B; a soil with a B stops at the group (Hugo, 2026-11-01, except the readings marked soilKey's)."
  - topic: "Subgroups of the mineral hydromorphic soils (XI-3)"
    page: "pp. 75-76"
    reading: "By the morphology: XI/313 salés by the EC; XI/314 lessivés, the textural B of VII/12; XI/311 and 312 by the top of the first reduced row, under 80 cm or at 80 cm or deeper (a row above it that may be reduced leaves the deep gley undecided); XI/321, hydromorphic signs already in the first mineral row (the A1); XI/322, a perched water table recorded, or a slowly permeable layer directly under a pseudogley row (an argic step of clay, a fragipan or x, a cemented layer); XI/341, a layer without hydromorphy between the pseudogley and the gley; XI/342, the pseudogley passing straight into the gley (a g over a G of the CPCS notation, or a g over the gley in a declared FAO notation); otherwise the name stops at the group. The seasonal water-table depths would decide 341 and 342 directly, but soilKey has no attribute for them (Hugo, 2026-11-01)."
  - topic: "Subgroups of the sodic soils (XII)"
    page: "pp. 78-79"
    reading: "The surface first: XII/111, salt efflorescences (salt_crust_pattern, or named in surface_condition); 112, a puffed surface layer, a loose or friable first row, or a puffed or friable surface named; 113, a salt crust (salt_crust_pattern crusty or hardpan, an evaporite surface crust, or named); 114 'acidifié', soilKey's thionic horizon, or a pH(H2O) under 4 with jarosite or sulfidic S. No surface feature recorded: the name stops at the group. XII/21: the surface structure decides (powdery, single grain, loose or puffed, 211; massive or structureless, 212); with no such structure recorded, the EC route of class XII (met, 211; otherwise 212). XII/22: a columnar structure of the Solonetz B (the B rows with Na above 10 % of the CEC), 221; prismatic or massive, 222; another structure, the group; none recorded, undecided. XII/23: Na above 10 % of the CEC in the first B row under the bleached A2, the solonetz solodisés (231); 10 % or less, the solods (232); not recorded, undecided (Hugo, 2026-11-01)."
  - topic: "Subgroups of classes I, II and IV"
    page: "pp. 18-25, 33"
    reading: "The cryogenic forms are read from patterned_ground (with microrelief_form for I/222 and ice_form for the lenses of II/11), negated words taken out and 'non-sorted' kept: I/231 wedges or a crack network, I/232 earth (non-sorted) polygons, I/233 stone (sorted) polygons, circles, nets or rosettes, I/234 and II/132 mud boils, I/235 and II/134 stripes; I/222 hummocks, thufurs or solifluction lobes (not recorded, the plane I/221); II/111 palsas or large lenses, II/112 thufurs or small lenses, II/121 low-centre (ice-wedge) polygons, II/122 ice-cored mounds, II/131 small hummocks with cracks or non-sorted circles, II/133 sorted polygons or circles. A form not recorded leaves II/11 undecided; a recorded form that fits no subgroup stops the name at the group. Rankers (II/21) by the humus form, a new site field: mor, moder, and moder in the alpine belt (the VIII/22 reading; with no climate or elevation recorded, not alpine); a mull ranker stops at the group; not recorded, undecided. II/313 'éolisés': recorded deflation or an aeolian addition within 50 cm. II 4x3 'humifère': 5 % OM or more in the A1, the II-2 reading. IV x12 'humique': an A1 thicker than 25 cm (Hugo, 2026-11-01)."
  - topic: "Subgroups: new attributes"
    page: "pp. 24, 36, 67-70, 75"
    reading: "Five attributes were added for the subgroups: site humus_form (mull, moder, mor, hydromull, hydromoder, hydromor, anmoor, tourbe), which decides II/211-213 (not recorded, undecided) and XI/214; horizon caco3_active_pct (V/112); horizon coarse_sand_pct and fine_sand_pct (X 'faiblement remanié': a relative change of 20 % or more in the coarse to fine sand ratio between the A and the B, soilKey's figure, the WRB lithic discontinuity; X 'éluvié': twice the coarse sand at the A/(B) boundary, beside twice the coarse fragments and nodules); horizon gibbsite_pct (X/322). The rest comes from what exists: the seasonal water tables by the morphology, self-mulching by the structure, 'alti-alpin' by the alpine reading of VIII/22 (Hugo, 2026-11-01, except the readings marked soilKey's)."
  - topic: "Subgroups: details of soilKey's"
    page: "pp. 24-79"
    reading: "Readings the plan did not cover, judged defensible by the reviews and accepted by Hugo (2026-11-01): the vertic subgroups count the layers of a full vertic horizon with the protovertic ones; a single Bhs or Bhfe row is a humo-ferruginous B, a transition carrying h, fe or s counts, a (B) or a plain transition does not, a B row whose chroma is above 2 or value above 3 is no Bh, and rows of unknown kind are tried every way (decided only when all give the same answer); XI/21 reads a recorded humus_form (anmoor, hydromor) before the C/N, the C/N being the thickness-weighted C over N of the humic run; 'faiblement remanié' from the sand fractions is a change of 20 % or more in the coarse over fine sand ratio between the A and the B within 100 cm (the WRB figure for a lithic discontinuity), and 'éluvié' also takes twice the coarse sand; 'until 45 or 50 cm' includes the limit; a calcareous crust (a Ca, a calcrete) is not hard rock; the Solonetz B of XII/22 is the B rows with Na above 10 % of the CEC, else all of them; the slowly permeable layer of XI/322 is an argic clay step, an x or m, a cemented row, or a fragipan, duripan or claypan; negated records ('no mottles', 'none observed') are not records."
