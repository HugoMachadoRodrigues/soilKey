# The readings soilKey makes of the CPCS 1967 where the text is silent or
# ambiguous, and the owner's decisions. Pages are the printed pages of the
# 1967 text (the AFES PDF page is the printed page + 2).
readings:
  - topic: "Scope, levels and names"
    page: "pp. 3, 5-10, 15"
    reading: "soilKey keys the major units of the CPCS (class, sub-class, group, subgroup), the units of the reference classification; the text stops at the subgroup (p. 10). This release keys the twelve classes and their 35 sub-classes. The names are French, as the text writes them, in name and name_native: the CPCS has no official English names (Hugo, 2026-11-01). Class IX takes the name of the table of classes (p. 15), sols à sesquioxydes de fer et manganèse; its chapter heading says sols à sesquioxydes de fer (ou de manganèse). The codes are the text's Roman numerals."
  - topic: "Order of the classes"
    page: "pp. 8, 22-23, 24, 28-29, 35, 50, 61, 67, 73, 77"
    reading: "The CPCS gives no key. The classes are keyed in an order built from the text's statements of precedence (Hugo, 2026-11-01): I (sols minéraux bruts), III (vertisols), XII (sols sodiques), IV (andosols), VIII (sols podzolisés), X (sols ferrallitiques), IX (sols à sesquioxydes de fer et manganèse), XI (sols hydromorphes), II (sols peu évolués), VI (sols isohumiques), V (sols calcimagnésiques), VII (sols brunifiés). From the text: the vertisols, podzolised, ferrallitic and sesquioxide soils keep their own strong hydromorphy (pp. 28-29, 50, 61, 67); hydromorphy and halomorphy make a class only when intense (pp. 8, 73, 77); permafrost soils stay in class II even when waterlogged (pp. 22-23), so class XI excludes them; class V excludes the vertisols and the isohumic soils (p. 35). Decided by Hugo (2026-11-01), not stated by the text: the sesquioxide soils exclude the isohumic soils; a peat (the peat route of class XI) excludes the mineral classes keyed before class XI, as the permafrost excludes class XI, so a peat over an andosol, a podzol or a vertisol is a hydromorphic soil; class VII is what remains of the developed soils."
  - topic: "Organic matter, depths, ranges"
    page: "pp. 11, 17, 21"
    reading: "Every threshold of the text is in % organic matter: OM = 1.72 x organic carbon, the French convention of the time. Depths are measured from the top of the first mineral horizon (Aoo and Ao are measured upward from the top of A1, p. 11); the peat of class XI is measured from the ground. A range given as a threshold is read by its lower end for a minimum and its upper end for a maximum, as in the SiBCS (Hugo, 2026-11-01)."
  - topic: "Horizon notation and the profile types"
    page: "pp. 11-13"
    reading: "The old French notation is read when site$designation_system is 'cpcs' (or 'cpcs1967', 'french'), or recognised by its own symbols (Aoo or Ao, (A), (B), Bfe, Ca, Can, Cs, Cn or Sa after a master, a G master, the B1 to B3 numbering), never by the country: later French descriptions use other notations. Only the symbol is read: a Roman or Arabic numeral written apart is joined to its master ('II B3', p. 12); a word after a space or a slash ('Btg/glossic') and a bracketed letter after the master (the New Zealand 'Bw(h)') are notes; a designation written all in lower case takes capital masters (ab, bc and ac are transitions; an r after c is a weathered rock). In the CPCS notation A2 is the eluvial horizon (E), and a g master (the molken podzols, pp. 52, 54) is read as an A2; in the FAO notation A1 and A2 are subdivisions of the A. A3 and AB are transitions closer to A (p. 13; p. 11 calls AB a horizon that cannot be assigned to A or B), and A/B, a mixed horizon (p. 13), is read as AB; (B) is a structural or colour B, which differs from A or C in consistence, structure or colour (p. 12); a B alone is an enriched B in the CPCS notation. B1 and B3 are parts of the B closer to A or C, and BA and BC transitions: on their own they leave an enriched B undecided. g is pseudogley and G (Go, Gr) gley; Ca, Can, Cs, Cn and Sa are carbonate, carbonate nodules, gypsum, ferro-aluminous concretions and salts, also written after an A or B master (BCa, B2Cn); a Roman numeral marks a change of parent material; a buried horizon (b) belongs to a buried profile and not to the profile type. The FAO letters (E, Bw, Bt, Bs, Bh, Bk, Ck, Oi ...) are read beside them; a Cr is weathered rock; f is frozen only on a mineral master, and not in the Canadian, New Zealand or Australian notations (declared, or the country when none is declared), where it is iron or fibric: a Bf there is an iron B, read as a Bfe; in those notations v is vertic, y cryoturbated and z frozen (the CSSC), not the FAO plinthite, gypsum and salts. In the CPCS notation a B with letters the CPCS does not use (an FAO Bdu) leaves the enriched B undecided. The profile type (is there a B, a (B), an A2?) is read from the notation; soilKey's diagnostic horizons stand in where a mineral row has no designation or the FAO notation leaves the enriched B open: a B when one of the argic, cambic, natric, ferralic or nitic horizons passes (the spodic horizon only when it passes), none when all fail, an A2 when a layer of albic material (soilKey's claric colours) lies over a mineral layer that is not albic (a pale C at the base of a sand is not an A2). The properties (organic matter, C/N, Ki, mottles, colours, carbonate, gypsum, concretions) are read from the recorded data first and from the notation only where the data are missing (Hugo, 2026-11-01): a Ca, Cs or Cn of the notation counts only where caco3_pct, caso4_pct or ferric_nodules_pct is not recorded."
  - topic: "Class I, sols minéraux bruts"
    page: "p. 17"
    reading: "A profile (A)C, (A)R or R: no A2, B or (B), no organic layer over the mineral soil, and only traces of organic matter in the top 20 cm: every mineral layer starting within 20 cm has 0.5 % OM or less, the top 3 cm 1.5 % (Hugo, 2026-11-01); this keeps the grey subdesert soils of II/31, with under 1 % OM, in class II. Without carbon, an (A), C, R or G is a raw layer and an A or a B is not. A profile of organic layers only is not a raw mineral soil."
  - topic: "Class II, sols peu évolués"
    page: "pp. 21-25, 35"
    reading: "Permafrost (a gelic or pergelic regime, a permafrost temperature of 0 C or less, ice, or a frozen layer of the notation); or an AC profile (no A2, B or (B)) with more than traces of organic matter; an organic layer over the mineral soil (a litter, a mor) is more than traces, so a thin litter over a raw sand is a weakly developed soil. The text says class V does not take the weakly developed soils on carbonate rocks, and that class II owes its lack of weathering to a cold or dry desert climate, or to material laid down or exposed by erosion some years or decades before (p. 21): an AC soil with the chemistry of class V (pH above 6.8, saturation by Ca and Mg above 90 % or a calcareous A) and a source of Ca or Mg (carbonate in the profile, or a calcareous or ultrabasic rock) is therefore a calcimagnesic soil, unless a recent deposit (alluvial, colluvial, aeolian, volcanic, anthropic, from the recorded origin of the layers; not a glacial or fluvioglacial deposit, nor loess) or recent erosion (recorded truncation or deflation, or erosion named, with negated words taken out) is recorded (Hugo, 2026-11-01). The humic lithocalcic soils (pH under 6.8) stay in class II."
  - topic: "Class III, vertisols"
    page: "p. 27"
    reading: "Slickensides or wedge-shaped aggregates, common or more, in a layer starting within 150 cm (the text places them at least at the base of the profile, not within 100 cm); 30 % clay or more through the (B); shrinkage cracks of 0.5 cm or more when cracks are recorded, the width soilKey reads for the WRB (unrecorded cracks do not block; the text only says wide; Hugo, 2026-11-01, after the canonical Vertisol, with cracks of 0.5 to 0.8 cm, fell out of the class at 1 cm); no B other than (B) (Hugo, 2026-11-01). Slickensides that are not recorded are read as absent, as surveyors note them when they see them."
  - topic: "Class XII, sols sodiques"
    page: "pp. 77-79"
    reading: "EC of the saturated paste above 7 dS/m in every horizon of the solum (the A and B horizons and their transitions to 100 cm; in a profile without a B, the horizons to 50 cm and any deeper A; in an undesignated profile, the horizons to 50 cm, deeper ones under 7 dS/m leaving the class undecided unless soilKey finds no B; the C below the solum is the parent material: the text's 'ensemble du profil'; Hugo, 2026-11-01, after the canonical Solonchak, with a non-saline C below 60 cm, fell out of the class when every horizon to 100 cm counted), or exchangeable Na above 10 % of the CEC in a horizon within 100 cm with the text's massive, diffuse structure (structure type massive or columnar, or grade structureless) and a compact consistence (very firm or harder, or very hard or harder) (Hugo, 2026-11-01). Only Na counts: the text says the Mg threshold is not known. Clean sands (sand of 85 % or more, silt + 1.5 x clay under 15 in every horizon to 100 cm) and a salinity of gypsum alone (gypsum recorded and Na at 10 % of the CEC or less) are not sodic. With no EC and no Na recorded the class is not met, unless salts are seen (a Sa of the notation, visible halite), which leaves it undecided."
  - topic: "Class IV, andosols"
    page: "pp. 24, 31-34"
    reading: "soilKey's andic properties over 30 cm or more within 100 cm (undecided layers counted as possible), a CEC above 25 cmol(+)/kg where it is measured, as the thickness-weighted mean of the andic A and (B) within 100 cm (soilKey's reading: the text gives the CEC of the andosol as a whole, best obtained by summing H, Al and the bases, p. 32; cec_cmol is read whatever its method), and a B or (B): an allophanic AC soil is a weakly developed soil (II/23, 'ce ne sont pas des andosols', p. 24) (Hugo, 2026-11-01). The text gives the cold-country andosols of IV/11 a profile 'A (B) C, le plus souvent, ou AC' (p. 33); the decision keeps the (B) for the class, so such an AC andosol falls to class II. Where the andic data are missing, a soil with no sign of volcanic material (tephra, ash, pumice, glass named in the origin of a layer or the parent material, or volcanic glass recorded) is not an andosol."
  - topic: "Class VIII, sols podzolisés"
    page: "pp. 49-55"
    reading: "A podzolic B by criterion 2 of the text: OM above 0.5 %, C/N above 14, and more carbon than the A2 when there is one; without C or N, a Bh, Bs or Bfe of the notation, unless the OM is recorded at 0.5 % or less. The notation gives the kind of B: a (B), Bw or Bt, or a B with other symbols only, is not a podzolic B; a plain B of the FAO notation stays undecided. In an undesignated profile, soilKey's spodic horizon decides when it can (the C/N of an undesignated layer may be that of a C); otherwise the C/N of the layers below the A, a layer of albic material being an A2, not a B. A transition (BA, BC, B1, B3) follows its core B: on its own, without h, s or fe, it is not a podzolic B. Or an ashy A2 (albic material, soilKey's claric colours) without a B, the humo-ashy soils; not a g master nor an A2 with 5 % mottles or more, which the text says must not be confused with the A2 (p. 51). The US ratio of 0.15, which the text quotes as indicative, is not used (Hugo, 2026-11-01)."
  - topic: "Class X, sols ferrallitiques, and class IX, sols à sesquioxydes de fer et manganèse"
    page: "pp. 57-60, 63-66"
    reading: "Both need a B or (B). The B is read in the larger part of its first 100 cm, as soilKey reads the SiBCS B; without a designated B, the undesignated rows below the A. Class X: Ki (SiO2/Al2O3) of 2.0 or less. The figure is the one the class IX definition gives (SiO2/Al2O3 above 2, p. 57); the class X chapter speaks of the silica/alumina ratio with no figure (p. 63) and says a CEC limit is hard to set (p. 64). The sulfuric attack (sio2_sulfuric_pct, al2o3_sulfuric_pct) and, without Ki, a CEC of the clay of 16 cmol(+)/kg or less are soilKey's (Hugo, 2026-11-01). Class IX: Ki above 2 (without Ki, a CEC of the clay above 16), base saturation above 50 % (bs_pct, else the sum of the bases over the CEC, a missing K or Na counted as nil) and individualised iron (Hugo, 2026-11-01). Individualised iron: a reddened B (5YR or redder with a moist chroma of 4 or more, the fersiallitic colours of p. 60), or iron concretions; a 7.5YR or 10YR B with chroma 4 or more and value 5 or more (the ferruginous tropical colours of p. 58) only under a tropical climate (an isothermic, isohyperthermic or hyperthermic soil temperature regime, or a latitude of 23.5 degrees or less); a neutral B is not (Hugo, 2026-11-01: 10YR or redder with chroma 4 took most temperate brown and leached soils, as the canonical Cambisol and Luvisol showed). Not tested at the class level: the low organic matter of class IX (p. 57), the black colours of abundant manganese oxides (p. 57), and the brown subgroup 212 (p. 60), which the reddened B leaves out unless concretions are recorded."
  - topic: "Class XI, sols hydromorphes"
    page: "pp. 73-76"
    reading: "No permafrost, and one of (Hugo, 2026-11-01): peat (more than 30 % OM, more than 20 % in a sandy material, as the text says 'plus de'; 30 % for every material that is not sandy, where the text names clayey material) over 40 cm or more of the top 80 cm of the ground (above any rock); 8 to 30 % OM over 20 cm or more from the mineral surface, directly over a gley or stagnogley; hydromorphic layers over more than half of the profile from the base of the A1 (the A1 rows, not an A3 or AB, 'dès la base de A1', p. 76) to 100 cm. A hydromorphic layer: a recorded mottle percentage of 5 or more, or a reduced matrix; a g or G of the notation only where no mottles are recorded (the recorded data first). A reduced matrix: a positive dipyridyl test, or chroma 2 or less with value 4 or more (not in an A2 or an organic layer); the text's 'teintes grises, verdâtres ou bleutées de chroma 2 ou moins' (p. 75) is restricted by soilKey to a hue of 5Y or bluer, or neutral, unless a G of the notation names the gley, to keep grey parent materials out; a G with no colour recorded is reduced. A deep gley alone does not make the class. A mottle that is not recorded is absent (Hugo, 2026-11-01). In the CPCS notation an H is a layer of the Ao (p. 11), not peat, so with no carbon it is undecided; in the FAO notation it is peat."
  - topic: "Class VI, sols isohumiques"
    page: "pp. 39-40"
    reading: "OM in the top 15 cm of at least 0.5 % (sandy: clay + silt under 15 %) or 1 % (clayey: clay above 40 %), the text's two figures, and 0.75 % for the textures between, soilKey's (Hugo, 2026-11-01); marked horizons (OM at least their texture minimum, 0.75 % when the texture is not known) from the top over half the depth to the C or more; a gradual decrease: no marked horizon with a third or less of the OM of the one above, and the horizon under the A with more than a third of the OM of the A (an A directly on rock is a sharp transition; nothing described under the A leaves it undecided) (Hugo, 2026-11-01: at a half, the canonical Kastanozem and Phaeozem, whose OM halves from one horizon to the next, fell out of the class). The transition under the A is read because in an AC profile the depth to the C is the thickness of the A, so the marked horizons alone cannot tell an isohumic soil from a rendzina, and the text separates the two classes by it (p. 35). The complex is saturated: S/T of 50 % or more in the upper horizons, rising to 80 % or more in the B (p. 39), read in the larger part of its first 100 cm; a calcareous horizon counts as saturated. Organic matter that is not recorded leaves the class undecided."
  - topic: "Class V, sols calcimagnésiques"
    page: "p. 35"
    reading: "No enriched B (a (B) is allowed); in the A, pH(H2O) above 6.8 and saturation by Ca and Mg above 90 % (a calcareous A counts as saturated; base saturation when Ca or Mg is not given). The class excludes the isohumic soils (p. 35), which are keyed before it, so the fall of organic matter is not tested here (Hugo, 2026-11-01: a soil poor in OM throughout, as the canonical Gypsisol, could not show a sharp fall)."
  - topic: "Class VII, sols brunifiés"
    page: "p. 45"
    reading: "The developed soils that remain: a B, a (B) or an A2 (an eluvial horizon is already a developed horizon; Hugo, 2026-11-01)."
  - topic: "Sub-classes and the climate"
    page: "pp. 8-9"
    reading: "The sub-classes rest where possible on the pedoclimate. A climatic sub-class needs its climate and the morphology of one of its groups; with no climate recorded the soil falls to the class's non-climatic or temperate sub-class (I-1, II-4, VII-1, VIII-1), and the trace says so (Hugo, 2026-11-01). The temperate sub-classes VII-1 and VIII-1 hold under a temperate climate (Köppen C, or D with a or b; regimes that are not tropical, cryic, gelic, pergelic, aridic or torric) or with no climate recorded; under another recorded climate, a soil without the morphology of the climatic sub-class has an undecided sub-class rather than a temperate name (Hugo, 2026-11-01). The Köppen code is read in its own case (dfc is Dfc); a value that is not a Köppen code is not read. The climate is read from site$koppen_climate (a new field: the Koppen code, Af to EF), else from the USDA soil temperature and moisture regimes, else from the latitude (23.5 degrees or less is tropical; Brazil, soilKey's convention for the WRB ferralic horizon, when no latitude is recorded). The isohumic soils have four climatic sub-classes and no default: with no climate recorded, and without the property test of VI-1, their sub-class is undecided. site$mean_annual_precip_mm (new) is recorded for the CPCS climate but decides nothing yet."
  - topic: "Sub-classes of classes I and II"
    page: "pp. 18-25"
    reading: "I-2, cold deserts: permafrost, a cryic, pergelic or gelic regime, or Koppen E. I-3, hot deserts: an aridic or torric regime, or Koppen BW. I-1: the others. II-1: permafrost. II-2, humic: 5 % OM or more in the A (the text says only 'teneurs élevées'; Hugo, 2026-11-01), pH under 6.8, and not an arid climate. II-3, xeric: a dry climate (an aridic, torric, xeric or ustic regime, or Koppen B or Cs), under 2 % OM in the A, and no calcareous accumulation horizon (a Ca of the notation below the A, or soilKey's calcic horizon). II-4: the others (Hugo, 2026-11-01)."
  - topic: "Sub-classes of classes III and IV"
    page: "pp. 27-29, 33"
    reading: "III-1, external drainage nil or reduced (the text's runoff, p. 27): a slope under 2 %, else a flat or low landform (depression, plain, basin, valley floor, playa); a slope of 2 % or more, or a sloping landform, is III-2; with neither recorded the sub-class is undecided (Hugo, 2026-11-01). IV-1, cold countries: OM above 10 % in the A over 25 cm or more, which is how the text tells the two sub-classes apart (p. 33); IV-2 the others (Hugo, 2026-11-01)."
  - topic: "Sub-classes of class V"
    page: "pp. 36-38"
    reading: "V-3, gypseous, keyed first: gypsum in the A, 5 % or more of caso4_pct or any visible gypsum, or a Cs of the notation where neither is recorded. V-1, carbonated: carbonate in the fine earth of the A, 1 % or more, or with no value an effervescence moderate or stronger (or a Ca of the notation). V-2, saturated: the others (Hugo, 2026-11-01)."
  - topic: "Sub-classes of class VI"
    page: "pp. 40-43"
    reading: "Every Koppen climate falls in one isohumic sub-class (Hugo, 2026-11-01). VI-1, relatively humid: a udic regime, or Koppen Cf, Dfa, Af or Am, or the property test of the text (the upper horizons partly desaturated, S/T 50 to under 80 %, and 80 % or more at depth). VI-2, very cold: a frigid or cryic regime that is not udic, a mesic regime with an ustic or aridic one (cold winters and summer rains), or Koppen D (not Dfa), BSk, BWk or E. VI-3, cool in the rainy season: a xeric regime, or Koppen Cs. VI-4, hot in the rainy season: an ustic, aridic or torric regime with a thermic or warmer one, or Koppen BSh, BWh, Aw, As or Cw (Hugo, 2026-11-01)."
  - topic: "Sub-classes of classes VII and VIII"
    page: "pp. 45-55"
    reading: "VII-4, tropical countries: a tropical climate (Koppen A, an isothermic, isohyperthermic or hyperthermic regime, or a latitude of 23.5 degrees or less) and the eutrophic brown soils of VII/41, a B or (B) whose larger part has base saturation of 50 % or more. VII-3, boreal: Koppen D with c or d (Dfc, Dfd, Dsc, Dsd, Dwc, Dwd), or a cryic regime, and the boreal leached soils of VII/31, an A2 over a textural B. VII-2, continental temperate: Koppen D with a or b (the USDA regimes do not tell it from the humid temperate climate), and the grey forest or sod-podzolic soils, an A2 over a textural B. VII-1, humid temperate: the others, under a temperate climate or none recorded. VIII-3, hydromorphic: a hydromorphic layer in the A2 or the top of the B, or a gley above the B (slight signs below the B stay in the other sub-classes, as subgroups). VIII-2, cold: Koppen E, or D with c or d, or a cryic, gelic or pergelic regime, and the podzol morphology of its groups, an A2 over the B. VIII-1: the others, under a temperate climate or none recorded (Hugo, 2026-11-01)."
  - topic: "Sub-classes of classes IX to XII"
    page: "pp. 57-78"
    reading: "IX-1, ferruginous tropical soils: base saturation under 65 % in the larger part of the B; without it, a yellow B (10YR or 7.5YR, moist value 5 or more and chroma 4 or more, p. 58). IX-2, fersiallitic: the others. X: the thickness-weighted mean base saturation of the first 100 cm of the (B) decides, the only one of the text's three criteria whose ranges do not overlap: 40 % or more X-1, 20 to under 40 % X-2, under 20 % X-3; without it, the sum of the bases (above 3 cmol(+)/kg X-1, under 1 X-3, between undecided); the pH is evidence only, and X has no default. XI-1: the peat route; XI-2: 8 to 30 % OM over 20 cm or more over a gley (a reduced matrix) or a stagnogley (a hydromorphic layer); XI-3: the others. XII-2, degraded structure: the sodium route (Na above 10 % of the CEC with a massive, compact structure); XII-1: the others (Hugo, 2026-11-01)."
