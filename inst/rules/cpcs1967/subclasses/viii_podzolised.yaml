# Sous-classes des sols podzolisés (p. 50-55), French soil classification (CPCS 1967). Criteria summarised
# from the text; see R/diagnostics-cpcs-subclasses.R and readings.yaml.
subclasses:
  "VIII":
    - code: "VIII-3"
      name: Sols podzolisés hydromorphes
      name_native: Sols podzolisés hydromorphes
      tests:
        all_of:
          - podzolised_hydromorphic_cpcs: {}
      notes: "Hydromorphy over the whole profile: a hydromorphic layer in the A2 or the top of the B, or a gley above the B."
    - code: "VIII-2"
      name: Podzols de climat froid
      name_native: Podzols de climat froid
      tests:
        all_of:
          - podzols_cold_climate_cpcs: {}
      notes: "A cold climate: Köppen E, Dfc, Dfd, Dwc, Dwd, or a cryic, gelic or pergelic regime."
    - code: "VIII-1"
      name: Sols podzolisés de climat tempéré
      name_native: Sols podzolisés de climat tempéré
      tests:
        default: true
      notes: "The other podzolised soils."
