# Sous-groupes des sols ferrallitiques (pp. 67-71), French soil classification (CPCS 1967). Criteria summarised
# from the text; see R/diagnostics-cpcs-subgroups.R and readings.yaml.
subgroups:
  "X/11":
    - code: "X/112"
      name: "{parent}, Induré"
      name_native: "{parent}, Induré"
      tests:
        all_of:
          - indurated_cpcs: {where: b}
      notes: "A carapace or cuirasse in the B: cemented moderately or more, a ferricrete or ironpan, an m of the notation, or soilKey's petroplinthic horizon."
    - code: "X/113"
      name: "{parent}, Hydromorphe"
      name_native: "{parent}, Hydromorphe"
      tests:
        all_of:
          - hydromorphic_signs_cpcs: {window: x}
      notes: "Hydromorphic signs in the A or the top 50 cm of the B."
    - code: "X/114"
      name: "{parent}, Faiblement rajeuni ou pénévolué"
      name_native: "{parent}, Faiblement rajeuni ou pénévolué"
      tests:
        all_of:
          - weatherable_minerals_cpcs: {at_least: 3}
      notes: "Feldspars, micas and amphiboles in the sand 3 % or more within 100 cm, or named without 'traces'."
    - code: "X/115"
      name: "{parent}, Humique"
      name_native: "{parent}, Humique"
      tests:
        all_of:
          - organic_matter_cpcs: {rows: top20, above: 3}
      notes: "A mean OM above 3 % over the top 20 cm."
    - code: "X/111"
      name: "{parent}, Modal"
      name_native: "{parent}, Modal"
      tests:
        default: true
      notes: "The other soils of the group."
