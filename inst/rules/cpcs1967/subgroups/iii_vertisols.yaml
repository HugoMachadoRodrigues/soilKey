    - code: "III/225"
      name: "{parent}, À auto-division sur au moins les 20 cm supérieurs"
      name_native: "{parent}, À auto-division sur au moins les 20 cm supérieurs"
      tests:
        all_of:
          - self_mulching_cpcs: {depth: 20}
      notes: "A self-mulching surface, with fine or very fine structure from the surface to 20 cm or more (with no structure size recorded, undecided)."
    - code: "III/222"
