      tests:
        default: true
      notes: "The other soils of the group."
  "II/44":
    - code: "II/442"
      name: "{parent}, hydromorphe (nappe se trouvant à certaines périodes à moins de 1 m)"
      name_native: "{parent}, hydromorphe (nappe se trouvant à certaines périodes à moins de 1 m)"
      tests:
        all_of:
