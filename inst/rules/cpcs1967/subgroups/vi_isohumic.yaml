      notes: "Hydromorphic signs (redox features above 0 %, mottle colours, a reduced matrix, or a g or G where no mottles are recorded) in a layer starting within 100 cm."
    - code: "VI/414"
      name: "Brun sub-aride vertique"
      name_native: "Brun sub-aride vertique"
