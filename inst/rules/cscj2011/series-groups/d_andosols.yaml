# Soil series groups of the Andosols great group, Comprehensive Soil Classification
# System of Japan, First Approximation (CSCJ 2011), chapter VI: each subgroup's own
# list, in the key's order, the last the others. Names: the term of appendix 2,
# lower case, before the subgroup's name. See R/diagnostics-cscj-series.R.
series_groups:
  "D1AQ":
    - code: "D1AQTP"
      name: "thapto-peaty {parent}"
      name_native: "下層泥炭{parent}"
      tests:
        all_of:
          - peat_within_cscj: {within: 75, cum: 25}
      notes: "25 cm or more (cumulative) of peat material within 75 cm."
    - code: "D1AQEF"
      name: "endofluvic {parent}"
      name_native: "下層低地{parent}"
      tests:
        all_of:
          - endofluvic_cscj: {within: 75, cum: 25}
      notes: "25 cm or more (cumulative) of alluvial deposits within 75 cm."
    - code: "D1AQTY"
      name: "typic {parent}"
      name_native: "典型{parent}"
      tests:
        default: true
      notes: "The others."
  "D1HU":
    - code: "D1HUPE"
      name: "petoric {parent}"
      name_native: "盤層型{parent}"
      tests:
        all_of:
          - petoric_cscj: {within: 60}
      notes: "The top of a pan layer (hardness 29 mm or more, 10 cm or more) within 60 cm."
    - code: "D1HUEF"
      name: "endofluvic {parent}"
      name_native: "下層低地{parent}"
      tests:
        all_of:
          - endofluvic_cscj: {within: 75, cum: 25}
      notes: "25 cm or more (cumulative) of alluvial deposits within 75 cm."
    - code: "D1HUTA"
      name: "thapto-andic {parent}"
      name_native: "下層黒ボク{parent}"
      tests:
        all_of:
          - kuroboku_within_cscj: {within: 100, cum: 25}
      notes: "25 cm or more (cumulative) of layers with the kuroboku feature within 100 cm."
    - code: "D1HUTY"
      name: "typic {parent}"
      name_native: "典型{parent}"
      tests:
        default: true
      notes: "The others."
  "D1TH":
    - code: "D1THPE"
      name: "petoric {parent}"
      name_native: "盤層型{parent}"
      tests:
        all_of:
          - petoric_cscj: {within: 60}
