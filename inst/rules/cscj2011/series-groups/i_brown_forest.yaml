# Soil series groups of the Brown Forest great group, Comprehensive Soil Classification
# System of Japan, First Approximation (CSCJ 2011), chapter VI: each subgroup's own
# list, in the key's order, the last the others. Names: the term of appendix 2,
# lower case, before the subgroup's name. See R/diagnostics-cscj-series.R.
series_groups:
  "I1AN":
    - code: "I1ANLI"
      name: "lithic {parent}"
      name_native: "岩盤質{parent}"
      tests:
        all_of:
          - lithic_cscj: {within: 60}
      notes: "Bedrock within 60 cm of the soil surface."
    - code: "I1ANSK"
      name: "skeletal {parent}"
      name_native: "礫質{parent}"
      tests:
        all_of:
          - skeletal_cscj: {within: 60}
      notes: "The top of a gravel layer (20 % or more gravel) within 60 cm."
    - code: "I1ANFI"
      name: "fine-textured {parent}"
      name_native: "細粒質{parent}"
      tests:
        all_of:
          - texture_cscj: {class: "fine"}
      notes: "Subsurface texture HC, SiC, LiC, SC, SiCL, CL or SCL."
    - code: "I1ANCM"
      name: "coarse-medium-textured {parent}"
      name_native: "中粗粒質{parent}"
      tests:
        default: true
      notes: "The others: Subsurface texture CoSL, LS, S, SiL, L or FSL."
