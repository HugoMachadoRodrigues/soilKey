# The key to the great groups of the Comprehensive Soil Classification
# System of Japan, First Approximation (CSCJ 2011, chapter V, pp. 28-29), in
# its own order. Each great group after the first is "soils other than the
# above", so a gate tests only its own requirements. The codes are the CSCJ's
# own letters (the same letter names different great groups in the SCSJ
# 2017 from C to H); name is the English name of appendix 2 and name_native
# the Japanese one. The gates shared with the SCSJ read the pedon by the CSCJ
# edition, under their CSCJ names (classify_cscj2011()). Criteria are
# summarised from the text; see R/diagnostics-cscj-great-groups.R and
# readings.yaml.

great_groups:

  - code: "A"
    name: Man-made soils
    name_native: 造成土大群
    tests:
      all_of:
        - man_made_soils_cscj: {}
    notes: "The fill shows none of the natural diagnostic horizons and wetness features; and within 50 cm, 25 cm or more (cumulative) of layers with 20 % or more artificial material, a continuous impermeable artificial layer from within 30 cm, or 35 cm or more of fill of heterogeneous soil material (material of another CSCJ great group)."

  - code: "B"
    name: Organic soils
    name_native: 有機質土大群
    tests:
      all_of:
        - organic_soils_cscj: {}
    notes: "25 cm or more (cumulative) of peat material within 50 cm of the soil surface, or 25 cm continuous below a fill of other material under 35 cm."

  - code: "C"
    name: Podzols
    name_native: ポドゾル大群
    tests:
      all_of:
        - podzols_cscj: {}
    notes: "A single parent material (read on the pair: the bleached and accumulation horizons in one lithologic layer); no paddy surface horizon (unbleached), no layer with the red-yellow feature; a podzolic accumulation horizon (morphology) under a bleached horizon, or one by analysis under a bleached horizon or with one by morphology (the same horizon may meet both). Keyed before the Andosols."

  - code: "D"
    name: Andosols
    name_native: 黒ボク土大群
    tests:
      all_of:
        - andosols_cscj: {}
    notes: "25 cm or more (cumulative) of layers with the kuroboku or the immature kuroboku feature within 50 cm, or 25 cm continuous below a fill under 35 cm. The immature kuroboku feature has P retention as its only substitute for the phosphate absorption coefficient."

  - code: "E"
    name: Dark Red soils
    name_native: 暗赤色土大群
    tests:
      all_of:
        - dark_red_soils_cscj: {}
    notes: "The top of a weathered or argic horizon within 50 cm; a dark red subsurface, or soil from limestone or calcareous deposits with every subhorizon of the subsurface at pH(H2O) 5.5 or more or base saturation 50 % or more; no bedrock within 30 cm."

  - code: "F"
    name: Lowland soils
    name_native: 低地土大群
    tests:
      all_of:
        - lowland_soils_cscj: {}
    notes: "25 cm or more (cumulative) of alluvial deposits within 50 cm, or 25 cm continuous below a fill of other material under 35 cm."

  - code: "G"
    name: Red-Yellow soils
    name_native: 赤黄色土大群
    tests:
      all_of:
        - red_yellow_soils_cscj: {}
    notes: "A weathered or argic horizon with the red-yellow feature, 25 cm or more (one horizon), its top within 50 cm; no bedrock within 30 cm. No base-status criterion."

  - code: "H"
    name: Stagnic soils
    name_native: 停滞水成土大群
    tests:
      all_of:
        - stagnic_soils_cscj: {}
    notes: "Less than 25 cm of volcanic ejecta within 50 cm; a gley layer, or a layer with a wetness feature, 10 cm or more, its top within 50 cm, reaching 50 cm or the bedrock."

  - code: "I"
    name: Brown Forest soils
    name_native: 褐色森林土大群
    tests:
      all_of:
        - brown_forest_soils_cscj: {}
    notes: "The top of a weathered or argic horizon within 50 cm; no bedrock within 30 cm."

  - code: "J"
    name: Regosols
    name_native: 未熟土大群
    tests:
      default: true
    notes: "Other soils."
