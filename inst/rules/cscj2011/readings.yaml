# The readings soilKey makes of the CSCJ 2011 where the text is silent or
# ambiguous, and the owner's decisions. Pages are those of the CSCJ (NIAES
# Bulletin 29). The diagnostics the CSCJ shares with the SCSJ 2017 are read
# as the SCSJ readings say (inst/rules/scsj2017/readings.yaml), except where
# an entry here says otherwise.
readings:
  - topic: "Scope and the edition"
    page: "I, V (pp. 2-11, 28-29)"
    reading: "The CSCJ 2011 is a system of its own in soilKey, keyed with the code of the SCSJ 2017 wherever the two texts give the same criteria: classify_cscj2011() marks its copy of the pedon (site$jp_edition = 'cscj2011') and the shared diagnostics read the CSCJ's own limits where it has them (the argic horizon, the immature kuroboku feature, the colour words). This release keys the ten great groups; the 27 groups, 116 subgroups, 381 soil series groups and the phases follow. Names: the English names of appendix 2, the Japanese ones beside them (levels$name_native)."
  - topic: "Soil surface"
    page: "IV (pp. 19-27)"
    reading: "The CSCJ does not define the soil surface. soilKey reads it as the SCSJ 2017 does (IV.4: the ground surface on peat and wet sites, otherwise below the forest floor), with O horizons organic (Hugo, 2026-11-01)."
  - topic: "Argic horizon"
    page: "IV.1 (p. 20)"
    reading: "The CSCJ's own clay increase over the layer above (the WRB 2006 values): under 15 % clay, 3 % more; 15 to under 40 %, 1.2 times; 40 % or more, 8 % more (Hugo, 2026-11-01). The SCSJ 2017 keeps its own limits."
  - topic: "Immature kuroboku feature"
    page: "IV.2 (p. 23)"
    reading: "A phosphate absorption coefficient of 300 to under 1500, with P retention 25 to under 85 % as the only substitute (the CSCJ gives no Alo + 1/2 Feo substitute), or 3 % organic carbon or more, in volcanic ejecta. The kuroboku feature keeps its substitutes (P retention 85 %, Alo + 1/2 Feo 2.0 %)."
  - topic: "Heterogeneous soil material (Man-made soils)"
    page: "IV.3 (p. 23)"
    reading: "Soil material of another CSCJ great group: the fill and the soil under it are keyed on their own through the CSCJ gates (Organic soils, Podzols, Andosols, Dark Red, Lowland, Red-Yellow, Stagnic, Brown Forest soils, Regosols). The SCSJ's rule that in the Regosols material of another group is heterogeneous too is not in the CSCJ and is not read."
  - topic: "Podzols before Andosols"
    page: "V (p. 28)"
    reading: "The CSCJ keys the Podzols before the Andosols: a kuroboku soil with a bleached horizon over a podzolic accumulation horizon is a Podzol (the SCSJ 2017 makes it a Podzolic Andosol). The Podzol criteria are the SCSJ's. Route (4)b, an accumulation horizon by analysis with one by morphology, may be met by one horizon that meets both (by the letter, as in the SCSJ; Hugo, 2026-11-01): a kuroboku soil whose B meets both is a Podzol. Criterion (1), a single parent material, is read on the pair: the bleached and accumulation horizons in one lithologic layer (Hugo, 2026-11-01)."
  - topic: "Dark Red soils"
    page: "V E (p. 29); IV.3 (p. 23); IV.4 (p. 24)"
    reading: "The top of a weathered or argic horizon within 50 cm; a dark red subsurface, or soil from limestone or calcareous deposits with every subhorizon of the subsurface at pH(H2O) 5.5 or more or base saturation 50 % or more; no bedrock within 30 cm. Dark red: 5YR or redder, a moist value of 3 or less and chroma 3 to 6, or 4/3 and 4/4. The colour of the subsurface is that of the thickest B horizon (a buried B included) in the subsurface section (20 to 60 cm), else of the first B horizon below it, else of the thickest layer of the section, the text's general rule (Hugo, 2026-11-01); an undesignated weathered or argic horizon counts as a B, and an unreadable designation may be one. A horizon without a bottom, a row that may be a B, or depth the description does not cover leave the colour undecided where it could change it; with no B below, the thickest layer is read only when the description is complete, ends on rock or reaches 1 m. Limestone or calcareous deposits: the words limestone, calcareous, coral, marl, chalk, travertine (and the Japanese words) in rock_origin or layer_origin of the layers to 1 m, or in the site parent material (not for a profile that is all fill), with negated words (non-, not, no, without, -free) taken out, or a layer to 1 m with 40 % or more CaCO3; nothing recorded: not (Hugo, 2026-11-01). The base status is the SCSJ's; where site$acid_neutralising_amendment records liming, a high status is undecided (Hugo, 2026-11-01; the CSCJ key has no liming clause here, its Eutric Dark Red group in chapter III has one)."
  - topic: "Red-Yellow soils"
    page: "V G (p. 29)"
    reading: "The top within 50 cm of a weathered or argic horizon with the red-yellow feature, 25 cm or more in that one horizon (adjacent layers, not added up over separate horizons; Hugo, 2026-11-01); no bedrock within 30 cm. The CSCJ has no base-status criterion and no red-yellow weathered horizon (both are in the SCSJ 2017). The red-yellow feature is the SCSJ's: under 2 % organic carbon and a red or yellow colour."
  - topic: "Black colour"
    page: "IV.4 (p. 24)"
    reading: "Black to blackish brown: a moist value under 3, not dark red."
  - topic: "Subsurface section"
    page: "IV.4 (p. 24)"
    reading: "The subsurface section (20 to 60 cm) is the SCSJ's, the plough layer excepted (Hugo, 2026-11-01; the CSCJ text does not except it). It enters the Dark Red soils' colour and base status now; the texture layer (a horizon of 15 cm or more with the largest overlap of 20 to 40 cm, else the thickest of the section; a tie between different classes undecided) and the non-allophanic test by the key follow with the groups and series groups."
  - topic: "Impermeable artificial layer"
    page: "III A (p. 12); V A (p. 28)"
    reading: "Chapter III writes 25 cm for the top of the continuous impermeable artificial layer, the key (chapters V and VI) 30 cm; soilKey follows the key."
