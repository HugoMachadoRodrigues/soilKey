# The readings soilKey makes of the CSCJ 2011 where the text is silent or
# ambiguous, and the owner's decisions. Pages are those of the CSCJ (NIAES
# Bulletin 29). The diagnostics the CSCJ shares with the SCSJ 2017 are read
# as the SCSJ readings say (inst/rules/scsj2017/readings.yaml), except where
# an entry here says otherwise.
readings:
  - topic: "Scope and the edition"
    page: "I, V (pp. 2-11, 28-29)"
    reading: "The CSCJ 2011 is a system of its own in soilKey, keyed with the code of the SCSJ 2017 wherever the two texts give the same criteria: classify_cscj2011() marks its copy of the pedon (site$jp_edition = 'cscj2011') and the shared diagnostics read the CSCJ's own limits where it has them (the argic horizon, the immature kuroboku feature, the colour words). This release keys the ten great groups, the 27 groups, the 116 subgroups and the 381 soil series groups, and gives the soil phases of chapter VIII. Names: the English names of appendix 2, the Japanese ones beside them (levels$name_native)."
  - topic: "Soil surface"
    page: "IV (pp. 19-27)"
    reading: "The CSCJ does not define the soil surface. soilKey reads it as the SCSJ 2017 does (IV.4: the ground surface on peat and wet sites, otherwise below the forest floor), with O horizons organic (Hugo, 2026-11-01)."
  - topic: "Argic horizon"
    page: "IV.1 (p. 20)"
    reading: "The CSCJ's own clay increase over the layer above (the WRB 2006 values): under 15 % clay, 3 % more; 15 to under 40 %, 1.2 times; 40 % or more, 8 % more (Hugo, 2026-11-01). The SCSJ 2017 keeps its own limits."
  - topic: "Immature kuroboku feature"
    page: "IV.2 (p. 23)"
    reading: "A phosphate absorption coefficient of 300 to under 1500, with P retention 25 to under 85 % as the only substitute (the CSCJ gives no Alo + 1/2 Feo substitute), or 3 % organic carbon or more, in volcanic ejecta. The kuroboku feature keeps its substitutes (P retention 85 %, Alo + 1/2 Feo 2.0 %)."
  - topic: "Heterogeneous soil material (Man-made soils)"
    page: "IV.3 (p. 23)"
    reading: "Soil material of another CSCJ great group: the fill and the soil under it are keyed on their own through the CSCJ gates (Organic soils, Podzols, Andosols, Dark Red, Lowland, Red-Yellow, Stagnic, Brown Forest soils, Regosols). The SCSJ's rule that in the Regosols material of another group is heterogeneous too is not in the CSCJ and is not read. A fill that keys as Andosols is a combination of materials that occurs in nature, volcanic ash covering any material (IX, step D, p. 59, whose example is a humic kuroboku fill on alluvium; Hugo, 2026-11-01): it does not make the soil Man-made, and the soil is keyed as any other; a fill that may key as Andosols leaves the criterion undecided. The SCSJ 2017 reads a recorded fill as never a natural combination."
  - topic: "Podzols before Andosols"
    page: "V (p. 28)"
    reading: "The CSCJ keys the Podzols before the Andosols: a kuroboku soil with a bleached horizon over a podzolic accumulation horizon is a Podzol (the SCSJ 2017 makes it a Podzolic Andosol). The Podzol criteria are the SCSJ's. Route (4)b, an accumulation horizon by analysis with one by morphology, may be met by one horizon that meets both (by the letter, as in the SCSJ; Hugo, 2026-11-01): a kuroboku soil whose B meets both is a Podzol. Criterion (1), a single parent material, is read on the pair: the bleached and accumulation horizons in one lithologic layer (Hugo, 2026-11-01)."
  - topic: "Dark Red soils"
    page: "V E (p. 29); IV.3 (p. 23); IV.4 (p. 24)"
    reading: "The top of a weathered or argic horizon within 50 cm; a dark red subsurface, or soil from limestone or calcareous deposits with every subhorizon of the subsurface at pH(H2O) 5.5 or more or base saturation 50 % or more; no bedrock within 30 cm. Dark red: 5YR or redder, a moist value of 3 or less and chroma 3 to 6, or 4/3 and 4/4. The colour of the subsurface is that of the thickest B horizon (a buried B included) in the subsurface section (20 to 60 cm), else of the first B horizon below it (one reaching below the section), else of the thickest layer of the section, the text's general rule (Hugo, 2026-11-01); an undesignated weathered or argic horizon counts as a B, and an unreadable designation may be one (is one where it is weathered or argic); where no B is surely in the section, any row that may be one may be the only one, so all their colours must agree. A horizon without a bottom, a row that may be a B, or depth the description does not cover leave the colour undecided where it could change it; with no B below, the thickest layer is read only when the description is complete, ends on rock or reaches 1 m. Limestone or calcareous deposits: the words limestone, calcareous, coral or coralline, marl or marly, chalk or chalky, travertine (and the Japanese words) in rock_origin or layer_origin of the layers to 1 m, or in the site parent material (not for a profile that is all fill), with negated words (non-, not, no, without, lacking, -free, and the Japanese negations) taken out, or a layer to 1 m with 40 % or more CaCO3; nothing recorded: not (Hugo, 2026-11-01). The base status is the SCSJ's; where site$acid_neutralising_amendment records liming, a high status is undecided (Hugo, 2026-11-01; the CSCJ key has no liming clause here, its Eutric Dark Red group in chapter III has one)."
  - topic: "Red-Yellow soils"
    page: "V G (p. 29)"
    reading: "The top within 50 cm of a weathered or argic horizon with the red-yellow feature, 25 cm or more in that one horizon (adjacent layers, not added up over separate horizons; Hugo, 2026-11-01); no bedrock within 30 cm. The CSCJ has no base-status criterion and no red-yellow weathered horizon (both are in the SCSJ 2017). The red-yellow feature is the SCSJ's: under 2 % organic carbon and a red or yellow colour."
  - topic: "Black colour"
    page: "IV.4 (p. 24)"
    reading: "Black to blackish brown: a moist value under 3, not dark red."
  - topic: "Subsurface section"
    page: "IV.4 (p. 24)"
    reading: "The subsurface section (20 to 60 cm) is the SCSJ's, the plough layer excepted (Hugo, 2026-11-01; the CSCJ text does not except it). It enters the Dark Red soils' colour and base status now; the texture layer (a horizon of 15 cm or more with the largest overlap of 20 to 40 cm, else the thickest of the section; a tie between different classes undecided) follows with the series groups. With no subsurface at all (a gravel layer or the bedrock from 20 cm, or a plough layer through the section), a criterion on its subhorizons is not met (Hugo, 2026-11-01)."
  - topic: "Impermeable artificial layer"
    page: "III A (p. 12); V A (p. 28)"
    reading: "Chapter III writes 25 cm for the top of the continuous impermeable artificial layer, the key (chapters V and VI) 30 cm; soilKey follows the key."
  - topic: "Groups shared with the SCSJ"
    page: "VI (pp. 30-45)"
    reading: "The groups whose criteria are the SCSJ's are its gates read by the CSCJ edition, under CSCJ names: Artifactual soils, Regosolic, Gleyed, Wet and Non-allophanic Andosols, Lowland Paddy, Gley and Gray Lowland soils, Argic Red-Yellow soils, Stagnogley soils, Volcanogenous and Sandy Regosols and Lithosols, as the SCSJ readings say. The last group of each great group is the default."
  - topic: "Fulvic Andosols: the brown polyhumic kuroboku surface horizon"
    page: "IV.1 (p. 19); IV.5 (p. 26); VI D (p. 32)"
    reading: "Surface horizons (A, AB, A/B or AC, or undesignated; not buried; a BA is not one, and an unreadable designation may be one) with the kuroboku feature, a moist value of 3 or more and chroma of 3 or more (3/3 included), and 4 % organic carbon or more each, 30 cm or more in all within 40 cm of the soil surface, their thickness-weighted mean carbon 6 % or more, over the parts of the layers within 40 cm. The layers that meet every requirement are added up; a layer that fails between them is not counted and does not enter the mean, and the 10 cm allowance of the humic horizons does not apply (Hugo, 2026-11-01). Undecided while the layers that may meet them, a horizon without a bottom (which may end at once or reach 40 cm) or depth the description does not cover could change the thickness or the mean. Appendix 2 prints 'Fuluvic Andosols'; soilKey writes Fulvic."
  - topic: "Dark Red groups"
    page: "VI E (p. 35); III E (p. 14)"
    reading: "Calcaric: from limestone or calcareous deposits with a base-rich subsurface (as the great group's criterion 2b). Dystric: a subhorizon of the subsurface at pH(H2O) under 5.5, read on pH alone (undecided where 5 cm or more of the section, in one stretch, is not described or lies below a horizon without a bottom); where site$acid_neutralising_amendment records liming, a pH of 5.5 or more may come from it and the group is undecided (Hugo, 2026-11-01; chapter III excludes from the Eutric group a pH raised by fertilising). Eutric: the others. Calcaric reads the great group's base status, so recorded liming leaves it undecided too (Hugo, 2026-11-01)."
  - topic: "Brown Lowland soils"
    page: "IV.4 (p. 24); VI F (p. 37)"
    reading: "A yellowish-brown subsurface by the CSCJ colour word: yellower than 5YR, a moist value of 3 or more and chroma 3 to under 6, or 3/6 and 4/6 (Hugo, 2026-11-01). The SCSJ's brown includes 5YR, so a 5YR subsurface makes a Brown Fluvic soil in the SCSJ and a Regosolic Lowland soil in the CSCJ. The subsurface colour is that of the thickest layer of the section, as in the SCSJ."
  - topic: "Names printed with a typo"
    page: "Appendix 2 (pp. 62-65)"
    reading: "Appendix 2 prints 'Fuluvic Andosols' and 'Volcangenous Regosols'; soilKey writes Fulvic Andosols and Volcanogenous Regosols (the SCSJ's spelling). The key's Thapto-humic Allophanic Andosols name the Non-allophanic group inside the Allophanic one, and its Marlitic Terrestrial Regosols write limestone for marl (chapter V says marl): both read as intended."
  - topic: "Non-allophanic Andosols"
    page: "VI D (p. 32); IV.4 (p. 24)"
    reading: "By the key alone: 25 cm or more (cumulative) of layers with the non-allophanic kuroboku feature within 50 cm. The note to the subsurface (IV.4), that these soils are judged on a layer of 15 cm or more in 20 to 40 cm, is not applied (Hugo, 2026-11-01)."
  - topic: "Volcanogenous Regosols"
    page: "VI J (p. 43)"
    reading: "Undeveloped horizons: no weathered or argic horizon, a buried one not counting (Hugo, 2026-11-01, in both Japanese systems), since the series groups of these soils name buried kuroboku, alluvial and peat layers."
  - topic: "Subgroups shared with the SCSJ"
    page: "VI (pp. 30-45)"
    reading: "The subgroups whose criteria are the SCSJ's are its generic gates read by the CSCJ edition, under CSCJ names, with the same depths and features: the subgroups of the Man-made, Organic, Podzol, Regosolic, Gleyed and Wet Andosol, Lowland, Red-Yellow, Stagnic and Regosol groups, as the SCSJ readings say; so are the Anthraquic, Cumulic, Thapto-humic, Thapto-upland and Endofluvic subgroups of the Non-allophanic and Allophanic Andosols. A subgroup is named by its word before the group's name, in English (appendix 2) and in Japanese. The Gray Lowland soils' subgroup is 'Gleyed' (appendix 2), the SCSJ's 'Gleyic'. The Endoaeric Lowland Paddy soils read the CSCJ's yellowish brown (5YR excluded); the Andic subgroups have P retention (60 %) as the only substitute for the phosphate absorption coefficient (1000), with no Alo + 1/2 Feo."
  - topic: "Andosol subgroups of the CSCJ"
    page: "VI D (pp. 31-34)"
    reading: "Fulvic Andosols: Cumulic, the brown polyhumic kuroboku surface horizon 50 cm or more within 60 cm (read as the group's horizon, 30 in 40); Thapto-humic; Haplic. Non-allophanic Andosols: Anthraquic, Cumulic, Thapto-humic, Haplic (no Humic, Brown-humic or Aquic subgroup, unlike the SCSJ). Allophanic Andosols: Anthraquic, Thapto-upland, Endofluvic, Low-humic (no humic or polyhumic surface horizon), Cumulic, Thapto-humic, Haplic."
  - topic: "Dark Red subgroups"
    page: "VI E (p. 35)"
    reading: "Each Dark Red group has an Argic subgroup (an argic horizon, by the CSCJ's limits) and a Haplic one."
  - topic: "Brown Forest subgroups of the CSCJ"
    page: "VI I (pp. 42-43)"
    reading: "In the CSCJ's order: Anthraquic; Aquic, the top of a layer with the surface-water or the groundwater wetness feature within 75 cm; Eutric, every subhorizon of the subsurface at pH(H2O) 6.5 or more, on pH alone, with no liming clause (Hugo, 2026-11-01; the SCSJ asks one subhorizon, by pH or base saturation), no subsurface: not met, and undecided where 5 cm or more of the section in one stretch is not described; Andic; Humic; Podzolic; Thapto-red-yellow; Terrace, from Pleistocene deposits (unconsolidated fluvial, marine or lacustrine) by recorded words in the layer_origin of the layers to 1 m or the site parent material, nothing recorded: not (Hugo, 2026-11-01): in each record, negated words (non-, not, pre-, post-, antediluvial, the Japanese negations) are taken out, a rock (lava, andesite, rock and the like) is not a deposit, Pleistocene, diluvial and the Japanese words count, and a terrace deposit (terrace gravel or sand, the Japanese words for terrace deposits; a bare 'terrace' does not) counts unless the record says Holocene or alluvial; Haplic."
  - topic: "Soil series groups: the lists and the names"
    page: "VI (pp. 30-45); appendix 2 (p. 65)"
    reading: "Each subgroup has its own ordered list (the Man-made soils have none); the last series group of each list is the others. A series group is named by its term of appendix 2, in lower case, before the subgroup's name ('typic Haplic Podzols', 典型普通ポドゾル; Hugo, 2026-11-01); the one term without an English name, 埋没腐植質, is written thapto-humic."
  - topic: "Soil series groups: bedrock, gravel and pan layers"
    page: "VI; IV.4 (p. 24)"
    reading: "Lithic: bedrock within 60 cm of the soil surface; skeletal: the top of a gravel layer within 60 cm (Hugo, 2026-11-01: from the soil surface, as the series groups' texts say), and in the Lowland soils and the Endofluvic Wet and Allophanic Andosols a gravel layer or the bedrock. A gravel layer: 20 % or more in gravel_pct or coarse_fragments_pct; with neither recorded, no gravel layer (Hugo, 2026-11-01). Petoric: the top of a pan layer, hardness 29 mm or more by the Yamanaka-type tester (the new attribute hardness_yamanaka_mm) and 10 cm or more thick, within 60 cm; hardness not recorded: no pan layer (Hugo, 2026-11-01)."
  - topic: "Soil series groups: the texture of the subsurface"
    page: "VI; IV.4 (p. 24)"
    reading: "Fine-textured HC, SiC, LiC, SC, SiCL, CL, SCL; medium-textured SiL, L, FSL; coarse-textured CoSL, LS, S; coarse-medium-textured the last two together; from the new attribute texture_class_jp (the codes or the Japanese words). Without it, clay 15 % or more reads as fine and less as medium or coarse, undecided between them (no estimate from the USDA sand and silt; Hugo, 2026-11-01). The undivided sandy loam (SL) is medium or coarse, not fine. The texture is read on the horizon of the subsurface section 15 cm or more thick with the largest overlap of 20 to 40 cm, a tie going to the larger part of the section and then to the thicker horizon, else on the thickest of the section (Hugo, 2026-11-01); horizons still tied must agree, and a horizon without a bottom may be the one. With no subsurface (a gravel layer or the bedrock from 20 cm, or the plough layer through the section), no texture class is met (Hugo, 2026-11-01)."
  - topic: "Soil series groups: the other terms"
    page: "VI; IV.1 (pp. 19-21)"
    reading: "Thapto-peaty: 25 cm or more (cumulative) of peat material within 75 cm; endofluvic: of alluvial deposits within 75 cm; thapto-andic: of layers with the kuroboku feature within 100 cm; non-allophanic: of layers with the non-allophanic kuroboku feature within 50 cm. High-humic: a polyhumic surface horizon; humic: the others (with a humic surface horizon); low-humic: neither; cumulic: a humic or polyhumic surface horizon of 50 cm or more; thapto-humic: the top of a buried humic layer within 50 cm. Epi-mineralic: a mineral layer of 10 cm or more starting at the soil surface (the text's 'at the surface'); endomineralic: 25 cm or more (cumulative) of mineral layers within 75 cm; fibric: fibric peat has the largest share of the peat to 50 cm. Mollic: the base-rich dark surface horizon, surface horizons of moist value and chroma 3 or less (not 3/3), 0.6 % carbon or more and base saturation 50 % or more without fertilising (liming recorded: undecided, Hugo, 2026-11-01), 10 cm or more directly on the bedrock, else 25 cm, added up from the soil surface. Aquic (Marlitic Terrestrial Regosols): the top of a layer with the gley feature or the groundwater wetness feature within 75 cm."
  - topic: "Soil phases"
    page: "VIII (pp. 57-58); IX (pp. 58-59)"
    reading: "The phases go in ClassificationResult$phases, beside the class name, as in the SCSJ. Temperature: the mean annual soil temperature at 50 cm, else the USDA regime, else the mean annual air temperature plus 2 C, as the CSCJ says to do when the soil temperature is not measured (fig. 6; Hugo, 2026-11-01), the phase then marked as estimated. Man-made phases read as in the SCSJ (one phase for the Man-made soils, gley before wet before gravelly, the Reformed soils too; mixing below the plough layer; a cut recorded), with the CSCJ's names (Hugo, 2026-11-01). A fill in the plough layer alone, the subsoil untouched, takes no phase (IX, step A). A fill outside the Man-made soils is named by its artificial material, by dredged sediment, or by the soil kind its material features name (Organic, Andosol, Dark Red, Lowland, Red-Yellow; a dark red colour counts in an A horizon only under 2 % carbon), after the texture word of its thickest layer (skeletal, fine-, medium- or coarse-textured) when decided, for a kuroboku fill its humus class (high-humic with 6 % carbon or more, humic with 3 %), and no word for a peat fill. A fill with none of these five kinds is keyed on its own when 25 cm or more and named by its great group, a thinner one by the texture word alone (Hugo, 2026-11-01). A kuroboku fill on other material is a natural combination (IX, step D): the soil is keyed as any other and takes the fill phase, as in the text's example of a humic kuroboku fill on alluvium. The Reformed soils' fill is named by the same word and its great group, over the original soil's group; an error in keying the original soil is recorded as a warning. Chapter IX, step B, says a moved layer of 35 cm or less makes no Man-made soil, the key says 35 cm or more makes one: the key is read, so a fill of exactly 35 cm can make a Man-made soil. A gravel layer is recorded when present, as in the series groups. The CSCJ has no forest phases."
