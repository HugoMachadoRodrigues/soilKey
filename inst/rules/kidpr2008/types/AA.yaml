# The types of the division AA, Торфяные почвы
# (Peat soils): Field Guide of 2008, chapter 4.4.1, pp. 132-133;
# 5 types (5 natural, 0 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 AA..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested, but
#       the rock and substrate slots that name a type are (`test_terminals`).
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# TO, TE and TJ are the peat horizons of the upper 50 cm of the peat body and
# TT the peat below (Hugo's decision Q22); a peat horizon that runs across
# that line is read as TT below it, and a T of the notation as TO or TE by
# the botany of its layer, and a peat horizon starting 50 cm or more under
# the top of the body is TT. The rock under the dry peat of AA05 is tested,
# R or loose material C (p. 43); a rock under the peat closes no other
# formula (Hugo, 2026-11-02).
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "AA":
    - code: "[AA01]"
      name: "Oligotrophic peat soils"
      name_native: "Торфяные олиготрофные"
      formula: "TO-TT"
      page: 132
      ignore: ["C", "R"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[AA01]"}
      notes: "Loose rock C or hard rock R under the peat closes no formula that does not write it (`ignore`): the rock is tested only in AA05 (Hugo, 2026-11-02)."
    - code: "[AA02]"
      name: "Oligotrophic gley peat soils"
      name_native: "Торфяные олиготрофные глеевые"
      formula: "TO-TT-G"
      page: 132
      ignore: ["C", "R"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[AA02]"}
      notes: "Loose rock C or hard rock R under the peat closes no formula that does not write it (`ignore`): the rock is tested only in AA05 (Hugo, 2026-11-02)."
    - code: "[AA03]"
      name: "Eutrophic peat soils"
      name_native: "Торфяные эутрофные"
      formula: "TE-TT"
      page: 132
      ignore: ["C", "R"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[AA03]"}
      notes: "Loose rock C or hard rock R under the peat closes no formula that does not write it (`ignore`): the rock is tested only in AA05 (Hugo, 2026-11-02)."
    - code: "[AA04]"
      name: "Eutrophic gley peat soils"
      name_native: "Торфяные эутрофные глеевые"
      formula: "TE-TT-G"
      page: 132
      ignore: ["C", "R"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[AA04]"}
      notes: "Loose rock C or hard rock R under the peat closes no formula that does not write it (`ignore`): the rock is tested only in AA05 (Hugo, 2026-11-02)."
    - code: "[AA05]"
      name: "Dry-peat soils"
      name_native: "Сухоторфяные"
      formula: "TJ-TT-R"
      page: 132
      test_terminals: ["R"]
      near_identity: {R: ["C"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[AA05]"}
      notes: "The rock under the peat body is tested: the hard rock R or loose material C, as p. 43 lets the dry peat lie on either (`near_identity`; Hugo, 2026-11-02)."
