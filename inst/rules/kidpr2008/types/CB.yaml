    - code: "[CB05]"
      name: "Sod podburs"
      name_native: "Дерново-подбуры"
      formula: "AY-BF-C"
      page: 81
      near_identity: {BF: ["BHF"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CB05]"}
      notes: "BF is read as a BHF of either kind (BH, BF or neither), which names the subtype (Hugo's decision Q15). An EL in the profile counts as an eluvial horizon: a formula without E does not take it (p. 43; Hugo, 2026-11-02)."
