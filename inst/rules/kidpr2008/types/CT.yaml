# The types of the division CT, Турбоземы
# (Turbozems): Field Guide of 2008, chapter 4.1.20, pp. 121-123;
# 17 types (0 natural, 17 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 CT..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested, but
#       the rock and substrate slots that name a type are (`test_terminals`).
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# The fragments of the TUR (TUR[AU+SEL+ASN]) are tested, the BCA under
# them is not (Hugo's decisions Q14 and Q20). Every middle horizon of C.5
# closes the formulas (`close`); a plain TUR is no TUR of solonetz fragments
# (`reject_fragments`); BT counts as BI in CT05 to CT08; a BCA under BI or CAT
# is ignored (`ignore`) (Hugo, 2026-11-02).
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "CT":
    - code: "[CT01]"
      name: "Turbozems"
      name_native: "Турбоземы"
      formula: "P-TUR-C"
      page: 121
      close: ["BT", "BI", "BHF", "BFM", "BM", "BPL", "CRM", "CR", "BCA", "CAT", "ASN", "BSN", "G", "Q", "TUR", "V", "CRH"]
      reject_fragments: ["ASN", "BSN"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CT01]"}
      notes: "Every middle horizon of the key's list at C.5 closes the formulas of the turbozems: one the formula does not write leaves the profile without this type (Hugo, 2026-11-02). A TUR whose fragments include ASN or BSN is no plain TUR: the solonetzic formulas take it; with its fragments not recorded and an ESP of 15 % or more the type is undecided (Hugo, 2026-11-02)."
    - code: "[CT02]"
      name: "Dark turbozems"
      name_native: "Турбоземы темные"
