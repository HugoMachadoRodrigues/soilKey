      notes: "A BCA under the middle horizon neither blocks this formula nor is required by it, as in the structure-metamorphic soils (p. 85; Hugo, 2026-11-02); the formulas that write BCA name the type where they match. Every middle horizon of the key's list at C.5 closes the formulas of the turbozems: one the formula does not write leaves the profile without this type (Hugo, 2026-11-02). A TUR whose fragments include ASN or BSN is no plain TUR: the solonetzic formulas take it; with its fragments not recorded and an ESP of 15 % or more the type is undecided (Hugo, 2026-11-02). A BT is read as BI in this formula: exposed, under PB or under TUR (Hugo's decision Q15 and of 2026-11-02)."
