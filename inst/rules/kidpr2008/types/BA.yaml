      page: 125
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BA09]"}
      notes: "CG~~ (CQ~~): the parent material is gleyed or quasigleyed; not tested (Q14)."
    - code: "[BA10]"
      name: "Alluvial peaty gley"
      name_native: "Аллювиальные торфяно-глеевые"
