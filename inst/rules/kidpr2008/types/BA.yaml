          - type_formula_kidpr: {type: "[BA05]"}
    - code: "[BA06]"
      name: "Alluvial humus gley"
      name_native: "Аллювиальные гумусовые глеевые"
      formula: "AY-G-CG~~"
      page: 125
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BA06]"}
      notes: "The diagram (p. 125) prints глеевы, a slip."
    - code: "[BA07]"
      name: "Alluvial ortstein"
      name_native: "Аллювиальные рудяковые"
      formula: "AY-F-C~~"
      page: 125
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BA07]"}
    - code: "[BA08]"
