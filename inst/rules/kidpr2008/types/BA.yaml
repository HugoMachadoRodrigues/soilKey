      notes: "An agro type: the natural humus or organic horizon stays under the plough layer, its remnant (p. 124); without it the soil is an agrozem (CS)."
    - code: "[BA17]"
      name: "Alluvial agro-peat-mineral gley"
      name_native: "Аллювиальные агроторфяно-минеральные глеевые"
