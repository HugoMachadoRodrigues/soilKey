# The types of the division BA, Аллювиальные почвы
# (Alluvial soils): Field Guide of 2008, chapter 4.2.1, pp. 123-126;
# 18 types (10 natural, 8 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 BA..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested, but
#       the rock and substrate slots that name a type are (`test_terminals`).
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# The alluvial mark of the parent material (C~~, CG~~, CQ~~) is not tested:
# the division has proved the alluvium (Hugo's decision Q14). The buried humus
# horizons of the alluvial soils are described but are not in the type
# formula (p. 124): a buried soil is not read.
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "BA":
    - code: "[BA01]"
      name: "Alluvial humus"
      name_native: "Аллювиальные гумусовые"
      formula: "AY-C~~"
      page: 124
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BA01]"}
    - code: "[BA02]"
      name: "Alluvial dark-humus"
      name_native: "Аллювиальные темногумусовые"
      formula: "AU-C~~"
      page: 124
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BA02]"}
      notes: "Chapter 6 writes the formula AU-C(ca)~~."
    - code: "[BA03]"
      name: "Alluvial dark-humus gley"
      name_native: "Аллювиальные темногумусовые глеевые"
      formula: "AU-G-CG~~"
      page: 124
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BA03]"}
    - code: "[BA04]"
      name: "Alluvial dark-humus quasigley"
      name_native: "Аллювиальные темногумусовые квазиглеевые"
      formula: "AU-Q-CQ~~"
      page: 124
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BA04]"}
    - code: "[BA05]"
      name: "Alluvial muck-gley"
      name_native: "Аллювиальные перегнойно-глеевые"
      formula: "H-G-CG~~"
      page: 125
      tests:
