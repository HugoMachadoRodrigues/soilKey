      page: 125
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BA17]"}
      notes: "An agro type: the natural humus or organic horizon stays under the plough layer, its remnant (p. 124); without it the soil is an agrozem (CS). Chapter 6 names the type Аллювиальные агроторфяно-глеевые, with the formula PTR-TR-G-CG~~."
    - code: "[BA18]"
