# The types of the division CS, Агроземы
# (Agrozems): Field Guide of 2008, chapter 4.1.19, pp. 118-120;
# 19 types (0 natural, 19 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 CS..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested, but
#       the rock and substrate slots that name a type are (`test_terminals`).
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# The BH of CS10 is a BHF of either kind (Q15). The fragments of the TUR
# (TUR[SEL+ASN]) are tested, the BCA under them is not (Q14, Q20).
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "CS":
    - code: "[CS01]"
      name: "Agrozems"
      name_native: "Агроземы"
      formula: "P-C"
      page: 118
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS01]"}
    - code: "[CS02]"
      name: "Dark agrozems"
      name_native: "Агроземы темные"
      formula: "PU-C"
      page: 118
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS02]"}
    - code: "[CS03]"
      name: "Dark gley agrozems"
      name_native: "Агроземы темные глеевые"
      formula: "PU-G-CG"
      page: 118
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS03]"}
    - code: "[CS04]"
      name: "Dark quasigley agrozems"
      name_native: "Агроземы темные квазиглеевые"
      formula: "PU-Q-CQ"
      page: 118
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS04]"}
    - code: "[CS05]"
      name: "Peat agrozems"
      name_native: "Агроземы торфяные"
      formula: "PT-C"
      page: 118
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS05]"}
    - code: "[CS06]"
      name: "Peat-mineral agrozems"
      name_native: "Агроземы торфяно-минеральные"
      formula: "PTR-C"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS06]"}
    - code: "[CS07]"
      name: "Texture-differentiated agrozems"
      name_native: "Агроземы текстурно-дифференцированные"
      formula: "P-BT-C"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS07]"}
    - code: "[CS08]"
      name: "Gley texture-differentiated agrozems"
      name_native: "Агроземы текстурно-дифференцированные глеевые"
      formula: "P-BT-G-CG"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS08]"}
    - code: "[CS09]"
      name: "Al-Fe-humus agrozems"
      name_native: "Агроземы альфегумусовые"
      formula: "P-BHF-C"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS09]"}
    - code: "[CS10]"
      name: "Gley Al-Fe-humus agrozems"
      name_native: "Агроземы альфегумусовые глеевые"
      formula: "P-BH-G-CG"
      page: 119
      near_identity: {BH: ["BHF"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS10]"}
      notes: "The illuvial horizon of the gley types is often a BH: a BHF of either kind (BH, BF or neither) fills the slot, and the kind names the subtype (Hugo's decision Q15)."
    - code: "[CS11]"
      name: "Structural-metamorphic agrozems"
      name_native: "Агроземы структурно-метаморфические"
      formula: "P-BM-C"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS11]"}
    - code: "[CS12]"
      name: "Dark structural-metamorphic agrozems"
      name_native: "Агроземы структурно-метаморфические темные"
      formula: "PU-BM-C"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS12]"}
    - code: "[CS13]"
      name: "Dark clay-illuvial agrozems"
      name_native: "Агроземы темные глинисто-иллювиальные"
      formula: "PU-BI-C"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS13]"}
    - code: "[CS14]"
      name: "Dark accumulative-carbonate agrozems"
      name_native: "Агроземы темные аккумулятивно-карбонатные"
      formula: "PU-BCA-Cca"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS14]"}
    - code: "[CS15]"
      name: "Texture-carbonate agrozems"
      name_native: "Агроземы текстурно-карбонатные"
      formula: "P-CAT-Cca"
      page: 119
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS15]"}
    - code: "[CS16]"
      name: "Dark solonetzic agrozems"
      name_native: "Агроземы солонцовые темные"
      formula: "PU-TUR[SEL+ASN]-BCAs,cs-Cca,s"
      page: 119
      optional: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS16]"}
      notes: "The BCA under the solonetz horizon (BCAs,cs) is not tested: optional, as the parent material is (Hugo's decision Q14). The fragments of the TUR, in brackets, are tested: from the notation or turbated_fragments; with neither, undecided when the TUR has an ESP of 15 % or more, else not these fragments (Hugo's decision Q20 and of 2026-11-02)."
    - code: "[CS17]"
      name: "Light solonetzic agrozems"
      name_native: "Агроземы солонцовые светлые"
      formula: "P-TUR[SEL+BSN]-BCAs,cs-Cca,s"
      page: 119
      optional: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS17]"}
      notes: "The BCA under the solonetz horizon (BCAs,cs) is not tested: optional, as the parent material is (Hugo's decision Q14). The fragments of the TUR, in brackets, are tested: from the notation or turbated_fragments; with neither, undecided when the TUR has an ESP of 15 % or more, else not these fragments (Hugo's decision Q20 and of 2026-11-02)."
    - code: "[CS18]"
      name: "Dark quasigley solonetzic agrozems"
      name_native: "Агроземы солонцовые темные квазиглеевые"
      formula: "PU-TUR[SEL+ASN]-BCAs,cs-Qs-CQca,s"
      page: 119
      optional: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS18]"}
      notes: "The BCA under the solonetz horizon (BCAs,cs) is not tested: optional, as the parent material is (Hugo's decision Q14). The fragments of the TUR, in brackets, are tested: from the notation or turbated_fragments; with neither, undecided when the TUR has an ESP of 15 % or more, else not these fragments (Hugo's decision Q20 and of 2026-11-02)."
    - code: "[CS19]"
      name: "Light quasigley solonetzic agrozems"
      name_native: "Агроземы солонцовые светлые квазиглеевые"
      formula: "P-TUR[SEL+BSN]-BCAs,cs-Qs-CQca,s"
      page: 119
      optional: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CS19]"}
      notes: "The BCA under the solonetz horizon (BCAs,cs) is not tested: optional, as the parent material is (Hugo's decision Q14). The fragments of the TUR, in brackets, are tested: from the notation or turbated_fragments; with neither, undecided when the TUR has an ESP of 15 % or more, else not these fragments (Hugo's decision Q20 and of 2026-11-02)."
