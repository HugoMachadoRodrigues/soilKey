# The types of the division CR, Агроабраземы
# (Agroabrazems): Field Guide of 2008, chapter 4.1.18, pp. 115-118;
# 13 types (0 natural, 13 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 CR..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested, but
#       the rock and substrate slots that name a type are (`test_terminals`).
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# A BT under PB is read as BI (CR04, CR05), and the BH of CR07 is a BHF of
# either kind (Hugo's decision Q15). A BCA under another middle horizon is
# ignored where the formula does not write it (`ignore`; Hugo, 2026-11-02).
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "CR":
    - code: "[CR01]"
      name: "Agroabrazems"
      name_native: "Агроабраземы"
      formula: "PB-C"
      page: 116
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR01]"}
    - code: "[CR02]"
      name: "Gley agroabrazems"
      name_native: "Агроабраземы глеевые"
      formula: "PB-G-CG"
      page: 116
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR02]"}
    - code: "[CR03]"
      name: "Quasigley agroabrazems"
      name_native: "Агроабраземы квазиглеевые"
      formula: "PB-Q-CQ"
      page: 116
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR03]"}
    - code: "[CR04]"
      name: "Clay-illuvial agroabrazems"
      name_native: "Агроабраземы глинисто-иллювиальные"
      formula: "PB-BI-C(ca)"
      page: 116
      ignore: ["BCA"]
      near_identity: {BI: ["BT"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR04]"}
      notes: "A BT is read as BI in this formula: exposed, under PB or under TUR (Hugo's decision Q15 and of 2026-11-02). A BCA under the middle horizon neither blocks this formula nor is required by it, as in the structure-metamorphic soils (p. 85; Hugo, 2026-11-02); the formulas that write BCA name the type where they match."
    - code: "[CR05]"
      name: "Gley clay-illuvial agroabrazems"
      name_native: "Агроабраземы глинисто-иллювиальные глеевые"
      formula: "PB-BI-G-CG"
      page: 116
      ignore: ["BCA"]
      near_identity: {BI: ["BT"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR05]"}
      notes: "A BT is read as BI in this formula: exposed, under PB or under TUR (Hugo's decision Q15 and of 2026-11-02). A BCA under the middle horizon neither blocks this formula nor is required by it, as in the structure-metamorphic soils (p. 85; Hugo, 2026-11-02); the formulas that write BCA name the type where they match."
    - code: "[CR06]"
      name: "Al-Fe-humus agroabrazems"
      name_native: "Агроабраземы альфегумусовые"
      formula: "PB-BHF-C"
      page: 116
      ignore: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR06]"}
      notes: "A BCA under the middle horizon neither blocks this formula nor is required by it, as in the structure-metamorphic soils (p. 85; Hugo, 2026-11-02); the formulas that write BCA name the type where they match."
    - code: "[CR07]"
      name: "Gley Al-Fe-humus agroabrazems"
      name_native: "Агроабраземы альфегумусовые глеевые"
      formula: "PB-BH-G-CG"
      page: 116
      ignore: ["BCA"]
      near_identity: {BH: ["BHF"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR07]"}
      notes: "The illuvial horizon of the gley types is often a BH: a BHF of either kind (BH, BF or neither) fills the slot, and the kind names the subtype (Hugo's decision Q15). A BCA under the middle horizon neither blocks this formula nor is required by it, as in the structure-metamorphic soils (p. 85; Hugo, 2026-11-02); the formulas that write BCA name the type where they match."
    - code: "[CR08]"
      name: "Structural-metamorphic agroabrazems"
      name_native: "Агроабраземы структурно-метаморфические"
      formula: "PB-BM-C"
      page: 116
      ignore: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR08]"}
      notes: "A BCA under the middle horizon neither blocks this formula nor is required by it, as in the structure-metamorphic soils (p. 85; Hugo, 2026-11-02); the formulas that write BCA name the type where they match."
    - code: "[CR09]"
      name: "Structural-metamorphic accumulative-carbonate agroabrazems"
      name_native: "Агроабраземы структурно-метаморфические аккумулятивно-карбонатные"
      formula: "PB-BM-BCA-Cca"
      page: 117
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR09]"}
    - code: "[CR10]"
      name: "Accumulative-carbonate agroabrazems"
      name_native: "Агроабраземы аккумулятивно-карбонатные"
      formula: "PB-BCA-Cca"
      page: 117
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR10]"}
    - code: "[CR11]"
      name: "Quasigley accumulative-carbonate agroabrazems"
      name_native: "Агроабраземы аккумулятивно-карбонатные квазиглеевые"
      formula: "PB-BCA-Q-CQ"
      page: 117
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR11]"}
    - code: "[CR12]"
      name: "Texture-carbonate agroabrazems"
      name_native: "Агроабраземы текстурно-карбонатные"
      formula: "PB-CAT-Cca"
      page: 117
      ignore: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR12]"}
      notes: "A BCA under the middle horizon neither blocks this formula nor is required by it, as in the structure-metamorphic soils (p. 85; Hugo, 2026-11-02); the formulas that write BCA name the type where they match."
    - code: "[CR13]"
      name: "Quasigley texture-carbonate agroabrazems"
      name_native: "Агроабраземы текстурно-карбонатные квазиглеевые"
      formula: "PB-CAT-Q-CQ"
      page: 117
      ignore: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CR13]"}
      notes: "A BCA under the middle horizon neither blocks this formula nor is required by it, as in the structure-metamorphic soils (p. 85; Hugo, 2026-11-02); the formulas that write BCA name the type where they match."
