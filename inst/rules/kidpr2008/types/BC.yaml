# The types of the division BC, Стратоземы
# (Stratozems): Field Guide of 2008, chapter 4.2.3, pp. 128-129;
# 10 types (6 natural, 4 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 BC..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested, but
#       the rock and substrate slots that name a type are (`test_terminals`).
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# The buried soil [ABC] names the types on a buried soil and is tested, a
# buried profile starting within 100 cm (p. 128; Hugo's decision Q14); the
# substrate D is not tested. P and PU count only over the stratified
# horizons (Hugo, 2026-11-02).
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "BC":
    - code: "[BC01]"
      name: "Grey-humus stratozems"
      name_native: "Стратоземы серогумусовые"
      formula: "RY-D"
      page: 129
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC01]"}
    - code: "[BC02]"
      name: "Dark-humus stratozems"
      name_native: "Стратоземы темногумусовые"
      formula: "RU-D"
      page: 129
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC02]"}
    - code: "[BC03]"
      name: "Light-humus stratozems"
      name_native: "Стратоземы светлогумусовые"
      formula: "RJ-D"
      page: 129
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC03]"}
    - code: "[BC04]"
      name: "Grey-humus stratozems on a buried soil"
      name_native: "Стратоземы серогумусовые на погребенной почве"
      formula: "RY-[ABC]"
      page: 129
      test_terminals: ["[ABC]"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC04]"}
      notes: "The buried soil is tested: a buried profile starting within 100 cm (p. 128; Hugo's decision Q14)."
    - code: "[BC05]"
      name: "Dark-humus stratozems on a buried soil"
      name_native: "Стратоземы темногумусовые на погребенной почве"
      formula: "RU-[ABC]"
      page: 129
      test_terminals: ["[ABC]"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC05]"}
      notes: "The buried soil is tested: a buried profile starting within 100 cm (p. 128; Hugo's decision Q14)."
    - code: "[BC06]"
      name: "Light-humus stratozems on a buried soil"
      name_native: "Стратоземы светлогумусовые на погребенной почве"
      formula: "RJ-[ABC]"
      page: 129
      test_terminals: ["[ABC]"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC06]"}
      notes: "The buried soil is tested: a buried profile starting within 100 cm (p. 128; Hugo's decision Q14)."
    - code: "[BC07]"
      name: "Humus agrostratozems"
      name_native: "Агростратоземы гумусовые"
      formula: "P-RY(RJ)-D"
      page: 129
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC07]"}
      notes: "RY(RJ): the stratified horizon under the plough is RY or RJ."
    - code: "[BC08]"
      name: "Dark-humus agrostratozems"
      name_native: "Агростратоземы темногумусовые"
      formula: "PU-RU-D"
      page: 129
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC08]"}
    - code: "[BC09]"
      name: "Humus agrostratozems on a buried soil"
      name_native: "Агростратоземы гумусовые на погребенной почве"
      formula: "P-RY(RJ)-[ABC]"
      page: 129
      test_terminals: ["[ABC]"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC09]"}
      notes: "The buried soil is tested: a buried profile starting within 100 cm (p. 128; Hugo's decision Q14). RY(RJ): the stratified horizon under the plough is RY or RJ."
    - code: "[BC10]"
      name: "Dark-humus agrostratozems on a buried soil"
      name_native: "Агростратоземы темногумусовые на погребенной почве"
      formula: "PU-RU-[ABC]"
      page: 129
      test_terminals: ["[ABC]"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BC10]"}
      notes: "The buried soil is tested: a buried profile starting within 100 cm (p. 128; Hugo's decision Q14)."
