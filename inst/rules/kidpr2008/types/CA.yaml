# The types of the division CA, Текстурно-дифференцированные почвы
# (Texture-differentiated soils): Field Guide of 2008, chapter 4.1.1, pp. 76-80;
# 27 types (15 natural, 12 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 CA..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested.
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# BEL closes only the formulas where it is diagnostic (CA07, CA08, CA11, CA20,
# CA21, CD09; p. 44); `ignore` lists it on the formulas of CA and CD that do
# not write it, where a BEL neither blocks the formula nor is required by it,
# and BCA on the formulas of CD that do not write it (p. 85). In CB and CE an
# EL counts as an eluvial horizon with E (p. 43). (Hugo, 2026-11-02.)
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "CA":
    - code: "[CA01]"
      name: "Podzolic"
      name_native: "Подзолистые"
      formula: "O-EL-BEL-BT-C"
      page: 78
      optional: ["BEL"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CA01]"}
      notes: "BEL optional: it is the diagnostic eluvial horizon only in CA07, CA08, CA11, CA20, CA21 and CD09 (p. 44; Hugo's decision Q14)."
