# The types of the division CH, Глеевые почвы
# (Gley soils): Field Guide of 2008, chapter 4.1.8, pp. 92-93;
# 9 types (5 natural, 4 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 CH..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested.
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# BEL closes only the formulas where it is diagnostic (CA07, CA08, CA11, CA20,
# CA21, CD09; p. 44); `ignore` lists it on the formulas of CA and CD that do
# not write it, where a BEL neither blocks the formula nor is required by it
# (Hugo, 2026-11-02).
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "CH":
    - code: "[CH01]"
      name: "Gleyzems"
      name_native: "Глееземы"
      formula: "O-G-CG"
      page: 92
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH01]"}
    - code: "[CH02]"
      name: "Cryometamorphic gleyzems"
      name_native: "Глееземы криометаморфические"
      formula: "O-G-CRM-C(g)"
      page: 92
      near_identity: {O: ["T", "TO", "TE", "H"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH02]"}
      notes: "O, T or H over G-CRM, all of which key step C.17а sends to the gley soils; AU over G-CRM has no type (Hugo's decision Q15)."
    - code: "[CH03]"
      name: "Peaty gleyzems"
      name_native: "Торфяно-глееземы"
      formula: "T-G-CG"
      page: 92
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH03]"}
    - code: "[CH04]"
      name: "Dark-humus gley"
      name_native: "Темногумусово-глеевые"
      formula: "AU-G-CG(ca)"
      page: 92
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH04]"}
    - code: "[CH05]"
      name: "Muck-gley"
      name_native: "Перегнойно-глеевые"
      formula: "H-G-CG"
      page: 92
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH05]"}
    - code: "[CH06]"
      name: "Agro-cryometamorphic gleyzems"
      name_native: "Агроглееземы криометаморфические"
      formula: "P-G-CRM-C(g)"
      page: 92
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH06]"}
    - code: "[CH07]"
      name: "Agro-peaty gleyzems"
      name_native: "Агроторфяно-глееземы"
      formula: "PT-T-G-CG"
      page: 92
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH07]"}
    - code: "[CH08]"
      name: "Agro-dark-humus gley"
      name_native: "Агротемногумусовые глеевые"
      formula: "PU-AU-G-CG"
      page: 92
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH08]"}
    - code: "[CH09]"
      name: "Agro-dark-humus muck-gley"
      name_native: "Агротемногумусовые перегнойно-глеевые"
      formula: "PU-H-G-CG"
      page: 92
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CH09]"}
