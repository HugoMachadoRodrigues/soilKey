          - type_formula_kidpr: {type: "[CO05]"}
      notes: "The gleyed substrate DG names the type and is tested (Hugo's decision Q14); a G horizon would take the soil out of the division (C.5)."
    - code: "[CO06]"
      name: "Podzol-eluvozems"
      name_native: "Подзол-элювоземы"
      formula: "O-E-D"
      page: 111
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CO06]"}
    - code: "[CO07]"
      name: "Sod-podzol-eluvozems"
      name_native: "Дерново-подзол-элювоземы"
      formula: "AY-E-D"
      page: 111
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CO07]"}
    - code: "[CO08]"
      name: "Gley peat-podzol-eluvozems"
      name_native: "Торфяно-подзол-элювоземы глеевые"
      formula: "T-E-DG"
      page: 111
      test_terminals: ["DG"]
