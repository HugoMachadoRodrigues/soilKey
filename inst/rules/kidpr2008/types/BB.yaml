# The types of the division BB, Вулканические почвы
# (Volcanic soils): Field Guide of 2008, chapter 4.2.2, pp. 126-128;
# 4 types (3 natural, 1 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 BB..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested, but
#       the rock and substrate slots that name a type are (`test_terminals`).
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# The ash mark of the parent material (C") and the buried profiles {ABC}
# are not tested (Hugo's decision Q14). The BH of BB01 and BB03 is a BHF of
# either kind, as the notation reads BH and BF (Hugo, 2026-11-02).
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "BB":
    - code: "[BB01]"
      name: "Ochric"
      name_native: "Охристые"
      formula: "AO-BH-BAN-C\"-{ABC}-{ABC}"
      page: 127
      near_identity: {BH: ["BHF"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BB01]"}
      notes: "The illuvial-humus BH, a modification of BHF (p. 126): the notation reads BH and BF as BHF, so a BHF of either kind fills the slot, as in CR07 and CS10, and its kind names the subtype (BF, light-ochric, p. 127) (Hugo, 2026-11-02)."
    - code: "[BB02]"
      name: "Muck-ochric"
      name_native: "Перегнойно-охристые"
      formula: "H-BAN-C\"-{ABC}-{ABC}"
      page: 127
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BB02]"}
    - code: "[BB03]"
      name: "Ochric-podzolic"
      name_native: "Охристо-подзолистые"
      formula: "AO-E-BH-BAN-C\"-{ABC}"
      page: 127
      near_identity: {BH: ["BHF"]}
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BB03]"}
      notes: "The illuvial-humus BH, a modification of BHF (p. 126): the notation reads BH and BF as BHF, so a BHF of either kind fills the slot, as in CR07 and CS10, and its kind names the subtype (BF, light-ochric, p. 127) (Hugo, 2026-11-02)."
    - code: "[BB04]"
      name: "Agro-ochric"
      name_native: "Агроохристые"
      formula: "P-BAN-C\"-{ABC}-{ABC}"
      page: 127
      tests:
        all_of:
          - type_formula_kidpr: {type: "[BB04]"}
