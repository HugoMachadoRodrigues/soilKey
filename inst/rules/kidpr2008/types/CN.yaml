# The types of the division CN, Органо-аккумулятивные почвы
# (Organo-accumulative soils): Field Guide of 2008, chapter 4.1.14, pp. 108-110;
# 9 types (7 natural, 2 agro).
#
# Each type is the formula of its profile, transcribed from the drawings of
# chapter 4 as in tests/testthat/fixtures/kidpr2008-formulas.tsv (rows "ch4 CN..").
# The code is soilKey's, in brackets, in the order of chapter 4 (the natural
# types, then the agro types); `name` is soilKey's English gloss and
# `name_native` the Russian name as printed. type_formula_kidpr() matches the
# profile against every formula of the division (R/types-kidpr.R), under
# Hugo's decisions of 2026-11-02:
#   Q13 closed on the division: a horizon some formula of the division writes
#       must be in the type's formula when it is in the profile; a horizon
#       foreign to the division is ignored. The types are tried most specific
#       first, agro before natural; a second match is an intergrade.
#   Q14 a horizon in parentheses is optional (`optional` lists the horizons
#       written without parentheses that are optional too); the g and q marks
#       are expected, not required; the parent material is not tested, but
#       the rock and substrate slots that name a type are (`test_terminals`).
#   Q15 no formula matches: the division stays, the type is unassigned, with
#       the nearest formulas; `near_identity` lists the other horizons a
#       written one stands for.
# The peat T of every formula also takes TO and TE (Hugo, 2026-11-02).

types:
  "CN":
    - code: "[CN01]"
      name: "Grey-humus (sod)"
      name_native: "Серогумусовые"
      formula: "AY-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN01]"}
    - code: "[CN02]"
      name: "Dark-humus"
      name_native: "Темногумусовые"
      formula: "AU-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN02]"}
    - code: "[CN03]"
      name: "Muck"
      name_native: "Перегнойные"
      formula: "H-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN03]"}
    - code: "[CN04]"
      name: "Muck-dark-humus"
      name_native: "Перегнойно-темногумусовые"
      formula: "AH-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN04]"}
    - code: "[CN05]"
      name: "Cryo-humus"
      name_native: "Криогумусовые"
      formula: "AK-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN05]"}
    - code: "[CN06]"
      name: "Coarse-humus"
      name_native: "Грубогумусовые"
      formula: "AO-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN06]"}
    - code: "[CN07]"
      name: "Light-humus"
      name_native: "Светлогумусовые"
      formula: "AJ-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN07]"}
    - code: "[CN08]"
      name: "Agro-humus"
      name_native: "Агрогумусовые"
      formula: "P-AY-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN08]"}
    - code: "[CN09]"
      name: "Agro-dark-humus"
      name_native: "Агротемногумусовые"
      formula: "PU-AU-C"
      page: 109
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CN09]"}
