      page: 114
      optional: ["BCA"]
      tests:
        all_of:
          - type_formula_kidpr: {type: "[CQ09]"}
      notes: "The BCA under the solonetz horizon (BCAs,cs) is not tested: optional, as the parent material is (Hugo's decision Q14)."
    - code: "[CQ10]"
