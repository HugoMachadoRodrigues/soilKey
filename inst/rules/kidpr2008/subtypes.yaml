# The subtypes of the Russian soil classification, Field Guide of 2008
# (Полевой определитель почв России): the 26 lists of chapter 4, one per
# division (the chemozems CU have none), 558 entries in the order of the
# book. A soil is named by its type and every subtype of its division's
# list that passes, in the order of the list, comma-separated, in the plural
# as printed ("Подзолистые глееватые, языковатые"); typical ([типичные],
# soilKey's code-less default: the book leaves the typical subtype out of
# the lists, p. 76) when every entry is FALSE; provisional, with the
# undecided entries listed, when some are NA. A feature already written in
# the formula of the type is not named again (Hugo's decision Q16,
# 2026-11-02). Read by R/key-kidpr2008.R through the feature tests of
# R/diagnostics-kidpr-features.R (.kidpr_features()).
#
# key          soilKey's ASCII code of the entry, from the book's index (g,
#              ELf, hh for [hh], e_hf for [e-hf], akl for AJ[akl], cryoturb
#              for @, perm for the permafrost sign, TTal for TT~~, TTash for
#              TT"; AUel and Hmr where a list prints one index twice)
# index        the index as printed (homoglyphs read as Latin letters; the
#              permafrost sign, lost in the text layer, from the page)
# name         the Russian name as printed, in the plural (misprints
#              corrected, the printed form in `printed`)
# name_en      soilKey's English gloss
# feature      the feature or host form the dispatcher reads when it is not
#              the index (the double el of CI and CM by place)
# test         a test of its own, for an entry that is no feature of 3.2
#              (layered_ochric: [BHF-BAN]>3 of the volcanic soils)
# hosts        the horizons the feature is read on (the hosts of
#              feature_tests.yaml, or of the host form; groups: humus,
#              organic, peat, agro, eluvial, middle, hydrogenic,
#              halomorphic, parent, mineral, any; profile for the features
#              of the whole profile)
# host, place  where the list narrows the hosts of the feature (place: one
#              or several, the entry named where it holds at one)
# except       horizons left out of the feature's hosts (g where the list
#              has ELg)
# only_types   the type a sentence of 3.2 names for the subtype (Q16: the
#              list decides where a feature applies; a sentence of 3.2
#              restricts it only when it names a single type)
# scale        carbonate: the subtypes of the carbonate profile, one of the
#              scale (default 19 of the questions)
# universal    the universal subtypes of the list
# page         printed page
# The criteria are not reproduced: they are in the Field Guide.

edition: "Polevoi opredelitel' pochv Rossii (Dokuchaev Soil Science Institute, Moscow, 2008), chapter 4"

typical:
  name: "[типичные]"
  name_en: "[typical]"

# A feature is in the formula of a type when the formula writes it on a
# horizon (BELg, BCAs,cs, C⊥; a host form on its host: ELg; BF and BH as the
# modification of BHF), or writes the horizon that is the feature in full:
# G of g, Q of q, V of v, ML of ml, S of s, F of fn, and CR, the
# cryoturbated horizon of the cryozems, of @ (Q16).
in_full:
  G: g
  Q: q
  V: v
  ML: ml
  S: s
  F: fn
  CR: "@"

lists:
  # --- AA, Торфяные почвы: 15 subtypes, p. 132-133 ---
  AA:
    - {key: TEmr, index: TEmr, name: "Иловато-торфяные", name_en: "silty-peaty", hosts: [TE], page: 132}
    - {key: Tote, index: Tote, name: "Остаточно-эутрофные", name_en: "residual-eutrophic", hosts: [TO], only_types: ["[AA01]"], page: 132,
       notes: "te: 3.2 names the type of the oligotrophic peat soils (Торфяные олиготрофные, p. 61). A sentence of 3.2 that names a single type restricts the subtype to it (Q16)."}
    - {key: Th, index: Th, name: "Перегнойно-торфяные", name_en: "muck-peaty", hosts: [T, TO, TE], host: [T, TO, TE], page: 132,
       notes: "The T of Th takes the oligotrophic and eutrophic peats TO and TE, as the T of the formulas does."}
    - {key: fn, index: fn, name: "Оруденелые", name_en: "ore-bearing", hosts: [G, BHF], page: 132}
    - {key: ox, index: ox, name: "Окисленно-глеевые", printed: "Окислено-глеевые", name_en: "oxidised-gley", hosts: [G], page: 132,
       notes: "Printed \"Окислено-глеевые\" (a misprint)."}
    - {key: md, index: md, name: "Деструктивные", name_en: destructive, hosts: [T, TO, TE, PT], page: 132}
    - {key: pir, index: pir, name: "Пирогенные", name_en: pyrogenic, hosts: [peat], page: 132}
    - {key: TTal, index: "TT~~", name: "Аллювиально-слоистые", name_en: "alluvial-layered", hosts: [profile], page: 132}
    - {key: TTash, index: "TT\"", name: "Пеплово-слоистые", name_en: "ash-layered", hosts: [profile], page: 132}
    - {key: r, index: r, name: "Стратифицированные", name_en: stratified, hosts: [profile], universal: true, page: 133}
    - {key: rh, index: rh, name: "Гумусово-стратифицированные", name_en: "humus-stratified", hosts: [profile], universal: true, page: 133}
    - {key: ur, index: ur, name: "Урбистратифицированные", name_en: "urbi-stratified", hosts: [profile], universal: true, page: 133}
    - {key: rr, index: rr, name: "Артистратифицированные", name_en: "arti-stratified", hosts: [profile], universal: true, page: 133}
    - {key: rx, index: rx, name: "Токсистратифицированные", name_en: "toxi-stratified", hosts: [profile], universal: true, page: 133}
    - {key: x, index: x, name: "Химически загрязненные", name_en: "chemically contaminated", hosts: [profile], universal: true, page: 133}
  # --- AB, Торфоземы: 10 subtypes, p. 133 ---
  AB:
    - {key: mr, index: mr, name: "Минерально-торфяные", name_en: "mineral-peaty", hosts: [T, TO, TE, TJ, PT], host: [T, TO, TE, TJ, PT], page: 133,
       notes: "mr in the peat: the mineral-peaty subtype (3.2, p. 61)."}
    - {key: ox, index: ox, name: "Окисленно-глеевые", printed: "Окислено-глеевые", name_en: "oxidised-gley", hosts: [G], page: 133,
       notes: "Printed \"Окислено-глеевые\" (a misprint)."}
    - {key: TTal, index: "TT~~", name: "Аллювиально-слоистые", name_en: "alluvial-layered", hosts: [profile], page: 133}
    - {key: TTash, index: "TT\"", name: "Пеплово-слоистые", name_en: "ash-layered", hosts: [profile], page: 133}
    - {key: r, index: r, name: "Стратифицированные", name_en: stratified, hosts: [profile], universal: true, page: 133}
    - {key: rh, index: rh, name: "Гумусово-стратифицированные", name_en: "humus-stratified", hosts: [profile], universal: true, page: 133}
    - {key: ur, index: ur, name: "Урбистратифицированные", name_en: "urbi-stratified", hosts: [profile], universal: true, page: 133}
    - {key: rr, index: rr, name: "Артистратифицированные", name_en: "arti-stratified", hosts: [profile], universal: true, page: 133}
    - {key: rx, index: rx, name: "Токсистратифицированные", name_en: "toxi-stratified", hosts: [profile], universal: true, page: 133}
    - {key: x, index: x, name: "Химически загрязненные", name_en: "chemically contaminated", hosts: [profile], universal: true, page: 133}
  # --- BA, Аллювиальные почвы: 22 subtypes, p. 125-126 ---
  BA:
    - {key: Hmr, index: mr, name: "Иловато-перегнойные", name_en: "silty-muck", hosts: [H], host: [H], page: 125,
       notes: "mr in the muck H: the silty-muck subtype (3.2, p. 61)."}
    - {key: mr, index: mr, name: "Минерально-торфяные", printed: "Минерально- торфяные", name_en: "mineral-peaty", hosts: [T, TO, TE, TJ, PT], host: [T, TO, TE, TJ, PT], page: 125,
       notes: "mr in the peat: the mineral-peaty subtype (3.2, p. 61). Printed \"Минерально- торфяные\" (a misprint)."}
    - {key: el, index: el, name: "Элювиированные", name_en: eluviated, hosts: [AY, AJ, AU, AH, AK, D, G], page: 125}
    - {key: sn, index: sn, name: "Солонцеватые", name_en: solonetzic, hosts: [humus, agro, middle], page: 125}
    - {key: v, index: v, name: "Слитизированные", name_en: vertic, hosts: [mineral], page: 125}
    - {key: g, index: g, name: "Глееватые", name_en: gleyic, hosts: [mineral], page: 126}
    - {key: q, index: q, name: "Квазиглееватые", name_en: "quasi-gleyic", hosts: [mineral], page: 126}
    - {key: ml, index: ml, name: "Омергеленные", name_en: marly, hosts: [mineral], page: 126}
    - {key: s, index: s, name: "Засоленные", name_en: saline, hosts: [any], page: 126}
    - {key: ff, index: ff, name: "Псевдофибровые", name_en: "pseudo-fibrous", hosts: [BHF, C], page: 126}
    - {key: fn, index: fn, name: "Оруденелые", name_en: "ore-bearing", hosts: [G, BHF], page: 126}
    - {key: ox, index: ox, name: "Окисленно-глеевые", name_en: "oxidised-gley", hosts: [G], page: 126}
    - {key: hi, index: hi, name: "Потечно-гумусовые", name_en: "humus-streaked", hosts: [organic], page: 126}
    - {key: cs, index: cs, name: "Гипс-содержащие", name_en: "gypsum-bearing", hosts: [any], page: 126}
    - {key: tr, index: tr, name: "Поверхностно-турбированные", name_en: "surface-turbated", hosts: [any], page: 126}
    - {key: ad, index: ad, name: "Агропереуплотненные", name_en: "agro-over-compacted", hosts: [agro], page: 126}
    - {key: pa, index: pa, name: "Постагрогенные", name_en: "post-agrogenic", hosts: [agro, AU, AY, EL], page: 126}
    - {key: w, index: w, name: "Реградированные", name_en: regraded, hosts: [P, PU, PB, BT, BI, BM, BMK, BHF, BFM, BCA, CAT, ASN, BSN], page: 126}
    - {key: ur, index: ur, name: "Урбистратифицированные", name_en: "urbi-stratified", hosts: [profile], universal: true, page: 126}
    - {key: rr, index: rr, name: "Артистратифицированные", name_en: "arti-stratified", hosts: [profile], universal: true, page: 126}
    - {key: rx, index: rx, name: "Токсистратифицированные", name_en: "toxi-stratified", hosts: [profile], universal: true, page: 126}
    - {key: x, index: x, name: "Химически загрязненные", name_en: "chemically contaminated", hosts: [profile], universal: true, page: 126}
  # --- BB, Вулканические почвы: 12 subtypes, p. 127-128 ---
  BB:
    - {key: e, index: e, name: "Оподзоленные", name_en: podzolised, hosts: [humus, organic, middle], page: 127}
    - {key: BF, index: BF, name: "Светло-охристые", name_en: "light-ochric", hosts: [BHF], page: 127}
    - {key: BHF_BAN3, index: "[BHF-BAN]>3", name: "Слоисто-охристые", name_en: "layered-ochric", test: layered_ochric, hosts: [BHF, BAN], page: 128,
       notes: "More than three elementary profiles (BHF and BAN) buried in the ash (p. 127): counted on the profile."}
    - {key: tr, index: tr, name: "Поверхностно-турбированные", name_en: "surface-turbated", hosts: [any], page: 128}
    - {key: ag, index: ag, name: "Агрогетерогенные", name_en: "agro-heterogeneous", hosts: [agro], page: 128}
    - {key: pb, index: pb, name: "Абрадированные", name_en: abraded, hosts: [agro], universal: true, page: 128}
    - {key: r, index: r, name: "Стратифицированные", name_en: stratified, hosts: [profile], universal: true, page: 128}
    - {key: rh, index: rh, name: "Гумусово-стратифицированные", name_en: "humus-stratified", hosts: [profile], universal: true, page: 128}
    - {key: ur, index: ur, name: "Урбистратифицированные", name_en: "urbi-stratified", hosts: [profile], universal: true, page: 128}
    - {key: rr, index: rr, name: "Артистратифицированные", name_en: "arti-stratified", hosts: [profile], universal: true, page: 128}
    - {key: rx, index: rx, name: "Токсистратифицированные", name_en: "toxi-stratified", hosts: [profile], universal: true, page: 128}
    - {key: x, index: x, name: "Химически загрязненные", name_en: "chemically contaminated", hosts: [profile], universal: true, page: 128}
  # --- BC, Стратоземы: 14 subtypes, p. 129 ---
  BC:
    - {key: g, index: g, name: "Глееватые", name_en: gleyic, hosts: [mineral], page: 129}
    - {key: q, index: q, name: "Квазиглееватые", name_en: "quasi-gleyic", hosts: [mineral], page: 129}
    - {key: s, index: s, name: "Засоленные", name_en: saline, hosts: [any], page: 129}
    - {key: cs, index: cs, name: "Гипс-содержащие", name_en: "gypsum-bearing", hosts: [any], page: 129}
    - {key: ad, index: ad, name: "Агропереуплотненные", name_en: "agro-over-compacted", hosts: [agro], page: 129}
    - {key: pa, index: pa, name: "Постагрогенные", name_en: "post-agrogenic", hosts: [agro, AU, AY, EL], page: 129}
    - {key: w, index: w, name: "Реградированные", name_en: regraded, hosts: [P, PU, PB, BT, BI, BM, BMK, BHF, BFM, BCA, CAT, ASN, BSN], page: 129}
    - {key: ca, index: ca, name: "Остаточно-карбонатные", name_en: "residual-carbonate", hosts: [any], page: 129}
    - {key: aq, index: aq, name: "Водно-аккумулятивные", name_en: "water-accumulative", hosts: [RU, RY, RJ], page: 129}
    - {key: ael, index: ael, name: "Эолово-аккумулятивные", name_en: "aeolian-accumulative", hosts: [RU, RY, RJ], page: 129}
    - {key: ur, index: ur, name: "Урбистратифицированные", name_en: "urbi-stratified", hosts: [profile], universal: true, page: 129}
    - {key: rr, index: rr, name: "Артистратифицированные", name_en: "arti-stratified", hosts: [profile], universal: true, page: 129}
    - {key: rx, index: rx, name: "Токсистратифицированные", name_en: "toxi-stratified", hosts: [profile], universal: true, page: 129}
    - {key: x, index: x, name: "Химически загрязненные", name_en: "chemically contaminated", hosts: [profile], universal: true, page: 129}
  # --- [DA], Слаборазвитые почвы: 19 subtypes, p. 131 ---
  DA:
    - {key: e, index: e, name: "Оподзоленные", name_en: podzolised, hosts: [humus, organic, middle], page: 131}
    - {key: el, index: el, name: "Элювиированные", name_en: eluviated, hosts: [W], host: [W], page: 131,
       notes: "The weakly developed soils have no humus horizon of the hosts of 3.2 (AY, AU ...): el read on their humus horizon W, by analogy (Q17)."}
    - {key: f, index: f, name: "Ожелезненные", name_en: ferruginated, hosts: [E, EL, C, D, BM, CRM, BPL, CR, G], page: 131}
    - {key: i, index: i, name: "Глинисто-иллювиированные", name_en: "clay-illuviated", hosts: [BM, CRM, C, D, G], page: 131}
    - {key: g, index: g, name: "Глееватые", name_en: gleyic, hosts: [mineral], page: 131}
    - {key: q, index: q, name: "Квазиглееватые", name_en: "quasi-gleyic", hosts: [mineral], page: 131}
    - {key: s, index: s, name: "Засоленные", name_en: saline, hosts: [any], page: 131}
