# Modifications: written in capitals like a horizon, they name a variety of
# one (the reader gives the horizon and the modification).
modifications:
  - code: AV
    of: V
    name_native: "Темнослитой"
    name: "dark vertic"
    key: "16б"
    page: 53
    note: "In the index list and key position 16б only."
  - code: BH
    of: BHF
    name_native: "Иллювиально-гумусовый"
    name: "illuvial-humus (coffee-coloured BHF)"
    key: "57"
    page: 62
    note: "Chapter 3 lists it among the features (3.2.1), written in capitals."
  - code: BF
    of: BHF
    name_native: "Иллювиально-железистый"
    name: "illuvial-iron (ochre BHF)"
    key: "57"
    page: 62
    note: "Chapter 3 lists it among the features (3.2.1), written in capitals."

# Other spellings of a horizon index, read as the canonical code.
aliases:
  - code: PC
    reads_as: PB
    note: "Chapter 3 writes PB (PC); chapters 4 and 6 write PB(PC)."

# Rock and parent symbols (3.3, pp. 74-75); not diagnostic horizons.
rock_symbols:
  - code: C
    name_native: "Рыхлая почвообразующая порода"
    name: "loose parent rock"
    page: 74
    flags: [G, Q]
  - code: D
    name_native: "Подстилающая порода"
    name: "underlying rock of contrasting material"
    page: 74
    flags: [G, Q]
  - code: CLM
    name_native: "Рыхлая кора выветривания"
    name: "loose weathering crust (lithomarge, rotten rock)"
    page: 74
  - code: R
    name_native: "Плотная порода"
    name: "hard rock"
    page: 74
  - code: TT
    name_native: "Органогенная порода (торф как порода)"
    name_index: "торф как порода"
    name: "organogenic rock: peat deposit below 50 cm"
    key: "44б | 45б"
    page: 74
  - code: TPO
    written: "ТПО"
    name_native: "Техногенные поверхностные образования"
    name: "technogenic surface formations (not a soil, chapter 8)"
    page: 174

# The rock flags (G or Q after C or D) and the marks of the parent rock's
# genesis and texture (3.3, p. 75).
rock_flags:
  - code: G
    name: "gleyed rock (CG, DG): a feature of the rock, not a G horizon"
  - code: Q
    name: "quasi-gleyed rock (CQ): a feature of the rock, not a Q horizon"
marks:
  - code: "~~"
    name_native: "Аллювиальные слоистые отложения"
    name: "alluvial layered deposits"
  - code: "\""
    name_native: "Пеплово-вулканические слоистые отложения"
    name: "volcanic-ash layered deposits"
    note: "Printed ” or `` in places."
  - code: "^^"
    name_native: "Пролювиальные слоистые отложения"
    name: "proluvial layered deposits"
    note: "The types of trunk D and chapter 6 use ^^ for aeolian deposits."
  - code: "\"\""
    name_native: "Эоловые слоистые отложения"
    name: "aeolian layered deposits"
  - code: "="
    name_native: "Суглинистые и глинистые породы"
    name: "loamy and clayey rocks"
  - code: ".."
    name_native: "Песчаные породы"
    name: "sandy rocks"

# Tokens of chapter 6 only (the 2004 formulas printed beside the 1977 names):
# read, but they give no 2008 horizon by themselves.
legacy:
  - code: PY
    reads_as: P
    page: 141
    note: "Agro horizon of the agro-grey-humus soils in chapter 6 (PY-(EL)-BEL-BT-C, PY-E-BF-C); chapter 4 writes P in the same types (CA17, CA19, CB15, CB16)."
  - code: TR
    reads_as: T
    page: 158
    note: "Chapter 6 writes PTR-TR-G-CG~~ for the alluvial agro-peat soils; chapter 4 writes PTR-T-G-CG~~ (BA17)."
  - code: AKL
    reads_as: AJ
    features: ["[akl]"]
    page: 148
    note: "Chapter 6 writes AKL-BMK-BCA-Cca for the brown arid soils; chapter 4 writes AJ-BM-BCA-Cca (CJ02) and keeps the crust-subcrust microprofile as the subtype AJ[akl]."
  - code: AM
    reads_as: null
    candidates: [BMK, BM]
    page: 148
    note: "Chapter 6 writes AJ-AM-CAT-Cca for the chestnut soils; chapter 4 writes AJ-BMK-BM-CAT-Cca (CJ03). No 2008 horizon by itself."
