# The diagnostic horizons of the Russian soil classification, Field Guide of
# 2008 (Polevoi opredelitel' pochv Rossii, Dokuchaev Soil Science Institute),
# and the other symbols its profile formulas use. Read by the notation reader
# (R/designation-kidpr.R); the horizon key on the data and the registry entry
# come later.
#
# code         the index as printed (Latin capitals; the book itself prints
#              Cyrillic look-alikes in places, which the reader folds)
# name_native  the Russian name of the chapter 3 heading, as printed
# name_index   the name of the index list (pp. 11-12) where it differs
# name         soilKey's English gloss
# group        the chapter 3 group: organic and humus (3.1.1), eluvial
#              (3.1.2), middle (3.1.3), hydrogenic (3.1.4), halomorphic
#              (3.1.5), anthropogenic (3.1.6); rock for the symbols of 3.3
# key          the path of key 2.1 (pp. 12-27) to the horizon, positions and
#              their branches as printed; "|" separates two paths
# page         printed page of the chapter 3 description
# agro         an agro (ploughed) horizon
# overlay      the key identifies it and goes on looking for a second horizon
#              in the same layer (positions 3, 4, 23)
# The criteria are not reproduced: they are in the Field Guide.

edition: "Polevoi opredelitel' pochv Rossii (Dokuchaev Soil Science Institute, Moscow, 2008)"

horizons:
  # --- 3.1.1 surface humus and organic horizons (16) --------------------------
  - code: AY
    name_native: "Серогумусовый (дерновый)"
    name: "grey-humus (sod)"
    group: humus
    key: "12 > 14а > 15б > 17а"
    page: 37
  - code: AJ
    name_native: "Светлогумусовый"
    name: "light-humus"
    group: humus
    key: "15б > 17б > 18а"
    page: 37
  - code: AU
    name_native: "Темногумусовый"
    name: "dark-humus"
    group: humus
    key: "15а > 16а"
    page: 38
  - code: AH
    name_native: "Перегнойно-темногумусовый"
    name: "peaty dark-humus"
    group: humus
    key: "11а > 46в"
    page: 38
    note: "Keys C.2 and C.19 of the divisions write перегнойно-гумусовый."
  - code: AK
