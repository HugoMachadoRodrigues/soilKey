    name: "structural-metamorphic"
    group: middle
    key: "33 > 65б"
    page: 47
  - code: BMK
    name_native: "Ксерометаморфический"
    name: "xero-metamorphic"
    group: middle
    key: "33 > 65а"
    page: 48
  - code: CRM
    name_native: "Криометаморфический"
