    group: middle
    key: "26 > 27б > 28б"
    page: 48
  - code: CR
    name_native: "Криогенный"
    name_index: "Криотурбированный"
    name: "cryogenic"
    group: middle
    key: "26 > 27б > 28а"
    page: 49
  - code: CRH
