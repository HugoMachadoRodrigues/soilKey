# The readings soilKey makes of the Russian Field Guide of 2008 (Полевой
# определитель почв России) where the text is silent or ambiguous. Each entry
# is a decision of the owner, in soilKey's words, ending "(Hugo, 2026-11-02)",
# or a reading of soilKey's where the decisions are silent, ending "(soilKey's
# reading, for Hugo to confirm, 2026-11-02)". Pages are the printed pages of
# the book. The criteria are paraphrased; no text of the book is shipped.
readings:
  - topic: "Scope, levels and names"
    page: "pp. 8-9, 28-30"
    reading: "soilKey keys the trunks (стволы) and divisions (отделы) of the Field Guide, the levels its keys 2.2 and 2.3 give; the types (the profile formulas of chapter 4) and the subtypes (one list of genetic features per division) follow in later releases; genus, species and the lower ranks are not keyed. Four trunks of soils (A organogenic, B synlithogenic, C postlithogenic, D weakly developed) and trunk E, which is not a soil: rock outcrops, technogenic surface formations (ТПО) and deposits that are not humified over a buried soil, reported with a note; the groups of chapter 8 are not keyed (Q1). The codes are the book's (A to E, AA to CU); the division of trunk D, which the book does not code, is [DA], in brackets as a code of soilKey's own. Each class carries an English gloss of soilKey's in name and the Russian of the book in name_native; a division takes the name of its chapter 4 heading, the forms of the index and of the key kept as synonyms (Стратоземы, also Стратифицированные; Щелочно-глинисто-дифференцированные почвы, also Щелочно-текстурно-дифференцированные; Q12). The registry entry is kidpr2008, namespace kidpr, aliases kidpr, russia and ru2008, experimental and opt-in (Q2) (Hugo, 2026-11-02)."
  - topic: "The keys flattened into ordered lists"
    page: "pp. 9, 28-35"
    reading: "The keys are branching trees, not lists. soilKey writes each as a first-match list (key.yaml and divisions/), each class with the path of the book that leads to it, the steps with their Cyrillic letters (C.4а-C.5а-C.6б-C.7а), and keeps a literal walker of the two keys in its tests as the oracle of the lists (Hugo, 2026-11-02)."
  - topic: "Precedence where the steps overlap"
    page: "pp. 32, 34-35, 83, 99, 124"
    reading: "The printed order of the steps and of their alternatives decides: C.7 BFM, BPL, CR, CRM, BMK, then ASN or BSN; C.8 BHF, BT, BM, then the rest. C.19в is tested before C.19а: P with AY and PU with AU are organo-accumulative soils (the types CN08, CN09), not agrozems. C.6б prevails over C.6а when the profile has BFM, BPL, CRM, CR, CRH or BMK, so that P-G-CRM reaches the gley soils (the type CH06). An agro horizon P directly over BFM or BMK makes an agrozem, as the texts of the iron-metamorphic (p. 83) and light-humus carbonate-accumulative (p. 99) divisions say. An agro horizon with no remnant of the natural humus or organic horizon under it, on alluvium, makes an agrozem, not an alluvial soil (p. 124): the gate of the alluvial soils excludes it, trunk B does not take it, and it is keyed in trunk C (Q9) (Hugo, 2026-11-02)."
  - topic: "Gaps of the key repaired"
    page: "pp. 31-35"
    reading: "Only the gaps the book's own types prove are repaired (Q10): AY and AK at C.2 (the lithozems CP05 and CP08); PT and PTR at C.19а (CS05, CS06); AK at C.19в (CN05); a TUR more than 40 cm thick tested at C.6, before C.7, and a TUR at the surface counted at C.4 (CT01, CT02, CT14 to CT17); trunk D takes O with W and an S alone over loose rock (the Солончаки of trunk D, which the key otherwise sends to CL, whose types do not fit them); AY or AO directly over G goes to the gley soils, by the text of the division (G directly under a humus horizon), with no type of its own. Every other combination the key leaves without an exit (C.13 and C.14 have no other answer; AY or AJ over Q; a BT with no eluvial horizon above it at C.9; C.21 to C.23) is not provided by the Field Guide of 2008: the trunk is assigned, the division left unassigned, with a note. Hard rock within 30 cm under none of the horizons of C.2 is a thin layer of loose rock (C.2б), no division (Hugo, 2026-11-02)."
  - topic: "The surface horizon and the positions"
    page: "pp. 31-37, 94"
    reading: "The surface horizon the key reads (C.4, C.10, C.11, C.16, C.19) is the agro horizon when there is one; otherwise, of the organic and humus horizons that start the profile (at the surface, or under a deposit of 40 cm or less), the thickest, the others being features (p. 37); fresh litter is no horizon (p. 36), and a W of 5 cm or less over another horizon is the feature w (Q11). Under an agro horizon the thickest natural horizon is its remnant (P-AY, PU-AU, PT-T). Sub-horizons are merged and transitions and small horizons (e, el, ao, r ...) left out (p. 36); directly over or under reads across them, with up to 15 cm with no diagnostic horizon between AU and BCA (p. 94; Q14). Hard rock (C.1) is measured from the ground, the organic horizons included, so that T-(C)-R and TJ-(C)-R are lithozems. The X of C.3 is a layer starting within 30 cm (Q23) (Hugo, 2026-11-02)."
  - topic: "Truncated soils"
    page: "pp. 35, 114"
    reading: "A middle horizon at the surface (C.20, the abrazems) is read on the profile, as the key does: no organic, humus, agro or eluvial horizon at the surface or under a deposit of 40 cm or less, and the middle horizon first; it counts only when the description starts at 0 cm (or under O or W), otherwise it is undecided, since the top of the soil may not have been described; recorded erosion only supports it (Q19) (Hugo, 2026-11-02)."
  - topic: "Turbated soils"
    page: "pp. 34, 53, 119-121"
    reading: "The turbozems need a TUR more than 40 cm thick; a thinner TUR under P or PU, which the horizon key makes a TUR because its base lies deeper than 40 cm, leaves the soil to C.16, where it fills the solonetzic agrozems CS16 to CS19 (Q20) (Hugo, 2026-11-02)."
  - topic: "Trunk B and the deposit at the surface"
    page: "pp. 28, 30-31, 124-129"
    reading: "Step 7 sends to trunk B only what one of its divisions takes (Q21): a river floodplain recorded (landform or landform element: floodplain, пойма, levee, backswamp ...) with alluvial material (the alluvial mark of the notation, or a fluvial or lacustrine origin of a layer or of the parent material; marine material does not count), the alluvial soils; with no landform, alluvial material that soilKey's fluvic material confirms, and alluvial material alone leaves it undecided; the ochre horizon BAN in volcanic ash, the volcanic soils; a stratified humus body of 40 cm or more, the agro horizons P and PU over it counted with it, the stratozems. Other layering (a two-layered deposit, old alluvium, a lithological discontinuity) stays in trunk C. The deposit of step 2 is the material at the surface that is not a horizon formed in it, over a buried soil, an AY or AU at the top of a floodplain being no deposit; over 40 cm and humified (RJ, RY or RU) the soil is synlithogenic, over 40 cm and not humified it is no soil, of 40 cm or less the soil under it is keyed (Hugo, 2026-11-02)."
  - topic: "The peat body of trunk A"
    page: "pp. 28, 41-43, 132-133"
    reading: "The peat body of step 6 sums the organic layers contiguous from the surface or under a deposit of 40 cm or less: the litter-peat O, the peats T, TO, TE and TJ, the muck H, the agro-peat horizons PT and PTR, and the peat as rock TT below; 51 cm or more makes trunk A. A description that ends in peat before 51 cm leaves it undecided (Q22) (Hugo, 2026-11-02)."
  - topic: "The chemozems"
    page: "pp. 31, 58, 134"
    reading: "The chemozems (CU) are keyed only where the key places them, at C.3б, after the lithozems (CP) and the halomorphic soils (CL): an X horizon, pollutants at the extremely hazardous level (contamination_hazard) in a layer starting within 30 cm; contamination recorded without its category leaves it undecided, and nothing recorded means no X. A contaminated soil of another trunk keeps its division (the subtype x will name it). The name of a chemozem (its pollutants, and the soil it was) comes with the types (Q23) (Hugo, 2026-11-02)."
  - topic: "Inconsistencies of the book"
    page: "pp. 29-35, 76-134"
    reading: "C.2 prints P as грубогумусовый and C.8г and C.13 print CRH as криогумусовый: read as the agro-humus P and the humus-cryometamorphic CRH. Division names differ between the index, the key and chapter 4 (CA -дифференцированные and -дифференцируемые; BC Стратифицированные and Стратоземы; CK Щелочно-текстурно- and Щелочно-глинисто-дифференцированные; CJ and its 2004 name Аккумулятивно-карбонатные малогумусные; CT Турбоземы and Турбированные почвы): the chapter 4 heading is the name, the others synonyms. Page 9 speaks of 28 positions of the key to divisions; the index has 26 codes and the book 27 divisions, the one of trunk D uncoded (Q12) (Hugo, 2026-11-02)."
  - topic: "Gaps the types prove that Q10 does not list"
    page: "pp. 31-32, 93-98, 100-103"
    reading: "V and CRH count among the middle horizons of C.5, which names neither, though C.8г and C.13а do and the types CI04, CI05, CI14 and CI15 (AU-V, AU-CRH, PU-AU-V, PU-AU-CRH) have no other middle horizon; a profile for which C.6 has no answer (an agro horizon P or PU directly over ASN or BSN: the agro-solonetzes CK09 to CK12) goes on to C.7, as if C.6б were the other answer. Without these, the six types would not be reached (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "Readings of the lists and the positions"
    page: "pp. 28-35"
    reading: "The peat T of the key's lists (C.2, C.4, C.11, C.14) includes the oligotrophic and eutrophic peats TO and TE. The agro horizon on BFM or BMK that makes an agrozem is any of P, PU, PT and PTR (the texts say the cultivated soils, the decision names P); PB over them stays where the key sends it. The surface S or SS of C.3 is one in a layer starting within 10 cm (the 0-10 cm of the salts, horizon key 1-2). Present means in the profile, a buried soil left out (an overlay S, X or V counts); above or below (C.9, C.17, C.18, and the horizons under the plough layer at C.6б) anywhere above or below. Step 5 of the trunk key (only O or only W) reads every horizon of the profile, before the thickest-horizon rule, so that O with W is the repair of Q10; C.19 reads them after it. At C.19а the key's P or PU is read as present (the alternatives а and в overlap, which the order of Q9 settles) (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "Readings of the deposit, the floodplain and the ash"
    page: "pp. 28, 30-31, 124-127"
    reading: "The deposit of step 2 is read as the run of layers from the ground made of the stratified humus horizons RJ, RY and RU, the small deposited layers (r, rh, ur, rr, rx) and loose rock, the loose rock counting only when a buried soil or an organic or humus horizon lies under the run (else it is the parent material under the deposit, as the D of RY-D); a buried soil directly under a deposit of 40 cm or less is the soil keyed. A landform recorded as a valley, an alluvial plain or a delta leaves the floodplain undecided; another landform rules it out. Volcanic ash is the ash mark of the notation, an ash, tephra or pyroclastic origin of a layer or of the parent material, or 30 % volcanic glass; not recorded, no ash, so a BAN with no ash recorded is not keyed in trunk B (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "How the flattened gates are written"
    page: "pp. 30-35"
    reading: "Each gate is the conjunction of the conditions of the book's path to its class, but leaves out the exclusions an earlier entry of the list supplies (CL and CU before the other soils of trunk C, CO before CN, CT before the agro soils, CC, CF and CG before the cryometamorphic horizon ...), as the other keys of soilKey do: a class left undecided then makes the one assigned after it provisional instead of leaving every later class undecided. A gate keeps the exclusions no earlier entry supplies (the steps C.1, C.4, C.5 and C.6, which have no entry of their own; an alternative listed later in the same step; a BT with no eluvial horizon over it, which C.9 leaves without a division) (soilKey's reading, for Hugo to confirm, 2026-11-02)."
