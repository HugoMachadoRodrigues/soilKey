# The readings soilKey makes of the Russian Field Guide of 2008 (Полевой
# определитель почв России) where the text is silent or ambiguous. Each entry
# is a decision of the owner, in soilKey's words, ending "(Hugo, 2026-11-02)":
# his answers to the questions on the keys, the readings of soilKey's he
# accepted, and his decisions after the review of the flattened keys. Pages
# are the printed pages of the book. The criteria are paraphrased; no text of
# the book is shipped.
readings:
  - topic: "Scope, levels and names"
    page: "pp. 8-9, 28-30"
    reading: "soilKey keys the trunks (стволы) and divisions (отделы) of the Field Guide, the levels its keys 2.2 and 2.3 give; the types (the profile formulas of chapter 4) and the subtypes (one list of genetic features per division) follow in later releases; genus, species and the lower ranks are not keyed. Four trunks of soils (A organogenic, B synlithogenic, C postlithogenic, D weakly developed) and trunk E, which is not a soil: rock outcrops, technogenic surface formations (ТПО) and deposits that are not humified over a buried soil, reported with a note; the groups of chapter 8 are not keyed (Q1). The codes are the book's (A to E, AA to CU); the division of trunk D, which the book does not code, is [DA], in brackets as a code of soilKey's own. Each class carries an English gloss of soilKey's in name and the Russian of the book in name_native; a division takes the name of its chapter 4 heading, the forms of the index and of the key kept as synonyms (Стратоземы, also Стратифицированные; Щелочно-глинисто-дифференцированные почвы, also Щелочно-текстурно-дифференцированные; Q12). The registry entry is kidpr2008, namespace kidpr, aliases kidpr, russia and ru2008, experimental and opt-in (Q2) (Hugo, 2026-11-02)."
  - topic: "The keys flattened into ordered lists"
    page: "pp. 9, 28-35"
    reading: "The keys are branching trees, not lists. soilKey writes each as a first-match list (key.yaml and divisions/), each class with the path of the book that leads to it, the steps with their Cyrillic letters (C.4а-C.5а-C.6б-C.7а), and keeps a literal walker of the two keys in its tests as the oracle of the lists, with its own reading of the profile, checked end to end on pedons in the Russian notation and on the data (Hugo, 2026-11-02)."
  - topic: "Precedence where the steps overlap"
    page: "pp. 32, 34-35, 83, 99, 124"
    reading: "The printed order of the steps and of their alternatives decides: C.7 BFM, BPL, CR, CRM, BMK, then ASN or BSN; C.8 BHF, BT, BM, then the rest. C.19в is tested before C.19а: P with AY and PU with AU are organo-accumulative soils (the types CN08, CN09), not agrozems. C.6б prevails over C.6а when the profile has BFM, BPL, CRM, CR, CRH or BMK, so that P-G-CRM reaches the gley soils (the type CH06). An agro horizon with no remnant of the natural humus or organic horizon under it, on alluvium, makes an agrozem, not an alluvial soil (p. 124): the gate of the alluvial soils excludes it, trunk B does not take it, and it is keyed in trunk C (Q9) (Hugo, 2026-11-02)."
  - topic: "Ploughed soils of the iron-metamorphic and light-humus carbonate-accumulative divisions"
    page: "pp. 32-34, 83, 99"
    reading: "The texts of the iron-metamorphic (CC, p. 83) and light-humus carbonate-accumulative (CJ, p. 99) divisions say that their ploughed soils are agrozems, and chapter 4 gives them no agro type. So every ploughed soil of these divisions is an agrozem: an agro horizon at the surface over a profile that keys to CC or CJ, with or without a remnant of the natural horizon under it, goes to the agrozems (CS) when it is P, PU, PT or PTR, and to the agroabrazems (CR) when it is PB, where C.16 sends PB. The profile keys to CC or CJ when, read without the agro horizon and with the natural horizon under it (if any) as the surface, it has BFM; or BMK with no BPL, CR or CRM; or a light-humus AJ over BM, or over BCA or CAT with none of the horizons C.7 and C.8 test before them. P-AJ-BCA, P-AY-BFM and P-AJ-BM-BCA are agrozems, PB-BFM an agroabrazem; the soils of the other divisions keep their agro types (PU-AU-BM-BCA, P-BPL-BCA, P-G-CRM). This replaces the narrower reading of Q9, an agro horizon directly over BFM or BMK (Hugo, 2026-11-02)."
  - topic: "Gaps of the key repaired"
    page: "pp. 31-35"
    reading: "Only the gaps the book's own types prove are repaired (Q10): AY and AK at C.2 (the lithozems CP05 and CP08); PT and PTR at C.19а (CS05, CS06); AK at C.19в (CN05); a TUR more than 40 cm thick tested at C.6, before C.7, and a TUR at the surface counted at C.4 (CT01, CT02, CT14 to CT17); trunk D takes an S alone over loose rock (the Солончаки of trunk D, which the key otherwise sends to CL, whose types do not fit them); AY or AO directly over G goes to the gley soils, by the text of the division (G directly under a humus horizon), with no type of its own. Every other combination the key leaves without an exit (C.13 and C.14 have no other answer; AY or AJ over Q; a BT with no eluvial horizon above it at C.9; C.21 to C.23) is not provided by the Field Guide of 2008: the trunk is assigned, the division left unassigned, with a note. BMK is not among the middle horizons of C.5 and no type proves it, so AJ-BMK-C is not provided. Hard rock within 30 cm under none of the horizons of C.2 is a thin layer of loose rock (C.2б), no division (Hugo, 2026-11-02)."
  - topic: "The surface horizon and the positions"
    page: "pp. 31-37, 94"
    reading: "The surface horizon the key reads (C.4, C.10, C.11, C.16, C.19, and step 5 of the key to trunks) is the agro horizon when there is one; otherwise, of the organic and humus horizons that start the profile (at the surface, or under a deposit of 40 cm or less), the thickest, the others being features (p. 37); fresh litter is no horizon (p. 36), and a W of 5 cm or less over another horizon is the feature w (Q11). Under an agro horizon the thickest natural horizon is its remnant (P-AY, PU-AU, PT-T). A missing thickness that would decide the rule leaves the steps that depend on it undecided. Sub-horizons are merged and transitions and small horizons (e, el, ao, r ...) left out (p. 36); directly over or under reads across them, at any thickness, with up to 15 cm with no diagnostic horizon between AU and BCA (p. 94; Q14). One rule on both routes: an FAO or WRB transition (AB, BA, BC, CB, AE, EB, ABg, A/B, E/B, B/C ...) counts as a transition, as one of the Russian notation does, only when key 2.1 finds no diagnostic horizon in it; where the key finds a horizon in it (AEL in an AE, BEL in an EB), the horizon stands, so that the grey forest soil AY-AEL-BEL-BT keeps its division (CA06). Hard rock (C.1) is measured from the ground, the organic horizons included, so that T-(C)-R and TJ-(C)-R are lithozems. The X of C.3 is a layer starting within 30 cm (Q23); a layer of unknown depth leaves a depth limit undecided (Hugo, 2026-11-02)."
  - topic: "Truncated soils"
    page: "pp. 35, 114"
    reading: "A middle horizon at the surface (C.20, the abrazems) is read on the profile, as the key does: no organic, humus, agro or eluvial horizon at the surface or under a deposit of 40 cm or less, and the middle horizon first; it counts only when the description starts at 0 cm (or under O or W), otherwise it is undecided, since the top of the soil may not have been described; a description that starts with fresh litter at 0 cm starts at 0 cm; recorded erosion only supports it (Q19) (Hugo, 2026-11-02)."
  - topic: "Turbated soils"
    page: "pp. 34, 53, 119-121"
    reading: "The turbozems need a TUR more than 40 cm thick; a thinner TUR under P or PU, which the horizon key makes a TUR because its base lies deeper than 40 cm, leaves the soil to C.16, where it fills the solonetzic agrozems CS16 to CS19 (Q20) (Hugo, 2026-11-02)."
  - topic: "Trunk E and step 1"
    page: "pp. 27-28"
    reading: "Step 1 asks for at least one soil horizon within about 1 m. A layer the data leave undecided between soil horizons (P or AY, PU or AU ...) is a soil horizon. A layer in which the key to horizons finds no diagnostic horizon (its position 66) proves nothing, since it may be a transition, loose rock or ТПО: with no other layer to decide it, step 1 is undecided. Rock, ТПО and the deposit of horizon key position 38б rule a soil horizon out. A layer of the data route designated C (C, Cg, 2Ck ...) in which the key finds no diagnostic horizon is loose rock, one of the readings position 66 lists (Hugo, 2026-11-02)."
  - topic: "Trunk B and the deposit at the surface"
    page: "pp. 21, 28, 30-31, 124-129"
    reading: "Step 7 sends to trunk B only what one of its divisions takes (Q21): a river floodplain recorded (landform or landform element: floodplain, пойма, levee, backswamp ...) with alluvial material (the alluvial mark of the notation, or a fluvial or lacustrine origin of a layer or of the parent material; marine material does not count), the alluvial soils; with no landform, alluvial material that soilKey's fluvic material confirms, and alluvial material alone leaves it undecided; the ochre horizon BAN, the volcanic soils; a stratified humus body of 40 cm or more, the agro horizons P and PU over it counted with it, the stratozems. Other layering (a two-layered deposit, old alluvium, a lithological discontinuity) stays in trunk C. The deposit of step 2 is the material at the surface that is not a horizon formed in it, over a buried soil, an AY or AU at the top of a floodplain being no deposit; it holds the technogenic surface formation ТПО and the deposit the key to horizons finds on the data (position 38б: a loose layer of ТПО or a natural deposit), so that ТПО or a raw deposit over 40 cm on a soil is no soil; over 40 cm and humified (RJ, RY or RU) the soil is synlithogenic, over 40 cm and not humified it is no soil, of 40 cm or less the soil under it is keyed (Hugo, 2026-11-02)."
  - topic: "The ochre horizon BAN and volcanic ash"
    page: "pp. 24, 30-31, 50, 126"
    reading: "B.2а asks for the ochre horizon BAN and the soil developed in volcanic ash. The book defines BAN as a horizon formed in volcanic ash (horizon key position 55, chapter 3), so a BAN present, written in the notation or found by the key to horizons on the data (which accepts andic properties in place of the ash), meets the condition of the ash: H-BAN-C is a volcanic soil, an ash recorded or not (Hugo, 2026-11-02)."
  - topic: "The peat body of trunk A"
    page: "pp. 28, 41-43, 132-133"
    reading: "The peat body of step 6 sums the organic layers contiguous from the surface or under a deposit of 40 cm or less: the litter-peat O, the peats T, TO, TE and TJ, the muck H, the agro-peat horizons PT and PTR, and the peat as rock TT below; more than 50 cm makes trunk A, as the book prints it (51 cm or more on whole centimetres). A layer the data leave undecided between peat horizons (no botany or decomposition recorded) counts as peat, and step 6 does not ask what would decide between them; a layer that may be peat or not stops the body undecided. A description that ends in peat at 50 cm or less leaves it undecided (Q22) (Hugo, 2026-11-02)."
  - topic: "The chemozems"
    page: "pp. 31, 58, 134"
    reading: "The chemozems (CU) are keyed only where the key places them, at C.3б, after the lithozems (CP) and the halomorphic soils (CL): an X horizon, pollutants at the extremely hazardous level (contamination_hazard) in a layer starting within 30 cm; contamination recorded without its category leaves it undecided, and nothing recorded means no X. A contaminated soil of another trunk keeps its division (the subtype x will name it). The name of a chemozem (its pollutants, and the soil it was) comes with the types (Q23) (Hugo, 2026-11-02)."
  - topic: "Inconsistencies of the book"
    page: "pp. 29-35, 76-134"
    reading: "C.2 prints P as грубогумусовый and C.8г and C.13 print CRH as криогумусовый: read as the agro-humus P and the humus-cryometamorphic CRH. Division names differ between the index, the key and chapter 4 (CA -дифференцированные and -дифференцируемые; BC Стратифицированные and Стратоземы; CK Щелочно-текстурно- and Щелочно-глинисто-дифференцированные; CJ and its 2004 name Аккумулятивно-карбонатные малогумусные; CT Турбоземы and Турбированные почвы): the chapter 4 heading is the name, the others synonyms. Page 9 speaks of 28 positions of the key to divisions; the index has 26 codes and the book 27 divisions, the one of trunk D uncoded (Q12) (Hugo, 2026-11-02)."
  - topic: "Gaps the types prove that Q10 does not list"
    page: "pp. 31-32, 93-98, 100-103"
    reading: "V and CRH count among the middle horizons of C.5, which names neither, though C.8г and C.13а do and the types CI04, CI05, CI14 and CI15 (AU-V, AU-CRH, PU-AU-V, PU-AU-CRH) have no other middle horizon; a profile for which C.6 has no answer (an agro horizon P or PU directly over ASN or BSN: the agro-solonetzes CK09 to CK12) goes on to C.7, as if C.6б were the other answer. Without these, the six types would not be reached (Hugo, 2026-11-02)."
  - topic: "Readings of the lists and the positions"
    page: "pp. 28-35, 92"
    reading: "The peat T of the key's lists (C.2, C.4, C.11, C.14) includes the oligotrophic and eutrophic peats TO and TE. The surface S or SS of C.3 is one in a layer starting within 10 cm (the 0-10 cm of the salts, horizon key 1-2). Present means in the profile, a buried soil left out (an overlay S, X or V counts); above or below (C.9, C.17, C.18, and the horizons under the plough layer at C.6б) anywhere above or below. Step 5 of the key to trunks (only O or only W) reads the profile after the thickest-horizon rule of p. 37, as C.2 and C.19 do: O over a thinner AY is only O, a weakly developed soil, and O with W is one of them, so that trunk D needs no repair for it. C.13 reads the horizon directly under AU, as it prints. C.14 prints under the organic or agro horizon (O, T, H, PT, PU), but the text of the gley division (p. 92) puts G directly under the organic or humus horizon and says that any other mineral horizon in the profile leaves the soil out of the gley soils; the text decides, and C.14 reads directly under, as C.13 does: O-BI-G is not provided by the Field Guide of 2008. At C.19а the key's P or PU is read as present (the alternatives а and в overlap, which the order of Q9 settles) (Hugo, 2026-11-02)."
  - topic: "Readings of the deposit and the floodplain"
    page: "pp. 21, 28, 30-31, 124-127"
    reading: "The deposit of step 2 is read as the run of layers from the ground made of ТПО, the deposit of horizon key position 38б, the stratified humus horizons RJ, RY and RU, the small deposited layers (r, rh, ur, rr, rx) and loose rock; ТПО and the deposit of 38б always belong to it, loose rock only when a buried soil or an organic or humus horizon lies under the run (else it is the parent material under the deposit, as the D of RY-D); a buried soil directly under a deposit of 40 cm or less is the soil keyed. The texts of the site and of the layers are read as words: a landform recorded as a valley, an alluvial plain or a delta leaves the floodplain undecided; a terrace, above the floodplain (надпойменная) or not, rules it out, as another landform does; glaciofluvial material (fluvioglacial, fluvio-glacial, водно-ледниковые), outwash and moraine are no alluvium, and outwash or washed sand is no volcanic ash (Hugo, 2026-11-02)."
  - topic: "How the flattened gates are written"
    page: "pp. 30-35"
    reading: "Each gate is the conjunction of the conditions of the book's path to its class, but leaves out the exclusions an earlier entry of the list supplies (CL and CU before the other soils of trunk C, CO before CN, CT before the agro soils, CC, CF and CG before the cryometamorphic horizon ...), as the other keys of soilKey do: a class left undecided then makes the one assigned after it provisional instead of leaving every later class undecided. A gate keeps the exclusions no earlier entry supplies (the steps C.1, C.4, C.5 and C.6, which have no entry of their own; an alternative listed later in the same step; a BT with no eluvial horizon over it, which C.9 leaves without a division) (Hugo, 2026-11-02)."
  - topic: "The types: formulas closed on the division"
    page: "pp. 36-37, 44, 76-100"
    reading: "A type is the formula of its profile in chapter 4, matched on the horizons the divisions read. Every horizon some formula of the division writes must be in the type's formula when it is in the profile; a horizon foreign to the division is ignored and may name a subtype (Q13; BEL is the exception, below). The types are tried most specific first (more required horizons), agro before natural; when two match, the more specific names the type and the other is an intergrade, kept in the trace. A horizon in parentheses is optional; BEL is required only where it is the diagnostic eluvial horizon (CA07, CA08, CA11, CA20, CA21, CD09; p. 44); the g and q marks on BEL, BT or BCA are expected, not required (the G or the Q makes the gley type); the parent material (C, Cca, CG, CQ, C with the permafrost mark, CLM, D) is not tested; directly under passes over transitions and sub-horizons, and over up to 15 cm with no diagnostic horizon between AU and BCA (p. 94) (Q14). A profile no formula matches keeps its division and the type is unassigned, with the nearest formulas and the note that the Field Guide of 2008 does not provide for the combination; before that only the near-identity readings: the BF of CB05, CE06 and CE07 and the BH of the gley Al-Fe-humus soils are a BHF of either kind, CJ01 takes BCA or CAT, CH02 takes O, T or H over G-CRM (Q15) (Hugo, 2026-11-02)."
  - topic: "BEL closes only the formulas where it is diagnostic"
    page: "pp. 44, 76-79, 86"
    reading: "BEL is characteristic of the texture-differentiated soils but diagnostic only for some types, and it separates the dark grey soils from the clay-illuvial chernozems (p. 44). So BEL closes only the formulas where it is diagnostic, which are also those where Q14 requires it: CA07, CA08, CA11, CA20, CA21 and CD09. In every other formula a BEL in the profile is read as part of the passage from the eluvial to the middle horizon: it neither blocks the formula nor is required by it (written in parentheses, or listed under ignore in the type files). AU-EL-BEL-BT-G-CG is CA10, AY-EL-BEL-BT-BCA-Cca CA12, PU-EL-BEL-BT-G-CG CA23, AY-EL-BEL-BM-C CD07, while the formulas that write BEL win where they match, being more specific: AY-EL-BEL-BT-C stays CA04, AU-BEL-BT-C CA07, AY-BEL-BT-C CA11, and AY-BEL-BM matches CD01 too, an intergrade of CD09. The key to divisions already keeps a BEL apart from the clay-illuvial chernozems: a BT under an eluvial horizon is CA before any BI is read (C.8, C.9), and the chernozems need AU directly over BI (C.13), so AU-BEL-BI has no division (Hugo, 2026-11-02)."
  - topic: "The peat T of the type formulas"
    page: "pp. 41-42, 78-92"
    reading: "The T of a formula (CA03, CA16, CB04, CB12 to CB14, CB17, CG03, CH03, CH07) also takes the oligotrophic and eutrophic peats TO and TE, as the T of the key's lists does, and CH02 takes them with O, T and H (Hugo, 2026-11-02)."
  - topic: "Surface horizons a formula does not write"
    page: "pp. 37, 79, 92, 97"
    reading: "The closure of Q13 covers the middle, eluvial and hydrogenic horizons the formulas write (the lists of Q13 name only these); a natural organic or humus horizon of the surface run that a formula does not write is left out of it. Under the agro horizon the thickest natural horizon of the run is its remnant (p. 37): an agro type that does not write it ignores it (P-AY-EL-BEL-BT is Агродерново-подзолистые, CA17), one that writes it in parentheses takes it when present (CA19, CA20, CA25), one that writes it requires it (CH07 to CH09, CI11 to CI20, CD13). With an undecided layer in the surface run the same rule is applied to each reading of the layer (Hugo, 2026-11-02)."
  - topic: "Overlays in the type formulas"
    page: "pp. 54-58, 93-96"
    reading: "An overlay laid over the horizon of a layer (S, X or V over a host) is a feature of that layer for the types, not a horizon of the formula: a BCA with a vertic overlay under AU is a chernozem (CI01), its vertic character a subtype, while a V horizon on its own makes the dark slitic soils (CI04). The key to divisions reads a V overlay as a feature too (below); S and X overlays it still reads where it names them (Hugo, 2026-11-02)."
  - topic: "The order of trial of the types"
    page: "pp. 76-100"
    reading: "Most specific first (more required horizons, then more required marks); at equal specificity the agro types before the natural ones, then the order of chapter 4. With the closures of Q13, of BEL and of BCA and the thickest-horizon rule, the only profiles two formulas of CA to CJ match are AY-BEL-BM, where CD09 names the type and CD01 is an intergrade, and AU-BM-BCA, where CD08 names it and CD03 is an intergrade; otherwise the order decides only which undecided type makes the one assigned provisional and the order in which the candidates are named (Hugo, 2026-11-02)."
  - topic: "A layer with no horizon between two horizons of a formula"
    page: "pp. 36, 94"
    reading: "A layer the key to horizons reads on the data as no horizon (position 66) may be a transition or loose rock, which the formula passes over: between two horizons of a formula it leaves the type undecided, with the candidates, not unassigned. Up to 15 cm of it between AU and BCA is passed over, as before (p. 94). The FAO transitions (BC, CB, B/C) and the FAO C layers of the data route are transitions and parent material for the types, as for the divisions (Hugo, 2026-11-02)."
  - topic: "E and EL in the Al-Fe-humus and cryometamorphic soils"
    page: "p. 43"
    reading: "In the divisions CB and CE an EL counts as an eluvial horizon with E: it fills the E of a formula (O-EL-BHF-C is Подзолы, CB07; O-EL-CRM-C is Светлоземы, CE05) and it blocks the formulas without E (it is no podbur, CB01, nor CE01). A profile with EL that no formula with E takes stops at the division with the note of Q15 (Hugo, 2026-11-02)."
  - topic: "BCA in the structure-metamorphic soils"
    page: "p. 85"
    reading: "The structure-metamorphic soils admit an eluvial, sub-eluvial or humus-eluvial horizon and a carbonate-accumulative one (p. 85): BCA, like BEL, neither blocks a formula of CD that does not write it nor is required by it. AY-BM-BCA-Cca is Буроземы (CD01) and AO-BM-BCA Буроземы грубогумусовые (CD02); CD08 and CD13, which write BCA, still name the type where they match, being more specific (AU-BM-BCA is CD08, CD03 its intergrade) (Hugo, 2026-11-02)."
  - topic: "An overlay is no middle horizon of the key"
    page: "pp. 31-35, 54-58"
    reading: "A V laid over the horizon of a layer (G+V) is a feature of that layer for the key to divisions too, at C.5, C.8г, C.13 and every step that reads the middle horizons: only a V that is the horizon of its own layer counts. AU over G+V is a gley soil, Темногумусово-глеевые (CH04), its vertic character for the subtype; until 0.9.337 the V overlay made it a humus-accumulative soil. The overlays S and X still count where the key reads them (C.3) (Hugo, 2026-11-02)."
  - topic: "The stratified body over the agro horizon"
    page: "pp. 28, 126-129"
    reading: "The stratified humus body of the stratozems counts the agro horizons P and PU only over the first RJ, RY or RU, as the agro stratozems draw them (BC07 to BC10: P-RY-D, PU-RU-D); an agro horizon under a stratified horizon is the soil under a thin deposit. RY 12 cm over P-EL-BEL-BT is Агродерново-подзолистые (CA17), not a stratozem as in 0.9.337 (Hugo, 2026-11-02)."
  - topic: "The secondary solonchaks and an S laid over a horizon"
    page: "pp. 12, 56, 104-105"
    reading: "The [ABC] of the secondary solonchaks (CL03, S-[ABC]) is any formed profile under the S, not a buried soil: it is not tested, so CL03 is a solonchak horizon with no G or Q under it (S-AU-BCA is CL03; S over G or over Q is CL01). The secondary solonchaks form over any profile (pp. 56, 105), so in the types of CL an S laid over another horizon (position 3б, p. 12) counts as the S of the formula, read as the salt horizon over its host: AY+S over C is CL03, AU+S over G or over Q CL01. The key to divisions sends these profiles to CL as before (C.3); outside CL an overlay stays a feature of its layer (Hugo, 2026-11-02)."
  - topic: "The fragments of TUR with no record"
    page: "pp. 53, 102, 119, 122"
    reading: "The solonetzic agrozems (CS16 to CS19) and the post-solonetzic turbozems (CT14 to CT17) test the fragments of their TUR, from the notation (TUR[SEL+ASN]) or from the column turbated_fragments (SEL;ASN); every fragment the formula writes must be among them, so TUR[SEL+ASN] at the surface is no CT14, which writes AU too. With neither, the type is undecided when the TUR has an ESP of 15 % or more (100 na_cmol / cec_cmol, else esp_pct), the sodium threshold of the WRB natric horizon; an ESP below it, or none recorded, makes the TUR not one of these (PU-TUR-BCA with no fragments written has no type) (Hugo, 2026-11-02)."
  - topic: "Doubles among the formulas of CK to CT"
    page: "pp. 111-113"
    reading: "Two formulas of CK to CT match the same profile only where a tested parent slot names one type and the other does not test it: O-EL-DG matches CO02 and CO01 (the D of CO01 is not tested), as AY-EL-DG matches CO04 and CO03 and P-EL-DG CO10 and CO09; AH-Cca-Rca matches CP10 and CP09, AU-Cca-Rca CP11 and CP06 (the R of CP09 and CP06 is tested, its carbonate mark is not written). The gley and carbonate types are more specific and name the type; the other is an intergrade in the trace. A brute force over the formulas with their optional horizons, the horizons of the division inserted at every place, the natural remnants under the plough and the marks exchanged (DG and D, Rca and R, the fragments of TUR) finds no other double (Hugo, 2026-11-02)."
  - topic: "Profiles of CK to CT with a division and no type"
    page: "pp. 35, 83, 99, 103, 109, 112-114, 118-119"
    reading: "An exposed BT (at the surface, with no humus, organic, agro or eluvial horizon above it, the description starting at 0 cm) counts as BI at C.20 as in the types (Q15): BT over C is an abrazem, CQ01; until 0.9.338 it had no division. Otherwise the literal rules stand: a thin TUR of solonetz fragments under P or PU directly over the parent material (CS16 or CS17 without its BCA) is not directly over a middle horizon, so C.6а gives no exit; under the plough a horizon foreign to the division is ignored, by Q13 (PB over BFM is CR01, P over BMK and CAT is CS15: the ploughed soils of CC and CJ, pp. 83, 99, their BFM or BMK left to the subtype); TJ over C reaches CN by C.19в and V at the surface reaches CQ by C.20 with no type (pp. 109, 114); O, T or PT over Q reach CM or CS with no type, and so do AU-SEL-BSN, AU-ASN without SEL and PB or PU over BSN in CK (p. 103). On the data, a carbonate layer directly under the plough is read by the key to horizons as AJ (position 12а), so a ploughed chernozem written Ap-Bk-Ck is PU-AJ, an agrozem CS02, not CS14 (Hugo, 2026-11-02)."
