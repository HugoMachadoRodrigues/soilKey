# The correlation of the Field Guide of 2008 (Полевой определитель почв
# России) with the classification of 1977 (Классификация и диагностика почв
# СССР): chapter 6, pp. 139-161, as structured data. Each row is a type of
# the classification of 2004 as chapter 6 prints it (its name and its 2004
# profile formula, which may differ from chapter 4), the type of 2008 it
# stands for (soilKey's code), and what the soils were in 1977. soilKey shows
# it as a note of the result (qualifiers$analogue_1977 and a line in
# warnings), never to classify (Hugo's decision Q1, 2026-11-02).
#
# row           the row, in the order of the book (268 rows: the 266 formulas
#               of tests/testthat/fixtures/kidpr2008-formulas.tsv and two the
#               text layer had hidden, CD04 and CT01, now in the fixture too)
# page          the printed page
# division      the 2004 division heading in effect (ТИПЫ ОТДЕЛА ...)
# name_2004     the type's name as chapter 6 prints it
# formula_2004  the formula as chapter 6 prints it (the look-alike letters of
#               the text layer kept, as in the fixture)
# type          the type of 2008 (soilKey's code, types/*.yaml); null where
#               the Field Guide of 2008 has no such type
# distinguished false where the table says the soils were not distinguished
#               in 1977 ("не выделялись"); the analogues are then what they
#               were part of, or none
# analogues     the units of 1977 the table names, in its order: `name` the
#               short printed name (nominative plural), `level` type,
#               subtype, species, genus, group (an extra-taxonomic group) or
#               literature (a name of the literature or of maps, not of the
#               1977 system), `in_type` the 1977 type it belongs to when the
#               table names it, `extent` full, approximately, partly or
#               mostly, `qualifier` soilKey's words for what the table adds
#               to the unit (its genus, varieties, erosion, reclaimed state)
# en            soilKey's English paraphrase of the entry (no text of the
#               book is shipped)
# note          soilKey's remarks: slips, readings of the two-column layout
#
# The readings (shared cells, slips, a 2004 type that the Field Guide of 2008
# does not keep) are listed in readings.yaml (Hugo, 2026-11-03).

