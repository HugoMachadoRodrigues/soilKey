    extent: full
  en: The podzolic and gley-podzolic subtypes of loamy and clayey texture, i.e. the extra-taxonomic group of genera
    with mainly clay illuviation within the podzolic type.
  note: The text layer gives this cell before 'Подзолисто-глеевые'; read as the cell of 'Подзолистые' only (the
    next cell is shared by the two gley rows).
