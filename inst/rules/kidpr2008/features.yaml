# The genetic features of the Russian soil classification, Field Guide of 2008
# (section 3.2, pp. 59-74, and the subtype lists of chapter 4). A feature is
# written in lower case to the right of a horizon index (BTg, BCAs,cs); one
# that forms a thin band is a small horizon written alone between hyphens
# (O-e-BHF-C); three are written in square brackets ([hh], [e-hf], [akl]);
# BH and BF are written in capitals (horizons.yaml, modifications). Read by
# the notation reader (R/designation-kidpr.R); the feature tests come later.
#
# code         the index as printed (the canonical form where the book has two)
# aliases      other spellings in the book, read as the code
# name_native  the Russian name of the 3.2 heading (or of the chapter 4 list)
# name         soilKey's English gloss
# group        the 3.2 group: transitional (3.2.1), process (3.2.2),
#              turbation (3.2.3), evolutionary (3.2.4), parent_rock (3.2.5),
#              substrate (3.2.6); list_only for the indices of the chapter 4
#              lists that 3.2 does not define
# hosts        the horizons the text puts it on (empty: any horizon or the
#              whole profile)
# small        it may be written alone as a small horizon
# ambiguous    written without commas it can also be read as two features
# page         printed page
# The criteria are not reproduced: they are in the Field Guide.

edition: "Polevoi opredelitel' pochv Rossii (Dokuchaev Soil Science Institute, Moscow, 2008)"

features:
  # --- 3.2.1 transitional features (23) --------------------------------------
  - code: ao
    name_native: "Грубогумусированный"
    name: "coarse-humified"
    group: transitional
    hosts: [O]
    small: true
    page: 60
  - code: mr
    name_native: "Минерально-торфяный"
    name: "mineral-peaty"
    group: transitional
    hosts: [T, TO, TE, TJ, H, PT]
    ambiguous: true
    page: 61
  - code: te
    name_native: "Остаточно-эутрофный"
    name: "residual-eutrophic"
    group: transitional
    hosts: [TO]
    small: true
    page: 61
  - code: h
    name_native: "Перегнойный"
    name: "peregnoi (highly decomposed)"
    group: transitional
    hosts: [O, T, TO, TE, TJ, PT, AU, AY, AJ, AH, AK, AO]
    small: true
    page: 61
    note: "Inside a peat or a humus horizon, or a band at the base of O, T or PT, or on top of the AU of the dark-humus gley soils."
  - code: e
    name_native: "Оподзоленный"
    name: "podzolised"
    group: transitional
    small: true
    page: 61
  - code: el
    name_native: "Элювиированный"
    name: "eluviated"
    group: transitional
    hosts: [AY, AJ, AU, AH, AK, D]
    small: true
    page: 61
    note: "Mostly in the lower part of a humus horizon (and on the underlying rock D); written as a row of its own (an EL-like band of 5 cm or less) it is a marked small horizon, not a diagnostic one (default 11)."
  - code: BH
    written_as: horizon
    name_native: "Иллювиально-гумусовый"
    name: "illuvial-humus (modification of BHF)"
    group: transitional
    hosts: [BHF]
    page: 62
  - code: BF
    written_as: horizon
    name_native: "Иллювиально-железистый"
    name: "illuvial-iron (modification of BHF)"
    group: transitional
    hosts: [BHF]
    page: 62
  - code: f
    name_native: "Ожелезненный"
    name: "ferruginated"
    group: transitional
    hosts: [E, EL, C]
    page: 62
  - code: "[e-hf]"
    name_native: "С микропрофилем подзола"
    name: "with a podzol microprofile"
    group: transitional
    hosts: [EL]
    small: true
    components: [e, hf]
    page: 62
  - code: "[akl]"
    aliases: [akl]
    name_native: "С корково-подкорковым микропрофилем"
    name: "with a crust-subcrust microprofile"
    group: transitional
    hosts: [AJ]
    page: 63
  - code: i
    name_native: "Глинисто-иллювиированный"
    name: "clay-illuviated"
    group: transitional
    hosts: [BM, CRM, C, D]
    page: 63
  - code: m
    name_native: "Метаморфизованный"
    name: "metamorphised"
    group: transitional
    hosts: [C]
    page: 63
  - code: crm
    name_native: "Криометаморфизованный"
    name: "cryo-metamorphised"
    group: transitional
    small: true
    page: 63
  - code: an
    name_native: "Охристый"
    name: "ochric"
    group: transitional
    hosts: [BHF]
    page: 63
  - code: pl
    name_native: "Палевый"
    name: "pale"
    group: transitional
    hosts: [CR]
    page: 64
  - code: sn
    name_native: "Солонцеватый"
    name: "solonetzic"
    group: transitional
    page: 64
  - code: v
    name_native: "Слитизированный"
    name: "vertic"
    group: transitional
    page: 64
  - code: g
    name_native: "Глееватый"
    name: "gleyic"
    group: transitional
    page: 65
  - code: q
    name_native: "Квазиглееватый"
    name: "quasi-gleyic"
    group: transitional
    small: true
    page: 65
  - code: ml
    name_native: "Омергеленный"
    name: "marly"
    group: transitional
    page: 65
  - code: s
    name_native: "Засоленный"
    name: "saline"
    group: transitional
    page: 65
  - code: tk
    name_native: "Такыровидный"
    name: "takyric"
