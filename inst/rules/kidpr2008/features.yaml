    ambiguous: true
    page: 80
    note: "A universal subtype of the chapter 4 lists, not defined in chapter 3."

# Parts of a bracketed microprofile, read when written alone.
components:
  - code: hf
    part_of: "[e-hf]"
    name: "Al-Fe-humus band of the podzol microprofile"
    small: true
    ambiguous: true
    page: 62

# Subtype indices of the chapter 4 lists written with their host horizon; the
# paired ones need both horizons.
host_forms:
  - {written: ELf, host: EL, features: [f], lists: [CA]}
  - {written: ELg, host: EL, features: [g], lists: [CA]}
  - {written: Th, host: T, features: [h], lists: [CA, CH, AA]}
  - {written: Oh, host: O, features: [h], lists: [CH]}
  - {written: AUh, host: AU, features: [h], lists: [CH]}
  - {written: AUel, host: AU, features: [el], lists: [CH]}
  - {written: Gel, host: G, features: [el], lists: [CH]}
  - {written: Pw, host: P, features: [w], lists: [CD]}
  - {written: PUw, host: PU, features: [w], lists: [CI]}
  - {written: TEmr, host: TE, features: [mr], lists: [AA]}
  - {written: Tote, host: TO, features: [te], lists: [AA], reads_as: TOte, note: "Written with a lower-case o: TO with te."}
  - {written: Di, host: D, features: [i], lists: [CB]}
  - {written: Del, host: D, features: [el], lists: [], page: 62, note: "Written in 3.2.1 (el, the contact-eluviated top of a heavier underlying rock)."}
  - {written: "AJ[akl]", host: AJ, features: ["[akl]"], lists: [CJ]}
  - {written: AUlc-BCAmc, host: [AU, BCA], features: [lc, mc], lists: [CI]}
  - {written: AUlc-BCAnc, host: [AU, BCA], features: [lc, nc], lists: [CI]}
  - {written: AJlc-BCAnc, host: [AJ, BCA], features: [lc, nc], lists: [CJ]}
