# =============================================================
# USDA Soil Taxonomy 13th ed. -- Entisols subgroups (Ch. 8, pp. 165-188)
# =============================================================
# v0.9.425: every great group carries the KST 13th edition list, in KST
# order, Typic last; codes are the great-group code plus the letter of the
# KST position. The tests are the KST criteria (R/subgroups-usda-inceptent.R
# and the shared helpers); the KST lists are checked in
# tests/testthat/test-v09425-subgroups-inceptent.R. Package great-group codes
# keep their order (LC Fluvents, LD Psamments; KST prints LC Psamments, LD
# Fluvents).
# =============================================================

