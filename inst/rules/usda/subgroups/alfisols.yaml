# =============================================================
# USDA Soil Taxonomy 13th ed. -- Alfisols Subgroups -- Ch. 5 (pp. 73-117)
# =============================================================
# v0.9.422 (audit items R3 to R6, G7, F16, F17): every great group has the
# subgroup list of the KST 13th edition, in the order of its key, Typic last;
# 356 subgroups. The codes are the great-group code of the rules (the
# Aqualfs keep their own, see great-groups/alfisols.yaml) followed by the
# letters of the KST code. The tests read the KST criteria of each
# subgroup, in R/subgroups-usda-alfisols.R (sg_alfisols_*) and in the
# shared helpers where those read the Alfisol text (lithic, oxyaquic,
# plinthic, calcic, petrocalcic, salic, natric, histic). All are
# three-valued (an undecided subgroup before the one assigned is an
# ambiguity, grade C).
# =============================================================

subgroups:
