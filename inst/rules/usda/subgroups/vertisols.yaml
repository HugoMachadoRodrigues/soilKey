# =============================================================
# USDA Soil Taxonomy 13th ed. -- Vertisols subgroups -- Ch. 16, pp. 343-354
# =============================================================
# v0.9.426: every great group lists exactly the subgroups of the KST 13th
# edition, in KST order, with the KST codes (Typic last, as the default).
# Compound subgroups come before their parts, as the KST orders them. The
# tests are the KST criteria, three-valued (R/subgroups-usda-aridvertand.R
# and the helpers of the other orders it names).
# The crack patterns (Aridic, Ustic, Xeric, Udic) read site$cracks_open_days,
# else the recorded regimes they stand for (KST p. 343 note; audit L32).
# =============================================================

subgroups:

  "FAA":  # Sulfaquerts (3)
    - code: "FAAA"
      name: "Salic Sulfaquerts"
      tests:
        all_of:
          - salic_horizon_usda: { max_top_cm: 75 }
    - code: "FAAB"
      name: "Sulfic Sulfaquerts"
      tests:
        all_of:
          - none_of: [ { sulfuric_horizon_usda: { max_top_cm: 100 } } ]
    - code: "FAAC"
      name: "Typic Sulfaquerts"
      tests:
        default: true

