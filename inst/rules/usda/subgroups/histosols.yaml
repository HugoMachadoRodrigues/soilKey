# =============================================================
# USDA Soil Taxonomy 13th edition (2022) -- Histosols Subgroups
# Chapter 10, pp. 199-205 (printed pages)
# =============================================================
# v0.9.427: the lists follow the KST 13th edition key by key (codes are the
# KST codes). 75 subgroups: 8 Folists + 13 Wassists + 20 Fibrists + 17
# Saprists + 17 Hemists. Tests of R/subgroups-usda-spodhistgel.R
# (sg_histosols_*) read the control section and tiers of Histosols (p. 41).
# =============================================================

subgroups:

  # ====== FOLISTS ======

  "BAA":  # Cryofolists (2), p. 201
    - code: "BAAA"
      name: "Lithic Cryofolists"
      tests:
        all_of:
          - sg_histosols_lithic_usda: { max_cm: 50 }
    - code: "BAAB"
      name: "Typic Cryofolists"
      tests:
        default: true

  "BAB":  # Torrifolists (2), p. 201
    - code: "BABA"
      name: "Lithic Torrifolists"
      tests:
        all_of:
          - sg_histosols_lithic_usda: { max_cm: 50 }
    - code: "BABB"
      name: "Typic Torrifolists"
      tests:
        default: true

  "BAC":  # Ustifolists (2), p. 201
    - code: "BACA"
      name: "Lithic Ustifolists"
      tests:
        all_of:
          - sg_histosols_lithic_usda: { max_cm: 50 }
    - code: "BACB"
      name: "Typic Ustifolists"
      tests:
        default: true

  "BAD":  # Udifolists (2), p. 201
    - code: "BADA"
      name: "Lithic Udifolists"
      tests:
        all_of:
          - sg_histosols_lithic_usda: { max_cm: 50 }
    - code: "BADB"
      name: "Typic Udifolists"
      tests:
        default: true

  # ====== WASSISTS ======

  "BBA":  # Frasiwassists (4), p. 203-204
    - code: "BBAA"
      name: "Terric Frasiwassists"
      tests:
        all_of:
          - sg_histosols_terric_usda: {}
    - code: "BBAB"
      name: "Fibric Frasiwassists"
      tests:
        all_of:
          - sg_histosols_predominant_usda: { kind: fibric, no_sulfidic: true }
    - code: "BBAC"
      name: "Sapric Frasiwassists"
      tests:
        all_of:
          - sg_histosols_predominant_usda: { kind: sapric }
    - code: "BBAD"
      name: "Typic Frasiwassists"
      tests:
        default: true

  "BBB":  # Sulfiwassists (4), p. 204-205
    - code: "BBBA"
      name: "Terric Sulfiwassists"
      tests:
        all_of:
          - sg_histosols_terric_usda: {}
    - code: "BBBB"
      name: "Fibric Sulfiwassists"
      tests:
        all_of:
          - sg_histosols_predominant_usda: { kind: fibric }
    - code: "BBBC"
      name: "Sapric Sulfiwassists"
      tests:
        all_of:
          - sg_histosols_predominant_usda: { kind: sapric }
    - code: "BBBD"
      name: "Typic Sulfiwassists"
      tests:
        default: true

  "BBC":  # Haplowassists (5), p. 204
    - code: "BBCA"
      name: "Sulfic Haplowassists"
      tests:
        all_of:
          - sulfic_subgroup_usda: {}
    - code: "BBCB"
      name: "Terric Haplowassists"
      tests:
        all_of:
          - sg_histosols_terric_usda: {}
    - code: "BBCC"
      name: "Fibric Haplowassists"
      tests:
        all_of:
          - sg_histosols_predominant_usda: { kind: fibric }
    - code: "BBCD"
      name: "Sapric Haplowassists"
      tests:
        all_of:
          - sg_histosols_predominant_usda: { kind: sapric }
    - code: "BBCE"
      name: "Typic Haplowassists"
      tests:
        default: true

