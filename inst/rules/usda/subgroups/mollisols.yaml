# =============================================================
# USDA Soil Taxonomy 13ed -- Mollisols Subgroups -- Cap 12
# =============================================================
# v0.9.424: every subgroup of the KST 13th edition (pp. 248-294), in the
# order of its keys, Typic last. Codes follow the KST, including the codes
# past Z (IFFZa, IGGZa ...). The tests
# are in R/subgroups-usda-mollisols.R (sg_mollisol_*) and the shared
# USDA helpers.
# =============================================================

subgroups:

  # ====== ALBOLLS ======

  "IAA":  # Natralbolls (2), KST p. 249
    - code: "IAAA"
      name: "Leptic Natralbolls"
      tests:
        all_of:
          - sg_mollisol_leptic_usda: {}
    - code: "IAAB"
      name: "Typic Natralbolls"
      tests:
        default: true

  "IAB":  # Argialbolls (7), KST p. 248
    - code: "IABA"
      name: "Xerertic Argialbolls"
      tests:
        all_of:
          - sg_mollisol_vertic_usda: {}
          - sg_mollisol_moisture_usda: { kind: "xeric_summer" }
    - code: "IABB"
      name: "Vertic Argialbolls"
      tests:
        all_of:
          - sg_mollisol_vertic_usda: {}
    - code: "IABC"
      name: "Argiaquic Xeric Argialbolls"
      tests:
        all_of:
          - none_of:
              - sg_mollisol_abruptic_usda: { change_only: true }
          - sg_mollisol_moisture_usda: { kind: "xeric_summer" }
    - code: "IABD"
      name: "Argiaquic Argialbolls"
      tests:
        all_of:
          - none_of:
              - sg_mollisol_abruptic_usda: { change_only: true }
    - code: "IABE"
      name: "Xeric Argialbolls"
      tests:
        all_of:
          - sg_mollisol_moisture_usda: { kind: "xeric_summer" }
    - code: "IABF"
      name: "Aquandic Argialbolls"
      tests:
        all_of:
          - sg_mollisol_aquandic_usda: {}
    - code: "IABG"
      name: "Typic Argialbolls"
      tests:
        default: true

