# =============================================================
# USDA Soil Taxonomy 13th edition (2022) -- Spodosols Subgroups
# Chapter 14, pp. 311-320 (printed pages)
# =============================================================
# v0.9.427: the lists follow the KST 13th edition key by key (codes are the
# KST codes). 121 subgroups: 40 Aquods + 10 Gelods + 24 Cryods + 9 Humods +
# 38 Orthods. Tests of R/subgroups-usda-spodhistgel.R (sg_spodosols_*) read
# the Spodosol definitions: depths from the mineral soil surface, Andic as
# 25 cm of andic soil properties within 75 cm, Aquic as redox features and
# aquic conditions within 75 cm, the four Entic definitions by great group.
# =============================================================

subgroups:

  # ====== AQUODS ======

  "CAA":  # Cryaquods (6), p. 312
    - code: "CAAA"
      name: "Lithic Cryaquods"
      tests:
        all_of:
          - sg_spodosols_lithic_usda: {}
    - code: "CAAB"
      name: "Placic Cryaquods"
      tests:
        all_of:
          - placic_horizon_usda: { max_top_cm: 100 }
    - code: "CAAC"
      name: "Duric Cryaquods"
      tests:
        all_of:
          - cemented_horizon_usda: {}
    - code: "CAAD"
      name: "Andic Cryaquods"
      tests:
        all_of:
          - sg_spodosols_andic_usda: {}
    - code: "CAAE"
      name: "Entic Cryaquods"
      tests:
        all_of:
          - entic_subgroup_usda: { rule: cryaquod }
    - code: "CAAF"
      name: "Typic Cryaquods"
      tests:
        default: true

