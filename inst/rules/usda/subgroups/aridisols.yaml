# =============================================================
# USDA Soil Taxonomy 13th ed. -- Aridisols subgroups -- Ch. 7, pp. 137-163
# =============================================================
# v0.9.426: every great group lists exactly the subgroups of the KST 13th
# edition, in KST order, with the KST codes (Typic last, as the default).
# Compound subgroups come before their parts, as the KST orders them. The
# tests are the KST criteria, three-valued (R/subgroups-usda-aridvertand.R
# and the helpers of the other orders it names).
# The subgroups "that border on ustic (xeric)" read the moisture regime
# record: a record naming both regimes passes, a single regime is its typic
# part (sg_aridisols_border_usda).
# =============================================================

subgroups:

  "GAA":  # Salicryids (2)
    - code: "GAAA"
      name: "Aquic Salicryids"
      tests:
        all_of:
          - sg_aridisols_aquic_usda: { irrigated: false }
    - code: "GAAB"
      name: "Typic Salicryids"
      tests:
        default: true

  "GAB":  # Petrocryids (7)
