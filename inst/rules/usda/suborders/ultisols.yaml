# =============================================================
# USDA Soil Taxonomy 13ed -- Ultisols Suborders -- Cap 15
# =============================================================
# 5 Suborders: HA Aquults, HB Humults, HC Udults, HD Ustults, HE Xerults
# =============================================================

suborders:

  "UT":
    - code: "HA"
      name: "Aquults"
      tests:
        all_of:
          - aquult_qualifying_usda: {}
    - code: "HB"
      name: "Humults"
      tests:
        all_of:
          - humult_qualifying_usda: {}
    # v0.9.415: in the order of the key (KST 13th ed., p. 321), and only
    # Xerults is "Other Ultisols". Udults need a udic regime, which the
    # formative element "ud" extends to the perudic one (p. 48); Xerults are
    # named only with a xeric regime recorded (audit reading L34, Hugo,
    # 2026-11-20). With no regime recorded the three are undecided and the
    # suborder is not named.
    - code: "HC"
      name: "Udults"
      tests:
        all_of:
          - smr_udic_usda: {}
    - code: "HD"
      name: "Ustults"
      tests:
        all_of:
          - smr_ustic_usda: {}
    - code: "HE"
      name: "Xerults"
      tests:
        all_of:
          - smr_xeric_usda: {}
