# How soilKey reads the New Zealand Soil Classification, 4th ed. (Quarto
# source of 7 October 2026), where the text is silent or leaves a choice.
# Summarised in soilKey's own words; the text is Manaaki Whenua's.
readings:
  - topic: "Mineral soil surface and soil surface"
    page: "Key to Soil Orders; Diagnostics"
    reading: "The mineral soil surface is the top of the first horizon that is not organic soil material (below any L or O horizons); the soil surface is the top of the first horizon. Depths are measured from the one the key names."
  - topic: "Horizon notation"
    page: "Diagnostics (the notation each diagnostic gives)"
    reading: "The New Zealand notation is read: lithologic prefixes (2, 3), lower-case prefixes e (anthropic soil material) and b (buried; a trailing b, as in the FAO notation, also reads as buried), masters L, O, A, E, B, C, CR and R, suffixes (w, t, h, s, o, g, r, x, k, d, n, z, i, p, and the pans qm, hm, lm, sm, fm), and a suffix in parentheses as the weak expression the Diagnostics name ((g) and (f) redox-mottled, (h) cutanic, (x) brittle-B). The decomposition letters of L and O (f, m, h; FAO i, e, a) are fibric, mesic and humified. An r on a C is a reductimorphic C only in the New Zealand notation (declared, or a site in New Zealand); elsewhere Cr is weathered rock. The ss of slickensides (FAO/USDA) is not an s. Transitional horizons are not read as their masters unless the key says so. A row with no designation, or one that cannot be read (or a whole profile in a notation declared as another system's), may be any horizon, rows below the last designated one included."
  - topic: "Texture groups"
    page: "Key to Soil Orders (Ultic, Melanic, Granular, Brown, Pallic); not defined in the NZSC"
    reading: "Sandy is a sand or loamy sand texture (lab: silt plus twice the clay below 30 %); clayey is 35 % clay or more (or a clay, silty clay or sandy clay texture); loamy is between. Field textures are read from New Zealand words (silt loam, clay loam ...) or Australian codes, lab particle sizes otherwise. Fine loamy sand or finer (Pallic Soils): any texture finer than sand except a coarse or medium loamy sand."
  - topic: "Organic soil material"
    page: "Diagnostics, organic soil material; Key to Soil Orders, O"
    reading: "An L or O horizon; otherwise 18 % or more carbon (oc_pct), or more than 20 % unrubbed fibre; a measured carbon below 18 % with no fibre recorded is mineral. Accumulated under wet conditions: an O horizon of the New Zealand notation; an L horizon is litter; an undesignated organic horizon, or an O of another notation (USDA's Oi, Oe and Oa are also forest floors), by the site drainage (poorly or very poorly drained). Lm and Lh: an L with m or h; an L with no decomposition letter may be either. The O horizons are cumulative within 60 cm of the soil surface (item 1 says so); the Lm and Lh horizons are one layer 35 cm or more thick within it (item 2 does not)."
  - topic: "Reductimorphic horizon and gley profile form"
    page: "Diagnostics, reductimorphic horizon, low-chroma colours, gley profile form; Key to Soil Orders, G"
    reading: "In a designated horizon the notation decides: a g or r suffix, or an O horizon (peat); the low-chroma colours of the definition decide only for a row with no designation (moist matrix value 4 or more with chroma 2 or less, or value 6 or more with chroma 3 or less). Hugo's decision, 2026-10-28: the text also identifies the horizon by g or r, and pale B horizons of Pallic Soils have low chroma without reduction. The gley profile form is a reductimorphic horizon with its top less than 30 cm from the mineral soil surface (a top at 30 cm or deeper is the mottled profile form); the horizon runs down through adjacent reductimorphic rows, and its lower boundary is where that run ends. A lower boundary shallower than 90 cm passes over a lithic (R) or paralithic (CR) contact, over a permeable sandy-skeletal layer (sandy, more than 35 % coarse fragments) whose base reaches 90 cm, or when the reductimorphic horizon reaches the base of the B horizon (Hugo's decision, 2026-10-28: 'or to the base of the B horizon' is read as an alternative for the reductimorphic horizon, as in the 3rd edition's list). The exclusion of pedal horizons with low chroma only on ped faces is the surveyor's, in the notation (g against (g)). A recorded fragipan of unrecorded matrix chroma may be one of chroma 3 or more."
  - topic: "Allophanic soil material"
    page: "Diagnostics, allophanic soil material"
    reading: "A measured P retention decides the first part (85 % or more passes, less fails); the four field tests (sensitive or strongly sensitive, very weak or weak moist strength, non or slightly sticky, a strong reactive-aluminium test) stand in only when P retention is not measured (Hugo's decision, 2026-10-28). The dry bulk density below 0.9 Mg/m3 is always required; not measured, the material is undecided."
  - topic: "Vitric soil material"
    page: "Diagnostics, vitric soil material; Key to Soil Orders, M"
    reading: "More than 35 % coarse fragments of which 60 % or more rhyolitic pumice: coarse fragments whose layer or rock origin names pumice; or more than 40 % sand with more than 30 % volcanic glass, volcanic_glass_pct read as a share of the sand grains. A layer is a run of adjacent vitric horizons."
  - topic: "Weathered-B horizon"
    page: "Diagnostics, weathered-B horizon"
    reading: "A B horizon (not a pan, not a transitional horizon) marked w; otherwise one with a pedal structure (weak or stronger, not massive or single grain), a redder hue or higher chroma than the horizon directly below it in the same material, or less carbonate than it. A mineral row with no designation showing any of these may be one (it may also be an A); a designated horizon of another kind is not."
  - topic: "Distinct topsoil"
    page: "Diagnostics, distinct topsoil"
    reading: "An A horizon (at the surface or buried) 5 cm or more thick with the A and any L or O horizons directly over it, whose moist value or chroma is less than that of the horizon directly below it."
  - topic: "Diagnostics read from the notation"
    page: "Diagnostics"
    reading: "Argillic (a B or BC): a t suffix, clay lamellae, or 5 % more clay than the horizon above in the same material with clay coatings, or under an eluvial horizon at an abrupt or sharp boundary. Cutanic (an E, B or BC): (h). Cutanoxidic: a cutanic, clayey B with polyhedral peds of 2-6 mm, moderately sticky or stickier and very plastic (its friable-failure and dusty-face criteria are not recorded). Oxidic: Bo. Eluvial: an E. A mineral row with no designation may be any of these, unless what is recorded rules it out. Transitional horizons count only where a definition names them (BC for argillic and cutanic). Podzolic-B: a Bh (route 1); a Bs under an eluvial horizon, or a B 5 cm or more thick under one with a strong reactive-aluminium test and earthy structure, weak blocks or polyhedra, or very weak or weak strength (route 2); a Bs with no eluvial horizon above stays undecided, as the dark coatings of route 3 are not recorded. 'In some part' is a subhorizon (adjacent rows) 10 cm or more thick; a horizon (or set of horizons) thinner than 10 cm in all is read whole. Fragipan x, brittle-B (x), duripan qm, humus-pan Bhm, ironstone-pan Blm, ortstein-pan Bsm, placic Bfm, or the recorded pan_type. Sodic features: an n, or an ESP of 6 or more (or 0.7 cmol/kg Na) with blocky or prismatic peds. Calcareous: a k, carbonate segregations, CaCO3 or a reaction to HCl; with no carbonate recorded, pH in water below 7.0 reads as no carbonate."
  - topic: "Features not recorded"
    page: "Key to Soil Orders"
    reading: "A fluidity class, a pan, skeletans, strongly indurated non-quartz coarse fragments and a worm-mixed horizon at the base of the A that are not recorded are read as absent (they are recorded when met), as for the Australian key. Field tests and measured properties that are not recorded (pH, P retention, bulk density, Childs' test, colours) leave what reads them undecided."
  - topic: "Ultic Soils"
    page: "Key to Soil Orders, U"
    reading: "The base of the A horizon is the bottom of the A horizons from the mineral soil surface (the mineral soil surface itself with no A). Clay or humus coatings on 10 % or more of ped faces: common or many clay films; few is undecided; with no amount recorded, a t or (h) suffix. The B horizon's criteria are read on its major part; its base lies deeper than 100 cm, undecided when the description ends in the B above that depth. Less silt than clay unless there are weathered rock fragments: with rock fragments recorded (their weathering is not) it is undecided."
  - topic: "Podzol Soils"
    page: "Key to Soil Orders, Z"
    reading: "pH below 5.5 in some part (10 cm or more) is read on the podzolic-B horizon or ortstein-pan itself; a humus-pan passes alone."
  - topic: "Melanic Soils"
    page: "Key to Soil Orders, E"
    reading: "The parent material is read from site$parent_material and the layer and rock origins (limestone, marl, calcareous, chalk, dolomite, shells; basalt, basic, mafic, dolerite, gabbro, scoria; ultramafic, serpentinite, peridotite, dunite); none recorded, undecided ('non-calcareous' is not calcareous). The visible HCl reaction is read in the matrix (effervescence, a k, CaCO3; segregations alone leave it open) at 60 cm or less. Cracks 4 mm wide count only with their depth recorded (30 cm or more). Coarse rock fragments in the B count as not very highly or completely weathered (their weathering is not recorded); the criteria of item 4 are read in some part (10 cm or more)."
  - topic: "Semiarid Soils"
    page: "Key to Soil Orders, S"
    reading: "Evidence of pedogenic carbonate: recorded carbonate segregations; a k marks any calcareous horizon, primary or secondary, and leaves it open. 'No primary carbonate' is read within 90 cm (the 150 cm limit belongs to the other criteria); carbonate there with no segregations may be primary. The sandy depth limit (150 cm) applies when more than half of the mineral horizons are sandy."
  - topic: "Pallic and Brown Soils"
    page: "Key to Soil Orders, P and B; Figure 2"
    reading: "Colour classes (moist matrix): pale, hue 10YR or yellower with chroma 3 or less and value 4 or more; intermediate, hue 10YR or yellower with chroma 4 or 5 (or chroma 3 with value 3), or hue 2.5Y or yellower with chroma 6 or more; brown, hue 7.5YR or redder, or 10YR with chroma 6 or more. P retention and the reactive-aluminium test are read in the uppermost subhorizon of the B horizon 10 cm or more thick. 'Hue 10YR or yellower' runs from 10YR to 10Y; a neutral (N) hue counts, with chroma 0; red-purple hues are redder than R. Value and chroma are read to the nearest chip (continuous Munsell notations, as from spectra, fall between them). The Brown Soils' B horizons below a lithologic discontinuity (a prefix) are not counted."
  - topic: "Anthropic Soils"
    page: "Key to Soil Orders, A; Diagnostics, anthropic soil material"
    reading: "Anthropic soil material: an e prefix, a layer origin naming fill, spoil, dredged, garbic, urbic or similar material, or recorded artefacts. Truncation by human action is read from site$anthropic_truncation. Mainly manufactured materials: more than half artefacts, by thickness over the anthropic soil material as a whole."
  - topic: "Notes to the key"
    page: "Key to Soil Orders, opening notes"
    reading: "Overthickened A horizons: the note applies to a soil recorded as having one (site$overthickened_a; the term is not defined), whose A reaches 45 cm, with no more than 30 cm of anthropic soil material within 90 cm and no mottles within 30 cm: the key starts at Recent Soils. A surface layer of new material under 30 cm is not detected (it would have to be recorded); restored Anthropic Soils key to the order their properties meet, as the key's order gives."
  - topic: "Oxidic and Granular Soils"
    page: "Key to Soil Orders, X and N"
    reading: "Oxidic: a Bo, or an A horizon with the properties of an oxidic horizon, with a lower boundary 30 cm or more down; an A's oxidic properties are not recorded, so an A with no reaction to the reactive-aluminium test recorded may have them (undecided). Granular: coarse fragments not recorded are read as none, as for the Australian key; rock fragments recorded, whose weathering is not, leave the clayey weathered-B criterion open."
  - topic: "Groups: features recorded when met"
    page: "Keys to groups"
    reading: "Hugo's decision, 2026-10-28: sedimentary stratification, nodules and concretions, cracks, refuse and Maori cultural layers, permafrost and cryoturbation, surface water, mechanical mixing, jarosite and a densipan mark are recorded when met, so a profile that does not record them has none. So are an irregular carbon profile (Recent Gley Soils), a positive Childs' test and long saturation (Gley Raw Soils). Measured properties (pH, P retention, carbon, Ca and Mg, COLE, colours) leave what reads them undecided. Hydrothermal ground is recorded when met too: with neither the soil temperature at 30 cm nor the air temperature recorded the soil is not hydrothermal; one of them alone leaves it open."
  - topic: "Slowly permeable layer"
    page: "Diagnostics, slowly permeable layer"
    reading: "A measured Ksat (ksat_mm_h) decides: below 4 mm/h. Otherwise the morphology: pedal with peds coarser than 10 mm and a degree of packing for their size (ped_size_max_mm read as the size of most peds; 20-50 mm, more than 50 and less than 100 mm, 100 mm or more), sand or loamy sand extremely highly packed, or another texture group at least highly packed; a packing not recorded reads as none. Hugo's decision, 2026-10-28: the horizons the text names as often working as a slowly permeable layer count as one: fragipans, argillic horizons, densipans, humus-pans, ortstein-pans, and lithic (R) and paralithic (CR) contacts; a horizon that may be an argillic horizon or a densipan leaves the layer open."
  - topic: "Perch-gley features and redox segregations"
    page: "Diagnostics, perch-gley features, redox segregations, redox-mottled horizon"
    reading: "Redox segregations are read from redoximorphic_features_pct, or from the notation (g, (g), (f)) when no percentage is recorded; an r (uniformly reduced) marks no segregations. Perch-gley features: redox segregations mainly within peds or within the matrix (redox_segregations_location), or a horizon with redox segregations directly over one with fewer (a lower percentage, or none) that is not reductimorphic. A redox-mottled horizon has 2 % or more and is not reductimorphic; the notation (g) or (f) decides for a designated horizon."
  - topic: "Gley profile form"
    page: "Diagnostics, gley profile form"
    reading: "In the keys to groups the gley profile form is its definition only: a reductimorphic horizon with its top less than 30 cm from the mineral soil surface (the further conditions of the Gley Soils order do not apply)."
  - topic: "Peaty topsoil"
    page: "Diagnostics, peaty topsoil"
    reading: "The topsoil starts below any litter (L) at the surface. 10 cm or more of peat (an O horizon, a peat or peaty field texture, or 17.4 % carbon or more, reading organic matter as 1.72 times the carbon), or of slightly peaty material (a slightly peaty texture, or 9.9-17.4 % carbon) with less than 18 % clay. Saturated for 30 or more consecutive days: water_saturation_days of 30 or more in the upper 10 cm of the topsoil, else a poorly or very poorly drained site; the requirement does not apply on an artificially drained site (site$artificially_drained)."
  - topic: "Tephric soil material"
    page: "Diagnostics, tephric soil material"
    reading: "A layer or rock origin naming tephra (tephra, tephric, pyroclastic, volcanic ash, lapilli, scoria, pumice, volcanogenic, a non-welded ignimbrite), the site's parent material for rows with no origin of their own; or volcanic glass in the sand (volcanic_glass_pct): more than 40 %, or more than 10 % from an andesitic or basaltic source. A recorded origin of another kind is not tephric (with 10-40 % glass as well); nothing recorded leaves it open."
  - topic: "Sulfuric soil material"
    page: "Diagnostics, sulfuric soil material"
    reading: "pH in water below 4.0 (below 3.0 in organic soil material) and jarosite, 0.05 % or more sulfate S (sulfate_s_pct), or sulfidic material directly below (sulfidic_s_pct above 0.01 %). It is ruled out only when both the sulfate and the sulfide below are measured and short. Sulfuric Gley Soils: in some part (10 cm) within 90 cm."
  - topic: "Fluvial features"
    page: "Diagnostics, fluvial features; Keys to groups of Recent and Raw Soils"
    reading: "A landform the Diagnostics list on the site (floodplains, estuarine and lacustrine surfaces, fans, levees, backplains, bars, channels, deltas, benches, outwash plains, swamps), or rows of fluvial origin (layer_origin naming alluvium, fluvial, estuarine, lacustrine), sedimentary bedding in a C or transitional C (stratification_pattern; a lithologic break is not bedding), or a moderately or very fluid horizon within 120 cm of the soil surface; a buried A confirms only with one of these. Not buried by more than 30 cm: the rows of another recorded origin (tephra, loess, aeolian, colluvium, fill) over the uppermost evidence are 30 cm or less in all; on a fluvial landform the evidence starts at the first row of no other recorded origin."
  - topic: "Organic groups"
    page: "Key to groups of Organic Soils"
    reading: "Fresh litter (Lf) is not organic soil material. Litter Organic Soils: the organic soil material all in L horizons (Lm, Lh; an L with no letter leaves it open) on a site that is not very poorly drained (drainage_class, else drainage). Fibric, Mesic and Humic: the organic soil material from its upper surface to 60 cm (or its base) by accumulated thickness, the O horizons and the Lm and Lh by their letters, other organic material as of unknown decomposition; the group whose decomposition has the largest thickness. A tie, or unknown material that could change it, leaves it undecided (the key has no default)."
  - topic: "Recent Gley Soils"
    page: "Key to groups of Gley Soils, GR"
    reading: "Sedimentary stratification at 60 cm or less (stratification_pattern; a lithologic break is not stratification); an irregular carbon profile is a buried A, or more organic carbon in a horizon than in the one above it, between 30 and 120 cm. Any B or BC, a pan in the B included, with its base below 30 cm excludes the group. Nodules or concretions larger than 2 mm: the recorded ferric, manganiferous and bauxitic nodules (their size is not recorded) or an i suffix. A row with no designation reaching below 30 cm may be a B or BC."
  - topic: "Mafic groups and the horizon at 60 cm"
    page: "Keys to groups of Melanic and Brown Soils, EM and BM"
    reading: "The subhorizon of the B or BC at 60 cm is the row that contains 60 cm, or the deepest B or BC row when the B or BC ends at 60 cm or higher. Mafic or ultramafic fragments: a rock origin (the row's, else the site's parent material) naming basalt, dolerite, gabbro, mafic or ultramafic rocks, serpentinite, peridotite, dunite or ophiolite; andesite is intermediate, not mafic, and tuffaceous greywacke does not count. Fragments not recorded on a mafic origin leave it open."
  - topic: "Vertic Melanic Soils"
    page: "Key to groups of Melanic Soils, EV"
    reading: "Cracks 4 mm wide count with their recorded depth (30 cm or more); cracks infilled with A material are not recorded apart from these. The COLE route reads cole_value (0.09 or more) and moderate or strong blocky or prismatic peds, both in the major part of the B: a COLE not measured leaves it open when the B is so structured."
  - topic: "Anthropic groups"
    page: "Key to groups of Anthropic Soils"
    reading: "Truncated: site$anthropic_truncation, and the first in situ mineral horizon (not marked e and not of a fill or relocated origin) is not an A, AB or A/B, with its top within 30 cm of the soil surface. Maori: maori_cultural_layer rows 30 cm or more in all, with the uppermost less than 90 cm down. Refuse: a layer whose origin names refuse, garbage, landfill, rubbish, waste or plastic, 30 cm or more thick with its top less than 90 cm down, or site$methane_odour. Mixed: site$mechanical_mixing_depth_cm above 30."
  - topic: "Raw groups"
    page: "Key to groups of Raw Soils"
    reading: "Hydric: site$surface_water 'most of the time' (not almost constantly). Gley: from the mineral soil surface to 30 cm, the top of a reductimorphic horizon, a positive Childs' test, or water_saturation_days of 30 or more (read as consecutive). Cryic: permafrost_temp_C of 0 or below, ice, or a cryoturbation mark (jj, @) within 1 m. Tephric: tephric soil material of 50 % or more coarse fragments (predominantly gravel-sized) whose origin names basalt, andesite, scoria, mafic or intermediate material."
  - topic: "Sandy groups"
    page: "Keys to groups of Gley, Brown, Recent and Raw Soils"
    reading: "Sand or loamy sand (the sandy texture group) with less than 35 % coarse rock fragments in every horizon of the window; coarse fragments not recorded read as none, rock and organic rows are not sand, and any horizon of the window that fails decides. Sandy loam lamellae that are not an argillic horizon may occur in the Sandy Brown and Sandy Recent Soils. A window with no horizon in it (an A reaching 60 cm) is undecided."
  - topic: "Podzol groups"
    page: "Key to groups of Podzol Soils"
    reading: "Perch-gley and Groundwater-gley Podzol Soils need an eluvial horizon in every option (with low-chroma colours, with a peaty topsoil, or, for the Perch-gley ones, a placic horizon with redox segregations in it). Groundwater-gley: the low-chroma BC or C (undesignated mineral rows may be one) surely extending below 90 cm, or with redox segregations mainly on voids or skeletans; an open last bottom leaves the depth open. Pan Podzol Soils: any subhorizon of the B, pans (Bsm, Bhm) included; single grain is not massive."
  - topic: "Allophanic and Pumice groups"
    page: "Keys to groups of Allophanic and Pumice Soils"
    reading: "Predominantly andesitic or basaltic parent material: site$parent_material, else the origin that dominates the described thickness; nothing recorded leaves a redox-mottled horizon open. Impeded Allophanic Soils: a slowly permeable layer, or a horizon at least weakly indurated (an m suffix, a cementation class, a recorded pan), with its top less than 90 cm down. Impeded Pumice Soils: a slowly permeable layer, or a compact brittle layer (a fragipan, a brittle-B, or a brittle consistence) with no roots (roots_abundance 'none'; not recorded leaves it open)."
  - topic: "Semiarid, Ultic and Brown group details"
    page: "Keys to groups of Semiarid, Ultic and Brown Soils"
    reading: "Solonetzic Semiarid Soils: in the argillic horizon, prismatic or blocky peds with coatings on more than 10 % of ped faces (common or many; few leaves it open) of value 4 or less (coatings_value_moist), and pH 8.6 or more in some part (10 cm) of it. Albic Ultic Soils: the B below the Eg or Er firm or stronger when moist (strength_moist). Oxidic Brown Soils: friable or very friable failure read from consistence_moist. Firm Brown Soils: an apedal subhorizon of the B or BC (pans included) slightly firm or stronger; an undesignated mineral row may be one."
  - topic: "Recent groups: subsurface and rock"
    page: "Key to groups of Recent Soils, RH and RX"
    reading: "Hydrothermal Recent Soils, pH route: a subsurface horizon is one below the uppermost mineral horizon that is not a surface A (a buried A counts), with pH 4.8 or less in some part (10 cm) within 60 cm. Rocky Recent Soils: a lithic or paralithic contact less than 10 cm below the base of the A horizon. Outside the New Zealand notation a Cr is a paralithic contact."
  - topic: "Depth limits and open bottoms"
    page: "Keys to groups"
    reading: "'Within N cm' is read as less than N cm (as the gley and mottled profile forms set the limit), 'at N cm or less' as up to and including N. An open last bottom counts as deep for a thickness; for the major part of a B whose last row is open, the closed rows decide, and the open row only when it agrees with them."
  - topic: "Sulfidic soil material"
    page: "Diagnostics, sulfidic soil material; keys to subgroups of Organic and Gley Soils"
    reading: "More than 0.01 % inorganic sulfide S (sulfidic_s_pct) decides when measured. Not measured, Hugo's decision of 2026-10-28: the text says sulfidic material in the field is waterlogged and meets the reductimorphic horizon with a hue of 5Y or less red, or is black; a horizon that cannot look so (not reductimorphic, or of a redder hue and not black) is not sulfidic, and one that can stays undecided. Black is a moist value of 2.5 or less with chroma 1 or less, or a neutral hue; 5Y or less red runs from 5Y to PB (purple is redder again). The paired field pH test is a pre-screen in the text and is not read."
  - topic: "Saline soil material"
    page: "Diagnostics, saline soil material; keys to subgroups of Gley Soils"
    reading: "An EC of a 1:5 soil:water extract (ec_1to5_dS_m) above 0.8 dS/m (0.8 mS/cm), or the notation suffix z. Not measured, Hugo's decision of 2026-10-28: a designated horizon without z is not saline (the notation marks saline material); a row with no designation stays undecided. The saturated-paste EC (ec_dS_m) is not read, as the text names the 1:5 extract. 'Within 60 cm of the mineral soil surface' is any horizon with its top less than 60 cm down. In the Fluid-saline Sulfuric Gley Soils the fluid and the saline horizons may be different horizons within 60 cm."
  - topic: "Peaty topsoils in the subgroups"
    page: "Diagnostics, peaty topsoil; keys to subgroups of Gley Soils"
    reading: "A peaty topsoil at the surface (below any litter), or one buried by new material (the text: up to 60 cm of it) with its upper surface less than 60 cm from the surface the subgroup names (the soil surface or the mineral soil surface). A buried one is a run of peat or peaty rows, 10 cm or more thick, starting at an O or A horizon (or a row of unknown role) directly under material that is not peat; peat is read from the carbon when measured, otherwise from the field texture (a recorded mineral texture is not peat); the saturation of 30 days is read as for the topsoil at the surface (water_saturation_days of its upper 10 cm, else the site drainage; artificially drained sites pass)."
  - topic: "Sphagnum peat and shelly layers"
    page: "Keys to subgroups of Organic Soils (OFS) and Gley Soils (GRC)"
    reading: "Recorded when met (Hugo's decision, 2026-10-28): sphagnum_fibres_pct, the share of the organic fibres that are Sphagnum, not recorded reads as none; the Sphagnic Fibric Organic Soils need more than 70 % as the thickness-weighted share of the organic soil material to 60 cm from the soil surface (or to its base). A shelly layer (shelly_layer) not recorded reads as none. The Acid Fibric, Mesic and Humic Organic Soils weigh the pH over the same organic material (mineral interlayers left out). The Buried-podzol Litter Organic Soils read the podzolic-B of the mineral soil under the litter whether or not its horizons carry the buried prefix."
  - topic: "Subgroups with no default"
    page: "Key to subgroups of Ultic Soils, UD and UP"
    reading: "The text gives the Densipan Ultic Soils only UDP and UDM, and the Perch-gley Ultic Soils only UPS and UPT, with no 'other soils'. Hugo's decision, 2026-10-28: a profile that passes none keeps the group name (Densipan Ultic Soils), with a warning that no subgroup passed. The Perch-gley Ultic Soils always have the reductimorphic horizon UPT asks for, as their group needs a gley profile form."
  - topic: "Mottled profile form"
    page: "Diagnostics, mottled profile form; keys to subgroups of Ultic Soils"
    reading: "A redox-mottled horizon of the (g) kind with its top less than 30 cm from the mineral soil surface, or a reductimorphic horizon whose upper boundary (the top of its run of adjacent reductimorphic rows) lies at 30 cm or more and less than 60 cm. The (g) kind (2 % or more redox segregations with low-chroma colours on less than half of the matrix) is what the mottled profile form and the UDM and UEM keys ask for; the 4th edition excludes (f) horizons from the mottled profile form (its Changelog). A designated horizon is read by its notation ((g)); a row with no designation and 2 % or more segregations stays undecided, as the share of low-chroma colours is not recorded."
  - topic: "Coatings in the subgroups"
    page: "Keys to subgroups of Gley (GAY, GAPH, GAH) and Ultic Soils (UYZ, UYMZ)"
    reading: "10 % or more coatings on ped faces: common or many clay films (clay_films_amount) pass, few leaves it open, none or very few fail; with none recorded, a designated horizon fails unless its notation marks coatings (t, h, (h)), which leaves it open. Dark coatings: moist value 4 or less (coatings_value_moist); in the Placic-humose and Humose Acid Gley Soils also value 5 with chroma 3, which stays open as the coatings chroma is not recorded (the Podzolic Yellow Ultic Soils admit only value 4 or less); humus coatings (h, (h)) are dark. Podzolic Yellow Ultic Soils: pH 4.8 or less in some part of the eluvial horizon, or, with none, in the uppermost B subhorizon."
  - topic: "Gley subgroup windows"
    page: "Key to subgroups of Gley Soils"
    reading: "Granular Acid Gley Soils: the major part of the B horizon to 60 cm, or to its base when shallower (pans aside), is clayey, moderately or strongly pedal, cutanic or argillic, with polyhedral peds of 20 mm or less (ped_size_max_mm); cutanic is the (h) notation or recorded coatings of moist value 4 or less (v0.9.300: value 5 stays open, as the coatings chroma is not recorded). Melanic Orthic Gley Soils: the major part of the B horizon to 60 cm, or to its base when shallower. Sandy-saline Sulfuric Gley Soils: sandy by weighted average to 90 cm when every horizon of the window has lab silt and clay (silt plus twice the clay below 30 %, weighted by thickness); otherwise a window all sandy passes and one with no sandy horizon fails. Concretions: ferric, manganiferous and bauxitic nodules together above 2 %, or the i suffix; recorded when met. 'At 60 cm or less' includes a top at 60 cm."
  - topic: "Yellow Ultic subgroup details"
    page: "Key to subgroups of Ultic Soils, UYG and UYBG"
    reading: "Magnesic Yellow Ultic Soils: both options are read in some part of the B horizon to 60 cm; ultramafic fragments are those whose rock origin (else the site's parent material) names ultramafic rock, serpentinite, peridotite, dunite, pyroxenite, harzburgite or lherzolite; coarse fragments not recorded read as none; an exchangeable Ca:Mg not measured leaves the option open. Buried-granular Yellow Ultic Soils: the texture contrast is read at the top of a clay horizon (texture class clay, from the field texture or else the lab triangle) of moist value 4 or less (the text does not say moist or dry) lying 35 cm or more down, directly under a silt loam or silty clay horizon, with silt loam or silty clay the major part from the soil surface to it."
  - topic: "Subgroup names"
    page: "Keys to subgroups of Gley and Ultic Soils"
    reading: "Two names are written as their groups write them: Typic Sulfuric Gley Soils (the text writes 'Typic Sulphuric Gley Soils', and 'Sulfiric' in the heading) and Typic Yellow Ultic Soils (the text writes 'Soil')."
  - topic: "Windows the description does not reach"
    page: "Keys to subgroups"
    reading: "Sulfidic and saline soil material, and the sandy weighted average of the Sandy-saline Sulfuric Gley Soils, are measured materials: where the description ends above the window (and not on rock or a hard layer) the part below may hold them, so a verdict that would be no stays undecided, as the order key reads an uncovered window. Features recorded when met (fluid horizons, concretions, pans, shelly layers) stay absent below the description. Under the litter, the Buried-podzol and Buried-gley Litter Organic Soils are undecided when no mineral soil is described, or (Buried-gley) when the description ends less than 30 cm into it. The acidic subgroups read the base of the A horizon both ways when a mineral row of unknown role lies directly under the A, and decide only when both agree. A gap in the description directly above the clay of the Buried-granular Yellow Ultic Soils leaves the texture contrast open; a densipan with no depths leaves the horizons below it open; a pan (m) is not an argillic horizon."
  - topic: "Bh horizons in the Podzol subgroups"
    page: "Key to subgroups of Podzol Soils; Diagnostics, podzolic-B horizon"
    reading: "A Bh is a B horizon marked h (Bh, Bhs; a humus-pan Bhm is a pan, not a Bh); its thickness is that of adjacent Bh subhorizons. A mineral row with no designation may be a Bh unless its moist colour (value and chroma 3 or less, or value 4 with chroma 2) or its carbon (1 % or more) rules it out; the Bh needs no eluvial horizon. A humus-pan (Bhm) is read as a pan, not as a Bh. 'Thicker than 5 cm' (ZDYH, ZPHQ, ZPHP, ZPH, ZGH, ZOH) is more than 5 cm; ZDH reads 5 cm or more; ZXJH and ZXH ask for a Bh of any thickness. Ultic-humose Densipan Podzol Soils, Hugo's decision of 2026-10-28: the Bh tops a B horizon that is clayey and prismatic as a whole, read from the B row directly below the Bh, or from the Bh itself when no B lies below it."
  - topic: "Horizons beneath others, and pans at any depth"
    page: "Key to subgroups of Podzol Soils (ZDJH, ZXJH, ZOJH)"
    reading: "An argillic horizon beneath a Bh (ZDJH, ZOJH), or beneath the ortstein-pan or placic horizon (ZXJH), has its top at or below the base of that horizon, not necessarily directly; a pan (m) is not an argillic horizon. The Podzol subgroups name no depth for the humus-pans, ortstein-pans, placic horizons and fragipans they read: a pan at any depth counts. An ironstone-pan or duripan 'within 90 cm' (LPI, LIMI, MPU) has its top less than 90 cm down; the 'at 90 cm or less' of GOI includes a top at 90 cm."
  - topic: "Fluid Perch-gley Podzol Soils"
    page: "Key to subgroups of Podzol Soils, ZPF"
    reading: "A moderately or very fluid horizon in some part (10 cm or more) above the top of the podzolic-B horizon; a fluidity not recorded is non-fluid, as elsewhere. When rows of undecided podzolic-B status lie above the first sure one, each of their tops is tried as the top of the podzolic-B, and the verdict holds only when all agree."
  - topic: "Silt-mantled Perch-gley Podzol Soils"
    page: "Key to subgroups of Podzol Soils, ZPOZ and ZPZ"
    reading: "Hugo's decision, 2026-10-28: a silty layer is one of the silt, silt loam, silty clay loam or silty clay classes (the field texture, else the lab triangle); the layer is the adjacent silty rows around the eluvial horizon, 15 cm or more thick in all (organic material, litter and rock are not silty). The eluvial horizon is slightly firm or stronger when moist, and apedal massive (structureless with no structure type recorded may be single grain) or prismatic with peds of 60 to 200 mm (ped_size_max_mm, the upper limit of the size class)."
  - topic: "A peaty topsoil named alone"
    page: "Keys to subgroups of Podzol (ZPOZ), Allophanic (LGO) and Melanic Soils (ERO)"
    reading: "These subgroups name a peaty topsoil and no buried one, unlike the Gley subgroups, which name a buried one too: only a peaty topsoil at the surface (below any litter) counts."
  - topic: "Acidic and allophanic B or BC horizons"
    page: "Keys to subgroups of Allophanic (LOVA, LOA) and Melanic Soils (EML, EMA)"
    reading: "Read in some part of the B or BC horizon (pans aside) to 60 cm (LOVA, LOA, EMA) or within 90 cm (EML) of the mineral soil surface; a mineral row of unknown role may be either, so the verdict holds only when it is the same with that row read as B and as not B (a thin B is read whole only when it is the whole B). The same holds for the magnesic criteria of EMG and UYG. pH below 5.5 is the acidic test. The coatings on pores (not root linings) or gel-like masses of LOVA and LOA, Hugo's decision of 2026-10-28: three new attributes (pore_coatings_hue_moist, pore_coatings_value_moist, pore_coatings_chroma_moist), hue 7.5YR or redder with value 5 or less and chroma 3 or more; not recorded is none, so the pH decides alone. LOVA names the place only for the pH: its coatings are read in the same B or BC to 60 cm, as LOA reads both. EML: as for allophanic soil material (Hugo's decision, 2026-10-28), a measured P retention decides; otherwise a strong reactive-aluminium test."
  - topic: "Vitric Orthic Allophanic Soils"
    page: "Key to subgroups of Allophanic Soils, LOVA and LOV"
    reading: "The allophanic soil material is formed predominantly from tephric soil material when its tephric rows are more than half of its thickness; its sand is the thickness-weighted average of the lab sand or, where that is not measured, of the range of the texture class (USDA triangle), and decides only when the whole range lies on one side of 50 %. Rows of undecided allophanic status are tried in every filling (up to eight such rows), and rows with no bottom weighed both lightly and heavily; the verdict holds only when the readings agree."
  - topic: "Buried-granular Orthic Allophanic Soils"
    page: "Key to subgroups of Allophanic Soils, LOBG"
    reading: "The non-allophanic B is the run of adjacent B rows that starts at the first B under the allophanic soil material whose material is not allophanic; it is read whether or not it carries the buried prefix. Rows of undecided allophanic status, and mineral rows of unknown role (which may be a B), are tried in every filling. To its base or to 90 cm from the mineral soil surface, whichever is less, every horizon is clayey and any rock fragments are saprolite or completely weathered (weathering_stage; fragments not recorded read as none); in its major part it is a cutanoxidic horizon, or a moderately or strongly pedal ('very strongly' read as strong) cutanic horizon (the (h) notation, or dark coatings of moist value 4 or less; value 5 stays open, as the coatings chroma is not recorded) or argillic horizon with polyhedral peds of 20 mm or less."
  - topic: "Impeded Pumice subgroups"
    page: "Key to subgroups of Pumice Soils, MIMC and MIC"
    reading: "Hugo's decision, 2026-10-28: any ignimbrite named in the layer or rock origin (else the site's parent material) is the Taupo ignimbrite of MIMC and MIC; an origin naming pumice, tephra or a pyroclastic deposit without saying ignimbrite may be one. 'At least densely packed' (not defined in the NZSC) is read as a packing degree of high or more, and firm or stronger moist strength is the alternative (one below its limit and the other not recorded leaves it open); brittle failure is recorded when met (the x or (x) notation, a brittle consistence or pan type), and a row with no designation and neither recorded may be brittle; the root barrier is roots_abundance none; the layer's top lies less than 90 cm from the mineral soil surface."
  - topic: "Orthic Pumice subgroups"
    page: "Key to subgroups of Pumice Soils, MOZ to MOT"
    reading: "MOZ, Hugo's decision of 2026-10-28: 'hue 7.5YR or more' is 7.5YR or redder (MOI asks for 10YR or yellower), in adjacent B rows more than 20 cm thick. MOL, Hugo's decision of 2026-10-28: the layer is itself vitric and meets allophanic soil material apart from the bulk density ('which also meets' asks both). MOBL: a vitric B or BC horizon (a row with no designation may be either) with its base less than 60 cm from the mineral soil surface, with directly below it a layer, vitric or not as the text allows, that meets allophanic soil material apart from the bulk density; a description that ends at that base leaves it open. MOS, Hugo's decision of 2026-10-28: a scoria of no named composition is basaltic (andesitic, dacitic or rhyolitic scoria is not); 'predominantly' is more than 50 % gravel-sized basaltic scoria by thickness-weighted average from the mineral soil surface to 25 cm (gravel_pct, else the coarse fragments; not recorded reads as none). MOI: a Bw by its notation, its adjacent Bw rows 30 cm or less thick in all, each of hue 10YR to 10Y (a neutral hue included) and chroma 4 or less to the nearest chip, as the colour classes of the Pallic Soils read them. The key gives MOT no name; the chapter's summary table names it Typic: Typic Orthic Pumice Soils."
  - topic: "Melanic subgroup details"
    page: "Key to subgroups of Melanic Soils"
    reading: "Redox segregations within 60 cm (EVMC, EVM): a recorded percentage, or the g, (g) or (f) notation, in a mineral horizon with its top less than 60 cm down (recorded when met). A calcareous horizon 'within 90 cm' (EVMC, EVC) has its top less than 90 cm down; 'an upper surface at 90 cm or less' (EO) includes a top at 90 cm. EPV reads the vertic criteria of the Vertic Melanic Soils (cracks 4 mm or wider reaching 30 cm, or a COLE of 0.09 or more with moderate or strong blocky or prismatic peds in the major part of the B) without their condition on redox segregations, and without a COLE stays undecided as the group does, unless a recorded grade below moderate or a type other than blocky or prismatic rules the pedality out. ERW: adjacent weathered-B or cutanic rows 10 cm or more thick. EMG: as UYG, in the B or BC horizon. EODC: adjacent moderately or strongly pedal weathered-B rows 15 cm or more thick starting at the base of the A horizon; a mineral row of unknown role directly under the A may be A too, so both bases are tried."
