# How soilKey reads the New Zealand Soil Classification, 4th ed. (Quarto
# source of 7 October 2026), where the text is silent or leaves a choice.
# Summarised in soilKey's own words; the text is Manaaki Whenua's.
readings:
  - topic: "Mineral soil surface and soil surface"
    page: "Key to Soil Orders; Diagnostics"
    reading: "The mineral soil surface is the top of the first horizon that is not organic soil material (below any L or O horizons); the soil surface is the top of the first horizon. Depths are measured from the one the key names."
  - topic: "Horizon notation"
    page: "Diagnostics (the notation each diagnostic gives)"
    reading: "The New Zealand notation is read: lithologic prefixes (2, 3), lower-case prefixes e (anthropic soil material) and b (buried; a trailing b, as in the FAO notation, also reads as buried), masters L, O, A, E, B, C, CR and R, suffixes (w, t, h, s, o, g, r, x, k, d, n, z, i, p, and the pans qm, hm, lm, sm, fm), and a suffix in parentheses as the weak expression the Diagnostics name ((g) and (f) redox-mottled, (h) cutanic, (x) brittle-B). The decomposition letters of L and O (f, m, h; FAO i, e, a) are fibric, mesic and humified. An r on a C is a reductimorphic C only in the New Zealand notation (declared, or a site in New Zealand); elsewhere Cr is weathered rock. The ss of slickensides (FAO/USDA) is not an s. Transitional horizons are not read as their masters unless the key says so. A row with no designation, or one that cannot be read (or a whole profile in a notation declared as another system's), may be any horizon, rows below the last designated one included."
  - topic: "Texture groups"
    page: "Key to Soil Orders (Ultic, Melanic, Granular, Brown, Pallic); not defined in the NZSC"
    reading: "Sandy is a sand or loamy sand texture (lab: silt plus twice the clay below 30 %); clayey is 35 % clay or more (or a clay, silty clay or sandy clay texture); loamy is between. Field textures are read from New Zealand words (silt loam, clay loam ...) or Australian codes, lab particle sizes otherwise. Fine loamy sand or finer (Pallic Soils): any texture finer than sand except a coarse or medium loamy sand."
  - topic: "Organic soil material"
    page: "Diagnostics, organic soil material; Key to Soil Orders, O"
    reading: "An L or O horizon; otherwise 18 % or more carbon (oc_pct), or more than 20 % unrubbed fibre; a measured carbon below 18 % with no fibre recorded is mineral. Accumulated under wet conditions: an O horizon of the New Zealand notation; an L horizon is litter; an undesignated organic horizon, or an O of another notation (USDA's Oi, Oe and Oa are also forest floors), by the site drainage (poorly or very poorly drained). Lm and Lh: an L with m or h; an L with no decomposition letter may be either. The O horizons are cumulative within 60 cm of the soil surface (item 1 says so); the Lm and Lh horizons are one layer 35 cm or more thick within it (item 2 does not)."
  - topic: "Reductimorphic horizon and gley profile form"
    page: "Diagnostics, reductimorphic horizon, low-chroma colours, gley profile form; Key to Soil Orders, G"
    reading: "In a designated horizon the notation decides: a g or r suffix, or an O horizon (peat); the low-chroma colours of the definition decide only for a row with no designation (moist matrix value 4 or more with chroma 2 or less, or value 6 or more with chroma 3 or less). Hugo's decision, 2026-10-28: the text also identifies the horizon by g or r, and pale B horizons of Pallic Soils have low chroma without reduction. The gley profile form is a reductimorphic horizon with its top less than 30 cm from the mineral soil surface (a top at 30 cm or deeper is the mottled profile form); the horizon runs down through adjacent reductimorphic rows, and its lower boundary is where that run ends. A lower boundary shallower than 90 cm passes over a lithic (R) or paralithic (CR) contact, over a permeable sandy-skeletal layer (sandy, more than 35 % coarse fragments) whose base reaches 90 cm, or when the reductimorphic horizon reaches the base of the B horizon (Hugo's decision, 2026-10-28: 'or to the base of the B horizon' is read as an alternative for the reductimorphic horizon, as in the 3rd edition's list). The exclusion of pedal horizons with low chroma only on ped faces is the surveyor's, in the notation (g against (g)). A recorded fragipan of unrecorded matrix chroma may be one of chroma 3 or more."
  - topic: "Allophanic soil material"
    page: "Diagnostics, allophanic soil material"
    reading: "A measured P retention decides the first part (85 % or more passes, less fails); the four field tests (sensitive or strongly sensitive, very weak or weak moist strength, non or slightly sticky, a strong reactive-aluminium test) stand in only when P retention is not measured (Hugo's decision, 2026-10-28). The dry bulk density below 0.9 Mg/m3 is always required; not measured, the material is undecided."
  - topic: "Vitric soil material"
    page: "Diagnostics, vitric soil material; Key to Soil Orders, M"
    reading: "More than 35 % coarse fragments of which 60 % or more rhyolitic pumice: coarse fragments whose layer or rock origin names pumice; or more than 40 % sand with more than 30 % volcanic glass, volcanic_glass_pct read as a share of the sand grains. A layer is a run of adjacent vitric horizons."
  - topic: "Weathered-B horizon"
    page: "Diagnostics, weathered-B horizon"
    reading: "A B horizon (not a pan, not a transitional horizon) marked w; otherwise one with a pedal structure (weak or stronger, not massive or single grain), a redder hue or higher chroma than the horizon directly below it in the same material, or less carbonate than it. A mineral row with no designation showing any of these may be one (it may also be an A); a designated horizon of another kind is not."
  - topic: "Distinct topsoil"
    page: "Diagnostics, distinct topsoil"
    reading: "An A horizon (at the surface or buried) 5 cm or more thick with the A and any L or O horizons directly over it, whose moist value or chroma is less than that of the horizon directly below it."
  - topic: "Diagnostics read from the notation"
    page: "Diagnostics"
    reading: "Argillic (a B or BC): a t suffix, clay lamellae, or 5 % more clay than the horizon above in the same material with clay coatings, or under an eluvial horizon at an abrupt or sharp boundary. Cutanic (an E, B or BC): (h). Cutanoxidic: a cutanic, clayey B with polyhedral peds of 2-6 mm, moderately sticky or stickier and very plastic (its friable-failure and dusty-face criteria are not recorded). Oxidic: Bo. Eluvial: an E. A mineral row with no designation may be any of these, unless what is recorded rules it out. Transitional horizons count only where a definition names them (BC for argillic and cutanic). Podzolic-B: a Bh (route 1); a Bs under an eluvial horizon, or a B 5 cm or more thick under one with a strong reactive-aluminium test and earthy structure, weak blocks or polyhedra, or very weak or weak strength (route 2); a Bs with no eluvial horizon above stays undecided, as the dark coatings of route 3 are not recorded. 'In some part' is a subhorizon (adjacent rows) 10 cm or more thick; a horizon (or set of horizons) thinner than 10 cm in all is read whole. Fragipan x, brittle-B (x), duripan qm, humus-pan Bhm, ironstone-pan Blm, ortstein-pan Bsm, placic Bfm, or the recorded pan_type. Sodic features: an n, or an ESP of 6 or more (or 0.7 cmol/kg Na) with blocky or prismatic peds. Calcareous: a k, carbonate segregations, CaCO3 or a reaction to HCl; with no carbonate recorded, pH in water below 7.0 reads as no carbonate."
  - topic: "Features not recorded"
    page: "Key to Soil Orders"
    reading: "A fluidity class, a pan, skeletans, strongly indurated non-quartz coarse fragments and a worm-mixed horizon at the base of the A that are not recorded are read as absent (they are recorded when met), as for the Australian key. Field tests and measured properties that are not recorded (pH, P retention, bulk density, Childs' test, colours) leave what reads them undecided."
  - topic: "Ultic Soils"
    page: "Key to Soil Orders, U"
    reading: "The base of the A horizon is the bottom of the A horizons from the mineral soil surface (the mineral soil surface itself with no A). Clay or humus coatings on 10 % or more of ped faces: common or many clay films; few is undecided; with no amount recorded, a t or (h) suffix. The B horizon's criteria are read on its major part; its base lies deeper than 100 cm, undecided when the description ends in the B above that depth. Less silt than clay unless there are weathered rock fragments: with rock fragments recorded (their weathering is not) it is undecided."
  - topic: "Podzol Soils"
    page: "Key to Soil Orders, Z"
    reading: "pH below 5.5 in some part (10 cm or more) is read on the podzolic-B horizon or ortstein-pan itself; a humus-pan passes alone."
  - topic: "Melanic Soils"
    page: "Key to Soil Orders, E"
    reading: "The parent material is read from site$parent_material and the layer and rock origins (limestone, marl, calcareous, chalk, dolomite, shells; basalt, basic, mafic, dolerite, gabbro, scoria; ultramafic, serpentinite, peridotite, dunite); none recorded, undecided ('non-calcareous' is not calcareous). The visible HCl reaction is read in the matrix (effervescence, a k, CaCO3; segregations alone leave it open) at 60 cm or less. Cracks 4 mm wide count only with their depth recorded (30 cm or more). Coarse rock fragments in the B count as not very highly or completely weathered (their weathering is not recorded); the criteria of item 4 are read in some part (10 cm or more)."
  - topic: "Semiarid Soils"
    page: "Key to Soil Orders, S"
    reading: "Evidence of pedogenic carbonate: recorded carbonate segregations; a k marks any calcareous horizon, primary or secondary, and leaves it open. 'No primary carbonate' is read within 90 cm (the 150 cm limit belongs to the other criteria); carbonate there with no segregations may be primary. The sandy depth limit (150 cm) applies when more than half of the mineral horizons are sandy."
  - topic: "Pallic and Brown Soils"
    page: "Key to Soil Orders, P and B; Figure 2"
    reading: "Colour classes (moist matrix): pale, hue 10YR or yellower with chroma 3 or less and value 4 or more; intermediate, hue 10YR or yellower with chroma 4 or 5 (or chroma 3 with value 3), or hue 2.5Y or yellower with chroma 6 or more; brown, hue 7.5YR or redder, or 10YR with chroma 6 or more. P retention and the reactive-aluminium test are read in the uppermost subhorizon of the B horizon 10 cm or more thick. 'Hue 10YR or yellower' runs from 10YR to 10Y; a neutral (N) hue counts, with chroma 0; red-purple hues are redder than R. Value and chroma are read to the nearest chip (continuous Munsell notations, as from spectra, fall between them). The Brown Soils' B horizons below a lithologic discontinuity (a prefix) are not counted."
  - topic: "Anthropic Soils"
    page: "Key to Soil Orders, A; Diagnostics, anthropic soil material"
    reading: "Anthropic soil material: an e prefix, a layer origin naming fill, spoil, dredged, garbic, urbic or similar material, or recorded artefacts. Truncation by human action is read from site$anthropic_truncation. Mainly manufactured materials: more than half artefacts, by thickness over the anthropic soil material as a whole."
  - topic: "Notes to the key"
    page: "Key to Soil Orders, opening notes"
    reading: "Overthickened A horizons: the note applies to a soil recorded as having one (site$overthickened_a; the term is not defined), whose A reaches 45 cm, with no more than 30 cm of anthropic soil material within 90 cm and no mottles within 30 cm: the key starts at Recent Soils. A surface layer of new material under 30 cm is not detected (it would have to be recorded); restored Anthropic Soils key to the order their properties meet, as the key's order gives."
  - topic: "Oxidic and Granular Soils"
    page: "Key to Soil Orders, X and N"
    reading: "Oxidic: a Bo, or an A horizon with the properties of an oxidic horizon, with a lower boundary 30 cm or more down; an A's oxidic properties are not recorded, so an A with no reaction to the reactive-aluminium test recorded may have them (undecided). Granular: coarse fragments not recorded are read as none, as for the Australian key; rock fragments recorded, whose weathering is not, leave the clayey weathered-B criterion open."
