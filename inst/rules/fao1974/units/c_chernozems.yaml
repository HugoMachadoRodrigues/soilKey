# The soil units of the Chernozems (C), FAO-Unesco Legend of the Soil Map of the
# World (FAO-Unesco 1974, Vol. I Legend), key p. 49, in the key's order;
# the last unit is the key's "Other ..." residual (default: true). Codes and
# names as printed; name_pt is soilKey's Portuguese gloss. The criteria are
# summarised in soilKey's words; no text of the book is shipped. The
# predicates are those of R/diagnostics-fao74.R and R/key-fao74.R; the
# readings in readings.yaml.

units:
  "C":
    - code: "Cl"
      name: "Luvic Chernozems"
      name_pt: "Chernozems Lúvicos (Luvic Chernozems)"
      page: 49
      tests:
        all_of: [{argillic_b_fao74: {}}]
      notes: "An argillic B horizon; a calcic or gypsic horizon may underlie it."

    - code: "Cg"
      name: "Glossic Chernozems"
      name_pt: "Chernozems Glóssicos (Glossic Chernozems)"
      page: 49
      tests:
        all_of: [{tonguing_fao74: {kind: chernozem}}]
      notes: "Tonguing of the A horizon into a cambic B or into a C horizon."

    - code: "Ck"
      name: "Calcic Chernozems"
      name_pt: "Chernozems Cálcicos (Calcic Chernozems)"
      page: 49
      tests:
        any_of:
          - calcic_fao74: {max_top_cm: 125}
          - gypsic_fao74: {max_top_cm: 125}
      notes: "A calcic or a gypsic horizon (no depth in the key: within 125 cm, Q10)."

    - code: "Ch"
      name: "Haplic Chernozems"
      name_pt: "Chernozems Háplicos (Haplic Chernozems)"
      page: 49
      tests:
        default: true
      notes: "Other soils of the group (the key's residual)."

