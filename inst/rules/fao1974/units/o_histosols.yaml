# The soil units of the Histosols (O), FAO-Unesco Legend of the Soil Map of the
# World (FAO-Unesco 1974, Vol. I Legend), key p. 43, in the key's order;
# the last unit is the key's "Other ..." residual (default: true). Codes and
# names as printed; name_pt is soilKey's Portuguese gloss. The criteria are
# summarised in soilKey's words; no text of the book is shipped. The
# predicates are those of R/diagnostics-fao74.R and R/key-fao74.R; the
# readings in readings.yaml.

units:
  "O":
    - code: "Ox"
      name: "Gelic Histosols"
      name_pt: "Histossolos Gélicos (Gelic Histosols)"
      page: 43
      tests:
        all_of: [{permafrost_fao74: {max_top_cm: 200}}]
      notes: "Permafrost within 200 cm of the surface."

    - code: "Od"
      name: "Dystric Histosols"
      name_pt: "Histossolos Distróficos (Dystric Histosols)"
      page: 43
      tests:
        all_of: [{ph_window_fao74: {lt: 5.5, top: 20, bottom: 50, mode: some}}]
      notes: "A pH (H2O 1:5) below 5.5 in at least some part of the soil between 20 and 50 cm."

    - code: "Oe"
      name: "Eutric Histosols"
      name_pt: "Histossolos Eutróficos (Eutric Histosols)"
      page: 43
      tests:
        default: true
      notes: "Other soils of the group (the key's residual)."

