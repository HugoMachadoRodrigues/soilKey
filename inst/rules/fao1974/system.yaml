# Registry entry for this classification system (read by R/systems-registry.R).
# The FAO-Unesco legend is one module with two editions (Hugo's decision Q1):
# one user function classify_fao(pedon, edition), two registry ids, fao1988
# (order 16) and fao1974 (here, order 17), each a thin wrapper with its own
# rule folder.
id: fao1974
order: 17
aliases: [fao74, fao_unesco_1974]
legacy: false
default: false
status: experimental
namespace: fao74
classifier: classify_fao1974
result_slot: fao1974
top_level: major_groups
# the 106 soil units are read from units/ (one file per major soil group,
# the units of each group under its code, in the key's order); the
# Lithosols, Rankers and Rendzinas are single units and have no list
levels: [major_groups, units]
