# at 14; the number may shift with the order in which they are merged.
id: cst2001
order: 15
aliases: [cst, china, chinese]
legacy: false
default: false
status: experimental
namespace: cst
classifier: classify_cst2001
result_slot: cst2001
top_level: orders
# the groups are read from groups/ (one file per order, keyed by suborder),
# the subgroups from subgroups/ (keyed by group): the files of orders A to G
# (v0.9.375) and H to N (v0.9.376), so every group of the book has its
# subgroups; soilKey's bracketed residuals ([A1.4], [A2.5]) have none
levels: [orders, suborders, groups, subgroups]
# the presets of the subgroup keys, expanded at load time (R/rule-presets.R)
rule_files: [presets]
