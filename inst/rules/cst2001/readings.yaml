# The readings soilKey makes of the Chinese Soil Taxonomy (Cooperative
# Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil Taxonomy.
# Science Press, Beijing and New York, 2001; the English edition, system id
# cst2001) where the text is silent or ambiguous. An entry ending "(Hugo,
# 2026-11-04)" is a decision of the owner, in soilKey's words; an entry ending
# "(soilKey's reading, for Hugo to confirm, 2026-11-05)" is soilKey's own and
# waits for his word. Pages are the printed pages of the book (PDF page =
# printed + 15). The criteria are paraphrased; no text of the book is shipped.
# This part (0.9.370) holds the attributes, the shared readers and the
# regimes; later parts add the readings of the diagnostics and the key.
readings:
  # --- the decisions of 2026-11-04 that this part applies ------------------------
  - topic: "Edition and registry names"
    page: "pp. 1-8, 65-71"
    reading: "soilKey implements the English edition of 2001 only, as the system cst2001 (namespace cst, aliases cst and china, experimental and opt-in, registered in a later part); names in English as printed, codes as printed, soilKey's additions in brackets. Every test is three-valued: a measurement not recorded leaves its test undecided, a field observation not recorded is absent (default 1) (Hugo, 2026-11-04)."
  - topic: "Units and conversions"
    page: "pp. 20, 58"
    reading: "The book's contents are g/kg of the element; soilKey stores % by mass, so a threshold is divided by 10 once (thresholds.yaml, units). Fe = 0.699 x Fe2O3, P = 0.437 x P2O5, K = 0.83 x K2O, organic matter = 1.724 x organic carbon. The mixed surface is the thickness-weighted mean of the upper 18 cm (25 cm for a cultivated histic epipedon) (default 9) (Hugo, 2026-11-04)."
  - topic: "Moisture regime when not recorded"
    page: "pp. 51-55"
    reading: "The recorded soil_moisture_regime (torric read as aridic); else Penman's aridity (the new aridity_index and aridity_index_max_month: over 3 aridic, 1 to 3 ustic, under 1 udic or perudic by the highest month); else the site markers, flagged: perched groundwater gives the stagnic regime, flood_irrigated or a paddy land use the anthrostagnic one, a water table within 100 cm with redox features recorded above it the aquic one; otherwise undecided. The reader gives the source, which the trace shows (Q5) (Hugo, 2026-11-04)."
  - topic: "Temperature regime when not recorded"
    page: "pp. 56-57"
    reading: "The recorded soil_temperature_regime; else mean_annual_soil_temp_C; else mean_annual_air_temp_C + 1 C, flagged. Cryic against frigid needs the summer: the new mean_summer_soil_temp_C (with summer_saturated and an O horizon by the designation); without it the two stay undecided (Q6) (Hugo, 2026-11-04)."
  - topic: "The cold regimes"
    page: "pp. 56-57, 89, 100, 134"
    reading: "By the numbers of each regime: gelic (mean annual 0 C or lower) includes the permagelic regime; cryic does not include the colder ones except where the key writes 'or colder' (temperature_regime_cst(or_colder = TRUE)); Boric is frigid or cryic only (Q7) (Hugo, 2026-11-04)."
  - topic: "Udic bordering on perudic"
    page: "pp. 93, 95, 130-165"
    reading: "A new site logical udic_perudic_border; a perudic regime passes too; not recorded, undecided. soil_moisture_subclass, the Canadian subclass, is not used (Q8) (Hugo, 2026-11-04)."
  - topic: "Default bulk densities"
    page: "pp. 58-59"
    reading: "Measured bulk density where recorded, else the book's default by horizon and texture, flagged (bd_default_cst): loamy or sandier A 1.2, AB 1.3, B and BC 1.4, C of earthy sediments 1.4; clay loamy or clayey A 1.3, AB 1.4, B and BC 1.5 (Q10) (Hugo, 2026-11-04)."
  - topic: "Salic horizon: salts and the 1:1 EC"
    page: "pp. 39, 42"
    reading: "A new horizon attribute ec_1to1_dS_m; the saturated-paste EC (ec_dS_m) and the 1:5 EC are never converted to it (Q13) (Hugo, 2026-11-04)."
  - topic: "Arid regions"
    page: "pp. 42, 52"
    reading: "An arid region is a recorded aridic regime (of the soil, or the new climatic_moisture_regime of the region) or an aridity over 3 (3 to 3.5 included, where the ustic range overlaps); unknown otherwise, and the salic tests then pass above the higher limit, fail below the lower and stay undecided between (Q14) (Hugo, 2026-11-04)."
  - topic: "Methods"
    page: "pp. 20, 26, 31, 33-34, 62"
    reading: "Water pH of any ratio, weatherable minerals of 20-200 um and the Ki of the sulfuric attack stand in, flagged; Mehlich-3 P never stands for Olsen P (the new p_olsen_mg_kg) and pH in KCl never for water pH; a pH without a method is water pH (Q16) (Hugo, 2026-11-04)."
  - topic: "New attributes"
    page: "-"
    reading: "All the attributes of the plan enter in this part, each with its fallback in its description: on the horizons fine_clay_pct, clay_films_thickness_mm, humus_clay_films_pct, humus_clay_films_mm, micromorph_argillans_pct, micromorph_features, tongue_depth_cm, albic_materials_pct, spodic_materials_pct, cracked_coatings_pct, odoe, pyrophosphate_color, root_mat_pct, root_mat, reduced_matrix_pct, ferricyanide_test, eh_mv, humic_infillings, humus_coatings, silting_sieve_test, puddled, p_olsen_mg_kg, p_total_pct, k_total_pct, ec_1to1_dS_m, sio2_al2o3_clay, sio2_al2o3_naoh, trb_cmol, trb_clay_cmol, gravel_carbonate_coating, plinthite_hardens, rock_fragment_max_cm, shajiang_pct, fe_mn_nodules_pct, pyroclastic_fragments_pct, soluble_salts_sodium_pct; on the site aridity_index, aridity_index_max_month, climatic_moisture_regime, udic_perudic_border, mean_summer_soil_temp_C, summer_saturated, cracks_open_days, irrigated, freeze_thaw_days_pct, surface_crust_thickness_cm, silting_rate_cm_yr, silting_kind, paddy_years_frac, lithic_contact_extent_pct; the regime values stagnic, anthrostagnic, peraquic and permagelic (Q20; defaults 13, 14, 21) (Hugo, 2026-11-04)."
  - topic: "Hue: moist first"
    page: "pp. 47, 129-133"
    reading: "A hue test reads the moist hue; the dry hue where no moist one is recorded, flagged (hue_dry_for_moist); where the book writes dry and moist, both (Q21) (Hugo, 2026-11-04)."
  - topic: "Shares of a window"
    page: "pp. 93, 124-166"
    reading: "'More than half' and '80 % or more' of the horizons to 125 cm are shares of the thickness of the window, read as a range (the horizons that meet the test against those that may), so undescribed or undecided depth leaves the answer open only when it could change it (Q22) (Hugo, 2026-11-04)."
  - topic: "Windows"
    page: "pp. 61-62, 86, 115-177"
    reading: "A test in a window ('at least between 20 and 50 cm', 'throughout the B to 125 cm', 'in the B to 125 cm') is met when every horizon that touches the window meets it; undecided when one lacks the data or part of the window is not described; 'some subhorizon 10 cm thick' stays one (Q23) (Hugo, 2026-11-04)."
  - topic: "The regime values in the other keys"
    page: "pp. 51-57"
    reading: "soil_moisture_regime takes stagnic, anthrostagnic and peraquic, soil_temperature_regime permagelic. The USDA key reads the three moisture values as aquic and permagelic as gelic; pergelic is read by the CST as gelic (p. 56); the iso regimes are read without 'iso' (the CST has none); xeric has no CST counterpart. Permagelic also when permafrost starts within 50 cm, flagged (default 8) (Hugo, 2026-11-04)."
  - topic: "Irrigation"
    page: "p. 156"
    reading: "A new site logical irrigated; flood_irrigated TRUE implies it (default 10) (Hugo, 2026-11-04)."
  # --- the readings of this part, confirmed or amended by Hugo on its review --------
  - topic: "Two axes of the moisture regime"
    page: "pp. 51-55, 81"
    reading: "The moisture regime is read on two axes. The climatic axis (aridic, ustic, udic, perudic) comes from a recorded climatic soil_moisture_regime, else climatic_moisture_regime, else the aridity index; the saturation axis (stagnic, anthrostagnic, aquic, peraquic) from a recorded saturation regime, else the site markers (paddy records, tidal flooding or water above the surface, perched water, a shallow water table with redox features). Each test reads its own axis, and a value on one axis says nothing of the other (undecided, not false): a paddy soil recorded udic is anthrostagnic, a saline soil of an arid climate with a shallow water table is aquic, and a saturation regime alone leaves the udic-perudic border undecided. This replaces soilKey's first reading (paddy records before the aridity index) (D1) (Hugo, 2026-11-05)."
  - topic: "A recorded regime the CST does not have"
    page: "pp. 51-57"
    reading: "A recorded xeric moisture regime, or any value outside the CST's lists, is noted and the regime is read from the other records (aridity index, markers, temperatures) as if none were recorded (Hugo, 2026-11-05)."
  - topic: "The aquic marker"
    page: "pp. 54-56"
    reading: "A water table within 100 cm (groundwater_depth_cm, 100 included) with mottle colours, redoximorphic features or ferric or manganiferous nodules recorded in a horizon whose top is within 100 cm gives the aquic or the peraquic regime (undecided between them, flagged). The peraquic regime itself (a water table always at or near the surface, p. 55) is read from tidal flooding (tidal_zone intertidal or subtidal, tidal_inundation) or water standing above the surface (water_table_cm_above_surface over 0) (D2) (Hugo, 2026-11-05)."
  - topic: "Peraquic within aquic"
    page: "pp. 54-55"
    reading: "The book defines the peraquic regime as an aquic one with the water table always at or near the surface; a test for the aquic regime passes a peraquic soil (Hugo, 2026-11-05)."
  - topic: "Permafrost within 50 cm"
    page: "pp. 56-57"
    reading: "Permafrost starts within 50 cm when a horizon whose top lies at or above 50 cm has a permafrost temperature at or below 0 C or a frozen designation; it is absent when the recorded frost regime has no permafrost or the horizon at 50 cm is above 0 C. The permafrost_temp_C of the horizon at 50 cm (or above a shallower contact) is the mean annual soil temperature when mean_annual_soil_temp_C is not recorded. Permafrost within 50 cm gives the permagelic regime ahead of any estimate from the air; against a measured soil temperature above 0 C it is a conflict, flagged, and the regime is undecided. A recorded gelic regime becomes permagelic, flagged; a recorded cryic or warmer one is kept, with a note (D3) (Hugo, 2026-11-05)."
  - topic: "Cryic and frigid with partial summer data"
    page: "p. 57"
    reading: "With the summer soil temperature recorded but the summer saturation or the O horizon unknown, the reader decides when every possible limit agrees (under 6 C cryic for any case, 15 C or more frigid for any case) and leaves the rest undecided. Organic soils, whose cryic criteria are frozen layers after the summer solstice, stay undecided between cryic and frigid without a recorded regime (Hugo, 2026-11-05)."
  - topic: "Udic bordering on perudic from the regime"
    page: "pp. 93, 95"
    reading: "Read on the climatic axis: a climatic regime that is neither udic nor perudic fails, even with udic_perudic_border TRUE (the conflict is noted); a perudic regime passes (recorded, or from the aridity index, every month under 1, flagged); else udic_perudic_border; else undecided. A saturation regime says nothing of it (Hugo, 2026-11-05)."
  - topic: "The arid region from the soil's regime"
    page: "p. 42"
    reading: "The region is read in this order: climatic_moisture_regime, aridity_index, soil_moisture_regime. A soil regime of ustic, udic or perudic says the region is not arid; aquic, peraquic, stagnic, anthrostagnic and xeric say nothing of it (a saline aquic soil may lie in an arid region) (Hugo, 2026-11-05)."
  - topic: "Kinds and textures of the default bulk densities"
    page: "pp. 21, 58-59"
    reading: "The horizon kind comes from the designation (a discontinuity numeral taken off): A; AB, BA, A/B; B; BC, CB, B/C; a C of loamy or sandier texture (the earthy sediments of the isohumic footnote, which the humic footnote omits; one table for both). E, AC, a clayey C and an undesignated horizon get no default, so the storage stays undecided there unless measured; a horizon with no carbon needs no density. An O horizon with carbon and no measured density takes the range 0.1-0.4 Mg/m3 of the peaty histic epipedon, flagged: the storage becomes a range and decides a limit only when the whole range lies on one side of it (Q3). The texture group is the horizon's own USDA class (sand, loamy sand, sandy loam, loam, silt loam, silt against the clay loams and clays), or clay under 20 % / 27 % or more when no class can be made; the book's 'loamy or more sandy soil' is read per horizon, soilKey's reading (Q4). The storage window ends at a lithic or paralithic contact; with the contact between 50 and 100 cm, the storage of the solum stands for it and the isohumic depths are scaled to the solum (the footnotes of pp. 58-59) (Hugo, 2026-11-05)."
  - topic: "CEC by another method"
    page: "p. 31"
    reading: "CEC per kg of clay is cec_cmol x 100 / clay_pct; a CEC whose cec_method is recorded and is not ammonium acetate at pH 7 stands in, flagged (cec_method_substitute), as the RP reads its CEC. The ECEC per kg of clay sums the bases and KCl Al (al_kcl_cmol, else al_cmol), else reads ecec_cmol (Hugo, 2026-11-05)."
  - topic: "Very fine sand or finer"
    page: "pp. 30-31"
    reading: "'Very fine sand, loamy very fine sand or finer' (cambic, LAC-ferric): every class but sand and loamy sand passes; a sand or loamy sand fails when its 0.05-0.2 mm sand (fine_sand_pct) is under 50 % of the fine earth (its very fine sand cannot reach 50 %), and is undecided otherwise, since soilKey records no very fine sand (Hugo, 2026-11-05)."
  - topic: "Particle-size classes of the calcic horizon"
    page: "p. 40"
    reading: "The USDA particle-size class is read on the horizon itself, not over a family control section: skeletal at 35 % rock fragments by volume (none when not recorded), fragmental at 90 %, sandy for sand and loamy sand, fine and very-fine at 35 and 60 % clay. Loamy against silty needs 15 % sand coarser than very fine sand: under 15 % sand silty; loamy when the sand coarser than 0.2 mm (sand_pct minus fine_sand_pct) reaches 15 %; otherwise undecided, as for the silt loams of the loess plateau (Q1) (Hugo, 2026-11-05)."
  - topic: "Mineral soil surface and solum"
    page: "pp. 21-24, 43"
    reading: "The mineral soil surface is the top of the first horizon not designated O or H. Without a designation it is read by the carbon of the organic soil materials: under 12 % mineral; 20 % or more organic (skipped); between, organic from 12 % plus a tenth of the clay % (120 + 0.1 x clay g/kg, 18 % at 60 % clay), undecided without clay (D4). The solum runs from it to the base of the deepest A, E or B horizon (AB, BC included) above the first C, AC or contact (Hugo, 2026-11-05)."
  - topic: "Cr and the older Chinese notation"
    page: "-"
    reading: "R is a lithic contact. Cr is a paralithic contact only when the profile declares an FAO, WRB or USDA notation (site$designation_system) or the horizon records a contact (cementation, rupture resistance hard or harder, saprolite, a weathering stage, the rock of origin); otherwise its r is the redox suffix of the Chinese field notation and the horizon is a C (Q2). The older Chinese paddy notation is read as P (the plough pan) an A, W (waterlogged) and G (gley) a B (Hugo, 2026-11-05)."
  - topic: "Paddy land use words"
    page: "p. 81"
    reading: "A paddy land use names paddy, rice, sawah or irrigated rice (arroz irrigado) as whole words, or the Chinese or Japanese words for paddy field and rice; upland, dryland and rainfed rice and uses of rice straw, husks or mulch are not paddy (D5) (Hugo, 2026-11-05)."
