# The readings soilKey makes of the Chinese Soil Taxonomy (Cooperative
# Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil Taxonomy.
# Science Press, Beijing and New York, 2001; the English edition, system id
# cst2001) where the text is silent or ambiguous. An entry ending "(Hugo,
# 2026-11-04)" is a decision of the owner, in soilKey's words; an entry ending
# "(soilKey's reading, for Hugo to confirm, 2026-11-05)" is soilKey's own and
# waits for his word. Pages are the printed pages of the book (PDF page =
# printed + 15). The criteria are paraphrased; no text of the book is shipped.
# This part (0.9.370) holds the attributes, the shared readers and the
# regimes; 0.9.371 the diagnostic horizons; 0.9.372 the diagnostic
# characteristics (decided on the review, 2026-11-06); 0.9.373 the registry,
# the 14 orders and the 39 suborders (decided on the review, 2026-11-06);
# 0.9.374 the groups; 0.9.375 the subgroups of orders A to G; 0.9.376 those
# of orders H to N; 0.9.377 the fixes of the gleyic colours and the argic
# fine clay; 0.9.378 the reading of hand-written CST names for the ISIS
# benchmark.
readings:
  # --- the decisions of 2026-11-04 that this part applies ------------------------
  - topic: "Edition and registry names"
    page: "pp. 1-8, 65-71"
    reading: "soilKey implements the English edition of 2001 only, as the system cst2001 (namespace cst, aliases cst and china, experimental and opt-in, registered in a later part); names in English as printed, codes as printed, soilKey's additions in brackets. Every test is three-valued: a measurement not recorded leaves its test undecided, a field observation not recorded is absent (default 1) (Hugo, 2026-11-04)."
  - topic: "Units and conversions"
    page: "pp. 20, 58"
    reading: "The book's contents are g/kg of the element; soilKey stores % by mass, so a threshold is divided by 10 once (thresholds.yaml, units). Fe = 0.699 x Fe2O3, P = 0.437 x P2O5, K = 0.83 x K2O, organic matter = 1.724 x organic carbon. The mixed surface is the thickness-weighted mean of the upper 18 cm (25 cm for a cultivated histic epipedon) (default 9) (Hugo, 2026-11-04)."
  - topic: "Moisture regime when not recorded"
    page: "pp. 51-55"
    reading: "The recorded soil_moisture_regime (torric read as aridic); else Penman's aridity (the new aridity_index and aridity_index_max_month: over 3 aridic, 1 to 3 ustic, under 1 udic or perudic by the highest month); else the site markers, flagged: perched groundwater gives the stagnic regime, flood_irrigated or a paddy land use the anthrostagnic one, a water table within 100 cm with redox features recorded above it the aquic one; otherwise undecided. The reader gives the source, which the trace shows (Q5) (Hugo, 2026-11-04)."
  - topic: "Temperature regime when not recorded"
    page: "pp. 56-57"
    reading: "The recorded soil_temperature_regime; else mean_annual_soil_temp_C; else mean_annual_air_temp_C + 1 C, flagged. Cryic against frigid needs the summer: the new mean_summer_soil_temp_C (with summer_saturated and an O horizon by the designation); without it the two stay undecided (Q6) (Hugo, 2026-11-04)."
  - topic: "The cold regimes"
    page: "pp. 56-57, 89, 100, 134"
    reading: "By the numbers of each regime: gelic (mean annual 0 C or lower) includes the permagelic regime; cryic does not include the colder ones except where the key writes 'or colder' (temperature_regime_cst(or_colder = TRUE)); Boric is frigid or cryic only (Q7) (Hugo, 2026-11-04)."
  - topic: "Udic bordering on perudic"
    page: "pp. 93, 95, 130-165"
    reading: "A new site logical udic_perudic_border; a perudic regime passes too; not recorded, undecided. soil_moisture_subclass, the Canadian subclass, is not used (Q8) (Hugo, 2026-11-04)."
  - topic: "Default bulk densities"
    page: "pp. 58-59"
    reading: "Measured bulk density where recorded, else the book's default by horizon and texture, flagged (bd_default_cst): loamy or sandier A 1.2, AB 1.3, B and BC 1.4, C of earthy sediments 1.4; clay loamy or clayey A 1.3, AB 1.4, B and BC 1.5 (Q10) (Hugo, 2026-11-04)."
  - topic: "Salic horizon: salts and the 1:1 EC"
    page: "pp. 39, 42"
    reading: "A new horizon attribute ec_1to1_dS_m; the saturated-paste EC (ec_dS_m) and the 1:5 EC are never converted to it (Q13) (Hugo, 2026-11-04)."
  - topic: "Arid regions"
    page: "pp. 42, 52"
    reading: "An arid region is a recorded aridic regime (of the soil, or the new climatic_moisture_regime of the region) or an aridity over 3 (3 to 3.5 included, where the ustic range overlaps); unknown otherwise, and the salic tests then pass above the higher limit, fail below the lower and stay undecided between (Q14) (Hugo, 2026-11-04)."
  - topic: "Methods"
    page: "pp. 20, 26, 31, 33-34, 62"
    reading: "Water pH of any ratio, weatherable minerals of 20-200 um and the Ki of the sulfuric attack stand in, flagged; Mehlich-3 P never stands for Olsen P (the new p_olsen_mg_kg) and pH in KCl never for water pH; a pH without a method is water pH (Q16) (Hugo, 2026-11-04)."
  - topic: "New attributes"
    page: "-"
    reading: "All the attributes of the plan enter in this part, each with its fallback in its description: on the horizons fine_clay_pct, clay_films_thickness_mm, humus_clay_films_pct, humus_clay_films_mm, micromorph_argillans_pct, micromorph_features, tongue_depth_cm, albic_materials_pct, spodic_materials_pct, cracked_coatings_pct, odoe, pyrophosphate_color, root_mat_pct, root_mat, reduced_matrix_pct, ferricyanide_test, eh_mv, humic_infillings, humus_coatings, silting_sieve_test, puddled, p_olsen_mg_kg, p_total_pct, k_total_pct, ec_1to1_dS_m, sio2_al2o3_clay, sio2_al2o3_naoh, trb_cmol, trb_clay_cmol, gravel_carbonate_coating, plinthite_hardens, rock_fragment_max_cm, shajiang_pct, fe_mn_nodules_pct, pyroclastic_fragments_pct, soluble_salts_sodium_pct; on the site aridity_index, aridity_index_max_month, climatic_moisture_regime, udic_perudic_border, mean_summer_soil_temp_C, summer_saturated, cracks_open_days, irrigated, freeze_thaw_days_pct, surface_crust_thickness_cm, silting_rate_cm_yr, silting_kind, paddy_years_frac, lithic_contact_extent_pct; the regime values stagnic, anthrostagnic, peraquic and permagelic (Q20; defaults 13, 14, 21) (Hugo, 2026-11-04)."
  - topic: "Hue: moist first"
    page: "pp. 47, 129-133"
    reading: "A hue test reads the moist hue; the dry hue where no moist one is recorded, flagged (hue_dry_for_moist); where the book writes dry and moist, both (Q21) (Hugo, 2026-11-04)."
  - topic: "Shares of a window"
    page: "pp. 93, 124-166"
    reading: "'More than half' and '80 % or more' of the horizons to 125 cm are shares of the thickness of the window, read as a range (the horizons that meet the test against those that may), so undescribed or undecided depth leaves the answer open only when it could change it (Q22) (Hugo, 2026-11-04)."
  - topic: "Windows"
    page: "pp. 61-62, 86, 115-177"
    reading: "A test in a window ('at least between 20 and 50 cm', 'throughout the B to 125 cm', 'in the B to 125 cm') is met when every horizon that touches the window meets it; undecided when one lacks the data or part of the window is not described; 'some subhorizon 10 cm thick' stays one (Q23) (Hugo, 2026-11-04)."
  - topic: "The regime values in the other keys"
    page: "pp. 51-57"
    reading: "soil_moisture_regime takes stagnic, anthrostagnic and peraquic, soil_temperature_regime permagelic. The USDA key reads the three moisture values as aquic and permagelic as gelic; pergelic is read by the CST as gelic (p. 56); the iso regimes are read without 'iso' (the CST has none); xeric has no CST counterpart. Permagelic also when permafrost starts within 50 cm, flagged (default 8) (Hugo, 2026-11-04)."
  - topic: "Irrigation"
    page: "p. 156"
    reading: "A new site logical irrigated; flood_irrigated TRUE implies it (default 10) (Hugo, 2026-11-04)."
  # --- the readings of this part, confirmed or amended by Hugo on its review --------
  - topic: "Two axes of the moisture regime"
    page: "pp. 51-55, 81"
    reading: "The moisture regime is read on two axes. The climatic axis (aridic, ustic, udic, perudic) comes from a recorded climatic soil_moisture_regime, else climatic_moisture_regime, else the aridity index; the saturation axis (stagnic, anthrostagnic, aquic, peraquic) from a recorded saturation regime, else the site markers (paddy records, tidal flooding or water above the surface, perched water, a shallow water table with redox features). Each test reads its own axis, and a value on one axis says nothing of the other (undecided, not false): a paddy soil recorded udic is anthrostagnic, a saline soil of an arid climate with a shallow water table is aquic, and a saturation regime alone leaves the udic-perudic border undecided. This replaces soilKey's first reading (paddy records before the aridity index) (D1) (Hugo, 2026-11-05)."
  - topic: "A recorded regime the CST does not have"
    page: "pp. 51-57"
    reading: "A recorded xeric moisture regime, or any value outside the CST's lists, is noted and the regime is read from the other records (aridity index, markers, temperatures) as if none were recorded (Hugo, 2026-11-05)."
  - topic: "The aquic marker"
    page: "pp. 54-56"
    reading: "A water table within 100 cm (groundwater_depth_cm, 100 included) with mottle colours, redoximorphic features or ferric or manganiferous nodules recorded in a horizon whose top is within 100 cm gives the aquic or the peraquic regime (undecided between them, flagged). The peraquic regime itself (a water table always at or near the surface, p. 55) is read from tidal flooding (tidal_zone intertidal or subtidal, tidal_inundation) or water standing above the surface (water_table_cm_above_surface over 0) (D2) (Hugo, 2026-11-05)."
  - topic: "Peraquic within aquic"
    page: "pp. 54-55"
    reading: "The book defines the peraquic regime as an aquic one with the water table always at or near the surface; a test for the aquic regime passes a peraquic soil (Hugo, 2026-11-05)."
  - topic: "Permafrost within 50 cm"
    page: "pp. 56-57"
    reading: "Permafrost starts within 50 cm when a horizon whose top lies at or above 50 cm has a permafrost temperature at or below 0 C or a frozen designation; it is absent when the recorded frost regime has no permafrost or the horizon at 50 cm is above 0 C. The permafrost_temp_C of the horizon at 50 cm (or above a shallower contact) is the mean annual soil temperature when mean_annual_soil_temp_C is not recorded. Permafrost within 50 cm gives the permagelic regime ahead of any estimate from the air; against a measured soil temperature above 0 C it is a conflict, flagged, and the regime is undecided. A recorded gelic regime becomes permagelic, flagged; a recorded cryic or warmer one is kept, with a note (D3) (Hugo, 2026-11-05)."
  - topic: "Cryic and frigid with partial summer data"
    page: "p. 57"
    reading: "With the summer soil temperature recorded but the summer saturation or the O horizon unknown, the reader decides when every possible limit agrees (under 6 C cryic for any case, 15 C or more frigid for any case) and leaves the rest undecided. Organic soils, whose cryic criteria are frozen layers after the summer solstice, stay undecided between cryic and frigid without a recorded regime (Hugo, 2026-11-05)."
  - topic: "Udic bordering on perudic from the regime"
    page: "pp. 93, 95"
    reading: "Read on the climatic axis: a climatic regime that is neither udic nor perudic fails, even with udic_perudic_border TRUE (the conflict is noted); a perudic regime passes (recorded, or from the aridity index, every month under 1, flagged); else udic_perudic_border; else undecided. A saturation regime says nothing of it (Hugo, 2026-11-05)."
  - topic: "The arid region from the soil's regime"
    page: "p. 42"
    reading: "The region is read in this order: climatic_moisture_regime, aridity_index, soil_moisture_regime. A soil regime of ustic, udic or perudic says the region is not arid; aquic, peraquic, stagnic, anthrostagnic and xeric say nothing of it (a saline aquic soil may lie in an arid region) (Hugo, 2026-11-05)."
  - topic: "Kinds and textures of the default bulk densities"
    page: "pp. 21, 58-59"
    reading: "The horizon kind comes from the designation (a discontinuity numeral taken off): A; AB, BA, A/B; B; BC, CB, B/C; a C of loamy or sandier texture (the earthy sediments of the isohumic footnote, which the humic footnote omits; one table for both). E, AC, a clayey C and an undesignated horizon get no default, so the storage stays undecided there unless measured; a horizon with no carbon needs no density. An O horizon with carbon and no measured density takes the range 0.1-0.4 Mg/m3 of the peaty histic epipedon, flagged: the storage becomes a range and decides a limit only when the whole range lies on one side of it (Q3). The texture group is the horizon's own USDA class (sand, loamy sand, sandy loam, loam, silt loam, silt against the clay loams and clays), or clay under 20 % / 27 % or more when no class can be made; the book's 'loamy or more sandy soil' is read per horizon, soilKey's reading (Q4). The storage window ends at a lithic or paralithic contact; with the contact between 50 and 100 cm, the storage of the solum stands for it and the isohumic depths are scaled to the solum (the footnotes of pp. 58-59) (Hugo, 2026-11-05)."
  - topic: "CEC by another method"
    page: "p. 31"
    reading: "CEC per kg of clay is cec_cmol x 100 / clay_pct; a CEC whose cec_method is recorded and is not ammonium acetate at pH 7 stands in, flagged (cec_method_substitute), as the RP reads its CEC. The ECEC per kg of clay sums the bases and KCl Al (al_kcl_cmol, else al_cmol), else reads ecec_cmol (Hugo, 2026-11-05)."
  - topic: "Very fine sand or finer"
    page: "pp. 30-31"
    reading: "'Very fine sand, loamy very fine sand or finer' (cambic, LAC-ferric): every class but sand and loamy sand passes; a sand or loamy sand fails when its 0.05-0.2 mm sand (fine_sand_pct) is under 50 % of the fine earth (its very fine sand cannot reach 50 %), and is undecided otherwise, since soilKey records no very fine sand (Hugo, 2026-11-05)."
  - topic: "Particle-size classes of the calcic horizon"
    page: "p. 40"
    reading: "The USDA particle-size class is read on the horizon itself, not over a family control section: skeletal at 35 % rock fragments by volume (none when not recorded), fragmental at 90 %, sandy for sand and loamy sand, fine and very-fine at 35 and 60 % clay. Loamy against silty needs 15 % sand coarser than very fine sand: under 15 % sand silty; loamy when the sand coarser than 0.2 mm (sand_pct minus fine_sand_pct) reaches 15 %; otherwise undecided, as for the silt loams of the loess plateau (Q1) (Hugo, 2026-11-05)."
  - topic: "Mineral soil surface and solum"
    page: "pp. 21-24, 43"
    reading: "The mineral soil surface is the top of the first horizon not designated O or H. Without a designation it is read by the carbon of the organic soil materials: under 12 % mineral; 20 % or more organic (skipped); between, organic from 12 % plus a tenth of the clay % (120 + 0.1 x clay g/kg, 18 % at 60 % clay), undecided without clay (D4). The solum runs from it to the base of the deepest A, E or B horizon (AB, BC included) above the first C, AC or contact (Hugo, 2026-11-05)."
  - topic: "Cr and the older Chinese notation"
    page: "-"
    reading: "R is a lithic contact. Cr is a paralithic contact only when the profile declares an FAO, WRB or USDA notation (site$designation_system) or the horizon records a contact (cementation, rupture resistance hard or harder, saprolite, a weathering stage, the rock of origin); otherwise its r is the redox suffix of the Chinese field notation and the horizon is a C (Q2). The older Chinese paddy notation is read as P (the plough pan) an A, W (waterlogged) and G (gley) a B (Hugo, 2026-11-05)."
  - topic: "Paddy land use words"
    page: "p. 81"
    reading: "A paddy land use names paddy, rice, sawah or irrigated rice (arroz irrigado) as whole words, or the Chinese or Japanese words for paddy field and rice; upland, dryland and rainfed rice and uses of rice straw, husks or mulch are not paddy (D5) (Hugo, 2026-11-05)."
  # --- the diagnostic horizons (0.9.371), decided on the review (Hugo, 2026-11-06) ----
  - topic: "Grades of the horizons"
    page: "p. 19"
    reading: "Every horizon reader gives each layer a grade: full, evidence (the book's weaker grade, only where the book defines one), none, or undecided; the profile takes the best grade a layer reaches. The key asks for grade full (default), evidence (the weak grade only) or at_least_evidence (Q19 reads a bare 'X evidence' as at least evidence) (Hugo, 2026-11-06)."
  - topic: "Stand-ins of the horizons"
    page: "pp. 20-43"
    reading: "A WRB or USDA diagnostic of soilKey is asked only where the CST reading of a layer is undecided, or false only because a field descriptor was not recorded, and settles only the items it covers: it acts on the argic horizon only when the sodic property and the alkalic horizon are decided, on the aridic epipedon only when item 2 (no salic horizon) holds, on the hydragric items 4 and 5 only on the layers where the WRB hydragric horizon passes (elsewhere they stay undecided). It can only make a layer pass, flagged (stand_in:<function>) with a lower grade in the report, never make it fail. The WRB salic horizon does not stand in (its saturated-paste EC is the conversion Q13 rejects), nor any diagnostic for the salic crust, the hypersalic horizon, the salipan, the hypercalcic horizon, the phosphipan or the LAC-ferric horizon (Hugo, 2026-11-06)."
  - topic: "A horizon of several layers"
    page: "pp. 20-43"
    reading: "A horizon is a run of contiguous layers that share the property; its thickness is the run's, a range when undecided layers may belong to it; a product of thickness and content (gypsic, calcipan, salic) sums the layers of the run. Epipedons run from the soil surface (histic, mattic, salic crust) or from the mineral soil surface (the others) (default 6) (Hugo, 2026-11-06)."
  - topic: "Histic epipedon: saturation and kind"
    page: "pp. 21-22"
    reading: "The saturation of the profile is the longest water_saturation_days recorded in the upper 50 cm (artificially_drained reads as saturated, the peaty kind). Not recorded, the layer passes only when both the peaty and the littery reading pass. Organic layers thicker than the peaty kind allows (60 cm) are no histic epipedon but an organic soil (the order A, a later part). The sphagnum share and the bulk density of the 60 cm limit are read on the top layer (soilKey's convention, R10); the 40 cm in total within the upper 50 cm count only with a mineral layer over or among the organic ones (Hugo, 2026-11-06)."
  - topic: "Mattic epipedon: the mat and the evidence"
    page: "pp. 22-23"
    reading: "The elastic mat (root_mat) not recorded is absent, but a recorded share of mat roots of 50 % or more stands for it. The mattic evidence is read on its thickness (2 cm) and its share of mat roots (10 %) only; the colour, C/N, saturation, bulk density and regime of the full epipedon are not asked of it (Hugo, 2026-11-06)."
  - topic: "Mollic and umbric epipedons: the C and the structure"
    page: "pp. 23-24"
    reading: "The colour contrast with the C horizon is not tested when no C is described (as the KST, 'if a C horizon is present'); with dry colours missing on either side it is read on the moist ones, flagged. A structure not recorded leaves the mollic structure item (and the cambic structure item) undecided, not absent: it describes every horizon, it is not a feature. Small and medium blocky structure count as 'not coarse' for the mollic epipedon (R4). A cultivated surface (Ap) is read as the mixed upper 18 cm for colour and carbon (p. 21) (Hugo, 2026-11-06)."
  - topic: "Ochric epipedon"
    page: "p. 24"
    reading: "The ochric epipedon is the residual of the humic epipedons (R3): the first mineral layer is ochric when no mollic or umbric epipedon holds and it is light coloured, poor in carbon, or dark and rich enough but too thin or failing the mollic only on its structure; one undecided mollic or umbric leaves it undecided (Hugo, 2026-11-06)."
  - topic: "Aridic epipedon"
    page: "pp. 27-28"
    reading: "Item 1b reads a dune or sand sheet (aeolian_morphology) or a sand or loamy sand top layer; 1c a biological crust; 1d polygonal cracks up to 1 cm wide (1-4 cm deep when recorded). 'Much gypsum' (item 4) is 50 g/kg (5 %) or visible gypsum in the upper two layers. The platy layer is one of the upper two layers, 10 cm thick or less. The surface features are field observations: not recorded, absent; then the WRB yermic or takyric properties may stand in, only when item 2 holds (Hugo, 2026-11-06)."
  - topic: "Albic and glossic horizons"
    page: "pp. 28-30"
    reading: "The albic horizon is an E: it lies under another layer (an A, or an O where no A is), and a layer designated O, B, BC, C or R is none (grey gleyed B and C layers share its colours). Chroma is the moist one, the dry one where no moist is recorded, flagged. 'Uncoated grains' (item 2b) are half the grains or more (uncoated_grains_pct). Without albic_materials_pct the layer's colour stands for 100 % albic materials, flagged. Tongues are recorded on the layer they penetrate, the glossic layer itself; the albic layer reads the tongue depth of the layer below it, so tongues recorded on the E do not remove its albic horizon (R6). Table 3.1 gives no width for sandy layers: they take the loamy 15 mm (Hugo, 2026-11-06)."
  - topic: "Cambic horizon"
    page: "pp. 29-31"
    reading: "Candidates are B, AB and BC layers, or undesignated layers below the first mineral one. 'Redder or yellower hue than the horizon below' is any other hue up to 5Y; 'evidence of removal of carbonates' is 1 % (10 g/kg) CaCO3 less than a calcareous horizon below (1 % or more). In an aridic moisture regime or a cryic, frigid or colder temperature regime 5 cm of thickness waives both limits, the 10 cm and the lower boundary at 25 cm or deeper (R1). Item 6 makes a layer undecided while the argic, spodic, ferralic or LAC-ferric reading of it is undecided; a natro-argic layer (the illuvial evidence of the argic horizon) is no cambic horizon (D7) (Hugo, 2026-11-06)."
  - topic: "Argic horizon"
    page: "pp. 35-38"
    reading: "Item 1 fails for a recorded stratification (stratification_pattern other than none) or a fluvial, marine or lacustrine layer_origin of the layer itself. The eluvial horizon of item 2b is the layer with least clay above, from the mineral surface, of the same material (designation numeral and layer_origin), among the layers whose base lies within 30 cm above the layer's top (D2, pp. 35-36). Item 2b asks more fine clay than the eluvial layer as well as more total clay in the bands under 60 % clay. The fine clay is compared with the eluvial layers (same material, within 30 cm) whose total clay the layer exceeds by the increase: it fails when every one of them with fine clay measured has as much or more; when the layer or none of them has fine clay measured (not measured in both layers, in one or neither), the total-clay increase passes provisionally, and the whole key is run again with that increase failing (no gate switched off): the first level whose class differs carries the warning, even when assigned firmly (the argic layer may block an earlier class), and that run's class is the alternative. The fine-clay ratio 'normally' a third higher is not required; the alkalic horizon, which reads items 2a-d, follows; the clay-pan (item 3) and secondary clayification (item 3c) keep the total clay alone (v0.9.377, Hugo, 2026-11-08, p. 36). The printed 'or' stands: clay films, the clay increase or the thin section, each alone. Clay films on 'few' faces are under 5 %; films not recorded are absent; a thin section not recorded (item 2c, an alternative) adds nothing. A layer with the sodic property is a natro-argic horizon: argic only where the key asks for it (natro = TRUE, the Aridosols). An alkalic horizon is no argic horizon by either path. The argic, ferralic, LAC-ferric and spodic horizons are B horizons: a layer designated O, A, E, C or R is none of them (the designation as the identity of the horizon, plan section 6); an undesignated layer may be any. Secondary clayification: 'almost the same' Ki within 10 %; 'more compact' by bulk density; 10 cm thick (5 cm in an aridic regime); items c and d are alternatives ('c; or d; and e'), d read only from a recorded thin section (micromorph_features): item 3d is not mandatory, so Q17 does not apply to it (D9) (Hugo, 2026-11-06)."
  - topic: "Argic horizon exposed by erosion"
    page: "pp. 35, 37-38"
    reading: "A first mineral layer designated B (the A eroded) may be an argic horizon by its clay films (item 2a) or its thin section (item 2c); item 2b, which compares it with an eluvial layer above, cannot apply there (D8) (Hugo, 2026-11-06)."
  - topic: "The sodic property of the argic horizon"
    page: "p. 63"
    reading: "Sodium not measured, or the Na + Mg share not measurable (Na or Mg not recorded), is read as no sodic property unless the layer is alkaline (pH 8.5 or more), where it stays undecided; a measured ESP under 30 with Mg not recorded is no sodic property (D3) (Hugo, 2026-11-06)."
  - topic: "Clay-pan and alkalic horizon"
    page: "pp. 38-39"
    reading: "The clay-pan needs a recorded prismatic or columnar structure (a consistence, when recorded, firm or firmer), the argic increase over the first mineral layer and twice the clay of an albic horizon above, or argillans 0.5 mm or thicker; its thin section counts as met unless recorded otherwise (Q17), flagged; the argillans of 0.5 mm (item 4) qualify the first mineral layer too, the clay increase (item 3) only a layer below it (v0.9.376, (Hugo on the review, 2026-11-08)). The alkalic evidence is read on its printed items only (p. 39): a subsurface layer (below the first mineral layer, not an O, A, E, C or R) with the weakly developed structure of the alkalic horizon and an ESP of 5 or more within 40 cm of its top, without the argic items 2a-d; the structure is a field observation, absent when not recorded (as for the full horizon), the ESP a measurement, undecided when not measured unless the structure fails; its pH ('usually') is not required (v0.9.376, (Hugo on the review, 2026-11-08), replacing the reading on the argic items of 2026-11-06)."
  - topic: "Fimic and anthrostagnic epipedons"
    page: "pp. 25-27"
    reading: "The fimic epipedon is the run of A and AB layers from the mineral surface (without designations, of layers with 4.5 g/kg carbon or more); its evidence allows one of its three numbers in the lower band. The anthrostagnic epipedon is the run of the cultivated layer and its plough pan from the surface: Ap layers, or in the older Chinese notation (A-P-W-G) the A directly above the P (or W) and the P itself; where cultivation cannot be identified it is undecided, never absent (D1). The plough pan is the lowest of them (two layers at least); the moist colour is read for the submerged one, flagged, its hue 7.5YR or yellower or neutral (soilKey's convention on the hue rank, R10); rust mottles not recorded are absent; a recorded paddy_years_frac of 0.5 or less gives the evidence only, not recorded the regime reader decides (Q12) (Hugo, 2026-11-06). With such a short paddy history the regime item of the evidence passes on the paddy record whatever the saturation regime, the full epipedon keeping the regime test, and the saturation axis reads the anthrostagnic regime from the paddy records only when paddy_years_frac is not recorded or over 0.5 (pp. 27, 54; v0.9.376, (Hugo on the review, 2026-11-08))."
  - topic: "Hydragric horizon"
    page: "pp. 34-35"
    reading: "The hydragric horizon may lie under the anthrostagnic evidence as well as under the full epipedon; the key decides which it asks for (R7) (Hugo, 2026-11-06)."
  - topic: "Agric horizon"
    page: "pp. 33-34"
    reading: "The agric horizon is the run of layers directly under the cultivated layers (Ap, or the A and P of the older notation). Item 3 applies when the layer below is 7.5YR or redder (a chromic soil), the hue at most one step yellower; item 4 when the layer below is under pH 5.5 (an acid soil). Item 5, the phos-agric kind (Olsen P 18 mg/kg or more and twice the layer below), applies to any profile, the key scoping it to the Fimi-Orthic Anthrosols; humus films not recorded are inferred from clay_films_amount with a coating value darker than the matrix, flagged (R9) (Hugo, 2026-11-06)."
  - topic: "Siltigic and cumulic epipedons"
    page: "pp. 24-25"
    reading: "Homogeneous: the same or a neighbouring texture class, the moist value or chroma within one unit (Q18 as written; no hue rule), CaCO3 within 20 g/kg (siltigic). The run stops at a layer designated C or R, or, undesignated, at the first layer under 3 g/kg organic carbon or without artefacts; the carbon at its base is that of the last layer kept (D6). The siltigic sieve test is silting_sieve_test, or layered_sorting recorded in micromorph_features (soilKey's convention, R10). The mud-cumulic features are mottle colours, redoximorphic features or a shelly layer recorded in the run (soilKey's convention, R10) (Hugo, 2026-11-06)."
  - topic: "Calcic horizon"
    page: "pp. 40-41"
    reading: "Secondary carbonates not recorded are none. Items c and d compare secondary carbonates in g/kg, which soilKey does not record: the volume share stands in, flagged, 5 and 10 points more than a neighbour. 'More clayey than loamy' is the fine, very-fine and clayey-skeletal classes. The gypsic evidence holds 10-49 g/kg gypsum (capped at 49 as printed, p. 39) (Hugo, 2026-11-06)."
  - topic: "Spodic evidence"
    page: "pp. 32-33"
    reading: "The sign of the spodic evidence is any of: cracked coatings of 1 % or more, a recorded Alo + 1/2 Feo or ODOE (any value, the 50-85 % materials being the gate), or a recorded cementation (soilKey's convention, R10) (Hugo, 2026-11-06)."
  - topic: "Salic evidence"
    page: "p. 42"
    reading: "The salic evidence reads the salts (5 g/kg in an arid region, 2 g/kg elsewhere) or, where they are not measured, the 1:1 EC at the same ratio as the full limits: 7.5 dS/m in an arid region, 3 dS/m elsewhere (soilKey's convention, R10) (Hugo, 2026-11-06)."
  - topic: "Salipan, calcipan, phosphipan"
    page: "pp. 39, 41-42"
    reading: "Cemented: a cementation class moderately cemented or harder (strongly or indurated for the calcipan, which is the petrocalcic) or a rupture resistance very hard or harder; not recorded, absent. The salipan's platy or coarse blocky structure is checked only when a structure is recorded (a massive pan passes) (Hugo, 2026-11-06)."
  - topic: "Plinthic horizon"
    page: "p. 32"
    reading: "The hardening of the plinthite not recorded is absent; the WRB plinthic horizon at 10 % plinthite may stand in, flagged, and can only make the layer pass (D12) (Hugo, 2026-11-06)."
  - topic: "Sulfuric horizon"
    page: "p. 43"
    reading: "The horizon is read on jarosite, sulfate and pH, then the layer under the base of its run must hold sulfidic materials (D10); since 0.9.372 the sulfidic materials characteristic reads them (sulfidic_s_pct 0.01 % or more, an incubation pH under 4, or the WRB stand-ins). Jarosite is jarosite_present, or a mottle colour of 2.5Y or yellower with chroma 6 or more in mottle_colors; not recorded, absent (Hugo, 2026-11-06)."
  - topic: "Neutral hue"
    page: "pp. 22-41"
    reading: "The neutral hue N has no hue: it passes '7.5YR or yellower, even GY, B or BG' (anthrostagnic) and the grey 10YR-7.5Y subhorizon of the hydragric horizon; it fails '5YR or redder' (LAC-ferric, spodic, albic uncoated grains) and the range 7.5YR-10YR (mattic); a neutral layer is never redder or yellower (cambic, argic secondary clayification, agric chromic), and a hue over a neutral layer is (D11) (Hugo, 2026-11-06)."
  - topic: "The horizon panel"
    page: "pp. 20-43"
    reading: "The panel gives each layer the full horizons it holds in the book's order (the first is its code), the evidences, the undecided horizons and the kinds; the natro-argic horizon is shown as an argic horizon of that kind, never beside a cambic horizon (Hugo, 2026-11-06)."
  # --- the diagnostic characteristics (0.9.372) --------------------------------------
  # Hugo's decisions of 2026-11-04 as this part applies them
  - topic: "Isohumic property: Rh 0.4"
    page: "pp. 58-59"
    reading: "Rh, the storage of organic matter (OC x 1.724) within 20 cm over that within 100 cm, is 0.4 or less: the printed '4 or less' is a printing slip, a part of a whole never exceeding 1 (Q9). With a lithic or paralithic contact at 50-100 cm the depths are scaled to the solum (75 cm: 15 and 75) (Hugo, 2026-11-04)."
  - topic: "Storages: the book's default bulk densities"
    page: "pp. 58-60"
    reading: "The isohumic and humic storages use the measured bulk density, else the book's default by horizon and texture (1.2-1.5 Mg/m3), flagged bd_default_cst; an O horizon takes 0.1-0.4 Mg/m3, so a storage and a ratio may be ranges, decided only when the whole range agrees (Q10; Q3 of 2026-11-05) (Hugo, 2026-11-04)."
  - topic: "Gleyic features without a test"
    page: "pp. 55-56"
    reading: "Gley colours in more than half of the matrix (reduced_matrix_pct, else the matrix colour read as 100 %, flagged) with a positive ferricyanide or alpha,alpha'-dipyridyl test (childs_test) or rH 19 or less give the gleyic features; without a test and without Eh they are met provisionally, flagged; a negative test with no Eh, or a measured rH over 19, says no. The evidence: 30-50 % of the matrix meeting all of them, or the colours with rH over 19 to 25 (Q11, default 15) (Hugo, 2026-11-04)."
  - topic: "Methods of the characteristics"
    page: "pp. 61-63"
    reading: "The Ki of the sulfuric attack stands in for the SiO2/Al2O3 of the allitic property, flagged; a CEC by another method stands in, flagged; pH without a method is pH in water (Q16). New attributes are read with their fallbacks (Q20): reduced_matrix_pct, ferricyanide_test, eh_mv, humus_coatings, humic_infillings, pyrophosphate_color, root_mat_pct, sio2_al2o3_clay, sio2_al2o3_naoh, trb_cmol, trb_clay_cmol, p_total_pct, rock_fragment_max_cm, silting_rate_cm_yr, silting_kind, freeze_thaw_days_pct; the hue moist with the dry as a flagged fallback (Q21); 'the whole B' every layer of the B (Q23) (Hugo, 2026-11-04)."
  - topic: "Defaults of the characteristics"
    page: "pp. 50, 56, 62-64"
    reading: "Vertic evidence is [(1) or (2)] and (3) and (4) of its own list (default 19); redoxic item 3 reads chroma 1 or less between dark layers and item 4 a reduced matrix over 0 and under 30 % (default 15); the alic evidence keeps the printed pH(KCl) 4.0 (default 16); the andic 60 % pyroclastic preamble is the concept, not a test (D16); the alluvial character is decided by stratification and carbon, recorded floods confirm it and floods not recorded leave it provisional (default 20); the lithologic characters are read within 125 cm and the calcaric property within 50 cm (default 12) (Hugo, 2026-11-04)."
  # soilKey's readings of this part, decided by Hugo on the review
  - topic: "Organic soil materials and the tiers"
    page: "pp. 43-46"
    reading: "A layer is organic soil material with the carbon of the organic epipedon: litter 200 g/kg or more; peat and mud 120 + 0.1 x clay g/kg (180 at 600 clay) when saturated a month or more (the layer's water_saturation_days, else the most of the upper 50 cm; artificially drained counts as saturated), undecided when the saturation is unknown. Mattic materials are the layers of the mattic epipedon (or its evidence) with 10 % woven roots, without a carbon test. Kind: folic (litter 75 %) before mattic before the fibre classes; the von Post index stands in for the rubbed fibre (H1-H4 fibric, H5-H6 hemic, H7-H10 sapric), flagged; a sapric layer with a light pyrophosphate colour is flagged possibly limnic. The control section is 160 cm when every layer of 0-60 cm has 75 % moss fibres or a bulk density under 0.1, else 130 cm; the surface tier is 0-60 cm only when every layer of 0-60 cm is fibric with 75 % moss fibres or has a bulk density under 0.1 (p. 46), otherwise 0-30 cm (a hemic layer gives the 30 cm tier); undecided between them unless a contact or permafrost ends it first; water layers are not read; the dominant kind of a tier is the thickest, undecided while a layer of it has no kind (Hugo, 2026-11-06)."
  - topic: "Lithologic characters: alluvial, sandy, loess"
    page: "pp. 46-47"
    reading: "Alluvial: stratification is stratification_pattern recorded (other than none) or a numeral prefix of a discontinuity in a layer within 50 cm (flagged); with neither recorded the WRB fluvic material stands in, flagged; the carbon 'decreasing irregularly' is any increase with depth between 25 and 125 cm (or the contact); occasional floods leave it undecided, none or rare fail it. Sandy: every layer of 0-100 cm from the mineral soil surface, the O layers left out (litter is not parent material; v0.9.376, (Hugo on the review, 2026-11-08)) (or to the contact) sand or loamy sand, single grain or very friable blocky, unstratified, and the thickness-weighted organic carbon of that window 1.5 g/kg or less; a structure not recorded leaves it undecided (every description records one). Loess: the hue moist (Q21), the value and chroma dry as printed; 'silt and fine sand predominate' is more than half of the fine earth (silt alone when fine sand is not recorded, flagged); homogeneous is a neighbouring texture class between loess layers (Hugo, 2026-11-06)."
  - topic: "Lithologic characters: purplish, red beds, carbonate rocks, coral sands"
    page: "pp. 47-48"
    reading: "Rock (R) layers carry no soil colour and never make the loess, purplish or red-bed colours undecided. Purplish: 2.5RP-10RP, and rock_fragment_max_cm under 4 in every purplish layer within 125 cm; no coarse fragments recorded (0 %) reads as met, flagged; not recorded undecided. Red beds: the colours of (a) on the moist value and chroma (the dry ones flagged); the northern red earths are a parent material recorded as red earth or red clay with (b): calcareous (10 g/kg CaCO3 or effervescence), carbonate nodules or concretions, base saturation 100 %, or salic evidence, in a layer within 125 cm, with no hue limit; without that parent material record, no northern red earths. Carbonate rocks: the rock is recognised by the rock nouns of parent_material (limestone, dolomite, marl, chalk, travertine, tufa, carbonate rock), never by a calcareous sediment or karst; with no parent material recorded, a contact or rock fragments within 125 cm leave it undecided and nothing rock-like is absent; (b) is any coarse fragments with such a parent material; (c) every layer above the contact within 125 cm. Coral sands: coral or shell in the parent material or a shelly layer, with 50 % USDA sand (0.05-2 mm) and 500 g/kg CaCO3 (Hugo, 2026-11-06)."
  - topic: "Contacts and anthro-silting materials"
    page: "pp. 48-49"
    reading: "The lithic contact is a layer designated R and the paralithic one a Cr read as a contact (Q2 of 2026-11-05); an upper boundary at the depth asked counts; with no designation recorded and a description ending above the depth asked the contact is undecided, otherwise absent. Anthro-silting materials: (1) the silting rate, and (2) stratification or (3) the sieve test (silting_sieve_test, or layered_sorting in thin section), read as alternatives since (3) tests the layers whose stratification tillage erased; a rate of 0.5-10 cm a year without the kind is undecided; the WRB irragric horizon stands in for the rate, flagged (Hugo, 2026-11-06)."
  - topic: "Vertic features"
    page: "pp. 49-50"
    reading: "Item 1 fails with a lithic or paralithic contact within 50 cm (the evidence covers such soils); cracks are a field observation, absent when not recorded, but undecided on a ploughed or irrigated soil (the book's exception); the share of surface cracks 1 cm wide is not read (no attribute records it); intersecting slickensides are common or more, the evidence's slickensides few or more; the evidence clay totals 30 cm within 100 cm (or to the contact); LE sums thickness x COLE to 100 cm or the contact; self-swallowing is humic_infillings in a layer below the surface layer within 100 cm. The anthroturbic layer is a layer with 3 % fragments of former horizons reaching into 25-100 cm; the levelling or terracing is not tested (Hugo, 2026-11-06)."
  - topic: "Gleyic hue bands and redoxic features"
    page: "pp. 55-56"
    reading: "Gleyic colours: the 5Y rule (value 4, chroma 4) covers the hues over 2.5Y up to 7.5Y, the 2.5Y rule (chroma 3) those over 10YR up to 2.5Y; value and chroma moist only (no dry fallback); N passes. Gleyic features by colour alone (Q11, provisional) are not read in an E or albic layer, nor in any layer of a profile whose recorded drainage class is well drained or better (excessively, somewhat excessively, rapidly; moderately well drained does not count; a range or a qualified class takes its worst class, so 'well drained to moderately well drained' does not count; hyphens and underscores read as spaces), unless redox features are recorded in that layer (mottles other than 'none', 'absent', 'nil', '-' or '0', redox concentrations, nodules, or a g or r suffix of its designation) or a saturation regime is recorded (v0.9.377, Hugo, 2026-11-08); without a drainage class a humus-grey A horizon stays provisional, with the alternative. Redoxic: a rust mottle is a mottle colour of chroma 3 or more (or a mottle not read as a colour), or redox concentrations recorded; nodules from ferric, manganiferous or Fe-Mn nodules or an iron pan; item 3 (a low chroma without mottles, 1 or less where the layers above and below are dark at chroma 2, as the book states it) counts under a saturation regime (aquic, stagnic, anthrostagnic, peraquic), not with a recorded drainage class well drained or better, and is undecided otherwise; no carbon exclusion (Hugo, 2026-11-06)."
  - topic: "Permafrost, frost-thawic features, n value"
    page: "pp. 57-58"
    reading: "A permafrost layer is a layer at or below 0 C (permafrost_temp_C) or with a frozen designation (also after a discontinuity numeral: 2Cf); frozen ground is a field observation, so a description reaching the depth asked with no frozen layer has none, and one stopping above it is undecided unless a frost regime without permafrost or a temperature regime frigid or warmer rules permafrost out (cryic does not); the USDA permafrost_within_usda() stands in, flagged. Frost-thawic: cryoturbation also from patterned_ground; the scaly structure is structure_type lenticular (or scaly) in an A or B (not an E; undecided in a layer without designation); diurnal freeze-thaw on 70 % of the days cannot happen under a mesic or warmer regime, so item 4 is then false; otherwise not recorded, undecided. n value: the field fluidity class stands in as ranges (non-fluid under 0.7, slightly fluid 0.7-1.0, moderately or very fluid 1 or more), flagged (Hugo, 2026-11-06)."
  - topic: "Isohumic and humic properties"
    page: "pp. 58-60"
    reading: "Isohumic item 2, 'organic evidence' 5-20 cm thick, is the histic epipedon at least at its evidence grade (default 16); with a lithic or paralithic contact at 50-100 cm the depths are scaled to the contact depth (the total thickness of the horizons), the solum serving the humic storage only; no organic matter in the window is not isohumic; the ratio range takes the low storage of 0-20 cm against the high storage below and the reverse. Humic: the humus 'high in the A and gradually decreasing' is read as the first mineral layer holding the most organic carbon of the mineral layers within 100 cm; humus coatings few or more, or humic infillings, or dark coatings (coatings_value_moist 3 or less, flagged) in a layer of the B; the B is the layers designated B or BC within 125 cm, or with no designation the argic, LAC-ferric, cambic or ferralic horizon and the layers below it, flagged (Hugo, 2026-11-06)."
  - topic: "Andic, ferric, allitic and alic properties"
    page: "pp. 60-63"
    reading: "Andic: the bulk density at 33 kPa is bulk_density_g_cm3; the shaded area of Fig. 3.2 is above the straight line from 30 % glass at 0.40 % Alo + 1/2 Feo to 5 % at 2.0 %; the USDA andic soil properties stand in, flagged. Ferric: every layer of the B meets it (Q23); a layer that may be of the B counts only when it meets the test; a profile without a B has none. Allitic item 1: the clay ratio (alkali fusion) or the fine-earth ratio (acid digestion), the Ki of the sulfuric attack read as the latter, flagged. Allitic and alic: the exclusions of the Ferralosols and Ferrosols are the key's, not read here. Alic item 2: the TRB path only when both TRB are recorded, otherwise the silt/clay ratio decides (Q20); the Al saturation is al_sat_pct, else KCl-Al over the ECEC of the bases and Al; the evidence counts the met items among pH(KCl), Al saturation, KCl-Al per kg clay and its share of the CEC, undecided while the undecided ones could make two (Hugo, 2026-11-06)."
  - topic: "Phosphic, sodic, calcaric properties, base saturation"
    page: "pp. 63-64"
    reading: "Phosphic item 2 is read over the layers from the first to the last with total P: P higher and CaCO3 lower at the top than at the base, with no reversal of over 10 % between layers; the 130 g/kg is what P may reach, not a limit; the WRB ornithogenic material does not stand in (Mehlich-3 P, another measure). Sodic: sodium or magnesium not measured leaves the property undecided (the argic horizon's alkaline-pH rule of 2026-11-06 is not carried over); the evidence is ESP 5 to under 30. Calcaric: the layers whose top lies within 50 cm; measured CaCO3 decides, without it effervescence (flagged), and without either a pH(H2O) under 6.5 is non-calcaric; the 20 g/kg increment over a neighbour (a rock layer excluded) is read on measured CaCO3 only. Base saturation: the key gives the window and whether every layer or some layer; rock layers are not read (Hugo, 2026-11-06)."
  - topic: "Sulfidic materials and the sulfuric horizon"
    page: "pp. 43, 64"
    reading: "The book gives sulfidic materials no number: a layer with 0.01 % sulfidic S (the WRB 2022 number) or an incubation pH under 4 is read as sulfidic, always with a lower grade, and the WRB hypersulfidic and hyposulfidic materials stand in where neither is recorded, flagged. The sulfuric horizon (0.9.371) now reads this characteristic in the layer under its base, with a lower grade only where that layer rests on the WRB stand-ins (Hugo, 2026-11-06)."
  - topic: "The characteristics in the panel"
    page: "pp. 43-64"
    reading: "The horizon panel lists, per layer, the layer characteristics it holds (organic soil materials with their kind, anthroturbic layer, gleyic and redoxic features, permafrost layer, n value 0.7 or more, andic, allitic, alic, phosphic and sodic properties, sulfidic materials) and their evidences (gleyic, alic, phosphic, sodic evidence); undecided characteristics are not listed; provisional gleyic features are marked '(provisional)'; their stand-in functions go to a column of their own, so the lower grade of the horizons is unchanged. The profile characteristics (lithologic characters, contacts, anthro-silting materials, vertic and frost-thawic features, isohumic, humic, ferric and calcaric properties, base saturation, the regimes) are read by the key (Hugo, 2026-11-06)."
  # --- the registry and the key to orders and suborders (0.9.373) ---------------------
  - topic: "Key: the registry and the residual of the Ferralosols"
    page: "pp. 73, 93"
    reading: "cst2001 is registered at order 15 (13 is the German ka5 and 14 South Africa za1991, both planned), with the aliases cst, china and chinese, experimental and opt-in, levels orders and suborders for now. The suborders of the Ferralosols end with soilKey's [E2] [Other Ferralosols] (Q4), whose name stops there; E1 takes udic or perudic (Q4) (Hugo, 2026-11-04)."
  - topic: "Key: the share of the upper 60 cm with andic property"
    page: "pp. 72-73"
    reading: "One reader for A 1, C 2 and D: the share is by thickness (Q22), a layer left undecided counting at both ends of the range; the window runs 60 cm from the soil surface (A) or from the mineral soil surface or the top of an organic layer with andic property, whichever is shallower (C, D), and stops at a shallower lithic or paralithic contact; a contact at the datum gives no andic share. (Hugo, 2026-11-06)."
  - topic: "Key: the organic soil materials of the Histosols"
    page: "p. 72"
    reading: "Cindery, fragmental or pumiceous materials (A 2 a, b) are 90 % or more of coarse fragments or 35 % or more of pyroclastic fragments (the 35 % is the share of the Cinderic subgroups, taken here for the cindery class); not recorded, absent. Item a: organic layers, then cindery layers, then the contact, with no other layer between. Item b is read literally: 40 cm or more of organic soil materials, with the cindery, fragmental or pumiceous materials under them if any, between the soil surface and 50 cm; no cindery layer is needed. Item d: the saturation of the organic layers (any of them 180 days or more), or artificially drained; the total thickness of every organic layer of the profile; moss and bulk density as thickness-weighted means of the organic layers; the kind that is thickest decides sapric or hemic against fibric. Rejected: the cumulative cindery share over the whole profile. (Hugo, 2026-11-06)."
  - topic: "Key: an argic horizon above the spodic one"
    page: "p. 73"
    reading: "An argic layer whose top lies above the top of the first spodic layer; with no spodic layer decided, the test is undecided only while the spodic horizon is. (Hugo, 2026-11-06)."
  - topic: "Key: the base saturation window of the Isohumosols"
    page: "p. 74"
    reading: "The window runs from the mineral soil surface down to the shallowest of 180 cm, 125 cm below the top of an argic horizon, or a contact (the KST reading), every horizon that touches it at 50 % or more (Q23). Rejected: the literal reading that starts the argic window at the top of the argic horizon (it leaves out the horizons between the mollic epipedon and the argic one; the conservative reading tests them). An argic horizon left undecided decides only when both windows agree. A window that reaches below the description: under a calcareous lowest horizon (CaCO3 over 0, or secondary carbonates recorded) the soil below is read as base-saturated; otherwise the window stops at the base of the description and a pass is provisional. (Hugo, 2026-11-06)."
  - topic: "Key: some horizon 10 cm thick within a depth"
    page: "pp. 74, 96, 146"
    reading: "Gleyic features (I) and redoxic features (M2) in some horizon 10 cm or more thick within 50 cm: a run of contiguous layers that share the feature (default 6), counting only the part of it inside the 50 cm; rock layers carry no feature, and organic layers carry no gleyic or redoxic features (features of a mineral matrix). Redoxic features in horizons totalling 10 cm (F1): the sum of the parts inside the window. Rejected: a horizon that starts within 50 cm counted with its whole thickness. Gleyic features resting on gley colours without a test (Q11) assign the class with a warning that the reading is provisional. (Hugo, 2026-11-06)."
  - topic: "Key: the claypan of the Argosols"
    page: "p. 75"
    reading: "The illuviation argillans 0.5 mm or more thick: clay_films_thickness_mm of 0.5 or more in a claypan layer, else distinct or prominent clay films read as thick, flagged (C13); not recorded, absent. (Hugo, 2026-11-06)."
  - topic: "Key: the humic subhorizons of the Humic Spodosols"
    page: "p. 88"
    reading: "Contiguous layers of the spodic horizon with 60 g/kg organic carbon or more totalling 10 cm (C5). (Hugo, 2026-11-06)."
  - topic: "Key: the texture of the Vitric Andosols"
    page: "p. 89"
    reading: "The weighted clay, silt and sand of the mineral soil surface to 100 cm (or a shallower lithic or paralithic contact) give a USDA class; sand, loamy sand and sandy loam are coarser than silt loam, loam is not (amending default 24). (Hugo, 2026-11-06)."
  - topic: "Key: the crack days of the Ustic Vertosols"
    page: "p. 96"
    reading: "Irrigated land passes (the clause does not apply); site cracks_open_days decides when recorded; else cracks 0.5 cm wide in a run of 25 cm within 50 cm, observed, pass the 90 days under an ustic (or aridic) regime, provisionally (Q15); no cracks recorded, absent. (Hugo, 2026-11-06)."
  - topic: "Key: the low n value or clay of the Cambosols"
    page: "p. 75"
    reading: "Item M 3: per layer an n value under 0.7 (the n value reader's FALSE; not measured, under 0.7 in a layer that is not saturated: no saturation regime read, or saturated under 30 days) or less than 80 g/kg clay as printed, in a run 10 cm thick inside 20-50 cm below the mineral soil surface; organic and rock layers do not count. Note: the KST criterion has 8 % clay or more (not less); the Chinese original should be checked before this is changed. (Hugo, 2026-11-06)."
  - topic: "Key: anthro-silting materials within 50 cm"
    page: "p. 167"
    reading: "N1: the profile characteristic, with one of the layers it rests on (stratified or sieve-tested) starting within 50 cm of the mineral soil surface. (Hugo, 2026-11-06)."
  - topic: "Key: datums of the order gates"
    page: "pp. 72-75"
    reading: "Where the key says 'mineral soil surface' the readers take datum mineral: the horizons, the contacts of the Vertosols (F 2, p. 74), the permafrost of the Cambosols (M 4, p. 75) and the anthroturbic layer of the Anthric Primosols (N1, p. 167); the permafrost of the suborders A1 and I1 is read from the soil surface, as printed (the two differ only under an organic cover). (Hugo, 2026-11-06)."
  - topic: "Key: no saturation regime under a well-drained record"
    page: "pp. 51-55"
    reading: "On the saturation axis of the moisture regime, a recorded drainage class of well drained or better (somewhat excessively, excessively, rapidly; with or without 'well', as the ISIS records word it; a range takes its worst class, and hyphens and underscores read as spaces, v0.9.377) rules the stagnic, anthrostagnic, aquic and peraquic regimes out, as it rules out the low chroma of the redoxic features (0.9.372). Without it, a profile with no saturation record stays undecided on that axis, and every key that tests an aquic or stagnic regime before the residual (F1, I2, M2) leaves the name provisional. Rejected: undecided whatever the drainage. (Hugo, 2026-11-06)."
  - topic: "Key: the residuals named for the udic regime"
    page: "pp. 89, 96, 116, 123, 134, 147"
    reading: "D3, F3, J3, K3, L4 and M5 stay residuals (default 25); when the climatic regime read is decided and is neither udic nor perudic, the result carries a note that the class is the key's residual and not the regime its name gives; the class does not change. (Hugo, 2026-11-06)."
  - topic: "Key: the correlation and the book's provisional marks"
    page: "pp. 68-70; 5.2"
    reading: "Tables 4.2 and 4.3 are kept in correlation.yaml and shown as a note (qualifiers$correlation_cst, a warning line, the report and the app), never used to classify (Q1). The book's provisional marks fall on groups and subgroups only (C1.1, C1.1.1, C2.1, D1.1.1, J1.2.1, K1.1.1, M3.5.1), so no class of this part carries book_provisional; the field is read and shown when a later part adds it (Hugo, 2026-11-04)."
  - topic: "Key: names and spellings"
    page: "pp. 72-197"
    reading: "Orders and suborders as printed in the key, in the plural; soilKey's Portuguese gloss in name_pt, for display only. data-raw/cst2001_taxa.csv lists the 779 taxa of Appendix 1 ([A1.3.x] included) and soilKey's [E2], with the canonical spelling of Q2 and the other printed forms as aliases (Hugo, 2026-11-04)."
  - topic: "Review: the spodic materials by colour"
    page: "pp. 32-33"
    reading: "As in the KST, the colours alone (hue 5YR or redder, 7.5YR value 5 or less and chroma 4 or less, 10YR or neutral value and chroma 2 or less, 10YR 3/1) make spodic materials only directly below an albic horizon or an E layer; elsewhere these colours (or 7.5YR value 5 or less, chroma 5-6) need one more sign: cementation, cracked coatings 10 % or more, Alo + 1/2 Feo 0.50 % or more with half or less in the layer above, or ODOE 0.25 or more with half or less above. Measured Alo + 1/2 Feo without the other signs leaves spodic evidence at most; neither oxalate nor ODOE measured leaves the spodic horizon of a red B undecided. Red acid B horizons of Ferralosols, Ferrosols and Argosols are no longer spodic (Hugo, 2026-11-06)."
  - topic: "Review: the anthrostagnic epipedon and the agric horizon on a plain A"
    page: "pp. 26-27, 33-34"
    reading: "When the first mineral layer is not known to be cultivated (a plain A), the core items of the anthrostagnic epipedon (regime, puddling, colour, rust mottles) are read on it: one failing rules the epipedon out, otherwise it stays undecided; the agric horizon is read under that layer and is ruled out where its items fail (Hugo, 2026-11-06)."
  - topic: "Review: data that rule out"
    page: "pp. 27, 39-42, 60-61"
    reading: "A recorded parent material that is not volcanic (no volcanic, tephra, ash, pumice, cinder, scoria, tuff, basalt, andesite, lava, obsidian, ignimbrite or pyroclastic word) rules the andic property out where the data leave it open, flagged. Salts not measured in a layer with pH(H2O) under 5.5, or under a perudic regime, are read as too few for a salic horizon, flagged. Under an aridic regime a surface crust not recorded leaves the aridic epipedon undecided (item 3), not absent (Hugo, 2026-11-06)."
  - topic: "Review: the alternative of a provisional reading"
    page: "pp. 55-56 and the key"
    reading: "When a class is assigned on a reading the book leaves open (gley colours without a ferrous-iron test, Q11; cracks observed for their duration; a window cut at the base of the description), the key is run once more with the gate of that class (the first such one) set to FALSE, and the class it reaches is given as an alternative in $candidates (kind alternative, the class it would replace in instead_of), in a warning and in the trace (phase alternative); it is never the class and never joins provisional_because (Hugo, 2026-11-06). Since v0.9.377 a block of alternatives (any_of) is provisional only when every alternative that passed is; an argic increase without fine clay has its own rerun (see the argic horizon)."
  # --- 0.9.374: the groups (key 5.2) --------------------------------------------------
  - topic: "Groups: soilKey's residuals of the Histosols"
    page: "pp. 76-78"
    reading: "The groups of A1 Permagelic Histosols (no sapric group) and of A2 Orthic Histosols (A2.4 Sapri- is conditional) are closed by soilKey's residuals [A1.4] [Other Permagelic Histosols] and [A2.5] [Other Orthic Histosols], which have no subgroups; the result notes that the name stops there. [E2] [Other Ferralosols] has no groups, with the same note (Q4) (Hugo, 2026-11-04)."
  - topic: "Groups: the book's provisional groups and the residuals named for a regime"
    page: "pp. 88-89, 91, 110, 122, 162, 169-176"
    reading: "C1.1 Hapli-Humic and C2.1 Hapli-Orthic Spodosols are marked provisional in the book (book_provisional). The residual groups named for the udic regime (D2.2 Udi-Vitric, J3.3, M5.7, N2.5, N3.5, N4.7) and H2.2 Aqui-Orthic Halosols, named for the aquic regime, stay residuals; when the regime read on its axis is decided and is not the one of the name, the result carries a note and the class does not change (default 25) (Hugo, 2026-11-04)."
  - topic: "Groups: X evidence"
    page: "pp. 118, 122, 151, 154, 157"
    reading: "Where a group asks for an evidence (cumulic evidence J2.2, gleyic evidence J3.1 and M4.2, folic histic evidence M2.1, siltigic evidence M3.1) the full diagnostic passes too (Q19) (Hugo, 2026-11-04)."
  - topic: "Groups: the B horizon and 'throughout'"
    page: "pp. 125-162"
    reading: "The B horizon is the layers designated B or BC within 125 cm (with no designation, the argic, LAC-ferric, cambic or ferralic horizon and the layers below it, flagged), as the ferric property reads it. 'Throughout the B' asks every B layer to meet the test, and L4.5 'in the B' is read the same way (Q23); a layer that may be of the B counts only when it meets it. 'Some subhorizon(s) 10 cm or more thick of the B' is a run of contiguous B layers 10 cm thick; for K3.2 Hiweatheri the CEC7 under 16, the ECEC under 12 cmol(+)/kg clay and the allitic property hold in the same layers. The Carbonati- groups read the lithologic character within 125 cm, as chapter 3 defines it (Hugo, 2026-11-04)."
  - topic: "Groups: the Foli- groups of the Histosols"
    page: "pp. 76, 78"
    reading: "'Never saturated except for a few days a year': under 30 days of saturation recorded in the organic layers; with no days recorded, a drainage class of well drained or better passes as a stand-in, flagged in the trace and named in a warning; 30 days or more fails; otherwise undecided. 'Folic soil materials': some organic layer of the folic kind (plant residues three fourths or more, p. 45). The contact (lithic or paralithic within 100 cm of the soil surface) and item b of the order (organic plus cindery materials 40 cm within 50 cm) are alternatives ('and/or') (Hugo, 2026-11-07)."
  - topic: "Groups: the kind that predominates in the surface tier"
    page: "pp. 46, 76, 78"
    reading: "Fibri-, Hemi- and Sapri- read the kind of organic soil material with the greatest thickness in the surface tier of the control section (0-30 cm, or 0-60 cm under fibric moss materials); thin mineral layers in the tier are left out of the comparison, as the key allows them; a layer of the tier whose kind is not known leaves the test undecided (Hugo, 2026-11-07)."
  - topic: "Groups: the iron of the Stagnic Anthrosols"
    page: "pp. 35, 82"
    reading: "B1.2: the iron-percoleached greyish subhorizon is the layer directly beneath the anthrostagnic epipedon, not an albic horizon, with the grey colours of hydragric item 2d (hue 10YR-7.5Y, moist value 5-6, moist chroma 2 or less, as the print reads); the grey colour alone decides, with no test of the DCB iron. B1.3: the thickness-weighted DCB iron of the hydragric horizon against that of the anthrostagnic epipedon (its plough pan included), 1.5 times or more (Hugo, 2026-11-07)."
  - topic: "Groups: the hydromorphic cumulic epipedon"
    page: "p. 85"
    reading: "B2.3 Mud-cumuli-: in a layer of the cumulic epipedon, rust mottles (a mottle colour of chroma 3 or more) or redox concentrations on a matrix of moist chroma 2 or less, or shells (shelly_layer); not recorded, absent (Hugo, 2026-11-07)."
  - topic: "Groups: the colours of the Ferralosols"
    page: "p. 93"
    reading: "E1.1 and E1.2 read 'half or more of the horizons within 125 cm' by thickness (Q22) over the mineral soil surface to 125 cm, stopping at a shallower contact; the depth below the base of the description is undecided, and a share that passes only on the part described passes provisionally (flag window_cut_at_description_base, with the alternative the key would reach), as the base saturation window of the Isohumosols does (review D1); 'redder than 5YR' is strict (2.5YR passes, 5YR does not); 7.5YR or yellower includes the neutral hue. The udic regime bordering on the perudic one is the reader of Q8 (Hugo, 2026-11-07)."
  - topic: "Groups: datums of the Aridosols and the natro-argic horizon"
    page: "pp. 37, 101, 103"
    reading: "The groups of the Aridosols are read from the soil surface, as printed (the order gate reads the mineral soil surface; the two differ only under an organic cover), and the natro-argic horizon counts as an argic horizon in G1.3 and G2.4, as in the order gate (p. 37) (Hugo, 2026-11-07)."
  - topic: "Groups: the takyric surface of the Halosols"
    page: "p. 108"
    reading: "H1.1: polygonal cracks recorded (polygonal_cracks_spacing_cm) 1 cm or more wide (cracks_width_cm of the first horizon or the site) through 1-4 cm, read on cracks_depth_cm first; where the depth is not recorded, the thickness of the surface crust stands in (site surface_crust_thickness_cm, else the top horizon with vesicular pores), flagged in the trace and named in a warning; field observations not recorded are absent. H1.2: redoxic features in layers totalling 10 cm within 100 cm (Hugo, 2026-11-07)."
  - topic: "Groups: depths and thicknesses"
    page: "pp. 117-157"
    reading: "J1.1: coral sands in a layer whose top lies within 100 cm of the mineral soil surface. J2.3: the mollic epipedon as the run of its layers, 50 cm or more; a layer below it whose mollic test is undecided counts at the high end, so the thickness is undecided rather than capped (review D2). J3.1: redoxic features and gleyic evidence each in some layer starting within 100 cm (no thickness asked). L2.2: a calcic horizon whose first layer starts 50-125 cm below the mineral soil surface (a calcic horizon starting above 50 cm does not pass). L4.3: a claypan run 10 cm thick inside 0-125 cm. M3.3: redoxic features in a run 10 cm thick inside 50-100 cm. M4.2: redoxic features or gleyic evidence (gleyic features too, Q19; layer_run_cst(grade = 'at_least_evidence'), review D3), each read as its own run 10 cm thick within 50 cm (a run mixing the two is not counted) (Hugo, 2026-11-07)."
  - topic: "Groups: shajiang and the carbonate share"
    page: "pp. 151, 161"
    reading: "M2.2: shajiang_pct 10 % or more in a run 10 cm thick within 125 cm of the mineral soil surface; not recorded, hard carbonate concretions stand in (carbonate_hard_pct, or secondary_carbonates_pct of a hard form), flagged; none recorded, absent (default 13). M5.2: the lithologic character of carbonate rocks is read for the profile (when it holds, every horizon of the window carries it); coral sands layer by layer; 'more than half' strict, by thickness, from the soil surface to 100 cm or a shallower lithic contact, the depth below the description undecided as in E1.1 (review D1) (Hugo, 2026-11-07)."
  - topic: "Groups: slips of the key"
    page: "pp. 85, 91, 114, 128, 137, 147, 151, 154, 175"
    reading: "Kept as the key means them: I3.1 printed 'Other Orthic Gleyosols' though it is the first group; K3.4 'within 125' without 'cm'; L2.4 printed code 'K2.4'; heading 'Key to suborders' over the groups of L3 and 'Key to subgroups' over those of M2; names printed 'Anhrosols' (B2.2), 'Eeath-cumuli' (B2.4), 'sarpric' (A2.4), 'Ferralosls' (E1.1), 'Mollic-Gelic' (M1.4), 'Dark Aquic' (M2.3), 'Siltigi Ustic' (M3.1), 'Purplic-Orthic' (N4.2), 'Argic-Udic' (K3.4); the canonical spelling of Q2 is the name, the other printed forms aliases (Hugo, 2026-11-04)."
  - topic: "Groups: the calcic horizon alone"
    page: "pp. 96, 99, 101, 118, 137"
    reading: "Where a group names the calcic horizon alone (F1.1 with the calcipan, F3.2, G1.1, J2.4, L2.2), a hypercalcic horizon does not count, as printed (calcic_only_cst(); horizon_top_between_cst() for L2.2); F2.1 and G2.1 name the hypercalcic horizon and take it (Hugo, 2026-11-07)."
  # --- 0.9.375: the subgroups of orders A to G (key 5.2) ------------------------------
  - topic: "Subgroups: presets"
    page: "pp. 76-108"
    reading: "Each subgroup is a row of subgroups/{A..G}.yaml in the printed order, Typic the residual; a recurring adjective is a preset of presets.yaml called with the depth, thickness, extent and datum printed for that row (Lithic, Mottlic, Gleyic, Parasalic, Sodic, Sulfic, Dystric, Eutrophic, Trunic, Xanthic, Dark ...), expanded into ordinary blocks when the rules are loaded, so every printed variant stays visible. A complex subgroup (Calcari-mottlic, Aridi-trunic, Gypsi-panic, Sodi-takyric) is both of its parts and is keyed before them, as printed (Hugo, 2026-11-04)."
  - topic: "Subgroups: the Lithic Hemi-Permagelic Histosols of Appendix 1"
    page: "pp. 77-78, 181"
    reading: "[A1.3.x] Lithic Hemi-Permagelic Histosols, listed in Appendix 1 but not in the key, is keyed at its Appendix position (after Terric, before Sapric) with the test of A1.2.3, a lithic contact within the control section, and marked appendix_only; the result notes it (Q3) (Hugo, 2026-11-04)."
  - topic: "Subgroups: X evidence"
    page: "pp. 82-108"
    reading: "Where a subgroup asks for an evidence (vertic, siltigic, fimic, anthrostagnic, hydragric, salic, calcic, gypsic evidence) the full diagnostic passes too, as in the groups (Q19) (Hugo, 2026-11-04)."
  - topic: "Subgroups: some layer, layers totalling, anywhere"
    page: "pp. 80-108"
    reading: "'In some layer(s) 10 cm or more thick' is one run of contiguous layers with the feature, counting the part inside the window (C5); 'in some horizons with a total thickness of 10 cm' (G2.x.2) and F1.2.2 'in at least one horizon with a total thickness of 10 cm' are the sum of the parts inside the window; a feature with no thickness printed (F3.2.1 redoxic features between 50 and 100 cm, F3.1.1 calcic evidence, G1.4.3, G1.4.4, G2.5.6, G2.5.7) passes in any layer that reaches into the window. Rock carries no feature; the gleyic and redoxic features skip organic layers. A window that runs below the base of the description is undecided there unless the description ends on rock or a contact (Hugo on the review, 2026-11-07, replacing soilKey's proposal to read it as absent): the thickness not described joins the upper bound only (of the run that reaches the base, or of the total), so a feature already found in the described part is a firm pass and otherwise the subgroup is undecided and the name provisional; this holds for every feature window (Mottlic, Endogleyic, Gleyic, Sulfic, Parasalic, Sodic, Paracalcic, Paragypsic, the calcic part of G2.5.7, Shajiang F1.1.2) and for the tiers of the Histosols (Terric, Hemic, Sapric). A test with no depth printed (Calcic B2.4.4, the evidences of vertic and fimic) reads the described profile (Hugo, 2026-11-07)."
  - topic: "Subgroups: the Histosols"
    page: "pp. 45-46, 76-81"
    reading: "Buric: a run of mineral layers starting at the soil surface, less than 40 cm thick, over organic soil materials (default 24). Terric: a run of mineral layers 30 cm or more thick (its whole thickness) whose top lies in the subsurface tier. Hemic and Sapric: layers of that kind totalling 25 or 12.5 cm in the subsurface and bottom tiers read together, as in the KST. Lithic 'within the control section': a contact at the base of the control section counts (the section ends at it, p. 45); with the control section undecided (130 or 160 cm), a contact within 130 cm passes and one below 160 cm fails. A1.1.1 takes a lithic or paralithic contact, A2.1.1 a lithic one only, as printed; Parasalic of the Histosols reads from the soil surface (Hugo on the review, 2026-11-07)."
  - topic: "Subgroups: the Anthrosols"
    page: "pp. 82-88"
    reading: "Recalcaric: the CaCO3 pattern alone (default 23): within 60 cm of the soil surface, two layers or more measured, the first (surface) layer over 45 g/kg and the largest, the contents never rising downwards and the last under the first; the human origin is not tested. Fe-leachic (B1.1.5): the grey subhorizon of B1.2 with a layer with gleyic features below it. Fe-accumulic: the reader of B1.3. Albic within 60 cm: the albic horizon reader (an E-type layer, not a B, BC or C). Parasalic of B2.2.2: soluble salts of 5-20 g/kg in an arid region, 1.5-10 g/kg elsewhere, in the cultivated horizon (the layers designated Ap from the mineral soil surface) or, with none, in the first mineral layer; the region as Q14 reads it, and when it is unknown a content in both bands passes and one in neither fails. Dystric (B2.1.5, B2.3.1): base saturation under 50 % or pH (water, Q16) under 5.5 in every horizon touching 25-50 cm (Q23), the window stopped at a shallower contact; a window cut by the base of the description passes provisionally on the described part, with the alternative. Calcic (B2.4.4): the calcic horizon named alone (a hypercalcic horizon is not one) or calcic evidence, anywhere; the calcic evidence of hypercalcic layers counts as evidence (review D5) (Hugo on the review, 2026-11-07)."
  - topic: "Subgroups: the Spodosols, Andosols and Ferralosols"
    page: "pp. 89-96"
    reading: "C2.1.1 Gelic includes the permagelic regime and B2.2.1 Cryic is cryic only (Q7). D1.2.1 Vitric is the reader of D2. Dark of the Andosols: a histic, mollic or umbric epipedon. Alic (D3.x.2): the alic property or alic evidence in a run of B layers 10 cm thick within 125 cm (the B as the groups read it). Trunic (E1.x.1): the ferralic horizon tested on the first mineral layer whatever its designation; anthropic_truncation passes only when that layer has no designation (default 22, amended on the review). Anthrostagnic (E1.x.3): anthrostagnic or hydragric evidence. Xanthic (E1.3.4): the udic regime bordering on the perudic one (Q8) and a hue of 7.5YR or yellower (moist, Q21) in every layer of the upper 10 cm of the B, from the top of its first layer. Mottlic (E1.3.5): redoxic features or a hue of 7.5YR or yellower, each in its own run 10 cm thick within 100 cm, as printed. Eutrophic: base saturation 35 % or more in 80 % or more of the thickness from the mineral soil surface to 125 cm or a shallower contact (Q22), the depth below the description undecided (Hugo on the review, 2026-11-07)."
  - topic: "Subgroups: the Vertosols"
    page: "pp. 97-100"
    reading: "Ustic (F1.x.1): 'in the region with an ustic regime' is the climatic axis of the moisture regime (a recorded climatic regime, the regional climatic_moisture_regime or the aridity index), with the cracks for 90 days as F2 reads them; without a regional record the subgroup is undecided and the Typic provisional (D10). Aridic: the cracks for 210 days, observed cracks passing only under an aridic regime (Q15). Trunic: the first mineral layer designated B or BC, or a transition dominated by the B (BA, B/A); a recorded A, AB, AC or E fails before anything else, and anthropic_truncation passes only when the first layer has no designation (amended on the review). Shajiang (F1.1.2): 10 % or more in layers totalling 10 cm between 50 and 100 cm, hard carbonate concretions standing in, flagged. Lithic (F3.3.1): a lithic or paralithic contact whose top lies between 50 and 100 cm (Hugo on the review, 2026-11-07)."
  - topic: "Subgroups: the Aridosols"
    page: "pp. 101-108"
    reading: "Datums as printed: the subgroups of the Cryic Aridosols read from the soil surface, those of the Orthic Aridosols from the mineral soil surface. Dark: the thickness-weighted moist and dry values of the upper 18 cm of the soil, both needed (3.5 or less moist, 5.5 or less dry); G2.5.7 also asks for calcic evidence within 100 cm, as printed. Argic with lime infiltrates (G1.1.2): an argic horizon within 100 cm with CaCO3 over 0, secondary carbonates or an effervescence recorded in one of its layers (default 23). The natro-argic horizon counts as argic in G1.1.2, G2.1.6 and G2.3.5, as in the groups. Takyric: the reader of H1.1 (crack depth first, the crust thickness a flagged stand-in). Panic: the calcipan (G2.1.3) or the salipan (G2.2.4) within 100 cm; Gypsi-panic both, each starting within 100 cm. Sodic: the sodic property in a run 10 cm thick within 50 cm. Paracalcic and Paragypsic: calcic or gypsic evidence (the full horizon passing too) in a layer reaching into 0-100 cm. G2.5.2 is named Mottlic (Appendix 1), the key's Redoxic an alias (Q2) (Hugo on the review, 2026-11-07)."
  - topic: "Subgroups: presets prepared for the later orders"
    page: "pp. 123-176"
    reading: "The Lithic preset also reads, for the later orders, the fragments alternative (70 % or more by volume of fragments over 2 mm in more than half, or half or more, of the horizons within the depth, by thickness, Q22) and the contact under more than half of the plane (lithic_contact_extent_pct over 50; a contact recorded without its extent passes provisionally, default 22); the hue preset reads a share of the window or of the B, moist (Q21) or dry and moist where the book writes both; the Dystric preset reads the B throughout or in a subhorizon. No subgroup of orders A to G uses these options (soilKey's reading, for Hugo to confirm, 2026-11-07)."
  - topic: "Subgroups: the gypsic horizon alone"
    page: "pp. 104-105"
    reading: "Where a subgroup names the gypsic horizon alone (G2.1.7, G2.2.3, G2.2.5), a hypergypsic horizon does not count (gypsic_only_cst()), by analogy with the calcic horizon named alone; Hyperic (G2.3.4) takes the hypergypsic horizon (Hugo, 2026-11-07)."
  # --- 0.9.376: the subgroups of orders H to N (key 5.2); decided on the review, 2026-11-08 ---------------
  - topic: "Subgroups: H to N, presets"
    page: "pp. 108-180"
    reading: "The 412 subgroups of orders H to N are rows of subgroups/{H..N}.yaml in the printed order, Typic the residual, the recurring adjectives presets of presets.yaml with the numbers printed for each row, kept per taxon as printed (default 7: Sulfic 15 cm within 100 cm in H against 10 cm within 125 cm in I; Parasalic 15 cm in N1.2.1; Lithic 100 cm in M5.4.1 and 25 cm in Verti-lithic; 'more than 80 %' in K2.3.7; 'more than half' against 'half or more' in the Lithic of K1-K2 and K3.3, K3.5); a complex subgroup (Mottli-argic, Mottli-calcic, Calci-argic, Glossi-para-alkalic, Mottli-albic, Humi-brown, Gypsi-salipanic, Verti-lithic) is both of its parts and is keyed before them. Every subgroup is reachable and has an example (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, depths below the description"
    page: "pp. 76-180"
    reading: "As for the feature windows of 0.9.375, a test whose depth runs below the base of the description is undecided there unless the description ends on rock or a contact: the Lithic contact (contact_sg_cst, the Lithic rows of orders A to G included), the horizons with their upper boundary within a depth (upper_within_cst: the gypsic horizon and salipan of H2.1.2 and H2.1.3, alkalic evidence, the argic, sulfuric and plinthic horizons), the B within 125 cm (b_subhorizon_cst and b_throughout_cst, the overlap measured inside 0-125 cm of the mineral soil surface; layer_test_cst on the B; the upper half of the B of M5.4.4), shajiang in a run (the M2.2 group key too), Dilluvic within 200 cm and Recalcaric within 100 cm (L2.4.3; B1.1.4 and B1.4.3 within 60 cm too) (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, Albic"
    page: "pp. 122-167"
    reading: "Albic: an albic horizon, or a glossic horizon or glossic evidence (the glossic horizon at least of the evidence grade), in some layer: anywhere where no depth is printed (M1.5.4, M1.6.4, M2.2.4, M2.3.2), with its top within 125 cm (M4.1.3, M5.1.1, M5.6.2, M5.7.1); the albic horizon alone within 50 cm (M4.2.1). 'Above the argic horizon' (L1.2.3, L1.3.3, L1.3.4, L4.6.4, L4.7.3): an albic layer whose top is above the top of the first argic layer, a glossic one whose top may touch it. 'Below the mollic epipedon' (J3.1.1, J3.2.1): an albic layer whose top is at or below the base of the mollic epipedon. Glossi-para-alkalic (J2.4.3, J2.5.2) reads the glossic horizon or evidence alone, as printed (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, Calcic"
    page: "pp. 118-157"
    reading: "Calcic: the calcic horizon named alone (a hypercalcic horizon does not count, as in the groups) with its upper boundary within 100 cm (J2.1.2, J2.2.2, M1.3.1, M1.4.2) or between 50 and 125 cm (L1.2.2, the top of the first layer of a run); 'a calcic horizon or soft powdery lime' (J2.3.2, J2.3.3, J2.3.5): the calcic horizon or calcic evidence, or soft powdery secondary carbonates recorded in the field, flagged (default 13, C17); 'calcic or hypercalcic horizon or calcipan' (M3.1.2 within 125, M3.4.1 within 100): any of the three; M1.6.2 'calcic horizon or calcic evidence' with the upper boundary within 100 cm, 100 cm itself included as in M1.3.1 (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, base saturation and pH"
    page: "pp. 115-177"
    reading: "Dystric: base saturation under 50 % or pH (water, Q16) under 5.5 in every horizon of the window (Q23): within 25 cm (N2.1.3, N4.2.2), within 50 cm (N1.1.2), 'at least between 20 and 50 cm' (I3.2.2, I3.3.3, M1.3.3, M2.3.3, M2.4.4, N1.2.4, N3.5.2); throughout the claypan (L1.1.4) or the argic horizon or claypan (L4.3.4), every layer of those horizons; throughout the B within 125 cm (M5.1.2, and M5.3.2 'in the B', read throughout, D-M5 a); some subhorizon of the B 10 cm thick (M3.2.3). Eutric is the converse read the same way: N4.3.2 base saturation 50 % or more or pH 5.5 or more in every horizon within 25 cm (the Typic Rougi-Orthic Primosols are the acid ones, and a profile mixed in that depth is Typic); L4.3.3 pH 7.0 or more throughout the argic horizon or claypan (DP-L5 a). Leachic (K2.1.2, K3.1.3, M5.2.4): pH under 6.5 in more than half of the thickness of the horizons within 125 cm of the mineral soil surface, the window stopped at a shallower lithic or paralithic contact (Q22) (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, the B horizon"
    page: "pp. 128-165"
    reading: "Ferric: L4.1.2 the layer test of the ferric property (p. 61) in every layer of the argic horizon or claypan; L4.5.3 'in the B' read throughout the B within 125 cm (Q23); M4.5.4, M4.6.3 in a run of B layers 10 cm thick. Alic: L3.3.2, L4.5.1 in any layer of the B within 125 cm (no thickness printed); M4.5.3 in a run of B layers 10 cm thick; M4.1.4 in any horizon 10 cm thick within 125 cm. Spodic: spodic evidence in a run of 10 cm within 60 cm (M1.5.2) or of B layers 10 cm thick (M4.1.2). Intensic (L3.2.1, L4.4.1): the allitic property in a run of B layers 10 cm thick. Red (L4.5.2, L4.6.5): a hue of 5YR or redder in more than half of the thickness of the B within 125 cm; Red (M5.5.2), Brown (K3.1.5, M5.2.6, L4.2.1) and Rhodic (L2.1.2) over the horizons within 125 cm or above a shallower lithic or paralithic contact (Q22); Rhodic of the Ferrosols (K3.3.7, K3.5.8) dry and moist; the others moist, the dry hue standing in (Q21) (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, Xanthic of the Ali-Udic Cambosols"
    page: "p. 165"
    reading: "M5.4.4 asks for the hue of 7.5YR or yellower 'in at least one subhorizon 10 cm or more thick in the upper part of the B': a run of B layers with the hue, 10 cm or more thick, whose top lies in the upper half of the B, the B cut at 125 cm below the mineral soil surface; a B that may go on below the base of the description leaves its half open. The other Xanthic subgroups read the upper 10 cm of the B as E1.3.4 does. Both need the udic regime bordering on the perudic one (Q8) (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, durations and perched water"
    page: "pp. 126-127, 152, 156"
    reading: "Parasalic with a duration (M2.2.3 within 25 cm, one month a year in 6 of 10 years; M3.3.1 a horizon 10 cm thick within 100 cm, one month a year in most years): salic evidence in the window and site$salic_months_per_year (months a year, in most years) of 1 or more; not recorded, the subgroup passes provisionally on the evidence observed (Q15). Stagnic of the Perudic Ferrosols (K2.2.5, K2.3.5): gleyic evidence in a horizon 10 cm thick within 50 cm and perched water: groundwater_kind perched or the stagnic regime passes; a groundwater table recorded as observed or apparent with a regime that is not stagnic fails; flooded, or nothing recorded, undecided (default 22) (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, the Halosols"
    page: "pp. 109-112"
    reading: "Parasalic of H1 reads horizons totalling 10 cm within 50 cm, as printed. Dilluvic (H2.1.1, Q18): a torrential origin recorded (a layer's layer_origin, or the site's layer_origin, parent_material or landform naming torrential, flash-flood, diluvial or proluvial deposits or an alluvial fan; a field record, absent when not recorded), which stands for the uneven particle size, and soluble salts within 200 cm that change direction with depth over three or more measured layers; a layer not measured, or a description ending above 200 cm (not on rock or a contact), leaves a regular profile undecided. Gypsi-salipanic (H2.1.2): the gypsic horizon named alone and a salipan, both with the upper boundary within 100 cm (the canonical name joins the printed 'Gypsi-sali panic' of the key and 'Gypsi-salipan' of Appendix 1). Gelic (H2.2.1): cryic or colder and frost-thawic features. Marinic (H2.2.3, Q18): in every layer of the salic horizon (or of the salic evidence where there is none), chloride the main anion of the soluble salts (over half of them, or more than the sulfate and the carbonate; the carbonate not measured, at least the rest of the anions, otherwise undecided) and sodium the main cation (over half; under a quarter it cannot be; between, undecided; the exchangeable sodium among the bases stands in, flagged), and a stratification of the deposits recorded in some layer; the seawater influence is read through the Cl and Na, and item 3 is not tested (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, the Gleyosols and organic surfaces"
    page: "pp. 112-116, 134-161"
    reading: "Fibric and Sapric (I1.1.1, I2.1.1, I3.1.1, I3.1.2): a histic epipedon whose layers are mostly, by thickness, of that kind of organic soil material; a hemic histic epipedon falls to Typic. Histic (I1.2.2, M1.1.1, M1.4.1, M1.5.1, M4.4.2, M4.5.1): histic evidence, the histic epipedon passing too (Q19); M1.2.1 and M4.2.2 'histic epipedon (horizon) or histic evidence' the same test. L1.1.1 'histic evidence in the surface horizon': in the first layer of the soil. Epigleyic L1.2.4: gleyic evidence in the first mineral layer; N2.1.2 'at least between 20 and 50 cm': in every layer of that depth (Q23). L1.1.2: gleyic evidence in a run of 10 cm within 100 cm below the top of the first claypan layer. Litteric (N2.4.4): folic histic evidence at the surface (default 24), reachable now that the sandy deposits are read from the mineral soil surface (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, the Argosols"
    page: "pp. 134-146"
    reading: "Trunic: L2.3.1 the argic horizon in the first mineral layer; L4.3.1 the argic horizon or the claypan, the claypan exposed when its argillans of 0.5 mm or more (item 4) qualify the first mineral layer. Recalcaric (L2.4.3, default 23): the CaCO3 pattern of the Recalcaric Anthrosols (over 45 g/kg in the surface horizon and the largest, never rising downwards), read to 100 cm of the mineral soil surface, undecided when the description ends above 100 cm. Shajiang (L4.3.2): 10 % or more in a horizon 10 cm thick between 50 and 100 cm, hard carbonate concretions standing in, flagged. Concretic (L4.1.1): below the base of the albic run, a run of 5 cm or more of layers with Fe-Mn nodules and concretions of 30 % or more by volume (fe_mn_nodules_pct, or the sum of the ferric and manganiferous nodules, flagged) that is indurated (a cementation class indurated or a rupture resistance extremely hard only); field observations, absent when not recorded (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, the Cambosols and Primosols"
    page: "pp. 146-180"
    reading: "Lithic of the karst groups (M4.3.1, M5.2.2): a lithic contact within 50 cm under more than half of the plane, no fragments alternative (default 22). Phosphic (M5.2.1): the lithologic characters of coral sands and the phosphic property or phosphic evidence in more than half of the thickness of the horizons within 100 cm of the soil surface or above a shallower contact; N4.7.1: coral sands and phosphic evidence (the property passing too) in a horizon starting within 25 cm of the mineral soil surface. Para-alkalic (H2.2.5, J2.4.4, J2.5.3, M3.3.2): alkalic evidence (the alkalic horizon passing too) in a horizon whose top lies within 50 or 100 cm, read on its printed items (no argic items). Anthrostagnic (M2.2.1, M2.3.1, M2.4.1): anthrostagnic evidence on a short paddy history beside the aquic regime. Permic: a permagelic regime or a permafrost layer within 200 cm of the mineral soil surface. Grayic (N4.1.1): organic carbon as the thickness-weighted mean of the upper 20 cm of the mineral soil. Cinderic (N4.4.2, N4.7.2, default 21): pyroclastic_fragments_pct as the weighted mean of 0-25 cm, a field observation absent when not recorded, a tephric layer origin read as meeting it, flagged. Verti-lithic (N4.7.4): a lithic or paralithic contact within 25 cm and vertic evidence with one of its layers starting less than 25 cm below the mineral soil surface. Carbonatic (N4.6.1, N4.7.3): the lithologic characters of carbonate rocks. Hy-thermic: the hyperthermic regime (Hugo on the review, 2026-11-08)."
  - topic: "Subgroups: H to N, the names"
    page: "pp. 108-180, 186-197"
    reading: "Names as Appendix 1 and the key print them in the canonical spelling of Q2 (cst2001_taxa.csv), the other printed forms and the singular as aliases: Gypsi-salipanic (key 'Gypsi-sali panic', Appendix 'Gypsi-salipan'), Mottli-argic Pachi-Ustic (the key's 'Cumuli-Ustic' a slip), Mottli-calcic (key 'Mottlic-calcic'), Molli-Gelic, Dark-Aquic, Carbonati-Perudic (Appendix 'Calci-'), Argi-Udic, Alliti-Udic, Hiweatheri-Udic, Grayic (Appendix 'Gray'), Hy-thermic (Appendix 'Hy-themic'), Eutrophic (K3.4.6 printed 'Entrophic'), Permic Geli-Alluvic (printed 'Permic-Geli-Alluvic'), Parasalic Aridi-Alluvic (printed 'Aridic-Alluvic'); codes I3.3.6 (printed I3.5.6) and L4.6.5 (printed 1.4.6.5) as the sequence gives them. J1.2.1, K1.1.1 and M3.5.1 carry the book's own provisional mark (Hugo, 2026-11-04)."
  - topic: "Subgroups: H to N, the provisional remedies"
    page: "pp. 72-180"
    reading: "A class assigned on a provisional reading names what would confirm it from the flags of that reading: a ferrous-iron test (gley colours without a test), a deeper description (a window cut at the base of the description), the extent of the contact under the plane, the months a year with salic evidence, the duration of the cracks, the fine clay of the argic and eluvial layers (v0.9.377, from the rerun only); with none of them named, a ferrous-iron test, a measurement or a duration (Hugo on the review, 2026-11-08)."
  - topic: "Benchmark: hand-written CST names (ISIS)"
    page: "pp. 181-197"
    reading: "A CST name written in a label (ISRIC's ISIS gives the genetic name of the profile, of the Genetic Soil Classification of China, and the CST one, separated by a semicolon) is matched to the key by .cst_match_label(): each part of the label split at semicolons and bars is tried; names compare in lower case on their letters only (hyphens and spaces dropped) with one final s dropped, so the singular, the plural and the hyphenation variants are one name; the table holds the 779 names of the key (14 orders, 39 suborders, 138 groups, 588 subgroups; soilKey's bracketed residuals left out) and the book's aliases; among the parts that match exactly the deepest wins. There is no generic tolerance of misspellings: only when no part matches exactly does the benchmark script try its explicit list of the known slips of the ISIS labels (.cst_isis_variants: Acidi-Undic for Acidi-Udic, CN008; the order name Isohumisols of the 1991 and 1995 proposals read as Isohumosols, CN049, scored at the order), flagged in the report. A genetic name alone (CN043) stays unmatched. The benchmark scores a level only on the labels that reach it; a profile keyed to a bracketed residual counts as a disagreement and is reported apart; the book's own provisional marks are not counted as provisional (Hugo, 2026-11-08)."
  # --- 0.9.407: the spodic horizon reviewed on the ISIS benchmark ---------------
  - topic: "Spodic horizon: the cementation sign"
    page: "pp. 32-33"
    version: "0.9.407"
    reading: "Amends the reading of 2026-11-06 for the spodic horizon only: the cementation that is a sign of spodic materials is a cementation class moderately cemented or harder; a dry rupture resistance (very hard or extremely hard, the consistence of a dry clayey B) is no cementation there. The other cemented layers of the CST (salipan, phosphipan, the contact below the solum, the pans that a cementation excludes) keep the reading of 2026-11-06 (Hugo, 2026-11-13)."
  - topic: "Spodic horizon: the colours below an E layer"
    page: "pp. 32-33"
    version: "0.9.407"
    reading: "Amends the reading of 2026-11-06: the colours alone make spodic materials directly below an albic horizon, or below an E layer when the run of E layers it closes (E, EB) holds an albic horizon or leaves it undecided (colours not recorded); an E of recorded colours that are not albic (10YR 5/6) does not let the colours alone decide, and the other signs are needed (Hugo, 2026-11-13)."
