# The readings soilKey makes of the Chinese Soil Taxonomy (Cooperative
# Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil Taxonomy.
# Science Press, Beijing and New York, 2001; the English edition, system id
# cst2001) where the text is silent or ambiguous. An entry ending "(Hugo,
# 2026-11-04)" is a decision of the owner, in soilKey's words; an entry ending
# "(soilKey's reading, for Hugo to confirm, 2026-11-05)" is soilKey's own and
# waits for his word. Pages are the printed pages of the book (PDF page =
# printed + 15). The criteria are paraphrased; no text of the book is shipped.
# This part (0.9.370) holds the attributes, the shared readers and the
# regimes; 0.9.371 the diagnostic horizons; 0.9.372 the diagnostic
# characteristics (decided on the review, 2026-11-06); later parts the key.
readings:
  # --- the decisions of 2026-11-04 that this part applies ------------------------
  - topic: "Edition and registry names"
    page: "pp. 1-8, 65-71"
    reading: "soilKey implements the English edition of 2001 only, as the system cst2001 (namespace cst, aliases cst and china, experimental and opt-in, registered in a later part); names in English as printed, codes as printed, soilKey's additions in brackets. Every test is three-valued: a measurement not recorded leaves its test undecided, a field observation not recorded is absent (default 1) (Hugo, 2026-11-04)."
  - topic: "Units and conversions"
    page: "pp. 20, 58"
    reading: "The book's contents are g/kg of the element; soilKey stores % by mass, so a threshold is divided by 10 once (thresholds.yaml, units). Fe = 0.699 x Fe2O3, P = 0.437 x P2O5, K = 0.83 x K2O, organic matter = 1.724 x organic carbon. The mixed surface is the thickness-weighted mean of the upper 18 cm (25 cm for a cultivated histic epipedon) (default 9) (Hugo, 2026-11-04)."
  - topic: "Moisture regime when not recorded"
    page: "pp. 51-55"
    reading: "The recorded soil_moisture_regime (torric read as aridic); else Penman's aridity (the new aridity_index and aridity_index_max_month: over 3 aridic, 1 to 3 ustic, under 1 udic or perudic by the highest month); else the site markers, flagged: perched groundwater gives the stagnic regime, flood_irrigated or a paddy land use the anthrostagnic one, a water table within 100 cm with redox features recorded above it the aquic one; otherwise undecided. The reader gives the source, which the trace shows (Q5) (Hugo, 2026-11-04)."
  - topic: "Temperature regime when not recorded"
    page: "pp. 56-57"
    reading: "The recorded soil_temperature_regime; else mean_annual_soil_temp_C; else mean_annual_air_temp_C + 1 C, flagged. Cryic against frigid needs the summer: the new mean_summer_soil_temp_C (with summer_saturated and an O horizon by the designation); without it the two stay undecided (Q6) (Hugo, 2026-11-04)."
  - topic: "The cold regimes"
    page: "pp. 56-57, 89, 100, 134"
    reading: "By the numbers of each regime: gelic (mean annual 0 C or lower) includes the permagelic regime; cryic does not include the colder ones except where the key writes 'or colder' (temperature_regime_cst(or_colder = TRUE)); Boric is frigid or cryic only (Q7) (Hugo, 2026-11-04)."
  - topic: "Udic bordering on perudic"
    page: "pp. 93, 95, 130-165"
    reading: "A new site logical udic_perudic_border; a perudic regime passes too; not recorded, undecided. soil_moisture_subclass, the Canadian subclass, is not used (Q8) (Hugo, 2026-11-04)."
  - topic: "Default bulk densities"
    page: "pp. 58-59"
    reading: "Measured bulk density where recorded, else the book's default by horizon and texture, flagged (bd_default_cst): loamy or sandier A 1.2, AB 1.3, B and BC 1.4, C of earthy sediments 1.4; clay loamy or clayey A 1.3, AB 1.4, B and BC 1.5 (Q10) (Hugo, 2026-11-04)."
  - topic: "Salic horizon: salts and the 1:1 EC"
    page: "pp. 39, 42"
    reading: "A new horizon attribute ec_1to1_dS_m; the saturated-paste EC (ec_dS_m) and the 1:5 EC are never converted to it (Q13) (Hugo, 2026-11-04)."
  - topic: "Arid regions"
    page: "pp. 42, 52"
    reading: "An arid region is a recorded aridic regime (of the soil, or the new climatic_moisture_regime of the region) or an aridity over 3 (3 to 3.5 included, where the ustic range overlaps); unknown otherwise, and the salic tests then pass above the higher limit, fail below the lower and stay undecided between (Q14) (Hugo, 2026-11-04)."
  - topic: "Methods"
    page: "pp. 20, 26, 31, 33-34, 62"
    reading: "Water pH of any ratio, weatherable minerals of 20-200 um and the Ki of the sulfuric attack stand in, flagged; Mehlich-3 P never stands for Olsen P (the new p_olsen_mg_kg) and pH in KCl never for water pH; a pH without a method is water pH (Q16) (Hugo, 2026-11-04)."
  - topic: "New attributes"
    page: "-"
    reading: "All the attributes of the plan enter in this part, each with its fallback in its description: on the horizons fine_clay_pct, clay_films_thickness_mm, humus_clay_films_pct, humus_clay_films_mm, micromorph_argillans_pct, micromorph_features, tongue_depth_cm, albic_materials_pct, spodic_materials_pct, cracked_coatings_pct, odoe, pyrophosphate_color, root_mat_pct, root_mat, reduced_matrix_pct, ferricyanide_test, eh_mv, humic_infillings, humus_coatings, silting_sieve_test, puddled, p_olsen_mg_kg, p_total_pct, k_total_pct, ec_1to1_dS_m, sio2_al2o3_clay, sio2_al2o3_naoh, trb_cmol, trb_clay_cmol, gravel_carbonate_coating, plinthite_hardens, rock_fragment_max_cm, shajiang_pct, fe_mn_nodules_pct, pyroclastic_fragments_pct, soluble_salts_sodium_pct; on the site aridity_index, aridity_index_max_month, climatic_moisture_regime, udic_perudic_border, mean_summer_soil_temp_C, summer_saturated, cracks_open_days, irrigated, freeze_thaw_days_pct, surface_crust_thickness_cm, silting_rate_cm_yr, silting_kind, paddy_years_frac, lithic_contact_extent_pct; the regime values stagnic, anthrostagnic, peraquic and permagelic (Q20; defaults 13, 14, 21) (Hugo, 2026-11-04)."
  - topic: "Hue: moist first"
    page: "pp. 47, 129-133"
    reading: "A hue test reads the moist hue; the dry hue where no moist one is recorded, flagged (hue_dry_for_moist); where the book writes dry and moist, both (Q21) (Hugo, 2026-11-04)."
  - topic: "Shares of a window"
    page: "pp. 93, 124-166"
    reading: "'More than half' and '80 % or more' of the horizons to 125 cm are shares of the thickness of the window, read as a range (the horizons that meet the test against those that may), so undescribed or undecided depth leaves the answer open only when it could change it (Q22) (Hugo, 2026-11-04)."
  - topic: "Windows"
    page: "pp. 61-62, 86, 115-177"
    reading: "A test in a window ('at least between 20 and 50 cm', 'throughout the B to 125 cm', 'in the B to 125 cm') is met when every horizon that touches the window meets it; undecided when one lacks the data or part of the window is not described; 'some subhorizon 10 cm thick' stays one (Q23) (Hugo, 2026-11-04)."
  - topic: "The regime values in the other keys"
    page: "pp. 51-57"
    reading: "soil_moisture_regime takes stagnic, anthrostagnic and peraquic, soil_temperature_regime permagelic. The USDA key reads the three moisture values as aquic and permagelic as gelic; pergelic is read by the CST as gelic (p. 56); the iso regimes are read without 'iso' (the CST has none); xeric has no CST counterpart. Permagelic also when permafrost starts within 50 cm, flagged (default 8) (Hugo, 2026-11-04)."
  - topic: "Irrigation"
    page: "p. 156"
    reading: "A new site logical irrigated; flood_irrigated TRUE implies it (default 10) (Hugo, 2026-11-04)."
  # --- the readings of this part, confirmed or amended by Hugo on its review --------
  - topic: "Two axes of the moisture regime"
    page: "pp. 51-55, 81"
    reading: "The moisture regime is read on two axes. The climatic axis (aridic, ustic, udic, perudic) comes from a recorded climatic soil_moisture_regime, else climatic_moisture_regime, else the aridity index; the saturation axis (stagnic, anthrostagnic, aquic, peraquic) from a recorded saturation regime, else the site markers (paddy records, tidal flooding or water above the surface, perched water, a shallow water table with redox features). Each test reads its own axis, and a value on one axis says nothing of the other (undecided, not false): a paddy soil recorded udic is anthrostagnic, a saline soil of an arid climate with a shallow water table is aquic, and a saturation regime alone leaves the udic-perudic border undecided. This replaces soilKey's first reading (paddy records before the aridity index) (D1) (Hugo, 2026-11-05)."
  - topic: "A recorded regime the CST does not have"
    page: "pp. 51-57"
    reading: "A recorded xeric moisture regime, or any value outside the CST's lists, is noted and the regime is read from the other records (aridity index, markers, temperatures) as if none were recorded (Hugo, 2026-11-05)."
  - topic: "The aquic marker"
    page: "pp. 54-56"
    reading: "A water table within 100 cm (groundwater_depth_cm, 100 included) with mottle colours, redoximorphic features or ferric or manganiferous nodules recorded in a horizon whose top is within 100 cm gives the aquic or the peraquic regime (undecided between them, flagged). The peraquic regime itself (a water table always at or near the surface, p. 55) is read from tidal flooding (tidal_zone intertidal or subtidal, tidal_inundation) or water standing above the surface (water_table_cm_above_surface over 0) (D2) (Hugo, 2026-11-05)."
  - topic: "Peraquic within aquic"
    page: "pp. 54-55"
    reading: "The book defines the peraquic regime as an aquic one with the water table always at or near the surface; a test for the aquic regime passes a peraquic soil (Hugo, 2026-11-05)."
  - topic: "Permafrost within 50 cm"
    page: "pp. 56-57"
    reading: "Permafrost starts within 50 cm when a horizon whose top lies at or above 50 cm has a permafrost temperature at or below 0 C or a frozen designation; it is absent when the recorded frost regime has no permafrost or the horizon at 50 cm is above 0 C. The permafrost_temp_C of the horizon at 50 cm (or above a shallower contact) is the mean annual soil temperature when mean_annual_soil_temp_C is not recorded. Permafrost within 50 cm gives the permagelic regime ahead of any estimate from the air; against a measured soil temperature above 0 C it is a conflict, flagged, and the regime is undecided. A recorded gelic regime becomes permagelic, flagged; a recorded cryic or warmer one is kept, with a note (D3) (Hugo, 2026-11-05)."
  - topic: "Cryic and frigid with partial summer data"
    page: "p. 57"
    reading: "With the summer soil temperature recorded but the summer saturation or the O horizon unknown, the reader decides when every possible limit agrees (under 6 C cryic for any case, 15 C or more frigid for any case) and leaves the rest undecided. Organic soils, whose cryic criteria are frozen layers after the summer solstice, stay undecided between cryic and frigid without a recorded regime (Hugo, 2026-11-05)."
  - topic: "Udic bordering on perudic from the regime"
    page: "pp. 93, 95"
    reading: "Read on the climatic axis: a climatic regime that is neither udic nor perudic fails, even with udic_perudic_border TRUE (the conflict is noted); a perudic regime passes (recorded, or from the aridity index, every month under 1, flagged); else udic_perudic_border; else undecided. A saturation regime says nothing of it (Hugo, 2026-11-05)."
  - topic: "The arid region from the soil's regime"
    page: "p. 42"
    reading: "The region is read in this order: climatic_moisture_regime, aridity_index, soil_moisture_regime. A soil regime of ustic, udic or perudic says the region is not arid; aquic, peraquic, stagnic, anthrostagnic and xeric say nothing of it (a saline aquic soil may lie in an arid region) (Hugo, 2026-11-05)."
  - topic: "Kinds and textures of the default bulk densities"
    page: "pp. 21, 58-59"
    reading: "The horizon kind comes from the designation (a discontinuity numeral taken off): A; AB, BA, A/B; B; BC, CB, B/C; a C of loamy or sandier texture (the earthy sediments of the isohumic footnote, which the humic footnote omits; one table for both). E, AC, a clayey C and an undesignated horizon get no default, so the storage stays undecided there unless measured; a horizon with no carbon needs no density. An O horizon with carbon and no measured density takes the range 0.1-0.4 Mg/m3 of the peaty histic epipedon, flagged: the storage becomes a range and decides a limit only when the whole range lies on one side of it (Q3). The texture group is the horizon's own USDA class (sand, loamy sand, sandy loam, loam, silt loam, silt against the clay loams and clays), or clay under 20 % / 27 % or more when no class can be made; the book's 'loamy or more sandy soil' is read per horizon, soilKey's reading (Q4). The storage window ends at a lithic or paralithic contact; with the contact between 50 and 100 cm, the storage of the solum stands for it and the isohumic depths are scaled to the solum (the footnotes of pp. 58-59) (Hugo, 2026-11-05)."
  - topic: "CEC by another method"
    page: "p. 31"
    reading: "CEC per kg of clay is cec_cmol x 100 / clay_pct; a CEC whose cec_method is recorded and is not ammonium acetate at pH 7 stands in, flagged (cec_method_substitute), as the RP reads its CEC. The ECEC per kg of clay sums the bases and KCl Al (al_kcl_cmol, else al_cmol), else reads ecec_cmol (Hugo, 2026-11-05)."
  - topic: "Very fine sand or finer"
    page: "pp. 30-31"
    reading: "'Very fine sand, loamy very fine sand or finer' (cambic, LAC-ferric): every class but sand and loamy sand passes; a sand or loamy sand fails when its 0.05-0.2 mm sand (fine_sand_pct) is under 50 % of the fine earth (its very fine sand cannot reach 50 %), and is undecided otherwise, since soilKey records no very fine sand (Hugo, 2026-11-05)."
  - topic: "Particle-size classes of the calcic horizon"
    page: "p. 40"
    reading: "The USDA particle-size class is read on the horizon itself, not over a family control section: skeletal at 35 % rock fragments by volume (none when not recorded), fragmental at 90 %, sandy for sand and loamy sand, fine and very-fine at 35 and 60 % clay. Loamy against silty needs 15 % sand coarser than very fine sand: under 15 % sand silty; loamy when the sand coarser than 0.2 mm (sand_pct minus fine_sand_pct) reaches 15 %; otherwise undecided, as for the silt loams of the loess plateau (Q1) (Hugo, 2026-11-05)."
  - topic: "Mineral soil surface and solum"
    page: "pp. 21-24, 43"
    reading: "The mineral soil surface is the top of the first horizon not designated O or H. Without a designation it is read by the carbon of the organic soil materials: under 12 % mineral; 20 % or more organic (skipped); between, organic from 12 % plus a tenth of the clay % (120 + 0.1 x clay g/kg, 18 % at 60 % clay), undecided without clay (D4). The solum runs from it to the base of the deepest A, E or B horizon (AB, BC included) above the first C, AC or contact (Hugo, 2026-11-05)."
  - topic: "Cr and the older Chinese notation"
    page: "-"
    reading: "R is a lithic contact. Cr is a paralithic contact only when the profile declares an FAO, WRB or USDA notation (site$designation_system) or the horizon records a contact (cementation, rupture resistance hard or harder, saprolite, a weathering stage, the rock of origin); otherwise its r is the redox suffix of the Chinese field notation and the horizon is a C (Q2). The older Chinese paddy notation is read as P (the plough pan) an A, W (waterlogged) and G (gley) a B (Hugo, 2026-11-05)."
  - topic: "Paddy land use words"
    page: "p. 81"
    reading: "A paddy land use names paddy, rice, sawah or irrigated rice (arroz irrigado) as whole words, or the Chinese or Japanese words for paddy field and rice; upland, dryland and rainfed rice and uses of rice straw, husks or mulch are not paddy (D5) (Hugo, 2026-11-05)."
  # --- the diagnostic horizons (0.9.371), decided on the review (Hugo, 2026-11-06) ----
  - topic: "Grades of the horizons"
    page: "p. 19"
    reading: "Every horizon reader gives each layer a grade: full, evidence (the book's weaker grade, only where the book defines one), none, or undecided; the profile takes the best grade a layer reaches. The key asks for grade full (default), evidence (the weak grade only) or at_least_evidence (Q19 reads a bare 'X evidence' as at least evidence) (Hugo, 2026-11-06)."
  - topic: "Stand-ins of the horizons"
    page: "pp. 20-43"
    reading: "A WRB or USDA diagnostic of soilKey is asked only where the CST reading of a layer is undecided, or false only because a field descriptor was not recorded, and settles only the items it covers: it acts on the argic horizon only when the sodic property and the alkalic horizon are decided, on the aridic epipedon only when item 2 (no salic horizon) holds, on the hydragric items 4 and 5 only on the layers where the WRB hydragric horizon passes (elsewhere they stay undecided). It can only make a layer pass, flagged (stand_in:<function>) with a lower grade in the report, never make it fail. The WRB salic horizon does not stand in (its saturated-paste EC is the conversion Q13 rejects), nor any diagnostic for the salic crust, the hypersalic horizon, the salipan, the hypercalcic horizon, the phosphipan or the LAC-ferric horizon (Hugo, 2026-11-06)."
  - topic: "A horizon of several layers"
    page: "pp. 20-43"
    reading: "A horizon is a run of contiguous layers that share the property; its thickness is the run's, a range when undecided layers may belong to it; a product of thickness and content (gypsic, calcipan, salic) sums the layers of the run. Epipedons run from the soil surface (histic, mattic, salic crust) or from the mineral soil surface (the others) (default 6) (Hugo, 2026-11-06)."
  - topic: "Histic epipedon: saturation and kind"
    page: "pp. 21-22"
    reading: "The saturation of the profile is the longest water_saturation_days recorded in the upper 50 cm (artificially_drained reads as saturated, the peaty kind). Not recorded, the layer passes only when both the peaty and the littery reading pass. Organic layers thicker than the peaty kind allows (60 cm) are no histic epipedon but an organic soil (the order A, a later part). The sphagnum share and the bulk density of the 60 cm limit are read on the top layer (soilKey's convention, R10); the 40 cm in total within the upper 50 cm count only with a mineral layer over or among the organic ones (Hugo, 2026-11-06)."
  - topic: "Mattic epipedon: the mat and the evidence"
    page: "pp. 22-23"
    reading: "The elastic mat (root_mat) not recorded is absent, but a recorded share of mat roots of 50 % or more stands for it. The mattic evidence is read on its thickness (2 cm) and its share of mat roots (10 %) only; the colour, C/N, saturation, bulk density and regime of the full epipedon are not asked of it (Hugo, 2026-11-06)."
  - topic: "Mollic and umbric epipedons: the C and the structure"
    page: "pp. 23-24"
    reading: "The colour contrast with the C horizon is not tested when no C is described (as the KST, 'if a C horizon is present'); with dry colours missing on either side it is read on the moist ones, flagged. A structure not recorded leaves the mollic structure item (and the cambic structure item) undecided, not absent: it describes every horizon, it is not a feature. Small and medium blocky structure count as 'not coarse' for the mollic epipedon (R4). A cultivated surface (Ap) is read as the mixed upper 18 cm for colour and carbon (p. 21) (Hugo, 2026-11-06)."
  - topic: "Ochric epipedon"
    page: "p. 24"
    reading: "The ochric epipedon is the residual of the humic epipedons (R3): the first mineral layer is ochric when no mollic or umbric epipedon holds and it is light coloured, poor in carbon, or dark and rich enough but too thin or failing the mollic only on its structure; one undecided mollic or umbric leaves it undecided (Hugo, 2026-11-06)."
  - topic: "Aridic epipedon"
    page: "pp. 27-28"
    reading: "Item 1b reads a dune or sand sheet (aeolian_morphology) or a sand or loamy sand top layer; 1c a biological crust; 1d polygonal cracks up to 1 cm wide (1-4 cm deep when recorded). 'Much gypsum' (item 4) is 50 g/kg (5 %) or visible gypsum in the upper two layers. The platy layer is one of the upper two layers, 10 cm thick or less. The surface features are field observations: not recorded, absent; then the WRB yermic or takyric properties may stand in, only when item 2 holds (Hugo, 2026-11-06)."
  - topic: "Albic and glossic horizons"
    page: "pp. 28-30"
    reading: "The albic horizon is an E: it lies under another layer (an A, or an O where no A is), and a layer designated O, B, BC, C or R is none (grey gleyed B and C layers share its colours). Chroma is the moist one, the dry one where no moist is recorded, flagged. 'Uncoated grains' (item 2b) are half the grains or more (uncoated_grains_pct). Without albic_materials_pct the layer's colour stands for 100 % albic materials, flagged. Tongues are recorded on the layer they penetrate, the glossic layer itself; the albic layer reads the tongue depth of the layer below it, so tongues recorded on the E do not remove its albic horizon (R6). Table 3.1 gives no width for sandy layers: they take the loamy 15 mm (Hugo, 2026-11-06)."
  - topic: "Cambic horizon"
    page: "pp. 29-31"
    reading: "Candidates are B, AB and BC layers, or undesignated layers below the first mineral one. 'Redder or yellower hue than the horizon below' is any other hue up to 5Y; 'evidence of removal of carbonates' is 1 % (10 g/kg) CaCO3 less than a calcareous horizon below (1 % or more). In an aridic moisture regime or a cryic, frigid or colder temperature regime 5 cm of thickness waives both limits, the 10 cm and the lower boundary at 25 cm or deeper (R1). Item 6 makes a layer undecided while the argic, spodic, ferralic or LAC-ferric reading of it is undecided; a natro-argic layer (the illuvial evidence of the argic horizon) is no cambic horizon (D7) (Hugo, 2026-11-06)."
  - topic: "Argic horizon"
    page: "pp. 35-38"
    reading: "Item 1 fails for a recorded stratification (stratification_pattern other than none) or a fluvial, marine or lacustrine layer_origin of the layer itself. The eluvial horizon of item 2b is the layer with least clay above, from the mineral surface, of the same material (designation numeral and layer_origin), among the layers whose base lies within 30 cm above the layer's top (D2, pp. 35-36). Clay films on 'few' faces are under 5 %; films not recorded are absent; a thin section not recorded (item 2c, an alternative) adds nothing. A layer with the sodic property is a natro-argic horizon: argic only where the key asks for it (natro = TRUE, the Aridosols). An alkalic horizon is no argic horizon by either path. The argic, ferralic, LAC-ferric and spodic horizons are B horizons: a layer designated O, A, E, C or R is none of them (the designation as the identity of the horizon, plan section 6); an undesignated layer may be any. Secondary clayification: 'almost the same' Ki within 10 %; 'more compact' by bulk density; 10 cm thick (5 cm in an aridic regime); items c and d are alternatives ('c; or d; and e'), d read only from a recorded thin section (micromorph_features): item 3d is not mandatory, so Q17 does not apply to it (D9) (Hugo, 2026-11-06)."
  - topic: "Argic horizon exposed by erosion"
    page: "pp. 35, 37-38"
    reading: "A first mineral layer designated B (the A eroded) may be an argic horizon by its clay films (item 2a) or its thin section (item 2c); item 2b, which compares it with an eluvial layer above, cannot apply there (D8) (Hugo, 2026-11-06)."
  - topic: "The sodic property of the argic horizon"
    page: "p. 63"
    reading: "Sodium not measured, or the Na + Mg share not measurable (Na or Mg not recorded), is read as no sodic property unless the layer is alkaline (pH 8.5 or more), where it stays undecided; a measured ESP under 30 with Mg not recorded is no sodic property (D3) (Hugo, 2026-11-06)."
  - topic: "Clay-pan and alkalic horizon"
    page: "pp. 38-39"
    reading: "The clay-pan needs a recorded prismatic or columnar structure (a consistence, when recorded, firm or firmer), the argic increase over the first mineral layer and twice the clay of an albic horizon above, or argillans 0.5 mm or thicker; its thin section counts as met unless recorded otherwise (Q17), flagged. The alkalic evidence is the argic items 2a-d with an ESP of 5-29 within 40 cm of the layer's top; its weak structure and its pH are not required (Hugo, 2026-11-06)."
  - topic: "Fimic and anthrostagnic epipedons"
    page: "pp. 25-27"
    reading: "The fimic epipedon is the run of A and AB layers from the mineral surface (without designations, of layers with 4.5 g/kg carbon or more); its evidence allows one of its three numbers in the lower band. The anthrostagnic epipedon is the run of the cultivated layer and its plough pan from the surface: Ap layers, or in the older Chinese notation (A-P-W-G) the A directly above the P (or W) and the P itself; where cultivation cannot be identified it is undecided, never absent (D1). The plough pan is the lowest of them (two layers at least); the moist colour is read for the submerged one, flagged, its hue 7.5YR or yellower or neutral (soilKey's convention on the hue rank, R10); rust mottles not recorded are absent; a recorded paddy_years_frac of 0.5 or less gives the evidence only, not recorded the regime reader decides (Q12) (Hugo, 2026-11-06)."
  - topic: "Hydragric horizon"
    page: "pp. 34-35"
    reading: "The hydragric horizon may lie under the anthrostagnic evidence as well as under the full epipedon; the key decides which it asks for (R7) (Hugo, 2026-11-06)."
  - topic: "Agric horizon"
    page: "pp. 33-34"
    reading: "The agric horizon is the run of layers directly under the cultivated layers (Ap, or the A and P of the older notation). Item 3 applies when the layer below is 7.5YR or redder (a chromic soil), the hue at most one step yellower; item 4 when the layer below is under pH 5.5 (an acid soil). Item 5, the phos-agric kind (Olsen P 18 mg/kg or more and twice the layer below), applies to any profile, the key scoping it to the Fimi-Orthic Anthrosols; humus films not recorded are inferred from clay_films_amount with a coating value darker than the matrix, flagged (R9) (Hugo, 2026-11-06)."
  - topic: "Siltigic and cumulic epipedons"
    page: "pp. 24-25"
    reading: "Homogeneous: the same or a neighbouring texture class, the moist value or chroma within one unit (Q18 as written; no hue rule), CaCO3 within 20 g/kg (siltigic). The run stops at a layer designated C or R, or, undesignated, at the first layer under 3 g/kg organic carbon or without artefacts; the carbon at its base is that of the last layer kept (D6). The siltigic sieve test is silting_sieve_test, or layered_sorting recorded in micromorph_features (soilKey's convention, R10). The mud-cumulic features are mottle colours, redoximorphic features or a shelly layer recorded in the run (soilKey's convention, R10) (Hugo, 2026-11-06)."
  - topic: "Calcic horizon"
    page: "pp. 40-41"
    reading: "Secondary carbonates not recorded are none. Items c and d compare secondary carbonates in g/kg, which soilKey does not record: the volume share stands in, flagged, 5 and 10 points more than a neighbour. 'More clayey than loamy' is the fine, very-fine and clayey-skeletal classes. The gypsic evidence holds 10-49 g/kg gypsum (capped at 49 as printed, p. 39) (Hugo, 2026-11-06)."
  - topic: "Spodic evidence"
    page: "pp. 32-33"
    reading: "The sign of the spodic evidence is any of: cracked coatings of 1 % or more, a recorded Alo + 1/2 Feo or ODOE (any value, the 50-85 % materials being the gate), or a recorded cementation (soilKey's convention, R10) (Hugo, 2026-11-06)."
  - topic: "Salic evidence"
    page: "p. 42"
    reading: "The salic evidence reads the salts (5 g/kg in an arid region, 2 g/kg elsewhere) or, where they are not measured, the 1:1 EC at the same ratio as the full limits: 7.5 dS/m in an arid region, 3 dS/m elsewhere (soilKey's convention, R10) (Hugo, 2026-11-06)."
  - topic: "Salipan, calcipan, phosphipan"
    page: "pp. 39, 41-42"
    reading: "Cemented: a cementation class moderately cemented or harder (strongly or indurated for the calcipan, which is the petrocalcic) or a rupture resistance very hard or harder; not recorded, absent. The salipan's platy or coarse blocky structure is checked only when a structure is recorded (a massive pan passes) (Hugo, 2026-11-06)."
  - topic: "Plinthic horizon"
    page: "p. 32"
    reading: "The hardening of the plinthite not recorded is absent; the WRB plinthic horizon at 10 % plinthite may stand in, flagged, and can only make the layer pass (D12) (Hugo, 2026-11-06)."
  - topic: "Sulfuric horizon"
    page: "p. 43"
    reading: "The horizon is read on jarosite, sulfate and pH, then the layer under the base of its run must hold sulfidic materials (D10); since 0.9.372 the sulfidic materials characteristic reads them (sulfidic_s_pct 0.01 % or more, an incubation pH under 4, or the WRB stand-ins). Jarosite is jarosite_present, or a mottle colour of 2.5Y or yellower with chroma 6 or more in mottle_colors; not recorded, absent (Hugo, 2026-11-06)."
  - topic: "Neutral hue"
    page: "pp. 22-41"
    reading: "The neutral hue N has no hue: it passes '7.5YR or yellower, even GY, B or BG' (anthrostagnic) and the grey 10YR-7.5Y subhorizon of the hydragric horizon; it fails '5YR or redder' (LAC-ferric, spodic, albic uncoated grains) and the range 7.5YR-10YR (mattic); a neutral layer is never redder or yellower (cambic, argic secondary clayification, agric chromic), and a hue over a neutral layer is (D11) (Hugo, 2026-11-06)."
  - topic: "The horizon panel"
    page: "pp. 20-43"
    reading: "The panel gives each layer the full horizons it holds in the book's order (the first is its code), the evidences, the undecided horizons and the kinds; the natro-argic horizon is shown as an argic horizon of that kind, never beside a cambic horizon (Hugo, 2026-11-06)."
  # --- the diagnostic characteristics (0.9.372) --------------------------------------
  # Hugo's decisions of 2026-11-04 as this part applies them
  - topic: "Isohumic property: Rh 0.4"
    page: "pp. 58-59"
    reading: "Rh, the storage of organic matter (OC x 1.724) within 20 cm over that within 100 cm, is 0.4 or less: the printed '4 or less' is a printing slip, a part of a whole never exceeding 1 (Q9). With a lithic or paralithic contact at 50-100 cm the depths are scaled to the solum (75 cm: 15 and 75) (Hugo, 2026-11-04)."
  - topic: "Storages: the book's default bulk densities"
    page: "pp. 58-60"
    reading: "The isohumic and humic storages use the measured bulk density, else the book's default by horizon and texture (1.2-1.5 Mg/m3), flagged bd_default_cst; an O horizon takes 0.1-0.4 Mg/m3, so a storage and a ratio may be ranges, decided only when the whole range agrees (Q10; Q3 of 2026-11-05) (Hugo, 2026-11-04)."
  - topic: "Gleyic features without a test"
    page: "pp. 55-56"
    reading: "Gley colours in more than half of the matrix (reduced_matrix_pct, else the matrix colour read as 100 %, flagged) with a positive ferricyanide or alpha,alpha'-dipyridyl test (childs_test) or rH 19 or less give the gleyic features; without a test and without Eh they are met provisionally, flagged; a negative test with no Eh, or a measured rH over 19, says no. The evidence: 30-50 % of the matrix meeting all of them, or the colours with rH over 19 to 25 (Q11, default 15) (Hugo, 2026-11-04)."
  - topic: "Methods of the characteristics"
    page: "pp. 61-63"
    reading: "The Ki of the sulfuric attack stands in for the SiO2/Al2O3 of the allitic property, flagged; a CEC by another method stands in, flagged; pH without a method is pH in water (Q16). New attributes are read with their fallbacks (Q20): reduced_matrix_pct, ferricyanide_test, eh_mv, humus_coatings, humic_infillings, pyrophosphate_color, root_mat_pct, sio2_al2o3_clay, sio2_al2o3_naoh, trb_cmol, trb_clay_cmol, p_total_pct, rock_fragment_max_cm, silting_rate_cm_yr, silting_kind, freeze_thaw_days_pct; the hue moist with the dry as a flagged fallback (Q21); 'the whole B' every layer of the B (Q23) (Hugo, 2026-11-04)."
  - topic: "Defaults of the characteristics"
    page: "pp. 50, 56, 62-64"
    reading: "Vertic evidence is [(1) or (2)] and (3) and (4) of its own list (default 19); redoxic item 3 reads chroma 1 or less between dark layers and item 4 a reduced matrix over 0 and under 30 % (default 15); the alic evidence keeps the printed pH(KCl) 4.0 (default 16); the andic 60 % pyroclastic preamble is the concept, not a test (D16); the alluvial character is decided by stratification and carbon, recorded floods confirm it and floods not recorded leave it provisional (default 20); the lithologic characters are read within 125 cm and the calcaric property within 50 cm (default 12) (Hugo, 2026-11-04)."
  # soilKey's readings of this part, decided by Hugo on the review
  - topic: "Organic soil materials and the tiers"
    page: "pp. 43-46"
    reading: "A layer is organic soil material with the carbon of the organic epipedon: litter 200 g/kg or more; peat and mud 120 + 0.1 x clay g/kg (180 at 600 clay) when saturated a month or more (the layer's water_saturation_days, else the most of the upper 50 cm; artificially drained counts as saturated), undecided when the saturation is unknown. Mattic materials are the layers of the mattic epipedon (or its evidence) with 10 % woven roots, without a carbon test. Kind: folic (litter 75 %) before mattic before the fibre classes; the von Post index stands in for the rubbed fibre (H1-H4 fibric, H5-H6 hemic, H7-H10 sapric), flagged; a sapric layer with a light pyrophosphate colour is flagged possibly limnic. The control section is 160 cm when every layer of 0-60 cm has 75 % moss fibres or a bulk density under 0.1, else 130 cm; the surface tier is 0-60 cm only when every layer of 0-60 cm is fibric with 75 % moss fibres or has a bulk density under 0.1 (p. 46), otherwise 0-30 cm (a hemic layer gives the 30 cm tier); undecided between them unless a contact or permafrost ends it first; water layers are not read; the dominant kind of a tier is the thickest, undecided while a layer of it has no kind (Hugo, 2026-11-06)."
  - topic: "Lithologic characters: alluvial, sandy, loess"
    page: "pp. 46-47"
    reading: "Alluvial: stratification is stratification_pattern recorded (other than none) or a numeral prefix of a discontinuity in a layer within 50 cm (flagged); with neither recorded the WRB fluvic material stands in, flagged; the carbon 'decreasing irregularly' is any increase with depth between 25 and 125 cm (or the contact); occasional floods leave it undecided, none or rare fail it. Sandy: every layer of 0-100 cm (or to the contact) sand or loamy sand, single grain or very friable blocky, unstratified, and the thickness-weighted organic carbon of that window 1.5 g/kg or less; a structure not recorded leaves it undecided (every description records one). Loess: the hue moist (Q21), the value and chroma dry as printed; 'silt and fine sand predominate' is more than half of the fine earth (silt alone when fine sand is not recorded, flagged); homogeneous is a neighbouring texture class between loess layers (Hugo, 2026-11-06)."
  - topic: "Lithologic characters: purplish, red beds, carbonate rocks, coral sands"
    page: "pp. 47-48"
    reading: "Rock (R) layers carry no soil colour and never make the loess, purplish or red-bed colours undecided. Purplish: 2.5RP-10RP, and rock_fragment_max_cm under 4 in every purplish layer within 125 cm; no coarse fragments recorded (0 %) reads as met, flagged; not recorded undecided. Red beds: the colours of (a) on the moist value and chroma (the dry ones flagged); the northern red earths are a parent material recorded as red earth or red clay with (b): calcareous (10 g/kg CaCO3 or effervescence), carbonate nodules or concretions, base saturation 100 %, or salic evidence, in a layer within 125 cm, with no hue limit; without that parent material record, no northern red earths. Carbonate rocks: the rock is recognised by the rock nouns of parent_material (limestone, dolomite, marl, chalk, travertine, tufa, carbonate rock), never by a calcareous sediment or karst; with no parent material recorded, a contact or rock fragments within 125 cm leave it undecided and nothing rock-like is absent; (b) is any coarse fragments with such a parent material; (c) every layer above the contact within 125 cm. Coral sands: coral or shell in the parent material or a shelly layer, with 50 % USDA sand (0.05-2 mm) and 500 g/kg CaCO3 (Hugo, 2026-11-06)."
  - topic: "Contacts and anthro-silting materials"
    page: "pp. 48-49"
    reading: "The lithic contact is a layer designated R and the paralithic one a Cr read as a contact (Q2 of 2026-11-05); an upper boundary at the depth asked counts; with no designation recorded and a description ending above the depth asked the contact is undecided, otherwise absent. Anthro-silting materials: (1) the silting rate, and (2) stratification or (3) the sieve test (silting_sieve_test, or layered_sorting in thin section), read as alternatives since (3) tests the layers whose stratification tillage erased; a rate of 0.5-10 cm a year without the kind is undecided; the WRB irragric horizon stands in for the rate, flagged (Hugo, 2026-11-06)."
  - topic: "Vertic features"
    page: "pp. 49-50"
    reading: "Item 1 fails with a lithic or paralithic contact within 50 cm (the evidence covers such soils); cracks are a field observation, absent when not recorded, but undecided on a ploughed or irrigated soil (the book's exception); the share of surface cracks 1 cm wide is not read (no attribute records it); intersecting slickensides are common or more, the evidence's slickensides few or more; the evidence clay totals 30 cm within 100 cm (or to the contact); LE sums thickness x COLE to 100 cm or the contact; self-swallowing is humic_infillings in a layer below the surface layer within 100 cm. The anthroturbic layer is a layer with 3 % fragments of former horizons reaching into 25-100 cm; the levelling or terracing is not tested (Hugo, 2026-11-06)."
  - topic: "Gleyic hue bands and redoxic features"
    page: "pp. 55-56"
    reading: "Gleyic colours: the 5Y rule (value 4, chroma 4) covers the hues over 2.5Y up to 7.5Y, the 2.5Y rule (chroma 3) those over 10YR up to 2.5Y; value and chroma moist only (no dry fallback); N passes. Gleyic features by colour alone (Q11, provisional) are not read in an E or albic layer unless redox features or a saturation regime are recorded. Redoxic: a rust mottle is a mottle colour of chroma 3 or more (or a mottle not read as a colour), or redox concentrations recorded; nodules from ferric, manganiferous or Fe-Mn nodules or an iron pan; item 3 (a low chroma without mottles, 1 or less where the layers above and below are dark at chroma 2, as the book states it) counts under a saturation regime (aquic, stagnic, anthrostagnic, peraquic), not with a recorded drainage class well drained or better, and is undecided otherwise; no carbon exclusion (Hugo, 2026-11-06)."
  - topic: "Permafrost, frost-thawic features, n value"
    page: "pp. 57-58"
    reading: "A permafrost layer is a layer at or below 0 C (permafrost_temp_C) or with a frozen designation (also after a discontinuity numeral: 2Cf); frozen ground is a field observation, so a description reaching the depth asked with no frozen layer has none, and one stopping above it is undecided unless a frost regime without permafrost or a temperature regime frigid or warmer rules permafrost out (cryic does not); the USDA permafrost_within_usda() stands in, flagged. Frost-thawic: cryoturbation also from patterned_ground; the scaly structure is structure_type lenticular (or scaly) in an A or B (not an E; undecided in a layer without designation); diurnal freeze-thaw on 70 % of the days cannot happen under a mesic or warmer regime, so item 4 is then false; otherwise not recorded, undecided. n value: the field fluidity class stands in as ranges (non-fluid under 0.7, slightly fluid 0.7-1.0, moderately or very fluid 1 or more), flagged (Hugo, 2026-11-06)."
  - topic: "Isohumic and humic properties"
    page: "pp. 58-60"
    reading: "Isohumic item 2, 'organic evidence' 5-20 cm thick, is the histic epipedon at least at its evidence grade (default 16); with a lithic or paralithic contact at 50-100 cm the depths are scaled to the contact depth (the total thickness of the horizons), the solum serving the humic storage only; no organic matter in the window is not isohumic; the ratio range takes the low storage of 0-20 cm against the high storage below and the reverse. Humic: the humus 'high in the A and gradually decreasing' is read as the first mineral layer holding the most organic carbon of the mineral layers within 100 cm; humus coatings few or more, or humic infillings, or dark coatings (coatings_value_moist 3 or less, flagged) in a layer of the B; the B is the layers designated B or BC within 125 cm, or with no designation the argic, LAC-ferric, cambic or ferralic horizon and the layers below it, flagged (Hugo, 2026-11-06)."
  - topic: "Andic, ferric, allitic and alic properties"
    page: "pp. 60-63"
    reading: "Andic: the bulk density at 33 kPa is bulk_density_g_cm3; the shaded area of Fig. 3.2 is above the straight line from 30 % glass at 0.40 % Alo + 1/2 Feo to 5 % at 2.0 %; the USDA andic soil properties stand in, flagged. Ferric: every layer of the B meets it (Q23); a layer that may be of the B counts only when it meets the test; a profile without a B has none. Allitic item 1: the clay ratio (alkali fusion) or the fine-earth ratio (acid digestion), the Ki of the sulfuric attack read as the latter, flagged. Allitic and alic: the exclusions of the Ferralosols and Ferrosols are the key's, not read here. Alic item 2: the TRB path only when both TRB are recorded, otherwise the silt/clay ratio decides (Q20); the Al saturation is al_sat_pct, else KCl-Al over the ECEC of the bases and Al; the evidence counts the met items among pH(KCl), Al saturation, KCl-Al per kg clay and its share of the CEC, undecided while the undecided ones could make two (Hugo, 2026-11-06)."
  - topic: "Phosphic, sodic, calcaric properties, base saturation"
    page: "pp. 63-64"
    reading: "Phosphic item 2 is read over the layers from the first to the last with total P: P higher and CaCO3 lower at the top than at the base, with no reversal of over 10 % between layers; the 130 g/kg is what P may reach, not a limit; the WRB ornithogenic material does not stand in (Mehlich-3 P, another measure). Sodic: sodium or magnesium not measured leaves the property undecided (the argic horizon's alkaline-pH rule of 2026-11-06 is not carried over); the evidence is ESP 5 to under 30. Calcaric: the layers whose top lies within 50 cm; measured CaCO3 decides, without it effervescence (flagged), and without either a pH(H2O) under 6.5 is non-calcaric; the 20 g/kg increment over a neighbour (a rock layer excluded) is read on measured CaCO3 only. Base saturation: the key gives the window and whether every layer or some layer; rock layers are not read (Hugo, 2026-11-06)."
  - topic: "Sulfidic materials and the sulfuric horizon"
    page: "pp. 43, 64"
    reading: "The book gives sulfidic materials no number: a layer with 0.01 % sulfidic S (the WRB 2022 number) or an incubation pH under 4 is read as sulfidic, always with a lower grade, and the WRB hypersulfidic and hyposulfidic materials stand in where neither is recorded, flagged. The sulfuric horizon (0.9.371) now reads this characteristic in the layer under its base, with a lower grade only where that layer rests on the WRB stand-ins (Hugo, 2026-11-06)."
  - topic: "The characteristics in the panel"
    page: "pp. 43-64"
    reading: "The horizon panel lists, per layer, the layer characteristics it holds (organic soil materials with their kind, anthroturbic layer, gleyic and redoxic features, permafrost layer, n value 0.7 or more, andic, allitic, alic, phosphic and sodic properties, sulfidic materials) and their evidences (gleyic, alic, phosphic, sodic evidence); undecided characteristics are not listed; provisional gleyic features are marked '(provisional)'; their stand-in functions go to a column of their own, so the lower grade of the horizons is unchanged. The profile characteristics (lithologic characters, contacts, anthro-silting materials, vertic and frost-thawic features, isohumic, humic, ferric and calcaric properties, base saturation, the regimes) are read by the key (Hugo, 2026-11-06)."
