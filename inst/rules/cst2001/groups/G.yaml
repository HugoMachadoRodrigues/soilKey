# The keys to groups of the Aridosols (order G) of the Chinese Soil Taxonomy
# (Cooperative Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil
# Taxonomy. Science Press, Beijing and New York, 2001; the English edition,
# system id cst2001), key 5.2, pp. 100-108, keyed by suborder, in the book's
# order. Each group after the first is "other ... that", so a gate tests only
# its own criteria. Names as printed (the canonical spelling of Q2, the other
# printed forms as aliases); name_pt is soilKey's Portuguese gloss; soilKey's
# additions in brackets. The criteria are paraphrased in the notes; the
# predicates are those of R/diagnostics-cst-*.R, R/cst-regimes.R, R/key-cst.R
# and R/key-cst-groups.R. Readings: readings.yaml.

groups:

  "G1":
    - code: "G1.1"
      name: "Calci-Cryic Aridosols"
      name_pt: "Aridossolos críicos cálcicos"
      page: 101
      tests:
        all_of:
          - calcic_horizon_cst: {top_max: 100, datum: surface}
      notes: "A calcic horizon with its upper boundary within 100 cm of the soil surface."
    - code: "G1.2"
      name: "Gypsi-Cryic Aridosols"
      name_pt: "Aridossolos críicos gípsicos"
      page: 101
      tests:
        any_of:
          - gypsic_horizon_cst: {top_max: 100, datum: surface}
          - hypergypsic_horizon_cst: {top_max: 100, datum: surface}
      notes: "A gypsic or hypergypsic horizon with its upper boundary within 100 cm of the soil surface."
    - code: "G1.3"
      name: "Argi-Cryic Aridosols"
      name_pt: "Aridossolos críicos argílicos"
      page: 101
      tests:
        all_of:
          - argic_horizon_cst: {top_max: 100, datum: surface, natro: true}
      notes: "An argic horizon (the natro-argic horizon included, p. 37) within 100 cm of the soil surface."
    - code: "G1.4"
      name: "Hapli-Cryic Aridosols"
      name_pt: "Aridossolos críicos háplicos"
      page: 101
      tests:
        default: true
      notes: "Other Cryic Aridosols."

  "G2":
    - code: "G2.1"
      name: "Calci-Orthic Aridosols"
      name_pt: "Aridossolos órticos cálcicos"
      page: 103
      tests:
        any_of:
          - calcic_horizon_cst: {top_max: 100, datum: surface}
          - hypercalcic_horizon_cst: {top_max: 100, datum: surface}
          - calcipan_cst: {top_max: 100, datum: surface}
      notes: "A calcic or hypercalcic horizon or a calcipan with its upper boundary within 100 cm of the soil surface."
    - code: "G2.2"
      name: "Sali-Orthic Aridosols"
      name_pt: "Aridossolos órticos sálicos"
      page: 103
      tests:
        any_of:
          - salic_horizon_cst: {top_max: 100, datum: surface}
          - hypersalic_horizon_cst: {top_max: 100, datum: surface}
          - salipan_cst: {top_max: 100, datum: surface}
      notes: "A salic or hypersalic horizon or a salipan with its upper boundary within 100 cm of the soil surface."
    - code: "G2.3"
      name: "Gypsi-Orthic Aridosols"
      name_pt: "Aridossolos órticos gípsicos"
      page: 103
      tests:
        any_of:
          - gypsic_horizon_cst: {top_max: 100, datum: surface}
          - hypergypsic_horizon_cst: {top_max: 100, datum: surface}
      notes: "A gypsic or hypergypsic horizon with its upper boundary within 100 cm of the soil surface."
    - code: "G2.4"
      name: "Argi-Orthic Aridosols"
      name_pt: "Aridossolos órticos argílicos"
      page: "103-104"
      tests:
        all_of:
          - argic_horizon_cst: {top_max: 100, datum: surface, natro: true}
      notes: "An argic horizon (the natro-argic horizon included, p. 37) within 100 cm of the soil surface."
    - code: "G2.5"
      name: "Hapli-Orthic Aridosols"
      name_pt: "Aridossolos órticos háplicos"
      page: 104
      tests:
        default: true
      notes: "Other Orthic Aridosols."
