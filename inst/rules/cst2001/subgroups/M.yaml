# The keys to subgroups of the Cambosols (order M) of the Chinese Soil Taxonomy
# (Cooperative Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil
# Taxonomy. Science Press, Beijing and New York, 2001; the English edition,
# system id cst2001), key 5.2, pp. 146-167, keyed by group, in the book's order.
# Each subgroup after the first is "other ... that", so a row tests only its
# own criteria; Typic, the residual, passes by default. A complex subgroup is
# keyed before its simple parts, as printed. Names as printed (the canonical
# spelling of Q2; the other printed forms and the singular as aliases);
# name_pt is soilKey's Portuguese gloss; soilKey's additions in brackets. The
# criteria are paraphrased in the notes; the tests call the presets of
# presets.yaml (expanded at load time) or the predicates of R/key-cst*.R and
# R/diagnostics-cst-*.R directly (v0.9.376). Readings: readings.yaml.

subgroups:

  "M1.1":
    - code: "M1.1.1"
      name: "Histic Permi-Gelic Cambosols"
      aliases: ["Histic Permi-Gelic Cambosol"]
      name_pt: "Cambissolos gélicos permagélicos hísticos"
      adjective: "Histic"
      page: 147
      tests:
        all_of:
          - histic_epipedon_cst: {grade: at_least_evidence}
      notes: "Histic evidence (the histic epipedon passes too, Q19)."
    - code: "M1.1.2"
      name: "Typic Permi-Gelic Cambosols"
      aliases: ["Typic Permi-Gelic Cambosol"]
      name_pt: "Cambissolos gélicos permagélicos típicos"
      adjective: "Typic"
      page: 147
      tests:
        default: true
      notes: "Other Permi-Gelic Cambosols."

  "M1.2":
    - code: "M1.2.1"
      name: "Histic Aqui-Gelic Cambosols"
      aliases: ["Histic Aqui-Gelic Cambosol"]
      name_pt: "Cambissolos gélicos áquicos hísticos"
      adjective: "Histic"
      page: 148
      tests:
        all_of:
          - histic_epipedon_cst: {grade: at_least_evidence}
      notes: "A histic epipedon or histic evidence."
    - code: "M1.2.2"
      name: "Dark Aqui-Gelic Cambosols"
      aliases: ["Dark Aqui-Gelic Cambosol"]
      name_pt: "Cambissolos gélicos áquicos escuros"
      adjective: "Dark"
      page: 148
      tests:
        all_of:
          - any_of:
              - mollic_epipedon_cst: {}
              - umbric_epipedon_cst: {}
      notes: "A mollic or umbric epipedon."
    - code: "M1.2.3"
      name: "Gleyic Aqui-Gelic Cambosols"
      aliases: ["Gleyic Aqui-Gelic Cambosol"]
      name_pt: "Cambissolos gélicos áquicos gleicos"
      adjective: "Gleyic"
      page: 148
      tests:
        all_of:
          - gleyic: {to: 100, from: 50}
      notes: "Gleyic features in some horizon 10 cm or more thick between 50 and 100 cm of the mineral soil surface."
    - code: "M1.2.4"
      name: "Typic Aqui-Gelic Cambosols"
      aliases: ["Typic Aqui-Gelic Cambosol"]
      name_pt: "Cambissolos gélicos áquicos típicos"
      adjective: "Typic"
      page: 148
      tests:
        default: true
      notes: "Other Aqui-Gelic Cambosols."

  "M1.3":
