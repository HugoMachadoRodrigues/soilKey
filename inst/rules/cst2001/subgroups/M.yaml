          - dystric: {to: 50, from: 20}
      notes: "Base saturation (NH4OAc) under 50 % or pH (water) under 5.5 in every horizon at least between 20 and 50 cm of the mineral soil surface (Q23)."
    - code: "M1.3.4"
      name: "Typic Matti-Gelic Cambosols"
