  "B2.1":
    - code: "B2.1.1"
      name: "Siltigic Fimi-Orthic Anthrosols"
      aliases: ["Siltigic Fimi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos fímicos siltígicos"
      adjective: "Siltigic"
      page: 85
      tests:
        all_of:
          - siltigic_epipedon_cst: {grade: at_least_evidence}
      notes: "Siltigic evidence (the siltigic epipedon passes too, Q19)."
    - code: "B2.1.2"
      name: "Calcari-mottlic Fimi-Orthic Anthrosols"
      aliases: ["Calcari-mottlic Fimi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos fímicos calcáricos mosqueados"
      adjective: "Calcari-mottlic"
      page: 86
      tests:
        all_of:
          - calcaric_property_cst: {}
          - mottlic: {from: 50, to: 100}
      notes: "The calcaric property and redoxic features in some layer 10 cm or more thick between 50 and 100 cm of the mineral soil surface (keyed before its parts)."
    - code: "B2.1.3"
      name: "Mottlic Fimi-Orthic Anthrosols"
      aliases: ["Mottlic Fimi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos fímicos mosqueados"
      adjective: "Mottlic"
      page: 86
      tests:
        all_of:
          - mottlic: {from: 50, to: 100}
      notes: "Redoxic features in some layer 10 cm or more thick between 50 and 100 cm of the mineral soil surface."
    - code: "B2.1.4"
      name: "Calcaric Fimi-Orthic Anthrosols"
      aliases: ["Calcaric Fimi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos fímicos calcáricos"
      adjective: "Calcaric"
      page: 86
      tests:
        all_of:
          - calcaric_property_cst: {}
      notes: "The calcaric property (its own depth, p. 63)."
    - code: "B2.1.5"
      name: "Dystric Fimi-Orthic Anthrosols"
      aliases: ["Dystric Fimi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos fímicos distróficos"
      adjective: "Dystric"
      page: 86
      tests:
        all_of:
          - dystric: {from: 25, to: 50}
      notes: "Base saturation under 50 % or pH under 5.5 between 25 and 50 cm of the mineral soil surface, in every horizon there (Q23)."
    - code: "B2.1.6"
      name: "Typic Fimi-Orthic Anthrosols"
      aliases: ["Typic Fimi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos fímicos típicos"
      adjective: "Typic"
      page: 86
      tests:
        default: true
      notes: "Other Fimi-Orthic Anthrosols."

  "B2.2":
    - code: "B2.2.1"
      name: "Cryic Siltigi-Orthic Anthrosols"
      aliases: ["Cryic Siltigi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos siltígicos críicos"
      adjective: "Cryic"
      page: 86
      tests:
        all_of:
          - temperature_regime_cst: {regimes: [cryic]}
      notes: "A cryic soil temperature regime (the colder ones do not count, Q7)."
    - code: "B2.2.2"
      name: "Parasalic Siltigi-Orthic Anthrosols"
      aliases: ["Parasalic Siltigi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos siltígicos parassálicos"
      adjective: "Parasalic"
      page: 86
      tests:
        all_of:
          - soluble_salt_band_cst: {}
      notes: "Soluble salts of 5-20 g/kg in arid regions, 1.5-10 g/kg elsewhere, in the cultivated horizon or the upper part of the pedon."
    - code: "B2.2.3"
      name: "Fimic Siltigi-Orthic Anthrosols"
      aliases: ["Fimic Siltigi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos siltígicos fímicos"
      adjective: "Fimic"
      page: 86
      tests:
        all_of:
          - fimic_epipedon_cst: {grade: at_least_evidence}
      notes: "A fimic epipedon or fimic evidence."
    - code: "B2.2.4"
      name: "Anthrostagnic Siltigi-Orthic Anthrosols"
      aliases: ["Anthrostagnic Siltigi-Orthic Anthrosol", "Anthrostagnic-Siltigi-Orthic Anthrosols"]
      name_pt: "Antrossolos órticos siltígicos antroestágnicos"
      adjective: "Anthrostagnic"
      page: 87
      tests:
        all_of:
          - anthrostagnic: {}
      notes: "Anthrostagnic evidence (the epipedon passes too, Q19; the name printed with a hyphen, an alias)."
    - code: "B2.2.5"
      name: "Mottlic Siltigi-Orthic Anthrosols"
      aliases: ["Mottlic Siltigi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos siltígicos mosqueados"
      adjective: "Mottlic"
      page: 87
      tests:
        all_of:
          - mottlic: {from: 50, to: 100}
      notes: "Redoxic features in some layer 10 cm or more thick between 50 and 100 cm of the mineral soil surface."
    - code: "B2.2.6"
      name: "Typic Siltigi-Orthic Anthrosols"
      aliases: ["Typic Siltigi-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos siltígicos típicos"
      adjective: "Typic"
      page: 87
      tests:
        default: true
      notes: "Other Siltigi-Orthic Anthrosols."

  "B2.3":
    - code: "B2.3.1"
      name: "Dystric Mud-cumuli-Orthic Anthrosols"
      aliases: ["Dystric Mud-cumuli-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos cumúlicos lamacentos distróficos"
      adjective: "Dystric"
      page: 87
      tests:
        all_of:
          - dystric: {from: 25, to: 50}
      notes: "Base saturation under 50 % or pH under 5.5 at least between 25 and 50 cm of the mineral soil surface, in every horizon there (Q23)."
    - code: "B2.3.2"
      name: "Typic Mud-cumuli-Orthic Anthrosols"
      aliases: ["Typic Mud-cumuli-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos cumúlicos lamacentos típicos"
      adjective: "Typic"
      page: 87
      tests:
        default: true
      notes: "Other Mud-cumuli-Orthic Anthrosols."

  "B2.4":
    - code: "B2.4.1"
      name: "Parasalic Earth-cumuli-Orthic Anthrosols"
      aliases: ["Parasalic Earth-cumuli-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos cumúlicos terrosos parassálicos"
