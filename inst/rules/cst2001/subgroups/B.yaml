      page: 87
      tests:
        all_of:
          - fimic_epipedon_cst: {grade: at_least_evidence}
      notes: "Fimic evidence (the fimic epipedon passes too, Q19)."
    - code: "B2.4.3"
      name: "Mottlic Earth-cumuli-Orthic Anthrosols"
      aliases: ["Mottlic Earth-cumuli-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos cumúlicos terrosos mosqueados"
      adjective: "Mottlic"
      page: 88
      tests:
        all_of:
          - mottlic: {from: 50, to: 100}
      notes: "Redoxic features in some layer 10 cm or more thick between 50 and 100 cm of the mineral soil surface."
    - code: "B2.4.4"
      name: "Calcic Earth-cumuli-Orthic Anthrosols"
      aliases: ["Calcic Earth-cumuli-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos cumúlicos terrosos cálcicos"
      adjective: "Calcic"
      page: 88
      tests:
        all_of:
          - calcic_or_evidence: {to: ~}
      notes: "A calcic horizon or calcic evidence (no depth printed; the calcic horizon named alone, a hypercalcic one is not a calcic horizon here)."
    - code: "B2.4.5"
      name: "Typic Earth-cumuli-Orthic Anthrosols"
      aliases: ["Typic Earth-cumuli-Orthic Anthrosol"]
      name_pt: "Antrossolos órticos cumúlicos terrosos típicos"
      adjective: "Typic"
      page: 88
      tests:
        default: true
      notes: "Other Earth-cumuli-Orthic Anthrosols."
