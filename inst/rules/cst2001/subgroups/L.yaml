      aliases: ["Lithic Hapli-Ustic Argosol"]
      name_pt: "Argissolos ústicos háplicos líticos"
      adjective: "Lithic"
      page: 138
      tests:
        all_of:
          - lithic: {depth: 50, contact: lithic, fragments: more_than_half}
      notes: "A lithic contact within 50 cm of the mineral soil surface, or, with none, 70 % or more by volume of gravels or rock fragments over 2 mm in more than half of the horizons within that depth (by thickness, Q22)."
    - code: "L2.4.2"
      name: "Cumulic Hapli-Ustic Argosols"
      aliases: ["Cumulic Hapli-Ustic Argosol"]
      name_pt: "Argissolos ústicos háplicos cumúlicos"
      adjective: "Cumulic"
      page: 139
      tests:
        all_of:
          - cumulic_epipedon_cst: {grade: at_least_evidence}
      notes: "Cumulic evidence (the cumulic epipedon passes too, Q19; no depth printed)."
    - code: "L2.4.3"
      name: "Recalcaric Hapli-Ustic Argosols"
      aliases: ["Recalcaric Hapli-Ustic Argosol"]
      name_pt: "Argissolos ústicos háplicos recalcáricos"
      adjective: "Recalcaric"
      page: 139
      tests:
        all_of:
          - recalcaric_cst: {within: 100, datum: mineral}
      notes: "Free calcium carbonate in the fine earth decreasing with depth within 100 cm of the mineral soil surface: the CaCO3 pattern of the Recalcaric Anthrosols (over 45 g/kg at the surface, never rising downwards), read to 100 cm (default 23), undecided when the description ends above 100 cm, not on rock or a contact."
    - code: "L2.4.4"
      name: "Mottlic Hapli-Ustic Argosols"
      aliases: ["Mottlic Hapli-Ustic Argosol"]
      name_pt: "Argissolos ústicos háplicos mosqueados"
      adjective: "Mottlic"
      page: 139
      tests:
        all_of:
          - mottlic: {to: 100}
      notes: "Redoxic features in some horizon 10 cm or more thick within 100 cm of the mineral soil surface."
    - code: "L2.4.5"
      name: "Typic Hapli-Ustic Argosols"
      aliases: ["Typic Hapli-Ustic Argosol"]
      name_pt: "Argissolos ústicos háplicos típicos"
      adjective: "Typic"
      page: 139
      tests:
        default: true
      notes: "Other Hapli-Ustic Argosols."

  "L3.1":
    - code: "L3.1.1"
      name: "Humic Carbonati-Perudic Argosols"
      aliases: ["Humic Carbonati-Perudic Argosol"]
      name_pt: "Argissolos perúdicos carbonáticos húmicos"
      adjective: "Humic"
      page: 140
      tests:
        all_of:
          - humic_property_cst: {}
      notes: "The humic property (p. 59)."
    - code: "L3.1.2"
      name: "Typic Carbonati-Perudic Argosols"
      aliases: ["Typic Carbonati-Perudic Argosol"]
      name_pt: "Argissolos perúdicos carbonáticos típicos"
      adjective: "Typic"
      page: 140
      tests:
        default: true
      notes: "Other Carbonati-Perudic Argosols."

  "L3.2":
