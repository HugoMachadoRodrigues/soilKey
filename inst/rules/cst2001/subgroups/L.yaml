      adjective: "Shajiang"
      page: 143
      tests:
        all_of:
          - shajiang_cst: {min_pct: 10, min_cm: 10, from_cm: 50, within: 100}
      notes: "10 % or more by volume of irregular calcareous nodules or concretions (shajiang) in some horizon 10 cm or more thick between 50 and 100 cm of the mineral soil surface (hard carbonate concretions stand in, flagged)."
    - code: "L4.3.3"
      name: "Eutric Claypani-Udic Argosols"
      aliases: ["Eutric Calypani-Udic Argosols", "Eutric Claypani-Udic Argosol"]
