      notes: "An indurated subhorizon (cementation indurated or rupture resistance extremely hard) 5 cm or more thick below the base of the albic horizon with 30 % or more by volume of Fe-Mn nodules and concretions."
    - code: "L4.1.2"
      name: "Ferric Albi-Udic Argosols"
      aliases: ["Ferric Albi-Udic Argosol"]
      name_pt: "Argissolos údicos álbicos férricos"
