      name_pt: "Argissolos ústicos carbonáticos mólicos"
      adjective: "Mollic"
      page: 137
      tests:
        all_of:
          - mollic_epipedon_cst: {}
      notes: "A mollic epipedon."
    - code: "L2.1.2"
      name: "Rhodic Carbonati-Ustic Argosols"
      aliases: ["Rhodic Carbonati-Ustic Argosol"]
      name_pt: "Argissolos ústicos carbonáticos ródicos"
      adjective: "Rhodic"
      page: 137
      tests:
        all_of:
          - hue_share: {hue: "5YR", rule: redder_than}
      notes: "A hue redder than 5YR (moist, Q21) in more than half of the thickness of the horizons within 125 cm of the mineral soil surface or above a shallower contact (Q22)."
    - code: "L2.1.3"
      name: "Typic Carbonati-Ustic Argosols"
      aliases: ["Typic Carbonati-Ustic Argosol"]
      name_pt: "Argissolos ústicos carbonáticos típicos"
      adjective: "Typic"
      page: 137
      tests:
        default: true
      notes: "Other Carbonati-Ustic Argosols."

  "L2.2":
    - code: "L2.2.1"
      name: "Mottlic Calci-Ustic Argosols"
      aliases: ["Mottlic Calci-Ustic Argosol"]
      name_pt: "Argissolos ústicos cálcicos mosqueados"
      adjective: "Mottlic"
      page: 138
      tests:
        all_of:
          - mottlic: {to: 100}
      notes: "Redoxic features in some horizon 10 cm or more thick within 100 cm of the mineral soil surface."
    - code: "L2.2.2"
      name: "Typic Calci-Ustic Argosols"
      aliases: ["Typic Calci-Ustic Argosol"]
      name_pt: "Argissolos ústicos cálcicos típicos"
