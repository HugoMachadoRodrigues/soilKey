      name: "Intensic Ali-Perudic Argosols"
      aliases: ["Intensic Ai-Perudic Argosols", "Intensic Ali-Perudic Argosol"]
      name_pt: "Argissolos perúdicos álicos intensamente intemperizados"
      adjective: "Intensic"
      page: 140
      tests:
        all_of:
          - b_subhorizon: {test: allitic}
      notes: "The allitic property in some subhorizon(s) of the B, 10 cm or more thick, within 125 cm of the mineral soil surface."
    - code: "L3.2.2"
      name: "Humic Ali-Perudic Argosols"
      aliases: ["Humic Ai-Perudic Argosols", "Humic Ali-Perudic Argosol"]
      name_pt: "Argissolos perúdicos álicos húmicos"
      adjective: "Humic"
      page: 140
      tests:
        all_of:
          - humic_property_cst: {}
      notes: "The humic property (p. 59)."
    - code: "L3.2.3"
      name: "Typic Ali-Perudic Argosols"
      aliases: ["Typic Ai-Perudic Argosols", "Typic Ali-Perudic Argosol"]
      name_pt: "Argissolos perúdicos álicos típicos"
      adjective: "Typic"
