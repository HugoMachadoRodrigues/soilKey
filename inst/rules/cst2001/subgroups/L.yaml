      page: 142
      tests:
        all_of:
          - ferric: {scope: argic_or_claypan}
      notes: "The ferric property (its layer test, p. 61) throughout the argic horizon or the claypan (Q23)."
    - code: "L4.1.3"
      name: "Typic Albi-Udic Argosols"
      aliases: ["Typic Albi-Udic Argosol"]
      name_pt: "Argissolos údicos álbicos típicos"
      adjective: "Typic"
      page: 142
      tests:
        default: true
      notes: "Other Albi-Udic Argosols."

  "L4.2":
    - code: "L4.2.1"
      name: "Humi-brown Carbonati-Udic Argosols"
      aliases: ["Humi-brown Carbonati-Udic Argosol", "Humi-brown Carbonsti-Udic Argosols"]
      name_pt: "Argissolos údicos carbonáticos húmicos brunos"
      adjective: "Humi-brown"
      page: 142
      tests:
        all_of:
          - humic_property_cst: {}
          - hue_share: {hue: "5YR", rule: yellower}
      notes: "The humic property (p. 59); and a hue of 5YR or yellower (moist, Q21) in more than half of the thickness of the horizons within 125 cm of the mineral soil surface or above a shallower lithic or paralithic contact (Q22) (keyed before its parts)."
    - code: "L4.2.2"
      name: "Humic Carbonati-Udic Argosols"
      aliases: ["Humic Carbonati-Udic Argosol", "Humic Carbonsti-Udic Argosols"]
      name_pt: "Argissolos údicos carbonáticos húmicos"
      adjective: "Humic"
      page: 142
      tests:
