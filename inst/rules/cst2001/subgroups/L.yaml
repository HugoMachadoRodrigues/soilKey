# The keys to subgroups of the Argosols (order L) of the Chinese Soil Taxonomy
# (Cooperative Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil
# Taxonomy. Science Press, Beijing and New York, 2001; the English edition,
# system id cst2001), key 5.2, pp. 133-146, keyed by group, in the book's order.
# Each subgroup after the first is "other ... that", so a row tests only its
# own criteria; Typic, the residual, passes by default. A complex subgroup is
# keyed before its simple parts, as printed. Names as printed (the canonical
# spelling of Q2; the other printed forms and the singular as aliases);
# name_pt is soilKey's Portuguese gloss; soilKey's additions in brackets. The
# criteria are paraphrased in the notes; the tests call the presets of
# presets.yaml (expanded at load time) or the predicates of R/key-cst*.R and
# R/diagnostics-cst-*.R directly (v0.9.376). Readings: readings.yaml.

subgroups:

  "L1.1":
    - code: "L1.1.1"
      name: "Histic Albi-Boric Argosols"
      aliases: ["Histic Albi-Boric Argosol"]
      name_pt: "Argissolos bóricos álbicos hísticos"
      adjective: "Histic"
      page: 134
      tests:
        all_of:
          - histic_epipedon_cst: {grade: at_least_evidence, top_max: 0}
      notes: "Histic evidence (the histic epipedon passes too, Q19) in the surface horizon."
    - code: "L1.1.2"
      name: "Gleyic Albi-Boric Argosols"
      aliases: ["Gleyic Albi-Boric Argosol"]
      name_pt: "Argissolos bóricos álbicos gleicos"
      adjective: "Gleyic"
      page: 134
      tests:
        all_of:
          - feature_below_cst: {features: [gleyic_features], horizon: claypan, to_cm: 100, min_cm: 10}
      notes: "Gleyic evidence (gleyic features pass too) in some subhorizon 10 cm or more thick within 100 cm below the upper boundary of the claypan."
    - code: "L1.1.3"
      name: "Mollic Albi-Boric Argosols"
      aliases: ["Mollic Albi-Boric Argosol"]
      name_pt: "Argissolos bóricos álbicos mólicos"
      adjective: "Mollic"
      page: 135
      tests:
        all_of:
          - mollic_epipedon_cst: {}
      notes: "A mollic epipedon."
    - code: "L1.1.4"
      name: "Dystric Albi-Boric Argosols"
      aliases: ["Dystric Albi-Boric Argosol"]
      name_pt: "Argissolos bóricos álbicos distróficos"
      adjective: "Dystric"
      page: 135
      tests:
        all_of:
          - dystric: {scope: claypan}
      notes: "Base saturation under 50 % or pH (water) under 5.5 throughout the claypan."
    - code: "L1.1.5"
      name: "Typic Albi-Boric Argosols"
      aliases: ["Typic Albi-Boric Argosol"]
      name_pt: "Argissolos bóricos álbicos típicos"
      adjective: "Typic"
      page: 135
      tests:
        default: true
      notes: "Other Albi-Boric Argosols."

  "L1.2":
    - code: "L1.2.1"
      name: "Lithic Molli-Boric Argosols"
      aliases: ["Lithic Molli-Boric Argosol"]
      name_pt: "Argissolos bóricos mólicos líticos"
      adjective: "Lithic"
      page: 135
      tests:
        all_of:
          - lithic: {depth: 50, contact: lithic, fragments: more_than_half}
      notes: "A lithic contact within 50 cm of the mineral soil surface, or, with none, 70 % or more by volume of gravels or rock fragments over 2 mm in more than half of the horizons within that depth (by thickness, Q22)."
    - code: "L1.2.2"
      name: "Calcic Molli-Boric Argosols"
      aliases: ["Calcic Molli-Boric Argosol"]
      name_pt: "Argissolos bóricos mólicos cálcicos"
      adjective: "Calcic"
      page: 135
      tests:
        all_of:
          - calcic: {to: 125, from: 50}
      notes: "A calcic horizon (named alone: a hypercalcic horizon does not count), with its upper boundary between 50 and 125 cm of the mineral soil surface."
    - code: "L1.2.3"
      name: "Albic Molli-Boric Argosols"
      aliases: ["Albic Molli-Boric Argosol"]
      name_pt: "Argissolos bóricos mólicos álbicos"
      adjective: "Albic"
      page: 135
      tests:
        all_of:
          - albic: {position: above_argic}
      notes: "An albic horizon, or a glossic horizon or glossic evidence above the argic horizon."
    - code: "L1.2.4"
      name: "Epigleyic Molli-Boric Argosols"
      aliases: ["Epigleyic Molli-Boric Argosol"]
      name_pt: "Argissolos bóricos mólicos epigleicos"
      adjective: "Epigleyic"
      page: 135
      tests:
        all_of:
          - gleyic_features_cst: {grade: at_least_evidence, top_max: 0, datum: mineral}
      notes: "Gleyic evidence (gleyic features pass too) in the surface horizon (the first mineral layer)."
    - code: "L1.2.5"
      name: "Mottlic Molli-Boric Argosols"
      aliases: ["Mottlic Molli-Boric Argosol"]
      name_pt: "Argissolos bóricos mólicos mosqueados"
      adjective: "Mottlic"
      page: 135
      tests:
        all_of:
          - mottlic: {to: 100}
      notes: "Redoxic features in some horizon 10 cm or more thick within 100 cm of the mineral soil surface."
    - code: "L1.2.6"
      name: "Typic Molli-Boric Argosols"
      aliases: ["Typic Molli-Boric Argosol"]
      name_pt: "Argissolos bóricos mólicos típicos"
      adjective: "Typic"
      page: 136
      tests:
        default: true
      notes: "Other Molli-Boric Argosols."

  "L1.3":
    - code: "L1.3.1"
      name: "Lithic Hapli-Boric Argosols"
      aliases: ["Lithic Hapli-Boric Argosol"]
      name_pt: "Argissolos bóricos háplicos líticos"
      adjective: "Lithic"
      page: 136
      tests:
        all_of:
          - lithic: {depth: 50, contact: lithic, fragments: more_than_half}
      notes: "A lithic contact within 50 cm of the mineral soil surface, or, with none, 70 % or more by volume of gravels or rock fragments over 2 mm in more than half of the horizons within that depth (by thickness, Q22)."
    - code: "L1.3.2"
      name: "Gleyic Hapli-Boric Argosols"
      aliases: ["Gleyic Hapli-Boric Argosol"]
      name_pt: "Argissolos bóricos háplicos gleicos"
      adjective: "Gleyic"
      page: 136
      tests:
        all_of:
          - gleyic: {to: 100, from: 50}
      notes: "Gleyic features in some horizon 10 cm or more thick between 50 and 100 cm of the mineral soil surface."
    - code: "L1.3.3"
      name: "Mottli-albic Hapli-Boric Argosols"
      aliases: ["Mottli-albic Hapli-Boric Argosol"]
      name_pt: "Argissolos bóricos háplicos mosqueados álbicos"
      adjective: "Mottli-albic"
      page: 136
      tests:
        all_of:
          - albic: {position: above_argic}
          - mottlic: {to: 100, thick: 0}
      notes: "An albic horizon, or a glossic horizon or glossic evidence above the argic horizon; and redoxic features in some layer within 100 cm of the mineral soil surface (no thickness printed) (keyed before its parts)."
    - code: "L1.3.4"
      name: "Albic Hapli-Boric Argosols"
      aliases: ["Albic Hapli-Boric Argosol"]
      name_pt: "Argissolos bóricos háplicos álbicos"
      adjective: "Albic"
      page: 136
      tests:
        all_of:
          - albic: {position: above_argic}
      notes: "An albic horizon, or a glossic horizon or glossic evidence above the argic horizon."
    - code: "L1.3.5"
      name: "Mottlic Hapli-Boric Argosols"
      aliases: ["Mottlic Hapli-Boric Argosol"]
      name_pt: "Argissolos bóricos háplicos mosqueados"
      adjective: "Mottlic"
      page: 136
      tests:
        all_of:
          - mottlic: {to: 100}
      notes: "Redoxic features in some horizon 10 cm or more thick within 100 cm of the mineral soil surface."
    - code: "L1.3.6"
      name: "Typic Hapli-Boric Argosols"
      aliases: ["Typic Hapli-Boric Argosol"]
      name_pt: "Argissolos bóricos háplicos típicos"
      adjective: "Typic"
      page: 137
      tests:
        default: true
      notes: "Other Hapli-Boric Argosols."

  "L2.1":
    - code: "L2.1.1"
      name: "Mollic Carbonati-Ustic Argosols"
