          - gypsic_only_cst: {top_max: 100, datum: mineral}
      notes: "A gypsic horizon whose upper boundary lies within 100 cm of the mineral soil surface (named alone: a hypergypsic horizon does not count, Hugo, 2026-11-07)."
    - code: "G2.1.8"
      name: "Dark Calci-Orthic Aridosols"
      aliases: ["Dark Calci-Orthic Aridosol"]
      name_pt: "Aridossolos órticos cálcicos escuros"
      adjective: "Dark"
      page: 105
      tests:
