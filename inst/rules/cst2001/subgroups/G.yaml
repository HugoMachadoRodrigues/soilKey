# The keys to subgroups of the Aridosols (order G) of the Chinese Soil Taxonomy
# (Cooperative Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil
# Taxonomy. Science Press, Beijing and New York, 2001; the English edition,
# system id cst2001), key 5.2, pp. 100-108, keyed by group, in the book's order.
# Each subgroup after the first is "other ... that", so a row tests only its
# own criteria; Typic, the residual, passes by default. A complex subgroup is
# keyed before its simple parts, as printed. Names as printed (the canonical
# spelling of Q2; the other printed forms and the singular as aliases);
# name_pt is soilKey's Portuguese gloss; soilKey's additions in brackets. The
# criteria are paraphrased in the notes; the tests call the presets of
# presets.yaml (expanded at load time) or the predicates of R/key-cst*.R and
# R/diagnostics-cst-*.R directly. Readings: readings.yaml.

subgroups:

  "G1.1":
    - code: "G1.1.1"
      name: "Lithic Calci-Cryic Aridosols"
      aliases: ["Lithic Calci-Cryic Aridosol"]
      name_pt: "Aridossolos críicos cálcicos líticos"
      adjective: "Lithic"
      page: 101
      tests:
        all_of:
          - lithic: {depth: 50, datum: surface}
      notes: "A lithic or paralithic contact within 50 cm of the soil surface."
    - code: "G1.1.2"
      name: "Argic Calci-Cryic Aridosols"
      aliases: ["Argic Calci-Cryic Aridosol"]
      name_pt: "Aridossolos críicos cálcicos argílicos"
      adjective: "Argic"
      page: 101
      tests:
        all_of:
          - argic_lime_cst: {top_max: 100, datum: surface}
      notes: "An argic horizon with lime infiltrates within 100 cm of the soil surface."
    - code: "G1.1.3"
      name: "Dark Calci-Cryic Aridosols"
      aliases: ["Dark Calci-Cryic Aridosol"]
      name_pt: "Aridossolos críicos cálcicos escuros"
      adjective: "Dark"
      page: 101
      tests:
        all_of:
          - dark_surface: {}
      notes: "A moist value of 3.5 or less and a dry (crushed) value of 5.5 or less in the upper 18 cm after mixing."
    - code: "G1.1.4"
      name: "Typic Calci-Cryic Aridosols"
      aliases: ["Typic Calci-Cryic Aridosol"]
      name_pt: "Aridossolos críicos cálcicos típicos"
      adjective: "Typic"
      page: 102
      tests:
        default: true
      notes: "Other Calci-Cryic Aridosols."

  "G1.2":
    - code: "G1.2.1"
      name: "Lithic Gypsi-Cryic Aridosols"
      aliases: ["Lithic Gypsi-Cryic Aridosol"]
      name_pt: "Aridossolos críicos gípsicos líticos"
      adjective: "Lithic"
      page: 102
      tests:
        all_of:
          - lithic: {depth: 50, datum: surface}
      notes: "A lithic or paralithic contact within 50 cm of the soil surface."
    - code: "G1.2.2"
      name: "Typic Gypsi-Cryic Aridosols"
      aliases: ["Typic Gypsi-Cryic Aridosol"]
      name_pt: "Aridossolos críicos gípsicos típicos"
      adjective: "Typic"
      page: 102
      tests:
        default: true
      notes: "Other Gypsi-Cryic Aridosols."

  "G1.3":
    - code: "G1.3.1"
      name: "Dark Argi-Cryic Aridosols"
      aliases: ["Dark Argi-Cryic Aridosol"]
      name_pt: "Aridossolos críicos argílicos escuros"
