  "G2.1":
    - code: "G2.1.1"
      name: "Lithic Calci-Orthic Aridosols"
      aliases: ["Lithic Calci-Orthic Aridosol"]
      name_pt: "Aridossolos órticos cálcicos líticos"
      adjective: "Lithic"
      page: 104
      tests:
