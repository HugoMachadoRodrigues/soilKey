      name_pt: "Aridossolos órticos cálcicos sódicos"
      adjective: "Sodic"
      page: 104
      tests:
        all_of:
          - sodic: {within: 50}
      notes: "The sodic property in some horizon 10 cm or more thick within 50 cm of the mineral soil surface."
    - code: "G2.1.6"
      name: "Argic Calci-Orthic Aridosols"
      aliases: ["Argic Calci-Orthic Aridosol"]
      name_pt: "Aridossolos órticos cálcicos argílicos"
      adjective: "Argic"
      page: 104
      tests:
        all_of:
          - argic_horizon_cst: {top_max: 100, datum: mineral, natro: true}
      notes: "An argic horizon (the natro-argic horizon included, p. 37) within 100 cm of the mineral soil surface."
    - code: "G2.1.7"
      name: "Gypsic Calci-Orthic Aridosols"
      aliases: ["Gypsic Calci-Orthic Aridosol"]
      name_pt: "Aridossolos órticos cálcicos gípsicos"
      adjective: "Gypsic"
      page: 104
      tests:
