      adjective: "Mottlic"
      page: 104
      tests:
        all_of:
          - mottlic: {from: 50, to: 100, total: true}
      notes: "Redoxic features in horizons totalling 10 cm or more between 50 and 100 cm of the mineral soil surface."
    - code: "G2.1.3"
      name: "Panic Calci-Orthic Aridosols"
      aliases: ["Panic Calci-Orthic Aridosol"]
      name_pt: "Aridossolos órticos cálcicos com pã calcário"
      adjective: "Panic"
      page: 104
      tests:
        all_of:
          - calcipan_cst: {top_max: 100, datum: mineral}
      notes: "A calcipan whose upper boundary lies within 100 cm of the mineral soil surface."
    - code: "G2.1.4"
      name: "Hyperic Calci-Orthic Aridosols"
      aliases: ["Hyperic Calci-Orthic Aridosol"]
      name_pt: "Aridossolos órticos cálcicos hipercálcicos"
