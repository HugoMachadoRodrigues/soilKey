    - code: "G1.4.5"
      name: "Dark Hapli-Cryic Aridosols"
      aliases: ["Dark Hapli-Cryic Aridosol"]
      name_pt: "Aridossolos críicos háplicos escuros"
      adjective: "Dark"
      page: 103
      tests:
        all_of:
          - dark_surface: {}
      notes: "A moist value of 3.5 or less and a dry (crushed) value of 5.5 or less in the upper 18 cm after mixing."
    - code: "G1.4.6"
      name: "Typic Hapli-Cryic Aridosols"
      aliases: ["Typic Hapli-Cryic Aridosol"]
