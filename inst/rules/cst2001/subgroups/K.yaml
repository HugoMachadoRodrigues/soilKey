      tests:
        all_of:
          - upper_within_cst: {horizon: argic_horizon, top_max: 125}
      notes: "An argic horizon with its upper boundary within 125 cm of the mineral soil surface (undecided when the description ends above that depth, not on rock or a contact)."
    - code: "K2.1.4"
      name: "Typic Carbonati-Perudic Ferrosols"
      aliases: ["Typic Carbonati-Perudic Ferrosol"]
      name_pt: "Ferrossolos perúdicos carbonáticos típicos"
