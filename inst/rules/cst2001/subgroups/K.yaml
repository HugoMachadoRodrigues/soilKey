      name: "Humic Carbonati-Perudic Ferrosols"
      aliases: ["Humic Carbonati-Perudic Ferrosol"]
      name_pt: "Ferrossolos perúdicos carbonáticos húmicos"
      adjective: "Humic"
      page: 125
      tests:
        all_of:
          - humic_property_cst: {}
      notes: "The humic property (p. 59)."
    - code: "K2.1.2"
      name: "Leachic Carbonati-Perudic Ferrosols"
      aliases: ["Leachic Carbonati-Perudic Ferrosol"]
      name_pt: "Ferrossolos perúdicos carbonáticos lixiviados"
      adjective: "Leachic"
      page: 125
      tests:
        all_of:
          - leachic: {}
      notes: "pH (water) under 6.5 in more than half of the thickness of the horizons within 125 cm of the mineral soil surface or above a shallower lithic or paralithic contact (Q22)."
    - code: "K2.1.3"
      name: "Argic Carbonati-Perudic Ferrosols"
      aliases: ["Argic Carbonati-Perudic Ferrosol"]
      name_pt: "Ferrossolos perúdicos carbonáticos argílicos"
      adjective: "Argic"
