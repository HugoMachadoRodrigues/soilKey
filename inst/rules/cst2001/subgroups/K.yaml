# The keys to subgroups of the Ferrosols (order K) of the Chinese Soil Taxonomy
# (Cooperative Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil
# Taxonomy. Science Press, Beijing and New York, 2001; the English edition,
# system id cst2001), key 5.2, pp. 123-133, keyed by group, in the book's order.
# Each subgroup after the first is "other ... that", so a row tests only its
# own criteria; Typic, the residual, passes by default. A complex subgroup is
# keyed before its simple parts, as printed. Names as printed (the canonical
# spelling of Q2; the other printed forms and the singular as aliases);
# name_pt is soilKey's Portuguese gloss; soilKey's additions in brackets. The
# criteria are paraphrased in the notes; the tests call the presets of
# presets.yaml (expanded at load time) or the predicates of R/key-cst*.R and
# R/diagnostics-cst-*.R directly (v0.9.376). Readings: readings.yaml.

subgroups:

  "K1.1":
    - code: "K1.1.1"
      name: "Typic Argi-Ustic Ferrosols"
      aliases: ["Typic Argi-Ustic Ferrosol"]
      name_pt: "Ferrossolos ústicos argílicos típicos"
      adjective: "Typic"
      page: 124
      book_provisional: true
      tests:
        default: true
      notes: "All Argi-Ustic Ferrosols (the book marks it provisional)."

  "K1.2":
    - code: "K1.2.1"
      name: "Lithic Hapli-Ustic Ferrosols"
      aliases: ["Lithic Hapli-Ustic Ferrosol"]
      name_pt: "Ferrossolos ústicos háplicos líticos"
      adjective: "Lithic"
      page: 124
      tests:
        all_of:
          - lithic: {depth: 50, contact: lithic, fragments: more_than_half}
      notes: "A lithic contact within 50 cm of the mineral soil surface, or, with none, 70 % or more by volume of gravels or rock fragments over 2 mm in more than half of the horizons within that depth (by thickness, Q22)."
    - code: "K1.2.2"
      name: "Trunic Hapli-Ustic Ferrosols"
      aliases: ["Trunic Hapli-Ustic Ferrosol"]
      name_pt: "Ferrossolos ústicos háplicos truncados"
      adjective: "Trunic"
      page: 124
      tests:
        all_of:
          - trunic: {horizon: lac_ferric_horizon}
      notes: "The LAC-ferric horizon directly exposed at the soil surface (the first mineral layer; an A, AB, AC or E there fails)."
    - code: "K1.2.3"
      name: "Typic Hapli-Ustic Ferrosols"
      aliases: ["Typic Hapli-Ustic Ferrosol"]
      name_pt: "Ferrossolos ústicos háplicos típicos"
      adjective: "Typic"
      page: 124
      tests:
        default: true
      notes: "Other Hapli-Ustic Ferrosols."

  "K2.1":
