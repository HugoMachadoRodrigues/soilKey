      page: 126
      tests:
        all_of:
          - stagnic_perched: {}
      notes: "Gleyic evidence (gleyic features pass too) linked to seasonal saturation by perched water in some horizon 10 cm or more thick within 50 cm of the mineral soil surface: groundwater_kind perched or a stagnic regime (default 22); a groundwater table observed or apparent fails, flooded or none recorded leaves it undecided."
    - code: "K2.2.6"
      name: "Mottlic Alliti-Perudic Ferrosols"
      aliases: ["Mottlic Alliti-Perudic Ferrosol"]
      name_pt: "Ferrossolos perúdicos alíticos mosqueados"
      adjective: "Mottlic"
      page: 126
      tests:
        all_of:
          - mottlic: {to: 100, features: [redoxic_features, gleyic_features]}
      notes: "Redoxic features or gleyic evidence (each read on its own run) in some horizon 10 cm or more thick within 100 cm of the mineral soil surface."
    - code: "K2.2.7"
      name: "Eutrophic Alliti-Perudic Ferrosols"
      aliases: ["Eutrophic Alliti-Perudic Ferrosol"]
      name_pt: "Ferrossolos perúdicos alíticos eutróficos"
      adjective: "Eutrophic"
      page: 126
      tests:
        all_of:
          - eutrophic: {}
      notes: "Base saturation (NH4OAc) of 35 % or more in 80 % or more of the thickness of the horizons within 125 cm of the mineral soil surface (Q22)."
    - code: "K2.2.8"
      name: "Argic Alliti-Perudic Ferrosols"
      aliases: ["Argic Alliti-Perudic Ferrosol"]
      name_pt: "Ferrossolos perúdicos alíticos argílicos"
      adjective: "Argic"
      page: 126-127
      tests:
        all_of:
          - upper_within_cst: {horizon: argic_horizon, top_max: 125}
      notes: "An argic horizon with its upper boundary within 125 cm of the mineral soil surface (undecided when the description ends above that depth, not on rock or a contact)."
    - code: "K2.2.9"
      name: "Typic Alliti-Perudic Ferrosols"
