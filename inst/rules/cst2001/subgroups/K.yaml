      adjective: "Agric"
      page: 126
      tests:
        all_of:
          - agric_horizon_cst: {}
      notes: "An agric horizon (no depth printed)."
    - code: "K2.2.4"
      name: "Humic Alliti-Perudic Ferrosols"
