# The keys to subgroups of the Primosols (order N) of the Chinese Soil Taxonomy
# (Cooperative Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil
# Taxonomy. Science Press, Beijing and New York, 2001; the English edition,
# system id cst2001), key 5.2, pp. 167-180, keyed by group, in the book's order.
# Each subgroup after the first is "other ... that", so a row tests only its
# own criteria; Typic, the residual, passes by default. A complex subgroup is
# keyed before its simple parts, as printed. Names as printed (the canonical
# spelling of Q2; the other printed forms and the singular as aliases);
# name_pt is soilKey's Portuguese gloss; soilKey's additions in brackets. The
# criteria are paraphrased in the notes; the tests call the presets of
# presets.yaml (expanded at load time) or the predicates of R/key-cst*.R and
# R/diagnostics-cst-*.R directly (v0.9.376). Readings: readings.yaml.

subgroups:

  "N1.1":
    - code: "N1.1.1"
      name: "Calcaric Turbi-Anthric Primosols"
      aliases: ["Calcaric Turbi-Anthric Primosol"]
      name_pt: "Primossolos antrópicos antroturbados calcáricos"
      adjective: "Calcaric"
      page: 168
      tests:
        all_of:
          - calcaric_property_cst: {}
      notes: "The calcaric property (its own depth, 50 cm, p. 63)."
    - code: "N1.1.2"
      name: "Dystric Turbi-Anthric Primosols"
      aliases: ["Dystric Turbi-Anthric Primosol"]
      name_pt: "Primossolos antrópicos antroturbados distróficos"
      adjective: "Dystric"
      page: 168
      tests:
        all_of:
          - dystric: {to: 50}
      notes: "Base saturation (NH4OAc) under 50 % or pH (water) under 5.5 in every horizon within 50 cm of the mineral soil surface (Q23)."
    - code: "N1.1.3"
      name: "Typic Turbi-Anthric Primosols"
      aliases: ["Typic Turbi-Anthric Primosol"]
      name_pt: "Primossolos antrópicos antroturbados típicos"
      adjective: "Typic"
      page: 168
      tests:
        default: true
      notes: "Other Turbi-Anthric Primosols."

  "N1.2":
    - code: "N1.2.1"
      name: "Parasalic Silti-Anthric Primosols"
      aliases: ["Parasalic Silti-Anthric Primosol"]
      name_pt: "Primossolos antrópicos antrossiltados parassálicos"
      adjective: "Parasalic"
      page: 168
      tests:
        all_of:
          - parasalic: {within: 75, thick: 15}
      notes: "Salic evidence (the salic horizon passes too, Q19) in some horizon 15 cm or more thick within 75 cm of the mineral soil surface."
    - code: "N1.2.2"
      name: "Mottlic Silti-Anthric Primosols"
      aliases: ["Mottlic Silti-Anthric Primosol"]
      name_pt: "Primossolos antrópicos antrossiltados mosqueados"
      adjective: "Mottlic"
      page: 168
      tests:
        all_of:
          - mottlic: {to: 100}
      notes: "Redoxic features in some horizon 10 cm or more thick within 100 cm of the mineral soil surface."
    - code: "N1.2.3"
      name: "Calcaric Silti-Anthric Primosols"
      aliases: ["Calcaric Silti-Anthric Primosol"]
      name_pt: "Primossolos antrópicos antrossiltados calcáricos"
      adjective: "Calcaric"
      page: 168
      tests:
        all_of:
          - calcaric_property_cst: {}
      notes: "The calcaric property (its own depth, 50 cm, p. 63)."
    - code: "N1.2.4"
      name: "Dystric Silti-Anthric Primosols"
      aliases: ["Dystric Silti-Anthric Primosol"]
      name_pt: "Primossolos antrópicos antrossiltados distróficos"
      adjective: "Dystric"
      page: 169
      tests:
        all_of:
          - dystric: {to: 50, from: 20}
      notes: "Base saturation (NH4OAc) under 50 % or pH (water) under 5.5 in every horizon at least between 20 and 50 cm of the mineral soil surface (Q23)."
    - code: "N1.2.5"
      name: "Typic Silti-Anthric Primosols"
      aliases: ["Typic Silti-Anthric Primosol"]
      name_pt: "Primossolos antrópicos antrossiltados típicos"
      adjective: "Typic"
      page: 169
      tests:
        default: true
      notes: "Other Silti-Anthric Primosols."

