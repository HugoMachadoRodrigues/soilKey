# The keys to subgroups of the Gleyosols (order I) of the Chinese Soil Taxonomy
# (Cooperative Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil
# Taxonomy. Science Press, Beijing and New York, 2001; the English edition,
# system id cst2001), key 5.2, pp. 112-116, keyed by group, in the book's order.
# Each subgroup after the first is "other ... that", so a row tests only its
# own criteria; Typic, the residual, passes by default. A complex subgroup is
# keyed before its simple parts, as printed. Names as printed (the canonical
# spelling of Q2; the other printed forms and the singular as aliases);
# name_pt is soilKey's Portuguese gloss; soilKey's additions in brackets. The
# criteria are paraphrased in the notes; the tests call the presets of
# presets.yaml (expanded at load time) or the predicates of R/key-cst*.R and
# R/diagnostics-cst-*.R directly (v0.9.376). Readings: readings.yaml.

subgroups:

  "I1.1":
    - code: "I1.1.1"
      name: "Fibric Histi-Permagelic Gleyosols"
      aliases: ["Fibric Histi-Permagelic Gleyosol"]
      name_pt: "Gleissolos permagélicos hísticos fíbricos"
      adjective: "Fibric"
      page: 112
      tests:
        all_of:
          - histic_kind_cst: {kind: fibric}
      notes: "A fibric histic epipedon: a histic epipedon whose layers are mostly (by thickness) of fibric organic soil materials."
    - code: "I1.1.2"
      name: "Typic Histi-Permagelic Gleyosols"
      aliases: ["Typic Histi-Permagelic Gleyosol"]
      name_pt: "Gleissolos permagélicos hísticos típicos"
      adjective: "Typic"
      page: 113
      tests:
        default: true
      notes: "Other Histi-Permagelic Gleyosols."

  "I1.2":
    - code: "I1.2.1"
      name: "Lithic Hapli-Permagelic Gleyosols"
      aliases: ["Lithic Hapli-Permagelic Gleyosol"]
      name_pt: "Gleissolos permagélicos háplicos líticos"
      adjective: "Lithic"
      page: 113
      tests:
        all_of:
          - lithic: {depth: 50, contact: lithic}
      notes: "A lithic contact within 50 cm of the mineral soil surface."
    - code: "I1.2.2"
      name: "Histic Hapli-Permagelic Gleyosols"
      aliases: ["Histic Hapli-Permagelic Gleyosol"]
      name_pt: "Gleissolos permagélicos háplicos hísticos"
      adjective: "Histic"
      page: 113
      tests:
        all_of:
          - histic_epipedon_cst: {grade: at_least_evidence}
      notes: "Histic evidence (no depth printed; the group has no histic epipedon)."
    - code: "I1.2.3"
      name: "Mollic Hapli-Permagelic Gleyosols"
      aliases: ["Mollic Hapli-Permagelic Gleyosol"]
      name_pt: "Gleissolos permagélicos háplicos mólicos"
      adjective: "Mollic"
      page: 113
      tests:
        all_of:
          - mollic_epipedon_cst: {}
      notes: "A mollic epipedon."
    - code: "I1.2.4"
      name: "Typic Hapli-Permagelic Gleyosols"
      aliases: ["Typic Hapli-Permagelic Gleyosol"]
      name_pt: "Gleissolos permagélicos háplicos típicos"
      adjective: "Typic"
      page: 113
      tests:
        default: true
      notes: "Other Hapli-Permagelic Gleyosols."

  "I2.1":
    - code: "I2.1.1"
      name: "Fibric Histi-Stagnic Gleyosols"
      aliases: ["Fibric Histi-Stagnic Gleyosol"]
      name_pt: "Gleissolos estágnicos hísticos fíbricos"
      adjective: "Fibric"
      page: 114
      tests:
        all_of:
          - histic_kind_cst: {kind: fibric}
      notes: "A fibric histic epipedon: a histic epipedon whose layers are mostly (by thickness) of fibric organic soil materials."
    - code: "I2.1.2"
      name: "Typic Histi-Stagnic Gleyosols"
      aliases: ["Typic Histi-Stagnic Gleyosol"]
      name_pt: "Gleissolos estágnicos hísticos típicos"
      adjective: "Typic"
      page: 114
      tests:
        default: true
      notes: "Other Histi-Stagnic Gleyosols."

  "I2.2":
    - code: "I2.2.1"
      name: "Lithic Hapli-Stagnic Gleyosols"
      aliases: ["Lithic Hapli-Stagnic Gleyosol"]
      name_pt: "Gleissolos estágnicos háplicos líticos"
      adjective: "Lithic"
      page: 114
      tests:
        all_of:
          - lithic: {depth: 50, contact: lithic}
      notes: "A lithic contact within 50 cm of the mineral soil surface."
    - code: "I2.2.2"
      name: "Mollic Hapli-Stagnic Gleyosols"
      aliases: ["Mollic Hapli-Stagnic Gleyosol"]
      name_pt: "Gleissolos estágnicos háplicos mólicos"
      adjective: "Mollic"
      page: 114
      tests:
        all_of:
          - mollic_epipedon_cst: {}
      notes: "A mollic epipedon."
    - code: "I2.2.3"
      name: "Typic Hapli-Stagnic Gleyosols"
      aliases: ["Typic Hapli-Stagnic Gleyosol"]
      name_pt: "Gleissolos estágnicos háplicos típicos"
      adjective: "Typic"
      page: 114
      tests:
        default: true
      notes: "Other Hapli-Stagnic Gleyosols."

  "I3.1":
    - code: "I3.1.1"
      name: "Fibric Histi-Orthic Gleyosols"
      aliases: ["Fibric Histi-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos hísticos fíbricos"
      adjective: "Fibric"
      page: 115
      tests:
        all_of:
          - histic_kind_cst: {kind: fibric}
      notes: "A fibric histic epipedon: a histic epipedon whose layers are mostly (by thickness) of fibric organic soil materials."
    - code: "I3.1.2"
      name: "Sapric Histi-Orthic Gleyosols"
      aliases: ["Sapric Histi-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos hísticos sápricos"
      adjective: "Sapric"
      page: 115
      tests:
        all_of:
          - histic_kind_cst: {kind: sapric}
      notes: "A sapric histic epipedon: a histic epipedon whose layers are mostly (by thickness) of sapric organic soil materials."
    - code: "I3.1.3"
      name: "Typic Histi-Orthic Gleyosols"
      aliases: ["Typic Histi-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos hísticos típicos"
      adjective: "Typic"
      page: 115
      tests:
        default: true
      notes: "Other Histi-Orthic Gleyosols."

  "I3.2":
    - code: "I3.2.1"
      name: "Sulfic Molli-Orthic Gleyosols"
      aliases: ["Sulfic Molli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos mólicos sulfídicos"
      adjective: "Sulfic"
      page: 115
      tests:
        all_of:
          - sulfic: {within: 125, thick: 10, total: true}
      notes: "Within 125 cm of the mineral soil surface, sulfidic materials in horizons totalling 10 cm or more, or a sulfuric horizon."
    - code: "I3.2.2"
      name: "Dystric Molli-Orthic Gleyosols"
      aliases: ["Dystric Molli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos mólicos distróficos"
      adjective: "Dystric"
      page: 115
      tests:
        all_of:
          - dystric: {to: 50, from: 20}
      notes: "Base saturation (NH4OAc) under 50 % or pH (water) under 5.5 in every horizon at least between 20 and 50 cm of the mineral soil surface (Q23)."
    - code: "I3.2.3"
      name: "Parasalic Molli-Orthic Gleyosols"
      aliases: ["Parasalic Molli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos mólicos parassálicos"
      adjective: "Parasalic"
      page: 115
      tests:
        all_of:
          - parasalic: {within: 50}
      notes: "Salic evidence (the salic horizon passes too, Q19) in some horizon 10 cm or more thick within 50 cm of the mineral soil surface."
    - code: "I3.2.4"
      name: "Calcaric Molli-Orthic Gleyosols"
      aliases: ["Calcaric Molli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos mólicos calcáricos"
      adjective: "Calcaric"
      page: 115
      tests:
        all_of:
          - calcaric_property_cst: {}
      notes: "The calcaric property (its own depth, 50 cm, p. 63)."
    - code: "I3.2.5"
      name: "Typic Molli-Orthic Gleyosols"
      aliases: ["Typic Molli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos mólicos típicos"
      adjective: "Typic"
      page: 115
      tests:
        default: true
      notes: "Other Molli-Orthic Gleyosols."

  "I3.3":
    - code: "I3.3.1"
      name: "Lithic Hapli-Orthic Gleyosols"
      aliases: ["Lithic Hapli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos háplicos líticos"
      adjective: "Lithic"
      page: 116
      tests:
        all_of:
          - lithic: {depth: 50, contact: lithic}
      notes: "A lithic contact within 50 cm of the mineral soil surface."
    - code: "I3.3.2"
      name: "Umbric Hapli-Orthic Gleyosols"
      aliases: ["Umbric Hapli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos háplicos úmbricos"
      adjective: "Umbric"
      page: 116
      tests:
        all_of:
          - umbric_epipedon_cst: {}
      notes: "An umbric epipedon."
    - code: "I3.3.3"
      name: "Dystric Hapli-Orthic Gleyosols"
      aliases: ["Dystric Hapli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos háplicos distróficos"
      adjective: "Dystric"
      page: 116
      tests:
        all_of:
          - dystric: {to: 50, from: 20}
      notes: "Base saturation (NH4OAc) under 50 % or pH (water) under 5.5 in every horizon at least between 20 and 50 cm of the mineral soil surface (Q23)."
    - code: "I3.3.4"
      name: "Parasalic Hapli-Orthic Gleyosols"
      aliases: ["Parasalic Hapli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos háplicos parassálicos"
      adjective: "Parasalic"
      page: 116
      tests:
        all_of:
          - parasalic: {within: 50}
      notes: "Salic evidence (the salic horizon passes too, Q19) in some horizon 10 cm or more thick within 50 cm of the mineral soil surface."
    - code: "I3.3.5"
      name: "Calcaric Hapli-Orthic Gleyosols"
      aliases: ["Calcaric Hapli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos háplicos calcáricos"
      adjective: "Calcaric"
      page: 116
      tests:
        all_of:
          - calcaric_property_cst: {}
      notes: "The calcaric property (its own depth, 50 cm, p. 63)."
    - code: "I3.3.6"
      name: "Typic Hapli-Orthic Gleyosols"
      aliases: ["Typic Hapli-Orthic Gleyosol"]
      name_pt: "Gleissolos órticos háplicos típicos"
      adjective: "Typic"
      page: 116
      tests:
        default: true
      notes: "Other Hapli-Orthic Gleyosols."
