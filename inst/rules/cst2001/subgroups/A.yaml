# The keys to subgroups of the Histosols (order A) of the Chinese Soil Taxonomy
# (Cooperative Research Group on Chinese Soil Taxonomy, ISSAS. Chinese Soil
# Taxonomy. Science Press, Beijing and New York, 2001; the English edition,
# system id cst2001), key 5.2, pp. 75-81, keyed by group, in the book's order.
# Each subgroup after the first is "other ... that", so a row tests only its
# own criteria; Typic, the residual, passes by default. A complex subgroup is
# keyed before its simple parts, as printed. Names as printed (the canonical
# spelling of Q2; the other printed forms and the singular as aliases);
# name_pt is soilKey's Portuguese gloss; soilKey's additions in brackets. The
# criteria are paraphrased in the notes; the tests call the presets of
# presets.yaml (expanded at load time) or the predicates of R/key-cst*.R and
# R/diagnostics-cst-*.R directly. Readings: readings.yaml.

subgroups:

  "A1.1":
    - code: "A1.1.1"
      name: "Lithic Foli-Permagelic Histosols"
      aliases: ["Lithic Foli-Permagelic Histosol"]
      name_pt: "Organossolos permagélicos fólicos líticos"
      adjective: "Lithic"
      page: 76
      tests:
        all_of:
          - lithic: {depth: 100, datum: surface}
      notes: "A lithic or paralithic contact within 100 cm of the soil surface."
    - code: "A1.1.2"
      name: "Typic Foli-Permagelic Histosols"
      aliases: ["Typic Foli-Permagelic Histosol"]
      name_pt: "Organossolos permagélicos fólicos típicos"
      adjective: "Typic"
      page: 76
      tests:
        default: true
      notes: "Other Foli-Permagelic Histosols."

  "A1.2":
    - code: "A1.2.1"
      name: "Buric Fibri-Permagelic Histosols"
      aliases: ["Buric Fibri-Permagelic Histosol"]
      name_pt: "Organossolos permagélicos fíbricos búricos"
      adjective: "Buric"
      page: 77
      tests:
        all_of:
          - buric_cst: {max_cm: 40}
      notes: "A mineral layer less than 40 cm thick from the soil surface (over the organic soil materials)."
    - code: "A1.2.2"
      name: "Terric Fibri-Permagelic Histosols"
      aliases: ["Terric Fibri-Permagelic Histosol"]
      name_pt: "Organossolos permagélicos fíbricos térricos"
      adjective: "Terric"
      page: 77
      tests:
        all_of:
          - terric_cst: {min_cm: 30}
      notes: "A mineral layer 30 cm or more thick whose upper boundary lies within the subsurface tier."
    - code: "A1.2.3"
      name: "Lithic Fibri-Permagelic Histosols"
      aliases: ["Lithic Fibri-Permagelic Histosol"]
      name_pt: "Organossolos permagélicos fíbricos líticos"
      adjective: "Lithic"
      page: 77
      tests:
        all_of:
          - histosol_lithic_cs_cst: {}
      notes: "A lithic contact within the control section."
    - code: "A1.2.4"
      name: "Hemic Fibri-Permagelic Histosols"
      aliases: ["Hemic Fibri-Permagelic Histosol"]
      name_pt: "Organossolos permagélicos fíbricos hêmicos"
      adjective: "Hemic"
      page: 77
      tests:
        all_of:
          - histosol_tier_layers_cst: {kind: hemic, min_cm: 25}
      notes: "Layers of hemic soil materials totalling 25 cm or more within the subsurface or bottom tier."
    - code: "A1.2.5"
      name: "Sapric Fibri-Permagelic Histosols"
      aliases: ["Sapric Fibri-Permagelic Histosol"]
      name_pt: "Organossolos permagélicos fíbricos sápricos"
      adjective: "Sapric"
      page: 77
      tests:
        all_of:
          - histosol_tier_layers_cst: {kind: sapric, min_cm: 12.5}
      notes: "Layers of sapric soil materials totalling 12.5 cm or more within the subsurface or bottom tier."
    - code: "A1.2.6"
      name: "Typic Fibri-Permagelic Histosols"
      aliases: ["Typic Fibri-Permagelic Histosol"]
      name_pt: "Organossolos permagélicos fíbricos típicos"
      adjective: "Typic"
      page: 77
      tests:
        default: true
      notes: "Other Fibri-Permagelic Histosols."

  "A1.3":
    - code: "A1.3.1"
