      tests:
        all_of:
          - histosol_lithic_cs_cst: {}
      notes: "Appendix 1 only (p. 181): the key (pp. 77-78) prints no Lithic subgroup here; soilKey keys it at its Appendix position with the test of A1.2.3, a lithic contact within the control section (Hugo's decision Q3)."
    - code: "A1.3.3"
      name: "Sapric Hemi-Permagelic Histosols"
