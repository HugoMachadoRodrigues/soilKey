# The key to soil orders (5.1, pp. 72-75) and the keys to suborders (5.2) of
# the Chinese Soil Taxonomy (Cooperative Research Group on Chinese Soil
# Taxonomy, ISSAS. Chinese Soil Taxonomy. Science Press, Beijing and New
# York, 2001; the English edition, system id cst2001), in the book's order.
# Each class after the first is "other soils that ...", so a gate tests only
# its own criteria: the key's order supplies the exclusions. Codes and names
# as printed (English, the plural of the key); name_pt is soilKey's
# Portuguese gloss, for display only; soilKey's additions are in brackets.
# The criteria are paraphrased in the notes; the predicates are those of
# R/diagnostics-cst-*.R, R/cst-regimes.R and R/key-cst.R. Depths are from the
# mineral soil surface where the book says so ("datum: mineral"), else from
# the soil surface. The readings where the text is silent are in
# readings.yaml.

orders:

  - code: "A"
    name: "Histosols"
    name_pt: "Organossolos (Histosols)"
    page: 72
    tests:
      all_of:
        - andic_share_cst: {below: 0.6, datum: surface}
        - histosol_materials_cst: {}
    notes: "Andic property in less than 60 % of the upper 60 cm (or of the soil above a shallower lithic or paralithic contact), and organic soil materials that overlie cindery, fragmental or pumiceous materials on a contact; or with them total 40 cm within 50 cm; or make two thirds of the soil above a contact; or are saturated 6 months (or drained), start within 40 cm and are 60 cm thick (moss, or bulk density under 0.1) or 40 cm thick (sapric, hemic, or fibric with less moss and bulk density 0.1-0.4)."

  - code: "B"
    name: "Anthrosols"
    name_pt: "Antrossolos (Anthrosols)"
    page: 73
    tests:
      any_of:
        - all_of:
            - anthrostagnic_epipedon_cst: {}
            - hydragric_horizon_cst: {}
        - all_of:
            - fimic_epipedon_cst: {}
            - phos_agric_horizon_cst: {}
        - siltigic_epipedon_cst: {}
        - cumulic_epipedon_cst: {}
    notes: "An anthrostagnic epipedon and a hydragric horizon; or a fimic epipedon and a phos-agric horizon; or a siltigic or a cumulic epipedon."

  - code: "C"
    name: "Spodosols"
    name_pt: "Espodossolos (Spodosols)"
    page: 73
    tests:
      all_of:
        - none_of:
            - siltigic_epipedon_cst: {}
            - cumulic_epipedon_cst: {}
            - fimic_epipedon_cst: {}
            - anthrostagnic_epipedon_cst: {}
        - none_of:
            - argic_above_spodic_cst: {}
        - spodic_horizon_cst: {top_max: 100, datum: mineral}
        - andic_share_cst: {below: 0.6, datum: andic}
    notes: "No anthropic epipedon and no argic horizon above the spodic horizon; a spodic horizon starting within 100 cm of the mineral soil surface; andic property in less than 60 % of the upper 60 cm (from the mineral soil surface or the top of an organic layer with andic property, whichever is shallower, or to a shallower contact)."

  - code: "D"
    name: "Andosols"
    name_pt: "Andossolos (Andosols)"
    page: 73
    tests:
      all_of:
        - andic_share_cst: {min: 0.6, datum: andic}
    notes: "Andic property in 60 % or more of the upper 60 cm, measured as in the Spodosols."

  - code: "E"
    name: "Ferralosols"
    name_pt: "Ferralossolos (Ferralosols)"
    page: 73
    tests:
      all_of:
        - ferralic_horizon_cst: {top_max: 150, datum: mineral}
    notes: "A ferralic horizon starting within 150 cm of the mineral soil surface."

  - code: "F"
    name: "Vertosols"
    name_pt: "Vertossolos (Vertosols)"
    page: 74
    tests:
      all_of:
        - vertic_features_cst: {}
        - none_of:
            - lithic_contact_cst: {top_max: 50, datum: mineral}
            - paralithic_contact_cst: {top_max: 50, datum: mineral}
    notes: "Vertic features within 100 cm of the mineral soil surface, and no lithic or paralithic contact within 50 cm."

  - code: "G"
    name: "Aridosols"
    name_pt: "Aridossolos (Aridosols)"
    page: 74
    tests:
      all_of:
        - aridic_epipedon_cst: {}
        - any_of:
            - salic_horizon_cst: {top_max: 100, datum: mineral}
            - hypersalic_horizon_cst: {top_max: 100, datum: mineral}
            - salipan_cst: {top_max: 100, datum: mineral}
            - gypsic_horizon_cst: {top_max: 100, datum: mineral}
            - hypergypsic_horizon_cst: {top_max: 100, datum: mineral}
            - calcic_horizon_cst: {top_max: 100, datum: mineral}
            - hypercalcic_horizon_cst: {top_max: 100, datum: mineral}
            - calcipan_cst: {top_max: 100, datum: mineral}
            - argic_horizon_cst: {top_max: 100, datum: mineral, natro: true}
            - cambic_horizon_cst: {top_max: 100, datum: mineral}
    notes: "An aridic epipedon, and a salic, hypersalic, gypsic, hypergypsic, calcic, hypercalcic, argic (natro-argic included, p. 37) or cambic horizon, a salipan or a calcipan starting within 100 cm of the mineral soil surface."

  - code: "H"
    name: "Halosols"
    name_pt: "Halossolos (Halosols)"
    page: 74
    tests:
      any_of:
        - salic_horizon_cst: {top_max: 30, datum: mineral}
        - alkalic_horizon_cst: {top_max: 75, datum: mineral}
    notes: "A salic horizon starting within 30 cm, or an alkalic horizon starting within 75 cm, of the mineral soil surface."

  - code: "I"
    name: "Gleyosols"
    name_pt: "Gleissolos (Gleyosols)"
    page: 74
    tests:
      all_of:
        - layer_run_cst: {feature: gleyic_features, min_cm: 10, to_cm: 50}
    notes: "Gleyic features in some horizon 10 cm or more thick within 50 cm of the mineral soil surface."

  - code: "J"
    name: "Isohumosols"
    name_pt: "Isoumossolos (Isohumosols)"
    page: 74
    tests:
      all_of:
        - mollic_epipedon_cst: {}
        - isohumic_property_cst: {}
        - isohumosol_base_saturation_cst: {}
    notes: "A mollic epipedon, the isohumic property, and a base saturation (NH4OAc) of 50 % or more in every horizon down to 180 cm, to 125 cm below the top of an argic horizon, or to a lithic or paralithic contact, whichever is shallowest."

  - code: "K"
    name: "Ferrosols"
    name_pt: "Ferrossolos (Ferrosols)"
    page: 74
    tests:
      all_of:
        - lac_ferric_horizon_cst: {top_max: 125, datum: mineral}
    notes: "A LAC-ferric horizon starting within 125 cm of the mineral soil surface."

  - code: "L"
    name: "Argosols"
    name_pt: "Argissolos (Argosols)"
    page: 75
    tests:
      any_of:
        - argic_horizon_cst: {top_max: 100, datum: mineral}
        - claypan_argillans_cst: {top_max: 100}
    notes: "An argic horizon starting within 100 cm of the mineral soil surface, or a claypan starting there with illuviation argillans 0.5 mm or more thick in some part."

  - code: "M"
    name: "Cambosols"
    name_pt: "Cambissolos (Cambosols)"
    page: 75
    tests:
      any_of:
        - cambic_horizon_cst: {}
        - albic_horizon_cst: {top_max: 100, datum: mineral}
        - calcic_horizon_cst: {top_max: 100, datum: mineral}
        - hypercalcic_horizon_cst: {top_max: 100, datum: mineral}
        - gypsic_horizon_cst: {top_max: 100, datum: mineral}
        - hypergypsic_horizon_cst: {top_max: 100, datum: mineral}
        - calcipan_cst: {top_max: 100, datum: mineral}
        - all_of:
            - low_n_or_clay_cst: {}
            - any_of:
                - histic_epipedon_cst: {}
                - mollic_epipedon_cst: {}
                - umbric_epipedon_cst: {}
        - all_of:
            - permafrost_layer_cst: {top_max: 50, datum: mineral}
            - moisture_regime_cst: {regimes: [stagnic]}
    notes: "A cambic horizon; or an albic (printed 'ablic'), calcic, hypercalcic, gypsic or hypergypsic horizon or a calcipan within 100 cm; or, in some horizon 10 cm thick between 20 and 50 cm, an n value under 0.7 or less than 80 g/kg clay, with a histic, mollic or umbric epipedon; or a permafrost layer and a stagnic moisture regime within 50 cm."

  - code: "N"
    name: "Primosols"
    name_pt: "Primossolos (Primosols)"
    page: 75
    tests:
      default: true
    notes: "Other soils."


suborders:

  "A":
    - code: "A1"
      name: "Permagelic Histosols"
      name_pt: "Organossolos permagélicos"
      page: 75
      tests:
        any_of:
          - temperature_regime_cst: {regimes: [permagelic]}
          - permafrost_layer_cst: {top_max: 200}
      notes: "A permagelic temperature regime, or a permafrost layer within 200 cm of the soil surface."
    - code: "A2"
      name: "Orthic Histosols"
      name_pt: "Organossolos órticos"
      page: 76
      tests:
        default: true
      notes: "Other Histosols."

  "B":
    - code: "B1"
      name: "Stagnic Anthrosols"
      name_pt: "Antrossolos estágnicos (de arrozal)"
      page: 81
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [anthrostagnic]}
          - anthrostagnic_epipedon_cst: {}
          - hydragric_horizon_cst: {}
      notes: "An anthrostagnic moisture regime, an anthrostagnic epipedon and a hydragric horizon."
    - code: "B2"
      name: "Orthic Anthrosols"
      name_pt: "Antrossolos órticos"
      page: 81
      tests:
        default: true
      notes: "Other Anthrosols."

  "C":
    - code: "C1"
      name: "Humic Spodosols"
      name_pt: "Espodossolos húmicos"
      page: 88
      tests:
        all_of:
          - humic_spodic_cst: {}
      notes: "Subhorizons of the spodic horizon 10 cm or more thick with 60 g/kg organic carbon or more."
    - code: "C2"
      name: "Orthic Spodosols"
      name_pt: "Espodossolos órticos"
      page: 88
      tests:
        default: true
      notes: "Other Spodosols."

  "D":
    - code: "D1"
      name: "Cryic Andosols"
      name_pt: "Andossolos críicos"
      page: 89
      tests:
        all_of:
          - temperature_regime_cst: {regimes: [cryic], or_colder: true}
      notes: "A cryic or colder temperature regime."
    - code: "D2"
      name: "Vitric Andosols"
      name_pt: "Andossolos vítricos"
      page: 89
      tests:
        all_of:
          - vitric_texture_cst: {}
      notes: "A weighted particle-size distribution coarser than silt loam within 100 cm of the mineral soil surface or above a shallower lithic contact."
    - code: "D3"
      name: "Udic Andosols"
      name_pt: "Andossolos údicos"
      page: 89
      residual_named_for: udic
      tests:
        default: true
      notes: "Other Andosols."

  "E":
    - code: "E1"
      name: "Udic Ferralosols"
      name_pt: "Ferralossolos údicos"
      page: 93
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [udic, perudic]}
      notes: "A udic moisture regime (the perudic regime, the wet end of the udic one, read as udic: Hugo, 2026-11-04)."
    - code: "[E2]"
      name: "[Other Ferralosols]"
      name_pt: "[Outros Ferralossolos]"
      bracketed: true
      tests:
        default: true
      notes: "soilKey's residual: the book prints no suborder for the Ferralosols that are not udic (Hugo's decision Q4, 2026-11-04); it has no groups."

  "F":
    - code: "F1"
      name: "Aquic Vertosols"
      name_pt: "Vertossolos áquicos"
      page: 96
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [aquic]}
          - layer_run_cst: {feature: redoxic_features, min_cm: 10, to_cm: 50, total: true}
      notes: "An aquic moisture regime, and redoxic features in horizons totalling 10 cm or more within 50 cm of the mineral soil surface."
    - code: "F2"
      name: "Ustic Vertosols"
      name_pt: "Vertossolos ústicos"
      page: 96
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [ustic]}
          - crack_days_cst: {days: 90}
      notes: "An ustic moisture regime and, unless irrigated, cracks 5 mm wide through 25 cm within 50 cm for 90 cumulative days or more in most years."
    - code: "F3"
      name: "Udic Vertosols"
      name_pt: "Vertossolos údicos"
      page: 96
      residual_named_for: udic
      tests:
        default: true
      notes: "Other Vertosols."

  "G":
    - code: "G1"
      name: "Cryic Aridosols"
      name_pt: "Aridossolos críicos"
      page: 100
      tests:
        all_of:
          - temperature_regime_cst: {regimes: [cryic]}
      notes: "A cryic temperature regime (the colder ones are not included: Hugo's decision Q7)."
    - code: "G2"
      name: "Orthic Aridosols"
      name_pt: "Aridossolos órticos"
      page: 100
      tests:
        default: true
      notes: "Other Aridosols."

  "H":
    - code: "H1"
      name: "Alkalic Halosols"
      name_pt: "Halossolos alcálicos"
      page: 108
      tests:
        all_of:
          - alkalic_horizon_cst: {top_max: 75, datum: mineral}
      notes: "An alkalic horizon starting within 75 cm of the mineral soil surface."
    - code: "H2"
      name: "Orthic Halosols"
      name_pt: "Halossolos órticos"
      page: 108
      tests:
        default: true
      notes: "Other Halosols."

  "I":
    - code: "I1"
      name: "Permagelic Gleyosols"
      name_pt: "Gleissolos permagélicos"
      page: 112
      tests:
        all_of:
          - permafrost_layer_cst: {top_max: 200}
      notes: "A permafrost layer within 200 cm of the soil surface."
    - code: "I2"
      name: "Stagnic Gleyosols"
      name_pt: "Gleissolos estágnicos"
      page: 112
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [stagnic]}
      notes: "A stagnic moisture regime."
    - code: "I3"
      name: "Orthic Gleyosols"
      name_pt: "Gleissolos órticos"
      page: 112
      tests:
        default: true
      notes: "Other Gleyosols."

  "J":
    - code: "J1"
      name: "Lithomorphic Isohumosols"
      name_pt: "Isoumossolos litomórficos"
      page: 116
      tests:
        any_of:
          - lc_coral_sands_cst: {}
          - lc_carbonate_rocks_cst: {}
      notes: "The lithologic characters of coral sands or of carbonate rocks."
    - code: "J2"
      name: "Ustic Isohumosols"
      name_pt: "Isoumossolos ústicos"
      page: 116
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [ustic]}
      notes: "An ustic moisture regime."
    - code: "J3"
      name: "Udic Isohumosols"
      name_pt: "Isoumossolos údicos"
      page: 116
      residual_named_for: udic
      tests:
        default: true
      notes: "Other Isohumosols."

  "K":
    - code: "K1"
      name: "Ustic Ferrosols"
      name_pt: "Ferrossolos ústicos"
      page: 123
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [ustic]}
      notes: "An ustic moisture regime."
    - code: "K2"
      name: "Perudic Ferrosols"
      name_pt: "Ferrossolos perúdicos"
      page: 123
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [perudic]}
      notes: "A perudic moisture regime."
    - code: "K3"
      name: "Udic Ferrosols"
      name_pt: "Ferrossolos údicos"
      page: 123
      residual_named_for: udic
      tests:
        default: true
      notes: "Other Ferrosols (the book adds 'udic regime' in brackets: a description, not a test)."

  "L":
    - code: "L1"
      name: "Boric Argosols"
      name_pt: "Argissolos bóricos"
      page: 134
      tests:
        all_of:
          - temperature_regime_cst: {regimes: [frigid, cryic]}
      notes: "A frigid or cryic temperature regime (the colder ones are not included: Hugo's decision Q7)."
    - code: "L2"
      name: "Ustic Argosols"
      name_pt: "Argissolos ústicos"
      page: 134
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [ustic]}
      notes: "An ustic moisture regime."
    - code: "L3"
      name: "Perudic Argosols"
      name_pt: "Argissolos perúdicos"
      page: 134
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [perudic]}
      notes: "A perudic moisture regime."
    - code: "L4"
      name: "Udic Argosols"
      name_pt: "Argissolos údicos"
      page: 134
      residual_named_for: udic
      tests:
        default: true
      notes: "Other Argosols."

  "M":
    - code: "M1"
      name: "Gelic Cambosols"
      name_pt: "Cambissolos gélicos"
      page: 146
      tests:
        all_of:
          - temperature_regime_cst: {regimes: [cryic], or_colder: true}
          - frost_thawic_features_cst: {}
      notes: "A cryic or colder temperature regime, and frost-thawic features."
    - code: "M2"
      name: "Aquic Cambosols"
      name_pt: "Cambissolos áquicos"
      page: 146
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [aquic]}
          - layer_run_cst: {feature: redoxic_features, min_cm: 10, to_cm: 50}
      notes: "An aquic moisture regime, and redoxic features in some horizon 10 cm or more thick within 50 cm of the mineral soil surface."
    - code: "M3"
      name: "Ustic Cambosols"
      name_pt: "Cambissolos ústicos"
      page: 146
      tests:
        any_of:
          - moisture_regime_cst: {regimes: [ustic]}
          - all_of:
              - moisture_regime_cst: {regimes: [aridic]}
              - irrigated_cst: {}
      notes: "An ustic moisture regime, an aridic regime made ustic by irrigation included."
    - code: "M4"
      name: "Perudic Cambosols"
      name_pt: "Cambissolos perúdicos"
      page: 146
      tests:
        all_of:
          - moisture_regime_cst: {regimes: [perudic]}
      notes: "A perudic moisture regime."
    - code: "M5"
      name: "Udic Cambosols"
      name_pt: "Cambissolos údicos"
      page: 147
      residual_named_for: udic
      tests:
        default: true
      notes: "Other Cambosols."

  "N":
    - code: "N1"
      name: "Anthric Primosols"
      name_pt: "Primossolos antrópicos"
      page: 167
      tests:
        any_of:
          - anthroturbic_layer_cst: {top_max: 50, datum: mineral}
          - anthro_silting_within_cst: {top_max: 50}
      notes: "An anthroturbic layer or anthro-silting materials within 50 cm of the mineral soil surface."
    - code: "N2"
      name: "Sandic Primosols"
      name_pt: "Primossolos arênicos"
      page: 167
      tests:
        all_of:
          - lc_sandy_cst: {}
      notes: "The lithologic characters of sandy deposits."
    - code: "N3"
      name: "Alluvic Primosols"
      name_pt: "Primossolos flúvicos"
      page: 167
      tests:
        all_of:
          - lc_alluvial_cst: {}
      notes: "The lithologic characters of alluvial deposits."
    - code: "N4"
      name: "Orthic Primosols"
      name_pt: "Primossolos órticos"
      page: 167
      tests:
        default: true
      notes: "Other Primosols."
