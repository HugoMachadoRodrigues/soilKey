# The readings soilKey makes of the French Référentiel pédologique 2008 (AFES;
# Baize D., Girard M.-C. coord.; Éditions Quæ, 2009) where the text is silent
# or ambiguous. An entry ending "(Hugo, 2026-11-02)" is a decision of the
# owner, in soilKey's words; an entry ending "(soilKey's reading, for Hugo to
# confirm, 2026-11-02)" is soilKey's own and waits for his word. Pages are the
# printed pages of the book. The criteria are paraphrased; no text of the
# book is shipped.
readings:
  - topic: "Registry names and declared notations"
    page: "pp. 1-5"
    reading: "The RP will be the system rp2008, namespace rp, aliases rp and referentiel; site$designation_system declares its notation with rp, rp2008, rp1995, referentiel or afes (read by prefix since the review: see the decisions below). france, french and fr stay with the CPCS 1967, so nothing changes for those who use it (Q2) (Hugo, 2026-11-02)."
  - topic: "Recognising the notation"
    page: "pp. 1-5, 393"
    reading: "A profile is in the RP notation when declared, or when it has one symbol only the RP writes or two that it alone usually writes, and no symbol only the CPCS 1967 writes and no sign of the Russian notation; a profile with both is undecided: no designation is read as an RP code and both readings go to the evidence. The CPCS and FAO designations give hints through Annex 6 and the FAO letters; the data decide. Never by the country (Q9) (Hugo, 2026-11-02)."
  - topic: "The vocabulary"
    page: "pp. 1-5, 20, 331"
    reading: "A closed, case-sensitive vocabulary read by the longest match (Snd, And, Sdo, Sal, Femp, Kc, OXc before Sn, An, Sa, Fe, K, OX); Xc is the cobbly X and Dx a layer of mixed rocks; L, Na, Sa, the paleo pi and J are overlays, the suffixes are features; -c is indurated except in Kc (a code: continuous, not indurated), in Xc and after OF or OH (the mycogenic structure of Annex 1); the variants Vna and VNa, Vsa and VSa, Lav for LAv, OFz and OHz for OFzo and OHzo, OHmzo for OHfzo, Ypm as Yp with m, Snh as Sn with h, JZ and JZtc are read; FE is read as Fe only in a profile declared rp1995 or written with FEm, FEmp or Ahs. The CPCS and Russian readers do not change (default 12) (Hugo, 2026-11-02)."
  - topic: "Suffixes the book lists completely"
    page: "pp. 3-5, 26"
    reading: "Where the book gives the complete list of the horizons a suffix is written on (LC), the reader reads it only there: -a on E, G and g; -ca on C and the layers D, M, R; -cra on C, D and M; -d on BT and S (BTd, Sd); -m only as Ypm (Fem, Km, OXm and Sim are codes of their own); -nod on A, F, OX and RT; -t on S, C and FS (St, Ct, FSt). The hosts are codes, not families: a variant counts as its listed code (Gr as G, OFr as OF), but Sca is not S. The suffixes of hard rocks -cri and -do are read on R and D, and -sch, -si and -vo also on M, which page 26 writes (Msch, Msi, Mvo). -zo, which the book gives by examples, is read like -noz only on OF and OH. A suffix outside these hosts, a mark written twice (Sgg, Rcaca) or -c or -m after a code that says indurated (Kcc, OXmc, Femc) leaves the designation unread, with a note; -j on FS and -ho on an O horizon are read with a note (pp. 180, Annex 4) (Hugo, 2026-11-02)."
  - topic: "Ga and the other suffixed variants"
    page: "pp. 2-3, 318"
    reading: "Page 2 calls Ga a variant of G, page 3 lists it under the suffix -a: soilKey reads Ga, Ea and ga as G, E and g with the feature a, and the V variants Vk, Vy, Vs, VNa, VSa and Vg as V with features (Na and Sa are features only after V), so that the code stays the listed one and the data identification decides the variant. Go and Gr, Fox and Fhy, the five kinds of OX, Mma and Marg, and the O sub-horizons of Annex 1 (OLn, OLv, OLt, OFr, OFm, OHr, OHf) are codes of their own, with the listed code as their base (Hugo, 2026-11-02)."
  - topic: "The frozen mark"
    page: "pp. 139-140"
    reading: "The cryosols chapter writes a frozen horizon -*: soilKey reads * as a suffix of any horizon (Jp*, H*), and -* written alone in a sequence (H and -*, p. 140) as the mark of a horizon the book does not name (Hugo, 2026-11-02)."
  - topic: "Transitions written without the hyphen"
    page: "pp. 3, 127, 225-227"
    reading: "The book writes its transitions with a hyphen (A-S, S-C, B-C, C-M, Z-S) and sometimes without (BC in the luvisols, ACk and AS in the chernosols). A designation that is no code is read as a transition when it is one of the letters A, B, C, E or S followed by a code of the families A, B, C, E, S, M, R, D or Z (BC, AS, ACk, CM); B is read only in transitions. BTG, CG or SG are not transitions: reductic characters dominate and are not written so (p. 280) (Hugo, 2026-11-02)."
  - topic: "Roman numerals"
    page: "pp. 4, 91, 234"
    reading: "A Roman numeral and a space before a code mark a lithological discontinuity (II S, III RT). Written without the space (IIRT, p. 234), II to IX are read so, but not V and X, which are codes (VSa is a vertic horizon, X a peyric one); an Arabic numeral 2 to 9 run into a code, as the FAO writes it, is read so too, with a note. A numeral written alone (Z/II, JZ/Z/II, p. 91, where the buried horizons are named only in words) is a lithological layer with no horizon written (Hugo, 2026-11-02)."
  - topic: "Old codes"
    page: "pp. 1, 14"
    reading: "Ahs, FEm and FEmp are read as Aso, Fem and Femp in any profile read in the RP notation, with a note, and count as symbols only the RP writes (they are the RP of 1995); their presence makes FE the ferric Fe, as the default says. The lithosols sequence of p. 219 writes FEm, which is read as Fem. Ap is read as L (formerly Ap, p. 14) in a profile in the RP notation, but is no sign of the notation, since the CPCS and the FAO write it (Hugo, 2026-11-02)."
  - topic: "The classes of symbols for the recognition"
    page: "pp. 1-5"
    reading: "Besides the strong and likely symbols of Q9: strong also Fox and Fhy, the kinds of OX (OXal, OXfl, OXfr, OXba, OXti), Mma and Marg, the O sub-horizons of Annex 1, J, Js or Jp before a material, L before the A, E, S, O, H, BT and BP horizons (LH and LO with LA, LE, LS, LBT, LBP; L is no prefix before F, C, R, M or D), the suffixes no other notation writes (nod, noz, zo, cra, cri, do, sch, si, vo), -ho on Aho, Acaho, Sho, Zho, THho and Xho with nothing after it, E&BT and a transition or juxtaposition with a part that is a sign itself; likely also Mt, TH, Na and Sa written alone, -ho anywhere else (Ahoc) and the frozen *; ND is likely, not strong, since databases write ND for not determined. Two likely symbols are two kinds (Hf and Hm, K and Cca), not one written twice or with other suffixes (Cca and II Cca, BTg and BTgd), so that a Canadian profile with Cca and Ccak is not read as the RP (Hugo, 2026-11-02)."
  - topic: "The CPCS A2 used as an E"
    page: "pp. 4, 393"
    reading: "The A2 of the CPCS is an E, the A2 of the RP the second sub-horizon of an A. An A2 counts as a symbol only the CPCS writes when it carries a suffix after the digit (A2g: the RP writes the digits last) or lies directly over a B of the CPCS ((B), B, B2, Bt, but not BT or BP); otherwise it is ambiguous (Hugo, 2026-11-02)."
  - topic: "The sign of the Russian notation"
    page: "-"
    reading: "A profile has a sign of the Russian notation when the Russian reader (0.9.335) recognises it with no declaration: an index or a sign only the Russian notation of 2008 writes (Hugo, 2026-11-02)."
  - topic: "The hints of other notations"
    page: "pp. 14, 18, 20-21, 393"
    reading: "Annex 6 is read through soilKey's patterns on the CPCS symbol (A1 and its sub-horizons A11, A12; Bt with or without g, x, d; (B) with v or Ca; Cca or Ca on a C ...), the first row that matches, with -g giving the feature g or the horizon g on any row; an A0 with neither F nor H gives OL, OF or OH, in brackets. The slips of the table (BTfe, FSj, Ha under A1) stay in the hints, noted. The FAO letters give the hints of soilKey's table in horizons.yaml (Oi OL, Oe OF, Oa OH; Hi, He, Ha Hf, Hm, Hs; Ap L, LA, LE, LS; Bt BT or FSt; Bw the S horizons; Bh BPh, Bs BPs; Bk K, Kc; Bkm Km; Bqm Sim; Bsm Femp; Bss V or SV; Bn NaBT or NaS; Ck Ck or K; Cr and Br G or Gr; L Mli ...), and the features b, g, x, y, cry and the frozen *. In a profile the CPCS reader recognises, Annex 6 comes first, otherwise the FAO letters; the other table when the first gives nothing (Hugo, 2026-11-02)."
  - topic: "Writings of the sequences"
    page: "pp. 4, 342, 352"
    reading: "A sequence of the book is read with its horizons separated by '/', the alternatives of one position by '|' (the book's ou) and an optional horizon in parentheses; the parentheses of the table of humus forms (discontinuous horizons, p. 352) are read as optional, and its '//' (a discontinuity between O and A) as a mark between two horizons, not a horizon. A '/' inside one designation (BT1/BT2) reads as parts of one horizon, or as a transition between two (Hugo, 2026-11-02)."
  - topic: "Text that is not UTF-8"
    page: "-"
    reading: "A designation (or a declaration) that is not valid UTF-8 is read as Windows-1252, else Latin-1, the code pages of most French files (the eszett of BTß, the en dash); BTβ, with a Greek beta, and BTẞ, with a capital eszett, are BTß; the capital Π and pi before a capital are the paleo π; the thin and narrow spaces are spaces (Hugo, 2026-11-02)."
  - topic: "The fixes of the review"
    page: "pp. 3-5, 90-94, 139, 229, 296, 315, 393"
    reading: "V and X written alone are codes, not Roman numerals (SV/V, O/X). Ap read as L inside a transition, a juxtaposition or a '/' (Ap/C) is no sign of the notation and no RP 1995: only Ahs, FEm and FEmp are. A juxtaposition is a sign only as E&BT (Ea&BTg ...) or with a part that is one, so L&F and F&H are none. A prefix written apart is joined to its master (Na BT, Sa A, p. 296); '+' between two horizons is a juxtaposition (E + A, p. 315; A + E, p. 229). Sub-horizons are numbered from 1: A0, A00, BT0 and S01 are no RP writing, and A00 keeps its Annex 6 hint OL. Cs is C with -s, not a CPCS symbol. A transition keeps its sub-horizon digits and the features of each part (Hugo, 2026-11-02)."
  - topic: "The FAO and USDA symbols beside an RP symbol"
    page: "pp. 1-5"
    reading: "A designation the RP never writes and the FAO or the USDA does, beside a symbol only the RP writes, leaves the notation undecided, as a CPCS or a Russian symbol does: a B with a lower-case suffix (Bw, Bs, Bg, Bhs, Bt; the RP writes B only in transitions such as BC), Oh, Oi, Oe, Oa, Cr, AB or BA (the RP transitions A-S, AS and BC are no FAO symbols), and an Arabic numeral of a lithological discontinuity (2Cg, 3Bt). With no RP symbol the profile is simply not in the RP notation (Hugo's decision 1) (Hugo, 2026-11-02)."
  - topic: "Profiles written all in capitals"
    page: "pp. 1-5"
    reading: "In a profile where every designation is written in capitals, the case of the letters is lost (OF and Of, OH and Oh, BT and Bt are no longer told apart). The designations an upper-cased FAO (2006), USDA or Canadian table also writes stop counting as signs: one master (O, H, A, E, B, C, L, R, F, W, I) or a transition (AB, BC, LF, FH, LFH ...) with only the suffix letters that master takes in those notations (the list upper_fao of horizons.yaml), and OL as named, so OH, OF, OL, OI, OE, OA, OM, AH, AP, AE, AG, BT, BTG, BW, BS, BC, CK, CG, CR, HF, LH and LFH. The codes only the RP writes in capitals still count: LA, LE, LS, LO, LBT, LBP, SV, FS, OX, RT, FE, BP, BPH, ND (likely), TH, SCA, KC, HM ... So OH/AH/E/BT/C is not the RP, and LA/BT, SV/V, A/FE/C and the ND/OX sequences are. A profile left unrecognised only for this reason has the status capitals. This refines decision 2, which first let only a declaration recognise a profile in capitals and so lost 48 of the 308 sequences of the book (Hugo's decision 2, refined) (Hugo, 2026-11-02)."
  - topic: "The redox horizon written alone"
    page: "p. 21"
    reading: "A lone lower-case g, the redox horizon written alone, is a symbol the RP alone usually writes (likely): with a second kind (Sg, Cca, K ...) it recognises the notation (Hugo's decision 3) (Hugo, 2026-11-02)."
  - topic: "The declaration by prefix"
    page: "-"
    reading: "A value of site$designation_system that starts with rp, referentiel or afes, once lower-cased, the accents folded and the spaces and punctuation dropped, declares the RP notation (AFES 2009, RP08, referentiel 2008, Référentiel pédologique français); rp1995 or rp95 (RP 1995, RP95), or 1995 after referentiel or afes, the RP of 1995, where FE is the ferric Fe. The Russian reader reads its declarations by the same rule: a value that starts with kidpr, ru, rfg or rsc (Russian 2008, RU-2008, kidpr 2008) declares the Russian notation; nothing else in it changes (Hugo's decision 4) (Hugo, 2026-11-02)."
  # --- the reference horizons on the data (0.9.343) -------------------------------
  - topic: "The fixed order of tests"
    page: "pp. XII, 6, 280"
    reading: "The RP has no key to its horizons; soilKey reads them by a fixed order of tests of its own, from the book's order of presentation (p. 6) and its statements of dominance: layers and materials, holorganic horizons, coarse elements, G, the indurated and accumulation horizons, the surface A horizons, the subsurface horizons, then the features of every layer and the overlays L, Na and Sa. The first test that holds gives the code; the other codes that hold or stay undecided go to the candidates; a missing field descriptor is read through a soilKey WRB diagnostic, flagged, never the faux amis of p. 392 (Q10) (Hugo, 2026-11-02)."
  - topic: "Undecided tests in the order"
    page: "pp. 6, 280"
    reading: "An undecided test before the one that holds in the same step leaves the layer undecided between the two (an A with no S/CEC: Aci, Amg or A); two undecided tests in a step with none holding stop it (H and O with no water regime, Q19); an undecided test alone in its step does not stop the order and goes to the candidates. G is the exception: since it dominates every other character of the layer (p. 280), an undecided G (a grey matrix with mottles and no location) leaves the layer undecided against the code read after it, never that code alone (Hugo, 2026-11-02)."
  - topic: "The designation of another notation narrows the candidates"
    page: "pp. 393; Q9"
    reading: "When the data leave a layer undecided, the RP codes that its CPCS or FAO designation gives (Annex 6, the FAO letters) keep only the candidates of those codes or families; when one is left, the layer takes it, flagged (a Bw with no structure recorded, undecided between S and C, is an S). A candidate of the G family is never narrowed away (an FAO or CPCS g keeps it), and H is never taken so: without a carbon or an ash measurement, only the RP notation gives an H (Q19). A transition that starts with B, E or C (BA) is no A designation. OL, OF and OH written in a profile not read in the RP notation (written in capitals) still name the litter, fragmentation and humified O horizons, and an OL is still left out of the depths. A designation also reads as an organic, a mineral, a ploughed or a rock layer where the data say nothing, flagged; a mineral designation (Ap, Bt) with no carbon makes the layer mineral, never an H or O candidate; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "A reductic matrix"
    page: "pp. 22, 280"
    reading: "G needs a reduced matrix (moist colour): a bluish or greenish hue (GY, G, BG, B, PB) or neutral (value 4 or more, or a gley hue at any value); in another hue, chroma 2 or less with value 4 or more and a measured sign of water at the layer: a positive dipyridyl test, water saturation over 30 days, the water table recorded at the layer or above the surface (water above it, a subaqueous or tidally flooded site). The drainage class alone never makes it, so a grey 10YR 5/1 C of a poorly drained site with nothing else recorded is no G. An A is reductic (AG) only in a bluish or greenish hue. Gr: redox features 5 % or less (the uniform colour over 90 % of Q17, read with at most 5 % of redox features); 5-10 % with no location leaves Go and g undecided; Go: segregations at the voids, roots or ped faces; inside the peds the layer is a g (default 18); revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "Holorganic layers"
    page: "pp. 7-9, 205; Q19, default 14"
    reading: "A layer is holorganic by its loss on ignition (50 % or more, ash under 50 %), else by organic carbon 30 +/- 5 %; a carbon that contradicts the loss on ignition (30 % LOI with 35 % carbon) is flagged and the loss on ignition decides, and no A is read over 30 % carbon. The 17 g/100 g of an undecided OH-A transition is not used, since the data route has no morphology to call it undecided. With no carbon, ash or particle size, a designation of an organic horizon in another notation (Oi, Oe, Oa, A0, OL, OF, OH) reads it as organic and gives the kind of O, flagged, and a mineral designation reads it as mineral; the fine organic matter, else 100 minus the plant residues (flagged), gives OL under 10 %, OFr under 30, OFm 30-70, OHr 70-90, OHf over 90. OHta: an OH recorded greasy (sensitivity or wet consistence), Ca + Mg over 80 % of the CEC and pH 5-7. Ha: an H on an artificially drained site; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "The surface A horizons"
    page: "pp. 9-13"
    reading: "The A family is read only in the surface run: the first mineral layer, and the layers under a layer of A material that continue the A (an A or L designation of another notation, else organic carbon over 1 % with a moist value of 4 or less). A layer that continues the run is read by the subsurface tests too, and when one of them holds (other than C or Jp) the layer is undecided between the A and that code (an A2 of 1.5 % carbon with a blocky structure: A or S). Its A material: organic carbon 0.5 % or more (p. 10) and never over 30 %, not a bleached layer (moist value 5 or more and chroma 2 or less under 2 % carbon), and under an O horizon not a light layer (moist value 5 or more) under 1 % carbon, which is read as an E; no carbon recorded, an A designation or a moist value of 4 or less darker than the layer below, flagged. Under 0.5 % with a weak structure or none the surface layer is Js; Jp under a Js, or under an A or LA in a young deposit (layer_origin fluvic, marine, aeolian, colluvic, tephric, solimovic), with traces of carbon (under 0.3 %) and a weak structure or none, before the S and the C. Ae is an A directly above an E, never on a ploughed layer (p. 11: under forest or spontaneous vegetation); revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "Ach, Aso, An"
    page: "pp. 12-13, 126, 193, 361"
    reading: "Ach: moist value 3.5 or less (the chapter, p. 126, over the under 3.5 of p. 12: Q17) and chroma 2 or less; organic carbon 3 % or more in the top 10 cm of the A run (the 30 g/kg the book gives for a silty-clay texture, read for every texture); darker than a mineral layer below the run (no Ach over a rock); a gradual decrease of the carbon (a gradual or diffuse lower boundary, or a run of layers whose carbon keeps at least 0.4 of the one above, or 0.6 % carbon in the layer below); CaCO3 under 5 %, pH 6.0-8.3; the fine biological structure, when not recorded, by soilKey's chernic() alone, flagged. Aso, outside a reference: the list of p. 13 (value and chroma under 4, their sum under 6) is the test and the grisols reading of p. 193 (value under 4.5, chroma under 4, not 4/3) only evidence, so the imperfect case of Q17 cannot arise here; a well aerated A (p. 13): no functional redox features and no reduced matrix; S/CEC 50-80 % and pH 5.5-6.5 are not tested under cultivation (LAso); the structure, when not recorded, by umbric_horizon(), never sombric(). An: noir (value + chroma 4 or less), organic carbon 8 +/- 2 % or more, and a prolonged waterlogging (saturation, or a sign of water excess); revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "Carbonates and the calcic and magnesic horizons"
    page: "pp. 12-16; default 17"
    reading: "A slight (very weak) cold effervescence is not generalised: with no molar ratio it leaves calcite against dolomite open; caco3_pct is read as the CaCO3 of the molar CaCO3/MgCO3 ratio when mgco3_pct is recorded; with no carbonate recorded, a pH in water under 6.5 reads not carbonated; a calcareous layer with no S/CEC is read saturated (the over 95 % of Sca and Aca). Ca/Mg between 2 and 5 is the calcimagnesian variant of Aci and Sci: the code holds, marked imperfect (pp. 12, 16) (Hugo, 2026-11-02)."
  - topic: "K without the carbonate forms"
    page: "p. 20"
    reading: "The secondary carbonates over 15 % of the volume give K, Kc (continuous, not indurated: cemented or masses) or Km (indurated). Not recorded, soilKey's petrocalcic() and calcic() stand in, flagged, only for an accumulation: not in the surface layer and with 5 points of CaCO3 more than every layer below, so that a calcareous A or a C in a chalk is not a K (Hugo, 2026-11-02)."
  - topic: "BT and E on the data"
    page: "pp. 14-18"
    reading: "BT: more clay than the mineral layers above read as the increase of the WRB argic horizon over the least clay among them (3 points under 15 % clay, 1.2 times from 15 to 40 %, 8 points from 40 %; at the surface, against the layer below), 15 cm with the adjacent layers that have the increase (or clay bands of 15 cm in all), and clay films common or many for the many coatings on most surfaces; not recorded, argic() stands in, flagged, but not on a layer with no peds. When FS holds as well the layer is FS with the feature t (FSt, p. 180). BTss: a BT under a BT, darker (value 4 or less), with more clay and twice its carbon, on a carbonate rock (an R, M or D designation or CaCO3 40 % or more). BTd: the degradation_form or tongues over 15 % and 5 mm or more; not recorded, retic_properties() or albeluvic_glossae(). E: lighter than the layer below (a value one more, or a chroma one less at an equal or higher value) and depleted (more clay below, a BP below, or bleached: moist value 5 or more and chroma 2 or less), with less carbon and no more clay than the layer above and clay films few or none; above a rock or a coarse layer with no fine earth only a bleached layer is an E; no colour, albic() stands in; the feature a by uncoated grains 50 % or more, a moist 6/2 or paler, or albic(); h by value 4 or less, chroma 2 or less, carbon 1 % or more; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "BP on the data"
    page: "p. 19"
    reading: "BP: a moist hue of 7.5YR or redder and more Alox + 1/2 Feox than the layer above; with no oxalate, soilKey's spodic() stands in, flagged, and while it is undecided a BP is possible only under a bleached layer (chroma 2 or less) or with more carbon than the layer above; clay films common or many exclude it; most of the carbon extractable by pyrophosphate when c_pyro_pct is recorded. BPh above another BP with more carbon, BPs under one with less (no number in the book) (Hugo, 2026-11-02)."
  - topic: "The vertic horizons"
    page: "pp. 22-23, 318"
    reading: "V: clay 40 % or more and slickensides common or more for many slickensides; SV, below the surface: clay 40 % or more with cracks of 1 cm or more, a polygonal network or a prismatic secondary structure; Av: a surface A with clay 40 % or more and slickensides or cracks, written as A with the feature v; not recorded, vertic_horizon() and vertic_properties() stand in. Slickensides few on another horizon make the feature v (Hugo, 2026-11-02)."
  - topic: "The intertropical horizons"
    page: "pp. 149-155, 170-172; Q18"
    reading: "Declared by the new site attribute intertropical, else a Koppen climate of group A or a latitude between the tropics (23.44 degrees); neither recorded leaves F, OX, RT, ND, FE, OXm and OXc undecided where their data hold. F: hue 10R to 10YR, value and chroma 2-8, clay over 12 % (clay_pct for the mineralogical clay), CEC 5-16 per kg of clay (else under 16 +/- 1 per kg of soil), pH 3.5-7, Ki under 2.2 (else ferralic()); Fhy and Fox by halloysite 10-50 % and oxides 30 % or more. OX: oxides over 60 % of the clay (else Ki under 0.5, else ferralic()), CEC under 5 per kg of clay, pH in water 5.5-6.5 and the pH KCl at or above it. RT: two or more variegated colours, or plinthite 15 % or more with plinthic(). FE: 2.5YR to 7.5YR, value 4-7, chroma 6-8, carbon under 0.3 %, S/CEC under 50 %, bases under 5 cmol+/kg, total Fe 12 % or less when recorded, loose, pH 6.0-6.5. In the domain the indurated sesquioxide accumulations are OXm (indurated) and OXc (cemented less), not Fem; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "Sn, FS, Sp, Sal and the andosol horizons"
    page: "pp. 15-17, 76-80, 150, 179-180"
    reading: "Sn: clay 50-80 %, pressure faces common or many (else nitic_horizon()), halloysite over 50 % or clay_mineralogy halloysite, else Ki under 2.2 and Kr under 1.8 (map 3), clay films few or none, CEC 8-30. FS by the field route (map 2): 5YR or redder with chroma over 3.5, an angular polyhedral structure moderate or strong, the Fe ratios when recorded; a kaolinitic clay excludes it. Sp: clay over 45 %, not carbonated, a prismatic or coarse polyhedral structure (undecided without it). Sal: exchangeable Al from al_kcl_cmol, else al_cmol. Sci: pH over 6.5. The andosol horizons are tested only where the andosol domain opens: soilKey's andic or vitric properties hold in the layer, or volcanic material is recorded and they are undecided (default 15); an oxalate measurement alone does not open it, and a measured Alox + 1/2 Feox under 2 % closes it; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "Layers and materials"
    page: "pp. 26-28, 308"
    reading: "R: an FAO R, or a very or extremely hard layer with no fine earth recorded; a CPCS R (R, M or D in Annex 6) by its rupture resistance (very or extremely hard R, otherwise M), else continuous_rock(); M with no designation: a soft to hard (not very hard) layer with no fine earth and its carbonates recorded (a chalk, a marl), or an FAO Cr; D: coarse elements over 60 % by weight with no pedogenic sign, unless the designation names a horizon. P: a temperature under 0 C; a permafrost frost regime leaves the layers from 30 cm undecided. TH: total S 0.75 % or more (a sulfidic S of 0.75 % as a lower bound) and waterlogged (saturation, a reduced matrix or a tidal site), never with jarosite or a pH under 4 (an oxidised, sulfated layer: U). Z: anthropic_material, else artefacts 50 % or more (Ztc when the industrial ones are half); a Z at the surface with 0.5 % carbon is JZ. Mli: a limnic layer_origin in a profile with holorganic layers. Mt: a mineral layer over or between holorganic layers; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "Coarse elements not recorded"
    page: "pp. 24, 249; Q11"
    reading: "Coarse elements are a field observation: not recorded by weight, by size class or by volume, the layer has none (no X, no D). The volume band of Q11 applies only when the volume is recorded (Hugo, 2026-11-02)."
  - topic: "Gypsum, silica and iron"
    page: "pp. 20-21, 197-198"
    reading: "Y: gypsum (caso4_pct) 15 % or more; Ym indurated; Ys with its top within 10 +/- 5 cm of the datum or under a Ym, gypsum 25 % or more and CaCO3 under 20 %; Yp deeper with CaCO3 under 40 %; otherwise Y with Ys and Yp as its kinds. Si: durinodes or duripan 10 % or more, or a duripan or silcrete pan; Sim indurated with no common roots (else petroduric()). Fe: ferric nodules 15 % or more, or a ferricrete or ironstone pan (with only plinthite recorded, ferric() stands in); when a BT or an FE holds as well and the nodules are under 40 %, the layer is that horizon with the feature cn (BTcn, FEcn); Fem indurated; Femp a thin ironpan or a placic pan, or an indurated layer under 1 cm; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "The overlays L, Na and Sa"
    page: "pp. 14, 24-25"
    reading: "L: an Ap or an FAO p, the depth of mechanical mixing recorded at the site, or a cultivated land use (crops, arable, vineyard) for the first mineral layer, flagged; a ploughed layer with no other code is L. Sa: EC of 15 dS/m or more, or 8 or more in the alkaline series, the pH in water standing for the paste pH; between 8 and 15 with no pH, undecided; with no EC and no sign of salts (halite, a salt crust, a salinised site), no Sa. Na: a columnar, prismatic or coarse structure recorded, or a massive one with 1 cmol+/kg of exchangeable Na or more (not recorded, absent), Na 15 % or more of the bases, no salic horizon; under 15 % with Mg over Ca, undecided (p. 24); never undecided on a layer with no degraded structure; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "The features"
    page: "pp. 3-5, 21, 281"
    reading: "-g: redox features over 5 % (Q17), functional unless recorded relict (Q13), never on a G; colours of mottles with no share, stagnic_properties() stands in. -ho: organic carbon 8 +/- 2 to 30 +/- 5 % in a mineral layer; -k: secondary carbonates recorded on a layer that is no K; -t: clay films few or more on S, C and FS (the hosts the book lists); -v: slickensides few or more; -x: a fragipan; -y: gypsum 5 % or more or visible; -cn: ferric and manganiferous nodules 15 % or more, only on BT and FE (BTcn, FEcn); -j: 7.5YR to 2.5Y, chroma 6 or more, an angular (not subangular) structure, with Fe-Mn signs, only on S, Sci and BT (Sj, Scij, BTj); -cry: cryoturbation; -nod: nodules 30-60 % by weight; -c: indurated, on a code that does not say it; -b: buried, by the designation; -ca: calcareous C, M, D or R; -a on G: uncoated grains 50 % or more, or 7/1 or paler. -h only where a chapter gives the norm: Sca with over 1 % carbon is Scah; revised after the review of 2026-11-02 (Hugo, 2026-11-02)."
  - topic: "The biomacrostructured A without biogenic aggregates recorded"
    page: "pp. 10-12"
    reading: "Without biogenic_aggregates_pct, a crumb or granular structure with a recorded biological activity (worm holes, burrows, earthworms or a mull) reads the biomacrostructured A of Aca, Ado, Aci and Ach, flagged; a polyhedral, massive or any other structure reads the A that is not biomacrostructured; a crumb or granular structure with no activity recorded, or no structure recorded, stays undecided (d3) (Hugo, 2026-11-02)."
  # --- the attachment and the references of the first nine GER (0.9.346) ---------------
  - topic: "One main name and the candidates"
    page: "pp. XIV, XVII-XVIII"
    reading: "classify_rp2008() tests every reference every time and gives one main name, a reference or a double the book prescribes, marked a convention of soilKey, with the slot candidates holding every reference that may attach the solum, its degree and the criteria that fail, pass only within tolerance or are undecided; with none, [non rattaché] and the three nearest references, by the number of failed criteria then their size in tolerance units (Q3) (Hugo, 2026-11-02)."
  - topic: "The tolerance band is imperfect"
    page: "pp. XVII, 64-65"
    reading: "A value beyond a printed threshold but within its tolerance of p. 64 attaches the solum imperfectly, never simply; the thresholds the table does not list are strict (Q4, Q5) (Hugo, 2026-11-02)."
  - topic: "Precedence and doubles"
    page: "pp. 66-68, XVIII"
    reading: "Among the references that attach, the book's explicit statements first (precedence.yaml, each with its page), then the degree, then the order of the rapid key, entries 1 to 10 then 11 and 12, the grisols placed in 7c; a double only for the pairs the book prescribes or suggests (doubles.yaml), in the order of its example (Q6, Q7) (Hugo, 2026-11-02)."
  - topic: "Colluvial origin, anthropic materials, the carbonate reserve"
    page: "pp. 91-94, 107, 116, 132"
    reading: "A colluviosol only with colluvial material recorded over 50 cm, another reference attaching too taking the name (Q14); the anthroposols by their materials Z and the recorded history, the transformés never inferred (Q15); a calcisol against a brunisol eutrique saturé by a positive proof of carbonate, else the brunisol in the name and the calcisol among the candidates (Q16) (Hugo, 2026-11-02)."
  - topic: "The codes of the reference files"
    page: "pp. 4, 104, 111"
    reading: "In the sequences and side tests of the references a code that heads a family stands for the family (A for every A horizon, S for every structural horizon, BP, BT, G, H, K, O, Z ...), any other code for itself (Sca, Aci); lower-case letters after it are features it must carry in the side tests (Ck, a C with secondary carbonates) and are expected, not tested, in the sequences; the L of a ploughed horizon does not change its code (LAca is an Aca, LA|LS of the brunisols an A or an S). The Av and Anod of the data identification are read as an A with v or nod, as the notation reads them (Hugo, 2026-11-03)."
  - topic: "The sequences are open"
    page: "pp. 70-140"
    reading: "A sequence of the book is matched on the horizons it names and their order only: the other horizons are left out, and the parent material written last (C, M, R, D) is optional, since a description often stops above it; the forbidden horizons are side tests where the chapter writes them (the vitrandosols forbid And, Snd, Alu and Slu under their Avi, an Avi over a silandic or aluandic set being épivitrique, the review's D2), and the alternatives of a reference compete (a horizon of one alternative blocks another that does not name it) (Hugo, 2026-11-03)."
  - topic: "A horizon read only within tolerance"
    page: "p. 64"
    reading: "A layer the horizon identification reads as a code only within the tolerance of p. 64 counts for that code in the tolerant pass of a test that needs it, and in the strict pass as the next code its identification lists (a Sci at S/CEC 77 % is strictly an S): the reference is then imperfect; for a test that forbids the code it counts as that code in both passes (Hugo, 2026-11-03)."
  - topic: "Depths, thicknesses and windows"
    page: "pp. 64-65"
    reading: "A horizon within X cm starts above X cm from the datum; a minimum thickness or depth printed as more than X is read as X or more, a maximum as X or less (the tolerance applies around X); a thickness from the surface is the run of the set from the first layer that is not a holorganic O, a cover allowed only where the chapter allows one (the epivitric Avi under 50 cm); an undecided layer that could belong to the set widens the upper bound and leaves the test undecided when it decides it (Hugo, 2026-11-03)."
  - topic: "The imperfect cases of the chapters"
    page: "pp. 82, 95, 101, 111-113, 127"
    reading: "When the tests of a reference fail, the imperfect cases its chapter names are tried (leptique, pachique, lithique, rédoxique, insaturé en surface), and also when the reference is imperfect within the tolerance of p. 64: a case whose test holds strictly then names it (calcosol leptique at [A + Sca] 32 cm, rendosol pachique at Aca 38 cm, arénosol rédoxique with -g at 70 cm; the review's D1); its qualifier is written after the reference, the name stating what does not fit (p. XVII); the depth windows of Ck or K and the S/CEC ranges of the chernosols make the attachment imperfect with no qualifier (default 21) (Hugo, 2026-11-03)."
  - topic: "The GER of later releases"
    page: "pp. 66-68, 146-326"
    reading: "The references of the GER of later releases are not tested (until 0.9.351, when 18 references of 6 GER were left; since 0.9.352 every GER is implemented and no signpost is left). Each GER has a signpost in key.yaml, the reference horizons or materials of its chapter (M, D or C within 10 cm for the régosols, V or SV within 100 cm for the vertisols, Sa or Na within 60 cm for the salisols and sodisols, TH or U within 60 cm for the thiosols and sulfatosols ...); a profile that shows them, or may, gets the GER among the candidates, undecided, not implemented yet, and the name is provisional when the GER ranks before it by the rapid key: no profile is attached elsewhere without saying so (Hugo, 2026-11-03)."
  - topic: "Alocrisols typiques and humiques"
    page: "pp. 70-73"
    reading: "The humiques have a hemiorganic first A (8 g/100 g organic carbon or more, +/- 2) over a Salh (the first Sal with 2 g/100 g or more); the typiques an A that is not hemiorganic. Both need a Sal of 10 cm or more (+/- 5; thinner, a rankosol) and no BP, BT, Alu or Slu (Hugo, 2026-11-03)."
  - topic: "Andosols: eutric silandosols and the perhydric ones"
    page: "pp. 81-82"
    reading: "Eutric: every And or Snd layer within 30 cm with S/CEC 50 % or more, or every one with a sum of bases over 15 cmol+/kg; dystric otherwise. Perhydric: water at 1500 kPa of the undried sample 100 % or more over 35 cm or more (+/- 5) within 100 cm in the And and Snd (Alu and Slu); the perhydric references take the name before the eutric, dystric and haplic ones when that test holds (precedence.yaml, the review's D2 and D3), and the aluandosols hapliques no longer test it; the thixotropy and the irreversible dehydration of 70 % confirm it and are not tested; the leptique case needs the set thinner than 30 cm (R5: a thick And starting under 50 cm is no leptique, p. 83) (Hugo, 2026-11-03)."
  - topic: "Anthroposols artificiels and construits"
    page: "pp. 91-94"
    reading: "A layer written Z, or with anthropic_material recorded, is of that material, its share over 50 % unless anthropic_material_pct or artefacts_pct records less; the artificiels need a technological material dominant (Ztc, or a Z of no stated kind; an earthy Ztr or a holorganic ZO makes none, p. 92; the review's R3); both the artificiels (over 50 cm) and the construits (Ztc over 50 cm, the figure of p. 93; leptique from 30 to 50 cm, soilKey's choice as for the artificiels and reconstitués, p. 95) attach a technological material, and the artificiels, first in the book's order, take the name unless the construction is recorded in rp_anthropic_history, which also keeps a construit leptique first (Hugo, 2026-11-03)."
  - topic: "Anthroposols transformés: the depth"
    page: "p. 91"
    reading: "The transformation over 50 cm (+/- 10) is read in site$mechanical_mixing_depth_cm; a history recorded with no depth leaves the reference undecided; a construction recorded there is no transformation (Hugo, 2026-11-03)."
  - topic: "Arénosols: the 120 cm and the imperfect cases"
    page: "pp. 99-101"
    reading: "Sand over 65 %, clay under 12.5 % and coarse elements under 60 % by weight in every mineral layer within 120 cm (the window 100 cm in the tolerant pass), no R or D within 120 cm, no G, g or -g within 80 cm (+/- 15); an Ach, And, Alu, Avi, Aso or Sal anywhere excludes the arénosol (Hugo's decision 3); rédoxique with -g from 50 cm; leptique with the sandy conditions within 50 cm and a non-sandy layer or a C, M, D or R appearing between 50 and 120 cm; lithique with R between 10 and 50 cm; before the rendosols, calcosols and dolomitosols only when the A is not biomacrostructured, excluded by them when it is (p. 116; the review's D9) (Hugo, 2026-11-03)."
  - topic: "Brunisols: the S/CEC, the dolomitic horizons and the redox features"
    page: "pp. 103-107"
    reading: "S/CEC of the S horizon read as the mean of the S layers weighted by their thickness, over 50 % eutric and under 50 % dystric as printed (at exactly 50 % both imperfect, the eutrique named by the book's order); the sequences A-S, or LS-S under crops; Ado and Sdo forbidden like Aca and Sca (the S is never calcareous, p. 103); the forbidden horizons read in the first material only, the first lithological unit of 50 cm or more (A-S-IISca-IIRca is a brunisol eutrique bathycarbonaté bilithique, p. 117; the review's D6); a G within 50 cm fails the brunisols (a réductisol typique), a -g within 50 cm does not: the double brunisol-rédoxisol and the rédoxisols come with their GER, and the signpost of the réductisols and rédoxisols makes the name provisional (Hugo, 2026-11-03)."
  - topic: "The carbonate reserve (Q16)"
    page: "pp. 107, 112, 116"
    reading: "A positive proof of carbonate: a C, M, R, D, K, Sca or Sdo with CaCO3 or an effervescence recorded, a ca or do feature (Cca, Rca, Rdo), a calcareous rock_origin or parent_material, read in a closed vocabulary of whole words (limestone, chalk, marl, dolomite, calcareous, calcrete, travertine, calcaire, craie, marne, dolomie, falun ...) and not when denied (non-calcareous, decalcified, décarbonaté, carbonate-free; a tuff is no tufa; the review's D7); the coarse elements count through these, soilKey recording no lithology of them (Hugo, 2026-11-03)."
  - topic: "Magnésisols against brunisols eutriques"
    page: "pp. 68, 109, 113"
    reading: "A solum whose complex is dominated by magnesium (Amg, Smg: Ca/Mg under 2) attaches to the magnésisols before the brunisols eutriques, the rapid key keeping the brunisols for solums not dominated by calcium (entry 11) and the reserve of Q16 separating only the calcisols (Hugo, 2026-11-03)."
  - topic: "Calcosols, calcisols and their double"
    page: "pp. 111-113, 122"
    reading: "[A + Sca] counts the Sci of the decarbonated calcosols; [Aci + Sci] / Sca under 1.5 lets the calcosol attach, over 0.67 the calcisol, so that from 0.67 to 1.5 both attach and the double calcisol-calcosol is written; a calcarisol (Kc or Km within 35 cm) takes the name before the other six references of its GER (the table of p. 122) only when it attaches strictly (a Km within tolerance is a calcosol pétrocalcarique, p. 113; the review's D9); the scope of the GER excludes a V or SV within 100 cm only (bathyvertique deeper, p. 116; D4) and a Ys or Ym within 10 cm (a gypsosol); the order of the double calcosol-anthroposol transformé is that of p. 91 (p. 97 writes the other) (Hugo, 2026-11-03)."
  - topic: "Chernosols: vermic, clinohumic, the index"
    page: "pp. 125-127"
    reading: "The vermic character is evidence only, the biomacrostructured Ach standing for it; clinohumic: 0.6 % organic carbon or more in an Ach, S or BT layer extending below 40 cm; the Ach of 40 cm or more strict (Q5), a cultivated LAh or LAch counting for it (p. 127; the review's R2); the texture differentiation index is the clay of the most clayey S or BT over the clay of the Ach (the mean weighted by thickness), 1.3 itself read as typiques; the typiques forbid only a BT directly under the Ach or a humic BTh (a deeper BT is bathyluvique, p. 128), and the mélanoluviques need over 0.6 % organic carbon in the first BT (p. 127; the review's D5) (Hugo, 2026-11-03)."
  - topic: "Cryosols: permafrost, ice and cryoturbation"
    page: "pp. 135-141"
    reading: "Besides default 21, the permafrost is absent with a recorded soil temperature regime warmer than cryic, a Koppen climate outside the polar (E) and subarctic (Dfc, Dfd, Dsc, Dsd, Dwc, Dwd) ones, or a latitude under 50 degrees with an elevation under 1500 m; a layer of ice is massive ice or ice of 50 % or more; a mineral cryosol is simple with the cryoturbation recorded (or -cry written) and imperfect when the data show the permafrost within 200 cm and record no cryoturbation either way, and then takes the name before the references of the later entries of the rapid key (Hugo's decision 1); recorded as none, it fails (Hugo, 2026-11-03)."
  # --- after the review (2026-11-03) ------------------------------------------------------
  - topic: "The first material"
    page: "pp. 61, 97, 117"
    reading: "The first material of a profile is its first lithological unit (Roman numerals) of 50 cm or more, a thinner unit above it being a cover (recouvert par, p. 61): an epianthropic Z of 30 cm over II A-S-C leaves the brunisol below; the whole profile when no numeral is written (Hugo, 2026-11-03)."
  - topic: "Undecided layers in a sequence"
    page: "-"
    reading: "When the alternatives of a reference leave its sequences undecided, soilKey completes the undecided layers with their candidates (up to 32 completions): the sequence holds when one alternative matches every completion, fails when none matches any (an A or an Slu under an Alu matches Alu-(C) or Alu-Slu either way) (Hugo, 2026-11-03)."
  - topic: "A layer of carbonates or gypsum with no carbon recorded"
    page: "pp. 7-9, 20"
    reading: "A layer with carbonates and gypsum of 50 % or more, or indurated or strongly cemented, is mineral even with no carbon, loss on ignition or particle size recorded (a calcrete Km is no holorganic layer) (Hugo, 2026-11-03)."
  - topic: "The first layer of a set under an undecided layer"
    page: "-"
    reading: "A test on the first layer of a set (the first A, the first Sal, the first BT) is undecided when an undecided layer above it could belong to the set and its value would give another verdict; it is decided when both give the same (the review's D8) (Hugo, 2026-11-03)."
  - topic: "The nearest references and the colluviosols"
    page: "pp. XVII, 132"
    reading: "When nothing attaches, the three nearest references are listed, and the colluviosols beside them when colluvial material is recorded in the profile (Hugo, 2026-11-03)."
  - topic: "The signposts of the rankosols and gypsosols"
    page: "pp. 73, 196-198"
    reading: "The signpost of the rankosols lets a Sal under 10 cm through (an alocrisol with too thin a Sal is a rankosol, p. 73; the review's R4); that of the gypsosols is a Ys or Ym starting within 20 cm (the Ys from the surface, 10 +/- 5 cm, with a margin, a signpost being no test) (Hugo, 2026-11-03)."
  - topic: "The carbon of a layer over its whole depth"
    page: "pp. 125, 127"
    reading: "The organic carbon recorded for a layer holds over its whole depth: a single Ach of 0-45 cm with 3 % carbon has 0.6 % or more below 40 cm, and the solum is clinohumic (Hugo, 2026-11-03)."
  # --- the references of part 5 (0.9.348) ------------------------------------------------
  - topic: "The intertropical domain of a profile written in the RP notation"
    page: "pp. 6, 146, 169; Q18"
    reading: "The ferrallitisols, oxydisols and ferruginosols are tested only in the intertropical domain (tropical_rp: declared, a Koppen climate of group A or a latitude between the tropics; outside, they fail). With neither the climate nor the latitude recorded, a profile that writes F, OX, RT, ND, FE, OXc or OXm in the RP notation is read as placed in the domain by its author; on the data those horizons stay undecided, and so do the references (Hugo, 2026-11-03)."
  - topic: "Ferrallitisols and oxydisols: F against OX, the hardness and the types"
    page: "pp. 157-162"
    reading: "The loose horizons are compared within 120 cm, their nodular forms included (Fnod, OXnod): an F at least as thick as the OX, or neither, a ferrallitisol (equal thicknesses a ferrallitisol); every reference forbids an FE, an E or a BT anywhere in the profile (pp. 162-163). The hardness precedence (D3) is applied when its horizon lies strictly within 120 cm: an OXm between 120 and 140 cm makes the pétroxydique imperfect, and the degree then decides (a simple nodulaire keeps the name). An OX with an OXc is a ferrallitisol duroxydique (D5), with an ND as well: the hardness precedence sets the OXc before the ND (R2). The proximal and distal types read the top of the first ND, OXm or OXc with no tolerance: under 60 cm proximal, from 80 cm distal (also beyond 120 cm when the reference attaches within tolerance), between neither (Hugo, 2026-11-03)."
  - topic: "Ferruginosols: the sequences"
    page: "pp. 173-175"
    reading: "The meubles forbid a BT and an E (the semiluviques and luviques have them); without an S under the FE they are the imperfect case of p. 173, sans horizon S, an FE over a C, an M or nothing more. The pétroxydiques need an E or a BT under an OXm or an OXc, no FE, the A optional (the tronqués, p. 175); their granite parent and the climate are reported, not tested (Hugo, 2026-11-03)."
  - topic: "Fersialsols: the A, the FSt, the carbonates and the iron"
    page: "pp. 179-182"
    reading: "The A of the sequences (Aca, Aci, A) is any A, and may be eroded: the FS decides. The FS carbonatés have the larger part of the FS thickness carbonated (CaCO3 2 % or more or an effervescence; a local effervescence is not carbonated); the calciques no FS carbonated but locally (effervescence_extent local), some carbonated but not the larger part a calcique imperfect (D3); S/CEC and Ca/Mg are the means of the FS layers weighted by thickness. The FSt the calciques and insaturés forbid is the FS with the t: on the data common or many clay films, few do not make it; an FSt with no E is an éluvique imperfect, tronqué, or a calcique or insaturé imperfect, luvique (R1). The iron release is read again at the reference: FFE over total iron 0.20 or less when measured fails it (a luvisol, p. 182), the free over total iron is evidence only (Hugo, 2026-11-03)."
  - topic: "Fluviosols: the origin, the site and the sequences"
    page: "pp. 183-189; Q14"
    reading: "The alluvial origin is an alluvial layer_origin or rock_origin in a layer starting within 50 cm, or an alluvial parent material (fluviatile, alluvial, lacustrine; a colluvial origin is none). Recorded, a terrace or an alluvial fan (terrasse, cône), or both the flooding and the groundwater recorded as none, fail the fluviosols; flooding none alone (an embanked valley) or groundwater none observed (no water seen in the pit) leaves the water table not recorded and the fluviosol provisional (D1); lit mineur, lit majeur (floodplain) and marais are read, another valley_position leaves the position undecided. The bruts need the minor bed when valley_position is recorded; a structureless surface layer (single grain, massive) is no Js (p. 25) but their raw alluvium, read as a C or a D, the C standing for their M, and no Jp lies under it (a Jp is under a Js or an A) (D2); in the typiques too a fine alluvium read or written C stands for the M (A-Jp-C). The typiques with [A + Jp] under 30 cm are the imperfect case leptique; the brunifiés read their solum of 1 m as [A + S + M] from the surface (100 cm strict, Q5). The fluviosols take the solum before the brunisols, calcosols, calcisols and arénosols by the rapid key (5a); the qualifier fluvique of these references when the water table reaches only the deep layers (p. 188) waits for the qualifiers (Hugo, 2026-11-03)."
  - topic: "Grisols: the Aso, the Eh, the BTh and BThd, the index"
    page: "pp. 192-194"
    reading: "The Aso under 30 cm (+/- 5) is the run of the A layers from the surface; the A of the sequences is the first A, an Aso, an A or an LAh (another A code, Ach, Aca or Aci, is no Aso); cultivated, an LEh at the surface over the BTh is the éluvique of p. 193. Clinohumic as the chernosols (0.6 % organic carbon below 40 cm in an A, E or BT); S/CEC under 95 % (+/- 5) in the Eh, BTh and BThd, not in a deep non-humic BT: every E, the BT written with h, and every BT starting within 50 cm (the BTh starts between 30 and 50 cm, p. 193). On the data a layer that continues the A run and reads E is an Eh when it is lighter than the layers above and below (the dry value, when recorded for the three, one more than both; else the moist value), has less clay than the layer below and a weak structure or none (p. 193); otherwise it stays undecided between A and E, its h possible (R3). A written Aso with no colour still reads its recorded S/CEC, pH and carbonates (R4). The h of BTh is not tested (the clinohumic solum stands for it), the d of BThd is the degradation of the BT (degradation_form, else the retic properties); the index of the éluviques and dégradés is the BT over the E, of the hapliques the BT over the A (Hugo, 2026-11-03)."
  - topic: "Gypsosols: the crust"
    page: "pp. 197-199"
    reading: "The pétrogypsiques have their Ym starting within 10 cm (+/- 5) and the Ys directly under it; the hapliques a Ys within 10 cm and no Ym; the Ys thickness of 20 to 50 cm and the arid climate are reported, not tested (Hugo, 2026-11-03)."
  - topic: "The parent material written last"
    page: "pp. 70-200"
    reading: "A last optional slot of parent materials ((C|M|R), (C|M|R|D)) reads one optional slot per layer, since a slot of the matcher matches a run of one code: the C, M and D in any order (an M or a D over a C, a C over an M), the R last: A-S-C-R is a brunisol (in 0.9.346 it was [non rattaché]), A-S-M-C too, Aca-Sca-C-R a calcosol (Hugo, 2026-11-03)."
  - topic: "Fersialsols carbonatés: the larger part of the FS (D3)"
    page: "p. 181"
    reading: "A fersialsol is carbonaté when the larger part of the thickness of its FS is carbonated in the fine earth (exactly half is not the larger part); with some FS carbonated but not the larger part it attaches to the calciques, imperfect, bathycarbonaté when the shallowest FS is not carbonated and recarbonaté when it is; a profile never ends [non rattaché] for this (Hugo, 2026-11-03)."
  - topic: "Fersialsols: an FSt with no E (R1)"
    page: "pp. 180-181"
    reading: "On the data the t of an FS needs common or many clay films (few films make no FSt). An FSt with no E is a fersialsol éluvique, imperfect, tronqué (the E or the A eroded, p. 181), when the texture differentiation index from the A to the FS is over 1.3; otherwise a calcique (S/CEC over 80 %) or an insaturé, imperfect, luvique (clay illuviation that does not differentiate the solum); never [non rattaché] for this (Hugo, 2026-11-03)."
  - topic: "Ferrallitisols: an OX with an ND over an OXc (R2)"
    page: "pp. 159-160"
    reading: "A-OX-ND-OXc is a ferrallitisol duroxydique: an OXc within 120 cm sets the reference before the ND, by the hardness precedence, whatever the F against the OX (the book has no oxydisol duroxydique); with no OXc the nodulaires attach as before (Hugo, 2026-11-03)."
  # --- the references of part 6 (0.9.349), confirmed with Hugo's decisions on its review -------
  - topic: "Lithosols: the obstacle at 10 cm or less"
    page: "pp. 64, 207, 219, 238"
    reading: "The lithosols need the R, Km, Fem or Sim, or in the intertropical domain the OXc or OXm, to start at 10 cm or less, the OL not counted (the definition's 10 cm or less, as the histosols and organosols read it); from 10 to 15 cm the attachment is imperfect by the band of p. 64 (Hugo, 2026-11-04)."
  - topic: "A cuirasse or carapace within 10 cm in the tropical chapters"
    page: "pp. 159-161, 175, 219-220"
    reading: "A ferrallitisol or oxydisol pétroxydique, a ferrallitisol duroxydique or a ferruginosol pétroxydique takes the name before the lithosol only when an F (Fnod), an OX, an ND, an RT, an FE, an Ea or a BT lies under its OXm or OXc within 120 cm (the A optional; the type tronqué OXm/Ea/BTg/Sg/C/R of p. 175); with none of them, the cuirasse or carapace within 10 cm is a lithosol pétroxydique or duroxydique, the tropical reference a candidate (Hugo, 2026-11-04)."
  - topic: "Histosols: the solum under the H, the windows and the kinds"
    page: "pp. 205-209"
    reading: "Under the first H only H, limnic or terric materials, G, M, D or R, and a C read as the M of a description that writes the substrate so; the first H starts within 50 cm (the cover of the qualifier recouvert, +/- 10). The windows of the predominant horizon (40 to 120 cm, or 0 to 50 cm when an M, D or R starts within 50 cm) are read as printed, strict; equal thicknesses of two kinds are no kind truly predominant (composite); an H written alone in the RP notation is of the kind the data read (rubbed fibres, then von Post), else undecided between Hf, Hm and Hs; the H over 50 cm of the fibriques, mésiques, sapriques and composites is the figure of p. 209 (+/- 10); an H of 10 cm or less over M, D or a C read as the M is a régosol épihistique's (Hugo, 2026-11-04)."
  - topic: "Luvisols: the texture contrast"
    page: "pp. 225-227, 230, 401"
    reading: "The band is set by the clay of the E, the mean of the E layers weighted by thickness (with no E, of the ploughed LA or LE, D12). Under 10 % and over 30 % the BT has 3 or 8, 9 or 24 points more than that mean; from 10 to 30 % the index is the lexicon's, the most clayey BT over the poorest E or Ae layer: 1.3 to 1.8 néoluvisol (both included), over 1.8 typique. The derniques need the lexicon's index over 1.8 with no bands (p. 227); the dégradés at least the néoluvisols' minimum (the luvisols against the brunisols, p. 230), their index over 1.8 being only general; strict, the clay thresholds not being in the table of p. 64 (Hugo, 2026-11-04)."
  - topic: "Luvisols: the sequences"
    page: "pp. 224-227"
    reading: "The A of the sequences is any A (an A directly over an E is the Ae of p. 11); the néoluvisols and typiques have no BTd; the dégradés need a BTd under the E, the g of BTgd and Eg typical, not required (p. 226: the -g horizons are part of the reference); a dernique (an Ea directly on the BTd, index over 1.8) is named before a dégradé (D9); the E and the BT in the first material (one parent material, p. 221); the FFE over total iron of the BT over 0.20 when measured fails them (p. 230) (Hugo, 2026-11-04)."
  - topic: "Luvisols tronqués and quasi-luvisols"
    page: "pp. 227-228"
    reading: "A luvisol tronqué under forest has its BT directly under the A or a thin E, no E over 10 cm (+/- 5) and no ploughed surface, and with an E of 10 cm or less it takes the name before a typique or néoluvisol, which stay candidates; under crops a written LBT, or a ploughed horizon directly over the BT with no texture contrast left (under the néoluvisols' minimum). A quasi-luvisol needs its BT in a later material than the E, the discontinuity written (a Roman numeral); with no numeral it is not read on the data (Hugo, 2026-11-04)."
  - topic: "Leptismectisols: the saturation, the smectites and the V"
    page: "pp. 64, 217-218"
    reading: "The complex saturated over 90 % by Ca and Mg ((Ca + Mg) / CEC, each Av and SV) takes the +/- 5 of p. 64 like every S/CEC threshold (default 9; map 3 D22 left it strict); the smectites are tested only when the clay mineralogy is recorded (another dominant mineral fails), the vertic horizons standing for them; the lower limit R, Kc, Km or C is required (the sequence and the qualifiers); with no V read within 100 cm the leptismectisol takes the name before the signpost of the vertisols (Hugo, 2026-11-04)."
  - topic: "Organosols: the Aho, the thin horizons and the drainage"
    page: "pp. 238-241"
    reading: "The S/CEC is read on the Aho as a whole, the mean of its layers weighted by thickness (p. 239), for the saturés (over 80 %) and the insaturés (under 80 %), which also need their O and Aho over 20 cm from the surface (+/- 5) and no carbonated Acaho; the thin organo-mineral horizons are 10 cm or less in all (an S of 10 cm tolerated, the example of p. 239), an S over 10 cm failing the organosols outright, and the organic horizons at least twice as thick; well drained to 50 cm is read as no G or -g within 50 cm and no poor drainage recorded; the holorganiques have OF and/or OH and/or OHta and no A at all (Hugo, 2026-11-04)."
  - topic: "The doubles of part 6"
    page: "pp. 141, 240-241"
    reading: "The luvisol-cryosol of p. 141 (cryoturbated luvisols, the GER named) is written for every reference of the luvisols with the cryosol minéral, the luvisol first as in the book's example; the organosol insaturé-alocrisol humique of the types of p. 240 only when the Sal is exactly 10 cm, between the two sides of p. 241; the doubles with the rédoxisols and réductisols wait for them (Q8) (Hugo, 2026-11-04)."
  # the decisions of the review of part 6 (2026-11-04)
  - topic: "Lithosols: one horizon over the obstacle (decision 2)"
    page: "p. 219"
    reading: "Over the obstacle of a lithosol lies one horizon at most (organo-mineral or holorganic, a C, or an M or D layer, under 10 cm), the holorganic O horizons counting as one ([OF + OH], p. 241): A-Sal-R with the R at 12 cm is no lithosol but an alocrisol typique, imperfect (Hugo, 2026-11-04)."
  - topic: "Organosols and alocrisols humiques: the Sal (decision 5)"
    page: "pp. 240-241"
    reading: "A Sal over 10 cm under O or Aho makes an alocrisol humique, under 10 cm an organosol insaturé, the other reference a candidate; the double organosol insaturé-alocrisol humique is written only when the Sal is 10 cm (Hugo, 2026-11-04)."
  - topic: "Luvisols against the fersialsols éluviques: the BT (decision 6)"
    page: "p. 230"
    reading: "When recorded, a BT of 5YR or redder, or with a micro-polyhedral structure (fine or very fine, strong, angular or subangular blocky, or written micro-polyédrique), fails the luvisols; not recorded, only the FFE over total iron is read (Hugo, 2026-11-04)."
  - topic: "Luvisols: an h on the E or the BT (decision 7)"
    page: "p. 194"
    reading: "An Eh or a BTh, written or read on the data, fails every luvisol reference: such solums are the grisols' or chernosols', or stay provisional or undecided by the phaeosols of a later release (Hugo, 2026-11-04)."
  - topic: "Luvisols tronqués before the typiques (decision 8)"
    page: "p. 227"
    reading: "Under forest, with an E of 10 cm or less, a luvisol tronqué takes the name and the luvisol typique or néoluvisol that also attaches stays a candidate (precedence.yaml) (Hugo, 2026-11-04)."
  - topic: "Organosols against the brunisols with no A (decision 9)"
    page: "pp. 239-240"
    reading: "An S over 10 cm under the O horizons fails the organosols (strict); the brunisol attaches imperfectly, with no A over its S (the imperfect case of brunisols.yaml): OF/OH 40 cm over an S of 15 cm is a brunisol, never an organosol (Hugo, 2026-11-04)."
  # the FE on the data (0.9.350), confirmed with Hugo's decisions on its review (2026-11-04)
  - topic: "FE against BT on the data: the clay films (0.9.350)"
    page: "pp. 64, 170-171"
    reading: "In the intertropical domain the illuviation cutans separate the zones of clay illuviation (BT) from those of weathering (FE), and the A over an FE is depleted of clay by sheet runoff, so a clay increase alone makes no BT there. Recorded clay films decide as everywhere: common or many read BT even in a ferruginous context (the cutans, p. 170), none or few no BT; a BT mark of another notation (Bt, B2t) keeps the BT. With the clay films not recorded, soilKey's argic() does not make a BT of a layer that holds FE: at 5YR or redder, outside the colours of the BT of the ferruginosols (10YR to 7.5YR), no BT, and the fixed order goes on (it may give FE, or an F tested before it); at 7.5YR, with the FE holding only within the tolerance of p. 64 (pH 5.8 to 6.0 or 6.5 to 6.7, S/CEC 50 to 55 %), or with the FE undecided in the domain (a criterion not recorded), the layer is undecided between FE and BT. Outside the domain, or with the domain not recorded, nothing changes (Hugo, 2026-11-04)."
  - topic: "FS in the intertropical domain: a kaolinitic clay (0.9.350)"
    page: "pp. 150, 171, 175, 179"
    reading: "In the intertropical domain a CEC of 16 cmol+/kg of clay or less, the upper bound of the ferrallitic F (p. 150), is read as a kaolinitic clay, that of the BT of the ferruginosols (p. 171), and not the 2:1 clays an FS needs (p. 179): the layer is no FS, so a BT under an FE stays a BT of the ferruginosols instead of an FSt (the review's D6). The reason is mineralogical, so a clay mineralogy recorded wins over the CEC (a recorded smectite or other 2:1 clay keeps the FS); with neither recorded nothing changes. The scope is kept to the domain as a conservative choice (Hugo, 2026-11-04)."
  - topic: "FS on the field route: a strong angular structure (0.9.350, decision 3)"
    page: "pp. 171, 179"
    reading: "With no FFE measured (the field route, map 2), an FS needs an angular blocky structure (angular polyhedral or cubic), very well developed and stable as p. 179 describes it, unlike the massive to polyhedral BT of the ferruginosols (p. 171): of strong grade it makes the FS, of moderate grade the FS imperfect (the reference attaches as imperfect); a recorded subangular, prismatic (alone), granular or massive structure, or a weak grade, is no FS by the field route; the grade or the angularity not recorded leaves it undecided. With the FFE measured the structure is read as before. Everywhere, not only in the domain (Hugo, 2026-11-04)."
  - topic: "The clay increase of a BT under an FE (0.9.350, decision 4)"
    page: "pp. 17, 171"
    reading: "A BT has more clay than the A, E, S or C of the solum (p. 17); the FE is none of them, and the increase of an FE over the A depleted by runoff (p. 171) is not the BT's. On the data, with the clay films not recorded, the layer under an FE is a BT by soilKey's argic() only with more clay than that FE by the measure of the BT (3 points under 15 %, 1.2 times from 15 to 40 %, 8 points from 40 %): the comparison is with the FE directly above, never across it to the A: a 7.5YR layer 2 points more clayey than the FE is no BT, and the fixed order goes on. The BTss reads the BT above it the same way (Hugo, 2026-11-04)."
  # --- the references of part 7 (0.9.351), confirmed with Hugo's decisions on its review -------
  - topic: "Hydromorphy: the 50 cm of functional features (0.9.351)"
    page: "pp. 279, 281-282"
    reading: "The reductic or redox features continue or intensify over at least 50 cm (+/- 10) when the longest run of adjacent G, g and -g layers starting within 50 cm is 50 cm thick, the ferric Fe, Fem and Femp inside it counted (they come from the same redistribution of iron, p. 281); a run that reaches the bottom of the description short of 50 cm leaves the attachment undecided; a G or -g layer recorded relict (redox_relict) is not functional, a reductic one always is, and a drained site keeps the attachment, the qualifier drainé noted (Hugo, 2026-11-04)."
  - topic: "Réductisols typiques and stagniques: the base and the water (0.9.351)"
    page: "p. 282"
    reading: "The Gr of the printed sequences is read as any G (Gr or Go): the base decides. A G reaching the bottom of the description is typique, unless a perched water table is recorded; an R or M under the G, or a perched water table, is stagnique; a C or D under the G is typique with a phreatic water table recorded (groundwater_kind observed, apparent or phreatic), stagnique with none recorded, as any other horizon under the G (decision 5) (Hugo, 2026-11-04)."
  - topic: "Doubles with the rédoxisols and réductisols: the pairs the book names (0.9.351)"
    page: "pp. 107, 133, 141-142, 211, 226-230, 273, 285, 289"
    reading: "Only the pairs the book names are written (Q7): luvisol typique, dégradé or dernique-rédoxisol, pélosol typique-rédoxisol, podzosol-réductisol and -rédoxisol (every reference but the éluviques, the GER named p. 273), brunisol-rédoxisol, colluviosol-rédoxisol, cryosol minéral-rédoxisol, peyrosol-réductisol (p. 253, decision 6), and no histosol-réductisol (decision 2); a double with the rédoxisol only when the rédoxisol holds strictly (redox features from under 50 cm over 50 cm). Beside a rédoxisol, another reference with E, BT, BP or Sp that the book does not pair with it (a néoluvisol, a luvisol tronqué, a grisol, a pélosol brunifié ...) takes the name and the rédoxisol stays a candidate; a G within 50 cm makes the réductisol whatever lies above (default 20), the doubles still written (Hugo, 2026-11-04)."
  - topic: "Brunisol-rédoxisol: the aerated S (0.9.351)"
    page: "pp. 107, 284-285"
    reading: "The double brunisol eutrique or dystrique-rédoxisol of p. 107 needs an S with no redox feature directly over the first redox horizon, which is an S with -g (Sg): A/S/Sg is the double; A/S/g (an S over a g horizon, case 1 of p. 285 and the sequence of p. 284) and A/Sg (no aerated S) are the rédoxisol alone (Q8) (Hugo, 2026-11-04)."
  - topic: "The doubles of the podzosols: the GER named (0.9.351)"
    page: "pp. 141, 253, 272-273, 285"
    reading: "Where the book names the GER of the podzosols in a double (cryosol minéral-podzosol, p. 141; peyrosol-podzosol, pp. 253, 272; podzosols and rédoxisols or réductisols, p. 273; podzosols and anthroposols transformés, p. 273), the pair is written for every reference of the podzosols (but the éluviques with the hydromorphy, p. 273), as the luvisol-cryosol of part 6, the order of the book's examples; the luvisol typique-podzosol meuble leptique of p. 273 when [A + E + BP] is 20 to under 30 cm, under 20 cm the luvisol typique à micropodzol (Hugo, 2026-11-04)."
  - topic: "Histosol-réductisol: no double (0.9.351)"
    page: "pp. 208-209, 211"
    reading: "H horizons over 50 cm with a G under them (from 50 to 80 cm the histosols réductiques of the figure of p. 209, a qualifier) are a histosol, the réductisol a candidate: no double histosol-réductisol is written (decision 2); H horizons of 50 cm or less over G are the réductisol épihistique (pp. 208-209), the histosol a candidate (Hugo, 2026-11-04)."
  - topic: "Planosols: the abrupt change within 8 cm (0.9.351)"
    page: "pp. 259-261"
    reading: "The 8 cm of the abrupt textural (or structural) change are read on the lower boundary of the last upper horizon: abrupt or clear within 8 cm, diffuse beyond, gradual or not recorded undecided; the change is measured between that horizon and the layer directly under it (a transition horizon of 15 to 20 cm between them makes no planosol, p. 263); the upper horizons are the A, E and ploughed layers from the surface, the floor the first layer under them; a compacted or indurated floor of the structuraux is a fragipan, a duripan Sim or Si, a Fem or Femp, a Km, or a cementation or pan recorded (Hugo, 2026-11-04)."
  - topic: "Planosols typiques tronqués: an imperfect attachment (0.9.351)"
    page: "pp. 260, 263"
    reading: "The cultivated planosol typique slightly truncated of p. 263 (the LE directly on the Sg, no Eg, no Sp, the abrupt change) attaches imperfectly, named tronqué: the Eg the book requires (p. 260) is missing (map 4 D3) (Hugo, 2026-11-04)."
  - topic: "Pélosols: the pH, the 40 cm and the LE (0.9.351)"
    page: "pp. 244-246, 52"
    reading: "\"Never acid\" is a pH in water of 5.0 or more (+/- 0.2) in every Sp layer, a measurement not recorded leaving it undecided (D5); the Sp starts under 40 cm for the three references (D6, strict: 40 is not in the table of p. 64); the Sp of the typiques lies directly under the A or at the surface (LSp), that of the brunifiés directly under an S; on the data the LE of the différenciés is the ploughed layer L (Hugo, 2026-11-04)."
  - topic: "Podzosols: the humus and the post-podzosols (0.9.351)"
    page: "pp. 267-271"
    reading: "The humus of a podzosol is a moder or a mor: a mull recorded fails unless the site is cultivated; an A recorded at a pH in water of 5.0 or more (+/- 0.2) with no OF, OH or humus form recorded leaves the humus undecided; nothing recorded, no mull is recorded and the BP stands (a field observation not recorded is absent). The E over the BP is any E layer with the BP directly under it, not only the deepest; a cemented BP is written with c, recorded cemented, or written with an m of another notation on the data (Bhsm). A cemented BP is written with c or recorded cemented (not recorded: loose). A post-podzosol is a ploughed layer directly on the BP, or a written LE over an E over the BP; a ploughed LA over an E over the BP is a cultivated podzosol (the qualifier); on the data, a ploughed layer over an E over the BP leaves the post-podzosol undecided (LA or LE). An A over a cemented BP with no E (A/BPh induré/C) is a podzosol ocrique, imperfect (D11), and so is a mor directly on a loose BP with no A and no E (decision 3); a placic Femp lies directly above the BP or inside it, not under it (p. 270) (Hugo, 2026-11-04)."
  - topic: "Rankosols: the Sal, the BP and the peyric A (0.9.351)"
    page: "pp. 73, 272, 276-277"
    reading: "The rankosols forbid the S over 5 cm but allow a Sal under 10 cm (the alocrisols chapter, p. 73) and a BP under 10 cm (5 cm or less the rankosol, over 5 the double rankosol-podzosol ocrique, p. 272); a peyric horizon on R may stand in the A when every other character holds, giving the double rankosol-peyrosol of p. 277 (D15); the thickness is [O + A or LA or X] from the surface, over 10 and under 35 cm; the coarse elements are over 25 % and under 60 % in the A, 60 % or more only in the double rankosol-peyrosol (D4, D15); not recorded they leave the rankosol undecided (decision 7: a candidate, the name provisional; Q11 holds elsewhere); the sequence (O)/A/R admits no C, M or D; \"ni calcaires ni calciques\" (p. 276) bars a calcareous horizon (Aca, Sca, K), a calcic or magnesic one (Aci, Sci, Amg, Smg) and a carbonate reserve recorded in the R or the parent material (Hugo, 2026-11-04)."
  - topic: "Phæosols: the Sh and BTh on the data and the index (0.9.351)"
    page: "pp. 256-257"
    reading: "The Sh, Sth or BTh is the layer directly under the Aso (an E under 5 cm between allowed): written with h, or with over 0.6 % organic carbon and S/CEC over 80 % (+/- 5) recorded; the index is the Aso against that layer and the adjacent ones of its kind only (a deeper non-humic BT of an older phase not counted); between 2 and 3 the Aso/BTh boundary not recorded leaves the mélanoluvique undecided; the complex of the Aso over 80 % leaves the phæosol undecided against the chernosols (D9), under 50 % the phæosol dystrique, imperfect (Hugo, 2026-11-04)."
  # the decisions of the review of part 7 (2026-11-04)
  - topic: "Pélosols on the data: a prismatic over-structure (decision 1)"
    page: "pp. 244, 246"
    reading: "On the data, a prismatic over-structure alone does not make an SV when the layer meets the Sp and no slickensides or wedge-shaped aggregates (and no cracks of 1 cm or more, no polygonal network) are recorded: the layer is the Sp of the pélosols; with them, an SV (Hugo, 2026-11-04)."
  - topic: "Histosols with a G under them (decision 2)"
    page: "pp. 209, 211"
    reading: "No double histosol-réductisol: H over 50 cm over G is the histosol, réductique a qualifier (the figure of p. 209), the réductisol a candidate (Hugo, 2026-11-04)."
  - topic: "A mor on the BP (decision 3)"
    page: "pp. 267-268, 272"
    reading: "O horizons directly on a loose BP, with no A and no E, attach to the podzosol ocrique, imperfectly (Hugo, 2026-11-04)."
  - topic: "Phæosols before the brunisols (decision 4)"
    page: "p. 257"
    reading: "With an Aso (or a dark A) of 30 cm or more, a phæosol that attaches, dystrique or within the tolerance, takes the name before a brunisol, which stays a candidate (Hugo, 2026-11-04)."
  - topic: "Réductisols typiques and stagniques by the substrate and the water (decision 5)"
    page: "p. 282"
    reading: "An R or M under the G, or a perched water table recorded, makes the réductisol stagnique; a C or D under the G with a phreatic water table recorded makes it typique; with no water recorded the base decides as before (Hugo, 2026-11-04)."
  - topic: "Peyrosols over the réductisols (decision 6)"
    page: "p. 253"
    reading: "Peyric horizons over 50 cm from the surface name the peyrosol whatever the context; with a G within 50 cm, read in a peyric layer on the data, the double peyrosol-réductisol is written (Hugo, 2026-11-04)."
  - topic: "Rankosols: the coarse elements not recorded (decision 7)"
    page: "pp. 249, 276"
    reading: "For the rankosols the coarse elements not recorded leave the reference undecided, a candidate, and the name provisional; they must be over 25 % and under 60 % in the A (D4); Q11 (not recorded, none) still holds for the peyrosols and the other references (Hugo, 2026-11-04)."
  - topic: "Organosols against the podzosols (decision 8)"
    page: "p. 241"
    reading: "E and BP over 10 cm under the O or Aho make a podzosol, whichever reference of the podzosols attaches (a meuble as well as a humique), the organosol a candidate (Hugo, 2026-11-04)."
  - topic: "Peyric horizons and the podzosols, fersialsols and réductisols (decision 9)"
    page: "pp. 250-253, 272"
    reading: "A peyric X read on the data whose fine earth also holds an E, a BP, an FS or a G (its candidates) serves the tests of those horizons, and a horizon of the notation with its coarse elements recorded over 60 % by weight is a peyric horizon for the peyrosols, so that the doubles peyrosol-podzosol (the peyrosol-podzosol meuble cailloutique of p. 252), peyrosol-fersialsol and peyrosol-réductisol are reached; the solums the book places in no reference (an Aso over an E of 5 to 15 cm over a BT, pp. 256, 258, 260; an index of 2 to 3 with an abrupt Aso/BTh transition, p. 257) are reported in the trace (Hugo, 2026-11-04)."
  # --- the references of part 8 (0.9.352), confirmed with Hugo's decisions on its review -------
  - topic: "Régosols: the obstacle and the young deposits (0.9.352)"
    page: "pp. 188, 219, 291-292"
    reading: "The régosol is read as the lithosol, its twin chapter: the first M, D or C starts at 10 cm or less from the datum (+/- 5: 10 to 15 cm imperfect), with at most one horizon over it (adjacent layers of one code, A1/A2 written A/A, count as one, for the lithosols too), organo-mineral or holorganic (an A, a J, an O or H, a ploughed L: a Ym over a C is none), the holorganic O horizons counting as one, none over it allowed; an undecided layer deeper than the window is no obstacle; its hardness is the horizon frame's (an M or D by the notation, the rupture resistance or soilKey's continuous_rock(); not recorded, undecided). A recorded recent alluvial origin (alluvial_rp) excludes the régosol outright (an M or D fluvic in the major bed is none). The very recent alluvial deposits the chapter sends to the fluviosols bruts are read as every young alluvial or marine deposit: the fluviosols bruts and juvéniles and the thalassosols bruts and juvéniles take the name before a régosol, which stays a candidate; an organo-mineral A over 10 cm from the surface makes the arénosol before a régosol sableux within the tolerance (pp. 101, 292). (Hugo, 2026-11-04)."
  - topic: "Salisols: the series without the pH of the paste (0.9.352)"
    page: "pp. 295-296; Q12"
    reading: "The series of the salisols is read on the first salic layer starting within 60 cm: the anions of the soluble salts when recorded (the carbonate and bicarbonate share over the chloride and sulfate shares: alkaline, the salisols carbonatés; else neutral, the chloruro-sulfatés); else the pH in water as recorded, standing in for the pH of the saturated paste extract (under 8.5 neutral, over 8.5 alkaline, +/- 0.2, noted); neither recorded, both references undecided. (Hugo, 2026-11-04)."
  - topic: "Sodisols: the three references and the superposed ones (0.9.352)"
    page: "pp. 297-298"
    reading: "The sodisols need a sodic horizon within 60 cm (+/- 10) and no salic horizon within 60 cm, the salisols a salic one and no sodic one; with both within 60 cm the order of their first layers decides between the sodisalisols (Na over Sa) and the salisodisols (Sa over Na). The indifférenciés have no E and no BT within 60 cm (no vertical migration of clay; their sodic A and their pH over 8.7 are not tested); the solonetziques an E directly over the NaBT, the E not bleached; the solodisés an Ea written over the NaBT, or an E whose pH in water is 5 or less (+/- 0.2: the complete desaturation of the upper horizons, pH 4 to 5), a written E with no pH being none, an E read on the data with no pH undecided, the Ea read only from the notation; an A directly on the NaBT, with no E, is the solonetzique imperfect, and a sodic BT names the sodisol before a luvisol; the pH of the NaBT (9 to 10) is not tested. (Hugo, 2026-11-04)."
  - topic: "Salsodic doubles with the réductisols and rédoxisols (0.9.352)"
    page: "pp. 102, 298-299"
    reading: "A salisol or sodisol with a G or g starting within 50 cm is the double the book names, written for every one of the seven references with the réductisols typiques and stagniques and the rédoxisols, the salsodic reference first (the solum is attached to a salsodic reference and also to the hydromorphic one, p. 298); the double with the rédoxisol only when the rédoxisol holds strictly, as the other doubles of the rédoxisols; the arénosols exclude the seven references (an arénosol salin). (Hugo, 2026-11-04)."
  - topic: "Thalassosols: the marine origin, the closed list and the site (0.9.352)"
    page: "pp. 66-67, 303-304; Q14"
    reading: "The marine or fluvio-marine origin is required, recorded in layer_origin or rock_origin within 50 cm or in the parent material (marine, tidal, estuarine, the slikke, the schorre, the tangue, the bri, a mangrove, a mudflat or salt marsh, read as words: neither submarine nor non-tidal), and such an origin is no longer an alluvium of the fluviosols. The closed list of p. 304 is read as forbidding the other reference horizons and layers (E, BT, BP, S and its kinds, V, FS, F, OX, FE, ND, RT, K, Si, Fe, Ys, Ym; R, D, X and Z only within the solum, read as 100 cm), a litter O allowed, a Y within 10 cm and a TH, U, salic or sodic horizon within 60 cm (+/- 10) excluded. The horizons decide between the references (the bruts no A, J or H and an M, or on the data a C or G, within 10 cm; the juvéniles a Js within 10 cm and no A; the poldérisés an A within 10 cm directly over a Jp) and the site confirms: a polder fails the bruts and juvéniles, a tidal flooding the poldérisés; a polder, a reclaimed, embanked or former tidal land named in the texts is read before the tidal words; artificially_drained stands in for poldered, flagged; not recorded, the attachment is provisional. (Hugo, 2026-11-04)."
  - topic: "Thalassosols and the hydromorphy: the doubles and their order (0.9.352)"
    page: "pp. 285, 304-305; Q8"
    reading: "With a G starting within 50 cm and continuing at depth, the double réductisol typique-thalassosol is written for every reference of the thalassosols (p. 305 names the GER; the réductisol stagnique a candidate, decision 4); with a g or -g and the rédoxisol holding strictly, the double rédoxisol-thalassosol poldérisé, only with the poldérisés (p. 305); bruts or juvéniles with redox features are the rédoxisol, the thalassosol a candidate (the priority of p. 304). The order of the names is that of p. 305 and of the wording of Q8 (the hydromorphic reference first), where p. 285 writes thalassosol poldérisé-rédoxisol. (Hugo, 2026-11-04)."
  - topic: "Thiosols and sulfatosols: the solum characters and the TH under the U (0.9.352)"
    page: "pp. 253, 299, 308-310"
    reading: "The thiosols need a TH within 50 cm (+/- 10) and no U within 50 cm; their consistency n over 1.4 is read on the TH (n_value, else the fluidity class, very or moderately fluid over 1.4, flagged) and their pH after drying under 3.5 on incubation_ph or ph_h2o2, each when recorded: not recorded, the TH itself stands for them (as the smectites of the leptismectisols). The sulfatosols need a U within 50 cm with a TH directly under its run (the description ending at the U leaves it undecided; another layer and no TH under it, the sulfatosol imperfect, decision 3) and n under 1.4 on the U when recorded. Sulfur at a shallow depth attaches the solum first to them, in every case (p. 310): before the salsodic, hydromorphic, thalassosol and fluviosol references and the peyrosols (decision 6), and outside the rows of the peyrosols (whatever the context, p. 253) and of the réductisols (whatever lies above); a salisol with their characters is a thiosol or sulfatosol salique (D11). (Hugo, 2026-11-04)."
  - topic: "Veracrisols: the Ah on the data, heath and culture (0.9.352)"
    page: "pp. 313-316"
    reading: "The Ah are written Ah in the notation, or read on the data as the A layers of the surface run, not ploughed, with a moist value of 3 or less and a chroma of 2 or less; every Ah must be biomacrostructured and dark. Culture is a ploughed layer at the surface (LA or LAh written, or the L read on the data): an Ah under it with its base over 50 cm (+/- 10), the complex not tested; heath is no ploughed layer: the Ah over 50 cm thick (+/- 10), every Ah with S/CEC under 30 % (+/- 5) and Al/S over 1 (strict, exchangeable Al over the sum of the bases); Ah of 30 to 50 cm, the veracrisol leptique, imperfect; under the Ah an E or BT, a C or an F (the printed sequences; a description ending in the Ah leaves it undecided), no BP; a vermihumic Ah of 30 cm or more names the veracrisol before a luvisol tronqué (decision 1). The organic carbon, C/N, porosity, density, the pH of 4.0 to 4.9 and the chroma gained on drying are not tested, the climate reported; with an alocrisol humique the double alocrisol humique-veracrisol of p. 316 is written. (Hugo, 2026-11-04)."
  - topic: "Vertisols: litho against topo (0.9.352)"
    page: "pp. 322-323, 395; Q20"
    reading: "The two references share the formula: an SV recorded under 95 % makes the lithovertisol whatever the landform (the palusmectic lithovertisol of p. 324, decision 2); else the site decides when recorded (a slope under 2 %, or a depression, basin, plain, valley bottom, cuvette or doline in landform or landform_element: topovertisol; a slope of 2 % or more, or a slope, interfluve, hill or plateau: lithovertisol; both kinds of words or neither: not decided by the site); else the SV: every SV layer with S/CEC 95 % or more (strict, the lower end of saturé) and a pH in water of 7 or more (+/- 0.2) the topovertisol, any other SV the lithovertisol; neither recorded, both undecided; with no site recorded the attachment is provisional (decision 2). (Hugo, 2026-11-04)."
  - topic: "Vertisols: the paravertisols and the other GER (0.9.352)"
    page: "pp. 217-218, 299, 318, 322-325; Q20"
    reading: "Every vertisol has an SV, a V starting within 100 cm (strict), the SV above the V, 40 % clay or more in every SV and V layer whose clay is recorded (a written SV or V carries it, decision 7) and, when the clay mineralogy is recorded, smectites. The order is paravertisol planosolique, paravertisol haplique, then litho or topo: the planosolique an E or Eg (both read) directly over the SV with an abrupt lower boundary (not recorded, undecided), the A and E under 40 % clay, no vertic Av at the surface; the haplique an A directly over the SV, under 40 % clay, not vertic; the litho and topo a vertic surface within 10 cm: an Av or LAv, or an A, LA or SaA written or read on the data with 40 % clay or more and slickensides or shrinkage cracks recorded (not recorded, undecided). A VSa or VNa is also the salic or sodic horizon (the overlay; on the data a V with Na over 15 % of the CEC is a VNa); a dark SV under the A run stays an SV candidate whatever its carbon. While the SV and V hold the vertisol takes the name before a planosol (the paravertisol planosolique, a first stage towards the planosols typiques vertiques) and before a salisol or sodisol (Q20); the doubles vertisol-réductisol and vertisol-rédoxisol of p. 325 are written for the four references (envisageables, read as suggested, Q7). (Hugo, 2026-11-04)."
  - topic: "The rows of part 7 with the new GER (0.9.352)"
    page: "pp. 253, 282, 285, 289"
    reading: "The precedence rows of part 7 that waited for these GER now read them: the peyric horizons over 50 cm name the peyrosol before the régosols, salisols, sodisols, thalassosols, veracrisols and vertisols (whatever the context, p. 253), not before the thiosols and sulfatosols; a G starting within 50 cm names the réductisol before them as well (default 20, whatever lies above), the doubles of doubles.yaml still written (salsodic, thalassosols, vertisols) and the régosols and veracrisols candidates; with E, BT, BP or Sp beside the redox features the other reference takes the name before the rédoxisol (the sodisols solonetziques and solodisés, the veracrisols, the paravertisols planosoliques), the doubles still written. (Hugo, 2026-11-04)."
  # the decisions of the review of part 8 (2026-11-04)
  - topic: "Veracrisols before the luvisols tronqués (decision 1)"
    page: "pp. 315-316"
    reading: "A vermihumic Ah of 30 cm or more names the veracrisol, also leptique, before a luvisol tronqué, which stays a candidate (Hugo, 2026-11-04)."
  - topic: "Litho against topo when only the SV decides (decision 2)"
    page: "pp. 322-324"
    reading: "An SV recorded unsaturated makes the lithovertisol even in a low position (the palusmectic lithovertisol of Bulgaria, p. 324); when no site is recorded and only the SV decides, the litho- or topovertisol is provisional (Hugo, 2026-11-04)."
  - topic: "A U with no TH under it (decision 3)"
    page: "pp. 309-310"
    reading: "A sulfated U within 50 cm with another layer and no sulfidic material under it (A/U/G) attaches the sulfatosol imperfectly, before the réductisol (sulfur first, p. 310) (Hugo, 2026-11-04)."
  - topic: "The thalassosols and the réductisols stagniques (decision 4)"
    page: "p. 305"
    reading: "Only the réductisols typiques (the G continuing at depth) make the double with the thalassosols; a réductisol stagnique stays a candidate (Hugo, 2026-11-04)."
  - topic: "The salsodic doubles and a réductisol within the tolerance (decision 5)"
    page: "pp. 298-299"
    reading: "The double of a salisol or sodisol with a réductisol is written only when the réductisol holds strictly; within the tolerance it stays a candidate (Hugo, 2026-11-04)."
  - topic: "Thiosols and sulfatosols before the peyrosols (decision 6)"
    page: "pp. 253, 310"
    reading: "Sulfur at a shallow depth attaches the solum first to the thiosols or sulfatosols, before a peyrosol (a peyric X over a TH within 50 cm is a thiosol) (Hugo, 2026-11-04)."
  - topic: "The clay of a written SV and V (decision 7)"
    page: "p. 318"
    reading: "On the notation a written SV or V carries its clay: the 40 % is tested only where the clay is recorded (Hugo, 2026-11-04)."
  # the humus forms of Annex 1 (0.9.353), confirmed by Hugo (2026-11-04)
  - topic: "Humus forms: the order of the reading (Annex 1)"
    page: "pp. 337, 348-354"
    reading: "humus_form_rp() reads the épisolum in a fixed order: H horizons at the top leave it to the histosols, with no form of the annex (p. 351); an OHta among the O horizons makes a tangel (p. 349) and an An as the first mineral horizon an anmoor (p. 351), the codes the references read; O horizons directly over an X, R or D give a form without fine mineral earth (pp. 348-349); the open land by the land use (p. 337); then the key of Figure 2 on the O and A horizons (p. 354), its outcome made hydromorphic when the épisolum is wet (p. 350). An undecided gate leaves its form among the candidates and the reading goes on (Q22) (Hugo, 2026-11-04)."
  - topic: "Humus forms: no O horizon recorded"
    page: "pp. 341, 354"
    reading: "The key of Figure 2 reads the O horizons. A profile with no O horizon recorded, outside the open land, has its humus form undecided: databases rarely describe the O horizons, and an eumull whose litter has gone in summer (p. 341) cannot be told from an O not described. A recorded site$humus_form decides, here and over H horizons (Hugo, 2026-11-04)."
  - topic: "Humus forms: the continuity of the O horizons"
    page: "pp. 340, 352, 354"
    reading: "An O horizon is continuous when lateral_cover_pct is 90 % or more; with the cover not recorded, in a profile written in the RP notation an O horizon in parentheses is discontinuous and one without them continuous (the notation of p. 340); in another notation the continuity is undecided. An OH on under 10 % of the ground is very sporadic, no OH for the key: a hémimoder (p. 344) (Hugo, 2026-11-04)."
  - topic: "Humus forms: the wet épisolum"
    page: "pp. 350-351"
    reading: "The épisolum is wet when the first mineral horizon under the O horizons is a G or an AG or bears g; for a mor the horizon under that organo-mineral one counts too (its lower boundary with Ea, Ga, Go or Gr, p. 350). The outcome of Figure 2 then takes its hydromorphic form by type: a mull a hydromull, a moder a hydromoder, a mor a hydromor. The annex describes no wet amphimus: an euamphimus stays so, with a note (Hugo, 2026-11-04)."
  - topic: "Humus forms: the open land"
    page: "p. 337"
    reading: "site$land_use or site$vegetation naming crops, tillage, vineyards, orchards or market gardening, or a ploughed L at the surface, gives the agri- forms; grassland, pasture, meadow, lawn, heath or steppe the forms de pelouse; forest, another use or none recorded, the forest key. The four cases of p. 337 are read on the A: biomacro- or mesostructured (case 1; case 4 with an OHzo, amphimus de pelouse whatever the use), not crumbly (case 2), massive (case 3); the root mat is not read (Hugo, 2026-11-04)."
  - topic: "Humus forms: without fine mineral earth"
    page: "pp. 337, 348-349"
    reading: "Over an X, R or D the type is read on the O horizons alone: no OF and no OH a mull, an OFnoz or OHnoz a mor, zoogenic a moder, and over an X an amphimus when an OH lies on fine earth biomesostructured (peyro-amphimus against peyromoder). Over an X: peyromull, peyromoder, peyromor, peyro-amphimus; over an R or D: lithomoder, lithomor. A litter alone over the rock has no form: the 'lithomull' of p. 337 is defined nowhere (Hugo, 2026-11-04)."
  - topic: "Humus forms: the recorded form"
    page: "p. 327"
    reading: "A recorded site$humus_form (the forms and types of the annex, accents and case free; amphimull = euamphimus, humus brut = mor) decides only when the horizons leave the form undecided; a type (mull, moder, mor, amphimus) keeps the candidates of that type. Recorded outside the forms the horizons leave possible, it still decides and the conflict is reported; when the horizons decide another form, they prevail and the conflict is reported (Q22) (Hugo, 2026-11-04)."
  - topic: "Humus forms: the qualifiers"
    page: "pp. 338-340"
    reading: "Read on the first A under the O horizons (the An of an anmoor): the pH and S/CEC classes half-open, the lower edge inclusive, a neighbouring class reached within the tolerance (pH 0.2, S/CEC 5 points) listed as imperfect (default 9); saturée and subsaturée only on a non-carbonated A, carbonatée instead; Ca/Mg on a non-carbonated A with S/CEC 80 % or more (calcique over 5, calci-magnésique 2 to 5, magnésique 1/3 to 2, hyper-magnésique under 1/3, default 22); sodisée with Na/CEC 6 to 15 %, else esp_pct; lignique (35 to 80 %) and xylique (over 80 %) by the highest woody_fragments_pct of the O horizons. They are listed beside the form, not yet in the name (Hugo, 2026-11-04)."
  - topic: "Humus forms: eumull against mésomull"
    page: "pp. 342, 354"
    reading: "A continuous OLn gives a mésomull, as the key of Figure 2 and the table of p. 352 do (Q17); over an A with a clear and stable crumb structure a note recalls that an eumull early in winter shows a continuous OLn of the year too (p. 342) (Hugo, 2026-11-04)."
  - topic: "Humus forms: the OH of the dysmoder"
    page: "pp. 344, 352, 354"
    reading: "Only continuous OH horizons count toward the 1 cm of the dysmoder (p. 344); an OH only discontinuous (written in parentheses, or covering under 90 % of the ground) gives an eumoder, whose OH is under 1 cm and sometimes discontinuous (Hugo, 2026-11-04)."
  - topic: "Humus forms: the label of a type"
    page: "pp. 346, 352"
    reading: "When only the type is decided (humimor or mor), the label is the name of the type, 'mor', as Q22 decided ('à moder' when only the type); it then equals the name of the mor typique, and the field decided and the candidates tell the two apart; the wording in the name waits for the name builder (Hugo, 2026-11-04)."
  - topic: "Humus forms: lignique and xylique"
    page: "p. 340"
    reading: "The recognisable woody debris of the O horizons is read from woody_fragments_pct, the SiBCS field (branches of 2 cm or more), standing in with a note; no new attribute (Hugo, 2026-11-04)."
  # the crosswalks of Annexes 5 to 7 and the labels of the RP 1995 (0.9.354)
  - topic: "Annex 5: what is shipped"
    page: "pp. 378-392"
    reading: "All the tables of Annex 5 are shipped as data, codes and names only (crosswalk_wrb2006.yaml): the 110 references with their WRB 2006 name (the brunisols eutriques in two rows by their saturation, the lithosols stricts in a row of their own), the 12 reference horizons beside a WRB 2006 diagnostic horizon or FAO letter (11 rows), the qualifiers (65 rows for the 64 of the book: the row calcarique ou pétrocalcarique of p. 380, which holds for the calcium chapter only, written as two) and the 15 faux amis. The book's ou is written or (ou, à défaut, or, failing that), its footnote marks are dropped and a footnote that asks a question (the pélosols, p. 387) or a printed ? flags the row as doubtful, never resolved. Petrosilicique (p. 391) is kept as printed, with a note. The report and the Pro app show only the WRB 2006 names of the references of an RP result, labelled WRB 2006: never soilKey's WRB 2022, never evidence (Hugo, 2026-11-04)."
  - topic: "Annex 6: the table as data and the reader's copy"
    page: "p. 393"
    reading: "The table of Annex 6 is shipped row for row (crosswalk_cpcs_horizons.yaml); the notation reader keeps its copy in horizons.yaml, with soilKey's matching of the CPCS symbols, and a test checks that both give the same codes. BTfe (no -fe suffix), FSj (no -j on the FS, p. 180) and Ha under the A1 (a drained histic horizon) are kept as printed and flagged as slips; FE, OX and F of row B are the intertropical codes (Hugo, 2026-11-04)."
  - topic: "Annex 7: the row of a CPCS result"
    page: "pp. 394-398"
    reading: "A cpcs1967 result is shown the row of the most specific category of its chain that Annex 7 has (subgroup, then group, subclass, class): a Rendzine modale its subgroup row, a ferrallitic soil the row of class X, which names only the chapter; a category with no row on its chain says so, and ??? is shown as no RP equivalent (Hugo, 2026-11-04)."
  - topic: "Annex 7: the entries that name no reference"
    page: "pp. 396-397"
    reading: "Fersialsols calcaires ou saturés (p. 397) are read as the fersialsols carbonatés and calciques, the two references of the chapter with a calcium reserve; podzosols juvéniles, podzosols réductiques or rédoxiques, the arctic and alpine podzosols and the double podzosols-réductisols name the GER podzosols with the qualifier; réductisols humiques, à anmoor or épihistiques name the two réductisols references; luvisols-rédoxisols dégradés is the double luvisol dégradé-rédoxisol, luvisols-rédoxisols (VII/125) the double of any luvisol reference, and an entry that names only a chapter (pélosols, planosols, alocrisols, andosols ...) any reference of its GER; the divers solums réductiques name no reference, only the qualifier (Hugo, 2026-11-04)."
  - topic: "The labels of the RP 1995"
    page: "pp. VII, 37, 45, 51, 82, 104, 108, 208, 228, 239, 251, 284"
    reading: "The 13 references removed in 2008 (p. VII) read as the names of 2008 the book gives for such solums (legacy_rp1995.yaml), for benchmarks only; a reference of 1995 that keeps its name is read as the 2008 one. Where the book names no destination: the brunisols oligo-saturés are brunisols dystriques (S/CEC 20 to 50 %, under the 50 % of the eutriques, pp. 51, 104); the histosols recouverts any of the five histosols, recouverts par; the aluandosols and silandosols humiques any reference of their group, with no qualifier chosen between humique-fulvique and humique-mélanique (p. 82). A label is read by the longest name it starts with, whatever its case, accents or number, and a hyphen after a name opens the second part of a double (Hugo, 2026-11-04)."
