# The readings soilKey makes of the French Référentiel pédologique 2008 (AFES;
# Baize D., Girard M.-C. coord.; Éditions Quæ, 2009) where the text is silent
# or ambiguous. An entry ending "(Hugo, 2026-11-02)" is a decision of the
# owner, in soilKey's words; an entry ending "(soilKey's reading, for Hugo to
# confirm, 2026-11-02)" is soilKey's own and waits for his word. Pages are the
# printed pages of the book. The criteria are paraphrased; no text of the
# book is shipped.
readings:
  - topic: "Registry names and declared notations"
    page: "pp. 1-5"
    reading: "The RP will be the system rp2008, namespace rp, aliases rp and referentiel; site$designation_system declares its notation with rp, rp2008, rp1995, referentiel or afes (also spelled out: Référentiel pédologique, with or without 2008 or 1995). france, french and fr stay with the CPCS 1967, so nothing changes for those who use it (Q2) (Hugo, 2026-11-02)."
  - topic: "Recognising the notation"
    page: "pp. 1-5, 393"
    reading: "A profile is in the RP notation when declared, or when it has one symbol only the RP writes or two that it alone usually writes, and no symbol only the CPCS 1967 writes and no sign of the Russian notation; a profile with both is undecided: no designation is read as an RP code and both readings go to the evidence. The CPCS and FAO designations give hints through Annex 6 and the FAO letters; the data decide. Never by the country (Q9) (Hugo, 2026-11-02)."
  - topic: "The vocabulary"
    page: "pp. 1-5, 20, 331"
    reading: "A closed, case-sensitive vocabulary read by the longest match (Snd, And, Sdo, Sal, Femp, Kc, OXc before Sn, An, Sa, Fe, K, OX); Xc is the cobbly X and Dx a layer of mixed rocks; L, Na, Sa, the paleo pi and J are overlays, the suffixes are features; -c is indurated except in Kc (a code: continuous, not indurated), in Xc and after OF or OH (the mycogenic structure of Annex 1); the variants Vna and VNa, Vsa and VSa, Lav for LAv, OFz and OHz for OFzo and OHzo, OHmzo for OHfzo, Ypm as Yp with m, Snh as Sn with h, JZ and JZtc are read; FE is read as Fe only in a profile declared rp1995 or written with FEm, FEmp or Ahs. The CPCS and Russian readers do not change (default 12) (Hugo, 2026-11-02)."
  - topic: "Suffixes the book lists completely"
    page: "pp. 3-5, 26"
    reading: "Where the book gives the complete list of the horizons a suffix is written on (LC), the reader reads it only there: -a on E, G and g; -ca on C and the layers D, M, R; -cra on C, D and M; -d on BT and the S horizons; -m only as Ypm (Fem, Km, OXm and Sim are codes of their own); -nod on A, F, OX and RT; -t on S, C and FS. The suffixes of hard rocks -cri and -do are read on R and D, and -sch, -si and -vo also on M, which page 26 writes (Msch, Msi, Mvo). -zo, which the book gives by examples, is read like -noz only on the O horizons. A suffix outside these hosts leaves the designation unread, with a note; -j on FS and -ho on an O horizon are read with a note (pp. 180, Annex 4) (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "Ga and the other suffixed variants"
    page: "pp. 2-3, 318"
    reading: "Page 2 calls Ga a variant of G, page 3 lists it under the suffix -a: soilKey reads Ga, Ea and ga as G, E and g with the feature a, and the V variants Vk, Vy, Vs, VNa, VSa and Vg as V with features (Na and Sa are features only after V), so that the code stays the listed one and the data identification decides the variant. Go and Gr, Fox and Fhy, the five kinds of OX, Mma and Marg, and the O sub-horizons of Annex 1 (OLn, OLv, OLt, OFr, OFm, OHr, OHf) are codes of their own, with the listed code as their base (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "The frozen mark"
    page: "pp. 139-140"
    reading: "The cryosols chapter writes a frozen horizon -*: soilKey reads * as a suffix of any horizon (Jp*, H*), and -* written alone in a sequence (H and -*, p. 140) as the mark of a horizon the book does not name (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "Transitions written without the hyphen"
    page: "pp. 3, 127, 225-227"
    reading: "The book writes its transitions with a hyphen (A-S, S-C, B-C, C-M, Z-S) and sometimes without (BC in the luvisols, ACk and AS in the chernosols). A designation that is no code is read as a transition when it is one of the letters A, B, C, E or S followed by a code of the families A, B, C, E, S, M, R, D or Z (BC, AS, ACk, CM); B is read only in transitions. BTG, CG or SG are not transitions: reductic characters dominate and are not written so (p. 280) (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "Roman numerals"
    page: "pp. 4, 91, 234"
    reading: "A Roman numeral and a space before a code mark a lithological discontinuity (II S, III RT). Written without the space (IIRT, p. 234), II to IX are read so, but not V and X, which are codes (VSa is a vertic horizon, X a peyric one); an Arabic numeral 2 to 9 run into a code, as the FAO writes it, is read so too, with a note. A numeral written alone (Z/II, JZ/Z/II, p. 91, where the buried horizons are named only in words) is a lithological layer with no horizon written (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "Old codes"
    page: "pp. 1, 14"
    reading: "Ahs, FEm and FEmp are read as Aso, Fem and Femp in any profile read in the RP notation, with a note, and count as symbols only the RP writes (they are the RP of 1995); their presence makes FE the ferric Fe, as the default says. The lithosols sequence of p. 219 writes FEm, which is read as Fem. Ap is read as L (formerly Ap, p. 14) in a profile in the RP notation, but is no sign of the notation, since the CPCS and the FAO write it (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "The classes of symbols for the recognition"
    page: "pp. 1-5"
    reading: "Besides the strong and likely symbols of Q9: strong also Fox and Fhy, the kinds of OX (OXal, OXfl, OXfr, OXba, OXti), Mma and Marg, the O sub-horizons of Annex 1, J, Js or Jp before a material, L before any code (LH and LO with LA, LE, LS, LBT, LBP), and the suffixes no other notation writes (ho, nod, noz, zo, cra, cri, do, sch, si, vo, *); likely also Mt, TH, and Na and Sa written alone; ND is likely, not strong, since databases write ND for not determined. Two likely symbols are two kinds (Hf and Hm, K and Cca), not one written twice or with other suffixes (Cca and II Cca, BTg and BTgd), so that a Canadian profile with Cca and Ccak is not read as the RP (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "The CPCS A2 used as an E"
    page: "pp. 4, 393"
    reading: "The A2 of the CPCS is an E, the A2 of the RP the second sub-horizon of an A. An A2 counts as a symbol only the CPCS writes when it carries a suffix after the digit (A2g: the RP writes the digits last) or lies directly over a B of the CPCS ((B), B, B2, Bt, but not BT or BP); otherwise it is ambiguous (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "The sign of the Russian notation"
    page: "-"
    reading: "A profile has a sign of the Russian notation when the Russian reader (0.9.335) recognises it with no declaration: an index or a sign only the Russian notation of 2008 writes (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "The hints of other notations"
    page: "pp. 14, 18, 20-21, 393"
    reading: "Annex 6 is read through soilKey's patterns on the CPCS symbol (A1 and its sub-horizons A11, A12; Bt with or without g, x, d; (B) with v or Ca; Cca or Ca on a C ...), the first row that matches, with -g giving the feature g or the horizon g on any row; an A0 with neither F nor H gives OL, OF or OH, in brackets. The slips of the table (BTfe, FSj, Ha under A1) stay in the hints, noted. The FAO letters give the hints of soilKey's table in horizons.yaml (Oi OL, Oe OF, Oa OH; Hi, He, Ha Hf, Hm, Hs; Ap L, LA, LE, LS; Bt BT or FSt; Bw the S horizons; Bh BPh, Bs BPs; Bk K, Kc; Bkm Km; Bqm Sim; Bsm Femp; Bss V or SV; Bn NaBT or NaS; Ck Ck or K; Cr and Br G or Gr; L Mli ...), and the features b, g, x, y, cry and the frozen *. In a profile the CPCS reader recognises, Annex 6 comes first, otherwise the FAO letters; the other table when the first gives nothing (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "Writings of the sequences"
    page: "pp. 4, 342, 352"
    reading: "A sequence of the book is read with its horizons separated by '/', the alternatives of one position by '|' (the book's ou) and an optional horizon in parentheses; the parentheses of the table of humus forms (discontinuous horizons, p. 352) are read as optional, and its '//' (a discontinuity between O and A) as a mark between two horizons, not a horizon. A '/' inside one designation (BT1/BT2) reads as parts of one horizon, or as a transition between two (soilKey's reading, for Hugo to confirm, 2026-11-02)."
  - topic: "Text that is not UTF-8"
    page: "-"
    reading: "A designation that is not valid UTF-8 is read as Latin-1, the code page of most French files (the eszett of BTß); BTβ, with a Greek beta, is BTß (soilKey's reading, for Hugo to confirm, 2026-11-02)."
