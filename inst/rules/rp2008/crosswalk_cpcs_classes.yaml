# Annex 7 of the Référentiel pédologique 2008 (AFES; Baize D., Girard M.-C.
# coord.; Éditions Quæ, 2009), pp. 394-398: the possible correspondences
# between the categories of the CPCS 1967 and the RP 2008. The book says
# there is no one-to-one correspondence, the principles of the two systems
# differing: these are equivalents, not identities. Codes and names only.
# Read by rp2008_crosswalk("cpcs_classes") and shown beside a cpcs1967
# result in the report and the Pro app: a note for display, never evidence
# and never a test (Hugo's decision Q1).
#
# rows      one per row of the book, keyed by soilKey's cpcs1967 code of the
#           category (class I, subclass I-1, group I/11, subgroup I/111;
#           inst/rules/cpcs1967/). A cpcs1967 result is shown the row of the
#           most specific level of its chain that has one.
#   cpcs        the cpcs1967 code
#   cpcs_name   the CPCS category as the annex prints it
#   rp          the RP entries of the row, in the book's order (its "ou" and
#               its commas alike: any of them may fit):
#     name        the entry as printed, in lower case (names only)
#     references  the codes of the references it names (several: any of
#                 them, as "réductisols" names the réductisols typiques and
#                 stagniques)
#     ger         the code of the group of references (GER) it names when it
#                 names a chapter, not a reference
#     qualifiers  the qualifiers it adds, as printed
#     any_reference true when it names no reference (the book's "divers
#                 solums" with a qualifier)
#     double      true for a double attachment (the book's "double
#                 rattachement", written with a hyphen)
#     scope       soilKey's English note of the book's restriction ("some",
#                 "all ... etc.", "under tropical climates")
#     doubtful    true where the book prints "?"
#   open        true where the book ends the row with "etc."
#   none        true where the book prints "???": no RP equivalent
#   page        printed page
# new_in_rp  the categories of the RP 2008 the book calls completely new with
#            respect to the CPCS (p. 398), with their codes: a reference
#            (references) or a group (ger)

edition: "Référentiel pédologique 2008, Annex 7 (pp. 394-398)"

