  - {codes: [reductisols_typiques, thalassosols_juveniles], page: "305"}
  - {codes: [reductisols_typiques, thalassosols_polderises], page: "305"}
  - codes: [redoxisols, thalassosols_polderises]
    page: "285, 305"
    note: "a g or -g within 50 cm, the redox features continuing or intensifying: the double rédoxisol-thalassosol poldérisé (Q8)"
    when: {all_of: [{hydromorphy_rp: {kind: g, within: 50, min: 50}}]}
  # the salisols and sodisols with a G or g starting within 50 cm (pp.
  # 298-299: the salsodic reference, then the réductisol or rédoxisol, the
  # partner holding strictly: Hugo's decision 5)
