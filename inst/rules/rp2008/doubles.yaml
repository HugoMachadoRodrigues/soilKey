  - {codes: [sodisols_solonetziques, redoxisols], page: "298-299", when: {all_of: [{hydromorphy_rp: {kind: g, within: 50, min: 50}}]}}
  - {codes: [sodisols_solodises, reductisols_typiques], page: "298-299", when_degree: {reductisols_typiques: [simple]}}
  - {codes: [sodisols_solodises, reductisols_stagniques], page: "298-299", when_degree: {reductisols_stagniques: [simple]}}
  - {codes: [sodisols_solodises, redoxisols], page: "298-299", when: {all_of: [{hydromorphy_rp: {kind: g, within: 50, min: 50}}]}}
  - {codes: [sodisalisols, reductisols_typiques], page: "298-299", when_degree: {reductisols_typiques: [simple]}}
  - {codes: [sodisalisols, reductisols_stagniques], page: "298-299", when_degree: {reductisols_stagniques: [simple]}}
