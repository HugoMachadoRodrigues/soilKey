  - {codes: [salisodisols, reductisols_typiques], page: "298-299", when_degree: {reductisols_typiques: [simple]}}
  - {codes: [salisodisols, reductisols_stagniques], page: "298-299", when_degree: {reductisols_stagniques: [simple]}}
  - {codes: [salisodisols, redoxisols], page: "298-299", when: {all_of: [{hydromorphy_rp: {kind: g, within: 50, min: 50}}]}}
  # the vertisols with a permanent or prolonged waterlogging (p. 325)
  - {codes: [lithovertisols, reductisols_typiques], page: "325"}
