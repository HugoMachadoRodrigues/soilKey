  - {codes: [salisols_carbonates, redoxisols], page: "298-299", when: {all_of: [{hydromorphy_rp: {kind: g, within: 50, min: 50}}]}}
  - {codes: [sodisols_indifferencies, reductisols_typiques], page: "298-299", when_degree: {reductisols_typiques: [simple]}}
