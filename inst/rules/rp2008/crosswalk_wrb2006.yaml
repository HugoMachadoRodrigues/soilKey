# Annex 5 of the Référentiel pédologique 2008 (AFES; Baize D., Girard M.-C.
# coord.; Éditions Quæ, 2009), pp. 378-392: the possible correspondences
# between the references of the RP 2008 and the reference soil groups of the
# WRB 2006. Codes and names only, as the tables print them; the remarks of
# the annex are not shipped. Read by rp2008_crosswalk("wrb2006") and shown
# beside an RP result in the report and the Pro app: a note for display,
# never evidence and never a test (default 19, Hugo's decision Q1).
#
# The WRB is the 2006 edition the book cites, not soilKey's WRB 2022: a name
# here is the book's, and soilKey bridges nothing between the two editions.
#
# references   one row per reference of the list of pp. 402-403 (all 110),
#              plus the types the tables give a row of their own (brunisols
#              eutriques by their saturation, p. 380; lithosols stricts,
#              p. 385):
#   code       soilKey's code of the reference (key.yaml)
#   rp         the RP cell as printed, in lower case (a type when it names
#              qualifiers after the reference)
#   wrb2006    the WRB 2006 cell as printed; the book's French "ou" is
#              written "or" ("ou, à défaut," "or, failing that,", p. 387)
#              and its footnote marks are dropped; null where
#              the book writes that the WRB does not take the solum into
#              account
#   doubtful   true where the book prints "?" in the cell or asks a question
#              about it in a footnote: shown with the mark, never resolved
#              (a "?" printed inside the cell is kept there)
#   note       soilKey's English summary of the footnote or remark that
#              qualifies the row (never the book's sentence)
#   page       printed page
# horizons     the reference horizons the tables put beside a WRB 2006
#              diagnostic horizon (pp. 380, 383; the FAO and WRB letters of
#              the H horizons, p. 384)
# qualifiers   the tables of qualifiers: the anthroposols (p. 379), the
#              calcium chapter (p. 380; its one row "calcarique ou
#              pétrocalcarique" written as two), the five histosols (p. 385)
#              and the general table of pp. 391-392, "most often imperfect":
#              65 rows for 64 of the book. scope is the GER code of the
#              chapter whose table holds the row (anthroposols,
#              calcium_magnesium, histosols: the row holds for that chapter
#              only, Hugo's decision of 2026-11-04 for p. 380), or in the
#              general table the group the book names in parentheses, as
#              printed; wrb2006 as printed
# faux_amis    the WRB 2006 qualifiers spelled like an RP qualifier but with
#              another meaning (p. 392): never a stand-in for the RP
#              qualifier of the same name (default 6)

