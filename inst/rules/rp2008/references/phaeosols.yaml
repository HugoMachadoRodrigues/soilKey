# Phæosols (pp. 255-258), 2 references: very dark solums whose organic
# matter decreases gradually with depth (clinohumic), the S or BT saturated
# or nearly by Ca (S/CEC over 80 %), the surface clearly unsaturated under
# natural or permanent vegetation (S/CEC 50 to 80 %); close to the Phaeozems
# and roughly the brunizems of the CPCS (p. 255). The Aso (pp. 255-256):
# 30 to 50 cm thick, read as 30 cm or more with no maximum (map 4, D8;
# +/- 5), organic carbon over 1.2 % in the top 20 cm, moist chroma and value
# under 4 and their sum under 6, a fine blocky structure, not calcareous,
# under permanent vegetation S/CEC 50 to 80 % (+/- 5) and pH 5.5 to 6.5
# (+/- 0.2); cultivated (LAso, LAh) the complex is not tested (resaturated).
# It comes from the notation or the data (.rp_t_Aso()); the complex of the
# Aso is read again on the profile (sombric_complex_rp: the mean of its
# layers weighted by thickness, a written Aso with none recorded the
# author's reading; over 80 % undecided against the chernosols, D9; under
# 50 % the phæosol dystrique, an imperfect attachment, p. 257). The Sh, Sth
# and BTh (p. 256): non-calcareous, dark, organic carbon over 0.6 % in the
# heart of the horizon, S/CEC over 80 % (humic_under_rp: written with h, or
# read on the data). A thin pale E under 5 cm may lie between the Aso and
# the BTh (planosolisation); a well developed E excludes the GER (p. 256);
# K or Kc at depth, never Km. The climate (over 600 mm, 9 to 17 degrees C)
# is reported, not tested (D10).
#
# Distinctions (pp. 257-258): the chernosols by an Ach (the horizon frame)
# and a saturated complex; E, Eh or Eg over 5 cm over a BTh: a grisol
# éluvique or dégradé (Ah or LAh/Eh/BTh or BThd; precedence.yaml) or a
# planosol typique mélanoluvique (A/Eg/BThg, IDT over 2, an abrupt
# transition); intergrades to the sodisols, brunisols, vertisols and
# andosols. An Eh or a BTh bars the luvisols (Hugo's decision 7 of the
# review of 0.9.349): such solums come here.
scope: &ph_scope
  all_of:
    - thickness_rp: {codes: [Aso], min: 30, from_surface: true}
    - sombric_complex_rp: {}
    - no_horizon_within_rp: {codes: [Km]}
    - thickness_rp: {codes: [E], max: 5, open: true}
references:
  - code: "phaeosols_hapliques"
    ger: "phaeosols"
    name: "phæosols hapliques"
    name_singular: "phæosol haplique"
    name_en: "haplic phaeosols"
    name_en_singular: "haplic phaeosol"
    page: "256-257"
    sequences: ["Aso|LAso-Sh-K|Kc|C"]
    notes: "No or little illuviation of the organo-clay complexes; the texture differentiation index under 1.3 (for homogeneous materials), the Aso against the Sh under it; non-humic BT of an older phase may lie under the Sh."
    wrb2006: "Haplic Phaeozems"
    distinctions:
      - {with: "phæosols mélanoluviques", page: "257", by: "an Sh, not a BTh, and IDT under 1.3 (side test)"}
      - {with: "chernosols", page: "257", by: "an Aso, not an Ach, S/CEC 50 to 80 % (the horizon frame; D9)"}
      - {with: "grisols", page: "258", by: "an E over 5 cm (side test; precedence.yaml)"}
    tests:
      all_of:
        - *ph_scope
        - sequence_rp: {sequences: ["Aso-S-(K|C|M)"]}
        - humic_under_rp: {codes: ["S="]}
        - idt_rp: {upper: [Aso], lower: ["S="], max: 1.3, open: true, adjacent: true}
    imperfect:
      - qualifier: "dystrique"
        page: "257"
        criterion: "the Aso with S/CEC under 50 %"
        tests:
          all_of:
            - thickness_rp: {codes: [A], min: 30, from_surface: true}
            - sombric_complex_rp: {dystric: true}
            - no_horizon_within_rp: {codes: [Km]}
            - thickness_rp: {codes: [E], max: 5, open: true}
            - humic_under_rp: {codes: ["S="], upper: [A]}
            - idt_rp: {upper: [A], lower: ["S="], max: 1.3, open: true, adjacent: true}
  - code: "phaeosols_melanoluviques"
    ger: "phaeosols"
    name: "phæosols mélanoluviques"
    name_singular: "phæosol mélanoluvique"
    name_en: "melanoluvic phaeosols"
    name_en_singular: "melanoluvic phaeosol"
    page: "257"
    sequences: ["Aso|LAso-BTh-K|Kc|C"]
    notes: "A marked illuviation of the organo-clay complexes: a BTh with many organo-clay coatings, more clay than the Aso; the texture differentiation index 1.3 to 3 with a gradual Aso/BTh transition, 1.3 to 2 with an abrupt one; non-humic BT may lie under the BTh."
    wrb2006: "Luvic Phaeozems"
    distinctions:
      - {with: "phæosols hapliques", page: "257", by: "a BTh and IDT 1.3 or more (side test)"}
      - {with: "planosols typiques", page: "258", by: "an Eg over 5 cm, IDT over 2 and an abrupt transition (side test)"}
      - {with: "grisols", page: "258", by: "an E over 5 cm (side test; precedence.yaml)"}
    tests:
      all_of:
        - *ph_scope
        - sequence_rp: {sequences: ["Aso-BT-(K|C|M)"]}
        - humic_under_rp: {codes: [BT]}
        - any_of:
            - idt_rp: {upper: [Aso], lower: [BT], min: 1.3, max: 2, adjacent: true}
            - all_of:
                - idt_rp: {upper: [Aso], lower: [BT], min: 1.3, max: 3, adjacent: true}
                - none_of:
                    - boundary_rp: {upper: [Aso, E]}
    imperfect:
      - qualifier: "dystrique"
        page: "257"
        criterion: "the Aso with S/CEC under 50 %"
        tests:
          all_of:
            - thickness_rp: {codes: [A], min: 30, from_surface: true}
            - sombric_complex_rp: {dystric: true}
            - no_horizon_within_rp: {codes: [Km]}
            - thickness_rp: {codes: [E], max: 5, open: true}
            - humic_under_rp: {codes: [BT], upper: [A]}
            - any_of:
                - idt_rp: {upper: [A], lower: [BT], min: 1.3, max: 2, adjacent: true}
                - all_of:
                    - idt_rp: {upper: [A], lower: [BT], min: 1.3, max: 3, adjacent: true}
                    - none_of:
                        - boundary_rp: {upper: [A, E]}
