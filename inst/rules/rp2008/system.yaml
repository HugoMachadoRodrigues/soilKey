source: |
  The definitions of the reference horizons (pp. 6-28), the tolerances
  (p. 64), the rapid key (pp. 66-68) and the chapters of the references
  (pp. 69-290 in this release). The RP gives no key: every reference is
  tested, and the choice of one main name among those that attach is
  soilKey's (precedence.yaml, doubles.yaml, readings.yaml).
