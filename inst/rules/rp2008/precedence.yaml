# The precedence of the Référentiel pédologique 2008 among the references
# that attach the same solum, for the one main name soilKey gives (Hugo's
# decision Q6): first the explicit statements of the chapters, below, each
# with its page; then the degree (simple, simple or imperfect, imperfect,
# undecided); then the order of the rapid key (rapid_key.yaml: entries 1 to
# 10 as numbered, then 11 and 12; the references of a GER in the book's
# order). `first` before `second` when both are candidates and `when` (a
# test block, TRUE when absent) holds; `second: "*"` or `first: "*"` stands
# for every other reference. The exclusions remove a reference from the
# candidates when another attaches. The choice of one name is a convention
# of soilKey: the book allows several attachments (p. XIV).
precedence:
  - first: "*"
    second: colluviosols
    page: "132-133"
    note: "a colluviosol as long as no other reference's characteristic solum is diagnosed; the other reference takes the name, with the qualifier colluvial (Q14)"
  - first: calcarisols
    second: [rendosols, calcosols, dolomitosols, rendisols, calcisols, magnesisols]
    page: "113, 122"
    note: "an A under 35 cm on a Kc or Km is a calcarisol, whatever the A (the table of p. 122), when the calcarisol attaches strictly: a Km within tolerance is a calcosol pétrocalcarique (p. 113; the review's D9)"
    when:
      any_of:
        - all_of:
            - horizon_within_rp: {codes: [Kc], depth: 35}
            - thickness_rp: {codes: [Kc], min: 10}
        - all_of:
            - horizon_within_rp: {codes: [Km], depth: 35}
            - thickness_rp: {codes: [Km], min: 5}
  - first: arenosols
    second: [rendosols, calcosols, dolomitosols]
    page: "116"
    note: "single-grain sands in calcareous or dolomitic sands are arénosols, never rendosols, calcosols or dolomitosols: the A not biomacrostructured (the review's D9)"
    when:
      none_of:
        - biomacro_rp: {codes: [A]}
  - first: brunisols_eutriques
    second: calcisols
    page: "107, 112, 116"
    note: "no carbonate reserve recorded: the brunisol eutrique saturé takes the name, the calcisol stays a candidate (Q16)"
    when:
      none_of:
        - carbonate_reserve_rp: {}
  - first: magnesisols
    second: brunisols_eutriques
    page: "68, 109, 113"
    note: "a complex dominated by magnesium (Ca/Mg under 2) is the calcium and magnesium GER's (rapid key 12), not a brunisol's (11: not dominated by calcium); the reserve of Q16 separates only the calcisols (soilKey's reading)"
  - first: silandosols_perhydriques
    second: [silandosols_eutriques, silandosols_dystriques]
    page: "81, 83"
    note: "perhydric first, eutric or dystric as a qualifier (the types of p. 83; default 21), when the perhydric test holds (the review's D2)"
    when:
      all_of:
        - attribute_thickness_rp: {attribute: water_content_1500kpa_undried, threshold: 100, direction: min, codes: [And, Snd], within: 100, min: 35}
  - first: aluandosols_perhydriques
    second: aluandosols_hapliques
    page: "81-82"
    note: "perhydric first, as the silandosols, when the perhydric test holds (the review's D3)"
    when:
      all_of:
        - attribute_thickness_rp: {attribute: water_content_1500kpa_undried, threshold: 100, direction: min, codes: [Alu, Slu], within: 100, min: 35}
  - first: cryosols_mineraux
    second: "*"
    except: [cryosols_histiques]
    page: "66, 140-141"
    note: "with the permafrost within 200 cm a mineral cryosol takes the name, also imperfect when the cryoturbation is not recorded (rapid key 3; Hugo's decision 1, 2026-11-03)"
    when:
      all_of:
        - permafrost_rp: {depth: 200}
  - first: anthroposols_construits
    second: anthroposols_artificiels
    page: "91-94"
    note: "a technological material built on purpose: the construction recorded in rp_anthropic_history (soilKey's reading)"
    when:
      all_of:
        - recorded_rp: {field: rp_anthropic_history, pattern: "constru"}
  # --- the GER of part 5 (v0.9.348) ---------------------------------------------------
  # the hardness precedence of the ferrallitisols and oxydisols (p. 157; D3):
  # the hardest horizon within 120 cm sets the reference, OXm before OXc
  # before ND before none, each when its horizon lies strictly within 120 cm
  - first: [ferrallitisols_petroxydiques, oxydisols_petroxydiques]
    second: [ferrallitisols_duroxydiques, ferrallitisols_nodulaires, oxydisols_nodulaires, ferrallitisols_meubles, oxydisols_meubles]
    page: "157-161"
    note: "the hardest horizon within 120 cm sets the reference: an OXm, pétroxydique (D3)"
    when: {all_of: [{horizon_within_rp: {codes: [OXm], depth: 120}}]}
  - first: ferrallitisols_duroxydiques
    second: [ferrallitisols_nodulaires, oxydisols_nodulaires, ferrallitisols_meubles, oxydisols_meubles]
    page: "157-161"
    note: "an OXc and no OXm within 120 cm: duroxydique, before the nodulaires; there is no oxydisol duroxydique (D3, D5, R2)"
    when: {all_of: [{horizon_within_rp: {codes: [OXc], depth: 120}}]}
  - first: [ferrallitisols_nodulaires, oxydisols_nodulaires]
    second: [ferrallitisols_meubles, oxydisols_meubles]
    page: "157-161"
    note: "an ND within 120 cm: nodulaire, not meuble (D3)"
    when: {all_of: [{horizon_within_rp: {codes: [ND], depth: 120}}]}
  - first: fluviosols_bruts
    second: regosols
    page: "188"
    note: "in an alluvial setting the fluviosols bruts, not the régosols"
  - first: [grisols_eluviques, grisols_degrades, grisols_hapliques]
    second: [chernosols_melanoluviques, chernosols_typiques, phaeosols_hapliques, phaeosols_melanoluviques]
    page: "194"
    note: "an Aso not saturated, an Eh, the degradation of the ped faces, the unsaturation of the whole solum: a grisol before the chernosols and the phaeosols (Q6)"
  # --- the GER of part 6 (v0.9.349) ---------------------------------------------------
  - first: [ferrallitisols_petroxydiques, ferrallitisols_duroxydiques, oxydisols_petroxydiques, ferruginosols_petroxydiques]
    second: lithosols
    page: "159-161, 175, 219"
    note: "a cuirasse or carapace within 10 cm with the horizons of the tropical chapter under it within 120 cm (F, OX, ND, RT, FE, an Ea or a BT; the ferruginosols pétroxydiques tronqués OXm/Ea/BTg of p. 175): the reference of the chapter, not a lithosol pétroxydique or duroxydique (Hugo's decision 3, 2026-11-04)"
    when: {all_of: [{under_rp: {upper: [OXm, OXc], codes: [F, "OX=", OXal, OXfl, OXfr, OXba, OXti, ND, RT, FE, Ea, BT], within: 120}}]}
  - first: [ferrallitisols_meubles, ferrallitisols_nodulaires, ferrallitisols_petroxydiques, ferrallitisols_duroxydiques]
    second: nitosols
    page: "157, 235-236"
    note: "an F horizon with the Sn: a ferrallitisol (the type polylithique A/Sn/F/II Sn/II F, rejuvenated by volcanic deposits, p. 157)"
    when: {all_of: [{horizon_within_rp: {codes: [F]}}]}
  - first: [grisols_eluviques, grisols_degrades, grisols_hapliques]
    second: [neoluvisols, luvisols_typiques]
    page: "194"
    note: "a dark, humic Aso, an Eh, a BTh: a grisol before the néoluvisols and the luvisols typiques"
  - first: cryosols_histiques
    second: [histosols_fibriques, histosols_mesiques, histosols_sapriques, histosols_composites, histosols_leptiques]
    page: "211"
    note: "H horizons and a permafrost starting within 2 m: a cryosol histique"
    when: {all_of: [{permafrost_rp: {depth: 200}}]}
  - first: lithosols
    second: histosols_leptiques
    page: "207, 209, 211"
    note: "H horizons of 10 cm or less over R: a lithosol épihistique"
    when:
      all_of:
        - thickness_rp: {codes: [H], max: 10}
        - below_rp: {upper: [H], codes: [R]}
  - first: regosols
    second: histosols_leptiques
    page: "209, 211"
    note: "H horizons of 10 cm or less over M, D or a C read as the M: a régosol épihistique (0.9.352)"
    when:
      all_of:
        - thickness_rp: {codes: [H], max: 10}
        - below_rp: {upper: [H], codes: [M, D, C]}
  - first: [reductisols_typiques, reductisols_stagniques]
    second: [histosols_fibriques, histosols_mesiques, histosols_sapriques, histosols_composites, histosols_leptiques]
    page: "208-209"
    note: "H horizons under 50 cm over G: a réductisol épihistique"
    when:
      all_of:
        - thickness_rp: {codes: [H], max: 50, open: true}
        - below_rp: {upper: [H], codes: [G]}
  - first: leptismectisols
    second: [lithovertisols, topovertisols, paravertisols_hapliques, paravertisols_planosoliques]
    page: "67, 217-218"
    note: "no V horizon: a leptismectisol, not a vertisol (the lithovertisols have the V; rapid key 6c needs it)"
    when:
      none_of:
        - horizon_within_rp: {codes: [V], depth: 100}
  - first: luvisols_tronques
    second: [luvisols_typiques, neoluvisols]
    page: "227"
    note: "under forest no E over 10 cm: a luvisol tronqué, the typique or néoluvisol a candidate (Hugo's decision 8, 2026-11-04)"
    when:
      all_of:
        - none_of:
            - horizon_within_rp: {codes: ["L+", L], depth: 10}
        - thickness_rp: {codes: [E], max: 10}
  - first: luvisols_derniques
    second: luvisols_degrades
    page: "226-227"
    note: "an Ea directly on the BTd and the index over 1.8: a luvisol dernique (D9)"
    when: {all_of: [{below_rp: {upper: [Ea], codes: [BTd]}}]}
  - first: nitosols
    second: [brunisols_eutriques, brunisols_dystriques]
    page: "236"
    note: "a nitic Sn, not a typical S: a nitosol"
    when: {all_of: [{horizon_within_rp: {codes: [Sn]}}]}
  - first: [brunisols_eutriques, brunisols_dystriques]
    second: [organosols_holorganiques, organosols_calcaires, organosols_satures, organosols_insatures]
    page: "240"
    note: "organo-mineral S horizons over 10 cm: a brunisol (hémiorganique)"
    when: {all_of: [{thickness_rp: {codes: ["S="], min: 10, open: true}}]}
  - first: [calcosols, calcisols]
    second: [organosols_holorganiques, organosols_calcaires, organosols_satures, organosols_insatures]
    page: "241"
    note: "an Sca or Sci over 10 cm: a calcosol or calcisol (hémiorganique)"
    when: {all_of: [{thickness_rp: {codes: [Sca, Sci], min: 10, open: true}}]}
  - first: alocrisols_humiques
    second: [organosols_holorganiques, organosols_calcaires, organosols_satures, organosols_insatures]
    page: "241"
    note: "a Sal over 10 cm under O or Aho: an alocrisol humique, the organosol a candidate (Hugo's decision 5, 2026-11-04)"
    when: {all_of: [{thickness_rp: {codes: [Sal], min: 10, open: true}}]}
  - first: organosols_insatures
    second: alocrisols_humiques
    page: "241"
    note: "a Sal under 10 cm under O or Aho: an organosol insaturé, the alocrisol a candidate (Hugo's decision 5, 2026-11-04)"
    when: {all_of: [{thickness_rp: {codes: [Sal], max: 10, open: true}}]}
  - first: [podzosols_ocriques, podzosols_meubles, podzosols_duriques, podzosols_humiques, podzosols_humo_duriques, podzosols_placiques, post_podzosols]
    second: [organosols_holorganiques, organosols_calcaires, organosols_satures, organosols_insatures]
    page: "241"
    note: "E and BP over 10 cm under O or Aho: a podzosol, whichever attaches (Hugo's decision 8 on the review of 0.9.351, 2026-11-04)"
    when: {all_of: [{thickness_rp: {codes: [E, BP], min: 10, open: true}}]}
  - first: [organosols_calcaires, organosols_satures]
    second: [rendosols, calcosols, rendisols, calcisols]
    page: "241"
    note: "an Acaho or Aciho with OF and OH over 40 cm and no other horizon: an organosol calcaire or saturé"
    when:
      all_of:
        - thickness_rp: {codes: [OF, OH, OHta, Acaho, Aciho], min: 40, open: true}
        - none_of:
            - horizon_within_rp: {codes: [S, E, BT, BP]}
  # --- the GER of part 7 (v0.9.351) ---------------------------------------------------
  - first: pelosols_differencies
    second: [planosols_typiques, planosols_distaux, planosols_structuraux]
    page: "244, 247, 263"
    note: "[Ae + E] or LE of 30 cm or less over an Sp: a pélosol différencié, not a planosol"
  - first: [planosols_typiques, planosols_distaux]
    second: planosols_structuraux
    page: "260-261"
    note: "the characters of the textural planosols: typique or distal; structural only with little or no texture differentiation"
  - first: [planosols_typiques, planosols_distaux]
    second: [luvisols_degrades, luvisols_derniques]
    page: "227, 230"
    note: "luvisols dégradés or derniques very planosolic, with the characters of the textural planosols: planosols"
  # the podzosols in soilKey's order (map 4, D11): post-podzosols, placiques,
  # then the others, which their tests keep apart
  - first: post_podzosols
    second: [podzosols_ocriques, podzosols_meubles, podzosols_duriques, podzosols_humiques, podzosols_humo_duriques, podzosols_eluviques, podzosols_placiques]
    page: "271"
    note: "a ploughed horizon on the BP: a post-podzosol (D11)"
  - first: podzosols_placiques
    second: [podzosols_ocriques, podzosols_meubles, podzosols_duriques, podzosols_humiques, podzosols_humo_duriques]
    page: "270"
    note: "a placic Femp with the BP: a podzosol placique (D11)"
  - first: [histosols_fibriques, histosols_mesiques, histosols_sapriques, histosols_composites]
    second: [reductisols_typiques, reductisols_stagniques]
    page: "209, 211"
    note: "H over 50 cm with a G under it: a histosol (réductique, a qualifier, the figure of p. 209), the réductisol a candidate; no double (Hugo's decision 2 on the review of 0.9.351, 2026-11-04)"
    when: {all_of: [{thickness_rp: {codes: [H], min: 50, open: true}}]}
  - first: [phaeosols_hapliques, phaeosols_melanoluviques]
    second: [brunisols_eutriques, brunisols_dystriques]
    page: "257"
    note: "an Aso of 30 cm or more: the phæosol, also dystrique or within the tolerance, before a brunisol (Hugo's decision 4 on the review of 0.9.351, 2026-11-04)"
    when: {all_of: [{thickness_rp: {codes: [A], min: 30, from_surface: true}}]}
  - first: rankosols
    second: [podzosols_ocriques, podzosols_meubles, podzosols_duriques, podzosols_humiques, podzosols_humo_duriques, podzosols_placiques, post_podzosols]
    page: "272, 276"
    note: "a BP of 5 cm or less in a rankosol is not counted: the rankosol (map 4, D14)"
    when: {all_of: [{thickness_rp: {codes: [BP], max: 5}}]}
  - first: luvisols_typiques
    second: [podzosols_ocriques, podzosols_meubles, podzosols_duriques, podzosols_humiques, podzosols_humo_duriques, podzosols_placiques]
    page: "273"
    note: "a podzolic episolum [A + E + BP] under 20 cm over the luvisol: a luvisol typique à micropodzol"
    when: {all_of: [{podzolic_episolum_rp: {max: 20}}]}
  # peyric horizons over 50 cm from the surface: the peyrosol whatever the
  # context, simply or in a double (p. 253)
  - first: peyrosols
    second: "*"
    except: [cryosols_mineraux, cryosols_histiques, thiosols, sulfatosols]
    page: "253"
    note: "peyric horizons over 50 cm from the surface: a peyrosol, simply or in a double, whatever the context, a reductic solum too (Hugo's decision 6, 2026-11-04)"
    when: {all_of: [{peyric_rp: {min: 50}}]}
  # the hydromorphy (Q8, Q13; Hugo's default 20)
  - first: [reductisols_typiques, reductisols_stagniques]
    second: "*"
    except: [cryosols_mineraux, cryosols_histiques, peyrosols, thiosols, sulfatosols]
    page: "282, 289; 107"
    note: "a G starting within 50 cm makes a réductisol whatever lies above (default 20, D22); the doubles of doubles.yaml are still written"
    when: {all_of: [{hydromorphy_rp: {kind: G, within: 50}}]}
  - first: [planosols_typiques, planosols_structuraux]
    second: redoxisols
    page: "263, 285"
    note: "the planosols typiques and structuraux are redox by definition: no double with the rédoxisols"
  - first: pelosols_differencies
    second: redoxisols
    page: "285"
    note: "the pélosols différenciés include the redox horizons within 50 cm: no double"
  - first: "*"
    second: redoxisols
    except: [colluviosols, fluviosols_bruts, fluviosols_juveniles, fluviosols_typiques, fluviosols_brunifies, brunisols_eutriques, brunisols_dystriques, cryosols_mineraux, cryosols_histiques]
    page: "282, 285"
    note: "other important horizons (E, BT, BP, Sp) with the redox features: the double the book names (doubles.yaml), else the other reference takes the name and the rédoxisol is a candidate (soilKey's reading of p. 285 under Q7)"
    when: {all_of: [{horizon_within_rp: {codes: [E, BT, BP, Sp]}}]}
  - first: redoxisols
    second: [fluviosols_bruts, fluviosols_juveniles, fluviosols_typiques, fluviosols_brunifies]
    page: "184, 187-188"
    note: "redox features from under 50 cm over 50 cm in alluvium: the rédoxisol fluvique in the name, the double fluviosol-rédoxisol among the candidates (Q8)"
    when: {all_of: [{hydromorphy_rp: {kind: g, within: 50, min: 50}}]}
  - first: redoxisols
    second: [brunisols_eutriques, brunisols_dystriques]
    page: "107"
    note: "a -g within 50 cm with no aerated S over it: the rédoxisol (the double brunisol-rédoxisol of doubles.yaml otherwise)"
    when: {all_of: [{hydromorphy_rp: {kind: g, within: 50, min: 50}}]}
  # --- the GER of part 8 (v0.9.352) ---------------------------------------------------
  # the peyrosols take a solum whatever the context (p. 253), but in every
  # case sulfur at a shallow depth attaches it first to the thiosols or
  # sulfatosols (p. 310): they are kept out of the peyrosol and reductisol
  # rows above, and the pair below puts them first
  - first: [fluviosols_juveniles, thalassosols_bruts, thalassosols_juveniles]
    second: regosols
    page: "188, 291"
    note: "very recent alluvial or marine deposits are no régosols: the fluviosols juvéniles and the thalassosols bruts or juvéniles (soilKey's reading of p. 291, as the fluviosols bruts of p. 188)"
  - first: arenosols
    second: regosols
    page: "101, 292"
    note: "an organo-mineral top over 10 cm, with its organic matter and biological activity: an arénosol, not a régosol sableux"
    when: {all_of: [{thickness_rp: {codes: [A], min: 10, open: true, from_surface: true}}]}
  - first: [thiosols, sulfatosols]
    second: [salisols_chloruro_sulfates, salisols_carbonates, sodisols_indifferencies, sodisols_solonetziques, sodisols_solodises, sodisalisols, salisodisols, reductisols_typiques, reductisols_stagniques, redoxisols, thalassosols_bruts, thalassosols_juveniles, thalassosols_polderises, fluviosols_bruts, fluviosols_juveniles, fluviosols_typiques, fluviosols_brunifies, peyrosols]
    page: "253, 299, 310"
    note: "sulfur at a shallow depth with a dry pH under 3.5: the thiosols or sulfatosols first, in every case, before the peyrosols too (a salisol with their characters is a sulfatosol or thiosol salique, D11; Hugo's decision 6)"
  - first: [lithovertisols, topovertisols, paravertisols_hapliques, paravertisols_planosoliques]
    second: [salisols_chloruro_sulfates, salisols_carbonates, sodisols_indifferencies, sodisols_solonetziques, sodisols_solodises, sodisalisols, salisodisols]
    page: "299, 318, 324"
    note: "a vertisol with a VSa or VNa: the vertisol salique or sodique, the salisol or sodisol a candidate (Q20)"
  - first: [lithovertisols, topovertisols, paravertisols_hapliques, paravertisols_planosoliques]
    second: [planosols_typiques, planosols_distaux, planosols_structuraux]
    page: "323, 325"
    note: "the SV and V still there: the vertisol (a paravertisol planosolique is a first stage towards the planosols typiques vertiques; soilKey's reading)"
  - first: veracrisols
    second: luvisols_tronques
    page: "315-316"
    note: "a vermihumic Ah of 30 cm or more: the veracrisol, also leptique, before a luvisol tronqué (the paléoluvique veracrisols derive from the luvisols; Hugo's decision 1)"
    when: {all_of: [{vermihumic_rp: {min: 30}}]}
  - first: [sodisols_solonetziques, sodisols_solodises, sodisols_indifferencies]
    second: [neoluvisols, luvisols_typiques, luvisols_degrades, luvisols_derniques, luvisols_tronques, quasi_luvisols]
    page: "68, 297"
    note: "a sodic BT: the sodisol, not a luvisol (the rapid key, 6i before 11b; the review's D6)"
    when: {all_of: [{horizon_within_rp: {codes: [NaBT], depth: 60}}]}
  - first: paravertisols_planosoliques
    second: paravertisols_hapliques
    page: "323"
    note: "an E or Eg between the surface horizon and the SV: the paravertisol planosolique (Q20: planosolique, haplique, then litho or topo)"
exclusions:
  - code: brunisols_eutriques
    by: calcisols
    page: "107, 112, 116"
    note: "a carbonate reserve recorded (in the C, R, M or D, a calcareous rock or parent material): a calcisol, not a brunisol eutrique saturé (Q16)"
    when:
      all_of:
        - carbonate_reserve_rp: {}
  - code: arenosols
    by: rendosols
    page: "116"
    note: "a biomacrostructured Aca is no single-grain sand: a rendosol, not an arénosol (the review's D9)"
    when: {all_of: [{biomacro_rp: {codes: [A]}}]}
  - code: arenosols
    by: calcosols
    page: "116"
    note: "a biomacrostructured A over Sca: a calcosol, not an arénosol (the review's D9)"
    when: {all_of: [{biomacro_rp: {codes: [A]}}]}
  - code: arenosols
    by: dolomitosols
    page: "116"
    note: "a biomacrostructured Ado: a dolomitosol, not an arénosol (the review's D9)"
    when: {all_of: [{biomacro_rp: {codes: [A]}}]}
  - code: salisols_chloruro_sulfates
    by: arenosols
    page: "102, 298"
    note: "too coarse for a saturated paste: an arénosol salin, never a salisol or a sodisol"
    when: {any_of: [{horizon_within_rp: {codes: ["Sa+", "Na+"], depth: 60}}]}
  - code: salisols_carbonates
    by: arenosols
    page: "102, 298"
    note: "too coarse for a saturated paste: an arénosol salin, never a salisol or a sodisol"
