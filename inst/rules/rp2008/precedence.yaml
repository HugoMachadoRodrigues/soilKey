# The precedence of the Référentiel pédologique 2008 among the references
# that attach the same solum, for the one main name soilKey gives (Hugo's
# decision Q6): first the explicit statements of the chapters, below, each
# with its page; then the degree (simple, simple or imperfect, imperfect,
# undecided); then the order of the rapid key (rapid_key.yaml: entries 1 to
# 10 as numbered, then 11 and 12; the references of a GER in the book's
# order). `first` before `second` when both are candidates and `when` (a
# test block, TRUE when absent) holds; `second: "*"` or `first: "*"` stands
# for every other reference. The exclusions remove a reference from the
# candidates when another attaches. The choice of one name is a convention
# of soilKey: the book allows several attachments (p. XIV).
precedence:
  - first: "*"
    second: colluviosols
    page: "132-133"
    note: "a colluviosol as long as no other reference's characteristic solum is diagnosed; the other reference takes the name, with the qualifier colluvial (Q14)"
  - first: calcarisols
    second: [rendosols, calcosols, dolomitosols, rendisols, calcisols, magnesisols]
    page: "122"
    note: "an A under 35 cm on a Kc or Km is a calcarisol, whatever the A (the table of p. 122)"
  - first: arenosols
    second: [rendosols, calcosols, dolomitosols]
    page: "116"
    note: "single-grain sands in calcareous or dolomitic sands are arénosols, never rendosols, calcosols or dolomitosols"
  - first: brunisols_eutriques
    second: calcisols
    page: "107, 112, 116"
    note: "no carbonate reserve recorded: the brunisol eutrique saturé takes the name, the calcisol stays a candidate (Q16)"
    when:
      none_of:
        - carbonate_reserve_rp: {}
  - first: magnesisols
    second: brunisols_eutriques
    page: "68, 109, 113"
    note: "a complex dominated by magnesium (Ca/Mg under 2) is the calcium and magnesium GER's (rapid key 12), not a brunisol's (11: not dominated by calcium); the reserve of Q16 separates only the calcisols (soilKey's reading)"
  - first: silandosols_perhydriques
    second: [silandosols_eutriques, silandosols_dystriques]
    page: "81, 83"
    note: "perhydric first, eutric or dystric as a qualifier (the types of p. 83; default 21)"
  - first: anthroposols_construits
    second: anthroposols_artificiels
    page: "91-94"
    note: "a technological material built on purpose: the construction recorded in rp_anthropic_history (soilKey's reading)"
    when:
      all_of:
        - recorded_rp: {field: rp_anthropic_history, pattern: "constru"}
exclusions:
  - code: brunisols_eutriques
    by: calcisols
    page: "107, 112, 116"
    note: "a carbonate reserve recorded (in the C, R, M or D, a calcareous rock or parent material): a calcisol, not a brunisol eutrique saturé (Q16)"
    when:
      all_of:
        - carbonate_reserve_rp: {}
