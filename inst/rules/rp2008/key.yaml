# The Référentiel pédologique 2008 (AFES; Baize D., Girard M.-C. coord.;
# Éditions Quæ, 2009): the catalogue of its 34 groups of references (GER,
# one per chapter) and 110 references (list of pp. 402-403). The RP is not a
# key: it has two categories, references and types (p. XI); the GER is an
# editorial grouping with no hierarchical weight (p. XIII), kept by soilKey
# as a label of each reference (Hugo's decision Q1). Codes are ASCII slugs of
# the printed names (default 2); names as printed, the plural of the list.
#
# The references of the GER marked implemented are tested by
# classify_rp2008() from references/<ger>.yaml (28 GER, 92 references since
# v0.9.351); `first_draft` marks the three tropical chapters the book calls a
# first version (p. VI; Q18: their results say so), `result_note` what a
# result of the GER reports and does not test. The others come in later
# releases: their references are not tested, and their `signpost` (the
# reference horizons or materials of the chapter, soilKey's, never a test of
# the reference) puts the GER among the candidates as not implemented yet,
# undecided, when the profile shows them, so that no profile is attached
# elsewhere without saying so.
version: "Référentiel pédologique 2008"
source: "Baize D., Girard M.-C. (coord.) (2009). Référentiel pédologique 2008. AFES, Éditions Quæ. List of the references, pp. 402-403; the chapters, pp. 69-326."
