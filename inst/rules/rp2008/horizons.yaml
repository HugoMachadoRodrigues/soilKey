  - {mark: "π",  page: 4, name: "paléo-", name_en: "palaeo (a relict horizon)", examples: ["πBT", "πBPh", "πRT"]}
  - {mark: "J",  page: 25, name: "jeune (dans un matériau)", name_en: "young horizon formed in a material", only_before: "Z", examples: ["JZ", "JZtc"], note: "Pages 91 and 94 write J before an anthropic material; Js and Jp too (JsZ, JpZ, p. 90)."}

# Suffixes (pp. 3-5, 139, 318), read as features of the horizon, by the
# longest match. hosts: the codes the book writes them on, where it gives a
# complete list (LC) or restricts them, a variant counting as its listed code
# (OFr as OF); absent = any horizon. A mark is not written twice (Sgg), nor
# -c or -m after a code that says indurated (Kcc, OXmc).
# meanings: the reading where it depends on the host.
suffixes:
  - {mark: "b",   page: 3, name: "horizon enfoui", name_en: "buried under more than 50 cm of deposit"}
  - {mark: "cry", page: 3, name: "très cryoturbé", name_en: "strongly cryoturbated"}
  - {mark: "g",   page: 3, name: "à caractère rédoxique", name_en: "redox character"}
  - {mark: "h",   page: 3, name: "plus humifère que la norme", name_en: "more humic than the norm"}
  - {mark: "*",   page: 139, name: "horizon gelé", name_en: "frozen", note: "Cryosols chapter (p. 139), written -*."}
  - {mark: "a",   page: 3, name: "albique", name_en: "albic", hosts: ["E", "G", "g"]}
  - {mark: "c",   page: 3, name: "induré", name_en: "indurated", meanings: {O: "mycogenic (fibrous) structure (Annex 1, p. 331)"}, note: "Kc and Xc are codes of their own (p. 3, p. 20); after OF or OH, c is the mycogenic structure (Annex 1)."}
  - {mark: "ca",  page: 3, name: "calcaire", name_en: "calcareous", hosts: ["C", "D", "M", "R"]}
  - {mark: "cn",  page: 3, name: "accumulation de sesquioxydes (films, concrétions, nodules)", name_en: "sesquioxide films, concretions or many nodules"}
  - {mark: "cra", page: 3, name: "crayeux", name_en: "chalky", hosts: ["C", "D", "M"]}
  - {mark: "d",   page: 3, name: "à dégradation morphologique", name_en: "morphologically degraded", hosts: ["BT", "S"]}
  - {mark: "ho",  page: 3, name: "hémiorganique", name_en: "hemiorganic (8-30 g organic carbon per 100 g)"}
  - {mark: "j",   page: 3, name: "à caractère xanthomorphe", name_en: "xanthomorphic", note: "Not on FS (p. 180)."}
  - {mark: "k",   page: 3, name: "début d’accumulation de calcite secondaire", name_en: "incipient secondary calcite accumulation"}
  - {mark: "m",   page: 4, name: "fortement induré", name_en: "strongly indurated", hosts: ["Yp"], note: "Fem, Km, OXm and Sim are codes of their own (LC, p. 4); m as a suffix only in Ypm (p. 198)."}
  - {mark: "nod", page: 4, name: "grande abondance de nodules d’oxydes métalliques", name_en: "many metal-oxide nodules", hosts: ["A", "F", "OX", "RT"]}
  - {mark: "noz", page: 4, name: "d’origine non zoogène", name_en: "non-zoogenic", hosts: ["OF", "OH"]}
  - {mark: "s",   page: 4, name: "à accumulation de sesquioxydes", name_en: "sesquioxide accumulation (not as nodules)"}
  - {mark: "t",   page: 4, name: "illuviation d’argile", name_en: "incipient or marked clay illuviation", hosts: ["S", "C", "FS"]}
  - {mark: "tp",  page: 4, name: "matériau transporté", name_en: "transported pedological or geological material"}
  - {mark: "v",   page: 4, name: "à propriétés vertiques", name_en: "vertic properties"}
  - {mark: "x",   page: 4, name: "à caractères fragiques", name_en: "fragic", meanings: {D: "mixed rocks (p. 26)"}}
  - {mark: "y",   page: 4, name: "contenant du gypse", name_en: "with gypsum"}
  - {mark: "z",   page: 4, name: "très anthropisé", name_en: "strongly anthropised"}
  - {mark: "zo",  page: 4, name: "d’origine zoogène", name_en: "zoogenic", hosts: ["OF", "OH"]}
  - {mark: "cri", page: 5, name: "roches cristallines ou cristallophylliennes dures", name_en: "hard crystalline or crystallophyllian rock", hosts: ["R", "D"]}
  - {mark: "do",  page: 5, name: "roches dolomitiques dures", name_en: "hard dolomitic rock", hosts: ["R", "D"]}
  - {mark: "sch", page: 5, name: "schistes durs", name_en: "hard schist", hosts: ["R", "D", "M"], note: "Msch, soft schist, p. 26."}
  - {mark: "si",  page: 5, name: "roches siliceuses dures", name_en: "hard siliceous rock", hosts: ["R", "D", "M"], note: "Msi (gaize, arène) and Dsi (silicate rocks), p. 26."}
  - {mark: "vo",  page: 5, name: "roches volcaniques dures", name_en: "hard volcanic rock", hosts: ["R", "D", "M"], note: "Mvo, pyroclastic rocks, p. 26."}
  - {mark: "Na",  page: 318, name: "propriétés sodiques", name_en: "sodic properties", hosts: ["V"], note: "VNa (p. 318); the list prints Vna (p. 3)."}
  - {mark: "Sa",  page: 318, name: "propriétés saliques", name_en: "salic properties", hosts: ["V"], note: "VSa (p. 318); the list prints Vsa (p. 3)."}

# Writings of the book that the reader accepts as another code (Hugo's
# default 12): the from is a regular expression on the designation.
written_variants:
  - {from: "^Lav", to: "LAv", page: 217, note: "Lav (leptismectisols) is LAv."}
  - {from: "^Vna", to: "VNa", page: 3, note: "the list prints Vna; the vertisols chapter VNa (p. 318)."}
  - {from: "^Vsa", to: "VSa", page: 3, note: "the list prints Vsa; the vertisols chapter VSa (p. 318)."}
  - {from: "^(O[FH][rmf]?)z(?!o)", to: "\\1zo", page: 349, note: "OFz and OHz (Annex 1) are OFzo and OHzo."}
  - {from: "^OHm(?=zo|noz)", to: "OHf", page: 333, note: "OHmzo (Annex 1) is OHfzo: the OH sub-horizons are OHr and OHf."}

# Other notations as hints (Hugo's decision Q9): never the RP code by
# themselves, a set of candidates for the identification on the data.
#
# Annex 6 (p. 393): the CPCS 1967 horizons and the RP codes the book gives
# for each. match is soilKey's regular expression on the CPCS symbol
# (lithological numeral removed); the first row that matches applies. A row
# marked soilkey is soilKey's, in brackets. slips: codes Annex 6 writes that
# are not RP codes or contradict the definitions.
annex6:
  - {cpcs: "A00",   match: "^(A00|Aoo|AOO)$", rp: ["OL"]}
  - {cpcs: "A0F",   match: "^(A0|Ao)F", rp: ["OF", "Hf", "Hm"]}
  - {cpcs: "A0H",   match: "^(A0|Ao)H", rp: ["OH", "Hs"]}
  - {cpcs: "[A0]",  match: "^(A0|Ao|AO)$", rp: ["OL", "OF", "OH"], soilkey: true}
  - {cpcs: "A1",    match: "^A1[0-9]*([a-z]|$)", rp: ["A", "Ah", "Aca", "Ach", "Aci", "Ado", "Ae", "Alu", "An", "And", "Aso", "Av", "Avi", "Ha", "Eh", "Js"], slips: ["Ha"], note: "Ha (a drained histic horizon) under A1 is a slip of the table."}
  - {cpcs: "Ap",    match: "^Ap", rp: ["L", "LA", "LH", "LO", "LE", "LS", "LBT"]}
  - {cpcs: "A2g",   match: "^A2[0-9]*g", rp: ["Eg", "Ea"]}
  - {cpcs: "A2",    match: "^A2[0-9]*$", rp: ["E", "Ea"]}
  - {cpcs: "ACs",   match: "^ACs", rp: ["Ys"]}
  - {cpcs: "BCn",   match: "^BCn", rp: ["BTfe", "Fe"], slips: ["BTfe"], note: "BTfe: there is no -fe suffix."}
  - {cpcs: "BCs",   match: "^BCs", rp: ["Yp"]}
  - {cpcs: "Bs",    match: "^B[0-9]*s([0-9]|$)", rp: ["BPs"], note: "not in the CPCS, used after 1967"}
  - {cpcs: "Btgx",  match: "^B[0-9]*tgx", rp: ["BTgx"]}
  - {cpcs: "Btgd",  match: "^B[0-9]*tgd", rp: ["BTgd"], note: "not in the CPCS, used after 1967"}
  - {cpcs: "Btg",   match: "^B[0-9]*tg", rp: ["BTg"]}
  - {cpcs: "Bt",    match: "^B[0-9]*t", rp: ["BT", "FSt"]}
  - {cpcs: "Bw",    match: "^B[0-9]*w", rp: ["S", "Sp", "Sca", "Sci", "Sa", "Na", "Snd", "Slu", "Sal", "Jp", "SV", "FS", "FSj"], slips: ["FSj"], note: "not in the CPCS, used after 1967; FSj contradicts p. 180 (-j not on FS)."}
  - {cpcs: "B2fe",  match: "^B[0-9]*fe", rp: ["BPs", "FE"], note: "FE here is the 2008 ferruginous horizon, which the 1995 FE (ferric) was not."}
  - {cpcs: "B2h",   match: "^B[0-9]*h", rp: ["BPh"]}
  - {cpcs: "(B)v",  match: "^\\(B\\)v", rp: ["V", "Sp", "SV"], note: "not in the CPCS, used after 1967"}
  - {cpcs: "(B)Ca", match: "^\\(B\\)C?[Cc]a", rp: ["Sk"]}
  - {cpcs: "(B)",   match: "^\\(B\\)", rp: ["S", "Sa", "Sal", "Sca", "Sci", "Slu", "Sn", "Snd", "Sp", "SV", "FS", "FSj", "NaS", "Jp"], slips: ["FSj"]}
  - {cpcs: "B",     match: "^B[0-9]*$", rp: ["S", "BT", "FS", "SV", "V", "FE", "OX", "F"], note: "FE, OX and F in the intertropical domain."}
  - {cpcs: "Cca",   match: "^C[0-9]*[Cc]a", rp: ["Ck", "K", "Kc", "Km"], note: "the CPCS Cca is a carbonate accumulation; the RP Cca is a calcareous C."}
  - {cpcs: "CCs",   match: "^CCs", rp: ["Yp"]}
  - {cpcs: "C",     match: "^C", rp: ["C"]}
  - {cpcs: "R",     match: "^R", rp: ["M", "R", "D"]}
  - {cpcs: "G",     match: "^G", rp: ["Go", "Gr"]}
  - {cpcs: "-g",    match: "g", rp: ["g"], features: ["g"], all: true, note: "-g gives -g or g on any row."}

# The FAO (2006) letters as hints (soilKey's table, in brackets, from the
# book's correspondences where it states them: Ap formerly L, p. 14; K, Kc
# and Km the WRB calcic and petrocalcic, p. 20; Sim the duripan, p. 21; BTx
# the fragipan, p. 18; Femp placic, p. 1). A row applies when the master
# is the FAO master and every letter of with is a suffix of the designation;
