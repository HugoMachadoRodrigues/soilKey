# The reference horizons, layers and materials of the French Référentiel
# pédologique 2008 (AFES; Baize D., Girard M.-C. coord.; Éditions Quæ, 2009),
# its notation marks, and the hints other notations give. Read by the
# notation reader (R/designation-rp.R); the identification of the horizons on
# the data, the registry entry and the references come later.
#
# Pages are the printed pages of the book. Names are as the book prints them
# (French); name_en is soilKey's English gloss. The criteria are not
# reproduced: they are in the book.
#
# horizons     one entry per code the reader reads as a master:
#   code       the code as printed, case-sensitive (FE is not Fe, SV is not Sv)
#   family     the code of its group in the list of pp. 1-4 (A, BT, O, S ...),
#              or the layer or material it belongs to
#   kind       horizon, layer or material (pp. 4, 26-28)
#   source     list (the 75 codes and the layers and materials of pp. 1-4),
#              variant (printed in the definitions or chapters as a kind of a
#              listed code), annex1 (the O sub-horizons of Annex 1), old (an
#              old code the list names), transition (a letter written only in
#              transitions)
#   variant_of the listed code a variant belongs to
#   reads_as   for an old code, the 2008 code it is read as
#   page       printed page of the definition
#   detection  the class of the code for recognising the notation without a
#              declaration (Hugo's decision Q9): strong (only the RP writes
#              it), likely (another notation could write it but seldom does),
#              ambiguous (shared with the CPCS, FAO, KA5 or Russian notation)
#   domain     tropical or andic: the book calls the code specific to that
#              domain (p. 6); read by the identification on the data

edition: "Référentiel pédologique 2008 (AFES, Éditions Quæ, 2009)"

