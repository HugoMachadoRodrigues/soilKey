# Metadata of the site properties soilKey recognises (the named elements of
# PedonRecord$site), grouped by section. Read by site_attribute_spec();
# PedonRecord$new(), called from outside the package, and read_pedon_csv()
# warn about a site property that is not listed here. The attribute reference
# inst/ATTRIBUTES.md lists these after the horizon attributes
# (data-raw/generate_attributes_doc.R) and a test keeps the two in step.
#
# Fields: name, section, type (numeric, character, logical or list, as the
# code treats the value), unit, description. Optional: systems (registry ids of
# the keys that read the property; absent when only loaders, reports, the
# app or the benchmarks use it) and allowed (the values the code compares a
# categorical property with). The last section holds what the loaders store
# and no key reads.
attributes:
  # ---- Identity & location ---------------------------------------------------
  - name: id
    section: "Identity & location"
    type: "character"
    unit: "-"
    description: "Identifier of the pedon. Written by every loader and shown by print(), the reports, the app and the benchmarks; no key reads it."
  - name: lat
    section: "Identity & location"
    type: "numeric"
    unit: "decimal degrees"
    description: "Latitude (-90 to 90; validate() flags a value outside). When the country is not Brazil, |lat| <= 23.5 marks the site as tropical, which lets a Bw or Bo designation stand for the WRB ferralic horizon (and so the USDA oxic horizon) and the SiBCS B latossolico; the USDA family soil temperature class estimates the regime from it when soil_temperature_regime is absent. Also read by the SoilGrids prior, the maps and the reports."
    systems: [wrb2022, usda, sibcs5, cpcs1967]
  - name: lon
    section: "Identity & location"
    type: "numeric"
    unit: "decimal degrees"
    description: "Longitude (-180 to 180; validate() flags a value outside). Read by the SoilGrids prior, the maps and the reports; no key reads it."
  - name: crs
    section: "Identity & location"
    type: "numeric"
    unit: "EPSG code"
    description: "Coordinate reference system of lat and lon (4326, WGS 84, when absent). Read by the SoilGrids buffer and the GeoPackage export; no key reads it."
  - name: country
    section: "Identity & location"
    type: "character"
    unit: "-"
    description: "Country of the site, as an ISO code or a name. BR, BRA, Brazil or Brasil marks the site as tropical for the WRB ferralic horizon (and the USDA oxic horizon) and the SiBCS B latossolico. Without designation_system, CA, AU and NZ (or their ISO-3 codes and English names) tell the CSSC, ASC and NZSC keys that the designations may be in their notation, and another country tells the CSSC key that they are not."
    systems: [wrb2022, usda, sibcs5, cssc3, asc3, nzsc4]
  - name: date
    section: "Identity & location"
    type: "character"
    unit: "-"
    description: "Date of the description (ISO 8601, YYYY-MM-DD; the fixtures store a Date). Shown by print() and the reports; no key reads it."
  - name: year
    section: "Identity & location"
    type: "numeric"
    unit: "-"
    description: "Year of the description. Read only by the GeoPackage export (pedon_point layer); no loader writes it."

  # ---- Landscape & surface ---------------------------------------------------
  - name: elevation_m
    section: "Landscape & surface"
    type: "numeric"
    unit: "m"
    description: "Elevation above sea level. Read by the USDA family soil temperature class, which estimates the regime from lat and elevation (0 m when absent) when soil_temperature_regime is not given; also shown by the reports. The CPCS reads 1,500 m or more as the altitude of the alpine podzols (VIII/22)."
    systems: [usda, cpcs1967]
  - name: slope_pct
    section: "Landscape & surface"
    type: "numeric"
    unit: "%"
    description: "Slope gradient in percent, not degrees. Read by the WRB Inclinic qualifier (5 % or more) and the USDA Cumulic subgroups of the Mollisols (less than 25 %, or not recorded); also shown by the reports."
    systems: [wrb2022, usda, cpcs1967]
  - name: aspect_deg
    section: "Landscape & surface"
    type: "numeric"
    unit: "deg"
    description: "Slope aspect in degrees clockwise from true north (0 to 360). Filled by the field-sheet extraction (VLM); no key reads it."
  - name: landform
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Landform, as text (the landform pattern in NatSoil). Read by the ASC Hydrosol settings (tidal, coastal, lake, playa and subaqueous landforms) and by the WRB Gilgaic and Escalic qualifiers (gilgai, built terraces). The Russian Field Guide of 2008 reads a river floodplain (floodplain, levee, backswamp, пойма) for its alluvial soils; a valley, an alluvial plain or a delta leaves them undecided, and a terrace (above the floodplain or not) or another landform recorded rules them out."
    systems: [wrb2022, asc3, scsj2017, cpcs1967, kidpr2008]
  - name: landform_element
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Landform element, as text (NatSoil). Read with landform by the ASC Hydrosol settings; a playa element on a plain pattern counts as a playa. Read with landform by the Russian Field Guide of 2008 (a river floodplain)."
    systems: [asc3, cpcs1967, kidpr2008]
  - name: microrelief_form
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Microrelief at the soil surface, as text (NatSoil writes its microrelief types); also a horizon column of the same name. Read by the WRB Gilgaic qualifier (a recorded microrelief that names no gilgai rules it out) and the Escalic qualifier (built terraces)."
    systems: [wrb2022, cpcs1967]
  - name: patterned_ground
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Patterned ground of frost action at the site, as text: polygons (earth, stone, ice-wedge, low-centre), circles, nets, stripes, mud boils, ice-cored mounds, hummocks, thufurs, palsas, or none. Read by the CPCS groups of the cold-desert raw soils (I/22-23) and of the permafrost soils (II/11-14): a network of polygons, circles, stripes, mud boils or cracks is an organised form; hummocks, thufurs and palsas alone are not. Not recorded: the group is undecided."
    systems: [cpcs1967]
  - name: gilgai_presence
    section: "Landscape & surface"
    type: "logical"
    unit: "-"
    description: "Gilgai microrelief present (TRUE) or absent (FALSE). Read first by the WRB Gilgaic qualifier (Vertisols only), before the relief texts."
    systems: [wrb2022]
  - name: forma_relevo
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Relief form, as text (Portuguese field name). Read beside microrelief_form by the WRB Gilgaic and Escalic qualifiers; no loader writes it."
    systems: [wrb2022]
  - name: relevo_local
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Local relief, as text (Portuguese field name). Read beside microrelief_form by the WRB Gilgaic qualifier; no loader writes it."
    systems: [wrb2022]
  - name: relief_form
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Relief form, as text. Read beside microrelief_form by the WRB Gilgaic and Escalic qualifiers; no loader writes it."
    systems: [wrb2022]
  - name: surface_condition
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Condition of the soil surface, as text with items separated by ';' ('cracking; self-mulching'). Read by the ASC key: surface cracks for the Vertosols, self-mulching and crusts for the Vertosol great groups, and a saline or salt surface for the Salic Hydrosols and the Hypersalic and Hypergypsic suborders."
    systems: [asc3, cpcs1967]
  - name: surface_gravel_pct
    section: "Landscape & surface"
    type: "numeric"
    unit: "%"
    description: "Gravel on the ground surface (NaN when recorded with no abundance). Read by the ASC family gravel class of the surface and A1, which takes the larger of it and the gravel of the A1."
    systems: [asc3]
  - name: surface_coarse_fragments_pct
    section: "Landscape & surface"
    type: "numeric"
    unit: "%"
    description: "Coarse fragments of all sizes on the ground surface (NaN when recorded with no abundance). Read by the ASC family gravel class in place of surface_gravel_pct when that is not given."
    systems: [asc3]
  - name: salinised
    section: "Landscape & surface"
    type: "logical"
    unit: "-"
    description: "The site is salinised (TRUE) or not (FALSE). Read by the ASC key: the Salic Hydrosol setting, and the salinity of the Hypersalic and Hypergypsic suborders when no electrical conductivity is recorded."
    systems: [asc3]
  - name: parent_material
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Parent material, as text. Read by the WRB Rendzic qualifier (limestone, chalk, dolomite, carbonate or marl) and the NZSC Melanic Soils (calcareous, mafic or ultramafic rock); the Russian Field Guide of 2008 reads alluvium for its alluvial soils (glaciofluvial material, outwash, moraine and marine material are none); also shown by print() and the reports."
    systems: [wrb2022, nzsc4, scsj2017, cpcs1967, kidpr2008]
  - name: land_use
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Land use, as text. Read by the WRB Drainic (artificial drainage), Tidalic (tidal, salt marsh, mangrove) and Escalic (built terraces) qualifiers; the French Référentiel pédologique 2008 reads crops or grassland for the open-land humus forms of Annex 1 (agri-mull, mull de pelouse ...; p. 337)."
    systems: [wrb2022, scsj2017, cpcs1967, rp2008]
  - name: vegetation
    section: "Landscape & surface"
    type: "character"
    unit: "-"
    description: "Vegetation, as text. Written by the fixtures and the field-sheet extraction (VLM); read only beside land_use by the open-land humus forms of the French Référentiel pédologique 2008 (p. 337)."

  # ---- Water, climate & regimes ------------------------------------------------
  - name: drainage_class
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "Drainage class, in English or Portuguese; a range ('imperfectly to poorly drained') is read by the end each test asks for. Read by the WRB Drainic, Subaquatic and Tidalic qualifiers (which also look for words such as 'artificial', 'submerged' and 'tidal'), the SiBCS horizonte glei (after drainage), the CSSC Folisol and Vertisol great groups, the ASC key (Hydrosols, organic materials, Folic Organosols, Aquic Vertosols, the Podosol and Hypersalic suborders) and the NZSC Organic Soils."
    allowed: ["excessively drained", "somewhat excessively drained", "rapidly drained", "well drained", "moderately well drained", "imperfectly drained", "somewhat poorly drained", "poorly drained", "very poorly drained", "excessivamente drenado", "fortemente drenado", "acentuadamente drenado", "bem drenado", "moderadamente drenado", "imperfeitamente drenado", "mal drenado", "muito mal drenado"]
    systems: [wrb2022, sibcs5, cssc3, asc3, nzsc4, scsj2017]
  - name: drainage
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "Drainage class as the BDsolos export writes it (classe de drenagem, in Portuguese), on the same scale as drainage_class. The SiBCS horizonte glei reads it before drainage_class; the CSSC drainage groups read it when drainage_class is absent."
    allowed: ["excessively drained", "somewhat excessively drained", "rapidly drained", "well drained", "moderately well drained", "imperfectly drained", "somewhat poorly drained", "poorly drained", "very poorly drained", "excessivamente drenado", "fortemente drenado", "acentuadamente drenado", "bem drenado", "moderadamente drenado", "imperfeitamente drenado", "mal drenado", "muito mal drenado"]
    systems: [sibcs5, cssc3, scsj2017]
  - name: soil_moisture_regime
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "USDA soil moisture regime, compared in lower case (aridic and torric are the same). Read by the USDA key (the Aridisols, and the ustic, xeric, udic and torric suborders, great groups and subgroups) and by the CSSC key when soil_moisture_subclass is absent (Chernozemic climate, the subhumid Solonetzic subgroups). The Chinese Soil Taxonomy 2001 adds the stagnic (perched water), anthrostagnic (irrigated paddy) and peraquic (water table always at or near the surface) regimes (pp. 51-55); the USDA key reads all three as aquic."
    allowed: ["aquic", "aridic", "torric", "udic", "perudic", "ustic", "xeric", "stagnic", "anthrostagnic", "peraquic"]
    systems: [usda, cssc3, cpcs1967]
  - name: soil_moisture_subclass
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "Canadian soil moisture subclass (letters only are compared, so 'sub-humid' reads as subhumid; the aquic subclasses leave the tests undecided). Read by the CSSC key: the Chernozemic climate (subhumid or drier passes, humid and perhumid fail) and the A-horizon colour of the Solonetzic subgroups (subhumid). Filled by npdb_scenario() for NPDB pedons."
    allowed: ["arid", "subarid", "semiarid", "subhumid", "humid", "perhumid"]
    systems: [cssc3]
  - name: soil_temperature_regime
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "USDA soil temperature regime, compared in lower case. Read by the USDA key (the cryic suborders and great groups, and the family temperature class, which is otherwise estimated from lat and elevation_m) and by the CSSC key when mean_annual_soil_temp_C is absent (Gray Brown Luvisols: mesic or thermic; Chernozemic climate: not pergelic or gelic). The Chinese Soil Taxonomy 2001 adds the permagelic regime (soil perennially at or below 0 C, p. 56), which the USDA key reads as gelic."
    allowed: ["gelic", "cryic", "frigid", "mesic", "thermic", "hyperthermic", "isofrigid", "isomesic", "isothermic", "isohyperthermic", "pergelic", "permagelic"]
    systems: [usda, cssc3, scsj2017, cpcs1967]
  - name: frost_regime
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "Frost regime of the soil: none, seasonal (frozen for part of the winter), long-seasonal (frozen for most of the year, no permafrost) or permafrost. For the Russian Field Guide of 2008, whose key position 26 asks for long-seasonal or perennial frost in or under the profile (the cryometamorphic, cryogenic, humus-cryometamorphic and pale-metamorphic horizons; the cryo-humus AK with permafrost). Not recorded: permafrost from the horizon data (permafrost_temp_C, ice_pct, ice_form, the permafrost sign of the notation) or a gelic or pergelic soil_temperature_regime; long-seasonal frost is then undecided (Hugo's decision Q24)."
    allowed: ["none", "seasonal", "long-seasonal", "permafrost"]
    systems: [kidpr2008]
  - name: aridity_index
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "-"
    description: "Annual aridity by Penman's empirical formula as the Chinese Soil Taxonomy 2001 gives it: D = ET / P, with ET the annual potential evapotranspiration (pan evaporation times 0.6 from November to February, 0.8 from May to August, 0.7 in the other months) and P the annual precipitation (p. 52). Over 3 is the aridic regime (3 to 3.5 too, where the ustic range of 1 to 3.5 overlaps it), 1 to 3 ustic, under 1 udic or perudic. Read by the CST moisture regime when soil_moisture_regime is not recorded, and for the arid regions of the salic horizon (Hugo's decisions Q5 and Q14)."
  - name: aridity_index_max_month
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "-"
    description: "The highest monthly Penman aridity of the year (the same formula, month by month). The Chinese Soil Taxonomy 2001 separates the perudic regime (every month under 1) from the udic one (annual aridity under 1, not every month) by it (p. 53); not recorded, an annual aridity under 1 leaves the two undecided (Hugo's decision Q5)."
  - name: climatic_moisture_regime
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "The moisture regime of the region (the climate), as distinct from the soil's own: aridic (or torric), ustic, udic or perudic. The Chinese Soil Taxonomy 2001 reads arid regions for the salic horizon and some Parasalic subgroups (p. 42) and the ustic region of the F1 groups; read before aridity_index and soil_moisture_regime for the region (Hugo's decision Q14)."
    allowed: ["aridic", "torric", "ustic", "udic", "perudic"]
  - name: udic_perudic_border
    section: "Water, climate & regimes"
    type: "logical"
    unit: "-"
    description: "A udic regime bordering on the perudic one (TRUE / FALSE), which the Chinese Soil Taxonomy 2001 asks for in the Xanthi- and Xanthic taxa (E1.2, E1.3.4, K3, L4.4.4, M5.4.4) and does not define. A perudic soil moisture regime also passes; not recorded, the test is undecided (Hugo's decision Q8)."
  - name: mean_summer_soil_temp_C
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "deg C"
    description: "Mean soil temperature of the summer (June to August) at 50 cm, or at a lithic or paralithic contact if shallower. The Chinese Soil Taxonomy 2001 separates the cryic regime from the frigid one by it (under 15 C, 8 C with an O horizon; 13 C and 6 C when saturated in summer, p. 57); not recorded, the two are told apart only by a recorded regime (Hugo's decision Q6)."
  - name: summer_saturated
    section: "Water, climate & regimes"
    type: "logical"
    unit: "-"
    description: "The soil is saturated with water during some period of the summer (TRUE / FALSE), for the cryic regime of the Chinese Soil Taxonomy 2001 (p. 57). Not recorded: the summer temperature decides only where both limits agree."
  - name: cracks_open_days
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "days per year"
    description: "Cumulative days per year with cracks 5 mm or more wide through a layer 25 cm or more thick within 50 cm of the mineral soil surface. The Chinese Soil Taxonomy 2001 reads it for the Ustic Vertosols (90 days or more) and the Aridic subgroups (210 days or more, pp. 53, 96-99). Not recorded: a recorded ustic regime with observed cracks passes the 90 days, provisionally; the 210 days only with an aridic regime (Hugo's decision Q15)."
  - name: irrigated
    section: "Water, climate & regimes"
    type: "logical"
    unit: "-"
    description: "The land is irrigated (TRUE / FALSE). The Chinese Soil Taxonomy 2001 keys the Ustic Cambosols of aridic soils made ustic by irrigation (M3). flood_irrigated TRUE implies it (default 10 of 2026-11-04)."
  - name: freeze_thaw_days_pct
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "% of days"
    description: "Days of the year whose air temperature passes through 0 C (diurnal freezing and thawing), % of the days. The Chinese Soil Taxonomy 2001, the frost-thawic features (70 % or more, item 4, p. 57). Not recorded: that item is undecided."
  - name: surface_crust_thickness_cm
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "cm"
    description: "Thickness of the surface crust (the vesicular or takyric crust), cm. The Chinese Soil Taxonomy 2001: the aridic epipedon (a vesicular crust of 0.5 cm or more over a platy layer, pp. 27-28) and the takyric features (a crust 1-4 cm thick, G1.4.2, G2.5.4, H1.1). Not recorded: the thickness of the top horizon when it has vesicular pores or cracks, flagged (default 14 of 2026-11-04)."
  - name: silting_rate_cm_yr
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "cm per year"
    description: "Rate of deposition of anthropic silt, cm per year. The Chinese Soil Taxonomy 2001, the anthro-silting materials (0.5 cm or more per year by irrigation, 10 cm or more by interception of runoff, pp. 48-49). Not recorded: undecided."
  - name: silting_kind
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "Kind of anthropic silting: irrigation (sediment-rich irrigation water) or interception (runoff intercepted behind dams or terraces). The Chinese Soil Taxonomy 2001, the anthro-silting materials (pp. 48-49)."
    allowed: ["irrigation", "interception"]
  - name: paddy_years_frac
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "fraction"
    description: "Share of the years under submerged rice cultivation (0 to 1). The Chinese Soil Taxonomy 2001 gives the anthrostagnic evidence to a shorter paddy history than the anthrostagnic epipedon (pp. 26-27). Not recorded: undecided."
  - name: lithic_contact_extent_pct
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "% of the plane"
    description: "Share of the horizontal plane at the depth of the lithic contact that the contact occupies, %. The Chinese Soil Taxonomy 2001 asks for a lithic contact in more than half of the plane in the karst taxa (M4.3.1 and others). Not recorded: a recorded contact counts, provisionally (default 22 of 2026-11-04)."
  - name: salic_months_per_year
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "months per year"
    description: "Months a year, in most years (6 years in 10 or more), during which the salic evidence the key names is present. The Chinese Soil Taxonomy 2001 asks for one month or more in the Parasalic Shajiang-Aquic Cambosols (salic evidence within 25 cm, M2.2.3) and the Parasalic Endorusti-Ustic Cambosols (M3.3.1, pp. 152, 156). Not recorded: the salic evidence observed in the profile passes, provisionally (Hugo's decision Q15)."
  - name: mean_annual_soil_temp_C
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "deg C"
    description: "Mean annual soil temperature. Read by the CSSC key: the Chernozemic climate (0 degrees or more) and the Gray Brown Luvisols (8 degrees or more). Filled by npdb_scenario() for NPDB pedons."
    systems: [cssc3, scsj2017]
  - name: soil_temp_30cm_C
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "deg C"
    description: "Mean annual soil temperature at 30 cm from the mineral soil surface. Read by the NZSC Hydrothermal Recent and Raw Soils (2.5 degrees or more above the mean annual air temperature)."
    systems: [nzsc4]
  - name: mean_annual_air_temp_C
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "deg C"
    description: "Mean annual air temperature. Read by the NZSC Hydrothermal Recent and Raw Soils, against soil_temp_30cm_C."
    systems: [nzsc4]
  - name: koppen_climate
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "Koppen climate of the site, as its code (Af, Aw, BWh, BSk, Csa, Cfb, Dfa, Dfc, ET ...). Read first by the CPCS sub-classes, whose classes are split by pedoclimate (cold or hot deserts, cold or tropical countries, humid, continental or boreal temperate climates); without it the CPCS reads the USDA soil temperature and moisture regimes, then the latitude."
    systems: [cpcs1967]
  - name: mean_annual_precip_mm
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "mm"
    description: "Mean annual precipitation. Recorded for the CPCS climate (the ferrallitic sub-classes describe their rainfall); not yet a criterion of any key."
    systems: [cpcs1967]
  - name: surface_water
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "How often water stands on the soil surface. Read by the NZSC Hydric Raw Soils (surface water for the majority of the time, but not constantly)."
    allowed: [constant, most of the time, occasional, none]
    systems: [nzsc4]
  - name: artificially_drained
    section: "Water, climate & regimes"
    type: "logical"
    unit: "-"
    description: "The site is artificially drained. Read by the NZSC peaty topsoil, whose saturation requirement then does not apply."
    systems: [nzsc4, scsj2017]
  - name: groundwater_kind
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "Kind of water table recorded at the site (FAO): none observed, observed, apparent, perched or flooded. Read with groundwater_depth_cm by the WRB gleyic and stagnic properties: mottles over a layer with no reductimorphic matrix are gleyic where groundwater that is not perched lies within 150 cm, stagnic where none was observed or it is perched, and undecided where the site does not say. Written by isis_profile_to_pedon(). The CPCS groups read a perched water table, or none, as a stagnogley (XI/33, VIII/32) and any other as a gley (XI/31)."
    allowed: ["none observed", "observed", "apparent", "perched", "flooded"]
    systems: [wrb2022, cpcs1967]
  - name: groundwater_depth_cm
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "cm"
    description: "Depth of the water table below the soil surface (0 at the surface). Read with groundwater_kind by the WRB gleyic and stagnic properties (within 150 cm, or deeper). Written by isis_profile_to_pedon() from depthGroundwater, or groundwaterTop where ISIS writes 0 for the depth."
    systems: [wrb2022, scsj2017, cpcs1967]
  - name: water_table_cm_above_surface
    section: "Water, climate & regimes"
    type: "numeric"
    unit: "cm"
    description: "Height of a water table above the soil surface (positive above it). Read by the USDA key: the Wassents (above 0) and the Wassists (2 cm or more)."
    systems: [usda]
  - name: tidal_zone
    section: "Water, climate & regimes"
    type: "character"
    unit: "-"
    description: "Tidal zone of the site. Read by the ASC Hydrosol settings (Subtidal, Intertidal, Supratidal and Extratidal suborders); a zone named in landform is read too."
    allowed: ["subtidal", "intertidal", "supratidal", "extratidal"]
    systems: [asc3]
  - name: tidal_inundation
    section: "Water, climate & regimes"
    type: "logical"
    unit: "-"
    description: "The site is subject to tidal flooding. Read by the ASC key: it makes the soil a Hydrosol, rules out the Organosols, and without tidal_zone leaves the tidal Hydrosol settings undecided."
    systems: [asc3]
  - name: subaqueous
    section: "Water, climate & regimes"
    type: "logical"
    unit: "-"
    description: "An inland water body lies over the soil. Read by the ASC Subaqueous Hydrosol setting, before the landform text."
    systems: [asc3]

  # ---- Description & notation -------------------------------------------------
  - name: designation_system
    section: "Description & notation"
    type: "character"
    unit: "-"
    description: "Notation of the horizon designations. Read by the CSSC, ASC and NZSC keys to decide whether the designations are in their notation (otherwise judged from the designations and the country), and by the CPCS key ('cpcs': the old French notation of 1967, otherwise recognised by its symbols, never by the country). The Russian notation of the Field Guide of 2008 ('kidpr', 'ru', 'russian', any value starting with kidpr, rfg, rsc or russia, or ru or rus followed by a digit) is otherwise recognised by an index only it writes (AY, EL, BHF, BCA, PU, TUR ...), never by the country: Russian legacy data use the Soviet notation of 1977, read only as hints. The notation of the French Référentiel pédologique 2008 ('rp', 'rp2008', 'referentiel', 'afes', any value starting with rp, referentiel or afes; 'rp1995' or 'rp95' for the RP of 1995, where FE is the ferric horizon) is otherwise recognised by a code only it writes (OL, OF, OH, BP, LA, SV, FS, Sca, Aca, Kc, Js ...) or two kinds that it alone usually writes, with no symbol only the CPCS, the FAO or the USDA writes, in a profile not written all in capitals, never by the country; 'french' and 'fr' stay the CPCS. The South African notation of 1991 ('za', 'za1991', 'sat', 'sat1991', 'south africa', 'south african', any value starting with south africa) lets the names of its diagnostic horizons written in the designations be read ('Ap orthic A', 'B1 red apedal'), as they are when the profile records a name in diagnostic_za or when a designation holds a name only that system writes (orthic A, red apedal, yellow-brown apedal, neocutanic, dorbank ...); 'SA' and 'RSA' name the country, not a notation, and declare nothing; never inferred from the country, since South African sites are also described in the FAO notation. The notation of the German Bodenkundliche Kartieranleitung (KA5, 2005: 'ka5', 'kartieranleitung', 'bodensystematik', 'agboden', 'dbg', any value starting with them; 'ka3' and 'ka4' read as KA5 with a note, the G horizons having been redefined in 2005; 'ka6' read through the KA6 symbols with a one-to-one KA5 reading) is otherwise recognised by one strong sign (the degree sign, a lower-case prefix before a master: lC, fAh, aM, tmGo; a base-saturation mark; Sw, Sd, Axh, Ael, Bfv, Gor, Tv ...) or two likely ones of two kinds (Bv, Cv, Cn, Al, Aa, Hm, Hw, Hr, P, T), with no symbol only the FAO, USDA, CSSC, RP, CPCS or Russian notation writes, never by the country. Since v0.9.395 it also decides how the WRB, SiBCS, FAO-Unesco and Chinese diagnostics read the older notation of the designations: a declared older notation ('asc' with or without an edition, as 'asc4' or 'asc2021', which the ASC key also reads as its own, and its aliases, 'cpcs', 'cpcs1967', 'french', 'fr', 'fao1974', 'fao1977', 'usda1951', 'ssm1951', 'usda1962', 'ssm1962', 'br_pre1988', the Brazilian notation in use until 1988) has its A2 read as E, its B3 as BC and its (B) as Bi; a declared present notation ('fao', 'fao2006', 'wrb' and its editions, 'usda', 'kst', 'sibcs', and the national notations above, each read by its own reader's test) none of them, whatever the designations look like (a (B) there loses its parentheses: '(Bw)R' is read 'BwR'); with no declaration, 'nz_legacy' or a value soilKey does not know (validate() notes it), the designations decide (a B followed by a number, an A or C followed by two figures, (B), ir in a B, pl in a B or C). Written by the NatSoil and SALI ('asc'), NPDB ('cssc'), ISIS ('fao2006') and NSD ('nz_legacy': the older New Zealand notation, read by the NZSC key as New Zealand designations, its older-notation marks judged profile by profile) loaders."
    allowed: ["cssc", "cssc3", "canadian", "canada", "asc", "australian", "field handbook", "nchs", "australian field handbook", "nzsc", "nz", "new zealand", "cpcs", "cpcs1967", "french", "kidpr", "kidpr2008", "ru", "ru2004", "ru2008", "russian", "russia", "rfg2008", "rsc2004", "rp", "rp2008", "rp1995", "referentiel", "afes", "za", "za1991", "sat", "sat1991", "south africa", "south african", "south_africa", "southafrican", "ka5", "ka4", "ka3", "ka6", "kartieranleitung", "bodensystematik", "agboden", "dbg", "fao", "fao2006", "wrb", "wrb2006", "wrb2014", "wrb2015", "wrb2022", "usda", "sibcs", "fao1974", "fao1977", "usda1951", "ssm1951", "usda1962", "ssm1962", "br_pre1988", "nz_legacy", "asc3", "asc4"]
    systems: [wrb2022, sibcs5, fao1988, fao1974, cst2001, cssc3, asc3, nzsc4, scsj2017, cpcs1967, kidpr2008, ka5]
  - name: humus_form
    section: "Description & notation"
    type: "character"
    unit: "-"
    description: "Humus form of the site, as the French and European typologies name it: mull, moder, mor (humus brut), hydromull, hydromoder, hydromor, anmoor, tourbe (peat). Read by the CPCS subgroups of the rankers (II/211-213: mor or moder; not recorded, the subgroup is undecided) and of the humic gley soils (XI/212-214: anmoor or hydromor decides before the C/N). The French Référentiel pédologique 2008 (Annex 1) adds its forms: eumull, mésomull, oligomull, dysmull, hémimoder, eumoder, dysmoder, hémimor, humimor, amphimus, euamphimus, the forms without fine earth (peyromull, lithomoder, peyromoder, lithomor, peyromor, tangel, peyro-amphimus) and of open land (agri-mull, agri-moder, agri-mor, mull, moder and mor de pelouse, amphimus de pelouse); a recorded form prevails where the horizons leave the form of humus_form_rp() undecided, and a conflict is reported (Hugo's decision Q22). The German KA5 adds the l-mull and f-mull (pp. 298-303); its German names are read as these values (Rohhumus mor, Feuchtmull hydromull, Feuchtmoder hydromoder, Feuchtrohhumus hydromor, Tangel tangel, Moder moder, Mull mull)."
    allowed: ["mull", "moder", "mor", "hydromull", "hydromoder", "hydromor", "anmoor", "tourbe", "eumull", "mésomull", "oligomull", "dysmull", "hémimoder", "eumoder", "dysmoder", "hémimor", "humimor", "amphimus", "euamphimus", "peyromull", "lithomoder", "peyromoder", "lithomor", "peyromor", "tangel", "peyro-amphimus", "agri-mull", "agri-moder", "agri-mor", "mull de pelouse", "moder de pelouse", "mor de pelouse", "amphimus de pelouse", "l-mull", "f-mull"]
    systems: [cpcs1967, rp2008]
  - name: nasis_diagnostic_features
    section: "Description & notation"
    type: "character"
    unit: "-"
    description: "Diagnostic features the surveyor recorded in NASIS (pediagfeatures featkind, one string per feature). Read by the USDA key: the argillic clay-films test and the fragipan, and as a tie-breaker that turns an undecided order test (histic, spodic, andic, vertic, argillic, kandic, natric, mollic, cambic) into a pass. Written by the KSSL NASIS loader."
    systems: [usda]
  - name: anthropic_truncation
    section: "Description & notation"
    type: "logical"
    unit: "-"
    description: "The soil has been truncated by human activity (TRUE, or 'yes', 'y', 't', '1'). Read by the NZSC Anthropic Soils, where it meets the first condition without 30 cm of anthropic soil material."
    systems: [nzsc4, scsj2017, cpcs1967]
  - name: mechanical_mixing_depth_cm
    section: "Description & notation"
    type: "numeric"
    unit: "cm"
    description: "Depth from the mineral soil surface to which people mechanically disturbed the original horizons (mixing, deep ripping, subsoil lifting). Read by the NZSC Mixed Anthropic Soils (more than 30 cm)."
    systems: [nzsc4, scsj2017]
  - name: methane_odour
    section: "Description & notation"
    type: "logical"
    unit: "-"
    description: "A methane content that can be detected by odour. Read by the NZSC Refuse Anthropic Soils."
    systems: [nzsc4]
  - name: mechanical_mixing_purpose
    section: "Description & notation"
    type: "character"
    unit: "-"
    description: "Why the original horizons were mechanically mixed: tephra flipping (a modified tephra stratigraphy), breaking impeding horizons (to break up drainage-impeding horizons such as placic horizons or pans, often with hump-and-hollow recontouring), or other. Read by the NZSC Inverted-tephric and Inverted-impeded Mixed Anthropic Soils; recorded when met."
    systems: [nzsc4, scsj2017]
    allowed: [tephra flipping, breaking impeding horizons, other]
  - name: acid_neutralising_amendment
    section: "Description & notation"
    type: "logical"
    unit: "-"
    description: "TRUE where acid-neutralising amendments (lime or similar) were added to the soil material. Read by the NZSC Treated-sulfidic Fill Anthropic Soils; recorded when met."
    systems: [nzsc4, scsj2017]
  - name: overthickened_a
    section: "Description & notation"
    type: "logical"
    unit: "-"
    description: "The surveyor recorded an overthickened A horizon (TRUE, or 'yes', 'y', 't', '1'). Read by the NZSC key: with its base at 45 cm or more, under 30 cm of anthropic material and no mottles within 30 cm, the soil enters the key at the Recent Soils."
    systems: [nzsc4]

  # ---- Soil construction (soilKey Pro) ----------------------------------------
  - name: technic
    section: "Soil construction (soilKey Pro)"
    type: "character"
    unit: "-"
    description: "The soilKey Pro answer on artefacts, technic hard material and geomembranes, saved in the session file. 'none' writes 0 % artefacts, 0 % technic hard material and no geomembrane on every horizon; 'present' applies the geomembrane answer; 'unknown' writes nothing. The keys read the horizon columns, not this."
    allowed: ["unknown", "none", "present"]
  - name: geomembrane
    section: "Soil construction (soilKey Pro)"
    type: "character"
    unit: "-"
    description: "With technic 'present': 'yes' marks geomembrane_present on the horizon that holds geomembrane_depth_cm (the top one when no depth matches), 'no' marks it absent on every horizon, 'unknown' writes nothing."
    allowed: ["unknown", "no", "yes"]
  - name: geomembrane_depth_cm
    section: "Soil construction (soilKey Pro)"
    type: "numeric"
    unit: "cm"
    description: "Depth of the geomembrane from the soil surface; selects the horizon on which soilKey Pro marks geomembrane_present."

  # ---- Reference classes & provenance (stored, read by no key) ---------------
  - name: reference_source
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Name of the dataset the reference classes come from ('Embrapa BDsolos', 'KSSL / NCSS Lab Data Mart', ...). Written by the benchmark loaders."
  - name: reference_wrb
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Published WRB class (a Reference Soil Group, or the name the dataset gives). Written by the LUCAS-ESDB, FEBR, BDsolos and AfSP (from WRB 2006) loaders and the spectral libraries, or copied from wosis_rsg or reference_wrb_from_usda; read by the benchmarks as the WRB reference."
  - name: reference_wrb_full
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Full WRB name the data provider gives the profile, with its qualifiers. Written by isis_profile_to_pedon() (ISRIC's name); its edition is in reference_wrb_edition."
  - name: reference_wrb_edition
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Edition (year) of the WRB name in reference_wrb and reference_wrb_full, e.g. '2022'. Written by isis_profile_to_pedon(); benchmark_isis() scores only the 2022 names."
  - name: reference_usda_edition
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Edition (year) of the USDA names in reference_usda and its suborder, great group and subgroup fields, e.g. '1999'. Written by isis_profile_to_pedon(). read_nsd_pedons() writes 'before 1990 (Andepts)' for a great group of the Andepts, Inceptisols until Soil Taxonomy created the Andisols."
  - name: reference_wrb06_full
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Full WRB 2006 name of an AfSP profile. Written by load_afsp_pedons()."
  - name: reference_fao88
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "FAO 1988 class of an AfSP profile. Written by load_afsp_pedons()."
  - name: reference_fao74
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Soil unit of the FAO-Unesco Legend of 1974 given for the profile (e.g. 'Chromic Luvisol', 'Lc'), beside reference_fao88 for the Revised Legend. Stored for benchmarks; read by no key."
  - name: reference_wrb_from_usda
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "WRB Reference Soil Group derived from reference_usda and reference_usda_suborder by annotate_wrb_from_usda(); read by benchmark_wrb_vs_usda() and copied into reference_wrb when that is missing."
  - name: wosis_rsg
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "WRB Reference Soil Group that WoSIS reports for the profile; copied into reference_wrb when that is missing."
  - name: reference_usda
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Published USDA Soil Taxonomy class (the order, or a subgroup or series name, depending on the loader). Written by the KSSL, FEBR and AfSP loaders; read by the benchmarks and annotate_wrb_from_usda()."
  - name: reference_usda_suborder
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Published USDA suborder (KSSL samp_taxsuborder). Read by the suborder benchmark and annotate_wrb_from_usda()."
  - name: reference_usda_grtgroup
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Published USDA great group (KSSL samp_taxgrtgroup). Read by the great-group benchmark."
  - name: reference_usda_subgroup
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Published USDA subgroup (KSSL samp_taxsubgrp). Read by the subgroup benchmark."
  - name: reference_st
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Published Soil Taxonomy class under another name: the BDsolos Soil Taxonomy column, or the USDA order of a spectral library. Read as the USDA reference by the BDsolos and spectral benchmarks (the other loaders use reference_usda)."
  - name: wosis_usda_order
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "USDA order that WoSIS reports for the profile."
  - name: reference_sibcs
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Published SiBCS class, as the dataset writes it. Written by the FEBR, BDsolos, Embrapa and Redape loaders and the spectral libraries; read by the benchmarks and by build_taxon_profiles()."
  - name: reference_sibcs_order
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "SiBCS order of a Redape profile (ORDEM). Read by benchmark_redape(), which composes the reference at each level."
  - name: reference_sibcs_subordem
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "SiBCS suborder of a Redape profile (SUBORDEM). Read by benchmark_redape()."
  - name: reference_sibcs_gg
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "SiBCS great group of a Redape profile (GDE_GRUPO). Read by benchmark_redape()."
  - name: reference_sibcs_subgrupo
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "SiBCS subgroup of a Redape profile (SUBGRUPO). Read by benchmark_redape()."
  - name: reference_asc_order
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Surveyors' ASC order code of a NatSoil profile. Read by benchmark_natsoil()."
  - name: reference_asc_suborder
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Surveyors' ASC suborder code of a NatSoil profile. Read by benchmark_natsoil()."
  - name: reference_asc_great_group
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Surveyors' ASC great group code of a NatSoil profile. Read by benchmark_natsoil()."
  - name: reference_asc_subgroup
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Surveyors' ASC subgroup code of a NatSoil profile. Read by benchmark_natsoil()."
  - name: reference_asc_family
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Surveyors' ASC family codes of a NatSoil profile, by position and separated by ';'. Read by benchmark_natsoil()."
  - name: reference_asc_confidence
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Surveyors' confidence code for the ASC class of a NatSoil profile. Reported by benchmark_natsoil()."
  - name: reference_cssc_order
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "CSSC order of an NPDB profile, matched to the classes of the key. Read by benchmark_npdb()."
  - name: reference_cssc_great_group
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "CSSC great group of an NPDB profile, matched to the classes of the key. Read by benchmark_npdb()."
  - name: reference_cssc_subgroup
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "CSSC subgroup of an NPDB profile, matched to the classes of the key. Read by benchmark_npdb()."
  - name: reference_cssc_raw
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NPDB order, great group and subgroup as recorded, joined by ' | '. Written by load_npdb_pedons()."
  - name: reference_nzsc
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NZSC code of an NSD profile as the surveyor recorded it (e.g. 'MOT'), recoded to the 4th edition where the 4th edition renamed the code (MIW as MIC). Written by read_nsd_pedons()."
  - name: reference_nzsc_name
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NZSC class name of an NSD profile as recorded (e.g. 'Typic Orthic Pumice Soil'). Written by read_nsd_pedons()."
  - name: reference_nzsc_order
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NZSC order code (one letter) of an NSD profile; NA for a subgroup the 4th edition withdrew and moved to other orders (BLAM). Read by benchmark_nsd()."
  - name: reference_nzsc_group
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NZSC group code (two letters) of an NSD profile, when the record names a group. Read by benchmark_nsd()."
  - name: reference_nzsc_subgroup
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NZSC subgroup code (three or four letters) of an NSD profile, when the record names a subgroup the 4th edition keeps. Read by benchmark_nsd()."
  - name: reference_nzsc_raw
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NSD classifier_nzsc as recorded (code and name). Written by read_nsd_pedons()."
  - name: reference_nzsc_note
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "How a 3rd-edition NZSC code of an NSD profile was read (recoded, or withdrawn in the 4th edition). Written by read_nsd_pedons()."
  - name: reference_nzsc_alt
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NSD classifier_nzsc_alt: an alternative NZSC class the surveyor recorded. Written by read_nsd_pedons()."
  - name: reference_nz_genetic
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NZ Genetic Soil Classification class of an NSD profile (classifier_nz_genetic). Written by read_nsd_pedons()."
  - name: reference_nz_series
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Soil series of an NSD profile (classifier_nz_series). Written by read_nsd_pedons()."
  - name: reference_usda_raw
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Soil Taxonomy subgroup of an NSD profile as recorded (classifier_usda, e.g. 'TYPIC UDIVITRAND'). Written by read_nsd_pedons()."
  - name: reference_za_form
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Soil form of the South African soil classification recorded for the profile (Soil Classification Working Group 1991, za1991): the form name or its two-letter code (Hutton, Hu), with its edition in reference_za_edition; never resolved across editions (a 1991 family name can be a 2018 form name). For benchmarks only; never used to classify."
  - name: reference_za_family
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Soil family of the South African soil classification recorded for the profile: the form code and the four digits (Hu1200), or the family name, with its edition in reference_za_edition (a 2018 family code means something else). For benchmarks only; never used to classify."
  - name: reference_za_raw
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "The South African class of the profile as the source gives it (the 1977 binomial 'Hutton Shorrocks' of AfSP LocalCls, or a 1991 code such as Hu1200 medium sandy loam). For benchmarks only."
  - name: reference_za_edition
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Edition of the South African class in reference_za_form, reference_za_family and reference_za_raw: 1977 (the binomial system), 1991 (the taxonomic system soilKey keys, za1991) or 2018 (the natural and anthropogenic system)."
    allowed: ["1977", "1991", "2018"]
  - name: nsdr_identifier
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Identifier of the site in the National Soil Data Repository of New Zealand (nsdridentifier). Written by read_nsd_pedons()."
  - name: survey
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Name of the NSD soil survey the profile belongs to. Written by read_nsd_pedons()."
  - name: survey_code
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Code of the NSD soil survey the profile belongs to. Written by read_nsd_pedons()."
  - name: sali_asc_label
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Surveyors' ASC label of a Queensland SALI site as the site layer gives it (order, suborder, great group, subgroup names). Written by read_sali_pedons(); its codes are in reference_asc_order and the following fields."
  - name: sali_pdf_asc
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "ASC name of a SALI site as its site report prints it (the book's order, with the family). Written by read_sali_pedons()."
  - name: sali_asc_edition
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Edition of the ASC technical reference the SALI site report cites, e.g. '3rd (2021)', '2nd (2016)', '1st (1996)'. Written by read_sali_pedons(); benchmark_sali() reports the agreement by edition."
  - name: sali_asc_confidence_text
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Confidence phrase of the SALI site report for its ASC class, as printed (reference_asc_confidence gives it as 1-4, or C). Written by read_sali_pedons()."
  - name: sali_unmapped
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Names of the SALI label that match no class of the ASC 3rd edition (left NA), separated by '; '. Written by read_sali_pedons()."
  - name: sali_observation_class
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Observation class of the SALI site (e.g. 'Class IIIb (core analytical suite)'). Written by read_sali_pedons()."
  - name: sali_observation_type
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Observation type of the SALI site (e.g. 'Soil pit', 'Hand auger boring'). Written by read_sali_pedons()."
  - name: sali_depth_to_free_water
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Depth to free water as the SALI site report records it (text). Written by read_sali_pedons(); not used."
  - name: sali_substrate
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Substrate as the SALI site report records it (text). Written by read_sali_pedons(); not used."
  - name: sali_n_lab_samples
    section: "Reference classes & provenance (stored, read by no key)"
    type: "numeric"
    unit: "-"
    description: "Number of laboratory samples of observation 1 read for the SALI site. Written by read_sali_pedons()."
  - name: sali_lab_source
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Where the laboratory values of the SALI site come from: 'api' (the SALI soil chemistry API), 'report table' (the site report's table, read only when the API holds no samples) or 'none'. Written by read_sali_pedons()."
  - name: sali_n_predicted
    section: "Reference classes & provenance (stored, read by no key)"
    type: "numeric"
    unit: "-"
    description: "Number of horizon values of the SALI site that are MIR predictions, used where nothing was measured (marked predicted_spectra in the provenance). Written by read_sali_pedons()."
  - name: curation_note
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Curation note of a Redape profile (CURADORIA). Written by load_redape_pedons()."
  - name: curation_authors
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Authors of the curation of a Redape profile (AUTOR_CURADORIA). Written by load_redape_pedons()."
  - name: source
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Provider of a profile read from a live service ('ISRIC WoSIS', 'NatSoil (CSIRO)'); soilKey Pro keeps it with the other provenance fields."
  - name: dataset
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Code of the WoSIS source dataset of the profile; shown by soilKey Pro."
  - name: dataset_id
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "NPDB dataset identifier (DATASET_ID). Written by load_npdb_pedons()."
  - name: wosis_profile_id
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Internal WoSIS identifier of the profile (the profile code is the id)."
  - name: wosis_profile_code
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "WoSIS profile code, which soilKey Pro keeps with the provenance fields of a WoSIS profile and shows in its data-source note."
  - name: accessed
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Date the WoSIS data were read (YYYY-MM-DD); shown by soilKey Pro."
  - name: licence
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Licence of the profile data (WoSIS: the more restrictive of the profile and layer licences; NatSoil: its usage licence); shown by soilKey Pro."
  - name: licence_short
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Short label of the WoSIS licence ('CC BY 4.0', 'CC BY-NC 3.0', 'Public domain'); shown by soilKey Pro."
  - name: citation
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Citation the provider asks for (WoSIS, with the download date; NatSoil). Printed by the HTML and PDF reports."
  - name: attribution
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "One-line attribution of a WoSIS profile (profile code, dataset, date read, licence). Printed by the HTML and PDF reports."
  - name: depth_note
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Note that the WoSIS depths were shifted so the organic surface layer starts at 0 cm; shown by soilKey Pro."
  - name: wosis_error
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Why the WoSIS layers could not be read (the pedon then has no horizons); shown by soilKey Pro."
  - name: sampling_type
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Kind of BDsolos sampling point ('Tipo': Perfil completo, Perfil parcial or Amostra extra). The BDsolos benchmarks keep the complete profiles ('perfil completo') and the records that do not say."
  - name: state
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Brazilian state of the profile (FEBR estado_id, BDsolos UF)."
  - name: municipality
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Municipality of a BDsolos profile."
  - name: province
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Province or region of the profile: the Canadian province of an NPDB profile, the New Zealand region of an NSD profile."
  - name: altitude_m
    section: "Reference classes & provenance (stored, read by no key)"
    type: "numeric"
    unit: "m"
    description: "Altitude of a BDsolos profile. The USDA family reads elevation_m, not this."
  - name: land_cover
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Land cover or vegetation, as text (BDsolos current use or vegetation column; LUCAS LC0_Desc). The WRB qualifiers read land_use, not this."
  - name: survey_date
    section: "Reference classes & provenance (stored, read by no key)"
    type: "character"
    unit: "-"
    description: "Survey date of a LUCAS 2018 point (SURVEY_DATE). The reports show date, not this."
  - name: npdb_depth_order_mismatch
    section: "Reference classes & provenance (stored, read by no key)"
    type: "logical"
    unit: "-"
    description: "TRUE when the depth order of an NPDB profile's layers differs from their layer order. Written by load_npdb_pedons()."
  - name: npdb_cmi
    section: "Reference classes & provenance (stored, read by no key)"
    type: "numeric"
    unit: "-"
    description: "Thornthwaite climate moisture index of an NPDB pedon, set by npdb_scenario() with soil_moisture_subclass."
  - name: npdb_scenario
    section: "Reference classes & provenance (stored, read by no key)"
    type: "list"
    unit: "-"
    description: "A list of the ranges npdb_scenario() estimated (rows and error bands of the dry colours, the soil temperature range, the moisture subclasses between the two PET methods). Read by benchmark_npdb(), which classifies the pedon at every combination of their ends."
  - name: contaminated
    section: "Landscape & surface"
    type: "logical"
    unit: "-"
    description: "A layer within 50 cm exceeds a contamination or toxicity limit of the soil regulation in force. HSCS 2024 subtype szennyezett (Anthropogenic soils). For the Russian Field Guide of 2008, contamination recorded without the hazard category of the layers (contamination_hazard) leaves the contaminated horizon X, and the chemozems, undecided."
    systems: [hscs2024, kidpr2008]
  - name: terraced
    section: "Landscape & surface"
    type: "logical"
    unit: "-"
    description: "The surface is an artificial terrace. HSCS 2024 variety teraszolt."
    systems: [hscs2024]
  - name: flood_irrigated
    section: "Landscape & surface"
    type: "logical"
    unit: "-"
    description: "The soil is under flood-irrigated cultivation (e.g. rice). HSCS 2024 variety árasztott."
    systems: [hscs2024, scsj2017]
  - name: wind_deflation
    section: "Landscape & surface"
    type: "logical"
    unit: "-"
    description: "The surface is bare, structureless single grains with marks of wind reworking (deflation). HSCS 2024 subtype futó (Sandy soils)."
    systems: [hscs2024, cpcs1967]
  - name: jp_edition
    section: "Description & notation"
    type: "character"
    unit: "-"
    description: "Internal: set by classify_cscj2011() on its copy of the pedon ('cscj2011') so that the diagnostics the CSCJ 2011 shares with the SCSJ 2017 read the CSCJ's own limits. Not for user data."
    systems: [cscj2011]
  - name: scsj_part
    section: "Description & notation"
    type: "logical"
    unit: "-"
    description: "Internal: set by the SCSJ key on a part of a profile it keys on its own (the fill of Man-made soils, or the soil under it); the fill's own material is then read. Not for user data."
    systems: [scsj2017]
  - name: scsj_part_complete
    section: "Description & notation"
    type: "logical"
    unit: "-"
    description: "Internal: with scsj_part, whether nothing lies below the part's last horizon (the fill; the soil under it only where the original profile ends on rock). Not for user data."
    systems: [scsj2017]
  - name: artefacts_organic
    section: "Description & notation"
    type: "logical"
    unit: "-"
    description: "TRUE where the artificial material of the soil is mainly organic (household refuse and the like). SCSJ 2017 Organic Artifactual soils, read when no horizon records artefacts_organic."
    systems: [scsj2017]
  - name: forest_soil_type
    section: "Description & notation"
    type: "character"
    unit: "-"
    description: "The soil type of the Japanese forest soil classification (1975) recorded for the site: BA, BB, BC, BD, BD(d), BE, BF, or PDI, PDII, PDIII for the Podzols; the types of the other 1975 groups (BlD, lBlD, RC, YD(d), dRB ...) are read by their moisture letter, and PW (wet podzols) gives no development phase. SCSJ 2017 forest soil phases (chapter V.3), read before the phases soilKey derives from the profile; a recorded type also says forest land when no land use is recorded."
    systems: [scsj2017]
  - name: valley_position
    section: "French system (Référentiel pédologique 2008)"
    type: "character"
    unit: "-"
    description: "Position of the site in its valley, for the fluviosols of the French Référentiel pédologique 2008 (pp. 183-188): minor bed (lit mineur), major bed (lit majeur), terrace, alluvial fan or dried marsh. Read when recorded; not recorded, an attachment that needs it is provisional, landform being evidence only (Hugo's decision Q14)."
    allowed: ["minor bed", "major bed", "terrace", "alluvial fan", "dried marsh"]
  - name: flood_frequency
    section: "French system (Référentiel pédologique 2008)"
    type: "character"
    unit: "-"
    description: "Frequency of flooding of the site: none, rare, occasional, frequent or annual. The third condition of the fluviosols of the French Référentiel pédologique 2008 (an alluvial water table, usually floodable, p. 183). Read when recorded; not recorded, the attachment is provisional (Hugo's decision Q14)."
    allowed: ["none", "rare", "occasional", "frequent", "annual"]
  - name: poldered
    section: "French system (Référentiel pédologique 2008)"
    type: "logical"
    unit: "-"
    description: "TRUE when the site is a polder: embanked, drained or reclaimed land won from the sea. The thalassosols poldérisés of the French Référentiel pédologique 2008 (p. 304). Read when recorded; not recorded, artificially_drained with a marine origin is evidence (Hugo's decision Q14)."
  - name: lateral_bp_downslope
    section: "French system (Référentiel pédologique 2008)"
    type: "logical"
    unit: "-"
    description: "TRUE when a podzolic BP is present laterally, downslope of the profile. The podzosols éluviques of the French Référentiel pédologique 2008 have an E with no BP in the solum and a BP downslope (p. 270); not recorded, they stay a candidate (Hugo's decision Q14)."
  - name: rp_anthropic_history
    section: "French system (Référentiel pédologique 2008)"
    type: "character"
    unit: "-"
    description: "The history of the soil recorded in the terms of the French Référentiel pédologique 2008, joined by ';' (sablage; défoncement; amendements organiques; terrassettes; nivellement; décapage ...). Read for the anthroposols transformés (a history recorded over 50 cm or more) and the qualifiers of human history; never inferred from the profile (Hugo's decision Q15)."
  - name: rp_qualifiers_recorded
    section: "French system (Référentiel pédologique 2008)"
    type: "character"
    unit: "-"
    description: "Qualifiers of the French Référentiel pédologique 2008 recorded by the surveyor, the names as printed joined by ';' (drainé; colluvial; alpin ...). The qualifiers of landscape, climate, history and management enter the name of the type only when recorded here, land_use or landform (Hugo's decision Q21)."
  - name: parent_material_relation
    section: "French system (Référentiel pédologique 2008)"
    type: "character"
    unit: "-"
    description: "How the parent material enters the name of a type of the French Référentiel pédologique 2008 (pp. 61, 401): 'issu de' (the solum formed in it) or 'sur' (the solum lies on it). The phrase is written only when this and parent_material are recorded (Hugo's decision Q21)."
    allowed: ["issu de", "sur"]
  - name: intertropical
    section: "French system (Référentiel pédologique 2008)"
    type: "logical"
    unit: "-"
    description: "TRUE when the site is declared in the intertropical domain, FALSE when declared outside it. The French Référentiel pédologique 2008 calls the horizons F, OX, RT, ND, FE, OXc and OXm specific to that domain (p. 6) and soilKey tests them only there: declared here, else a Köppen climate of group A or a latitude between the tropics; neither recorded, they stay undecided (Hugo's decision Q18)."
  - name: rp_paleo
    section: "French system (Référentiel pédologique 2008)"
    type: "character"
    unit: "-"
    description: "The terms of the paleosolum vocabulary of the French Référentiel pédologique 2008 (pp. 58-63) declared by the surveyor, joined by ';': paléo- (with the reference: paléoluvisol), développé dans, superposé à, multi-, vétuste, fossilisé, bigénétique, polygénétique. These are named only when declared; bilithique, polylithique, recouvert par and enfoui are read from the profile (Hugo's decision Q1)."
  - name: particle_size_scheme
    section: "German system (KA5)"
    type: "character"
    unit: "-"
    description: "Fraction limits of the recorded texture: 'ka5' (silt 2-63 um, sand 63-2000 um, the German fractions), 'usda' (silt 2-50 um) or 'iso'. German KA5: with silt not in the KA5 fractions, silt 50 % or more counts as KA5 silt 50 % or more, under 45 % as under 50, 45 to < 50 is undecided (Hugo's decision Q11). Not recorded: read as 2-50 um."
    allowed: ["ka5", "usda", "iso"]
    systems: [ka5]
  - name: embanked
    section: "German system (KA5)"
    type: "logical"
    unit: "-"
    description: "The site lies behind a dyke (TRUE / FALSE). German KA5: embanked floodplain soils may still be flooded by seepage (Qualmwasser); a Go-Ah is a Rohmarsch unless the site is embanked (Hugo's decision Q20). poldered is not a stand-in."
    systems: [ka5]
  - name: groundwater_source
    section: "German system (KA5)"
    type: "character"
    unit: "-"
    description: "Source of the water of the G horizons: 'groundwater', 'slope_water' or 'spring_water'. German KA5: the Hang- and Quellen- subtypes of the Gleye (prefixes s and q, pp. 243-248). Not recorded: the prefixes written."
    allowed: ["groundwater", "slope_water", "spring_water"]
    systems: [ka5]
  - name: groundwater_oxygen_rich
    section: "German system (KA5)"
    type: "logical"
    unit: "-"
    description: "The groundwater is oxygen-rich (TRUE / FALSE). German KA5: the Oxigley GGx (p. 242; Hugo's decision Q16). Not recorded: no Gr in a profile described to 13 dm or more, else undecided between GGn and GGx."
    systems: [ka5]
  - name: groundwater_mhgw_cm
    section: "German system (KA5)"
    type: "numeric"
    unit: "cm"
    description: "Mean high groundwater level, cm below the surface (negative above it), the MHGW of Tab. 59 (pp. 310-313). German KA5: about the top of the Go; a stand-in for undescribed G horizons, flagged and provisional (Hugo's decision Q13)."
    systems: [ka5]
  - name: groundwater_mgw_cm
    section: "German system (KA5)"
    type: "numeric"
    unit: "cm"
    description: "Mean groundwater level, cm below the surface (negative above it), the MGW of Tab. 59. German KA5: informative beside the MHGW and MNGW."
    systems: [ka5]
  - name: groundwater_mngw_cm
    section: "German system (KA5)"
    type: "numeric"
    unit: "cm"
    description: "Mean low groundwater level, cm below the surface, the MNGW of Tab. 59. German KA5: about the top of the Gr; a stand-in for undescribed G horizons, flagged and provisional (Hugo's decision Q13)."
    systems: [ka5]
  - name: groundwater_step
    section: "German system (KA5)"
    type: "character"
    unit: "-"
    description: "Groundwater step (Grundwasserstufe) of Tab. 59: GWS1 to GWS6, GWS5.1, GWS5.2. German KA5: read through its MHGW and MNGW ranges when the levels are not recorded."
    allowed: ["GWS1", "GWS2", "GWS3", "GWS4", "GWS5", "GWS5.1", "GWS5.2", "GWS6"]
    systems: [ka5]
  - name: vegetation_cover
    section: "German system (KA5)"
    type: "character"
    unit: "-"
    description: "Cover of higher plants: 'none', 'patchy' or 'closed'. German KA5: the Strand, Watt, Nassstrand and Rohmarsch (pp. 249, 254-256). Not recorded: the vegetation text."
    allowed: ["none", "patchy", "closed"]
    systems: [ka5]
  - name: erosion_degree
    section: "German system (KA5)"
    type: "character"
    unit: "-"
    description: "Degree of erosion Eg0 to Eg5 of the KA5. German KA5: the variety e. Not recorded: anthropic_truncation."
    allowed: ["Eg0", "Eg1", "Eg2", "Eg3", "Eg4", "Eg5"]
    systems: [ka5]
  - name: rewetted
    section: "German system (KA5)"
    type: "logical"
    unit: "-"
    description: "The site was rewetted after drainage (TRUE / FALSE). German KA5: the variety w of the Moore. Not recorded: undecided."
    systems: [ka5]
  - name: reductgas_source
    section: "German system (KA5)"
    type: "character"
    unit: "-"
    description: "Source of the reducing gas of the Y horizons: 'mofette', 'pipeline_leak', 'refuse_sludge_harbour_mud' or 'natural_wetness'. German KA5: a written Y gives the Reduktosol unless the source is natural wetness (pp. 232-233; Hugo's decision Q20)."
    allowed: ["mofette", "pipeline_leak", "refuse_sludge_harbour_mud", "natural_wetness"]
    systems: [ka5]
  - name: deep_cultivation_kind
    section: "German system (KA5)"
    type: "character"
    unit: "-"
    description: "Kind of deep cultivation: 'repeated_trenching' (Rigosol), 'single_deep_ploughing' (Treposol), 'plaggen', 'garden', 'peat_sand_culture'. German KA5: separates YY from YU, and the cultivated Moore (pp. 236-237, 262-263; Hugo's decision Q23). Not recorded: mechanical_mixing_purpose; else YY and YU both candidates."
    allowed: ["repeated_trenching", "single_deep_ploughing", "plaggen", "garden", "peat_sand_culture"]
    systems: [ka5]
  - name: flooding_days_growing_period
    section: "FAO-Unesco legend (1988 and 1974)"
    type: "numeric"
    unit: "days"
    description: "Days in the growing period with standing or flowing water on the soil surface. The inundic phase of the Revised Legend of 1988: more than 10 days (p. 68). Not recorded: undecided."
  - name: rudic_recorded
    section: "FAO-Unesco legend (1988 and 1974)"
    type: "logical"
    unit: "logical"
    description: "Gravel, stones, boulders or rock outcrops in the surface layers or at the surface make mechanized agricultural equipment impracticable: the rudic phase of 1988 (p. 69), which replaces the stony phase of 1974 (p. 5). A field observation: not recorded, absent."
