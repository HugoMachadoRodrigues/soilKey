    allowed: [positive, negative]
  - name: sensitivity_class
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Sensitivity class (smeary, greasy feel of a remoulded sample): insensitive, slightly sensitive, moderately sensitive, sensitive, strongly sensitive; NZSC allophanic soil material."
    systems: [nzsc4]
  - name: fluidity_class
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Fluidity class: non-fluid, slightly fluid, moderately fluid, very fluid; NZSC Gley and Recent Soils (no moderately or very fluid horizon within 30 cm)."
    systems: [nzsc4]
    allowed: [non-fluid, slightly fluid, moderately fluid, very fluid]
  - name: stickiness
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Stickiness class: non-sticky, slightly sticky, moderately sticky, very sticky; NZSC allophanic soil material and Melanic Soils."
    systems: [nzsc4]
    allowed: [non-sticky, slightly sticky, moderately sticky, very sticky]
  - name: packing_degree
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Degree of packing of the soil material (low, moderate, high, very high, extremely high); NZSC slowly permeable layer, with the ped size or the texture."
    systems: [nzsc4]
    allowed: [low, moderate, high, very high, extremely high]
  - name: ksat_mm_h
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "mm/h"
    description: "Measured vertical saturated hydraulic conductivity; NZSC slowly permeable layer (below 4 mm/h), which it decides when measured."
