    min: 0
    max: 100
  - name: halite_visible_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Halite crystals, visual abundance; ASC Halic (more than 50 %) and Subhalic (less than 50 %) great groups of the Hypersalic suborders."
    systems: [asc3]
    min: 0
    max: 100
  - name: gritty
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "A distinct sharp gritty feel from gritty coarse sand (0.2-2 mm) and fine gravel of angular or subangular quartz or other hard rock fragments; ASC Gritty great groups. Not recorded is read as absent."
