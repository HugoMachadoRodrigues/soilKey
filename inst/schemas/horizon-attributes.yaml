    max: 100
  - name: spodic_materials_pct
    section: "Chinese system (CST 2001)"
    unit: "% (vol)"
    description: "Spodic materials, % by volume of the horizon. Chinese Soil Taxonomy 2001, the spodic horizon (85 % or more; evidence 50-85 %, pp. 32-33). Not recorded: the horizon's own colours and data read as 100 %, flagged (Hugo's decision Q20)."
