    allowed: ["continuous", "patchy"]
    systems: [ka5]
  - name: terra_material_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Terra material (solution residue of carbonate rock), % of the fine soil. German KA5 (ka5): 50 % or more in the (Bv-)Tv+cCv of the Terra fusca-Rendzina (p. 209). Not recorded: a Tv written in the interfingering horizon."
    systems: [ka5]
    min: 0
    max: 100
  - name: ec_soil_solution_dS_m
    section: "German system (KA5)"
    unit: "dS/m"
    description: "Electrical conductivity of the soil solution, dS/m (= mS/cm). German KA5 (ka5): the marine Watt has 15 or more (p. 255), against the estuarine. Not recorded: ec_dS_m of the saturation extract, flagged."
    systems: [ka5]
    min: 0
  - name: humus_class_ka5
    section: "German system (KA5)"
    unit: "-"
