    allowed: [within peds, matrix, ped faces, voids, skeletans]
  - name: sulfate_s_pct
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "% (mass)"
    description: "Sulfate sulfur of the fine earth, dry mass; NZSC sulfuric soil material (0.05 % or more)."
    systems: [nzsc4]
  - name: roots_abundance
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Abundance of roots in the horizon (none, very few, few, common, many); NZSC Impeded Pumice Soils (a compact, brittle layer with no roots)."
    systems: [nzsc4]
    allowed: [none, very few, few, common, many]
  - name: maori_cultural_layer
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "TRUE for a horizon modified through M\u0101ori cultural practice, with additions of rock fragments, sand, shells, charcoal, ash, seaweed or similar (a cultural layer, as at midden sites); NZSC M\u0101ori Anthropic Soils."
