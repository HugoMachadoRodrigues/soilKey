  - name: coatings_value_moist
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "Munsell"
    description: "Moist Munsell value of the clay or clay-organic coatings on ped faces; NZSC Solonetzic Semiarid Soils (value 4 or less); since 0.9.299 also the dark coatings of the Humose and Placic-humose Acid Gley and Podzolic Yellow Ultic Soils."
