    systems: [nzsc4]
  - name: redox_segregations_location
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Where the high-chroma redox segregations (mottles) mainly are: within peds, matrix (of an apedal horizon), ped faces, voids or skeletans; NZSC perch-gley features (within peds or the matrix) and Groundwater-gley Podzol Soils (coatings on voids or skeletans)."
