  - name: heavy_minerals_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Visible heavy or opaque minerals, identifiable by wet panning in the field; ASC Gravic Arenosols (more than 3 %). Not recorded is read as absent."
