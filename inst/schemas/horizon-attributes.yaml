    min: 0
    max: 100
  - name: water_repellence
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Water repellence of the horizon, Field Handbook ethanol test (non-repellent / repellent / strongly repellent); ASC family water repellence of the surface soil."
