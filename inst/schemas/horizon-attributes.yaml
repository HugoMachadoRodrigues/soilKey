    unit: "-"
    description: "Schwertmannite present in the horizon (TRUE / FALSE). German KA5 (ka5): with jarosite, the sulfate-rich variety sf of the Marschen and Niedermoore (Tab. 46 no. 8, p. 266). Not recorded: jarosite_present."
