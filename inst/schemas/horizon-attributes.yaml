# Metadata of the canonical horizon attributes (one entry per column of
# horizon_column_spec(), in its order). Read by horizon_attribute_spec(); the
# attribute reference inst/ATTRIBUTES.md is generated from it
# (data-raw/generate_attributes_doc.R) and a test keeps the two in step.
#
# Fields: name, section, unit, description. Optional, for the national
# systems: systems (registry ids of the keys that read the attribute),
# allowed (the values of a categorical attribute), min and max (the range of
# a numeric one).
attributes:
  - name: top_cm
    section: "Geometry & boundaries"
    unit: "cm"
    description: "Upper depth of the horizon (from the soil surface)."
  - name: bottom_cm
    section: "Geometry & boundaries"
    unit: "cm"
    description: "Lower depth of the horizon."
  - name: designation
    section: "Geometry & boundaries"
    unit: "-"
    description: "Horizon designation / symbol (e.g. A, Bt, Bw, E, C, R)."
  - name: boundary_distinctness
    section: "Geometry & boundaries"
    unit: "-"
    description: "Distinctness of the lower boundary (abrupt / clear / gradual / diffuse)."
  - name: boundary_topography
    section: "Geometry & boundaries"
    unit: "-"
    description: "Topography of the lower boundary (smooth / wavy / irregular / broken)."
  - name: munsell_hue_moist
    section: "Color (Munsell)"
    unit: "Munsell"
    description: "Munsell hue, moist (e.g. \"7.5YR\", \"10R\", \"N\")."
  - name: munsell_value_moist
    section: "Color (Munsell)"
    unit: "Munsell"
    description: "Munsell value, moist (0-10)."
  - name: munsell_chroma_moist
    section: "Color (Munsell)"
    unit: "Munsell"
    description: "Munsell chroma, moist."
  - name: munsell_hue_dry
    section: "Color (Munsell)"
    unit: "Munsell"
    description: "Munsell hue, dry."
  - name: munsell_value_dry
    section: "Color (Munsell)"
    unit: "Munsell"
    description: "Munsell value, dry (0-10)."
  - name: munsell_chroma_dry
    section: "Color (Munsell)"
    unit: "Munsell"
    description: "Munsell chroma, dry."
  - name: structure_grade
    section: "Structure & consistence"
    unit: "-"
    description: "Grade of structure (structureless / weak / moderate / strong)."
  - name: structure_size
    section: "Structure & consistence"
    unit: "-"
    description: "Size class of structural units (very fine / fine / medium / coarse / very coarse)."
  - name: structure_type
    section: "Structure & consistence"
    unit: "-"
    description: "Type of structure (granular / blocky / prismatic / platy / single-grain / massive)."
  - name: consistence_moist
    section: "Structure & consistence"
    unit: "-"
    description: "Consistence when moist (loose / very friable / friable / firm / very firm / extremely firm)."
  - name: consistence_wet
    section: "Structure & consistence"
    unit: "-"
    description: "Consistence when wet (stickiness and plasticity)."
  - name: clay_films_amount
    section: "Structure & consistence"
    unit: "-"
    description: "Abundance of clay coatings / films (none / few / common / many)."
  - name: clay_films_strength
    section: "Structure & consistence"
    unit: "-"
    description: "Distinctness / thickness of clay films (faint / distinct / prominent)."
  - name: coarse_fragments_pct
    section: "Structure & consistence"
    unit: "% (vol)"
    description: "Coarse fragments (> 2 mm) by volume."
  - name: clay_pct
    section: "Texture"
    unit: "% (mass)"
    description: "Clay content of the fine earth (< 2 um)."
  - name: silt_pct
    section: "Texture"
    unit: "% (mass)"
    description: "Silt content of the fine earth."
  - name: sand_pct
    section: "Texture"
    unit: "% (mass)"
    description: "Sand content of the fine earth."
  - name: ph_h2o
    section: "Acidity"
    unit: "-"
    description: "pH measured in water (1:2.5 or as reported). soilKey's default pH."
  - name: ph_kcl
    section: "Acidity"
    unit: "-"
    description: "pH measured in 1 M KCl."
  - name: ph_cacl2
    section: "Acidity"
    unit: "-"
    description: "pH measured in 0.01 M CaCl2."
  - name: oc_pct
    section: "Organics"
    unit: "% (mass)"
    description: "Organic carbon of the fine earth."
  - name: n_total_pct
    section: "Organics"
    unit: "% (mass)"
    description: "Total nitrogen."
  - name: cec_cmol
    section: "Exchange complex"
    unit: "cmol(+)/kg"
    description: "Cation exchange capacity (of the fine earth)."
  - name: ecec_cmol
    section: "Exchange complex"
    unit: "cmol(+)/kg"
    description: "Effective CEC (sum of exchangeable bases + exchangeable Al)."
  - name: bs_pct
    section: "Exchange complex"
    unit: "%"
    description: "Base saturation (SiBCS V%)."
  - name: al_sat_pct
    section: "Exchange complex"
    unit: "%"
    description: "Aluminium saturation (SiBCS m%)."
  - name: ca_cmol
    section: "Exchange complex"
    unit: "cmol(+)/kg"
    description: "Exchangeable calcium."
  - name: mg_cmol
    section: "Exchange complex"
    unit: "cmol(+)/kg"
    description: "Exchangeable magnesium."
  - name: k_cmol
    section: "Exchange complex"
    unit: "cmol(+)/kg"
    description: "Exchangeable potassium."
  - name: na_cmol
    section: "Exchange complex"
    unit: "cmol(+)/kg"
    description: "Exchangeable sodium."
  - name: al_cmol
    section: "Exchange complex"
    unit: "cmol(+)/kg"
    description: "Exchangeable (KCl) aluminium."
  - name: caco3_pct
    section: "Carbonates / sulphates"
    unit: "% (mass)"
    description: "Calcium carbonate equivalent."
  - name: secondary_carbonates_pct
    section: "Carbonates / sulphates"
    unit: "%"
    description: "identifiable SECONDARY carbonates by volume (soft masses / pseudomycelia / pendents / nodules). The morphological OR-path of the calcic horizon: WRB 2022 3.1.4 protocalcic / USDA KST >= 5% by-volume secondary carbonates, beside the +5%-vs-underlying enrichment"
  - name: caso4_pct
    section: "Carbonates / sulphates"
    unit: "% (mass)"
    description: "Gypsum (calcium sulphate)."
  - name: fe_dcb_pct
    section: "Iron / aluminum oxides"
    unit: "% Fe"
    description: "Dithionite-citrate-bicarbonate extractable Fe (free/pedogenic iron oxides), % Fe (not Fe2O3). Against a total iron given as Fe2O3 (fe_total_pct) the free over total ratio reads fe_dcb_pct / (0.6994 x fe_total_pct)."
  - name: fe_ox_pct
    section: "Iron / aluminum oxides"
    unit: "% Fe"
    description: "Acid ammonium-oxalate extractable Fe (active/amorphous iron; andic)."
  - name: al_ox_pct
    section: "Iron / aluminum oxides"
    unit: "% Al"
    description: "Acid ammonium-oxalate extractable Al (active/amorphous aluminium; andic)."
  - name: si_ox_pct
    section: "Iron / aluminum oxides"
    unit: "% Si"
    description: "Acid ammonium-oxalate extractable Si (andic properties)."
  - name: bulk_density_g_cm3
    section: "Physical"
    unit: "g/cm3"
    description: "Bulk density of the fine earth."
  - name: water_content_33kpa
    section: "Physical"
    unit: "% (water)"
    description: "Gravimetric water content at 33 kPa (field capacity)."
  - name: water_content_1500kpa
    section: "Physical"
    unit: "% (water)"
    description: "Gravimetric water content at 1500 kPa (permanent wilting point)."
  - name: ec_dS_m
    section: "Salinity, redoximorphism, vertic"
    unit: "dS/m"
    description: "Electrical conductivity (saturated paste, 25 C)."
  - name: plinthite_pct
    section: "Salinity, redoximorphism, vertic"
    unit: "%"
    description: "volume % of plinthite (Fe-rich nodules / mottles)"
  - name: redoximorphic_features_pct
    section: "Salinity, redoximorphism, vertic"
    unit: "%"
    description: "volume % of Fe/Mn redox features"
  - name: slickensides
    section: "Salinity, redoximorphism, vertic"
    unit: "-"
    description: "absent / few / common / many / continuous"
  - name: artefacts_pct
    section: "Technic, duric"
    unit: "%"
    description: "volume % of human artefacts (for Technosols)"
  - name: geomembrane_present
    section: "Technic, duric"
    unit: "-"
    description: "WRB 2022 Ch 5 Technosols: continuous geomembrane within 100 cm"
  - name: technic_hardmaterial_pct
    section: "Technic, duric"
    unit: "%"
    description: "WRB 2022 Ch 5 Technosols: % concrete/asphalt/mine spoil at surface (>= 95% within 5 cm)"
  - name: duripan_pct
    section: "Technic, duric"
    unit: "%"
    description: "volume % of Si-cemented duripan (for Durisols)"
  - name: cementation_class
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "-"
    description: "'none' / 'weakly' / 'moderately' / 'strongly' / 'indurated' (for petric variants)"
  - name: p_mehlich3_mg_kg
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "mg/kg"
    description: "plant-available P (anthric / hortic / pretic / ornithogenic)"
  - name: worm_holes_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "volume % of worm holes / casts / coprolites (chernic / vermic / arenicolic)"
  - name: water_dispersible_clay_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "water-dispersible clay, % of the fine earth (a clay content, WRB 2022 Annex 2 Ch 9.4; not a share of the total clay); Ferralsols argic exception"
  - name: sulfidic_s_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "inorganic sulfidic S (hypersulfidic / hyposulfidic / thionic)"
  - name: volcanic_glass_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "% volcanic glass in 0.02-2 mm fraction (vitric / tephric)"
  - name: phosphate_retention_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "P retention (vitric / andic threshold)"
  - name: artefacts_industrial_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "subset of artefacts: industrial-process glasses, slag, ash (organotechnic)"
  - name: artefacts_urbic_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "subset of artefacts: rubble / refuse from human settlements (Technosols urbic)"
  - name: rock_origin
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "-"
    description: "'fluviatile' / 'marine' / 'lacustrine' / 'aeolian' / 'colluvial' / 'pyroclastic' / NA"
  - name: permafrost_temp_C
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "deg C"
    description: "mean annual soil temp at this depth (gelic / cryic)"
  - name: cracks_width_cm
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "cm"
    description: "width of shrink-swell cracks when soil dry (vertic horizon / shrink_swell_cracks)"
  - name: cracks_depth_cm
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "cm"
    description: "depth to which the crack extends from the surface"
  - name: polygonal_cracks_spacing_cm
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "cm"
    description: "avg horizontal spacing of polygonal cracks (takyric properties)"
  - name: desert_pavement_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "% surface coverage by coarse fragments (yermic properties)"
  - name: varnish_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "% of coarse fragments with desert varnish (yermic)"
  - name: ventifact_pct
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "%"
    description: "% of coarse fragments wind-shaped (yermic)"
  - name: vesicular_pores
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "-"
    description: "'absent' / 'few' / 'common' / 'many' (yermic)"
  - name: rupture_resistance
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "-"
    description: "'loose' / 'soft' / 'slightly hard' / 'hard' / 'very hard' / 'extremely hard'"
  - name: plasticity
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "-"
    description: "'non-plastic' / 'slightly plastic' / 'moderately plastic' / 'very plastic'"
  - name: al_kcl_cmol
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "cmol(+)/kg"
    description: "KCl-extractable Al (Alisols criterion)"
  - name: layer_origin
    section: "Completing WRB Ch 3.1 / 3.2 / 3.3 coverage"
    unit: "-"
    description: "'aeolic' / 'fluvic' / 'solimovic' / 'tephric' / 'organic' etc (for material gating). The French Référentiel pédologique 2008 also reads 'colluvic' (the colluviosols and the qualifier colluvial), 'marine' (the thalassosols) and 'transported' (the anthroposols reconstitués) (Hugo's decisions Q14 and Q15). The German KA5 (ka5) reads 'tidal-marine', 'tidal-brackish' and 'tidal-fluvial' (the prefixes tm, tb, tp of the Marschen, Watt and Strand, and the subtype letters n, b, f) and 'limnic' (the subhydric soils)."
  - name: fiber_content_rubbed_pct
    section: "SiBCS pendentes (von Post, Ki/Kr, COLE, sulfuric attack)"
    unit: "%"
    description: "SiBCS Cap 14: % fibras apos esfregamento (Saprico < 17, Hemico 17-40, Fibrico >= 40)"
  - name: fiber_content_unrubbed_pct
    section: "SiBCS pendentes (von Post, Ki/Kr, COLE, sulfuric attack)"
    unit: "%"
    description: "SiBCS Cap 14: % fibras antes do esfregamento (auxiliar)"
  - name: von_post_index
    section: "SiBCS pendentes (von Post, Ki/Kr, COLE, sulfuric attack)"
    unit: "-"
    description: "Indice de decomposicao von Post 1924 (H1-H10): H1-H4 Fibrico / H5-H6 Hemico / H7-H10 Saprico"
  - name: cole_value
    section: "SiBCS pendentes (von Post, Ki/Kr, COLE, sulfuric attack)"
    unit: "-"
    description: "Coefficient of Linear Extensibility (moist at 33 kPa -> oven dry); SiBCS retratil >= 0.06; the French Référentiel pédologique 2008 measures it at -33 kPa too (vertisols, pp. 320-321)"
  - name: sio2_sulfuric_pct
    section: "SiBCS pendentes (von Post, Ki/Kr, COLE, sulfuric attack)"
    unit: "%"
    description: "SiO2 por ataque sulfurico-NaOH (Embrapa Manual de Metodos), para Ki/Kr"
  - name: al2o3_sulfuric_pct
    section: "SiBCS pendentes (von Post, Ki/Kr, COLE, sulfuric attack)"
    unit: "%"
    description: "Al2O3 por ataque sulfurico, para Ki = (SiO2/60.08)/(Al2O3/101.96) molar"
  - name: fe2o3_sulfuric_pct
    section: "SiBCS pendentes (von Post, Ki/Kr, COLE, sulfuric attack)"
    unit: "%"
    description: "Fe2O3 por ataque sulfurico, para Kr = SiO2/(Al2O3+Fe2O3) molar (Latossolos Acriferricos)"
  - name: sand_mica_pct
    section: "SiBCS Cap 18 mineralogia da fracao areia"
    unit: "%"
    description: "SiBCS Cap 18 p 286: % volume de micas na fracao areia (>= 15% -> Familia \"micacea\")"
  - name: sand_amphibole_pct
    section: "SiBCS Cap 18 mineralogia da fracao areia"
    unit: "%"
    description: "SiBCS Cap 18 p 286: % volume de anfibolios (>= 15% -> Familia \"anfibolitica\")"
  - name: sand_feldspar_pct
    section: "SiBCS Cap 18 mineralogia da fracao areia"
    unit: "%"
    description: "SiBCS Cap 18 p 286: % volume de feldspatos (>= 15% -> Familia \"feldspatica\")"
  - name: sand_mineralogy
    section: "SiBCS Cap 18 mineralogia da fracao areia"
    unit: "-"
    description: "SiBCS Cap 18 p 286 fallback: 'micacea' / 'anfibolitica' / 'feldspatica' / 'quartzosa' / NA (atalho qualitativo)"
  - name: woody_fragments_pct
    section: "SiBCS Cap 18 Organossolos"
    unit: "%"
    description: "SiBCS Cap 18 p 288: % volume de galhos/troncos >= 2 cm em horizontes organicos (Organossolos lenhosos / muito lenhosos / extremamente lenhosos). Also read by the humus forms of the French Référentiel pédologique 2008 (Annex 1, p. 340): recognisable woody debris in the O horizons, lignique 35-80 %, xylique over 80 %."
  - name: surface_crust_type
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Biocrustic / Pelocrustic / Evapocrustic / Puffic): biological / clay / evaporite / puffed crust morphology"
  - name: bioturbation_density
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Arenicolic / Isopteric): faunal burrow density (none / few / common / many) -- proxy for invertebrate-driven mixing"
  - name: cordic_horizon
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Cordic): presence of cordic horizon (cemented but not duripan/petrocalcic)"
  - name: microrelief_form
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Dorsic / Gilgaic): microrelief form (gilgai / dorsal-ridge / hummocky / smooth)"
  - name: weathering_stage
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Saprolithic / Naramic / Lapiadic): weathering stage of parent material (fresh / moderately weathered / saprolite / completely weathered)"
  - name: salt_crust_pattern
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Naramic): salt crust morphology (efflorescent / crusty / hardpan)"
  - name: contamination_type
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Immissic): pollution / contamination class (heavy_metals / hydrocarbons / atmospheric_immission / NA)"
  - name: stratification_pattern
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Litholinic / Raptic): stratification description (continuous / interrupted / lithologic_break / NA)"
  - name: aeolian_morphology
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Nechic): aeolian / loess deposition pattern (loess / dune / sandsheet / NA)"
  - name: mottle_morphology
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Mochipic): mottle pattern qualitative (mochi / banded / patchy / NA)"
  - name: surface_puff_layer
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Kalaic / Puffic): seasonal puffed surface layer (TRUE / FALSE / NA)"
  - name: thixotropic_index
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Thixotropic): thixotropic-behaviour index (0-100) from slurry test"
  - name: saprolite_pct
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "%"
    description: "WRB Ch 5 (Saprolithic): % by volume of in-situ weathered saprolite material"
  - name: water_regime_pattern
    section: "Tier-3 schema fields for WRB SQ qualifiers"
    unit: "-"
    description: "WRB Ch 5 (Uterquic): bidirectional / single / aquic regime classification"
  - name: water_content_1500kpa_undried
    section: "Fields that unlock schema-blocked predicates"
    unit: "-"
    description: "1500 kPa water retention on UNDRIED samples; Vitrands/Vitrandic need < 30% undried beside < 15% air-dried (KST 13ed Ch 6)"
  - name: particles_002_2mm_pct
    section: "Fields that unlock schema-blocked predicates"
    unit: "%"
    description: "% of the FINE-EARTH fraction in the 0.02-2.0 mm size class; Vitrandic subgroup crit 2 needs >= 30% (KST 13ed Ch 9)"
  - name: cracks_top_cm
    section: "Fields that unlock schema-blocked predicates"
    unit: "cm"
    description: "depth (cm) of the UPPER boundary of shrink-swell cracks; Vertic subgroup needs cracks within 125 cm (KST 13ed)"
  - name: incubation_ph
    section: "Fields that unlock schema-blocked predicates"
    unit: "-"
    description: "pH after the WRB 8-week aerobic incubation test; hypersulfidic drops < 4, hyposulfidic stays >= 4 (WRB 2022 Ch 3.3.8/3.3.9)"
  - name: ice_pct
    section: "Fields that unlock schema-blocked predicates"
    unit: "%"
    description: "volume % ice (related to whole soil); WRB 2022 Glacic needs >= 75% (Ch 5)"
  - name: water_saturation_days
    section: "Fields that unlock schema-blocked predicates"
    unit: "days"
    description: "cumulative days/year water-saturated; WRB 2022 Mochipic needs >= 300 days (Ch 5)"
  - name: particles_630um_pct
    section: "Fields that unlock schema-blocked predicates"
    unit: "%"
    description: "% particles >= 630 um; WRB 2022 Isopteric needs < 5% (Ch 5)"
  - name: jarosite_present
    section: "Fields that unlock schema-blocked predicates"
    unit: "-"
    description: "jarosite mineral present; WRB 2022 Aceric requires it beside pH 3.5-5 (Ch 5)"
  - name: variegated_colors
    section: "The colours a horizon has beside its matrix colour"
    unit: "-"
    description: "Munsell notations (moist) of the colours of a variegated horizon (coloracao variegada), which has no single matrix colour, separated by \";\" (\"10YR 5/3; 2.5YR 4/6\"); SiBCS Plintossolos (Cap 3, p. 104)"
  - name: mottle_colors
    section: "The colours a horizon has beside its matrix colour"
    unit: "-"
    description: "Munsell notations (moist) of the colours of the mottles (mosqueados) of the horizon, separated by \";\" (\"10YR 6/2; 5YR 5/8\"); SiBCS Plintossolos (Cap 3, p. 104)"
  - name: fe_pyro_pct
    section: "Canadian system (CSSC 3rd ed.)"
    unit: "% Fe"
    description: "Sodium-pyrophosphate-extractable Fe (organically complexed iron); CSSC podzolic B, Bf, Bhf and Bh horizons."
    systems: [cssc3]
    min: 0
    max: 100
  - name: al_pyro_pct
    section: "Canadian system (CSSC 3rd ed.)"
    unit: "% Al"
    description: "Sodium-pyrophosphate-extractable Al (organically complexed aluminium); CSSC podzolic B, Bf and Bhf horizons."
    systems: [cssc3, scsj2017]
    min: 0
    max: 100
  - name: mottle_contrast
    section: "Canadian system (CSSC 3rd ed.)"
    unit: "-"
    description: "Contrast of the mottles with the matrix colour (faint / distinct / prominent); CSSC gleying, ASC mottled horizon."
    systems: [cssc3, asc3]
    allowed: [faint, distinct, prominent]
  - name: field_texture
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Field texture grade (NCST Field Handbook codes: S, LS, CS, SL, L, ZL, SCL, CL, CLS, ZCL, LC, LMC, MC, MHC, HC; sand-size prefixes F/M/K and + or - accepted); ASC textural B, Arenosols, Kandosols and Vertosols."
    systems: [asc3]
  - name: subplasticity
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Kneading test of clays (none / subplastic / strongly subplastic / superplastic); ASC Sodosols and Chromosols."
    systems: [asc3]
    allowed: [none, subplastic, strongly subplastic, superplastic]
  - name: carbonate_soft_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Soft, finely divided pedogenic carbonate (soft segregations and the like), visual abundance; ASC carbonate classes (Calcarosol suborders)."
    systems: [asc3]
    min: 0
    max: 100
  - name: carbonate_hard_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Hard pedogenic carbonate (nodules, concretions, calcrete fragments, carbonate-coated gravel), visual abundance; ASC carbonate classes (Calcarosol suborders)."
    systems: [asc3, cpcs1967]
    min: 0
    max: 100
  - name: ec_1to5_dS_m
    section: "Australian system (ASC 3rd ed.)"
    unit: "dS/m"
    description: "Electrical conductivity of a 1:5 soil:water extract; ASC 'highly saline' (EC > 2 dS/m: Hypersalic, Hypergypsic and Stratic suborders). ec_dS_m is the saturated paste."
    systems: [asc3]
    min: 0
  - name: strength_dry
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Soil strength of the dry soil (Field Handbook classes: loose, very weak, weak, firm, very firm, strong, very strong, rigid); ASC Arenic Rudosols and the melanic horizon."
    systems: [asc3]
  - name: strength_moist
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Soil strength of the moist soil, same classes as strength_dry; ASC Arenic and Lutic Rudosols."
    systems: [asc3]
  - name: ped_size_max_mm
    section: "Australian system (ASC 3rd ed.)"
    unit: "mm"
    description: "Upper limit of the size class of the most common peds (Field Handbook classes: 2, 5, 10, 20, 50 ... mm); ASC melanic horizon (10-20 mm or less)."
    systems: [asc3]
    min: 0
  - name: ferric_nodules_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Ferruginous (and ferromanganiferous) nodules or concretions, visual abundance; ASC ferric horizon (more than 20 %), Sesqui-Nodular Tenosols."
    systems: [asc3, cpcs1967]
    min: 0
    max: 100
  - name: bauxitic_nodules_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Bauxite (aluminous) nodules or concretions, visual abundance; ASC bauxitic horizon (more than 20 %), Sesqui-Nodular Tenosols."
    systems: [asc3]
    min: 0
    max: 100
  - name: manganiferous_nodules_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Black manganiferous nodules or concretions, mostly uncemented, visual abundance; ASC manganic horizon (more than 20 %), Manganic Arenosols."
    systems: [asc3, cpcs1967]
    min: 0
    max: 100
  - name: gypsum_visible_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Visible gypsum (segregations, crystals) of apparently pedogenic origin, visual abundance; ASC gypsic horizon (more than 20 %, at least 0.1 m)."
    systems: [asc3, cpcs1967]
    min: 0
    max: 100
  - name: halite_visible_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Halite crystals, visual abundance; ASC Halic (more than 50 %) and Subhalic (less than 50 %) great groups of the Hypersalic suborders."
    systems: [asc3, cpcs1967]
    min: 0
    max: 100
  - name: gritty
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "A distinct sharp gritty feel from gritty coarse sand (0.2-2 mm) and fine gravel of angular or subangular quartz or other hard rock fragments; ASC Gritty great groups. Not recorded is read as absent."
    systems: [asc3]
  - name: heavy_minerals_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Visible heavy or opaque minerals, identifiable by wet panning in the field; ASC Gravic Arenosols (more than 3 %). Not recorded is read as absent."
    systems: [asc3]
    min: 0
    max: 100
  - name: pan_type
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Kind of pan in the horizon (Field Handbook: red-brown hardpan, calcrete, ferricrete, alcrete, thin ironpan, silcrete, duripan, fragipan, densipan, organic pan, ortstein, other pan; 'none' when recorded absent); ASC Duric, Petroferric, Petrocalcic, Placic great groups."
    systems: [asc3, cpcs1967]
  - name: esp_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "%"
    description: "Exchangeable sodium percentage as the laboratory reports it, read when exchangeable Na or the CEC is not given; ASC sodic."
    systems: [asc3, cpcs1967]
    min: 0
    max: 100
  - name: soil_water_status
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Moisture of the horizon when it was described (Field Handbook: dry / moderately moist / moist / wet); ASC Vertosols, whose cracks are not required in a solum described moist."
    systems: [asc3]
    allowed: [dry, moderately moist, moist, wet]
  - name: effervescence_class
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Field reaction of the fine earth with 1 M HCl (none / slight / moderate / strong / very strong); ASC calcareous soil."
    systems: [asc3, cpcs1967]
    allowed: [none, slight, moderate, strong, very strong]
  - name: gravel_pct
    section: "Australian system (ASC 3rd ed.)"
    unit: "% (vol)"
    description: "Gravel-sized (2-60 mm) coarse fragments, visual abundance; ASC family gravel classes (glossary 'Gravel'). Without it the family reads coarse_fragments_pct."
    systems: [asc3, scsj2017, cpcs1967]
    min: 0
    max: 100
  - name: water_repellence
    section: "Australian system (ASC 3rd ed.)"
    unit: "-"
    description: "Water repellence of the horizon, Field Handbook ethanol test (non-repellent / repellent / strongly repellent); ASC family water repellence of the surface soil."
    systems: [asc3]
    allowed: [non-repellent, repellent, strongly repellent]
  - name: naf_test
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Reactive-aluminium (NaF) field test on a moist sample (none, slight, moderate, strong; New Zealand codes N, L, M, H); NZSC allophanic soil material, podzolic-B horizon, Brown Soils."
    systems: [nzsc4]
    allowed: [none, slight, moderate, strong]
  - name: childs_test
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Childs' test (2,2'-bipyridine) for ferrous iron, positive or negative; NZSC Gley Soils (ironstone-pan route) and reductimorphic horizons."
    systems: [nzsc4, scsj2017, cpcs1967]
    allowed: [positive, negative]
  - name: sensitivity_class
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Sensitivity class (smeary, greasy feel of a remoulded sample): insensitive, slightly sensitive, moderately sensitive, sensitive, strongly sensitive; NZSC allophanic soil material."
    systems: [nzsc4]
  - name: fluidity_class
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Fluidity class: non-fluid, slightly fluid, moderately fluid, very fluid; NZSC Gley and Recent Soils (no moderately or very fluid horizon within 30 cm)."
    systems: [nzsc4, scsj2017]
    allowed: [non-fluid, slightly fluid, moderately fluid, very fluid]
  - name: stickiness
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Stickiness class: non-sticky, slightly sticky, moderately sticky, very sticky; NZSC allophanic soil material and Melanic Soils."
    systems: [nzsc4]
    allowed: [non-sticky, slightly sticky, moderately sticky, very sticky]
  - name: packing_degree
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Degree of packing of the soil material (low, moderate, high, very high, extremely high); NZSC slowly permeable layer, with the ped size or the texture."
    systems: [nzsc4]
    allowed: [low, moderate, high, very high, extremely high]
  - name: ksat_mm_h
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "mm/h"
    description: "Measured vertical saturated hydraulic conductivity; NZSC slowly permeable layer (below 4 mm/h), which it decides when measured."
    systems: [nzsc4]
  - name: penetration_resistance_kpa
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "kPa"
    description: "Soil penetration resistance, moist; NZSC densipan (more than 4,000 kPa) and Pan Podzol Soils (3,100 kPa or more)."
    systems: [nzsc4]
  - name: redox_segregations_location
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Where the high-chroma redox segregations (mottles) mainly are: within peds, matrix (of an apedal horizon), ped faces, voids or skeletans; NZSC perch-gley features (within peds or the matrix) and Groundwater-gley Podzol Soils (coatings on voids or skeletans)."
    systems: [nzsc4, scsj2017]
    allowed: [within peds, matrix, ped faces, voids, skeletans]
  - name: sulfate_s_pct
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "% (mass)"
    description: "Sulfate sulfur of the fine earth, dry mass; NZSC sulfuric soil material (0.05 % or more)."
    systems: [nzsc4]
  - name: roots_abundance
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "Abundance of roots in the horizon (none, very few, few, common, many); NZSC Impeded Pumice Soils (a compact, brittle layer with no roots)."
    systems: [nzsc4]
    allowed: [none, very few, few, common, many]
  - name: maori_cultural_layer
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "TRUE for a horizon modified through M\u0101ori cultural practice, with additions of rock fragments, sand, shells, charcoal, ash, seaweed or similar (a cultural layer, as at midden sites); NZSC M\u0101ori Anthropic Soils."
    systems: [nzsc4]
  - name: coatings_value_moist
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "Munsell"
    description: "Moist Munsell value of the clay or clay-organic coatings on ped faces; NZSC Solonetzic Semiarid Soils (value 4 or less); since 0.9.299 also the dark coatings of the Humose and Placic-humose Acid Gley and Podzolic Yellow Ultic Soils."
    systems: [nzsc4]
  - name: sphagnum_fibres_pct
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "%"
    description: "Share of the organic fibres that are Sphagnum (moss peat); NZSC Sphagnic Fibric Organic Soils (more than 70 % to 60 cm). Recorded when met: not recorded reads as none."
    systems: [nzsc4]
  - name: shelly_layer
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "-"
    description: "TRUE for a layer of shells (shell beds, shelly sand); NZSC Calcareous Recent Gley Soils (a shelly layer within 60 cm). Recorded when met: not recorded reads as none."
    systems: [nzsc4]
  - name: pore_coatings_hue_moist
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "Munsell"
    description: "Moist Munsell hue of the coatings on pores (not root linings), or of the gel-like masses bridging sand grains or coating coarse fragments; NZSC Acidic and Vitric-acidic Orthic Allophanic Soils (hue 7.5YR or redder, value 5 or less, chroma 3 or more). Recorded when met: not recorded reads as none."
    systems: [nzsc4]
  - name: pore_coatings_value_moist
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "Munsell"
    description: "Moist Munsell value of the coatings on pores or gel-like masses (see pore_coatings_hue_moist)."
    systems: [nzsc4]
    min: 0
    max: 10
  - name: pore_coatings_chroma_moist
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "Munsell"
    description: "Moist Munsell chroma of the coatings on pores or gel-like masses (see pore_coatings_hue_moist)."
    systems: [nzsc4]
    min: 0
  - name: weathered_fragments_pct
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "%"
    description: "Share of the coarse rock fragments that are weathered enough to break easily by hammer or spade; NZSC Weathered Aged-argillic Semiarid, Weathered-argillic Perch-gley, Mottled-weathered and Weathered Argillic Pallic Soils (the majority, more than 50 %). Recorded when met: not recorded reads as none."
    systems: [nzsc4]
    min: 0
    max: 100
  - name: soluble_salts_pct
    section: "Hungarian system (HSCS 2024)"
    unit: "%"
    description: "Total water-soluble salts, % by mass of the soil, as Hungarian laboratories report them (estimated from the electrical conductivity of the saturated paste, MSZ-08-0206-2:1978). HSCS 2024 solonchak horizon (0.15 % or more). Not converted from ec_dS_m: the text itself finds that conversion unreliable."
    systems: [hscs2024]
    min: 0
    max: 100
  - name: soluble_salts_sulfate_pct
    section: "Hungarian system (HSCS 2024)"
    unit: "%"
    description: "Sulphate share of the total water-soluble salts, % (of the salts, not of the soil). HSCS 2024 subtype karbonát-szulfátos: at least 50 %."
    systems: [hscs2024]
    min: 0
    max: 100
  - name: soluble_salts_chloride_pct
    section: "Hungarian system (HSCS 2024)"
    unit: "%"
    description: "Chloride share of the total water-soluble salts, % (of the salts, not of the soil). HSCS 2024 subtype karbonát-kloridos: at least 30 %."
    systems: [hscs2024]
    min: 0
    max: 100
  - name: p2o5_al_mg_kg
    section: "Hungarian system (HSCS 2024)"
    unit: "mg/kg"
    description: "P2O5 extracted by the ammonium-lactate (AL) method, mg/kg. HSCS 2024 hortikus (anthropogenic horizon and subtype): at least 500 mg/kg in the upper 20 cm."
    systems: [hscs2024]
    min: 0
  - name: digo_pct
    section: "Hungarian system (HSCS 2024)"
    unit: "%"
    description: "Visible traces of applied digó earth (a calcareous ameliorant), % of the soil matrix. HSCS 2024 variety digózott: at least 5 % within 50 cm."
    systems: [hscs2024]
    min: 0
    max: 100
  - name: coarse_fragments_shape
    section: "Hungarian system (HSCS 2024)"
    unit: "-"
    description: "Shape of the coarse fragments: rounded (gravel) or angular (rock debris). HSCS 2024 varieties kavicsos (rounded) and kőzettörmelékes (angular)."
    systems: [hscs2024]
    allowed: [rounded, angular, mixed]
  - name: soluble_salts_carbonate_pct
    section: "Hungarian system (HSCS 2024)"
    unit: "%"
    description: "Carbonate and bicarbonate share of the total water-soluble salts, % (of the salts, not of the soil). HSCS 2024 subtypes karbonát-szulfátos and karbonát-kloridos: at least 20 % beside the sulphate or chloride share (Hugo's reading, 2026-10-30)."
    systems: [hscs2024]
    min: 0
    max: 100
  - name: secondary_carbonates_form
    section: "Carbonates / sulphates"
    unit: "-"
    description: "Form of the secondary carbonates, FAO (2006): pseudomycelia, coatings (on ped faces), soft concretions, hard concretions, powdery, masses. HSCS 2024 subtype mészlepedékes (whitish coatings, pseudomycelia, on ped faces)."
    systems: [hscs2024, cpcs1967]
    allowed: [pseudomycelia, coatings, soft concretions, hard concretions, powdery, masses]
  - name: mottle_size_class
    section: "Salinity, redoximorphism, vertic"
    unit: "-"
    description: "Size class of the mottles, FAO (2006): very fine (< 2 mm), fine (2-6 mm), medium (6-20 mm), coarse (> 20 mm). HSCS 2024 iron accumulation horizon (vaskiválásos): large mottles over 20 mm."
    systems: [hscs2024]
    allowed: [very fine, fine, medium, coarse]
  - name: ec_max_dS_m
    section: "Salinity, redoximorphism, vertic"
    unit: "dS/m"
    description: "Upper bound of the electrical conductivity of the saturated paste, when only a more dilute extract was measured (ISIS: EC 1:2.5 x 12.5, for a saturation percentage of 20 % or more). Read only by the salic test, to rule a layer out; ec_dS_m wins when it is known."
    min: 0
  - name: ph_naf
    section: "Acidity"
    unit: "-"
    description: "pH in 1 M NaF (the sodium fluoride test of Fieldes and Perrott, 1966). WRB 2022 Ch 3.2.3: a pH in NaF of 9.5 or more indicates allophane or organo-aluminium complexes. andic_properties() reads Alox + 1/2 Feox >= 2 % with a pH NaF >= 9.5 as andic where bulk density is not measured (a proxy, recorded in the evidence). The USDA keys do not read it."
    min: 0
    max: 14
  - name: pressure_faces
    section: "Structure & consistence"
    unit: "-"
    description: "Abundance of pressure faces on the surfaces of the soil aggregates (none / few / common / many): shiny surfaces of aggregates pressed against each other, without the striations of slickensides and of the colour of the matrix (WRB 2022 Annex 1, Ch 8.4.14). The WRB 2022 nitic horizon (Ch 3.1.22) asks for pressure faces on 25 % or more of the aggregate surfaces, read as common or more. Clay coatings are recorded in clay_films_amount, not here."
    allowed: [none, few, common, many]
  - name: structure_type_secondary
    section: "Structure & consistence"
    unit: "-"
    description: "Type of the second-level structure into which the first-level structural units break (e.g. angular blocky breaking into polyhedral or flat-edged elements). Read only by the WRB 2022 nitic horizon (Ch 3.1.22, criterion 2.a); structure_type is the first level."
  - name: structure_type_one_of
    section: "Structure & consistence"
    unit: "-"
    description: "The type of structure when the record names one of several, not known which, as words joined by 'or' (the older New Zealand term nut is granular or polyhedral, NZ Soil Description Handbook 2024, Note 12.1: 'granular or polyhedral'); structure_type is then left empty, so the keys that do not read this attribute read the type as not recorded. The NZSC key reads a criterion under each type: it holds when it holds for every one, fails when it fails for every one, and is undecided otherwise."
    systems: [nzsc4]
  - name: phosphate_absorption_coef
    section: "Japanese system (SCSJ 2017)"
    unit: "mg P2O5/100 g"
    description: "Phosphate absorption coefficient (Japanese method), mg P2O5 per 100 g of dry soil; the SCSJ 2017 writes it in mg P2O5/g (15.00 = 1500). The kuroboku feature needs 1500 or more and the immature kuroboku feature 300 to under 1500; P retention (phosphate_retention_pct, 85 % and 25 %) or Alo + 1/2 Feo (2.0 % and 0.4 %) replace it when it is not measured. Not the Blakemore P retention."
    systems: [scsj2017]
    min: 0
  - name: active_al_test
    section: "Japanese system (SCSJ 2017)"
    unit: "-"
    description: "Japanese field active-aluminium test (NaF with phenolphthalein paper, Soil Survey Handbook, JSP 1997), graded by how fast and how strongly the paper turns red: -, +-, +, 2+, 3+. SCSJ 2017: a vivid red within a minute (2+ or more) indicates the kuroboku feature; none or +- (no colour, or colour after 5 minutes) indicates no kuroboku feature. Read only when no laboratory value decides. The New Zealand NaF test (naf_test) uses other grades."
    systems: [scsj2017]
    allowed: ["-", "+-", "+", "2+", "3+"]
  - name: n_value
    section: "Japanese system (SCSJ 2017)"
    unit: "-"
    description: "n value of a water-saturated deposit (Pons and Zonneveld 1965): (field water content % of dry soil - 0.2 x silt and sand %) / (clay % + 3 x organic matter %). SCSJ 2017 physical immaturity: 1 or more (or the material squeezes between the fingers, fluidity_class)."
    systems: [scsj2017]
    min: 0
  - name: exchange_acidity_y1
    section: "Japanese system (SCSJ 2017)"
    unit: "mL"
    description: "Exchange acidity y1 (Daikuhara's method): mL of 0.1 M NaOH needed to titrate the 1 M KCl extract of 100 g of dry soil. SCSJ 2017 non-allophanic kuroboku feature: 5 or more (or Sio under 0.6 %, or Alp/Alo 0.5 or more); not read on farmland, where fertilising and liming change it."
    systems: [scsj2017]
    min: 0
  - name: ph_h2o2
    section: "Japanese system (SCSJ 2017)"
    unit: "-"
    description: "pH of the soil after oxidation with hydrogen peroxide. SCSJ 2017 potential sulfuric material: pH(H2O) 4.0 or more with pH(H2O2) under 3.0, in material saturated unless drained (the Thionic subgroups of the Gley and Gray Fluvic soils)."
    systems: [scsj2017]
    min: 0
    max: 14
  - name: peat_moor_type
    section: "Japanese system (SCSJ 2017)"
    unit: "-"
    description: "Peat material by the plants it is made of (SCSJ 2017 IV.3): high-moor (Sphagnum, Carex middendorffii, Vaccinium oxycoccus, Rhynchospora, Scheuchzeria the largest share), transitional (Moliniopsis, Eriophorum, Myrica gale, Picea glehnii), low-moor (other). The High-moor and Transitional-moor Peat soils read the uppermost 25 cm of the peat. The Russian Field Guide of 2008 adds mesophilic: the litter of non-mire herbs, dwarf shrubs or krummholz, the dry peat TJ (Hugo's decision Q22); its oligotrophic peat TO is high-moor, its eutrophic peat TE transitional or low-moor."
    systems: [scsj2017, cpcs1967, kidpr2008]
    allowed: [high-moor, transitional, low-moor, mesophilic]
  - name: artefacts_organic
    section: "Japanese system (SCSJ 2017)"
    unit: "-"
    description: "TRUE where the artificial material of the horizon is mainly organic (household refuse and the like), FALSE where mainly inorganic. SCSJ 2017 Organic Artifactual soils (also read from the site)."
    systems: [scsj2017]
  - name: leached_spots
    section: "Japanese system (SCSJ 2017)"
    unit: "-"
    description: "Leached (bleached) spots in the horizon (the Japanese youdatsu-han), TRUE or FALSE. SCSJ 2017 forest soil phases of the Podzols: a podzolic accumulation horizon by analysis with one by morphology and leached spots is moderately developed."
    systems: [scsj2017]

  - name: texture_class_jp
    section: "Japanese system (CSCJ 2011)"
    unit: "-"
    description: "The Japanese soil texture class of the Soil Survey Handbook (ISSS fractions): HC, SiC, LiC, SC, SiCL, CL, SCL (fine-textured), SiL, L, FSL (medium-textured), CoSL, LS, S (coarse-textured), or the Japanese words. CSCJ 2011 soil series groups; without it, clay_pct of 15 % or more reads as fine-textured and medium vs coarse is undecided."
    systems: [cscj2011]
  - name: hardness_yamanaka_mm
    section: "Japanese system (CSCJ 2011)"
    unit: "mm"
    description: "Soil hardness by the Yamanaka-type hardness tester (penetration in mm). CSCJ 2011 pan layer (29 mm or more, 10 cm or more thick); not recorded: no pan layer."
    systems: [cscj2011]
  - name: ice_form
    section: "French system (CPCS 1967)"
    unit: "-"
    description: "Form of the ground ice in the layer, as text: lenses (large or small), veins, wedges, pore ice, massive ice, or none. Read by the CPCS groups of the permafrost soils (II/11-13): ice lenses or segregated ice, or 20 % ice or more (ice_pct), is a strong ice segregation. Not recorded with ice_pct: the group is undecided."
    systems: [cpcs1967]
  - name: caco3_active_pct
    section: "French system (CPCS 1967)"
    unit: "%"
    description: "Active carbonate (calcaire actif, the Drouineau ammonium-oxalate method), % of the fine earth. Read by the CPCS rendzinas rich in active carbonate (V/112): 10 % or more in the A; not recorded, a very strong effervescence decides."
    systems: [cpcs1967]
  - name: coarse_sand_pct
    section: "French system (CPCS 1967)"
    unit: "%"
    description: "Coarse sand (0.2-2 mm, the French size class), % of the fine earth. Read by the CPCS ferrallitic subgroups: 'faiblement remanié' (with fine_sand_pct, the coarse to fine sand ratio of the A and of the B differing by 20 % or more) and 'éluvié' (twice the coarse sand at the A/(B) boundary, as twice the coarse fragments and nodules)."
    systems: [cpcs1967]
  - name: fine_sand_pct
    section: "French system (CPCS 1967)"
    unit: "%"
    description: "Fine sand (0.05-0.2 mm, the French size class), % of the fine earth. Read with coarse_sand_pct by the CPCS ferrallitic subgroups 'faiblement remanié' (X/124, X/235, X/335)."
    systems: [cpcs1967]
  - name: gibbsite_pct
    section: "French system (CPCS 1967)"
    unit: "%"
    description: "Gibbsite, % of the clay fraction. Read by the CPCS subgroup of the dark brown, very acid, gibbsitic ferrallitic soils (X/322): 25 % or more in the larger part of the B; not recorded, Ki under 1.0 where Ki exists, else the colour and the pH alone."
    systems: [cpcs1967]
  - name: phys_clay_pct
    section: "Russian system (Field Guide 2008)"
    unit: "%"
    description: "Physical clay (particles under 0.01 mm, the Kachinsky analysis), % of the fine earth. The Russian Field Guide of 2008 writes texture in the Kachinsky gradations of the podzolic scale (sand under 10, loamy sand 10-20, light loam 20-30, medium loam 30-40, heavy loam 40-50, light clay 50-65, medium clay 65-80, heavy clay over 80); one gradation lighter or heavier than the horizon below or above separates E from EL and BT from BI. Not recorded: texture_class_ru, else the USDA texture class, flagged approximate (Hugo's decision Q7)."
    systems: [kidpr2008]
    min: 0
    max: 100
  - name: texture_class_ru
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "Texture class of the Russian (Kachinsky) scale, in English or in Russian: sand (песок), loamy sand (супесь), light, medium or heavy loam (легкий, средний, тяжелый суглинок), light, medium or heavy clay (легкая, средняя, тяжелая глина), the Russian words written with е or ё. Read for the gradations of the Russian Field Guide of 2008 where phys_clay_pct is not recorded (Hugo's decision Q7)."
    systems: [kidpr2008]
    allowed: [sand, loamy sand, light loam, medium loam, heavy loam, light clay, medium clay, heavy clay, песок, супесь, легкий суглинок, средний суглинок, тяжелый суглинок, легкая глина, средняя глина, тяжелая глина]
  - name: loi_pct
    section: "Russian system (Field Guide 2008)"
    unit: "%"
    description: "Loss on ignition, % of the dry mass. The Russian Field Guide of 2008 bounds its organic horizons by it: the peat horizons over 35 %, the peregnoi H over 25 %, the agro-peat-mineral PTR under 35 %, the coarse-humus AO 15-35 %, AH 10-25 %. Not recorded: 1.724 x oc_pct (35 % is then 20.3 % organic carbon; Hugo's decision Q6)."
    systems: [kidpr2008]
    min: 0
    max: 100
  - name: peat_decomposition_pct
    section: "Russian system (Field Guide 2008)"
    unit: "%"
    description: "Degree of decomposition of peat, % (the Russian method: the share of the plant tissue that has lost its cell structure). The Russian Field Guide of 2008 reads 50 % or more as the peregnoi H and at most 50 % as a peat horizon (O, T, TO, TE, TJ, PT). Not recorded: von_post_index (H7 or more decomposed, H4 or less not), then fiber_content_rubbed_pct (under 17 % decomposed, 40 % or more not); between them undecided (Hugo's decision Q6)."
    systems: [kidpr2008]
    min: 0
    max: 100
  - name: peat_botanical_composition
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "The plants whose remains make the peat, with their share in % where known, joined by ';' (sedge 50; wood 30; sphagnum 20), in English or Russian: wood (древесный), reed (тростниковый), Scheuchzeria (шейхцериевый), horsetail (хвощовый), herb (травяной), cotton-grass (пушицевый), Sphagnum (сфагновый), sedge (осоковый), Hypnum (гипновый). The Russian Field Guide of 2008 names the species of peat of its organogenic soils by the plant whose remains are more than 40 % of the peat, by two when two dominate (древесно-осоковый, p. 136); a record with no shares names its dominant plants. Not recorded: the species is undecided."
    systems: [kidpr2008]
  - name: foreign_fragments_pct
    section: "Russian system (Field Guide 2008)"
    unit: "%"
    description: "Fragments of other horizons mixed into the layer (deep ploughing, plantage, trenching, burrowing), % of the vertical section. The Russian Field Guide of 2008 reads 80 % or more (under 20 % of the section undisturbed) over 40 cm as the turbated horizon TUR, a thinner mixed layer as the feature tr, over 25 % of an agro horizon as agr, fragments of the horizon below in an agro horizon as pb. Not recorded: the site's mechanical_mixing_depth_cm, flagged (Hugo's decision Q20)."
    systems: [kidpr2008]
    min: 0
    max: 100
  - name: turbated_fragments
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "The horizons whose fragments make up a turbated layer, as Russian indices joined by ';' (SEL;ASN). Read for the post-solonetz turbozems and the solonetzic agrozems of the Russian Field Guide of 2008, which the formulas write TUR[SEL+ASN]; a designation written that way gives them too (Hugo's decision Q20)."
    systems: [kidpr2008]
  - name: contamination_hazard
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "Hazard category of the pollutants in the layer by the Russian sanitary standards: permissible, moderately hazardous, highly hazardous or extremely hazardous. The Russian Field Guide of 2008 makes a layer starting within 30 cm with extremely hazardous pollutants the contaminated horizon X, and the soil a chemozem; the site's contaminated or contamination_type without a category leave X undecided, and nothing recorded means no X (Hugo's decision Q23)."
    systems: [kidpr2008]
    allowed: [permissible, moderately hazardous, highly hazardous, extremely hazardous]
  - name: pollutants
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "The pollutants of the layer, as text (Cu, Ni, Co; oil products; radionuclides). Named in the name of a chemozem of the Russian Field Guide of 2008, which keeps the name of the soil it was before the pollution (Hugo's decision Q23)."
    systems: [kidpr2008]
  - name: uncoated_grains_pct
    section: "Russian system (Field Guide 2008)"
    unit: "%"
    description: "Share of the sand and silt grains with no colouring (iron or humus) film, % (seen with a hand lens). Key position 30 of the Russian Field Guide of 2008: films on under 20 % of the grains (over 80 % uncoated) count as no films; continuous films make BHF, BFM, BAN or F. Not recorded: soilKey's spodic horizon stands in for the films of BHF, flagged (Hugo's decisions Q4 and Q24)."
    systems: [kidpr2008]
    min: 0
    max: 100
  - name: effervescence_extent
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "Extent of the effervescence with 10 % HCl over the horizon: none, local (spots, single fragments or morphons) or continuous (the whole mass). Key position 32 of the Russian Field Guide of 2008: continuous effervescence leads to BCA, CAT, ML or the feature ca. Not recorded: caco3_pct (1 % or more is continuous, under 0.5 % none) or effervescence_class (strong or very strong is continuous; none is none) (Hugo's decision Q24)."
    systems: [kidpr2008]
    allowed: [none, local, continuous]
  - name: plant_residues_pct
    section: "Russian system (Field Guide 2008)"
    unit: "% (vol)"
    description: "Plant residues in the layer (live roots excluded), % by volume. Key positions 10 and 11 of the Russian Field Guide of 2008: over two thirds of the volume makes an organic horizon (peat or peregnoi), coarse residues under one third an AH, AO or PTR. Not recorded: the organic matter (loi_pct, else oc_pct) stands in (Hugo's decisions Q6 and Q24)."
    systems: [kidpr2008]
    min: 0
    max: 100
  - name: sulfide_odour
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "Smell of hydrogen sulfide from the layer, TRUE or FALSE. Key position 3 of the Russian Field Guide of 2008: a black silty layer smelling of H2S under a salt crust is the sulfidic solonchak SS, otherwise the solonchak S. Not recorded: sulfidic_s_pct (Hugo's decision Q24)."
    systems: [kidpr2008]
  - name: slickensides_size
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "Size of the slickensides in the layer: small (chaotic, under about 20 cm), large (over 20-30 cm) or both. The vertic horizon V of the Russian Field Guide of 2008 needs small and large slickensides with wedge-shaped peds; one or two of those signs make the feature v. Not recorded: slickensides with the wedge-shaped structure (Hugo's decision Q24)."
    systems: [kidpr2008]
    allowed: [small, large, both]
  - name: cryoturbation
    section: "Russian system (Field Guide 2008)"
    unit: "-"
    description: "Cryoturbation in the layer (bent or torn horizons, involutions, organic material pulled down by frost): none or present. The feature @ of the Russian Field Guide of 2008, and evidence of its cryogenic horizon CR. Not recorded: an irregular or broken boundary with frost in the profile (Hugo's decision Q24)."
    systems: [kidpr2008]
    allowed: [none, present]
  - name: coarse_fragments_wt_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Coarse elements (over 2 mm), % by weight of the air-dried whole soil, as the French Référentiel pédologique 2008 measures them (pp. 24, 249), not by volume. The RP reads them for the peyric horizons X (over 60 % over more than 10 cm), the peyrosols (over 60 % in the upper 50 cm), the rankosols and the qualifiers caillouteux, graveleux and pierreux (over 40 %). Not recorded: coarse_fragments_pct (by volume) converted with a rock density of 2.65 and the recorded bulk density of the fine earth, flagged; with no bulk density, a volume at or above the threshold reads yes (the weight share is never lower, except for porous rocks), a volume under 35 % (for 60) or under 20 % (for 40) no, and between them the test is undecided (Hugo's decision Q11)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: gravel_wt_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Gravel (graviers, 0.2-2 cm), % by weight of the whole soil (Référentiel pédologique 2008, p. 249). The RP gravelly horizon Xgr has over 50 % gravel; also the qualifier graveleux. Not recorded: gravel_pct (by volume), flagged (Hugo's decision Q11)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: cobbles_wt_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Cobbles (cailloux, 2-7.5 cm), % by weight of the whole soil (Référentiel pédologique 2008, p. 249). The RP cobbly horizon Xc has over 50 % cobbles, stones and boulders with cobbles dominant; also the qualifier caillouteux. Not recorded: the coarse fragments by volume, flagged (Hugo's decision Q11)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: stones_wt_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Stones (pierres, 7.5-20 cm; not the 7.5-25 cm of other French guides), % by weight of the whole soil (Référentiel pédologique 2008, p. 249). The RP stony horizon Xp has over 50 % cobbles, stones and boulders with stones or boulders dominant; also the qualifier pierreux. Not recorded: the coarse fragments by volume, flagged (Hugo's decision Q11)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: boulders_wt_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Boulders (blocs, over 20 cm), % by weight of the whole soil (Référentiel pédologique 2008, p. 249), counted with the stones for the RP stony horizon Xp. Not recorded: the coarse fragments by volume, flagged (Hugo's decision Q11)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: cec_method
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "Method of the CEC and the exchangeable bases of the layer: acetate_ph7 (ammonium acetate at pH 7), cobaltihexammine (at the pH of the soil, common in French laboratories), bacl2, kcl, nh4cl or oxalate. The French Référentiel pédologique 2008 reads S/CEC with the CEC by ammonium acetate at pH 7 (p. 50); a CEC by another method stands in for it, flagged, with a lower grade of evidence; not recorded, the CEC is read as reported, with a note (Hugo's decision Q12)."
    systems: [rp2008]
    allowed: ["acetate_ph7", "cobaltihexammine", "bacl2", "kcl", "nh4cl", "oxalate"]
  - name: redox_relict
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "TRUE when the redox features of the layer are relict (fossil hydromorphy, the qualifier paléorédoxique), FALSE when they are recorded as functional. The French Référentiel pédologique 2008 asks for a functional hydromorphy (pp. 279, 281) for g, G and the doubles with the rédoxisols: redox features count as functional unless recorded as relict, and reductic features always (Hugo's decision Q13)."
    systems: [rp2008]
  - name: anthropic_material
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "Kind of anthropic material of the layer, as the materials Z of the French Référentiel pédologique 2008 (pp. 27-28): earthy (Ztr), technological (Ztc), holorganic (ZO), archaeological (Zar), or transported (pedological or geological material moved by people, the suffix -tp). Read for the anthroposols artificiels, construits, archéologiques and reconstitués. Not recorded: the Z codes of the designation, then the artefacts_* attributes (Hugo's decision Q15)."
    systems: [rp2008]
    allowed: ["earthy", "technological", "holorganic", "archaeological", "transported"]
  - name: anthropic_material_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "% (vol)"
    description: "Share of the anthropic material in the layer, % by volume. French Référentiel pédologique 2008 (pp. 27-28, 88-98): the anthroposols artificiels have over 50 %, the archéologiques 20 % or more of anthropic debris and artefacts over 50 cm, the qualifier anthropisé under 50 %. Not recorded: artefacts_pct (Hugo's decision Q15)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: o_zoogenic
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "For an OF or OH horizon: zoogenic (zo: the fine organic matter is made of faecal pellets of the litter fauna) or non-zoogenic (noz), French Référentiel pédologique 2008, Annex 1 (pp. 331-333). Reads OFzo, OFnoz, OHzo and OHnoz, and the humus forms (moder and amphimus against mor). The suffix zo or noz of the designation gives it too; not recorded, the humus form stays undecided between its candidates (Hugo's decision Q22)."
    systems: [rp2008]
    allowed: ["zo", "noz"]
  - name: fine_organic_matter_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "% (vol)"
    description: "Fine organic matter (holorganic material with no plant debris recognisable by eye), % by volume of an O horizon, fine roots and mycelia excluded (French Référentiel pédologique 2008, pp. 8, 329-333): OL under 10 %, OF 10-70 % (OFr under 30, OFm 30-70), OH over 70 % (OHr 70-90; OHf with recognisable debris under 10 %). Not recorded: the designation (OL, OF, OH; the FAO Oi, Oe, Oa as hints), else 100 minus plant_residues_pct, flagged (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: biogenic_aggregates_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "% (vol)"
    description: "Biogenic crumb or granular aggregates, % by volume of an A horizon (French Référentiel pédologique 2008, pp. 10-11, 334): over 25 % makes a biomacrostructured or biomesostructured A, 25 % or less a non-crumb A; read by Aca, Aci, Ado, the veracrisols and the humus forms. Not recorded: a moderate or strong crumb or granular structure with worm holes, or a mull humus form, flagged; otherwise undecided (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: biogenic_aggregate_size
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "Size of most biogenic aggregates of an A horizon (French Référentiel pédologique 2008, p. 10): macro (more than half over about 3 mm: a biomacrostructured A) or meso (more than half 1-3 mm: a biomesostructured A). Not recorded: structure_size, flagged (Hugo's decision Q23)."
    systems: [rp2008]
    allowed: ["macro", "meso"]
  - name: effervescence_hot
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "TRUE when the fine earth effervesces with hot HCl and not, or very weakly, with cold HCl: dolomite. French Référentiel pédologique 2008 (pp. 12, 16): the dolomitic Ado and Sdo and the dolomitic qualifiers. With neither this nor mgco3_pct, Ado and Sdo stay undecided against Aca and Sca (Hugo's decision Q23)."
    systems: [rp2008]
  - name: mgco3_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Magnesium carbonate, % of the fine earth. With caco3_pct it gives the molar ratio CaCO3/MgCO3 of the French Référentiel pédologique 2008 (pp. 12, 15-16): calcaire over 8, dolomiteux 1.5 to 8, dolomitique under 1.5 (Ado, Sdo). Not recorded: effervescence_hot (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: fe_total_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "% Fe2O3"
    description: "Total iron as Fe2O3 (HF digestion, alkaline fusion or XRF), % of the fine earth. French Référentiel pédologique 2008: the ferruginous FE at most 12 % (p. 171), the ND of the ferruginosols 12-20 % and their OXc and OXm over 20 % (p. 172), the FS by free over total iron (pp. 179-180), the Sn by free over total iron 0.60-0.90 (p. 17). The ratios to free iron are read on one basis: Fe = 0.6994 x Fe2O3, so the free over total iron of the Sn (0.60-0.90) and of the FS (above 0.50) is fe_dcb_pct / (0.6994 x fe_total_pct), and FFE over total iron (above 0.20) fe_ffe_pct / (0.6994 x fe_total_pct). fe2o3_sulfuric_pct is not total iron (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: fe_ffe_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "% Fe"
    description: "Free iron by the method of Ségalen (FFE), % Fe of the fine earth (as fe_dcb_pct, not as Fe2O3). The fersiallitic FS of the French Référentiel pédologique 2008 has FFE over total iron above 0.20 (pp. 179-180), read as fe_ffe_pct / (0.6994 x fe_total_pct) when the total iron is given as Fe2O3. Not recorded: fe_dcb_pct over fe_total_pct above 0.50 (about 0.30 on iron-rich parents) is evidence, flagged (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: weatherable_minerals_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Weatherable minerals other than quartz and muscovite, % of the 20-200 µm fraction. The oxidic OX of the French Référentiel pédologique 2008 has under 10 % (p. 151); also read for the ferrallitisols against the ferruginosols and for the nitosols (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: oxides_triacid_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Sum of the iron, aluminium and titanium oxides (triacid attack or alkaline fusion), % of the fraction under 2 µm. French Référentiel pédologique 2008 (pp. 149-151): the ferrallitic F under 60 % (usually 3-18 %), Fox 30-60 %, the oxidic OX over 60 % (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: clay_mineralogy
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "Dominant clay mineral of the layer: smectite, halloysite, kaolinite, illite, vermiculite (the hydroxy-Al vermiculite of Sal), interstratified or mixed (2:1). French Référentiel pédologique 2008: the nitic Sn (halloysite), the ferrallitic F and Fhy, the fersiallitic FS, Sal, the vertic horizons, the pélosols against the vertisols, the leptismectisols, the qualifiers kaolinitique and smectitique. Not recorded: Ki and Kr and the CEC of the clay as evidence (Hugo's decision Q23)."
    systems: [rp2008]
    allowed: ["smectite", "halloysite", "kaolinite", "illite", "vermiculite", "interstratified", "mixed"]
  - name: halloysite_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Halloysite, % of the clay fraction. French Référentiel pédologique 2008: the nitic Sn over 50 % (p. 16), the halloysitic Fhy 10-50 % (p. 149); over 50 % confirms the nitosols, 50 % or less rules them out. Not recorded: clay_mineralogy (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: kaolinite_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Kaolinite, % of the clay fraction. French Référentiel pédologique 2008: the ferrallitic F has 1:1 clays 90-100 % (p. 151); the qualifiers kaolinitique. Not recorded: clay_mineralogy (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: smectite_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Smectite, % of the clay fraction. French Référentiel pédologique 2008: swelling clays dominant in the vertic horizons (p. 22), the leptismectisols, the qualifiers smectitique. Not recorded: clay_mineralogy (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: degradation_form
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "Form of the morphological degradation of a BT (French Référentiel pédologique 2008, p. 18): diffuse, interdigitations (E penetrating along the vertical ped faces, too narrow for tongues), tongues, or planosolic. Read by BTd and the luvisols dégradés and derniques, and the qualifiers glossique and à dégradation diffuse. Not recorded: soilKey's retic properties and albeluvic glossae stand in, flagged (Hugo's decision Q23)."
    systems: [rp2008]
    allowed: ["diffuse", "interdigitations", "tongues", "planosolic"]
  - name: tongue_vol_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "% (vol)"
    description: "Tongues of E material in a BT, % of the volume of its affected part. The tongues of the degraded BTd of the French Référentiel pédologique 2008 make over 15 % of it (p. 18). Not recorded: degradation_form (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: tongue_width_mm
    section: "French system (Référentiel pédologique 2008)"
    unit: "mm"
    description: "Smallest horizontal size of the tongues of E material in a BT, mm. The tongues of the degraded BTd of the French Référentiel pédologique 2008 are at least 5 mm (clayey) to 15 mm (silty to sandy) wide (p. 18). Not recorded: degradation_form (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
  - name: lamellae_cumulative_cm
    section: "French system (Référentiel pédologique 2008)"
    unit: "cm"
    description: "Cumulative thickness of the clay bands (lamellae) of the layer, cm. A BT of the French Référentiel pédologique 2008 made only of bands needs each band 0.5 cm or more and more than 15 cm in all (p. 17); also the qualifier lamellique. Not recorded: the designation (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
  - name: c_pyro_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Organic carbon extractable with 0.1 M sodium pyrophosphate, % of the fine earth. The podzolic BP of the French Référentiel pédologique 2008 has most of its organic matter so extractable (p. 19). Not recorded: soilKey's spodic horizon stands in, flagged (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: pyrophosphate_index
    section: "French system (Référentiel pédologique 2008)"
    unit: "-"
    description: "Pyrophosphate index of a peat (Kaila). French Référentiel pédologique 2008, the histic horizons (pp. 205-206): Hf 7-10, Hm 10-25, Hs over 10 (with the exceptions of its table), Ha and LH over 50. Not recorded: the rubbed fibres, then the von Post index (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
  - name: s_total_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Total sulfur, % of the dry mass. French Référentiel pédologique 2008: the thionic material TH 0.75 % or more (p. 27), the sulfated U and the thiosols over 0.75 % (p. 308). Not recorded: sulfidic_s_pct plus sulfate_s_pct as a lower bound (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: nodules_wt_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Metal-oxide (sesquioxidic) nodules and concretions, % by weight of the whole soil. French Référentiel pédologique 2008: the nodular ND over 60 % (p. 154), the suffix -nod and Anod 30-60 % (pp. 151, 155), the qualifier nodulaire. Not recorded: ferric_nodules_pct and bauxitic_nodules_pct (by volume), flagged (Hugo's decision Q23)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: lateral_cover_pct
    section: "French system (Référentiel pédologique 2008)"
    unit: "%"
    description: "Share of the ground surface the horizon covers, %: the lateral continuity of the OL, OF and OH horizons of the French Référentiel pédologique 2008, Annex 1 (a discontinuous horizon is written in parentheses; the hémimoder has an OH on under 10 %). Not recorded: the parentheses of a recorded sequence, else undecided (Hugo's decision Q22)."
    systems: [rp2008]
    min: 0
    max: 100
  - name: diagnostic_za
    section: "South African system (1991)"
    unit: "-"
    description: "Name of the diagnostic horizon or material of the South African soil classification of 1991 (Soil Classification Working Group, 1991) that the surveyor gave the layer, as South African descriptions write it beside the master horizon: one of the 5 topsoil horizons (organic O, humic A, vertic A, melanic A, orthic A) or the 25 subsoil horizons and materials (E horizon, G horizon, red apedal B, yellow-brown apedal B, red structured B, neocutanic B, neocarbonate B, pedocutanic B, prismacutanic B, lithocutanic B, podzol B, placic pan, soft plinthic B, hard plinthic B, soft carbonate horizon, hardpan carbonate horizon, dorbank, saprolite, hard rock, stratified alluvium, regic sand, man-made soil deposit, unconsolidated material with or without signs of wetness, unspecified material with signs of wetness), in any case, with or without 'horizon', E or G alone, or soilKey's token (OA, RAB, SPL ...); 'none' or 'non-diagnostic' for a layer that holds none. A negated name (not, no, without, absent) is not read; one written with doubt (?, possibly, probably) is a candidate only; calcrete is read by its adjective (hardpan calcrete the hardpan carbonate horizon, powder or nodular calcrete the soft carbonate horizon, calcrete alone undecided between them). A name of 1977 is read as its 1991 equivalent, flagged (ferrihumic B: podzol B; gleycutanic B: G horizon under an A or E, unspecified material with signs of wetness under a B; calcareous apedal or neocutanic B: neocarbonate B). The recorded name gives the horizon, the recorded data its properties; not recorded, the names written in designation are read, and the identification on the data decides (Hugo's decision Q5)."
    systems: [za1991]
  - name: plasticity_index
    section: "South African system (1991)"
    unit: "%"
    description: "Plasticity index (Atterberg: liquid limit minus plastic limit, % water). South African soil classification of 1991: a vertic A has a plasticity index over 32 with the liquid limit by the South African Casagrande cup, over 36 by the British Standard cone; a melanic A 32 or less (36 or less); the method is liquid_limit_method. Not the field class plasticity. Not recorded: the slickensides decide vertic against melanic, flagged (Hugo's decision Q17)."
    systems: [za1991]
    min: 0
  - name: liquid_limit_method
    section: "South African system (1991)"
    unit: "-"
    description: "Method of the liquid limit behind plasticity_index: casagrande_cup (the South African standard) or bs_cone (British Standard cone). South African soil classification of 1991: it picks the vertic A limit, 32 (cup) or 36 (cone). Not recorded: the Casagrande cup, flagged."
    systems: [za1991]
    allowed: ["casagrande_cup", "bs_cone"]
  - name: bedrock_pct
    section: "South African system (1991)"
    unit: "% (vol)"
    description: "Rock in place, fresh or partly weathered, % by volume of the layer. South African soil classification of 1991, family criterion 14: a hard lithocutanic B or saprolite has more than 70 % rock with a hard consistence dry, moist and wet. Not recorded: coarse_fragments_pct or saprolite_pct over 70 with rupture_resistance hard or harder, flagged, the consistence read in the state recorded (Hugo's decision Q19)."
    systems: [za1991]
    min: 0
    max: 100
  - name: coatings_hue_moist
    section: "South African system (1991)"
    unit: "Munsell"
    description: "Moist Munsell hue of the clay or clay-organic coatings on ped faces (with coatings_value_moist and coatings_chroma_moist). South African soil classification of 1991: the continuous black cutans of the Estcourt families (family criterion 12) have a moist value of 2 or less and a chroma of 1 or less, or a neutral hue N; also the dark cutans of a wet prismacutanic B."
    systems: [za1991]
  - name: coatings_chroma_moist
    section: "South African system (1991)"
    unit: "Munsell"
    description: "Moist Munsell chroma of the clay or clay-organic coatings on ped faces. South African soil classification of 1991: the black cutans of family criterion 12 have chroma 1 or less. Not recorded: coatings_value_moist alone, the chroma undecided."
    systems: [za1991]
    min: 0
  - name: coatings_continuity
    section: "South African system (1991)"
    unit: "-"
    description: "Continuity of the coatings on ped faces: continuous, discontinuous or patchy. South African soil classification of 1991: the black cutans of the Estcourt families (family criterion 12) are continuous on the vertical ped faces. Not recorded: clay_films_amount many, flagged."
    systems: [za1991]
    allowed: ["continuous", "discontinuous", "patchy"]
  - name: recent_deposit
    section: "South African system (1991)"
    unit: "-"
    description: "TRUE when the layer is a recent aeolian, alluvial or man-made deposit over the soil. South African soil classification of 1991, general rules: a recent deposit under 500 mm thick over a classifiable buried soil is set aside and the buried soil classified; 500 mm or thicker, or over material that is not classifiable soil, the deposit is classified. Not recorded: layer_origin (aeolian, fluvic, colluvial, transported), anthropic_material, or a buried horizon marked (suffix b) directly below, flagged; none of them recorded, not a recent deposit (Hugo's decision Q8)."
    systems: [za1991]
  - name: cross_bedding
    section: "South African system (1991)"
    unit: "-"
    description: "TRUE when the layer shows cross bedding. South African soil classification of 1991: regic sand may be cross-bedded, an E horizon may not, and cross-bedded aeolian dune sands are regic sand, not an apedal B. Not recorded: stratification_pattern and an aeolian layer_origin, else absent."
    systems: [za1991]
  - name: sand_grade
    section: "South African system (1991)"
    unit: "-"
    description: "Grade of the sand of the layer: fine, medium or coarse (the sand grades of 1977, which the 1991 system keeps). South African soil classification of 1991: added to the texture class of the A in the name of a soil (Hu1200 medium sandy loam). Read only for the name; not recorded, the texture class without its grade (Hugo's decision Q23)."
    systems: [za1991]
    allowed: ["fine", "medium", "coarse"]
  - name: bleached_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Wet bleaching (Nassbleichung, KA5 code rb), % of the area of the horizon. German KA5 (Bodenkundliche Kartieranleitung, 5th ed., 2005; ka5): with the rust features it gives the 80 % of the Sw and Sg and the 50 % of the Sd, and the transitions Bv-Sw (10 to < 80 %) and Sw-Bv (< 10 %) (pp. 101-103). Read from hydromorphic_features_ka5 when only the field code is recorded (the area class by the lower end for minima). Not recorded: those tests undecided."
    systems: [ka5]
    min: 0
    max: 100
  - name: reduction_colours_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Reduction colours (KA5 codes rg, rt, rs, and a reduction-coloured matrix), % of the area of the horizon. German KA5 (ka5): Go < 10, Gro 10 to 50, Gor > 50, Gr > 95 %, and Yr (pp. 104-108). Not recorded: a matrix Munsell colour in the Gr colours reads 100, flagged; else undecided."
    systems: [ka5]
    min: 0
    max: 100
  - name: rh_value
    section: "German system (KA5)"
    unit: "-"
    description: "rH value (redox potential with pH). German KA5 (ka5): Sw, Gr, Yo and Yr need rH 19 or less in wet phases (pp. 101-108); the subhydric Gyttja (13 or more), Sapropel (< 13) and Dy (< 19) (p. 256). Not recorded: a positive childs_test (the dipyridyl test) stands in for 'rH 19 or less' only."
    systems: [ka5]
    min: 0
    max: 42
  - name: air_capacity_pct
    section: "German system (KA5)"
    unit: "% vol"
    description: "Air capacity (pores > 50 um drained at field capacity), % by volume. German KA5 (ka5): the Sd and the Sg have under 3 % (pp. 102-103). Not recorded: undecided."
    systems: [ka5]
    min: 0
    max: 100
  - name: total_porosity_pct
    section: "German system (KA5)"
    unit: "% vol"
    description: "Total pore volume, % by volume. German KA5 (ka5): the loose Bfv of the Lockerbraunerde has 60 % or more (or a dry bulk density under 0.8 g/cm3; p. 95). Not recorded: 100 x (1 - bulk density / 2.65), flagged."
    systems: [ka5]
    min: 0
    max: 100
  - name: muscovite_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Muscovite, % of the fine earth. German KA5 (ka5): supporting criterion of the Bv (6 % or more; else the Bu, p. 95). Not recorded: not used."
    systems: [ka5]
    min: 0
    max: 100
  - name: clay_coatings_thin_section_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Clay coatings in thin section, % of the area. German KA5 (ka5): a Bt has more than 1 % (p. 97). Not recorded: clay_films_amount, flagged."
    systems: [ka5]
    min: 0
    max: 100
  - name: clay_bridges
    section: "German system (KA5)"
    unit: "-"
    description: "Clay bridges between sand grains visible with a hand lens (TRUE / FALSE). German KA5 (ka5): one of the three signs of the Bt (p. 97). Not recorded: clay_films_amount, flagged."
    systems: [ka5]
  - name: bands_area_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Clay, humus or sesquioxide bands, % of the area of the horizon. German KA5 (ka5): Bbt+Bv, Bbh+Bv, Bbs+Bv and Bbt+Cv 10 to < 50 %, Bv+Bbt and lCv+Bbt over 50 %, Cbtv under 10 % (pp. 96-100); the band subtypes LLd and LFd. Not recorded: lamellae_cumulative_cm over the thickness, flagged."
