  - name: sphagnum_fibres_pct
    section: "New Zealand system (NZSC 4th ed.)"
    unit: "%"
    description: "Share of the organic fibres that are Sphagnum (moss peat); NZSC Sphagnic Fibric Organic Soils (more than 70 % to 60 cm). Recorded when met: not recorded reads as none."
