    allowed: ["c0", "c1", "c2", "c3", "c3.2", "c3.3", "c3.4", "c4", "c5", "c6", "c7"]
    systems: [ka5]
  - name: texture_class_ka5
    section: "German system (KA5)"
    unit: "-"
    description: "Texture class (Feinbodenart) of the KA5 (Tab. 30, Abb. 17): Ss, Sl2, Sl3, Sl4, Slu, St2, St3, Su2, Su3, Su4, Ls2, Ls3, Ls4, Lt2, Lt3, Lts, Lu, Uu, Uls, Us, Ut2, Ut3, Ut4, Tt, Tl, Tu2, Tu3, Tu4, Ts2, Ts3, Ts4. German KA5 (ka5): the Bv 'one subgroup more clayey', the pure sand of the Strand and the soil-water tables. Not recorded: clay_pct, silt_pct and sand_pct."
    systems: [ka5]
  - name: colour_ka5
    section: "German system (KA5)"
    unit: "-"
    description: "Colour as the words of Liste 18 code it (bl, bn, ge, gn, ro, gr, sw, we, vi, or, ol, tk, oc; before them h, hh, d, dd, le, fa, sm; after them li; up to three, the last the main colour: roligrbn). German KA5 (ka5): kept as recorded; the book forbids converting the words into Munsell (p. 110), so a Munsell test with only a word recorded stays undecided."
    systems: [ka5]
  - name: hydromorphic_features_ka5
    section: "German system (KA5)"
    unit: "-"
    description: "Hydromorphic features as the KA5 field codes write them (fields 30 and 31, Tab. 16, p. 113; the rules of 5.3, pp. 50-55): kind (e, ed, eh, eo, es oxidative; rb, rg, rt, rs reductive), form, degree g1-g5, area class f1-f9, size; features separated by ';' (ed,fl,g3,f4;rb,f6). German KA5 (ka5): read into bleached_pct, reduction_colours_pct and the rust share (redoximorphic_features_pct) as the ranges of the area classes."
    systems: [ka5]
  - name: fine_clay_pct
    section: "Chinese system (CST 2001)"
    unit: "%"
    description: "Fine clay (< 0.2 um), % of the fine earth. Chinese Soil Taxonomy 2001, the argic horizon (pp. 35-36): with 60 % clay or more the illuvial horizon has 8 % more fine clay than the eluvial one, not recorded that path stays undecided (Hugo's decision Q20); under 60 % it must also be higher than in an eluvial layer the total clay increases over; not measured in both layers (in one or neither), the clay increase passes provisionally (v0.9.377)."
