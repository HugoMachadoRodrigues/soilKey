    unit: "Munsell"
    description: "Moist Munsell hue of the coatings on pores (not root linings), or of the gel-like masses bridging sand grains or coating coarse fragments; NZSC Acidic and Vitric-acidic Orthic Allophanic Soils (hue 7.5YR or redder, value 5 or less, chroma 3 or more). Recorded when met: not recorded reads as none."
