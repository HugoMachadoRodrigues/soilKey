  - name: kultotroph
    section: "German system (KA5)"
    unit: "-"
    description: "Base and nutrient status lastingly changed by regular fertilising (TRUE / FALSE). German KA5 (ka5): the suffix k of Akh, Aka and Hk (pp. 85, 91-94) and the variety ku. Not recorded: undecided."
