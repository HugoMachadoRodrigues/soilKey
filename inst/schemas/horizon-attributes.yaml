  - name: carbonate_whole_soil_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Carbonate (CaCO3 equivalent) of the whole material, skeleton included, % by mass. German KA5 (ka5): the rock classes i (< 2), e (2 to < 75) and c (75 or more) that separate Ranker, Regosol, Pararendzina and Rendzina (pp. 84, 204-211). Not recorded: the prefix written, else caco3_pct of the fine earth, flagged (Hugo's decision Q15)."
    systems: [ka5]
    min: 0
    max: 100
  - name: rock_diggable
    section: "German system (KA5)"
    unit: "-"
    description: "The substrate can be dug with a spade when moist (TRUE / FALSE). German KA5 (ka5): the prefixes l (loose) against m and x (pp. 84, 99). Not recorded: cementation_class and rupture_resistance, flagged."
    systems: [ka5]
  - name: parent_rock_ka5
    section: "German system (KA5)"
    unit: "-"
    description: "Rock of the substrate as the KA5 codes it (field 47a). German KA5 (ka5): the P horizon forms from clay or clay-marl stone, the T horizon from carbonate rock (pp. 100-101). Not recorded: site parent_material."
    systems: [ka5]
  - name: caco3_lithogenic
    section: "German system (KA5)"
    unit: "-"
    description: "Lithogenic (primary) carbonate in the fine earth (TRUE / FALSE). German KA5 (ka5): B and T horizons are free of it (pp. 95, 101). Not recorded: caco3_pct 0 reads FALSE, any other value undecided."
    systems: [ka5]
  - name: oc_lithogenic_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Sedimentary (lithogenic) organic carbon, %, the coal classes k1 to k6 of field 45 (Tab. 38). German KA5 (ka5): the prefix o needs 2 % sedimentary organic substance or more (pp. 84, 93, 99). Not recorded: layer_origin with oc_pct, flagged."
    systems: [ka5]
    min: 0
    max: 100
  - name: knick_degree
    section: "German system (KA5)"
    unit: "-"
    description: "Degree of the Knick horizon of the Knickmarsch: 'strong' (Knick-Horizont) or 'weak' (knickiger Horizont). German KA5 (ka5): the Sq (p. 103) and the type MK. Not recorded: esp_pct and a columnar or prismatic structure, flagged."
    allowed: ["strong", "weak"]
    systems: [ka5]
  - name: sand_ffs_pct
    section: "German system (KA5)"
    unit: "%"
    description: "Finest sand (ffS, 63 to < 125 um), % of the fine earth, the KA5 fraction (p. 141); not the USDA very fine sand (50-100 um). German KA5 (ka5): silt plus finest sand 50 % or more in the Sg, the Haftpseudogley and the Haftnaessemarsch. Not recorded: silt 50 % or more reads yes, silt plus sand under 50 % no, the rest undecided (Hugo's decision Q11)."
    systems: [ka5]
    min: 0
    max: 100
  - name: soil_gas_ch4_co2_pct
    section: "German system (KA5)"
    unit: "% vol"
    description: "CH4 and CO2 in the soil air, % by volume (the highest measured). German KA5 (ka5): the Y horizons of the Reduktosol have at times 10 % or more (pp. 107-108). Not recorded: site methane_odour, flagged."
    systems: [ka5]
    min: 0
    max: 100
  - name: horizon_continuity
