# Archive a GitHub release on Zenodo, by hand. Zenodo's own GitHub switch is on
# for this repository since Zenodo support fixed its record (October 2026), and
# it archives each published release itself. This workflow stays as the
# fallback, run only from the Actions tab, for a release that the switch fails
# to archive: it deposits the release as a new version of the concept record
# 10.5281/zenodo.19930112, the DOI that the README badge, CITATION.cff and
# inst/CITATION cite. It no longer runs on a published release, so that a
# release is not archived twice (Zenodo does not let a published version be
# deleted).
#
# Setup, once: a Zenodo personal token with the deposit:write and
# deposit:actions scopes, stored as the repository secret ZENODO_TOKEN.
#
# The deposit is the source tree of the tag (git archive, the same files as
# GitHub's own zip of the tag) with the metadata of .zenodo.json; the version is
# the tag name and the date is the release date. A tag that Zenodo already holds
# is skipped, so running it twice is harmless.
#
# Run it from the Actions tab ("Run workflow") with dry_run on to check the token
# and see the metadata without creating anything; with dry_run off it archives
# the release named in "tag". Check first that the switch did not archive it.
name: zenodo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to archive, e.g. v0.9.262
        required: true
      dry_run:
        description: Only check the token and show the metadata
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: zenodo
  cancel-in-progress: false

jobs:
  deposit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release date and source archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(gh release view "$TAG" --json publishedAt -q '.publishedAt[0:10]')
          git archive --format=zip --prefix="soilKey-${TAG#v}/" -o "soilKey-${TAG}.zip" "refs/tags/${TAG}"
          echo "RELEASE_DATE=${date}" >> "$GITHUB_ENV"
          echo "ZIP=soilKey-${TAG}.zip" >> "$GITHUB_ENV"
          ls -l "soilKey-${TAG}.zip"

      - name: Deposit on Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python3 .github/scripts/zenodo_release.py
