# The readings soilKey makes of the FAO-Unesco soil legend, in its two
# editions: the Revised Legend (FAO 1988, World Soil Resources Report 60;
# the text of the ISRIC reprint of 1997, Technical Paper 20; PDF page =
# printed + 5) and the Legend of 1974 (FAO-Unesco, Soil Map of the World,
# Vol. I, Unesco Paris; PDF page = printed + 7 to p. 41, + 6 from the key).
# Pages are printed pages; "74 p." is the 1974 legend. An entry ending
# "(Hugo, 2026-11-08)" is a decision of the owner, in soilKey's words; an
# entry ending "(Hugo, 2026-11-08)" is
# soilKey's own and waits for his word. The criteria are paraphrased; no text
# of the books is shipped.
#
# 0.9.381 (the attributes and the shared readers, R/fao-readers.R) holds this
# file in data-raw/; the registry parts move it to inst/rules/fao1988/ and
# inst/rules/fao1974/ (readings.yaml) with the entries of each edition.
readings:
  # --- the decisions of 2026-11-08 that this part applies -----------------------------
  - topic: "One module, two editions"
    edition: [1988, 1974]
    page: "pp. 75-89; 74 pp. 43-53"
    reading: "One module with an edition switch; two registry ids (fao1988, fao1974) in a later part, thin wrappers of one classify_fao(). The shared readers take the edition as an argument; no site attribute carries it (Q1, default 19) (Hugo, 2026-11-08)."
  - topic: "Depth datum"
    edition: [1988, 1974]
    page: "pp. 25-42, 75; 74 pp. 32, 43"
    reading: "Depths are read from the soil surface as the texts write it: the top of the first recorded horizon, H and O horizons included; a profile written with its O above 0 is read from the top of the O (.fao_depths()) (Q9) (Hugo, 2026-11-08)."
  - topic: "Depths not written; texture of the 125 / 90 / 75 cm rule; coarse textured materials"
    edition: [1988, 1974]
    page: "p. 42, 80; 74 pp. 5, 29, 49-53"
    reading: "A diagnostic with no depth in the key is read within 125 cm in both editions. The 1974 rule of 125, 90 and 75 cm for coarse, medium and fine textures reads the texture class of the upper 30 cm with the 1974 classes (.fao_texture_upper30(), .fao_depth_by_texture()). The coarse textured materials of the 1988 Gleysols are materials coarser than sandy loam (.fao_coarser_than_sandy_loam()) (Q10) (Hugo, 2026-11-08)."
  - topic: "Organic matter"
    edition: [1974]
    page: "74 pp. 21, 24, 32"
    reading: "Organic matter is organic carbon x 1.724, always flagged om_from_oc_x1.724 (.fao_om()) (Q11) (Hugo, 2026-11-08)."
  - topic: "pH ratios, CEC, ECEC and base saturation"
    edition: [1988, 1974]
    page: "pp. 31-32, 39, 130; 74 pp. 24, 27-29, 41, 47"
    reading: "Values as reported, flagged where the method is known to differ. The new ph_h2o_1to1 and ph_h2o_1to5 are read first, ph_h2o after them, flagged (.fao_ph()). The NH4Cl CEC is cec_cmol with cec_method nh4cl, else ecec_cmol, flagged (.fao_cec_clay(method = 'nh4cl')); the NH4OAc CEC is cec_cmol, flagged when cec_method names another method. The ECEC of 1988 is item 3 of the ferralic B: NH4OAc bases plus 1 M KCl exchangeable acidity (exch_acidity_kcl_cmol); the ECEC of 1974 is bases plus KCl aluminium (.fao_ecec_clay()). Base saturation is bs_pct by NH4OAc (.fao_bs()) (Q12) (Hugo, 2026-11-08)."
  - topic: "New attributes"
    edition: [1988, 1974]
    page: "pp. 25-41, 67-71; 74 pp. 20-32"
    reading: "All the attributes of plan section 10 are added, with the fallbacks written in their descriptions: horizon p2o5_citric_mg_kg, extractable_acidity_ph82_cmol, cec_ph82_cmol, al_dcb_pct, exch_acidity_kcl_cmol, ph_h2o_1to1, ph_h2o_1to5, rock_structure_pct, smeary_consistence, bleached_ped_coatings, ignition_redder, spodic_pellets, skeletans_pct, skeletan_thickness_mm, carbonate_coatings_faces_pct, nodule_size_max_cm, dta_low_endotherm, munsell_hue_rubbed, munsell_value_rubbed, munsell_chroma_rubbed, pitted_quartz_pct, palygorskite_pct, aeolian_crack_infill; site flooding_days_growing_period, rudic_recorded, reference_fao74. No other system reads them (Q19) (Hugo, 2026-11-08)."
  - topic: "Rubbed colours and the limits between Munsell chips"
    edition: [1988, 1974]
    page: "pp. 26, 82-89; 74 pp. 24, 47-53"
    reading: "The rubbed colour is munsell_*_rubbed where recorded, else the moist colour read as rubbed, flagged moist_colour_for_rubbed (.fao_colour_rubbed()); Chromic reads the moist colour. The limits 'less than 3.5' and '5.5' are compared with the recorded number: whole chips of 3 and 5 pass, a value recorded as 3.5 fails (Q24) (Hugo, 2026-11-08)."
  - topic: "'Many' coarse mottles of the ferric properties"
    edition: [1988, 1974]
    page: "p. 35; 74 p. 28"
    reading: "'Many' is 15 % or more and 'coarse' more than 20 mm, the classes of the 1990 Guidelines (fao_thresholds_*.yaml) (Q22) (Hugo, 2026-11-08)."
  - topic: "Numbers of 1988 in 1974"
    edition: [1974]
    page: "p. 35, 40, 113-114; 74 pp. 30-31, 39"
    reading: "Calcareous (more than 2 % CCE or strong effervescence) and soft powdery lime (50 % of the faces, 5 % soft nodules) of 1988 are read in 1974, flagged; plinthite present = recorded above 0 % within 125 cm; the ignition test by its record, else free iron below 0.5 % of the fine earth, flagged (the footnote of the 1974 Humic Podzols, 74 p. 39) (Q23) (Hugo, 2026-11-08)."
  - topic: "Technical defaults of the questions file"
    edition: [1988, 1974]
    page: "pp. 25-42; 74 pp. 25, 32"
    reading: "CEC per kg clay = cec_cmol x 100 / clay_pct, no deduction for organic matter (default 1); clay as reported (3); 'within X cm' = the upper boundary of the feature at or above X, 'between 20 and 50 cm' = every layer overlapping 20-50 cm, 'in some part' = one layer, two diagnostic B horizons within 125 cm: the upper one decides (11); the clay increase by .fao_clay_increase() with the bands 3 / 1.2 / 8 and the breaks 15 and 40 as arguments, equal to the usda branch of test_clay_increase_argic(), the exact 15 and 40 of 1974 read in the same way (< 15; 15 to < 40; >= 40) (12, 18) (Hugo, 2026-11-08)."

  # --- the readings of this part (0.9.381), decided on the review --------------------------
  - topic: "Texture classes at the printed boundaries"
    edition: [1988, 1974]
    page: "p. 107; 74 p. 5"
    reading: "Both texts leave a clay content of exactly 35 % and a sand content of exactly 70 % (1988) or 65 % (1974) with less than 15 (18) % clay unassigned. soilKey reads both as medium textured: coarse is clay below 15 (18) % and sand above 70 (65) %, fine is clay above 35 %, medium the rest (.fao_texture_class()). The 1974 case is plan section 12 item 25; the 1988 one is the same gap (Hugo, 2026-11-08)."
  - topic: "The solum"
    edition: [1988, 1974]
    page: "p. 26; 74 p. 24"
    reading: "The solum of the mollic A rule is the A, E and B horizons with their transitions (AB, BA, AE, EB, BC, AC, A/B); CB, C, R, H and O are not. Its base is the base of the deepest such horizon, measured from the soil surface of Q9, so an O or H horizon on top counts in its depth; a description that ends in the solum gives a lower bound (.fao_solum()). AC is counted because the mollic A of both editions counts AC as part of the A (Hugo, 2026-11-08)."
  - topic: "The solum with undesignated horizons"
    edition: [1988, 1974]
    page: "p. 26; 74 p. 24"
    reading: "A horizon without a designation above the last A, E or B does not matter. One between the last A, E or B and the first C or R below it (or below it with no C or R after) leaves the base of the solum undecided, with the designation named as missing (Hugo, 2026-11-09)."
  - topic: "Buried horizons"
    edition: [1988, 1974]
    page: "p. 42; 74 p. 32"
    reading: "A buried horizon is one whose designation has the suffix b (Ab, 2Btb); the new material is all that lies above the first of them, its thickness the depth of that horizon. When the mantle is 50 cm or more (1988 also 35 cm or more over an andic mantle) that horizon and every horizon below it are not diagnostic; with the andic reading of the mantle undecided between 35 and 50 cm the answer is undecided (.fao_buried()) (Hugo, 2026-11-08)."
  - topic: "Vertical distance of the clay increase"
    edition: [1988, 1974]
    page: "p. 28 item 4; 74 p. 25"
    reading: "'The increase must be reached within a vertical distance of 30 (15) cm' is read as the gap between the base of the coarser overlying layer and the top of the layer compared: the layers in between add up to no more than 30 (15) cm. A pair across a lithological discontinuity (a different material number in the designation) is undecided, not failed (.fao_clay_increase(distance =)) (Hugo, 2026-11-08)."
  - topic: "NH4Cl CEC when neither it nor the ECEC is recorded"
    edition: [1974]
    page: "74 pp. 27-28, 47"
    reading: "Without a CEC by NH4Cl and without ecec_cmol, the NH4Cl CEC is undecided; the CEC at pH 7 (NH4OAc) is not read in its place, because it runs higher in the variable-charge soils the 24 and 10 me limits separate (Hugo, 2026-11-08)."
  - topic: "ECEC of 1988 without the KCl acidity"
    edition: [1988]
    page: "pp. 31, 130"
    reading: "Without exch_acidity_kcl_cmol the ECEC of the ferralic B reads al_kcl_cmol, then al_cmol (KCl aluminium, the acidity of most acid soils), flagged; without the bases, ecec_cmol as recorded, flagged ecec_as_recorded (Hugo, 2026-11-08)."
  - topic: "Base saturation not recorded"
    edition: [1988, 1974]
    page: "pp. 26-27, 75-89; 74 pp. 24, 43-53"
    reading: "Where bs_pct is not recorded and the four bases and cec_cmol are, the base saturation is 100 x bases / CEC (at most 100), flagged bs_computed (Hugo, 2026-11-08)."
  - topic: "Continuous rock in the readers"
    edition: [1988, 1974]
    page: "p. 35; 74 p. 32"
    reading: "A layer is rock for the windows and the weighted means when its designation is R (2R, R/Cr), or when bedrock_pct is 90 or more together with a hard rupture resistance recorded (hard, very hard, extremely hard or rigid: continuous hard rock, p. 35); bedrock_pct alone is not rock. A window that ends on rock is complete, and a weighted mean over it averages the soil above the rock, except the strongly humic mean of 1988, which counts the depth below the soil as zero (p. 40). The key's own test of continuous hard rock follows with the diagnostics (Hugo, 2026-11-09)."
  - topic: "Strongly humic in soils shallower than 50 cm"
    edition: [1988]
    page: "p. 40"
    reading: "The text gives the 100 cm average for soils 50 to 100 cm deep. A soil shallower than 50 cm over rock is read the same way: the carbon is divided by 100 cm, the depth below the soil counting as zero, flagged zero_below_rock_soil_shallower_than_50cm (Hugo, 2026-11-09)."
  - topic: "Windows with gaps or overlaps"
    edition: [1988, 1974]
    page: "p. 42; 74 p. 32"
    reading: "A window is described only when the clipped thicknesses of its soil layers fill it from its top to its base or to the rock: a gap in the depths, a layer without depths or a description that stops above the base leaves a test over it undecided (missing top_cm and bottom_cm); layers that overlap in depth are flagged overlapping_layers and a mean over them undecided. 'Within X cm' fails only when the description is filled to below X, or to rock at or above X (Hugo, 2026-11-09)."
  - topic: "Neutral hues"
    edition: [1988, 1974]
    page: "pp. 32-35; 74 pp. 27-28"
    reading: "A neutral hue (N) is neither redder nor yellower than any hue: 'redder than 7.5YR' and '2.5Y or more' fail on it (.fao_hue_cmp()) (Hugo, 2026-11-08)."
  - topic: "The ignition test from free iron, both ways"
    edition: [1988, 1974]
    page: "p. 81; 74 pp. 39, 47"
    reading: "Without ignition_redder, free iron (fe_dcb_pct) below 0.5 % of the fine earth reads as not turning redder, flagged (Q23); 0.5 % or more leaves the test undecided, because the footnote gives only the first direction (Hugo, 2026-11-09)."
  - topic: "Texture of the upper 30 cm under an organic surface"
    edition: [1988, 1974]
    page: "p. 107; 74 p. 5"
    reading: "Under H or O horizons (or an undesignated layer of 20 % organic carbon or more) the upper 30 cm of the texture class are measured from the top of the first mineral horizon, flagged texture_from_mineral_surface: the class of the map symbol describes the mineral soil (.fao_texture_upper30()) (Hugo, 2026-11-09)."

  # --- soilKey's readings of the code, for Hugo's word ------------------------------------------
  - topic: "Palygorskite named in the clay mineralogy"
    edition: [1988]
    page: "p. 70"
    reading: "Without palygorskite_pct, a clay_mineralogy naming palygorskite (or attapulgite), the dominant clay mineral, is read as 100 % of the clay, flagged; not named, absent (.fao_palygorskite()) (Hugo, 2026-11-09)."
  - topic: "Hue families beyond Y and RP"
    edition: [1988, 1974]
    page: "pp. 32, 35; 74 pp. 27-28"
    reading: "On the hue rank from red to blue, the GY, G, BG, B and PB hues count as '2.5Y or more' (the jarosite mottles), and RP hues as redder than 7.5YR (the ferric mottles) (.fao_hue_cmp()) (Hugo, 2026-11-09)."
  - topic: "Texture groups of tonguing"
    edition: [1988, 1974]
    page: "p. 41; 74 p. 31"
    reading: "One grouping serves both editions: fine (clay, silty clay, sandy clay), moderately fine (sandy clay loam, clay loam, silty clay loam) and medium or coarser (silt loam, loam, sandy loam and coarser, and silt, which neither text names). The very fine sandy loam that 1974 adds falls in the sandy loams, as soilKey records no very fine sand (.fao_tonguing_texture()) (Hugo, 2026-11-09)."

  # --- 0.9.382 (the diagnostic horizons of 1988, R/diagnostics-fao88-horizons.R) ----------
  # Hugo's decisions of 2026-11-08 that this part applies.
  - topic: "Clay skins of the argic B"
    edition: [1988]
    page: "p. 28 items 4 and 6"
    version: "0.9.382"
    reading: "Clay skins or oriented clay on 1 % or more: clay_films_amount few or more, or micromorph_argillans_pct or clay_coatings_thin_section_pct of 1 % or more; not recorded, a B designated with the suffix t counts as the observation, flagged bt_designation_for_clay_skins; else absent (Q13) (Hugo, 2026-11-08)."
  - topic: "Citric P2O5 of the mollic and umbric A"
    edition: [1988]
    page: "p. 27 item 6"
    version: "0.9.382"
    reading: "A measured P2O5 decides (250 mg/kg or more fails, unless it increases below the A); not measured, the anthropic layers the limit is meant to remove decide: recorded artefacts, anthropic material, a layer_origin naming anthropic, midden or plaggen material or an overthickened A at the site fail, flagged p2o5_exclusion_from_anthropic_record; none recorded passes, flagged p2o5_not_recorded_no_anthropic_layer (Q14) (Hugo, 2026-11-08)."
  - topic: "Eutric and dystric histic H; organic soil materials"
    edition: [1988]
    page: "pp. 25-26, 39; 74 p. 24"
    version: "0.9.382"
    reading: "histic_h_fao88(base = 'eutric') asks pH (H2O 1:5) 5.5 or more throughout the H, 'dystric' below 5.5 in some part (ph_h2o stands in, flagged). Organic soil materials: 20 % OC or more pass; below the saturated limit (12 + 0.1 x clay %, at most 18; 12 without clay) fail; between, the drainage recorded at the site decides, else undecided (Q15) (Hugo, 2026-11-08)."
  - topic: "Ferralic B clay and weatherable minerals"
    edition: [1988]
    page: "pp. 29-31, 41"
    version: "0.9.382"
    reading: "The ferralic B asks 8 % clay; weatherable_minerals_pct (20-200 um) is read for the 50-200 um fraction of the cambic and ferralic B, flagged weatherable_minerals_20_200um_for_50_200um (Q16) (Hugo, 2026-11-08)."
  - topic: "Spodic B chemistry and its stand-ins"
    edition: [1988]
    page: "pp. 30-31"
    version: "0.9.382"
    reading: "The extractable iron of item 3a is pyrophosphate iron (fe_pyro_pct). Where the 1975 chemistry leaves the horizon undecided, spodic_horizon_usda() and then the WRB spodic() stand in, flagged stand_in_for_spodic_chemistry_1975, with the result marked as a lower grade (Q17) (Hugo, 2026-11-08)."
  - topic: "Sulfuric horizon"
    edition: [1988]
    page: "p. 32"
    version: "0.9.382"
    reading: "pH (H2O 1:1) below 3.5 over 15 cm or more decides; jarosite mottles are reported, not required (Q18) (Hugo, 2026-11-08)."
  - topic: "Defaults applied to the horizons"
    edition: [1988]
    page: "pp. 26, 28, 32, 34, 42"
    version: "0.9.382"
    reading: "A solum of exactly 75 cm takes the rule of more than 25 cm (default 2); the petrocalcic and petrogypsic horizons have no minimum thickness (4); the abrupt textural transition of argic item 6 is a lower boundary recorded abrupt or clear, as the abrupt textural change (5); runs and windows as default 11; the clay increase by .fao_clay_increase() (18). The subsurface horizons have their upper limit within 125 cm (p. 42; argument max_top_cm) (Hugo, 2026-11-08)."

  # soilKey's readings of this part, decided by Hugo on the review (2026-11-09).
  - topic: "Upper bound of the histic H"
    edition: [1988]
    page: "pp. 25, 42"
    version: "0.9.382"
    reading: "The histic H is more than 20 cm thick; its printed upper bound (less than 40 cm, 60 cm if sphagnum or very light) only separates the Histosols, whose gate the key reads first, and is reported as evidence, not tested. A plough layer is a surface run of layers designated A, H or O with the suffix p (Hugo, 2026-11-09)."
  - topic: "Saturation of the organic soil materials from the drainage class"
    edition: [1988]
    page: "p. 39"
    version: "0.9.382"
    reading: "Saturated for long periods: very poorly, poorly, somewhat poorly or imperfectly drained, or an artificially drained site; never saturated for more than a few days: well drained or better. Moderately well drained leaves it undecided. Portuguese classes read likewise (Hugo, 2026-11-09)."
  - topic: "Mixing the 18 cm of the mollic A"
    edition: [1988]
    page: "p. 26"
    version: "0.9.382"
    reading: "The A is the run of A layers (AB, AE, AC included; undesignated layers flagged) from the first mineral layer; an O or H above it is not mixed into it. Its upper 18 cm are mixed (thickness-weighted means of moist value and chroma, dry value, OC, base saturation and CaCO3), and every A layer whose base lies below 18 cm, one that straddles 18 cm included, is also read on its own values. A dry value not recorded is the moist value + 1, flagged. The thickness of the A and the solum it is compared with are both measured from the mineral soil surface (the top of the A) (Hugo, 2026-11-09)."
  - topic: "Lime waiver of the mollic A"
    edition: [1988]
    page: "p. 26 items 2 and 4"
    version: "0.9.382"
    reading: "The colour and carbon pass either as printed (chroma and moist value below 3.5, dry value below 5.5, 0.6 % OC) or, with more than 40 % CaCO3 equivalent, with a moist value of 5 or less and 2.5 % OC, the dry value waived. CaCO3 not measured leaves the waiver undecided unless an HCl reaction recorded as none or a water pH below 6.5 reads it as absent, flagged (Hugo, 2026-11-09)."
  - topic: "Colour contrast and phosphate exceptions of the mollic A"
    edition: [1988]
    page: "pp. 26-27"
    version: "0.9.382"
    reading: "The mixed A is compared with the first C below it, else the layer right below; with rock right below the A the contrast cannot be read and is taken as met, flagged rock_below_a_contrast_not_read. Strongly humic waives it (p. 40). Dark parent material (the other waiver) and phosphate nodules (the exception to the P2O5 limit) are field observations soilKey does not record: absent. Massive and hard (hard, very hard or extremely hard) when dry is read per layer; not recorded, absent (Hugo, 2026-11-09)."
  - topic: "Fimic A"
    edition: [1988]
    page: "p. 27"
    version: "0.9.382"
    reading: "A layer is manured when its citric P2O5 is above 250 mg/kg or the record names anthropic material (as for the mollic A). Where neither is recorded in the upper 50 cm, the WRB plaggic, hortic and terric horizons stand in and can only make it pass; otherwise the man-made layer is absent. A layer meeting the mollic or umbric A with P2O5 measured at 250 or less is that A (Hugo, 2026-11-09)."
  - topic: "Fresh alluvium is not an ochric A"
    edition: [1988]
    page: "p. 27"
    version: "0.9.382"
    reading: "Finely stratified fresh alluvium: a stratification recorded in the surface layer together with recent_deposit or a fluvial layer_origin (Hugo, 2026-11-09)."
  - topic: "Layers that can hold a B horizon"
    edition: [1988]
    page: "pp. 27-31"
    version: "0.9.382"
    reading: "The argic, natric, cambic, spodic and ferralic B are not read in rock, in a layer designated A, E, H, O or C (CB, Cr), nor in the first layer of an undesignated surface; a B inside an E (E&Bt, E/B) is a B, and its t suffix records clay skins as a Bt does (Hugo, 2026-11-09)."
  - topic: "Extent of the argic B"
    edition: [1988]
    page: "p. 28 items 3, 5, 6"
    version: "0.9.382"
    reading: "The B is the layer where the increase is reached and the adjoining layers below it that keep the texture and the increase over the same coarser layer. Item 5 reads its thickness from the soil surface of Q9 (one tenth of the overlying horizons); lamellae, when lamellae_cumulative_cm is above 0 in every layer of the B, need 15 cm combined. The coarser overlying horizon of item 6 is the run of layers right above with less clay; a missing clay on that walk leaves item 6 undecided. 'Eroded' is read from anthropic_truncation only (Hugo, 2026-11-09)."
  - topic: "Tongues of the natric B"
    edition: [1988]
    page: "p. 29 item 1"
    version: "0.9.382"
    reading: "Blocky structure with tongues: tongue_depth_cm above 2.5 in the B or the layer above it; the tongue is taken to carry uncoated grains unless uncoated_grains_pct is recorded as 0. ESP not recorded is Na / CEC x 100, flagged (Hugo, 2026-11-09)."
  - topic: "Alteration of the cambic B"
    edition: [1988]
    page: "p. 30 item 5"
    version: "0.9.382"
    reading: "'The underlying horizon' of 5a is the layer right below (rock: not compared). The carbonate removal of 5b is read only over sure calcic layers below. The parent material of 5c is the C layers below, else the layers from the B down (Hugo, 2026-11-09)."
  - topic: "Carbonate and gypsum not measured"
    edition: [1988]
    page: "pp. 30-32"
    version: "0.9.382"
    reading: "caco3_pct not recorded: an HCl reaction recorded as none, or a water pH below 6.5, reads as no free carbonate, flagged; caso4_pct not recorded: an ECe below 2 dS/m reads as no gypsum, flagged. Else undecided (Hugo, 2026-11-09)."
  - topic: "Calcic and petrocalcic details"
    edition: [1988]
    page: "pp. 31-32"
    version: "0.9.382"
    reading: "The calcic '5 percent more than a deeper horizon' is in points. Resting on 40 % CaCO3 or more, the calcic horizon needs secondary carbonate recorded (secondary_carbonates_pct, carbonate_soft_pct, secondary_carbonates_form or the suffix k). The deepest layer of 15 % or more, with no deeper layer described, is undecided. The petrocalcic (petrogypsic) horizon is a cemented layer of 15 % CaCO3 or more (the gypsum of the gypsic horizon): cementation_class moderately cemented or harder, else a designation with k (y) and m, flagged; a silica pan (qm) is not read as theirs; the enrichment not asked (Hugo, 2026-11-09)."
  - topic: "Gypsic horizon compared with the C"
    edition: [1988]
    page: "p. 32"
    version: "0.9.382"
    reading: "The underlying C is the first layer designated C below; with no C designated, the layer right below, flagged no_c_horizon_layer_below_compared. The product is the thickness times the thickness-weighted gypsum % (Hugo, 2026-11-09)."
  - topic: "Spodic B without the chemistry"
    edition: [1988]
    page: "pp. 30-31"
    version: "0.9.382"
    reading: "Item 2: sandy or coarse-loamy is clay below 18 %; pellets and cracked coatings are field observations. Item 1: the cementing agent is read from an h, s or the older ir suffix. A layer with free carbonate or a water pH of 7.0 or more is not spodic, flagged; a missing chemistry is not otherwise read as absent. The stand-ins decide only the chemistry (item 3), both ways when they decide, and are recorded only then; the units of items 1 and 2 stay as read (Hugo, 2026-11-09)."
  - topic: "Volcanic glass not recorded"
    edition: [1988]
    page: "pp. 31, 34"
    version: "0.9.382"
    reading: "Item 7 of the ferralic B reads the andic properties of p. 34 itself until the diagnostic properties follow. Volcanic glass not recorded is none, flagged volcanic_glass_not_recorded_none, and andic properties left undecided are absent, flagged andic_absent_no_volcanic_material, unless the site's parent material, a layer_origin or pyroclastic fragments name volcanic material, where they stay undecided (Hugo, 2026-11-09)."
  - topic: "Albic E colours"
    edition: [1988]
    page: "pp. 32-33"
    version: "0.9.382"
    reading: "A layer designated E (EB, E/B, the A2 of the older notation); an undesignated layer is read by colour only, flagged, where it lies below a surface layer and above a layer designated B or C, else it is undecided. 'Closer to 2 than to 3' is a chroma below 2.5. Where both value classes apply (a dry value of 7 and a moist value of 5), the lighter one governs (chroma 3 or less). A dry value not recorded is the moist value + 1, flagged. The parent material of the 5YR rule is the first C below (Hugo, 2026-11-09)."
  - topic: "Code readings confirmed on the review"
    edition: [1988]
    page: "pp. 26-32"
    version: "0.9.382"
    reading: "The spodic B may start at any depth below an A or E (12.5 cm only without them); 'extremely hard' counts as hard for the massive and hard mollic A; the spodic index of accumulation is summed over every subhorizon of the profile that meets items 3a and 3b; 'moderately cemented' suffices for the petro horizons (Hugo, 2026-11-09)."
  - topic: "Dry chroma of the albic E not recorded"
    edition: [1988]
    page: "p. 33"
    version: "0.9.382"
    reading: "With the dry value taken as the moist value + 1, a dry chroma not recorded is the moist chroma, flagged dry_chroma_from_moist, so that the chroma rule ('either dry or moist') is decided by the moist chroma alone (Hugo, 2026-11-09)."

  # --- 0.9.383 (the diagnostic properties of 1988, R/diagnostics-fao88-properties.R) --------
  # Hugo's decisions of 2026-11-08 that this part applies.
  - topic: "Gleyic and stagnic properties"
    edition: [1988]
    page: "pp. 36-37"
    version: "0.9.383"
    reading: "Without a recorded reduction test (rH, ferricyanide, dipyridyl) the colour pattern counts as evidence of reduction, flagged reduction_from_colour_pattern; gleyic = two of the three signs (reduction, groundwater, gley colours in more than 95 % of the matrix); stagnic within 50 cm = reduction with the mottling pattern of item 3b (mottled) or 3c (not mottled); item 3d, the chroma increasing with depth, is reported as support, not required (Q21) (Hugo, 2026-11-08)."
  - topic: "'Many' coarse mottles of the ferric properties"
    edition: [1988]
    page: "p. 35"
    version: "0.9.383"
    reading: "redoximorphic_features_pct of 15 or more and mottle_size_class coarse (more than 20 mm), with a mottle colour of hue redder than 7.5YR or chroma above 5 (Q22) (Hugo, 2026-11-08)."
  - topic: "Defaults applied to the properties"
    edition: [1988]
    page: "pp. 34-41"
    version: "0.9.383"
    reading: "The abrupt textural change over less than 5 cm is a boundary recorded abrupt or clear, gradual and diffuse fail, and its two items are either-or by the clay of the upper layer (default 5); fluvic properties: the organic carbon and stratification criteria decide, the fluviatile, marine or lacustrine origin read where recorded (6); nitic properties: 30 % clay and the structure decide, oxalate and DCB iron read only where measured (7); vertic properties: clayey is 30 % clay or more (8); the geric 'plus' read (20); windows and depths as default 11 (Hugo, 2026-11-08)."

  # soilKey's readings of this part, for Hugo's word.
  - topic: "Boundary distinctness not recorded (abrupt textural change)"
    edition: [1988]
    page: "p. 34"
    version: "0.9.383"
    reading: "A clay jump that meets the numbers with no boundary distinctness recorded leaves the abrupt textural change undecided (plan D14 a), where item 6 of the argic B reads an unrecorded boundary as not abrupt (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "Calcareous from the effervescence class"
    edition: [1988]
    page: "p. 35"
    version: "0.9.383"
    reading: "soilKey's effervescence_class is read for the 10 % HCl of the text, flagged; strong or very strong in most of the fine earth passes. Without caco3_pct, the class is read by the calcareousness classes of the 1990 Guidelines (none or slight 0-2 %: not calcareous; moderate 2-10 % or stronger: calcareous), flagged cce_from_effervescence_class; an extent recorded as local does not count (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "Fluvic properties: irregular decrease and thin sand strata"
    edition: [1988]
    page: "p. 35"
    version: "0.9.383"
    reading: "Organic carbon decreasing irregularly with depth is any increase from one layer to the next deeper one within 125 cm (argument oc_increase_min = 0). A thin stratum of sand is a sand or loamy sand layer of any thickness; it is exempt from the 0.20 % when a finer layer below it within 125 cm, not a buried A, has more. A recorded parent material naming rock, residuum, loess, till or colluvium is not a fluvic sediment; a floodplain, levee, delta, tidal or backswamp landform names one (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "Groundwater with its capillary fringe at the surface"
    edition: [1988]
    page: "p. 36 item 2b"
    version: "0.9.383"
    reading: "A water table recorded at or above the surface, flooded, or not perched within 100 cm (soilKey's number) of the surface; perched, none observed or deeper is not the sign; not recorded, absent, flagged. The dye test is not recorded (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "Reduction from colour"
    edition: [1988]
    page: "pp. 36-37"
    version: "0.9.383"
    reading: "The colour pattern read as reduction (Q21) is a matrix of moist value 4 or more with chroma 2 or less or a hue N, GY, BG, G or B, or a reduced matrix recorded; the value of 4 keeps dark humus-stained A horizons out. The same gley matrix can give sign a (by colour) and sign c of the gleyic properties, so a gley matrix with no test recorded passes, flagged. The tests recorded decide: one negative test with no other is no reduction (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "The andic mantle of p. 42"
    edition: [1988]
    page: "p. 42"
    version: "0.9.383"
    reading: "A mantle of new material 35 to 50 cm thick over buried horizons has andic properties when every layer of it has them (three-valued); its burial of the horizons below is now read for every 1988 diagnostic (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "Nitic structure not recorded"
    edition: [1988]
    page: "p. 38"
    version: "0.9.383"
    reading: "An angular blocky structure, moderate or strong, with no second-level structure recorded leaves the nitic properties undecided, as soilKey's WRB nitic horizon reads it; a polyhedral or nutty structure_type is the flat-edged element itself. A structure, grade or shiny faces (clay films or pressure faces, few or more) not recorded are absent (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "Depths of the properties"
    edition: [1988]
    page: "p. 42"
    version: "0.9.383"
    reading: "A property with no depth in the key is read in the layers starting within 125 cm, as the horizons of 0.9.382 are, without asking the description to reach 125 cm; a depth printed in a definition (salic 30 cm, stagnic 50 cm, fluvic 125 cm, strongly humic 100 cm, calcaric 20-50 cm) or passed by the key is read by the rule of 2026-11-09 (it fails only when the description reaches below it). Permafrost is a field observation: absent unless recorded, never undecided because the description stops above 200 cm, flagged (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "Sulfidic materials"
    edition: [1988]
    page: "p. 40"
    version: "0.9.383"
    reading: "The waterlogged state of the definition is reported (the site's drainage), not tested; the pH, whose ratio is not printed, is ph_h2o, else ph_h2o_1to1; without s_total_pct, sulfidic_s_pct plus sulfate_s_pct is a lower bound that can only make it pass (soilKey's reading, for Hugo to confirm, 2026-11-09)."
  - topic: "Other readings of the properties"
    edition: [1988]
    page: "pp. 35-41"
    version: "0.9.383"
    reading: "Stagnic: mottles recorded without colours are taken as of higher chroma, flagged; ped-surface colours not recorded are absent. Ferric: mottles recorded without their amount, size or colour leave the mottle path undecided; the enriched exteriors of nodules are taken as met. Ferralic properties: the horizon right below the A is the first layer after the run of A layers. Soft powdery lime: soft concretions or powdery forms named without an amount leave it undecided. Tonguing: read on the receiving layer, else on the layer above, flagged; the upper part of the argic B is its first layer, under an albic E. Plinthite: a v suffix is plinthite of unknown amount, flagged. Permafrost: a suffix f or ice recorded, flagged. Andic item 2: volcaniclastic material not recorded is absent (soilKey's reading, for Hugo to confirm, 2026-11-09)."
