    p2o5_citric_lt_ppm: 250
  umbric_a:
    page: 24
    bs_lt_pct: 50
    note: "as the mollic A otherwise; the massive-and-hard restriction only where the horizon dries; plaggen A horizons excluded"
  ochric_a:
    page: 25
    grades_window_cm: 40
    very_weak_om_lt_pct_at_sand_clay_1: 1
    very_weak_om_lt_pct_at_sand_clay_13: 0.5
    sand_clay_ratio_low: 1
    sand_clay_ratio_high: 13
    shallow_pan_window_cm: [18, 40]
    shallow_surface_cm: 18
    shallow_very_weak_om_lt_pct: [1.2, 0.6]
  argillic_b:
    page: "25-26"
    thickness_fraction_of_overlying_min: 0.1
    thickness_gt_cm_thick_profile: 15
    thick_profile_gt_cm: 150
    thickness_min_cm_sandy: 15
    thickness_min_cm_loamy_clayey: 7.5
