    lamellae_combined_min_cm: 15
    distance_cm: 30
    clay_increase:
      breaks_pct: [15, 40]
      steps: [3, 1.2, 8]
      source: "item 2; printed '< 15', 'more than 15 and less than 40', 'more than 40': the exact 15 and 40 read by soilKey's usda convention (default 12)"
    oriented_clay_min_pct: 1
    fine_clay_ratio_greater_by: "1/3"
    fine_clay_more_points: 8
    kaolinitic_surface_clay_gt_pct: 40
  natric_b:
    page: 26
    tongues_gt_cm: 2.5
    esp_gt_pct: 15
    upper_part_cm: 40
    esp_somewhere_within_cm: 200
  cambic_b:
    page: 26
    texture: "very fine sand, loamy very fine sand or finer"
    rock_structure_absent_min_fraction: 0.5
    cec_clay_gt: 16
    weatherable_minerals_gt_pct: 3
    muscovite_gt_pct: 6
    base_min_cm: 25
    reduction_chroma_mottled_max: 2
    reduction_chroma_unmottled_lt_at_value_lt_4: 1
    reduction_chroma_unmottled_max_at_value_4: 1
    reduction_hue_no_bluer_than: "10Y"
  spodic_b:
    page: 26
    below_cm: 12.5
    cemented_gt_cm: 2.5
    extractable_fe_line_pct: 0.1
    pyro_fe_al_over_clay_min: 0.2
    pyro_over_dithionite_min: 0.5
    index_min: 65
  oxic_b:
    page: 27
    thickness_min_cm: 30
    nh4cl_retention_max_per_100g_clay: 10
    ecec_lt_per_100g_clay: 10
    cec_nh4oac_max_per_100g_clay: 16
    clay_gt_pct: 15
    texture: "sandy loam or finer"
    rock_structure_lt_pct: 5
    primary_minerals_traces_max_pct: {value: 3, source: "soilKey: 'no more than traces' read as the cambic B's line of significant amounts, 3 % weatherable minerals (74 p. 26), flagged (0.9.387 reading)"}
  calcic:
    page: 27
    thickness_min_cm: 15
    cce_min_pct: 15
    cce_more_than_c_min_pct: 5
    very_calcareous_below_min_pct: 40
  gypsic:
    page: 27
    thickness_gt_cm: 15
    gypsum_more_than_c_min_pct: 5
    thickness_x_pct_min: 150
    gypsum_me_weight: 0.086
  sulfuric:
    page: 27
    ph_1to1_lt: 3.5
    jarosite_hue_min: "2.5Y"
    jarosite_chroma_min: 6
    jarosite_required: {value: true, source: "'and jarosite mottles' (Q18)"}
    thickness_min_cm: {value: null, source: "none printed; none asked (0.9.387 reading; 1988 asks 15 cm)"}
  albic_e:
    page: 27
    value_moist_min: 4
    value_dry_min: 5
    chroma_max_at_value_dry_7_or_moist_6: 3
    chroma_max_at_value_dry_5_6_or_moist_4_5: {value: null, source: "no chroma limit printed at these values (plan section 12, item 26)"}
    red_parent_hue: "5YR"
    red_parent_chroma_moist_max: 3

