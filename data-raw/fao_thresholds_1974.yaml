key:
  page: "43-53"
  source: "the gate numbers of the 26 major soil groups (plan section 1.3); unit numbers follow with the units"
  O: {page: 43, h_min_cm: 40, h_min_cm_sphagnum: 60, cumulative_within_cm: 80, bulk_density_lt: 0.1}
  I: {page: 43, rock_within_cm: 10}
  V: {page: 43, mixed_cm: 20, clay_min_pct: 30, clay_depth_min_cm: 50, cracks_min_cm: 1, cracks_at_cm: 50, slickensides_window_cm: [25, 100]}
  G: {page: 44, hydromorphic_within_cm: 50}
  T: {page: 45, depth_min_cm: 35, bulk_density_lt_g_cm3: 0.85, vitric_min_pct: 60}
  Q: {page: "45-46", albic_material_min_cm: 50}
  U: {page: 46, umbric_max_cm: 25}
  E: {page: 46, cce_gt_pct: 40}
  W: {page: 48, slowly_permeable_within_cm: 125}
  M: {page: 48, chroma_moist_max: 2, chroma_depth_min_cm: 15}
  C: {page: 49, chroma_moist_max: 2, chroma_depth_min_cm: 15, depth_by_class_cm: {coarse: 125, medium: 90, fine: 75}}
  K: {page: 49, chroma_moist_gt: 2, chroma_depth_min_cm: 15, depth_by_class_cm: {coarse: 125, medium: 90, fine: 75}}
  D: {page: 50, nodule_diameter_cm: [2, 30], nodule_diameter_typical_cm: [2, 5], source: "nodules of 2 to 5 cm, up to 30 cm in diameter"}
  X: {page: 50, permafrost_not_within_cm: 200, depth_by_class_cm: {coarse: 125, medium: 90, fine: 75}, depth_page: "50, footnote 1"}
  Y: {page: 50, permafrost_not_within_cm: 200, depth_by_class_cm: {coarse: 125, medium: 90, fine: 75}, depth_page: "50, footnote 1"}
  N: {page: 51, clay_decrease_max_fraction: 0.2, depth_cm: 150, plinthite_not_within_cm: 125}
  A: {page: 51, bs_lt_pct: 50, within_cm: 125}
  B: {page: "52-53", umbric_gt_cm: 25}
