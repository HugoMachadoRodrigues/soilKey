  aridic_regime:
    page: 28
    source: "the Soil Taxonomy moisture control section rule; control section 10-30 / 20-60 / 30-90 cm by texture, soil temperature at 50 cm above 5 and 8 C, 90 and 60 days, mean annual below 22 C, seasonal difference 5 C"
  ferralic_properties:
    page: 28
