    calcic_intervening_within_cm: 75
    plinthite_continuous_phase_min_pct: {value: 50, source: "soilKey: a 'continuous phase' of plinthite read as half the volume (0.9.388 reading)"}
    oxic_plinthite_within_cm: 30
    oxic_mottles_within_cm: 50
  interfingering:
