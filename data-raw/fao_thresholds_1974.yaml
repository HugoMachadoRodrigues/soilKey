# The numbers of the FAO-Unesco Legend of 1974 that soilKey's FAO readers
# and diagnostics use, as printed, with the printed page. Source: FAO-Unesco
# (1974). Soil Map of the World 1:5 000 000, Volume I, Legend. Unesco, Paris
# (PDF page = printed + 7 up to p. 41; p. 42 is missing from the PDF, so from
# the key on PDF page = printed + 6). The criteria are paraphrased in
# soilKey's words; no text of the book is shipped. An entry whose source is
# "soilKey" is a number or a reading soilKey adds where the text gives none,
# with the decision that set it (data-raw/fao_readings.yaml). Organic matter
# (OM) and me per 100 g of clay are the units of this edition: soilKey reads
# OM as organic carbon x 1.724, flagged (Hugo's decision Q11), and me per
# 100 g as cmol(+)/kg (the same number).
#
# 0.9.381 holds this table in data-raw/; the registry part of the 1974 legend
# copies it to inst/rules/fao1974/thresholds.yaml. The defaults of the
# readers in R/fao-readers.R are these numbers (test-v09381-fao-readers.R).
edition: "FAO-Unesco Soil Map of the World 1:5 000 000, Vol. I Legend, Unesco Paris 1974"

general:
  page: 32
  buried_new_material_cm:        {value: 50, page: 32, source: "definitions of soil units: horizons buried by 50 cm or more of new material are not diagnostic"}
  units_upper_boundary_cm:       {value: 50, page: 32}
  mineral_soil_h_max_cm:         {value: 40, page: 32}
  mineral_soil_h_sphagnum_cm:    {value: 60, page: 32}
  mineral_soil_h_cumulative_cm:  {value: 80, page: 32}
  lithosols_rock_within_cm:      {value: 10, page: 32, source: "every definition but the Lithosols implies no continuous hard rock within 10 cm"}
  diagnostic_upper_limit_cm:     {value: 125, page: "43-53", source: "soilKey: the 1974 text has no general rule; 125 cm, the window of the whole key, where a depth is not written (Hugo's decision Q10)"}
  two_b_horizons_within_cm:      {value: 125, page: 32, source: "of two diagnostic B horizons within 125 cm the upper one decides, as printed (74 p. 32; 1988 p. 42)"}
  depth_datum: {value: "soil surface", page: "32, 43", source: "soilKey: the top of the first recorded horizon, H and O included (Q9)"}

units:
  om_from_oc_factor: {value: 1.724, page: "21, 24, 32", source: "soilKey: Van Bemmelen's factor of the US SCS methods the text cites (Q11)"}
  me_per_100g_is_cmol_per_kg: {value: 1, page: "-", source: "the same number"}
  methods: {value: "US SCS 1967", page: "24, 32"}
  cec_method: {value: "NH4OAc pH 7", page: "24, 26-27", source: "the ferralic and ferric properties and the Acric Ferralsols read NH4Cl (pp. 28, 47): cec_cmol with cec_method nh4cl, else ecec_cmol, flagged (Q12)"}
  ecec_oxic: {value: "NH4OAc bases + 1 N KCl aluminium", page: 27}

master_horizons:
  page: 21
  h_om_min_pct_at_clay_gt_60: 30
  h_om_min_pct_at_clay_0: 20
  h_clay_line_pct: 60
  o_om_min_pct: 35

texture_classes:
  page: 5
  source: "the class of the upper 30 cm (Q10: also the class of the 125 / 90 / 75 cm rule)"
  coarse:  {clay_lt: 18, sand_gt: 65}
  medium:  {clay_lt: 35, sand_lt: 65, sand_max_with_clay_18: 82}
  fine:    {clay_gt: 35}
  upper_cm: {value: 30, page: 5}
  unassigned: {value: "clay exactly 35 %; sand exactly 65 % with clay < 18 %", source: "soilKey reads both as medium (readings; plan section 12, item 25)"}
  depth_by_class_cm: {value: {coarse: 125, medium: 90, fine: 75}, page: "29, 49-53"}

slope_classes:
  page: 5
  a: {min_pct: 0, max_pct: 8}
  b: {min_pct: 8, max_pct: 30}
  c: {min_pct: 30}

horizons:
  histic_h:
    page: 24
    thickness_gt_cm: 20
    thickness_lt_cm: 40
    thickness_lt_cm_sphagnum_or_light: 60
    sphagnum_min_pct_vol: 75
    bulk_density_lt: 0.1
    thin_surface_lt_cm: 25
    mixed_depth_cm: 25
    om_min_pct_at_clay_gt_60: 28
    om_min_pct_at_clay_0: 14
    clay_line_pct: 60
    plough_layer_min_cm: 25
    eutric_ph_1to5_min: 5.5
    eutric_throughout: true
  mollic_a:
    page: 24
    mixed_depth_cm: 18
    prism_massive_gt_cm: 30
    chroma_moist_lt: 3.5
    value_moist_lt: 3.5
    value_dry_lt: 5.5
    contrast_value_units_min: 1
    lime_waiver_gt_pct: 40
    lime_waiver_value_moist_max: 5
    bs_min_pct: 50
    om_min_pct: 1
    om_min_pct_lime_waiver: 4
